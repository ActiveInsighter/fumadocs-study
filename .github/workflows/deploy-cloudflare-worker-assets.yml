name: Deploy Fumadocs to Cloudflare

on:
  push:
    branches:
      - main
      - codex/algorithm-notes-0926
  workflow_dispatch:
    inputs:
      probe_edit:
        description: Temporarily change one document to verify freshness with warm caches (deploy must be false)
        required: false
        default: false
        type: boolean
      shards:
        description: Number of parallel static export runners (compare 4 and 8)
        required: true
        default: '8'
        type: choice
        options: ['4', '8']
      deploy:
        description: Deploy the validated static package to Cloudflare Workers Static Assets
        required: true
        default: true
        type: boolean

concurrency:
  group: fumadocs-cloudflare-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate static deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Apply temporary content freshness probe
        if: ${{ inputs.probe_edit }}
        env:
          REQUEST_DEPLOY: ${{ inputs.deploy }}
        run: |
          test "${REQUEST_DEPLOY}" != 'true'
          printf '\nBUILD_SPEED_FRESHNESS_PROBE_20261002\n' >> content/docs/politics/index.md
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}
      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}
      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Refresh Fumadocs generated source
        run: npm run postinstall
      - name: Check Markdown strong boundaries
        shell: bash
        run: node scripts/normalize-strong-boundaries.mjs --check

      - name: Validate themed SVG XML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          courses = ('computer-network', 'computer-organization', 'operating-system')
          files = sorted(
              path
              for course in courses
              for path in (Path('public/images') / course).rglob('*.svg')
          )
          errors = []
          for path in files:
              try:
                  ET.parse(path)
              except ET.ParseError as error:
                  errors.append(f'{path}: {error}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Validated XML structure of {len(files)} SVG assets.')
          PY

      - name: Run static deployment tests
        shell: bash
        run: npm test -- tests/static-docs-build.test.ts tests/cloudflare-static-assets.test.ts tests/remark-strong-boundary.test.ts tests/normalize-strong-boundaries.test.ts tests/inline-svg.test.tsx tests/svg-style.test.ts tests/search-determinism.test.ts tests/static-doc-shards.test.ts tests/static-build-id.test.ts tests/static-asset-references.test.ts


  search:
    name: Build static search
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Apply temporary content freshness probe
        if: ${{ inputs.probe_edit }}
        env:
          REQUEST_DEPLOY: ${{ inputs.deploy }}
        run: |
          test "${REQUEST_DEPLOY}" != 'true'
          printf '\nBUILD_SPEED_FRESHNESS_PROBE_20261002\n' >> content/docs/politics/index.md
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}
      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}
      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Refresh Fumadocs generated source
        run: npm run postinstall
      - name: Build deterministic search assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/static-search-output
          mkdir -p /tmp/static-search-output
          /usr/bin/time -v node scripts/build-search-index.mjs /tmp/static-search-output/search-index.json
          test -s /tmp/static-search-output/search-index.json
          test -d /tmp/static-search-output/search
          search_files="$(find /tmp/static-search-output -type f | wc -l | tr -d ' ')"
          search_bytes="$(du -sb /tmp/static-search-output | awk '{print $1}')"
          echo "search_files=${search_files} search_bytes=${search_bytes}"
          SEARCH_ROOT=/tmp/static-search-output node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const root = process.env.SEARCH_ROOT;
          const manifest = JSON.parse(readFileSync(path.join(root, 'search-index.json'), 'utf8'));
          if (manifest.pages !== 780) {
            throw new Error(`Expected 780 searchable pages, received ${manifest.pages}.`);
          }
          if (!Array.isArray(manifest.categories) || manifest.categories.length < 5) {
            throw new Error('Search manifest is missing module categories.');
          }

          const checked = new Set(['search-index.json']);
          const resolveAsset = (url) => path.join(root, String(url).replace(/^\/+/, ''));

          for (const category of manifest.categories) {
            const routerUrl = category?.router?.url;
            if (!routerUrl || !existsSync(resolveAsset(routerUrl))) {
              throw new Error(`Missing search router for category ${category?.id ?? 'unknown'}.`);
            }
            checked.add(routerUrl);

            const router = JSON.parse(readFileSync(resolveAsset(routerUrl), 'utf8'));
            for (const shard of [...(router.core ?? []), ...(router.body ?? [])]) {
              if (!shard?.url || !existsSync(resolveAsset(shard.url))) {
                throw new Error(`Missing search shard ${shard?.url ?? 'unknown'}.`);
              }
              checked.add(shard.url);
            }
          }

          console.log(
            `validated_search_assets=${checked.size} categories=${manifest.categories.length} pages=${manifest.pages}`,
          );
          NODE
      - name: Upload search assets
        uses: actions/upload-artifact@v4
        with:
          name: static-search
          path: /tmp/static-search-output
          compression-level: 0
          retention-days: 1

  build-shard:
    name: Weighted static shard ${{ matrix.shard }} of ${{ inputs.shards || '8' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '4' && '[0,1,2,3]' || '[0,1,2,3,4,5,6,7]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STATIC_DOCS_SHARD_COUNT: ${{ inputs.shards || '8' }}
      STATIC_DOCS_SHARD_INDEX: ${{ matrix.shard }}
      STATIC_DOCS_SKIP_SEARCH_BUILD: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Apply temporary content freshness probe
        if: ${{ inputs.probe_edit }}
        env:
          REQUEST_DEPLOY: ${{ inputs.deploy }}
        run: |
          test "${REQUEST_DEPLOY}" != 'true'
          printf '\nBUILD_SPEED_FRESHNESS_PROBE_20261002\n' >> content/docs/politics/index.md
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}
      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}
      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Refresh Fumadocs generated source
        run: npm run postinstall
      - name: Restore weighted Next/Turbopack cache
        uses: actions/cache@v5
        with:
          path: .static-docs-stage/.next/cache
          key: ${{ runner.os }}-weighted-search-${{ inputs.shards || '8' }}-shard-${{ matrix.shard }}-v2-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json', 'app/**', 'components/**', 'lib/**', 'scripts/**', 'content/docs/**') }}
          restore-keys: |
            ${{ runner.os }}-weighted-search-${{ inputs.shards || '8' }}-shard-${{ matrix.shard }}-v2-
            ${{ runner.os }}-weighted-static-shard-${{ matrix.shard }}-v1-
            ${{ runner.os }}-static-shard-${{ matrix.shard }}-v4-
            ${{ runner.os }}-static-shard-${{ matrix.shard }}-v3-
            ${{ runner.os }}-static-shard-${{ matrix.shard }}-v2-
            ${{ runner.os }}-static-shard-${{ matrix.shard }}-v1-
      - name: Build weighted static shard
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v npm run build:static-docs
      - name: Validate shard output
        shell: bash
        run: |
          set -euo pipefail
          routes="$(find .static-docs/docs -type f -name index.html | wc -l | tr -d ' ')"
          markdown="$(find .static-docs/docs -type f -name '*.md' | wc -l | tr -d ' ')"
          files="$(find .static-docs -type f | wc -l | tr -d ' ')"
          bytes="$(du -sb .static-docs | awk '{print $1}')"
          echo "weighted_shard=${STATIC_DOCS_SHARD_INDEX}/${STATIC_DOCS_SHARD_COUNT} routes=${routes} files=${files} markdown=${markdown} bytes=${bytes}"
          if (( routes < 1 )); then
            echo "::error::Unexpected route count ${routes} for shard ${STATIC_DOCS_SHARD_INDEX}."
            exit 1
          fi
          test -d .static-docs/_next/static
          test ! -e .static-docs/search-index.json
          test ! -e .static-docs/search
          if [[ "${STATIC_DOCS_SHARD_INDEX}" == '0' ]]; then
            test "${markdown}" = '780'
          else
            test "${markdown}" = '0'
          fi
      - name: Prepare merge payload
        shell: bash
        run: |
          set -euo pipefail
          payload="/tmp/static-shard-${STATIC_DOCS_SHARD_INDEX}.tar.zst"
          manifest="/tmp/static-chunks-${STATIC_DOCS_SHARD_INDEX}.sha256"
          { find .static-docs/_next/static -type f -print0; printf '%s\0' .static-docs/docs/__next.docs.txt; } \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  .static-docs/#  #' > "${manifest}"
          if [[ "${STATIC_DOCS_SHARD_INDEX}" == '0' ]]; then
            tar --zstd -cf "${payload}" --exclude='.static-docs/img' --exclude='.static-docs/images' .static-docs
          else
            tar --zstd -cf "${payload}" \
              --exclude='.static-docs/docs/index.html' \
              --exclude='.static-docs/docs/__next.docs.txt' \
              --exclude='*.md' \
              .static-docs/docs \
              .static-docs/_next/static
          fi
          ls -lh "${payload}" "${manifest}"
      - name: Upload shard payload
        uses: actions/upload-artifact@v4
        with:
          name: static-shard-${{ matrix.shard }}
          path: |
            /tmp/static-shard-${{ matrix.shard }}.tar.zst
            /tmp/static-chunks-${{ matrix.shard }}.sha256
          compression-level: 0
          retention-days: 1

  deploy:
    name: Merge and deploy Worker Static Assets
    needs: [validate, search, build-shard]
    env:
      STATIC_DOCS_SHARD_COUNT: ${{ inputs.shards || '8' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Apply temporary content freshness probe
        if: ${{ inputs.probe_edit }}
        env:
          REQUEST_DEPLOY: ${{ inputs.deploy }}
        run: |
          test "${REQUEST_DEPLOY}" != 'true'
          printf '\nBUILD_SPEED_FRESHNESS_PROBE_20261002\n' >> content/docs/politics/index.md
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download shard payloads
        uses: actions/download-artifact@v4
        with:
          pattern: static-shard-*
          path: /tmp/static-shards
      - name: Download search assets
        uses: actions/download-artifact@v4
        with:
          name: static-search
          path: /tmp/static-search
      - name: Verify overlapping shared chunks are identical
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          roots = Path('/tmp/static-shards')
          seen = {}
          owners = {}
          conflicts = []
          all_paths = set()
          intersections = None
          for shard in range(int(os.environ['STATIC_DOCS_SHARD_COUNT'])):
              manifest = roots / f'static-shard-{shard}' / f'static-chunks-{shard}.sha256'
              current = set()
              for line in manifest.read_text().splitlines():
                  digest, rel = line.split('  ', 1)
                  current.add(rel)
                  all_paths.add(rel)
                  if rel in seen and seen[rel] != digest:
                      conflicts.append((rel, owners[rel], shard, seen[rel], digest))
                  else:
                      seen.setdefault(rel, digest)
                      owners.setdefault(rel, shard)
              intersections = current if intersections is None else intersections & current
          print(f'static_chunk_union={len(all_paths)} common_to_all={len(intersections or set())} variant_paths={len(all_paths - (intersections or set()))}')
          if conflicts:
              for rel, first, second, left, right in conflicts[:50]:
                  print(f'CONFLICT {rel}: shard {first}={left} shard {second}={right}')
              raise SystemExit('Two shards emitted different bytes at the same _next/static path.')
          PY
      - name: Merge static outputs with conflict checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .static-docs /tmp/shard-extract
          mkdir -p /tmp/shard-extract
          tar --zstd -xf /tmp/static-shards/static-shard-0/static-shard-0.tar.zst
          cp -a public/. .static-docs/
          for ((shard=1; shard<STATIC_DOCS_SHARD_COUNT; shard++)); do
            rm -rf /tmp/shard-extract/*
            tar --zstd -xf "/tmp/static-shards/static-shard-${shard}/static-shard-${shard}.tar.zst" -C /tmp/shard-extract
            SHARD_ROOT="/tmp/shard-extract/.static-docs" TARGET_ROOT="${PWD}/.static-docs" python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import shutil
          source = Path(os.environ['SHARD_ROOT'])
          target = Path(os.environ['TARGET_ROOT'])
          conflicts = []
          copied = 0
          identical = 0
          def digest(path: Path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.digest()
          for src in source.rglob('*'):
              if not src.is_file():
                  continue
              rel = src.relative_to(source)
              dst = target / rel
              if dst.exists():
                  if digest(src) != digest(dst):
                      conflicts.append(str(rel))
                  else:
                      identical += 1
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              copied += 1
          print(f'copied={copied} identical={identical} conflicts={len(conflicts)}')
          if conflicts:
              print('\n'.join(conflicts[:50]))
              raise SystemExit('Shard merge produced conflicting files.')
          PY
          done
      - name: Merge dedicated search assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .static-docs/search .static-docs/search-index.json
          test -s /tmp/static-search/search-index.json
          test -d /tmp/static-search/search
          cp -a /tmp/static-search/search-index.json .static-docs/search-index.json
          cp -a /tmp/static-search/search .static-docs/search
          search_files="$(find .static-docs/search -type f | wc -l | tr -d ' ')"
          echo "merged_search_files=${search_files}"
          SEARCH_ROOT="${PWD}/.static-docs" node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const root = process.env.SEARCH_ROOT;
          const manifest = JSON.parse(readFileSync(path.join(root, 'search-index.json'), 'utf8'));
          if (manifest.pages !== 780) {
            throw new Error(`Expected 780 searchable pages after merge, received ${manifest.pages}.`);
          }

          const resolveAsset = (url) => path.join(root, String(url).replace(/^\/+/, ''));
          for (const category of manifest.categories ?? []) {
            const routerUrl = category?.router?.url;
            if (!routerUrl || !existsSync(resolveAsset(routerUrl))) {
              throw new Error(`Merged search router missing for ${category?.id ?? 'unknown'}.`);
            }

            const router = JSON.parse(readFileSync(resolveAsset(routerUrl), 'utf8'));
            for (const shard of [...(router.core ?? []), ...(router.body ?? [])]) {
              if (!shard?.url || !existsSync(resolveAsset(shard.url))) {
                throw new Error(`Merged search shard missing: ${shard?.url ?? 'unknown'}.`);
              }
            }
          }
          NODE
      - name: Validate merged routes and asset references
        shell: bash
        run: |
          set -euo pipefail
          doc_routes="$(find .static-docs/docs -type f -name index.html | wc -l | tr -d ' ')"
          markdown="$(find .static-docs/docs -type f -name '*.md' | wc -l | tr -d ' ')"
          test "${doc_routes}" = '781'
          test "${markdown}" = '780'
          test -s .static-docs/search-index.json
          test -s .static-docs/docs/__next.docs.txt
          node scripts/verify-static-asset-references.mjs .static-docs
          echo "- Merged documentation routes: ${doc_routes}; Markdown downloads: ${markdown}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Verify changed content survives warm caches
        if: ${{ inputs.probe_edit }}
        run: |
          grep -Fq BUILD_SPEED_FRESHNESS_PROBE_20261002 .static-docs/docs/politics/index.html
          grep -Fq BUILD_SPEED_FRESHNESS_PROBE_20261002 .static-docs/docs/politics.md
          echo '- Warm-cache content freshness probe passed for HTML and Markdown' >> "${GITHUB_STEP_SUMMARY}"
      - name: Prepare Cloudflare Static Assets metadata
        shell: bash
        run: npm run prepare:cloudflare-assets

      - name: Validate Cloudflare asset package
        shell: bash
        run: |
          set -euo pipefail

          test -s .static-docs/index.html
          grep -Fq 'href="/docs/politics/"' .static-docs/index.html
          grep -Fq 'href="/blog/"' .static-docs/index.html
          test -s .static-docs/_redirects
          test -s .static-docs/_headers
          test -s .static-docs/.assetsignore
          test -s .static-docs/404.html
          grep -F '/docs/*/index.txt /docs/:splat/__next._full.txt 200' .static-docs/_redirects
          grep -F '/docs/*/__next.docs.txt /docs/__next.docs.txt 200' .static-docs/_redirects
          grep -Fx '/*.md' .static-docs/_headers
          grep -F 'Content-Type: text/markdown; charset=utf-8' .static-docs/_headers
          grep -Fx 'edgeone.json' .static-docs/.assetsignore

          file_count="$(find .static-docs -type f \
            ! -name 'edgeone.json' \
            ! -name '.assetsignore' \
            ! -name '_redirects' \
            ! -name '_headers' \
            | wc -l | tr -d ' ')"
          largest_bytes="$(find .static-docs -type f \
            ! -name 'edgeone.json' \
            ! -name '.assetsignore' \
            ! -name '_redirects' \
            ! -name '_headers' \
            -printf '%s\n' \
            | awk 'BEGIN { max = 0 } $1 > max { max = $1 } END { print max }')"

          if (( file_count > 20000 )); then
            echo "::error::Cloudflare Free Static Assets file limit exceeded: ${file_count}/20000."
            exit 1
          fi
          if (( largest_bytes > 25 * 1024 * 1024 )); then
            echo "::error::Cloudflare Static Assets 25 MiB single-file limit exceeded: ${largest_bytes} bytes."
            exit 1
          fi

          package_bytes="$(du -sb .static-docs | awk '{print $1}')"
          {
            echo '## Cloudflare Workers Static Assets validation'
            echo
            echo "- Uploadable asset files: ${file_count}/20000"
            echo "- Largest uploadable asset: $((largest_bytes / 1024 / 1024)) MiB / 25 MiB"
            echo "- Local static package: $((package_bytes / 1024 / 1024)) MiB"
            echo '- Root index.html: present'
            echo '- Worker JavaScript: none (assets-only deployment)'
            echo '- RSC dedupe aliases: served through Cloudflare 200 proxy rewrites'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate Wrangler configuration with a dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy != true }}
        shell: bash
        run: npx --yes wrangler@4.136.3 deploy --dry-run --config wrangler.jsonc --outdir .wrangler-dry-run

      - name: Check Cloudflare deployment credentials
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo '::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN.'
            exit 1
          }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || {
            echo '::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID.'
            exit 1
          }

      - name: Select Cloudflare Worker target
        id: worker
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == 'refs/heads/main' ]]; then
            worker_name='fumadocs-static-docs'
          else
            suffix="$(printf '%s' "${GITHUB_REF_NAME}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-|-$//g' \
              | cut -c1-30)"
            suffix="${suffix%-}"
            [[ -n "${suffix}" ]] || suffix='branch'
            worker_name="fumadocs-preview-${suffix}"
          fi
          echo "name=${worker_name}" >> "${GITHUB_OUTPUT}"
          echo "- Cloudflare Worker target: \`${worker_name}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy to Cloudflare Workers Static Assets
        id: cloudflare-deploy
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: deploy --config wrangler.jsonc --name ${{ steps.worker.outputs.name }}

      - name: Verify Cloudflare deployment
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOYMENT_URL:-}" ]] || {
            echo '::error::wrangler-action did not return a deployment URL.'
            exit 1
          }
          base_url="${DEPLOYMENT_URL%/}"

          wait_for_route() {
            local path="$1"
            local status=''
            for attempt in $(seq 1 18); do
              status="$(curl --silent --show-error --max-time 60 -L -o /dev/null -w '%{http_code}' "${base_url}${path}")"
              echo "${path} attempt ${attempt}/18 -> ${status}"
              if [[ "${status}" == '200' ]]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::Cloudflare route ${path} did not reach HTTP 200; last status ${status}."
            return 1
          }

          wait_for_route '/'

          homepage="$(curl --silent --show-error --max-time 60 -L "${base_url}/")"
          if ! grep -Fq 'href="/docs/politics/"' <<<"${homepage}" || ! grep -Fq 'href="/blog/"' <<<"${homepage}"; then
            echo '::error::Cloudflare root route did not render the expected study homepage links.'
            printf '%s' "${homepage}" | head -c 1200
            echo
            exit 1
          fi

          for path in \
            '/docs/' \
            '/search-index.json' \
            '/docs/math/knowledge/advanced-mathematics/01-limits-continuity/' \
            '/docs/math/knowledge/advanced-mathematics/01-limits-continuity.md' \
            '/docs/math/knowledge/advanced-mathematics/01-limits-continuity/index.txt' \
            '/docs/math/knowledge/advanced-mathematics/01-limits-continuity/__next.docs.txt' \
            '/docs/algorithm/' \
            '/docs/algorithm/08-binary-tree/28-bst-lca/'; do
            wait_for_route "${path}"
          done
          markdown_content_type="$(curl --silent --show-error --max-time 60 -I "${base_url}/docs/math/knowledge/advanced-mathematics/01-limits-continuity.md" \
            | tr -d '\r' \
            | awk 'BEGIN { IGNORECASE=1 } /^content-type:/ { sub(/^[^:]+:[[:space:]]*/, ""); print; exit }')"
          if [[ "${markdown_content_type,,}" != 'text/markdown; charset=utf-8' ]]; then
            echo "::error::Markdown Content-Type is not UTF-8: ${markdown_content_type:-<missing>}."
            exit 1
          fi
          echo "Markdown Content-Type verified as UTF-8: ${markdown_content_type}"
          echo "- Cloudflare deployment: ${DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify client navigation in Headless Chrome
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true) }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          [[ -n "${chrome_bin}" ]] || {
            echo '::error::No Chrome/Chromium executable is available on the runner.'
            exit 1
          }
          rm -rf /tmp/fumadocs-browser-check
          npm install --prefix /tmp/fumadocs-browser-check --no-audit --no-fund puppeteer-core@24.22.3
          CHROME_BIN="${chrome_bin}" NODE_PATH=/tmp/fumadocs-browser-check/node_modules node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async () => {
          const base = process.env.DEPLOYMENT_URL.replace(/\/$/, '');
          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          try {
            const page = await browser.newPage();
            const badText = 'This page could not be found.';
            page.on('response', (response) => {
              const url = response.url();
              if (response.status() >= 400 || url.includes('.txt') || url.includes('_rsc=')) {
                console.log('[browser-response]', response.status(), url);
              }
            });
            page.on('requestfailed', (request) => {
              console.log('[browser-request-failed]', request.url(), request.failure()?.errorText || 'unknown');
            });

            await page.goto(base + '/', { waitUntil: 'networkidle2', timeout: 120000 });
            const beforeText = await page.evaluate(() => document.body.innerText);
            console.log('[browser-check] homepage path=' + await page.evaluate(() => location.pathname));
            if (beforeText.includes(badText)) {
              console.log('[browser-check] homepage body=' + beforeText.slice(0, 800));
              throw new Error('Homepage visibly rendered the Next.js 404 page.');
            }

            async function clickFromHome(href) {
              await page.goto(base + '/', { waitUntil: 'networkidle2', timeout: 120000 });
              await page.click(`a[href="${href}"]`);
              await page.waitForFunction(
                (expected) => location.pathname === expected || document.body.innerText.includes('This page could not be found.'),
                { timeout: 120000 },
                href,
              );
              await new Promise((resolve) => setTimeout(resolve, 1200));
              const text = await page.evaluate(() => document.body.innerText);
              const path = await page.evaluate(() => location.pathname);
              console.log('[browser-check] click ' + href + ' -> ' + path);
              if (path !== href) throw new Error('Client navigation landed on unexpected path: ' + path + ' expected=' + href);
              if (text.includes(badText)) {
                console.log('[browser-check] visible body=' + text.slice(0, 800));
                throw new Error('Client navigation visibly rendered the Next.js 404 page for ' + href);
              }
            }

            for (const href of [
              '/docs/politics/',
              '/docs/english/',
              '/docs/math/',
              '/docs/408/',
              '/blog/',
            ]) {
              await clickFromHome(href);
            }

            await page.goto(base + '/docs/algorithm/', { waitUntil: 'networkidle2', timeout: 120000 });
            const deepHref = await page.evaluate(() => {
              const links = Array.from(document.querySelectorAll('a[href]'))
                .map((element) => element.getAttribute('href'))
                .filter((href) => href && href.startsWith('/docs/algorithm/') && href !== '/docs/algorithm/');
              return links.find((href) => href.endsWith('/')) ?? links[0] ?? null;
            });
            if (!deepHref) {
              throw new Error('Algorithm index exposes no internal document link to verify.');
            }
            await page.click(`a[href="${deepHref}"]`);
            await page.waitForFunction(
              (expected) =>
                location.pathname === expected ||
                location.pathname === expected.replace(/\/$/, '') ||
                document.body.innerText.includes('This page could not be found.'),
              { timeout: 120000 },
              deepHref,
            );
            await new Promise((resolve) => setTimeout(resolve, 1200));
            const deepText = await page.evaluate(() => document.body.innerText);
            const deepPath = await page.evaluate(() => location.pathname);
            console.log('[browser-check] deep click ' + deepHref + ' -> ' + deepPath);
            const normalizedDeepPath = deepPath.replace(/\/$/, '');
            const normalizedDeepHref = deepHref.replace(/\/$/, '');
            if (normalizedDeepPath !== normalizedDeepHref || deepText.includes(badText)) {
              throw new Error('Deep Fumadocs client navigation failed: ' + deepPath + ' expected=' + deepHref);
            }
            console.log('[browser-check] all homepage module links, blog index, and real deep Fumadocs navigation passed');

            const codeTabsPath =
              '/docs/algorithm/04-hash-table/05-%E5%BF%AB%E4%B9%90%E6%95%B0/';
            await page.goto(base + codeTabsPath, {
              waitUntil: 'networkidle2',
              timeout: 120000,
            });
            const languageTabs = await page.evaluate(() =>
              Array.from(document.querySelectorAll('[role="tab"]'))
                .map((element) => element.textContent?.trim())
                .filter(Boolean),
            );
            console.log('[browser-check] code tabs=' + languageTabs.join(', '));
            for (const language of ['C++', 'Java', 'Python', 'Go', 'JavaScript']) {
              if (!languageTabs.includes(language)) {
                throw new Error(
                  'Missing Fumadocs code tab "' + language + '" on ' + codeTabsPath,
                );
              }
            }

            const clickedJava = await page.evaluate(() => {
              const target = Array.from(document.querySelectorAll('[role="tab"]')).find(
                (element) => element.textContent?.trim() === 'Java',
              );
              if (!(target instanceof HTMLElement)) return false;
              target.click();
              return true;
            });
            if (!clickedJava) {
              throw new Error('Could not click Java Fumadocs code tab.');
            }
            await page.waitForFunction(
              () =>
                Array.from(document.querySelectorAll('[role="tab"]')).some(
                  (element) =>
                    element.textContent?.trim() === 'Java' &&
                    element.getAttribute('aria-selected') === 'true',
                ),
              { timeout: 30000 },
            );
            console.log('[browser-check] Fumadocs multilingual code tabs rendered and switched to Java');

            const formattingPath =
              '/docs/408/knowledge2/operating_system/05-io-management/02-buffer-allocation-spooling/';
            await page.goto(base + formattingPath, {
              waitUntil: 'networkidle2',
              timeout: 120000,
            });

            const formattingCheck = await page.evaluate(() => {
              const body = document.querySelector('#docs-body');
              if (!(body instanceof HTMLElement)) {
                return { error: 'Missing #docs-body' };
              }

              const expectedStrong = [
                '缓冲区（Buffer）',
                '磁盘高速缓存（Disk Cache）',
                '循环缓冲（Circular Buffer）',
                '缓冲池（Buffer Pool）',
                'DCT（Device Control Table，设备控制表）',
                'SPOOLing（Simultaneous Peripheral Operations On-Line）',
              ];
              const strongTexts = Array.from(body.querySelectorAll('strong')).map(
                (element) => element.textContent?.trim() ?? '',
              );
              const missingStrong = expectedStrong.filter(
                (text) => !strongTexts.includes(text),
              );
              const leakedMarkers = body.innerText.match(/\*\*[^*\n]+\*\*/g) ?? [];

              const table = body.querySelector('table');
              const wrapper = table?.parentElement;
              const head = table?.querySelector('th');
              if (!(table instanceof HTMLTableElement) ||
                  !(wrapper instanceof HTMLElement) ||
                  !(head instanceof HTMLTableCellElement)) {
                return {
                  error: 'Missing Markdown table, wrapper, or table header',
                  missingStrong,
                  leakedMarkers,
                };
              }

              const tableFontSize = getComputedStyle(table).fontSize;
              const originalHead = head.textContent ?? '';
              head.textContent = '超宽表头内容'.repeat(80);
              const headWhiteSpace = getComputedStyle(head).whiteSpace;
              const headerForcesOverflow = wrapper.scrollWidth > wrapper.clientWidth;
              head.textContent = originalHead;

              return {
                missingStrong,
                leakedMarkers,
                tableFontSize,
                headWhiteSpace,
                headerForcesOverflow,
              };
            });
            console.log('[browser-check] formatting=' + JSON.stringify(formattingCheck));
            if (formattingCheck.error) {
              throw new Error(formattingCheck.error);
            }
            if (formattingCheck.missingStrong.length > 0) {
              throw new Error(
                'Missing rendered strong terms: ' + formattingCheck.missingStrong.join(', '),
              );
            }
            if (formattingCheck.leakedMarkers.length > 0) {
              throw new Error(
                'Raw Markdown strong markers leaked into the rendered page: ' +
                  formattingCheck.leakedMarkers.join(' | '),
              );
            }
            if (formattingCheck.tableFontSize !== '17px') {
              throw new Error(
                'Expected docs table font-size 17px, got ' + formattingCheck.tableFontSize,
              );
            }
            if (formattingCheck.headWhiteSpace !== 'nowrap') {
              throw new Error(
                'Expected table header white-space nowrap, got ' + formattingCheck.headWhiteSpace,
              );
            }
            if (!formattingCheck.headerForcesOverflow) {
              throw new Error('Long table header content did not activate horizontal overflow.');
            }
            console.log('[browser-check] bold boundaries and table overflow typography passed');

            // Verify the content-addressed ZBSearch files through the actual UI.
            await page.keyboard.down('Control');
            await page.keyboard.press('k');
            await page.keyboard.up('Control');
            await page.waitForSelector('[role="dialog"] input', { timeout: 30000 });
            await page.type('[role="dialog"] input', '二叉树');
            await page.waitForFunction(
              () => document.querySelector('[role="dialog"] button[aria-selected="true"]') !== null,
              { timeout: 60000 },
            );
            await page.keyboard.press('Enter');
            await page.waitForFunction(
              () => location.pathname.startsWith('/docs/') && !document.querySelector('[role="dialog"] input'),
              { timeout: 60000 },
            );
            console.log('[browser-check] static ZBSearch selected result -> ' + await page.evaluate(() => location.pathname));
          } finally {
            await browser.close();
          }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
