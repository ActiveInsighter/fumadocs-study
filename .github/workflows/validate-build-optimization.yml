name: Validate build optimization
on:
  push:
    branches: ['codex/build-speed-research-1002']
    paths: ['scripts/**', 'lib/**', 'app/**', 'source.config.ts', 'tests/**', '.github/workflows/validate-build-optimization.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@v5
        id: modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run postinstall
      - run: npm test -- tests/knowledge2-navigation.test.ts tests/knowledge2-layout.test.ts tests/search-determinism.test.ts tests/static-doc-shards.test.ts tests/static-build-id.test.ts tests/static-asset-references.test.ts tests/static-docs-build.test.ts tests/cloudflare-static-assets.test.ts tests/remark-strong-boundary.test.ts tests/normalize-strong-boundaries.test.ts tests/inline-svg.test.tsx tests/svg-style.test.ts
