name: Validate build optimization
on:
  push:
    branches: ['codex/build-speed-research-1002']
    paths: ['scripts/**', 'lib/**', 'app/**', 'source.config.ts', 'tests/**', '.github/workflows/validate-build-optimization.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/cache@v5
        id: modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - run: npm run postinstall
      - run: npm test
