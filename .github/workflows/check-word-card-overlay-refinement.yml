name: Check word card overlay refinement

on:
  push:
    branches:
      - codex/refine-word-card-overlay
    paths:
      - 'components/vocabulary/word-cards.tsx'
      - 'styles/word-card-interactions.css'
      - 'styles/word-cards.css'
      - 'tests/word-cards.test.tsx'
      - '.github/workflows/check-word-card-overlay-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, typecheck and build overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore dependencies
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore npm cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Refresh generated source
        run: npm run postinstall

      - name: Run word-card tests
        run: npm test -- tests/word-cards.test.tsx

      - name: Typecheck word-card component
        run: >-
          npx tsc --ignoreConfig --noEmit --skipLibCheck
          --jsx react-jsx
          --module preserve
          --moduleResolution bundler
          --target es2022
          --lib dom,dom.iterable,es2022
          components/vocabulary/word-cards.tsx

      - name: Build static documentation package
        run: npm run build:static-docs
