name: Deploy chart system Cloudflare preview

on:
  push:
    branches:
      - codex/chart-system-refactor
    paths:
      - 'components/**'
      - 'content/docs/**'
      - 'tests/**'
      - '.github/workflows/preview-chart-system.yml'

concurrency:
  group: fumadocs-chart-cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Deploy isolated Cloudflare preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore project dependency tree
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore npm download cache on dependency miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}

      - name: Install project dependencies on cache miss
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Refresh Fumadocs generated source
        run: npm run postinstall

      - name: Run chart and static deployment tests
        run: npm test -- tests/study-charts.test.ts tests/claude-benchmarks.test.ts tests/static-docs-build.test.ts tests/cloudflare-static-assets.test.ts

      - name: Restore Next/Turbopack build cache
        uses: actions/cache@v5
        with:
          path: .static-docs-stage/.next/cache
          key: ${{ runner.os }}-chart-preview-cloudflare-v1-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-chart-preview-cloudflare-v1-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-cloudflare-static-docs-turbopack-v1-${{ hashFiles('package-lock.json', 'next.config.static.mjs', 'source.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-static-docs-turbopack-v4-

      - name: Build Cloudflare static package
        run: npm run build:cloudflare-assets

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy isolated Cloudflare Preview Worker
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: deploy --config wrangler.jsonc --name fumadocs-static-docs-chart-preview

      - name: Verify chart preview routes
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOYMENT_URL:-}" ]] || { echo '::error::No Cloudflare deployment URL returned.'; exit 1; }
          base_url="${DEPLOYMENT_URL%/}"

          wait_for_route() {
            local path="$1"
            local status=''
            for attempt in $(seq 1 18); do
              status="$(curl --silent --show-error --max-time 60 -L -o /dev/null -w '%{http_code}' "${base_url}${path}")"
              echo "${path} attempt ${attempt}/18 -> ${status}"
              [[ "${status}" == '200' ]] && return 0
              sleep 5
            done
            echo "::error::Cloudflare preview route ${path} did not reach HTTP 200; last status ${status}."
            return 1
          }

          wait_for_route '/docs/english/chart-components/'
          wait_for_route '/docs/english/claude-benchmarks/'
          echo "## Cloudflare chart preview" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "- Preview Worker: \`fumadocs-static-docs-chart-preview\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Preview URL: ${DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Production Worker \`fumadocs-static-docs\` was not modified." >> "${GITHUB_STEP_SUMMARY}"
