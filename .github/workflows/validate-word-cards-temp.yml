name: Validate word cards temp

on:
  push:
    branches:
      - codex/word-cards-mdx

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- tests/word-cards.test.tsx
      - run: npm run search:build
      - run: npm run build
