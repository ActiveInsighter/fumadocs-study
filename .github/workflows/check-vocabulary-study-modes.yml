name: Check vocabulary study modes

on:
  push:
    branches:
      - codex/vocabulary-study-modes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test and build vocabulary study modes
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore dependencies
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v1-${{ hashFiles('package-lock.json') }}

      - name: Restore npm cache
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-v1-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Refresh generated source
        run: npm run postinstall

      - name: Run vocabulary tests
        run: npm test -- tests/word-cards.test.tsx tests/word-card-study-modes.test.tsx tests/vocabulary-responsive-layout.test.ts

      - name: Check vocabulary component TypeScript
        run: npx tsc --noEmit --jsx preserve --module nodenext --moduleResolution nodenext --target es2022 --lib dom,dom.iterable,es2022 --allowSyntheticDefaultImports --esModuleInterop --skipLibCheck --strict components/vocabulary/word-cards.tsx

      - name: Build static documentation package
        run: npm run build:static-docs
