name: Normalize strong boundaries once\n\non:\n  push:\n    branches:\n      - codex/fix-markdown-bold-table-0926\n\npermissions:\n  contents: write\n\njobs:\n  normalize:\n    if: ${{ !contains(github.event.head_commit.message, '[strong-boundary-normalized]') }}\n    runs-on: ubuntu-24.04\n    steps:\n      - uses: actions/checkout@v6\n        with:\n          ref: codex/fix-markdown-bold-table-0926\n      - uses: actions/setup-node@v7\n        with:\n          node-version: 22\n      - name: Normalize Markdown strong boundaries\n        run: node scripts/normalize-strong-boundaries.mjs\n      - name: Commit normalized content\n        shell: bash\n        run: |\n          set -euo pipefail\n          if git diff --quiet; then\n            echo 'No normalization changes needed.'\n            exit 0\n          fi\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add content/docs content/blog\n          git commit -m 'docs: normalize strong emphasis boundaries [strong-boundary-normalized]'\n          git push origin HEAD:codex/fix-markdown-bold-table-0926\n