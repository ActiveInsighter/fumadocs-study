name: Normalize strong boundaries once

on:
  push:
    branches:
      - codex/fix-markdown-bold-table-0926

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[strong-boundary-normalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/fix-markdown-bold-table-0926
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Normalize Markdown strong boundaries
        run: node scripts/normalize-strong-boundaries.mjs
      - name: Commit normalized content
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No normalization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/docs content/blog
          git commit -m 'docs: normalize strong emphasis boundaries [strong-boundary-normalized]'
          git push origin HEAD:codex/fix-markdown-bold-table-0926
