        - paragraph [ref=f6e196]: 例如，可以在完整提示词之后追加：
        - blockquote [ref=f6e197]:
          - paragraph [ref=f6e198]: 请生成一篇面向考研 408 的「进程与线程」学习文档，先解释资源分配与调度的区别，再生成一道单选判断题和一个三项复习清单。选错时解释误区，选对时给出理由。普通正文中也要保留答案和解析。使用目录中已有的组件，不要创造新组件。
        - paragraph [ref=f6e199]: 也可以要求 AI 改写上面的例子：
        - blockquote [ref=f6e200]:
          - paragraph [ref=f6e201]: 请把 Cache 例子改成 32 字节一块、16 行 Cache。保持 16 位字节地址，初始地址为 52；用两个预设按钮展示同一块和映射冲突。同步更新正文中的位数和校验算例。
        - paragraph [ref=f6e202]:
          - text: 支持的组件包括
          - code [ref=f6e203]: Stack
          - text: 、
