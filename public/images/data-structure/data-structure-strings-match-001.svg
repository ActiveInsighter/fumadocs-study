<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"><defs><style>.title{font:700 18px sans-serif;fill:#2c3e50}.label{font:700 14px sans-serif;fill:#34495e}.text{font:12px sans-serif;fill:#2c3e50}.char-box{stroke:#3498db;stroke-width:2;fill:#ecf0f1}.pattern-box{stroke:#e74c3c;stroke-width:2;fill:#fdf2f2}.match-box{stroke:#27ae60;stroke-width:3;fill:#e8f5e8}.arrow{stroke:#7f8c8d;stroke-width:2;fill:none;marker-end:url(#arrowhead)}.concept-bg{fill:#f8f9fa;stroke:#dee2e6;stroke-width:1;rx:8}</style><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#7f8c8d" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text class="title" text-anchor="middle" x="400" y="25">模式匹配算法核心概念</text><text class="label" x="50" y="70">主串 (Str):</text><text class="text" x="50" y="90">待搜索的完整字符串</text><g transform="translate(50, 105)"><rect class="char-box" height="25" width="25" x="0" y="0"></rect><text class="text" text-anchor="middle" x="12.5" y="17">A</text><text class="text" text-anchor="middle" x="12.5" y="40">0</text><rect class="char-box" height="25" width="25" x="25" y="0"></rect><text class="text" text-anchor="middle" x="37.5" y="17">B</text><text class="text" text-anchor="middle" x="37.5" y="40">1</text><rect class="char-box" height="25" width="25" x="50" y="0"></rect><text class="text" text-anchor="middle" x="62.5" y="17">A</text><text class="text" text-anchor="middle" x="62.5" y="40">2</text><rect class="char-box" height="25" width="25" x="75" y="0"></rect><text class="text" text-anchor="middle" x="87.5" y="17">B</text><text class="text" text-anchor="middle" x="87.5" y="40">3</text><rect class="char-box" height="25" width="25" x="100" y="0"></rect><text class="text" text-anchor="middle" x="112.5" y="17">C</text><text class="text" text-anchor="middle" x="112.5" y="40">4</text><rect class="char-box" height="25" width="25" x="125" y="0"></rect><text class="text" text-anchor="middle" x="137.5" y="17">A</text><text class="text" text-anchor="middle" x="137.5" y="40">5</text><rect class="char-box" height="25" width="25" x="150" y="0"></rect><text class="text" text-anchor="middle" x="162.5" y="17">B</text><text class="text" text-anchor="middle" x="162.5" y="40">6</text><rect class="char-box" height="25" width="25" x="175" y="0"></rect><text class="text" text-anchor="middle" x="187.5" y="17">D</text><text class="text" text-anchor="middle" x="187.5" y="40">7</text></g><text class="label" x="50" y="190">模式串 (Pattern):</text><text class="text" x="50" y="210">要在主串中查找的目标字符串</text><g transform="translate(50, 225)"><rect class="pattern-box" height="25" width="25" x="0" y="0"></rect><text class="text" text-anchor="middle" x="12.5" y="17">C</text><rect class="pattern-box" height="25" width="25" x="25" y="0"></rect><text class="text" text-anchor="middle" x="37.5" y="17">A</text><rect class="pattern-box" height="25" width="25" x="50" y="0"></rect><text class="text" text-anchor="middle" x="62.5" y="17">B</text></g><text class="label" x="50" y="295">匹配结果:</text><g transform="translate(50, 315)"><rect class="char-box" height="25" width="25" x="0" y="0"></rect><text class="text" text-anchor="middle" x="12.5" y="17">A</text><text class="text" text-anchor="middle" x="12.5" y="40">0</text><rect class="char-box" height="25" width="25" x="25" y="0"></rect><text class="text" text-anchor="middle" x="37.5" y="17">B</text><text class="text" text-anchor="middle" x="37.5" y="40">1</text><rect class="char-box" height="25" width="25" x="50" y="0"></rect><text class="text" text-anchor="middle" x="62.5" y="17">A</text><text class="text" text-anchor="middle" x="62.5" y="40">2</text><rect class="char-box" height="25" width="25" x="75" y="0"></rect><text class="text" text-anchor="middle" x="87.5" y="17">B</text><text class="text" text-anchor="middle" x="87.5" y="40">3</text><rect class="match-box" height="25" width="25" x="100" y="0"></rect><text class="text" text-anchor="middle" x="112.5" y="17">C</text><text class="text" text-anchor="middle" x="112.5" y="40">4</text><rect class="match-box" height="25" width="25" x="125" y="0"></rect><text class="text" text-anchor="middle" x="137.5" y="17">A</text><text class="text" text-anchor="middle" x="137.5" y="40">5</text><rect class="match-box" height="25" width="25" x="150" y="0"></rect><text class="text" text-anchor="middle" x="162.5" y="17">B</text><text class="text" text-anchor="middle" x="162.5" y="40">6</text><rect class="char-box" height="25" width="25" x="175" y="0"></rect><text class="text" text-anchor="middle" x="187.5" y="17">D</text><text class="text" text-anchor="middle" x="187.5" y="40">7</text></g><path class="arrow" d="M150 3e2V280"></path><text class="text" text-anchor="middle" x="150" y="270">匹配位置: 4</text><rect class="concept-bg" height="380" width="350" x="420" y="60"></rect><text class="label" x="440" y="85">核心概念:</text><text class="label" fill="#3498db" x="440" y="110">■ 主串 (Str)</text><text class="text" x="440" y="125">完整的待搜索字符串</text><text class="text" x="440" y="140">示例: "ABABCABD"</text><text class="label" fill="#2c3e50" x="440" y="165">■ 子串 (Substr)</text><text class="text" x="440" y="180">主串中的任意连续片段</text><text class="text" x="440" y="195">示例: "CAB" (位置4-6)</text><text class="label" fill="#e74c3c" x="440" y="220">■ 模式串 (Pattern)</text><text class="text" x="440" y="235">要查找的目标字符串</text><text class="text" x="440" y="250">示例: "CAB"</text><text class="label" x="440" y="280">匹配术语:</text><text class="label" fill="#27ae60" x="440" y="305">✓ 匹配</text><text class="text" x="440" y="320">找到与模式串完全相同的子串</text><text class="label" fill="#f39c12" x="440" y="345">⚡ 匹配位置</text><text class="text" x="440" y="360">模式串在主串中的起始索引</text><text class="text" x="440" y="375">本例中匹配位置为 4</text><text class="label" fill="#e67e22" x="440" y="400">✗ 失配</text><text class="text" x="440" y="415">当前比较的字符不相同</text><rect class="concept-bg" height="80" width="320" x="50" y="380"></rect><text class="label" x="60" y="400">算法目标:</text><text class="text" x="60" y="420">在主串中找到所有与模式串完全匹配的子串，</text><text class="text" x="60" y="435">并返回它们的起始位置。</text><text class="text" x="60" y="450">这就是模式匹配算法要解决的核心问题。</text></svg>