6" font-size="14" font-weight="bold" text-anchor="middle" x="168" y="269">3</text><text fill="#AAA" font-size="16" x="187" y="267">→</text><rect fill="#F5EEFF" height="28" rx="5" stroke="#9B59B6" stroke-width="1.5" width="32" x="196" y="250"></rect><text fill="#9B59B6" font-size="14" font-weight="bold" text-anchor="middle" x="212" y="269">4</text><text fill="#AAA" font-size="16" x="231" y="267">→</text><rect fill="#F5EEFF" height="28" rx="5" stroke="#9B59B6" stroke-width="1.5" width="32" x="240" y="250"></rect><text fill="#9B59B6" font-size="14" font-weight="bold" text-anchor="middle" x="256" y="269">5</text><text fill="#555" font-size="11" x="20" y="300">若最终 count &lt; n（顶点数），说明图中有环，无法完成拓扑排序</text><line stroke="#DDD" stroke-dasharray="5,4" stroke-width="1" x1="390" x2="390" y1="15" y2="330"></line><text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="575" y="20">欧拉路径 — 奇数度顶点判断</text><circle cx="450" cy="90" fill="#27AE60" r="20" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="450" y="95">A</text><circle cx="560" cy="60" fill="#27AE60" r="20" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="560" y="65">B</text><circle cx="660" cy="90" fill="#E74C3C" r="20" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="660" y="95">C</text><circle cx="610" cy="180" fill="#E74C3C" r="20" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="610" y="185">D</text><circle cx="500" cy="180" fill="#27AE60" r="20" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="500" y="185">E</text><line stroke="#999" stroke-width="1.5" x1="469" x2="541" y1="78" y2="67"></line><line stroke="#999" stroke-width="1.5" x1="579" x2="641" y1="73" y2="83"></line><line stroke="#999" stroke-width="1.5" x1="651" x2="626" y1="109" y2="162"></line><line stroke="#999" stroke-width="1.5" x1="591" x2="519" y1="190" y2="190"></line><line stroke="#999" stroke-width="1.5" x1="483" x2="455" y1="168" y2="108"></line><line stroke="#999" stroke-width="1.5" x1="468" x2="492" y1="98" y2="168"></line><line stroke="#999" stroke-width="1.5" x1="557" x2="517" y1="79" y2="166"></line><text fill="#27AE60" font-size="10" x="400" y="88">度=3</text><text fill="#27AE60" font-size="10" x="565" y="36">度=4</text><text fill="#E74C3C" font-size="10" x="678" y="78">度=3</text><text fill="#E74C3C" font-size="10" x="630" y="200">度=3</text><text fill="#27AE60" font-size="10" x="460" y="200">度=3</text><rect fill="#FAFAFA" height="105" rx="8" stroke="#DDD" stroke-width="1.5" width="330" x="410" y="220"></rect><text fill="#555" font-size="12" x="425" y="242">奇数度顶点：C、D（共 2 个）</text><text fill="#27AE60" font-size="12" font-weight="bold" x="425" y="262">→ 存在欧拉路径 ✓（从C到D或D到C）</text><line stroke="#EEE" stroke-width="1" x1="420" x2="735" y1="270" y2="270"></line><text fill="#888" font-size="11" x="425" y="286">奇数度=0 → 欧拉回路（任意起点）</text><text fill="#888" font-size="11" x="425" y="302">奇数度=2 → 欧拉路径（起/终为奇度点）</text><text fill="#E74C3C" font-size="11" x="425" y="318">奇数度=其他 → 不存在</text></svg>