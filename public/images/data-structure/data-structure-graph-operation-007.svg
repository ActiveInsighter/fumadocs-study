<svg height="817pt" viewBox="0 0 444 817" width="444pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><g class="graph" id="graph0" transform="scale(1 1) rotate(0) translate(4 813)"><title>KruskalAlgorithm</title><g class="node" id="node1"><title>start</title><ellipse cx="196.5" cy="-791" fill="#90ee90" rx="29.5" ry="18" stroke="#000"></ellipse><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="196.5" y="-787.3">开始</text></g><g class="node" id="node2"><title>init</title><polygon fill="#add8e6" points="266,-736 127,-736 127,-698 266,-698 266,-736" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="196.5" y="-720.8">初始化空的生成树T</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="196.5" y="-705.8">边集合E = ∅</text></g><g class="edge" id="edge1"><title>start-&gt;init</title><path d="M196.5-772.94C196.5-764.99 196.5-755.31 196.5-746.31" fill="none" stroke="#000"></path><polygon fill="#000" points="200,-746.2 196.5,-736.2 193,-746.2 200,-746.2" stroke="#000"></polygon></g><g class="node" id="node3"><title>sort</title><polygon fill="#add8e6" points="254.5,-661 138.5,-661 138.5,-623 254.5,-623 254.5,-661" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="196.5" y="-645.8">将所有边按权重</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="196.5" y="-630.8">从小到大排序</text></g><g class="edge" id="edge2"><title>init-&gt;sort</title><path d="M196.5-697.96C196.5-689.88 196.5-680.18 196.5-671.18" fill="none" stroke="#000"></path><polygon fill="#000" points="200,-671.09 196.5,-661.09 193,-671.09 200,-671.09" stroke="#000"></polygon></g><g class="node" id="node4"><title>select</title><polygon fill="#ffffe0" points="259,-578.5 134,-578.5 134,-540.5 259,-540.5 259,-578.5" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="196.5" y="-563.3">从排序边列表中</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="196.5" y="-548.3">选取最小权重边e</text></g><g class="edge" id="edge3"><title>sort-&gt;select</title><path d="M196.5-622.73C196.5-612.75 196.5-600.16 196.5-588.93" fill="none" stroke="#000"></path><polygon fill="#000" points="200,-588.69 196.5,-578.69 193,-588.69 200,-588.69" stroke="#000"></polygon></g><g class="node" id="node5"><title>check</title><polygon fill="orange" points="131.5,-496 29.5,-458 131.5,-420 233.5,-458 131.5,-496" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="131.5" y="-461.8">添加边e是否</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="131.5" y="-446.8">会形成环路？</text></g><g class="edge" id="edge4"><title>select-&gt;check</title><path d="M184.58-540.25C176.73-528.24 166.18-512.08 156.54-497.33" fill="none" stroke="#000"></path><polygon fill="#000" points="159.4,-495.31 151,-488.85 153.54,-499.14 159.4,-495.31" stroke="#000"></polygon></g><g class="node" id="node8"><title>complete</title><polygon fill="orange" points="192.5,-281 76.5,-228 192.5,-175 308.5,-228 192.5,-281" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="192.5" y="-239.3">生成树是否包含</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="192.5" y="-224.3">n-1条边？</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="192.5" y="-209.3">(n为顶点数)</text></g><g class="node" id="node6"><title>add</title><polygon fill="#90ee90" points="133,-354 0,-354 0,-318 133,-318 133,-354" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="66.5" y="-332.3">将边e加入生成树T</text></g><g class="edge" id="edge5"><title>check-&gt;add</title><path d="M98.25-432.14C89.1-423.61 80.15-413.32 74.5-402 68.73-390.43 66.5-376.32 65.82-364.2" fill="none" stroke="#000"></path><polygon fill="#000" points="69.32,-364.09 65.56,-354.18 62.32,-364.27 69.32,-364.09" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="115.5" y="-390.8">否</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="115.5" y="-375.8">(不形成环路)</text></g><g class="node" id="node7"><title>skip</title><polygon fill="#f08080" points="233.5,-354 151.5,-354 151.5,-318 233.5,-318 233.5,-354" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="192.5" y="-332.3">跳过此边e</text></g><g class="edge" id="edge6"><title>check-&gt;skip</title><path d="M147.37-425.78C157.23-406.39 169.76-381.73 179.12-363.33" fill="none" stroke="#000"></path><polygon fill="#000" points="182.28,-364.83 183.69,-354.33 176.04,-361.66 182.28,-364.83" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="208.5" y="-390.8">是</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="208.5" y="-375.8">(形成环路)</text></g><g class="edge" id="edge7"><title>add-&gt;complete</title><path d="M86.74-317.97C102.28-304.9 124.39-286.3 144.38-269.49" fill="none" stroke="#000"></path><polygon fill="#000" points="146.8,-272.02 152.2,-262.9 142.3,-266.66 146.8,-272.02" stroke="#000"></polygon></g><g class="edge" id="edge8"><title>skip-&gt;complete</title><path d="M192.5-317.97c0 7.47000000000003.0 16.75.0 26.46" fill="none" stroke="#000"></path><polygon fill="#000" points="196,-291.28 192.5,-281.28 189,-291.28 196,-291.28" stroke="#000"></polygon></g><g class="edge" id="edge9"><title>complete-&gt;select</title><path d="M241.61-258.66c13.53-10.86 26.5-24.44 33.89-40.34 40.46-87.06 48.84-133.35.0-216C270.82-522.92 264.13-529.49 256.59-534.93" fill="none" stroke="#000"></path><polygon fill="#000" points="254.65,-532.02 248.14,-540.38 258.44,-537.9 254.65,-532.02" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="372" y="-390.8">否</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="372" y="-375.8">(继续选取下一条边)</text></g><g class="node" id="node9"><title>result</title><polygon fill="#90ee90" points="255,-109 130,-109 130,-73 255,-73 255,-109" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="192.5" y="-87.3">返回最小生成树T</text></g><g class="edge" id="edge10"><title>complete-&gt;result</title><path d="M192.5-174.81c0 18.93.0 39.56.0 55.49" fill="none" stroke="#000"></path><polygon fill="#000" points="196,-119.12 192.5,-109.12 189,-119.12 196,-119.12" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="233.5" y="-145.8">是</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="233.5" y="-130.8">(生成树完成)</text></g><g class="node" id="node10"><title>end</title><ellipse cx="192.5" cy="-18" fill="#90ee90" rx="29.5" ry="18" stroke="#000"></ellipse><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="192.5" y="-14.3">结束</text></g><g class="edge" id="edge11"><title>result-&gt;end</title><path d="M192.5-72.81c0 8.02.0 17.76.0 26.74" fill="none" stroke="#000"></path><polygon fill="#000" points="196,-46.03 192.5,-36.03 189,-46.03 196,-46.03" stroke="#000"></polygon></g><g class="node" id="node11"><title>note1</title><polygon fill="#ffffe0" points="430,-586 277,-586 277,-533 436,-533 436,-580 430,-586" stroke="#000"></polygon><polyline fill="none" points="430,-586 430,-580" stroke="#000"></polyline><polyline fill="none" points="436,-580 430,-580" stroke="#000"></polyline><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="356.5" y="-570.8">核心思想：贪心策略</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="356.5" y="-555.8">每次选择最小权重的边</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="356.5" y="-540.8">同时避免形成环路</text></g></g></svg>