l="#27AE60" font-size="13" font-weight="bold" text-anchor="middle" x="290" y="275">15</text><line marker-end="url(#arr-g)" stroke="#27AE60" stroke-width="1.5" x1="306" x2="320" y1="270" y2="270"></line><circle cx="336" cy="270" fill="#EBF9E0" r="16" stroke="#27AE60" stroke-width="1.5"></circle><text fill="#27AE60" font-size="13" font-weight="bold" text-anchor="middle" x="336" y="275">18</text><text fill="#555" font-size="11" x="20" y="305">中序结果有序 → 可借助它判断 BST 合法性、找差值最小结点（2026年）</text><line stroke="#DDD" stroke-dasharray="5,4" stroke-width="1" x1="400" x2="400" y1="15" y2="330"></line><text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="580" y="20">层序遍历（BFS）— 队列驱动</text><circle cx="580" cy="60" fill="#9B59B6" r="18" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="580" y="65">A</text><circle cx="520" cy="120" fill="#9B59B6" r="18" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="520" y="125">B</text><line stroke="#999" stroke-width="1.5" x1="565" x2="535" y1="73" y2="107"></line><circle cx="640" cy="120" fill="#9B59B6" r="18" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="640" y="125">C</text><line stroke="#999" stroke-width="1.5" x1="595" x2="625" y1="73" y2="107"></line><circle cx="490" cy="185" fill="#2C7BB6" r="18" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="490" y="190">D</text><line stroke="#999" stroke-width="1.5" x1="507" x2="497" y1="134" y2="171"></line><circle cx="550" cy="185" fill="#2C7BB6" r="18" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="550" y="190">E</text><line stroke="#999" stroke-width="1.5" x1="533" x2="543" y1="134" y2="171"></line><circle cx="640" cy="185" fill="#2C7BB6" r="18" stroke="none"></circle><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="640" y="190">F</text><line stroke="#999" stroke-width="1.5" x1="640" x2="640" y1="138" y2="171"></line><text fill="#555" font-size="12" font-weight="bold" x="420" y="230">Queue 状态：</text><rect fill="#F5EEFF" height="20" rx="4" stroke="#9B59B6" stroke-width="1" width="320" x="420" y="238"></rect><text fill="#333" font-size="11" x="428" y="253">入：A → 出 A，入 B C</text><rect fill="#DEF" height="20" rx="4" stroke="#2C7BB6" stroke-width="1" width="320" x="420" y="262"></rect><text fill="#333" font-size="11" x="428" y="277">队列 [B,C] → 出 B，入 D E；出 C，入 F</text><rect fill="#EBF9E0" height="20" rx="4" stroke="#27AE60" stroke-width="1" width="320" x="420" y="286"></rect><text fill="#333" font-size="11" x="428" y="301">队列 [D,E,F] → 依次出队（叶结点）</text><text fill="#555" font-size="12" x="420" y="330">访问顺序：</text><circle cx="500" cy="326" fill="#9B59B6" r="12" stroke="none"></circle><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="500" y="330">A</text><text fill="#999" font-size="12" x="515" y="330">→</text><circle cx="530" cy="326" fill="#9B59B6" r="12" stroke="none"></circle><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="530" y="330">B</text><text fill="#999" font-size="12" x="545" y="330">→</text><circle cx="560" cy="326" fill="#9B59B6" r="12" stroke="none"></circle><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="560" y="330">C</text><text fill="#999" font-size="12" x="575" y="330">→</text><circle cx="590" cy="326" fill="#2C7BB6" r="12" stroke="none"></circle><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="590" y="330">D</text><text fill="#999" font-size="12" x="605" y="330">→</text><circle cx="620" cy="326" fill="#2C7BB6" r="12" stroke="none"></circle><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="620" y="330">E</text><text fill="#999" font-size="12" x="635" y="330">→</text><circle cx="650" cy="326" fill="#2C7BB6" r="12" stroke="no