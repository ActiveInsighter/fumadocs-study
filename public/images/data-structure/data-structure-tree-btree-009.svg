<svg font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg"><style>.title{font-weight:700;font-size:13px;text-anchor:middle}.sub{font-size:11px;fill:#555;text-anchor:middle}.nd{stroke:#333;fill:#fff}.child{stroke:#1565c0;fill:none;stroke-width:1.8}.thread{stroke:#c0392b;fill:none;stroke-width:1.5;stroke-dasharray:5 4}.tag0{fill:#e3f2fd;stroke:#1565c0}.tag1{fill:#fde4e4;stroke:#c0392b}text{dominant-baseline:central}</style><defs><marker id="cm" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#1565c0"></path></marker><marker id="tm" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c0392b"></path></marker></defs><text font-size="14" font-weight="700" text-anchor="middle" x="410" y="22">线索二叉树节点：ltag / rtag 标识子指针还是线索</text><g transform="translate(40,55)"><text class="title" x="170" y="0">节点字段结构</text><g transform="translate(0,30)"><rect class="tag0" height="40" width="50" x="0" y="0"></rect><text text-anchor="middle" x="25" y="20">ltag</text><rect class="nd" height="40" width="60" x="50" y="0"></rect><text text-anchor="middle" x="80" y="20">lchild</text><rect class="nd" height="40" width="80" x="110" y="0"></rect><text font-weight="700" text-anchor="middle" x="150" y="20">data</text><rect class="nd" height="40" width="60" x="190" y="0"></rect><text text-anchor="middle" x="220" y="20">rchild</text><rect class="tag0" height="40" width="50" x="250" y="0"></rect><text text-anchor="middle" x="275" y="20">rtag</text><text fill="#1565c0" font-size="11" text-anchor="middle" x="25" y="58">0 = 左孩子</text><text fill="#c0392b" font-size="11" text-anchor="middle" x="25" y="74">1 = 前驱线索</text><text fill="#1565c0" font-size="11" text-anchor="middle" x="275" y="58">0 = 右孩子</text><text fill="#c0392b" font-size="11" text-anchor="middle" x="275" y="74">1 = 后继线索</text></g><g transform="translate(0,135)"><text font-weight="600" y="0">指针含义：</text><line class="child" marker-end="url(#cm)" x1="0" x2="40" y1="22" y2="22"></line><text x="50" y="22">child 指针（实线）：指向真实左/右孩子</text><line class="thread" marker-end="url(#tm)" x1="0" x2="40" y1="48" y2="48"></line><text x="50" y="48">thread 指针（虚线）：指向中序前驱/后继</text><text fill="#666" font-size="11" y="80">利用空指针存线索 → 省去栈式遍历</text></g></g><g transform="translate(420,50)"><text class="title" x="170" y="0">中序线索化示例</text><text class="sub" x="170" y="18">中序序列：D B E A F C G</text><g><circle class="nd" cx="180" cy="55" r="16"></circle><text font-weight="700" text-anchor="middle" x="180" y="55">A</text><text fill="#1565c0" font-size="10" x="160" y="40">l:0</text><text fill="#1565c0" font-size="10" x="195" y="40">r:0</text></g><g><circle class="nd" cx="100" cy="115" r="16"></circle><text text-anchor="middle" x="100" y="115">B</text><text fill="#1565c0" font-size="10" x="80" y="100">l:0</text><text fill="#1565c0" font-size="10" x="115" y="100">r:0</text></g><g><circle class="nd" cx="260" cy="115" r="16"></circle><text text-anchor="middle" x="260" y="115">C</text><text fill="#1565c0" font-size="10" x="240" y="100">l:0</text><text fill="#1565c0" font-size="10" x="275" y="100">r:0</text></g><g><circle class="nd" cx="50" cy="180" r="14"></circle><text text-anchor="middle" x="50" y="180">D</text><text fill="#c0392b" font-size="10" x="30" y="165">l:1</text><text fill="#c0392b" font-size="10" x="62" y="165">r:1</text></g><g><circle class="nd" cx="150" cy="180" r="14"></circle><text text-anchor="middle" x="150" y="180">E</text><text fill="#c0392b" font-size="10" x="130" y="165">l:1</text><text fill="#c0392b" font-size="10" x="162" y="165">r:1</text></g><g><circle class="nd" cx="220" cy="180" r="14"></circle><text text-anchor="middle" x="220" y="180">F</text><text fill="#c0392b" font-size="10" x="200" y="165">l:1</text><text fill="#c0392b" font-size="10" x="232" y="165">r:1</text></g><g><circle class="nd" cx="310" cy="180" r="14"></circle><text text-anchor="middle" x="310" y="180">G</text><text fill="#c0392b" font-size="10" x="290" y="165">l:1</text><text fill="#c0392b" font-size="10" x="322" y="165">r:1</text></g><line class="child" marker-end="url(#cm)" x1="170" x2="110" y1="67" y2="103"></line><line class="child" marker-end="url(#cm)" x1="190" x2="250" y1="67" y2="103"></line><line class="child" marker-end="url(#cm)" x1="90" x2="58" y1="127" y2="167"></line><line class="child" marker-end="url(#cm)" x1="110" x2="142" y1="127" y2="167"></line><line class="child" marker-end="url(#cm)" x1="250" x2="228" y1="127" y2="167"></line><line class="child" marker-end="url(#cm)" x1="270" x2="302" y1="127" y2="167"></line><path class="thread" d="M58 185c12 25 34-35 37-58" marker-end="url(#tm)"></path><path class="thread" d="M158 185c17 20 12-95 17-113" marker-end="url(#tm)"></path><path class="thread" d="M228 185c12 15 22-45 27-58" marker-end="url(#tm)"></path><path class="thread" d="M42 178c-17-8-22-48 38-60" marker-end="url(#tm)"></path><path class="thread" d="M142 178c-22 2-37-43-32-51" marker-end="url(#tm)"></path><path class="thread" d="M212 178c-17 2-32-88-37-106" marker-end="url(#tm)"></path><path class="thread" d="M302 178c-12 2-32-38-37-51" marker-end="url(#tm)"></path><text fill="#666" font-size="10" text-anchor="middle" x="50" y="220">D 无前驱</text><text fill="#666" font-size="10" text-anchor="middle" x="310" y="220">G 无后继</text><text fill="#555" font-size="11" text-anchor="middle" x="170" y="260">叶节点的空指针被改造为虚线线索，tag=1 用以区分</text></g></svg>