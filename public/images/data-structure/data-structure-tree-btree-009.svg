<svg font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><style>.title{font-weight: var(--svg-font-weight-bold);font-size: var(--svg-font-size-label);text-anchor:middle}.sub{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep);text-anchor:middle}.nd{stroke:var(--neutral-ink);fill:var(--surface)}.child{stroke:var(--violet-deep);fill:none;stroke-width:1.8}.thread{stroke:var(--red-deep);fill:none;stroke-width:1.5;stroke-dasharray:5 4}.tag0{fill:var(--sky-soft);stroke:var(--violet-deep)}.tag1{fill:var(--red-soft);stroke:var(--red-deep)}text{dominant-baseline:central}</style><defs><marker id="cm" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--violet-deep)"></path></marker><marker id="tm" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--red-deep)"></path></marker></defs><text font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="410" y="22">线索二叉树节点：ltag / rtag 标识子指针还是线索</text><g transform="translate(40,55)"><text class="title" x="170" y="0">节点字段结构</text><g transform="translate(0,30)"><rect class="tag0" height="40" width="50" x="0" y="0"></rect><text text-anchor="middle" x="25" y="20">ltag</text><rect class="nd" height="40" width="60" x="50" y="0"></rect><text text-anchor="middle" x="80" y="20">lchild</text><rect class="nd" height="40" width="80" x="110" y="0"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="20">data</text><rect class="nd" height="40" width="60" x="190" y="0"></rect><text text-anchor="middle" x="220" y="20">rchild</text><rect class="tag0" height="40" width="50" x="250" y="0"></rect><text text-anchor="middle" x="275" y="20">rtag</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="25" y="58">0 = 左孩子</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="25" y="74">1 = 前驱线索</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="275" y="58">0 = 右孩子</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="275" y="74">1 = 后继线索</text></g><g transform="translate(0,135)"><text font-weight="var(--svg-font-weight-semibold)" y="0">指针含义：</text><line class="child" marker-end="url(#cm)" x1="0" x2="40" y1="22" y2="22"></line><text x="50" y="22">child 指针（实线）：指向真实左/右孩子</text><line class="thread" marker-end="url(#tm)" x1="0" x2="40" y1="48" y2="48"></line><text x="50" y="48">thread 指针（虚线）：指向中序前驱/后继</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" y="80">利用空指针存线索 → 省去栈式遍历</text></g></g><g transform="translate(420,50)"><text class="title" x="170" y="0">中序线索化示例</text><text class="sub" x="170" y="18">中序序列：D B E A F C G</text><g><circle class="nd" cx="180" cy="55" r="16"></circle><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="180" y="55">A</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" x="160" y="40">l:0</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" x="195" y="40">r:0</text></g><g><circle class="nd" cx="100" cy="115" r="16"></circle><text text-anchor="middle" x="100" y="115">B</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" x="80" y="100">l:0</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" x="115" y="100">r:0</text></g><g><circle class="nd" cx="260" cy="115" r="16"></circle><text text-anchor="middle" x="260" y="115">C</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" x="240" y="100">l:0</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" x="275" y="100">r:0</text></g><g><circle class="nd" cx="50" cy="180" r="14"></circle><text text-anchor="middle" x="50" y="180">D</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="30" y="165">l:1</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="62" y="165">r:1</text></g><g><circle class="nd" cx="150" cy="180" r="14"></circle><text text-anchor="middle" x="150" y="180">E</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="130" y="165">l:1</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="162" y="165">r:1</text></g><g><circle class="nd" cx="220" cy="180" r="14"></circle><text text-anchor="middle" x="220" y="180">F</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="200" y="165">l:1</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="232" y="165">r:1</text></g><g><circle class="nd" cx="310" cy="180" r="14"></circle><text text-anchor="middle" x="310" y="180">G</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="290" y="165">l:1</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="322" y="165">r:1</text></g><line class="child" marker-end="url(#cm)" x1="170" x2="110" y1="67" y2="103"></line><line class="child" marker-end="url(#cm)" x1="190" x2="250" y1="67" y2="103"></line><line class="child" marker-end="url(#cm)" x1="90" x2="58" y1="127" y2="167"></line><line class="child" marker-end="url(#cm)" x1="110" x2="142" y1="127" y2="167"></line><line class="child" marker-end="url(#cm)" x1="250" x2="228" y1="127" y2="167"></line><line class="child" marker-end="url(#cm)" x1="270" x2="302" y1="127" y2="167"></line><path class="thread" d="M58 185c12 25 34-35 37-58" marker-end="url(#tm)"></path><path class="thread" d="M158 185c17 20 12-95 17-113" marker-end="url(#tm)"></path><path class="thread" d="M228 185c12 15 22-45 27-58" marker-end="url(#tm)"></path><path class="thread" d="M42 178c-17-8-22-48 38-60" marker-end="url(#tm)"></path><path class="thread" d="M142 178c-22 2-37-43-32-51" marker-end="url(#tm)"></path><path class="thread" d="M212 178c-17 2-32-88-37-106" marker-end="url(#tm)"></path><path class="thread" d="M302 178c-12 2-32-38-37-51" marker-end="url(#tm)"></path><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="50" y="220">D 无前驱</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="220">G 无后继</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="170" y="260">叶节点的空指针被改造为虚线线索，tag=1 用以区分</text></g></svg>