<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg"><defs><style>.title{font:700 16px sans-serif;fill:#2c3e50}.label{font:14px sans-serif;fill:#34495e}.small-label{font:12px sans-serif;fill:#7f8c8d}.key{font:700 14px monospace;fill:#2980b9}.value{font:13px sans-serif;fill:#27ae60}.slot{fill:#ecf0f1;stroke:#95a5a6;stroke-width:2}.slot-filled{fill:#d5e8f7;stroke:#3498db;stroke-width:2}.slot-target{fill:#ffeaa7;stroke:#fdcb6e;stroke-width:2.5}.slot-conflict{fill:#fab1a0;stroke:#e17055;stroke-width:2}.arrow{stroke:#e74c3c;stroke-width:2;fill:none;marker-end:url(#arrowhead)}.arrow-blue{stroke:#3498db;stroke-width:2;fill:none;marker-end:url(#arrowhead-blue)}.arrow-green{stroke:#27ae60;stroke-width:2;fill:none;marker-end:url(#arrowhead-green)}.hash-box{fill:#fff;stroke:#3498db;stroke-width:2;rx:5}.step-box{fill:#e8f5e9;stroke:#27ae60;stroke-width:1.5;rx:4}</style><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#e74c3c" points="0 0, 10 3, 0 6"></polygon></marker><marker id="arrowhead-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#3498db" points="0 0, 10 3, 0 6"></polygon></marker><marker id="arrowhead-green" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#27ae60" points="0 0, 10 3, 0 6"></polygon></marker></defs><g transform="translate(50, 30)"><rect class="hash-box" height="45" width="120" x="0" y="0"></rect><text class="label" text-anchor="middle" x="60" y="20">查找键</text><text class="key" text-anchor="middle" x="60" y="38">key = "Bob"</text></g><path class="arrow-blue" d="M170 52h50"></path><g transform="translate(220, 30)"><rect class="hash-box" height="45" width="140" x="0" y="0"></rect><text class="label" text-anchor="middle" x="70" y="20">h(key) % n</text><text class="small-label" text-anchor="middle" x="70" y="38">hash("Bob") = 3</text></g><path class="arrow" d="M290 75v35"></path><g transform="translate(150, 120)"><text class="label" x="0" y="-5">散列表 (n=7)</text><rect class="slot" height="45" width="60" x="0" y="10"></rect><text class="small-label" text-anchor="middle" x="30" y="25">0</text><text class="small-label" text-anchor="middle" x="30" y="45">—</text><rect class="slot-filled" height="45" width="60" x="70" y="10"></rect><text class="small-label" text-anchor="middle" x="100" y="25">1</text><text class="key" font-size="11" text-anchor="middle" x="100" y="38">Alice</text><text class="value" font-size="10" text-anchor="middle" x="100" y="50">100</text><rect class="slot" height="45" width="60" x="140" y="10"></rect><text class="small-label" text-anchor="middle" x="170" y="25">2</text><text class="small-label" text-anchor="middle" x="170" y="45">—</text><rect class="slot-conflict" height="45" width="60" x="210" y="10"></rect><text class="small-label" text-anchor="middle" x="240" y="25">3</text><text class="key" font-size="11" text-anchor="middle" x="240" y="38">Tom</text><text class="value" font-size="10" text-anchor="middle" x="240" y="50">200</text><rect class="slot-target" height="45" width="60" x="280" y="10"></rect><text class="small-label" text-anchor="middle" x="310" y="25">4</text><text class="key" font-size="11" text-anchor="middle" x="310" y="38">Bob</text><text class="value" font-size="10" text-anchor="middle" x="310" y="50">300</text><rect class="slot-filled" height="45" width="60" x="350" y="10"></rect><text class="small-label" text-anchor="middle" x="380" y="25">5</text><text class="key" font-size="11" text-anchor="middle" x="380" y="38">Eve</text><text class="value" font-size="10" text-anchor="middle" x="380" y="50">150</text><rect class="slot" height="45" width="60" x="420" y="10"></rect><text class="small-label" text-anchor="middle" x="450" y="25">6</text><text class="small-label" text-anchor="middle" x="450" y="45">—</text></g><g transform="translate(50, 200)"><text class="label" font-weight="bold" x="0" y="0">查找过程：</text><g transform="translate(0, 20)"><circle cx="8" cy="0" fill="#3498db" r="8"></circle><text class="small-label" fill="#fff" font-weight="bold" text-anchor="middle" x="8" y="4">1</text><text class="label" x="25" y="5">计算哈希：h("Bob") % 7 = 3，访问索引3</text></g><path class="arrow" d="M290 215l1e2-45" stroke-dasharray="5,3"></path><g transform="translate(0, 45)"><circle cx="8" cy="0" fill="#e74c3c" r="8"></circle><text class="small-label" fill="#fff" font-weight="bold" text-anchor="middle" x="8" y="4">2</text><text class="label" x="25" y="5">发现冲突：索引3存储的是"Tom"，不匹配</text></g><g transform="translate(0, 70)"><circle cx="8" cy="0" fill="#f39c12" r="8"></circle><text class="small-label" fill="#fff" font-weight="bold" text-anchor="middle" x="8" y="4">3</text><text class="label" x="25" y="5">探测下一位置：(3 + 1) % 7 = 4，访问索引 4（假设使用线性探测）</text></g><path class="arrow" d="M4e2 165q20 15 50 0" stroke-dasharray="5,3"></path><g transform="translate(0, 95)"><circle cx="8" cy="0" fill="#27ae60" r="8"></circle><text class="small-label" fill="#fff" font-weight="bold" text-anchor="middle" x="8" y="4">4</text><text class="label" x="25" y="5">找到匹配：索引4存储的是"Bob"，返回值300 ✓</text></g><path class="arrow-green" d="M450 165V330"></path></g><g transform="translate(380, 340)"><rect class="step-box" height="40" width="140" x="0" y="0"></rect><text class="label" text-anchor="middle" x="70" y="18">查找成功</text><text class="value" font-weight="bold" text-anchor="middle" x="70" y="33">返回值：300</text></g><g transform="translate(50, 410)"><text class="label" font-weight="bold" x="0" y="0">时间复杂度分析：</text><rect fill="#e8f8f5" height="110" rx="5" stroke="#16a085" stroke-width="1" width="700" x="0" y="10"></rect><g transform="translate(15, 30)"><text class="label" x="0" y="0">• 最好情况：O(1) - 无冲突，直接命中目标位置</text><text class="label" x="0" y="25">• 平均情况：O(1) - 在负载因子合理时，冲突较少</text><text class="label" x="0" y="50">• 最坏情况：O(n) - 所有键哈希到同一位置，需遍历全部槽位</text><text class="small-label" fill="#7f8c8d" x="0" y="75">※ 负载因子 α = 已用槽位数 / 总槽位数，建议保持 α &lt; 0.75</text></g></g></svg>