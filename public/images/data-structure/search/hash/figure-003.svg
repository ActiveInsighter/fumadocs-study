<svg height="600" viewBox="0 0 800 600" width="800" xmlns="http://www.w3.org/2000/svg"><rect fill="none" height="600" width="800"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">哈希表中的同义词与非同义词</text><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" x="400" y="60">哈希函数：h(key) = key % 10</text><g id="keys-section"><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" x="50" y="110">键 (Keys)</text><rect fill="#3498db" height="40" rx="5" stroke="#2980b9" stroke-width="2" width="60" x="50" y="130"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="80" y="155">15</text><rect fill="#e74c3c" height="40" rx="5" stroke="#c0392b" stroke-width="2" width="60" x="50" y="190"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="80" y="215">25</text><rect fill="#27ae60" height="40" rx="5" stroke="#229954" stroke-width="2" width="60" x="50" y="250"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="80" y="275">17</text></g><g id="hash-calculation"><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="130" y="140">15 % 10 = 5</text><line marker-end="url(#arrowhead-blue)" stroke="#3498db" stroke-width="2" x1="110" x2="240" y1="150" y2="150"></line><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="130" y="200">25 % 10 = 5</text><line marker-end="url(#arrowhead-red)" stroke="#e74c3c" stroke-width="2" x1="110" x2="240" y1="210" y2="210"></line><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="130" y="260">17 % 10 = 7</text><line marker-end="url(#arrowhead-green)" stroke="#27ae60" stroke-width="2" x1="110" x2="240" y1="270" y2="270"></line></g><g id="hash-table"><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" x="450" y="110">哈希表 (Hash Table)</text><g id="slots"><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="14" x="400" y="140">索引</text><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="14" x="480" y="140">槽位</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="30" x="420" y="150"></rect><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="435" y="172">0</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="80" x="460" y="150"></rect><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="30" x="420" y="190"></rect><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="435" y="212">1</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="80" x="460" y="190"></rect><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="30" x="420" y="230"></rect><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="435" y="252">2</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="80" x="460" y="230"></rect><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="30" x="420" y="270"></rect><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="435" y="292">3</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="80" x="460" y="270"></rect><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="30" x="420" y="310"></rect><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="435" y="332">4</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="80" x="460" y="310"></rect><rect fill="#fff3cd" height="35" stroke="#ffc107" stroke-width="2" width="30" x="420" y="350"></rect><text fill="#856404" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="435" y="372">5</text><rect fill="#fff3cd" height="35" stroke="#ffc107" stroke-width="2" width="80" x="460" y="350"></rect><text fill="#856404" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="500" y="372">冲突!</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="30" x="420" y="390"></rect><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="435" y="412">6</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="80" x="460" y="390"></rect><rect fill="#d1ecf1" height="35" stroke="#17a2b8" stroke-width="2" width="30" x="420" y="430"></rect><text fill="#0c5460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="435" y="452">7</text><rect fill="#d1ecf1" height="35" stroke="#17a2b8" stroke-width="2" width="80" x="460" y="430"></rect><text fill="#0c5460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="500" y="452">17</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="30" x="420" y="470"></rect><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="435" y="492">8</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="80" x="460" y="470"></rect><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="30" x="420" y="510"></rect><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="435" y="532">9</text><rect fill="#ecf0f1" height="35" stroke="#bdc3c7" width="80" x="460" y="510"></rect></g></g><line marker-end="url(#arrowhead-blue)" stroke="#3498db" stroke-dasharray="5,5" stroke-width="3" x1="240" x2="380" y1="150" y2="367"></line><line marker-end="url(#arrowhead-red)" stroke="#e74c3c" stroke-dasharray="5,5" stroke-width="3" x1="240" x2="380" y1="210" y2="367"></line><line marker-end="url(#arrowhead-green)" stroke="#27ae60" stroke-width="3" x1="240" x2="380" y1="270" y2="447"></line><g id="explanations"><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="16" font-weight="bold" x="600" y="200">同义词 (Synonyms)</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="600" y="220">键 15 和 25 都映射到索引 5</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="600" y="240">它们竞争同一个槽位</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="14" x="600" y="260">→ 产生哈希冲突</text><line stroke="#bdc3c7" stroke-width="1" x1="590" x2="720" y1="280" y2="280"></line><text fill="#27ae60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" x="600" y="320">非同义词 (Non-synonyms)</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="600" y="340">键 15 映射到索引 5</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="600" y="360">键 17 映射到索引 7</text><text fill="#27ae60" font-family="Arial, sans-serif" font-size="14" x="600" y="380">→ 没有冲突</text></g><rect fill="#e8f4f8" height="30" rx="5" stroke="#3498db" width="700" x="50" y="560"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="400" y="580"><tspan font-weight="bold">总结：</tspan>同义词导致哈希冲突，需要冲突解决策略；非同义词可以和谐共存于不同槽位</text><defs><marker id="arrowhead-blue" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#3498db" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-red" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-green" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#27ae60" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>