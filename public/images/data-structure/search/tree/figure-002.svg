<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><rect fill="#f8f9fa" height="400" width="800"></rect><text fill="#333" font-size="20" font-weight="bold" text-anchor="middle" x="400" y="40">m阶B树的关键特性</text><rect fill="#f1f5f9" height="320" rx="10" stroke="#475569" stroke-width="2" width="700" x="50" y="60"></rect><circle cx="80" cy="110" fill="#2563eb" r="4"></circle><text fill="#2563eb" font-size="16" font-weight="bold" x="100" y="115">特性1：结点容量限制</text><text fill="#475569" font-size="14" x="120" y="135">• 每个结点最多有 m 棵子树</text><text fill="#475569" font-size="14" x="120" y="155">• 每个结点最多有 m-1 个关键字</text><text fill="#475569" font-size="14" x="120" y="175">• 关键字数量 = 子树数量 - 1</text><circle cx="80" cy="210" fill="#059669" r="4"></circle><text fill="#059669" font-size="16" font-weight="bold" x="100" y="215">特性2：根节点特殊规则</text><text fill="#475569" font-size="14" x="120" y="235">• 如果根节点不是叶子结点，至少有 2 棵子树</text><text fill="#475569" font-size="14" x="120" y="255">• 即：根节点至少有 1 个关键字（非叶子时）</text><circle cx="80" cy="290" fill="#dc2626" r="4"></circle><text fill="#dc2626" font-size="16" font-weight="bold" x="100" y="295">特性3：非叶节点最小限制</text><text fill="#475569" font-size="14" x="120" y="315">• 除根节点外，非叶节点至少有 ⌈m/2⌉ 棵子树</text><text fill="#475569" font-size="14" x="120" y="335">• 即：至少有 ⌈m/2⌉-1 个关键字</text><text fill="#475569" font-size="14" x="120" y="355">• 保证树的平衡性和搜索效率</text><rect fill="#e0f2fe" height="130" rx="8" stroke="#0284c7" stroke-width="2" width="280" x="450" y="100"></rect><text fill="#0284c7" font-size="16" font-weight="bold" text-anchor="middle" x="590" y="125">4阶B树示例计算</text><text fill="#0c4a6e" font-size="14" x="470" y="150">• 最多子树数：m = 4</text><text fill="#0c4a6e" font-size="14" x="470" y="170">• 最多关键字：m-1 = 3</text><text fill="#0c4a6e" font-size="14" x="470" y="190">• 非叶节点最少子树：⌈4/2⌉ = 2</text><text fill="#0c4a6e" font-size="14" x="470" y="210">• 非叶节点最少关键字：2-1 = 1</text><rect fill="#fef3c7" height="110" rx="8" stroke="#f59e0b" stroke-width="2" width="280" x="450" y="250"></rect><text fill="#92400e" font-size="16" font-weight="bold" text-anchor="middle" x="590" y="275">一般公式</text><text fill="#92400e" font-size="14" x="470" y="295">• 关键字范围：1 ~ m-1</text><text fill="#92400e" font-size="14" x="470" y="315">• 子树范围：2 ~ m（根节点）</text><text fill="#92400e" font-size="14" x="470" y="335">• 非叶节点：⌈m/2⌉-1 ~ m-1 个关键字</text></svg>