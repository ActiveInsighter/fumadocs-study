<svg viewBox="0 0 1e3 800" xmlns="http://www.w3.org/2000/svg"><defs><style>.title{font:700 24px sans-serif;fill:#2c3e50}.subtitle{font:700 18px sans-serif;fill:#34495e}.label{font:14px sans-serif;fill:#2c3e50}.key{font:700 13px sans-serif;fill:#2c3e50}.value{font:12px sans-serif;fill:#7f8c8d}.node-box{fill:#ecf0f1;stroke:#34495e;stroke-width:2}.leaf-box{fill:#d5f4e6;stroke:#27ae60;stroke-width:2}.internal-box{fill:#fdebd0;stroke:#f39c12;stroke-width:2}.arrow{stroke:#e74c3c;stroke-width:2;fill:none;marker-end:url(#arrowhead)}.link{stroke:#95a5a6;stroke-width:1.5;fill:none}.highlight{fill:#e74c3c}.note{font:italic 12px sans-serif;fill:#7f8c8d}</style><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#e74c3c" points="0 0, 10 3, 0 6"></polygon></marker></defs><text class="title" text-anchor="middle" x="500" y="30">B树 vs B+树：操作对比</text><text class="subtitle" x="50" y="70">1. 查找操作</text><text class="label" x="80" y="95">B树：可在内部节点结束</text><rect class="internal-box" height="40" rx="5" width="180" x="70" y="105"></rect><text class="key" x="100" y="128">15:V1</text><text class="key" x="160" y="128">30:V2</text><circle class="highlight" cx="210" cy="125" r="8"></circle><text class="note" x="260" y="128">✓ 找到30</text><text class="label" x="520" y="95">B+树：必须到达叶节点</text><rect class="internal-box" height="40" rx="5" width="180" x="510" y="105"></rect><text class="key" x="550" y="128">15</text><text class="key" x="610" y="128">30</text><line class="arrow" x1="600" x2="600" y1="145" y2="165"></line><rect class="leaf-box" height="40" rx="5" width="180" x="510" y="170"></rect><text class="key" x="535" y="193">30:V2</text><text class="key" x="605" y="193">45:V3</text><circle class="highlight" cx="585" cy="190" r="8"></circle><text class="note" x="700" y="193">✓ 找到30</text><text class="subtitle" x="50" y="250">2. 插入操作（节点分裂）</text><text class="label" x="80" y="275">B树：中间键值对整体上移</text><rect class="internal-box" height="40" rx="5" width="240" x="70" y="285"></rect><text class="key" x="90" y="308">10:V1</text><text class="key" x="145" y="308">20:V2</text><text class="key" x="200" y="308">30:V3</text><text class="key" x="255" y="308">40:V4</text><text class="note" x="320" y="305">满了</text><text class="label" x="170" y="345">↓ 插入25后分裂</text><rect class="internal-box" height="35" rx="5" width="100" x="130" y="360"></rect><text class="key" x="155" y="382">25:V2.5</text><circle class="highlight" cx="215" cy="378" r="8"></circle><line class="link" x1="140" x2="100" y1="395" y2="415"></line><line class="link" x1="210" x2="240" y1="395" y2="415"></line><rect class="internal-box" height="35" rx="5" width="110" x="50" y="420"></rect><text class="key" x="65" y="442">10:V1 20:V2</text><rect class="internal-box" height="35" rx="5" width="110" x="200" y="420"></rect><text class="key" x="210" y="442">30:V3 40:V4</text><text class="note" x="80" y="475">中间KV整体上移</text><text class="label" x="520" y="275">B+树：中间键复制到父节点</text><rect class="leaf-box" height="40" rx="5" width="240" x="510" y="285"></rect><text class="key" x="525" y="308">10:V1</text><text class="key" x="575" y="308">20:V2</text><text class="key" x="625" y="308">30:V3</text><text class="key" x="675" y="308">40:V4</text><text class="note" x="760" y="305">满了</text><text class="label" x="610" y="345">↓ 插入25后分裂</text><rect class="internal-box" height="35" rx="5" width="80" x="570" y="360"></rect><text class="key" x="590" y="382">25</text><circle class="highlight" cx="620" cy="378" r="8"></circle><text class="note" x="660" y="382">仅键</text><line class="link" x1="580" x2="540" y1="395" y2="415"></line><line class="link" x1="640" x2="680" y1="395" y2="415"></line><rect class="leaf-box" height="35" rx="5" width="120" x="480" y="420"></rect><text class="key" x="492" y="442">10:V1 20:V2</text><rect class="leaf-box" height="35" rx="5" width="130" x="640" y="420"></rect><text class="key" x="648" y="442">25:V2.5 30:V3</text><circle class="highlight" cx="690" cy="455" r="8"></circle><line class="link" stroke-dasharray="3,3" x1="600" x2="640" y1="437" y2="437"></line><text class="note" x="520" y="475">叶节点保留所有KV</text><text class="subtitle" x="50" y="530">3. 删除操作</text><text class="label" x="80" y="555">B树：内部节点删除复杂</text><rect class="internal-box" height="35" rx="5" width="100" x="120" y="565"></rect><text class="key" x="145" y="587">20:V2</text><circle cx="170" cy="583" fill="none" r="10" stroke="#e74c3c" stroke-width="2"></circle><line stroke="#e74c3c" stroke-width="2" x1="160" x2="180" y1="573" y2="593"></line><line stroke="#e74c3c" stroke-width="2" x1="180" x2="160" y1="573" y2="593"></line><line class="link" x1="130" x2="90" y1="600" y2="625"></line><line class="link" x1="210" x2="250" y1="600" y2="625"></line><rect class="internal-box" height="30" rx="5" width="80" x="50" y="630"></rect><text class="key" x="65" y="650">10:V1</text><rect class="internal-box" height="30" rx="5" width="90" x="200" y="630"></rect><text class="key" x="210" y="650">25:V3</text><circle class="highlight" cx="255" cy="645" r="8"></circle><text class="note" x="80" y="685">需用后继/前驱替换</text><line class="arrow" x1="245" x2="170" y1="630" y2="600"></line><text class="label" x="520" y="555">B+树：仅在叶节点删除</text><rect class="internal-box" height="35" rx="5" width="80" x="560" y="565"></rect><text class="key" x="585" y="587">20</text><text class="note" x="645" y="587">索引</text><line class="link" x1="570" x2="540" y1="600" y2="625"></line><line class="link" x1="630" x2="660" y1="600" y2="625"></line><rect class="leaf-box" height="30" rx="5" width="100" x="490" y="630"></rect><text class="key" x="510" y="650">10:V1</text><rect class="leaf-box" height="30" rx="5" width="100" x="620" y="630"></rect><text class="key" x="633" y="650">20:V2</text><circle cx="663" cy="645" fill="none" r="10" stroke="#e74c3c" stroke-width="2"></circle><line stroke="#e74c3c" stroke-width="2" x1="655" x2="671" y1="637" y2="653"></line><line stroke="#e74c3c" stroke-width="2" x1="671" x2="655" y1="637" y2="653"></line><text class="note" x="530" y="685">只删叶节点，内部键仅调整</text><rect fill="#f8f9fa" height="60" rx="5" stroke="#bdc3c7" stroke-width="1" width="900" x="50" y="720"></rect><text class="label" font-weight="bold" x="70" y="742">核心区别：</text><text class="label" x="70" y="762">• B树：所有节点存KV对，查找/插入/删除都涉及内部节点操作</text><text class="label" x="520" y="762">• B+树：仅叶节点存KV对，操作更简单，叶节点形成链表</text><rect fill="#fff" height="90" rx="3" stroke="#95a5a6" stroke-width="1" width="120" x="850" y="100"></rect><text class="label" font-weight="bold" x="860" y="118">图例</text><rect class="internal-box" height="15" rx="2" width="40" x="860" y="125"></rect><text class="label" font-size="11" x="905" y="136">内部节点</text><rect class="leaf-box" height="15" rx="2" width="40" x="860" y="145"></rect><text class="label" font-size="11" x="905" y="156">叶节点</text><circle class="highlight" cx="870" cy="170" r="6"></circle><text class="label" font-size="11" x="885" y="174">关键操作</text></svg>