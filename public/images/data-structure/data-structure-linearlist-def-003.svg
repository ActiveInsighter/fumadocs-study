"#10b981" stroke-width="2" width="140" x="320" y="0"></rect><text fill="#047857" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="390" y="25">IsEmpty</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="390" y="42">判断为空</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="390" y="58">检查是否为空</text><rect fill="url(#boxGrad)" filter="url(#shadow)" height="80" rx="8" stroke="#ef4444" stroke-width="2" width="140" x="480" y="0"></rect><text fill="#dc2626" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="550" y="25">ClearList</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="550" y="42">清空表</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="550" y="58">删除所有元素</text><rect fill="url(#boxGrad)" filter="url(#shadow)" height="80" rx="8" stroke="#8b5cf6" stroke-width="2" width="140" x="640" y="0"></rect><text fill="#7c3aed" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="710" y="25">Traverse</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="710" y="42">遍历</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="710" y="58">访问每个元素</text></g><g transform="translate(50, 330)"><rect fill="url(#boxGrad)" filter="url(#shadow)" height="100" rx="8" stroke="#f59e0b" stroke-width="2" width="180" x="0" y="0"></rect><text fill="#d97706" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="90" y="25">Insert</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="90" y="42">插入元素</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="90" y="58">在指定位置插入</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="90" y="74">新的元素</text><rect fill="url(#boxGrad)" filter="url(#shadow)" height="100" rx="8" stroke="#ef4444" stroke-width="2" width="180" x="200" y="0"></rect><text fill="#dc2626" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="290" y="25">Delete</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="290" y="42">删除元素</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="290" y="58">删除指定位置</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="290" y="74">的元素</text><rect fill="url(#boxGrad)" filter="url(#shadow)" height="100" rx="8" stroke="#8b5cf6" stroke-width="2" width="180" x="400" y="0"></rect><text fill="#7c3aed" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="490" y="25">SetElem</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="490" y="42">设置元素</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="490" y="58">修改指定位置</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="490" y="74">元素的值</text></g><g transform="translate(50, 460)"><rect fill="url(#boxGrad)" filter="url(#shadow)" height="100" rx="8" stroke="#06b6d4" stroke-width="2" width="180" x="0" y="0"></rect><text fill="#0891b2" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="90" y="25">GetElem</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="90" y="42">获取元素</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="90" y="58">获取指定位置</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="90" y="74">的元素值</text><rect fill="url(#boxGrad)" filter="url(#shadow)" height="100" rx="8" stroke="#06b6d4" stroke-width="2" width="180" x="200" y="0"></rect><text fill="#0891b2" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="290" y="25">LocateElem</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="290" y="42">查找元素</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="290" y="58">根据给定条件</text><text fill="#6b7280" font-family="SimHei, Arial, sans-serif" font-size="12" text-anchor="middle" x="290" y="74">查找元素位置</text></g><g transform="translate(50, 590)"><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="16" font-weight="bold" x="0" y="20">操作分类：</text><g transform="translate(0, 35)"><rect fill="#3b82f6" height="15" width="20" x="0" y="0"></rect><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" x="30" y="12">初始化操作</text><rect fill="#10b981" height="15" width="20" x="120" y="0"></rect><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" x="150" y="12">状态查询</text><rect fill="#f59e0b" height="15" width="20" x="220" y="0"></rect><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" x="250" y="12">插入操作</text><rect fill="#ef4444" height="15" width="20" x="320" y="0"></rect><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" x="350" y="12">删除操作</text><rect fill="#8b5cf6" height="15" width="20" x="420" y="0"></rect><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" x="450" y="12">修改操作</text><rect fill="#06b6d4" height="15" width="20" x="520" y="0"></rect><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" x="550" y="12">查询操作</text></g></g><g transform="translate(50, 680)"><rect fill="#fef2f2" height="80" rx="8" stroke="#fecaca" stroke-width="1" width="700" x="0" y="0"></rect><text fill="#dc2626" font-family="SimHei, Arial, sans-serif" font-size="14" font-weight="bold" x="20" y="25">💡 重要提示：</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" x="20" y="45">• 线性表的位置索引通常从 0 开始</text><text fill="#374151" font-family="SimHei, Arial, sans-serif" font-size="12" x="20" y="62">• 插入和删除操作会改变表的长度，需要注意边界条件处理</text></g></svg>