<svg viewBox="0 0 1e3 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter height="140%" id="shadow" width="140%" x="-20%" y="-20%"><feDropShadow dx="2" dy="2" flood-color="var(--ink)" stdDeviation="3"></feDropShadow></filter></defs><rect fill="none" height="800" width="1e3"></rect><rect fill="var(--purple-deep)" filter="url(#shadow)" height="60" rx="10" width="900" x="50" y="20"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="500" y="55">线性表基本操作</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" text-anchor="middle" x="450" y="120">示例线性表: [A, B, C, D, E]</text><g transform="translate(300, 140)"><rect fill="var(--amber-soft)" height="40" stroke="var(--yellow-mid)" stroke-width="2" width="60" x="0" y="0"></rect><rect fill="var(--amber-soft)" height="40" stroke="var(--yellow-mid)" stroke-width="2" width="60" x="60" y="0"></rect><rect fill="var(--amber-soft)" height="40" stroke="var(--yellow-mid)" stroke-width="2" width="60" x="120" y="0"></rect><rect fill="var(--amber-soft)" height="40" stroke="var(--yellow-mid)" stroke-width="2" width="60" x="180" y="0"></rect><rect fill="var(--amber-soft)" height="40" stroke="var(--yellow-mid)" stroke-width="2" width="60" x="240" y="0"></rect><text fill="var(--orange-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="30" y="25">A</text><text fill="var(--orange-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="25">B</text><text fill="var(--orange-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="25">C</text><text fill="var(--orange-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="210" y="25">D</text><text fill="var(--orange-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="270" y="25">E</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="30" y="60">0</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="90" y="60">1</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="150" y="60">2</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="210" y="60">3</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="270" y="60">4</text></g><g transform="translate(50, 220)"><rect fill="var(--blue-deep)" filter="url(#shadow)" height="80" rx="8" stroke="var(--violet-mid)" stroke-width="2" width="140" x="0" y="0"></rect><text fill="var(--violet-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="70" y="25">InitList</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="70" y="42">初始化</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="70" y="58">创建空线性表</text><rect fill="var(--blue-deep)" filter="url(#shadow)" height="80" rx="8" stroke="var(--green-mid)" stroke-width="2" width="140" x="160" y="0"></rect><text fill="var(--mint-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="230" y="25">Length</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="230" y="42">获取长度</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="230" y="58">返回元素数量</text><rect fill="var(--blue-deep)" filter="url(#shadow)" height="80" rx="8" stroke="var(--green-mid)" stroke-width="2" width="140" x="320" y="0"></rect><text fill="var(--mint-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="390" y="25">IsEmpty</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="390" y="42">判断为空</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="390" y="58">检查是否为空</text><rect fill="var(--blue-deep)" filter="url(#shadow)" height="80" rx="8" stroke="var(--red-deep)" stroke-width="2" width="140" x="480" y="0"></rect><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="550" y="25">ClearList</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="550" y="42">清空表</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="550" y="58">删除所有元素</text><rect fill="var(--blue-deep)" filter="url(#shadow)" height="80" rx="8" stroke="var(--purple-deep)" stroke-width="2" width="140" x="640" y="0"></rect><text fill="var(--purple-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="710" y="25">Traverse</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="710" y="42">遍历</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="710" y="58">访问每个元素</text></g><g transform="translate(50, 330)"><rect fill="var(--blue-deep)" filter="url(#shadow)" height="100" rx="8" stroke="var(--yellow-mid)" stroke-width="2" width="180" x="0" y="0"></rect><text fill="var(--orange-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="25">Insert</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="42">插入元素</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="58">在指定位置插入</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="74">新的元素</text><rect fill="var(--blue-deep)" filter="url(#shadow)" height="100" rx="8" stroke="var(--red-deep)" stroke-width="2" width="180" x="200" y="0"></rect><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="290" y="25">Delete</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="290" y="42">删除元素</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="290" y="58">删除指定位置</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="290" y="74">的元素</text><rect fill="var(--blue-deep)" filter="url(#shadow)" height="100" rx="8" stroke="var(--purple-deep)" stroke-width="2" width="180" x="400" y="0"></rect><text fill="var(--purple-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="490" y="25">SetElem</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="490" y="42">设置元素</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="490" y="58">修改指定位置</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="490" y="74">元素的值</text></g><g transform="translate(50, 460)"><rect fill="var(--blue-deep)" filter="url(#shadow)" height="100" rx="8" stroke="var(--sky-mid)" stroke-width="2" width="180" x="0" y="0"></rect><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="25">GetElem</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="42">获取元素</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="58">获取指定位置</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="74">的元素值</text><rect fill="var(--blue-deep)" filter="url(#shadow)" height="100" rx="8" stroke="var(--sky-mid)" stroke-width="2" width="180" x="200" y="0"></rect><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="290" y="25">LocateElem</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="290" y="42">查找元素</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="290" y="58">根据给定条件</text><text fill="var(--sky-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="290" y="74">查找元素位置</text></g><g transform="translate(50, 590)"><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="0" y="20">操作分类：</text><g transform="translate(0, 35)"><rect fill="var(--violet-mid)" height="15" width="20" x="0" y="0"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="30" y="12">初始化操作</text><rect fill="var(--green-mid)" height="15" width="20" x="120" y="0"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="150" y="12">状态查询</text><rect fill="var(--yellow-mid)" height="15" width="20" x="220" y="0"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="250" y="12">插入操作</text><rect fill="var(--red-deep)" height="15" width="20" x="320" y="0"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="350" y="12">删除操作</text><rect fill="var(--purple-deep)" height="15" width="20" x="420" y="0"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="450" y="12">修改操作</text><rect fill="var(--sky-mid)" height="15" width="20" x="520" y="0"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="550" y="12">查询操作</text></g></g><g transform="translate(50, 680)"><rect fill="var(--paper)" height="80" rx="8" stroke="var(--red-light)" stroke-width="1" width="700" x="0" y="0"></rect><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="20" y="25">💡 重要提示：</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="20" y="45">• 线性表的位置索引通常从 0 开始</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="20" y="62">• 插入和删除操作会改变表的长度，需要注意边界条件处理</text></g></svg>