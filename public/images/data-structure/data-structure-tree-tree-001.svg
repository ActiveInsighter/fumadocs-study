<svg height="262pt" viewBox="0 0 347 262" width="347pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><g class="graph" id="graph0" transform="scale(1 1) rotate(0) translate(4 258)"><title>TreeConcepts</title><g class="node" id="node1"><title>A</title><ellipse cx="106" cy="-236" fill="none" rx="18" ry="18" stroke="#000"></ellipse><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="middle" x="106" y="-232.3">A</text></g><g class="node" id="node2"><title>B</title><ellipse cx="65" cy="-131" fill="none" rx="18" ry="18" stroke="#000"></ellipse><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="middle" x="65" y="-127.3">B</text></g><g class="edge" id="edge1"><title>A-&gt;B</title><path d="M99.59-218.91c-7.7 19.35-20.55 51.63-28.23 70.93" fill="none" stroke="#000" stroke-width="1.4"></path></g><g class="node" id="node3"><title>C</title><ellipse cx="148" cy="-131" fill="none" rx="18" ry="18" stroke="#000"></ellipse><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="middle" x="148" y="-127.3">C</text></g><g class="edge" id="edge2"><title>A-&gt;C</title><path d="M112.56-218.91c7.89 19.35 21.05 51.63 28.92 70.93" fill="none" stroke="#000" stroke-width="1.4"></path></g><g class="node" id="node4"><title>D</title><ellipse cx="22" cy="-22" fill="none" rx="18" ry="18" stroke="#000"></ellipse><ellipse cx="22" cy="-22" fill="none" rx="22" ry="22" stroke="#000"></ellipse><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="middle" x="22" y="-18.3">D</text></g><g class="edge" id="edge3"><title>B-&gt;D</title><path d="M58.47-113.75C50.81-94.69 38.12-63.11 29.91-42.68" fill="none" stroke="#000" stroke-width="1.4"></path></g><g class="node" id="node5"><title>E</title><ellipse cx="109" cy="-22" fill="none" rx="18" ry="18" stroke="#000"></ellipse><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="middle" x="109" y="-18.3">E</text></g><g class="edge" id="edge4"><title>B-&gt;E</title><path d="M71.68-113.75C80-93.52 94.12-59.19 102.4-39.05" fill="none" stroke="#000" stroke-width="1.4"></path></g><g class="node" id="node6"><title>info</title><text font-family="Helvetica,sans-Serif" font-size="14" font-weight="bold" text-anchor="start" x="216" y="-175.8">以结点 D 为例：</text><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="start" x="216" y="-155.8">• B 是 D 的双亲</text><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="start" x="216" y="-136.8">• A、B 是 D 的祖先</text><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="start" x="216" y="-117.8">• E 是 D 的兄弟</text><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="start" x="216" y="-98.8">• D 是 B 的孩子</text><text font-family="Helvetica,sans-Serif" font-size="14" text-anchor="start" x="216" y="-79.8">• D 是 A 的子孙</text></g></g></svg>