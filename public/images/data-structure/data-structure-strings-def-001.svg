<svg font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg"><style>.title{font-weight:600;font-size:14px;text-anchor:middle}.lbl{font-size:11px;fill:#555}.cell{fill:#fff;stroke:#333}.ptr{fill:none;stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.meta{fill:#eef3ff;stroke:#3a5bd9}.heap{fill:#fff5e6;stroke:#cc7a00}.block{fill:#eef9ee;stroke:#2e8b57}</style><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#333"></path></marker></defs><text class="title" x="125" y="28">定长顺序存储</text><text class="lbl" text-anchor="middle" x="125" y="46">char data[MAX_SIZE]; int length;</text><g transform="translate(20,70)"><rect class="meta" height="28" width="210" x="0" y="0"></rect><text text-anchor="middle" x="105" y="18">length = 5</text><text class="lbl" text-anchor="middle" x="105" y="46">定长数组（容量预先固定）</text><g transform="translate(0,60)"><rect class="cell" height="30" width="30" x="0" y="0"></rect><text text-anchor="middle" x="15" y="20">H</text><rect class="cell" height="30" width="30" x="30" y="0"></rect><text text-anchor="middle" x="45" y="20">e</text><rect class="cell" height="30" width="30" x="60" y="0"></rect><text text-anchor="middle" x="75" y="20">l</text><rect class="cell" height="30" width="30" x="90" y="0"></rect><text text-anchor="middle" x="105" y="20">l</text><rect class="cell" height="30" width="30" x="120" y="0"></rect><text text-anchor="middle" x="135" y="20">o</text><rect class="cell" fill="#f4f4f4" height="30" width="30" x="150" y="0"></rect><rect class="cell" fill="#f4f4f4" height="30" width="30" x="180" y="0"></rect><text class="lbl" text-anchor="middle" x="195" y="20">…</text></g><text class="lbl" text-anchor="middle" x="105" y="130">↑ 已用 5 / 容量 MAX_SIZE</text><text class="lbl" text-anchor="middle" x="105" y="150">缺点：超出容量需截断或重建</text></g><text class="title" x="380" y="28">堆分配存储</text><text class="lbl" text-anchor="middle" x="380" y="46">char *data; int length;</text><g transform="translate(275,70)"><rect class="meta" height="28" width="210" x="0" y="0"></rect><text text-anchor="middle" x="60" y="18">data ●</text><text text-anchor="middle" x="155" y="18">length = 5</text><path class="ptr" d="M75 28c0 27-15 32-40 47"></path><text class="lbl" text-anchor="middle" x="105" y="46">栈上结构体 + 堆上动态数组</text><g transform="translate(0,80)"><rect class="heap" height="30" width="170" x="20" y="0"></rect><text text-anchor="middle" x="35" y="20">H</text><text text-anchor="middle" x="55" y="20">e</text><text text-anchor="middle" x="75" y="20">l</text><text text-anchor="middle" x="95" y="20">l</text><text text-anchor="middle" x="115" y="20">o</text><text text-anchor="middle" x="135" y="20">\0</text><line stroke="#cc7a00" x1="45" x2="45" y1="0" y2="30"></line><line stroke="#cc7a00" x1="65" x2="65" y1="0" y2="30"></line><line stroke="#cc7a00" x1="85" x2="85" y1="0" y2="30"></line><line stroke="#cc7a00" x1="105" x2="105" y1="0" y2="30"></line><line stroke="#cc7a00" x1="125" x2="125" y1="0" y2="30"></line></g><text class="lbl" text-anchor="middle" x="105" y="130">长度按需 malloc，可动态扩展</text><text class="lbl" text-anchor="middle" x="105" y="150">特点：连续存储，需手动 free</text></g><text class="title" x="635" y="28">块链存储</text><text class="lbl" text-anchor="middle" x="635" y="46">char data[k]; Block *next;</text><g transform="translate(530,70)"><rect class="meta" height="28" width="210" x="0" y="0"></rect><text text-anchor="middle" x="60" y="18">head ●</text><text text-anchor="middle" x="155" y="18">length = 5</text><path class="ptr" d="M75 28c0 27-25 32-45 52"></path><text class="lbl" text-anchor="middle" x="105" y="46">头指针 + 字符块链表</text><g transform="translate(0,75)"><rect class="block" height="28" width="80" x="10" y="0"></rect><text text-anchor="middle" x="22" y="18">H</text><text text-anchor="middle" x="38" y="18">e</text><text text-anchor="middle" x="54" y="18">l</text><text text-anchor="middle" x="70" y="18">l</text><line stroke="#2e8b57" x1="30" x2="30" y1="0" y2="28"></line><line stroke="#2e8b57" x1="46" x2="46" y1="0" y2="28"></line><line stroke="#2e8b57" x1="62" x2="62" y1="0" y2="28"></line><rect class="block" height="28" width="20" x="90" y="0"></rect><circle cx="100" cy="14" fill="#2e8b57" r="3"></circle><path class="ptr" d="M110 14h20"></path><rect class="block" height="28" width="80" x="130" y="0"></rect><text text-anchor="middle" x="142" y="18">o</text><text text-anchor="middle" x="158" y="18">#</text><text text-anchor="middle" x="174" y="18">#</text><text text-anchor="middle" x="190" y="18">#</text><line stroke="#2e8b57" x1="150" x2="150" y1="0" y2="28"></line><line stroke="#2e8b57" x1="166" x2="166" y1="0" y2="28"></line><line stroke="#2e8b57" x1="182" x2="182" y1="0" y2="28"></line></g><text class="lbl" text-anchor="middle" x="105" y="125">每块容量 k=4；末块用 # 填充</text><text class="lbl" text-anchor="middle" x="105" y="145">特点：易插入删除，存在内碎片</text></g><line stroke="#ddd" x1="250" x2="250" y1="55" y2="225"></line><line stroke="#ddd" x1="505" x2="505" y1="55" y2="225"></line><text fill="#666" font-size="12" text-anchor="middle" x="380" y="248">空间利用率：定长 ≤ 堆分配；插入/删除灵活度：块链 &gt; 堆分配 &gt; 定长</text></svg>