<svg font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#555"></path></marker><marker id="arr-r" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#E74C3C"></path></marker><marker id="arr-g" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#27AE60"></path></marker></defs><text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="200" y="20">Boyer-Moore 投票算法 — 主元素</text><text fill="#AAA" font-size="10" text-anchor="middle" x="20" y="42">0</text><text fill="#AAA" font-size="10" text-anchor="middle" x="90" y="42">1</text><text fill="#AAA" font-size="10" text-anchor="middle" x="160" y="42">2</text><text fill="#AAA" font-size="10" text-anchor="middle" x="230" y="42">3</text><text fill="#AAA" font-size="10" text-anchor="middle" x="300" y="42">4</text><text fill="#AAA" font-size="10" text-anchor="middle" x="370" y="42">5</text><text fill="#AAA" font-size="10" text-anchor="middle" x="440" y="42">6</text><text fill="#AAA" font-size="10" text-anchor="middle" x="510" y="42">7</text><rect fill="#FEF9C0" height="36" rx="5" stroke="#E0BB00" stroke-width="1.5" width="36" x="2" y="47"></rect><text fill="#B8860B" font-size="16" font-weight="bold" text-anchor="middle" x="20" y="71">3</text><rect fill="#FEF9C0" height="36" rx="5" stroke="#E0BB00" stroke-width="1.5" width="36" x="72" y="47"></rect><text fill="#B8860B" font-size="16" font-weight="bold" text-anchor="middle" x="90" y="71">3</text><rect fill="#DEF" height="36" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="36" x="142" y="47"></rect><text fill="#2C7BB6" font-size="16" font-weight="bold" text-anchor="middle" x="160" y="71">4</text><rect fill="#DEF" height="36" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="36" x="212" y="47"></rect><text fill="#2C7BB6" font-size="16" font-weight="bold" text-anchor="middle" x="230" y="71">2</text><rect fill="#FEF9C0" height="36" rx="5" stroke="#E0BB00" stroke-width="1.5" width="36" x="282" y="47"></rect><text fill="#B8860B" font-size="16" font-weight="bold" text-anchor="middle" x="300" y="71">3</text><rect fill="#DEF" height="36" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="36" x="352" y="47"></rect><text fill="#2C7BB6" font-size="16" font-weight="bold" text-anchor="middle" x="370" y="71">1</text><rect fill="#FEF9C0" height="36" rx="5" stroke="#E0BB00" stroke-width="1.5" width="36" x="422" y="47"></rect><text fill="#B8860B" font-size="16" font-weight="bold" text-anchor="middle" x="440" y="71">3</text><rect fill="#FEF9C0" height="36" rx="5" stroke="#E0BB00" stroke-width="1.5" width="36" x="492" y="47"></rect><text fill="#B8860B" font-size="16" font-weight="bold" text-anchor="middle" x="510" y="71">3</text><text fill="#27AE60" font-size="10" text-anchor="middle" x="20" y="98">3/1</text><text fill="#27AE60" font-size="10" text-anchor="middle" x="90" y="98">3/2</text><text fill="#E74C3C" font-size="10" text-anchor="middle" x="160" y="98">3/1</text><text fill="#E74C3C" font-size="10" text-anchor="middle" x="230" y="98">3/0→2/1</text><text fill="#27AE60" font-size="10" text-anchor="middle" x="300" y="98">3/2</text><text fill="#E74C3C" font-size="10" text-anchor="middle" x="370" y="98">3/1</text><text fill="#27AE60" font-size="10" text-anchor="middle" x="440" y="98">3/2</text><text fill="#27AE60" font-size="10" text-anchor="middle" x="510" y="98">3/3</text><text fill="#AAA" font-size="9" text-anchor="middle" x="20" y="109">num/cnt</text><rect fill="#27AE60" height="10" rx="2" width="10" x="570" y="47"></rect><text fill="#555" font-size="11" x="584" y="57">cnt+1（相同）</text><rect fill="#E74C3C" height="10" rx="2" width="10" x="570" y="63"></rect><text fill="#555" font-size="11" x="584" y="73">cnt-1（不同）</text><text fill="#555" font-size="11" x="570" y="90">cnt→0 时更换候选</text><text fill="#B8860B" font-size="11" x="570" y="105">最终候选 = 3</text><text fill="#888" font-size="11" x="20" y="125">① 第一遍扫描（对消法）→ 候选 num = 3</text><text fill="#888" font-size="11" x="20" y="141">② 第二遍验证：出现 5 次 &gt; 8/2 = 4 → 3 是主元素 ✓</text><line stroke="#DDD" stroke-dasharray="5,4" stroke-width="1" x1="0" x2="760" y1="158" y2="158"></line><text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="200" y="178">桶标记（原地哈希） — 未出现的最小正整数</text><text fill="#AAA" font-size="10" text-anchor="middle" x="20" y="200">0</text><text fill="#AAA" font-size="10" text-anchor="middle" x="90" y="200">1</text><text fill="#AAA" font-size="10" text-anchor="middle" x="160" y="200">2</text><text fill="#AAA" font-size="10" text-anchor="middle" x="230" y="200">3</text><rect fill="#FDECEA" height="36" rx="5" stroke="#E74C3C" stroke-width="1.5" width="36" x="2" y="205"></rect><text fill="#E74C3C" font-size="15" font-weight="bold" text-anchor="middle" x="20" y="229">-5</text><rect fill="#DEF" height="36" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="36" x="72" y="205"></rect><text fill="#2C7BB6" font-size="15" font-weight="bold" text-anchor="middle" x="90" y="229">3</text><rect fill="#DEF" height="36" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="36" x="142" y="205"></rect><text fill="#2C7BB6" font-size="15" font-weight="bold" text-anchor="middle" x="160" y="229">2</text><rect fill="#DEF" height="36" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="36" x="212" y="205"></rect><text fill="#2C7BB6" font-size="15" font-weight="bold" text-anchor="middle" x="230" y="229">3</text><text fill="#555" font-size="11" x="310" y="218">① 将范围外的元素置 0</text><rect fill="#F5F5F5" height="36" rx="5" stroke="#AAA" stroke-width="1.5" width="36" x="2" y="205"></rect><text fill="#AAA" font-size="15" font-weight="bold" text-anchor="middle" x="20" y="229">0</text><text fill="#E74C3C" font-size="10" text-anchor="middle" x="20" y="260">-5 → 0</text><text fill="#AAA" font-size="10" text-anchor="middle" x="90" y="260">保留</text><text fill="#AAA" font-size="10" text-anchor="middle" x="160" y="260">保留</text><text fill="#AAA" font-size="10" text-anchor="middle" x="230" y="260">保留</text><text fill="#555" font-size="11" x="310" y="258">② 用下标符号标记出现过的正整数</text><text fill="#555" font-size="11" x="310" y="274">a[3-1]=a[2] 标负；a[2-1]=a[1] 标负</text><rect fill="#F5F5F5" height="36" rx="5" stroke="#AAA" stroke-width="1.5" width="36" x="2" y="280"></rect><text fill="#AAA" font-size="15" font-weight="bold" text-anchor="middle" x="20" y="304">0</text><rect fill="#FDECEA" height="36" rx="5" stroke="#E74C3C" stroke-width="1.5" width="36" x="72" y="280"></rect><text fill="#E74C3C" font-size="15" font-weight="bold" text-anchor="middle" x="90" y="304">-3</text><text fill="#E74C3C" font-size="9" text-anchor="middle" x="90" y="330">2 出现 ✓</text><rect fill="#FDECEA" height="36" rx="5" stroke="#E74C3C" stroke-width="1.5" width="36" x="142" y="280"></rect><text fill="#E74C3C" font-size="15" font-weight="bold" text-anchor="middle" x="160" y="304">-2</text><text fill="#E74C3C" font-size="9" text-anchor="middle" x="160" y="330">3 出现 ✓</text><rect fill="#DEF" height="36" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="36" x="212" y="280"></rect><text fill="#2C7BB6" font-size="15" font-weight="bold" text-anchor="middle" x="230" y="304">+3</text><text fill="#27AE60" font-size="9" text-anchor="middle" x="230" y="330">仍正 → 4 未出现</text><text fill="#555" font-size="11" x="310" y="294">③ 找第一个仍为正数的位置</text><rect fill="none" height="36" rx="5" stroke="#AAA" stroke-width="2" width="36" x="2" y="280"></rect><rect fill="none" height="36" rx="5" stroke="#AAA" stroke-width="2" width="36" x="72" y="280"></rect><rect fill="none" height="36" rx="5" stroke="#AAA" stroke-width="2" width="36" x="142" y="280"></rect><rect fill="none" height="36" rx="5" stroke="#27AE60" stroke-width="3" width="36" x="212" y="280"></rect><text fill="#27AE60" font-size="12" font-weight="bold" x="310" y="310">答：未出现的最小正整数 = 4</tex