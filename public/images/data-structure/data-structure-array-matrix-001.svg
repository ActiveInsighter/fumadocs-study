<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon></marker><linearGradient id="memoryGradient" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#e3f2fd;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1"></stop></linearGradient><linearGradient id="highlightGradient" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#ffecb3;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#fff176;stop-opacity:1"></stop></linearGradient></defs><text fill="#1976d2" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="400" y="25">多维数组的存储方式与地址计算</text><text fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="50" y="65">二维数组逻辑视图 (3×4 数组)</text><g transform="translate(50, 75)"><text fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="-15" y="45">i=0</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="-15" y="75">i=1</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="-15" y="105">i=2</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="15" y="15">j=0</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="45" y="15">j=1</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="75" y="15">j=2</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="105" y="15">j=3</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="0" y="30"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="15" y="47">[0][0]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="30" y="30"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="45" y="47">[0][1]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="60" y="30"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="75" y="47">[0][2]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="90" y="30"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="105" y="47">[0][3]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="0" y="60"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="15" y="77">[1][0]</text><rect fill="url(#highlightGradient)" height="25" stroke="#ff9800" stroke-width="2" width="30" x="30" y="60"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="45" y="77">[1][1]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="60" y="60"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="75" y="77">[1][2]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="90" y="60"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="105" y="77">[1][3]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="0" y="90"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="15" y="107">[2][0]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="30" y="90"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="45" y="107">[2][1]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="60" y="90"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="75" y="107">[2][2]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="90" y="90"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="105" y="107">[2][3]</text></g><line marker-end="url(#arrowhead)" stroke="#333" stroke-width="2" x1="200" x2="280" y1="150" y2="150"></line><text fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="240" y="135">按行优先存储</text><text fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="300" y="65">内存中的一维线性存储</text><g transform="translate(300, 80)"><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="15" y="30">A</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="45" y="30">A+B</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="75" y="30">A+2B</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="105" y="30">A+3B</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="135" y="30">A+4B</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="165" y="30">A+5B</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="0" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="15" y="62">[0][0]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="30" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="45" y="62">[0][1]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="60" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="75" y="62">[0][2]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="90" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="105" y="62">[0][3]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="120" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="135" y="62">[1][0]</text><rect fill="url(#highlightGradient)" height="25" stroke="#ff9800" stroke-width="2" width="30" x="150" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" x="165" y="62">[1][1]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="180" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="195" y="62">[1][2]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="210" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="225" y="62">[1][3]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="240" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="255" y="62">[2][0]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="270" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="285" y="62">[2][1]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="300" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="315" y="62">[2][2]</text><rect fill="url(#memoryGradient)" height="25" stroke="#1976d2" stroke-width="1" width="30" x="330" y="45"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="345" y="62">[2][3]</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="15" y="85">0</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="45" y="85">1</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="75" y="85">2</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="105" y="85">3</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="135" y="85">4</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="165" y="85">5</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="195" y="85">6</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="225" y="85">7</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="255" y="85">8</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="285" y="85">9</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="315" y="85">10</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="345" y="85">11</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="180" y="105">一维数组索引</text></g><rect fill="#f5f5f5" height="180" rx="5" stroke="#ddd" stroke-width="1" width="700" x="50" y="230"></rect><text fill="#1976d2" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="255">地址计算公式</text><text fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="70" y="285">Addr(a[i][j]) = A + (i × C + j) × B</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" x="70" y="315">其中：</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" x="90" y="335">• A = 数组起始地址</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" x="90" y="355">• B = 每个元素占用的字节数</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" x="90" y="375">• C = 数组的列数（本例中 C = 4）</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" x="90" y="395">• i, j = 行索引和列索引</text><text fill="#ff9800" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="450" y="315">计算 a[1][1] 的地址：</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" x="470" y="335">i = 1, j = 1, C = 4</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" x="470" y="355">线性索引 = i × C + j = 1 × 4 + 1 = 5</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" x="470" y="375">地址 = A + 5 × B</text><text fill="#666" font-family="Arial, sans-serif" font-size="11" x="470" y="395">（对应一维数组中的第5个位置）</text></svg>