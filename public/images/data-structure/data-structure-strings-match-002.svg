<svg viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg"><defs><style>.title{font-family:microsoft yahei,Arial,sans-serif;font-size:18px;font-weight:700;fill:#2c3e50}.subtitle{font-family:microsoft yahei,Arial,sans-serif;font-size:14px;fill:#34495e}.char-box{stroke:#3498db;stroke-width:2;fill:#ecf0f1}.char-text{font-family:courier new,monospace;font-size:16px;font-weight:700;text-anchor:middle;fill:#2c3e50}.prefix-highlight{fill:#e74c3c;opacity:.3}.suffix-highlight{fill:#27ae60;opacity:.3}.overlap-highlight{fill:#f39c12;opacity:.5}.label{font-family:microsoft yahei,Arial,sans-serif;font-size:12px;fill:#7f8c8d}.key-text{font-family:microsoft yahei,Arial,sans-serif;font-size:12px;fill:#e74c3c;font-weight:700}.arrow{stroke:#95a5a6;stroke-width:2;fill:none;marker-end:url(#arrowhead)}.bracket{stroke:#34495e;stroke-width:2;fill:none}</style><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#95a5a6" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text class="title" text-anchor="middle" x="400" y="30">前后缀概念图解 - 字符串 "abcdabc"</text><g transform="translate(200, 70)"><rect class="char-box" height="40" width="40" x="0" y="0"></rect><rect class="char-box" height="40" width="40" x="40" y="0"></rect><rect class="char-box" height="40" width="40" x="80" y="0"></rect><rect class="char-box" height="40" width="40" x="120" y="0"></rect><rect class="char-box" height="40" width="40" x="160" y="0"></rect><rect class="char-box" height="40" width="40" x="200" y="0"></rect><rect class="char-box" height="40" width="40" x="240" y="0"></rect><text class="char-text" x="20" y="26">a</text><text class="char-text" x="60" y="26">b</text><text class="char-text" x="100" y="26">c</text><text class="char-text" x="140" y="26">d</text><text class="char-text" x="180" y="26">a</text><text class="char-text" x="220" y="26">b</text><text class="char-text" x="260" y="26">c</text><text class="label" text-anchor="middle" x="20" y="55">0</text><text class="label" text-anchor="middle" x="60" y="55">1</text><text class="label" text-anchor="middle" x="100" y="55">2</text><text class="label" text-anchor="middle" x="140" y="55">3</text><text class="label" text-anchor="middle" x="180" y="55">4</text><text class="label" text-anchor="middle" x="220" y="55">5</text><text class="label" text-anchor="middle" x="260" y="55">6</text></g><g transform="translate(50, 150)"><text class="subtitle" x="0" y="0">前缀 (Prefix):</text><text class="label" x="0" y="20">从字符串开头开始的子串</text><g transform="translate(0, 40)"><rect class="prefix-highlight" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><text class="char-text" x="20" y="20">a</text><text class="key-text" x="50" y="20">"a" (长度1)</text></g><g transform="translate(0, 80)"><rect class="prefix-highlight" height="30" width="40" x="0" y="0"></rect><rect class="prefix-highlight" height="30" width="40" x="40" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="40" y="0"></rect><text class="char-text" x="20" y="20">a</text><text class="char-text" x="60" y="20">b</text><text class="key-text" x="90" y="20">"ab" (长度2)</text></g><g transform="translate(0, 120)"><rect class="prefix-highlight" height="30" width="40" x="0" y="0"></rect><rect class="prefix-highlight" height="30" width="40" x="40" y="0"></rect><rect class="prefix-highlight" height="30" width="40" x="80" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="40" y="0"></rect><rect class="char-box" height="30" width="40" x="80" y="0"></rect><text class="char-text" x="20" y="20">a</text><text class="char-text" x="60" y="20">b</text><text class="char-text" x="100" y="20">c</text><text class="key-text" x="130" y="20">"abc" (长度3)</text></g><g transform="translate(0, 160)"><rect class="prefix-highlight" height="30" width="40" x="0" y="0"></rect><rect class="prefix-highlight" height="30" width="40" x="40" y="0"></rect><rect class="prefix-highlight" height="30" width="40" x="80" y="0"></rect><rect class="prefix-highlight" height="30" width="40" x="120" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="40" y="0"></rect><rect class="char-box" height="30" width="40" x="80" y="0"></rect><rect class="char-box" height="30" width="40" x="120" y="0"></rect><text class="char-text" x="20" y="20">a</text><text class="char-text" x="60" y="20">b</text><text class="char-text" x="100" y="20">c</text><text class="char-text" x="140" y="20">d</text><text class="key-text" x="170" y="20">"abcd" (长度4)</text></g></g><g transform="translate(450, 150)"><text class="subtitle" x="0" y="0">后缀 (Suffix):</text><text class="label" x="0" y="20">到字符串末尾结束的子串</text><g transform="translate(0, 40)"><rect class="suffix-highlight" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><text class="char-text" x="20" y="20">c</text><text class="key-text" x="50" y="20">"c" (长度1)</text></g><g transform="translate(0, 80)"><rect class="suffix-highlight" height="30" width="40" x="0" y="0"></rect><rect class="suffix-highlight" height="30" width="40" x="40" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="40" y="0"></rect><text class="char-text" x="20" y="20">b</text><text class="char-text" x="60" y="20">c</text><text class="key-text" x="90" y="20">"bc" (长度2)</text></g><g transform="translate(0, 120)"><rect class="suffix-highlight" height="30" width="40" x="0" y="0"></rect><rect class="suffix-highlight" height="30" width="40" x="40" y="0"></rect><rect class="suffix-highlight" height="30" width="40" x="80" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="40" y="0"></rect><rect class="char-box" height="30" width="40" x="80" y="0"></rect><text class="char-text" x="20" y="20">a</text><text class="char-text" x="60" y="20">b</text><text class="char-text" x="100" y="20">c</text><text class="key-text" x="130" y="20">"abc" (长度3)</text></g><g transform="translate(0, 160)"><rect class="suffix-highlight" height="30" width="40" x="0" y="0"></rect><rect class="suffix-highlight" height="30" width="40" x="40" y="0"></rect><rect class="suffix-highlight" height="30" width="40" x="80" y="0"></rect><rect class="suffix-highlight" height="30" width="40" x="120" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="40" y="0"></rect><rect class="char-box" height="30" width="40" x="80" y="0"></rect><rect class="char-box" height="30" width="40" x="120" y="0"></rect><text class="char-text" x="20" y="20">d</text><text class="char-text" x="60" y="20">a</text><text class="char-text" x="100" y="20">b</text><text class="char-text" x="140" y="20">c</text><text class="key-text" x="170" y="20">"dabc" (长度4)</text></g></g><g transform="translate(100, 420)"><text class="title" text-anchor="middle" x="300" y="0">关键发现：相同的前后缀</text><g transform="translate(200, 30)"><rect class="overlap-highlight" height="30" width="40" x="0" y="0"></rect><rect class="overlap-highlight" height="30" width="40" x="40" y="0"></rect><rect class="overlap-highlight" height="30" width="40" x="80" y="0"></rect><rect class="char-box" height="30" width="40" x="0" y="0"></rect><rect class="char-box" height="30" width="40" x="40" y="0"></rect><rect class="char-box" height="30" width="40" x="80" y="0"></rect><text class="char-text" x="20" y="20">a</text><text class="char-text" x="60" y="20">b</text><text class="char-text" x="100" y="20">c</text><text class="key-text" text-anchor="middle" x="60" y="-10">前缀 "abc"</text><line class="arrow" x1="60" x2="60" y1="45" y2="65"></line><rect class="overlap-highlight" height="30" width="40" x="0" y="80"></rect><rect class="overlap-highlight" height="30" width="40" x="40" y="80"></rect><rect class="overlap-highlight" height="30" width="40" x="80" y="80"></rect><rect class="char-box" height="30" width="40" x="0" y="80"></rect><rect class="char-box" height="30" width="40" x="40" y="80"></rect><rect class="char-box" height="30" width="40" x="80" y="80"></rect><text class="char-text" x="20" y="100">a</text><text class="char-text" x="60" y="100">b</text><text class="char-text" x="100" y="100">c</text><text class="key-text" text-anchor="middle" x="60" y="130">后缀 "abc"</text></g><text class="subtitle" text-anchor="middle" x="300" y="180">在 "abcdabc" 中，"abc" 既是前缀也是后缀</text><text class="subtitle" text-anchor="middle" x="300" y="200">这就是 KMP 算法的核心思想！</text><text class="label" text-anchor="middle" x="300" y="220">当匹配失败时，我们可以利用这个信息跳过一些不必要的比较</text></g></svg>