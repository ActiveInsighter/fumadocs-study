<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="none" height="600" width="800"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">AOE网络中的活动时间余量</text><g transform="translate(50, 70)"><circle cx="80" cy="150" fill="var(--indigo-mid)" r="25" stroke="var(--blue-deep)" stroke-width="2"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="80" y="140">V1</text><text fill="var(--surface)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="80" y="160">0/0</text><circle cx="250" cy="100" fill="var(--indigo-mid)" r="25" stroke="var(--blue-deep)" stroke-width="2"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="250" y="90">Vi</text><text fill="var(--surface)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="250" y="110">ve(i)</text><circle cx="450" cy="100" fill="var(--indigo-mid)" r="25" stroke="var(--blue-deep)" stroke-width="2"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="450" y="90">Vj</text><text fill="var(--surface)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="450" y="110">vl(j)</text><circle cx="600" cy="150" fill="var(--indigo-mid)" r="25" stroke="var(--blue-deep)" stroke-width="2"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="600" y="140">Vn</text><text fill="var(--surface)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="600" y="160">T/T</text><path d="M105 150H575" marker-end="url(#arrowRed)" stroke="var(--red-deep)" stroke-width="4"></path><text fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="340" y="170">关键路径（余量=0）</text><path d="M275 1e2H425" marker-end="url(#arrowGreen)" stroke="var(--green-mid)" stroke-width="3"></path><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="350" y="85">A(i→j)</text><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="350" y="75">dij</text><path d="M105 140l120-30" marker-end="url(#arrowGray)" stroke="var(--ink-soft)" stroke-width="2"></path><path d="M475 110l1e2 30" marker-end="url(#arrowGray)" stroke="var(--ink-soft)" stroke-width="2"></path></g><defs><marker id="arrowRed" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--red-deep)" points="0 0, 10 3, 0 6"></polygon></marker><marker id="arrowGreen" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--green-mid)" points="0 0, 10 3, 0 6"></polygon></marker><marker id="arrowGray" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="2.5"><polygon fill="var(--ink-soft)" points="0 0, 8 2.5, 0 5"></polygon></marker></defs><g transform="translate(50, 280)"><rect fill="var(--neutral-soft)" height="120" rx="8" stroke="var(--indigo-light)" stroke-width="1" width="700" x="0" y="0"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="350" y="25">时间余量计算公式</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="350" y="50">时间余量 = vl(j) - ve(i) - dij</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="50" y="75">• ve(i)：事件i的最早发生时间</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="50" y="95">• vl(j)：事件j的最晚发生时间</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="350" y="75">• dij：活动A(i→j)的持续时间</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="350" y="95">• 关键路径上的活动：时间余量 = 0</text></g><g transform="translate(50, 420)"><rect fill="var(--surface)" height="140" rx="8" stroke="var(--indigo-mid)" stroke-width="2" width="700" x="0" y="0"></rect><text fill="var(--indigo-mid)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="350" y="25">示例计算</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="50" y="50">假设：ve(i) = 5天，vl(j) = 12天，dij = 3天</text><text fill="var(--green-mid)" font-size="var(--svg-font-size-label)" x="50" y="70">时间余量 = 12 - 5 - 3 = 4天</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" x="50" y="95">含义：活动A(i→j)可以延迟最多4天而不影响项目总工期</text><g transform="translate(450, 45)"><line stroke="var(--blue-ink)" stroke-width="2" x1="0" x2="200" y1="20" y2="20"></line><line stroke="var(--green-mid)" stroke-width="2" x1="25" x2="25" y1="15" y2="25"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="25" y="10">ve(i)=5</text><rect fill="var(--yellow-mid)" height="6" opacity=".7" width="45" x="25" y="17"></rect><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="47" y="33">3天</text><rect fill="var(--neutral-mid)" height="6" opacity=".5" width="60" x="70" y="17"></rect><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="100" y="40">余量4天</text><line stroke="var(--red-deep)" stroke-width="2" x1="130" x2="130" y1="15" y2="25"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="130" y="10">vl(j)=12</text></g></g><g transform="translate(520, 40)"><rect fill="var(--amber-soft)" height="100" rx="5" stroke="var(--yellow-mid)" stroke-width="1" width="230" x="0" y="0"></rect><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="115" y="20">💡 关键理解</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" x="10" y="40">• 时间余量 &gt; 0：非关键活动</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" x="10" y="55">• 时间余量 = 0：关键活动</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" x="10" y="70">• 余量越大，调度灵活性越高</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" x="10" y="85">• 关键路径决定项目最短工期</text></g></svg>