<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="none" height="500" width="900"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="450" y="25">KMP 算法 - 修正后的 next 数组（nextval）</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="50" y="55">问题：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="100" y="55">当 pattern[i] == pattern[next[i]] 时，会重复比较已经失败过的字符</text><text fill="var(--green-mid)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="50" y="75">解决：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="100" y="75">nextval 避免跳转到与当前位置字符相同的位置</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="50" y="110">示例：pattern = "ababaa"</text><g transform="translate(50, 130)"><rect fill="var(--indigo-mid)" height="25" stroke="var(--blue-ink)" width="60" x="0" y="0"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="30" y="17">字符</text><rect fill="var(--indigo-mid)" height="25" stroke="var(--blue-ink)" width="60" x="60" y="0"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="17">索引</text><rect fill="var(--indigo-mid)" height="25" stroke="var(--blue-ink)" width="60" x="120" y="0"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="17">next</text><rect fill="var(--orange-mid)" height="25" stroke="var(--blue-ink)" width="80" x="180" y="0"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="17">nextval</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="0" y="25"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="30" y="42">a</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="60" y="25"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="42">0</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="120" y="25"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="150" y="42">-1</text><rect fill="var(--amber-soft)" height="25" stroke="var(--blue-ink)" width="80" x="180" y="25"></rect><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="42">-1</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="0" y="50"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="30" y="67">b</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="60" y="50"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="67">1</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="120" y="50"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="150" y="67">0</text><rect fill="var(--amber-soft)" height="25" stroke="var(--blue-ink)" width="80" x="180" y="50"></rect><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="67">0</text><rect fill="var(--yellow-light)" height="25" stroke="var(--blue-ink)" stroke-width="2" width="60" x="0" y="75"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="30" y="92">a</text><rect fill="var(--yellow-light)" height="25" stroke="var(--blue-ink)" stroke-width="2" width="60" x="60" y="75"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="92">2</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="120" y="75"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="150" y="92">0</text><rect fill="var(--cyan-light)" height="25" stroke="var(--cyan-ink)" stroke-width="2" width="80" x="180" y="75"></rect><text fill="var(--cyan-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="92">-1</text><rect fill="var(--yellow-light)" height="25" stroke="var(--blue-ink)" stroke-width="2" width="60" x="0" y="100"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="30" y="117">b</text><rect fill="var(--yellow-light)" height="25" stroke="var(--blue-ink)" stroke-width="2" width="60" x="60" y="100"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="117">3</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="120" y="100"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="150" y="117">1</text><rect fill="var(--cyan-light)" height="25" stroke="var(--cyan-ink)" stroke-width="2" width="80" x="180" y="100"></rect><text fill="var(--cyan-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="117">0</text><rect fill="var(--yellow-light)" height="25" stroke="var(--blue-ink)" stroke-width="2" width="60" x="0" y="125"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="30" y="142">a</text><rect fill="var(--yellow-light)" height="25" stroke="var(--blue-ink)" stroke-width="2" width="60" x="60" y="125"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="142">4</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="120" y="125"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="150" y="142">2</text><rect fill="var(--cyan-light)" height="25" stroke="var(--cyan-ink)" stroke-width="2" width="80" x="180" y="125"></rect><text fill="var(--cyan-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="142">-1</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="0" y="150"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="30" y="167">a</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="60" y="150"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="167">5</text><rect fill="var(--surface)" height="25" stroke="var(--blue-ink)" width="60" x="120" y="150"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="150" y="167">3</text><rect fill="var(--amber-soft)" height="25" stroke="var(--blue-ink)" width="80" x="180" y="150"></rect><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="167">3</text></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--red-deep)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="2" x1="340" x2="290" y1="217" y2="217"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="345" y="220">a = a，优化为 -1</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="2" x1="340" x2="290" y1="242" y2="242"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="345" y="245">b = b，优化为 0</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="2" x1="340" x2="290" y1="267" y2="267"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="345" y="270">a = a，优化为 -1</text><g transform="translate(460, 100)"><rect fill="var(--surface)" height="150" rx="5" stroke="var(--blue-soft)" stroke-dasharray="5,5" width="360" x="0" y="0"></rect><text fill="var(--sky-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="10" y="20">优化过程说明：</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-label)" x="10" y="42">• nextval[2]：pattern[2] = 'a'，pattern[next[2]] = 'a'</text><text fill="var(--lime-mid)" font-size="var(--svg-font-size-label)" x="20" y="58">→ nextval[2] = nextval[0] = -1</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-label)" x="10" y="78">• nextval[3]：pattern[3] = 'b'，pattern[next[3]] = 'b'</text><text fill="var(--lime-mid)" font-size="var(--svg-font-size-label)" x="20" y="94">→ nextval[3] = nextval[1] = 0</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-label)" x="10" y="114">• nextval[4]：pattern[4] = 'a'，pattern[next[4]] = 'a'</text><text fill="var(--lime-mid)" font-size="var(--svg-font-size-label)" x="20" y="130">→ nextval[4] = nextval[2] = -1</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" x="10" y="142">nextval[5]：'a' ≠ pattern[3] 的 'b'，因此保留 3</text></g><g transform="translate(50, 320)"><rect fill="var(--sky-soft)" height="80" rx="5" stroke="var(--violet-deep)" width="800" x="0" y="0"></rect><text fill="var(--violet-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="10" y="20">nextval 计算规则：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="10" y="40">if (next[i] == -1) nextval[i] = -1;</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="10" y="56">else if (pattern[i] == pattern[next[i]]) nextval[i] = nextval[next[i]];</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="10" y="72">else nextval[i] = next[i];</text></g><g transform="translate(50, 420)"><rect fill="var(--green-light)" height="60" rx="5" stroke="var(--lime-mid)" width="800" x="0" y="0"></rect><text fill="var(--green-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="10" y="20">nextval 的优势：</text><text fill="var(--green-deep)" font-size="var(--svg-font-size-label)" x="10" y="38">• 匹配失败后，不再跳转到与当前位置字符相同的位置</text><text fill="var(--green-deep)" font-size="var(--svg-font-size-label)" x="10" y="53">• 对包含大量重复字符的模式串，可以减少无意义的重复比较</text></g></svg>