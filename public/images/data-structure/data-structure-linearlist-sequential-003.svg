<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.array-cell{fill:#e3f2fd;stroke:#1976d2;stroke-width:2}.array-cell-highlight{fill:#ffeb3b;stroke:#f57f17;stroke-width:3}.array-cell-new{fill:#c8e6c9;stroke:#388e3c;stroke-width:3}.array-text{font-family:Arial,sans-serif;font-size:14px;text-anchor:middle;dominant-baseline:middle}.title-text{font-family:Arial,sans-serif;font-size:16px;font-weight:700;text-anchor:middle}.step-text{font-family:Arial,sans-serif;font-size:14px;font-weight:700}.arrow{stroke:#f44336;stroke-width:2;fill:none;marker-end:url(#arrowhead)}.move-arrow{stroke:#ff9800;stroke-width:2;fill:none;marker-end:url(#arrowhead2)}</style><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#f44336" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead2" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#ff9800" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text class="title-text" fill="#1976d2" x="400" y="30">顺序表插入过程图解：在位置 3 插入元素 99</text><text class="step-text" fill="#333" x="50" y="40">步骤1：初始状态</text><g transform="translate(50, 100)"><rect class="array-cell" height="40" width="50" x="0" y="0"></rect><rect class="array-cell" height="40" width="50" x="50" y="0"></rect><rect class="array-cell" height="40" width="50" x="100" y="0"></rect><rect class="array-cell" height="40" width="50" x="150" y="0"></rect><rect class="array-cell" height="40" width="50" x="200" y="0"></rect><rect height="40" style="fill:#f5f5f5;stroke:#ccc;stroke-width:1" width="50" x="250" y="0"></rect><rect height="40" style="fill:#f5f5f5;stroke:#ccc;stroke-width:1" width="50" x="300" y="0"></rect><text class="array-text" x="25" y="20">10</text><text class="array-text" x="75" y="20">20</text><text class="array-text" x="125" y="20">30</text><text class="array-text" x="175" y="20">40</text><text class="array-text" x="225" y="20">50</text><text class="array-text" fill="#666" font-size="12" x="25" y="55">1</text><text class="array-text" fill="#666" font-size="12" x="75" y="55">2</text><text class="array-text" fill="#666" font-size="12" x="125" y="55">3</text><text class="array-text" fill="#666" font-size="12" x="175" y="55">4</text><text class="array-text" fill="#666" font-size="12" x="225" y="55">5</text><text class="array-text" fill="#666" font-size="12" x="275" y="55">6</text><text class="array-text" fill="#666" font-size="12" x="325" y="55">7</text><text class="step-text" fill="#666" x="400" y="20">length = 5</text></g><line class="arrow" x1="175" x2="175" y1="85" y2="95"></line><text class="array-text" fill="#f44336" font-weight="bold" x="175" y="65">插入位置 pos=3</text><text class="step-text" fill="#333" x="50" y="200">步骤2：从尾部开始，向后移动元素</text><g transform="translate(50, 240)"><rect class="array-cell" height="40" width="50" x="0" y="0"></rect><rect class="array-cell" height="40" width="50" x="50" y="0"></rect><rect class="array-cell" height="40" width="50" x="100" y="0"></rect><rect class="array-cell" height="40" width="50" x="150" y="0"></rect><rect class="array-cell-highlight" height="40" width="50" x="200" y="0"></rect><rect class="array-cell-highlight" height="40" width="50" x="250" y="0"></rect><rect height="40" style="fill:#f5f5f5;stroke:#ccc;stroke-width:1" width="50" x="300" y="0"></rect><text class="array-text" x="25" y="20">10</text><text class="array-text" x="75" y="20">20</text><text class="array-text" x="125" y="20">30</text><text class="array-text" x="175" y="20">40</text><text class="array-text" x="225" y="20">50</text><text class="array-text" x="275" y="20">50</text><path class="move-arrow" d="M215-15q12-10 35 10"></path><text class="array-text" fill="#ff9800" font-size="12" x="237" y="-30">移动</text></g><g transform="translate(50, 300)"><rect class="array-cell" height="40" width="50" x="0" y="0"></rect><rect class="array-cell" height="40" width="50" x="50" y="0"></rect><rect class="array-cell" height="40" width="50" x="100" y="0"></rect><rect class="array-cell-highlight" height="40" width="50" x="150" y="0"></rect><rect class="array-cell-highlight" height="40" width="50" x="200" y="0"></rect><rect class="array-cell" height="40" width="50" x="250" y="0"></rect><rect height="40" style="fill:#f5f5f5;stroke:#ccc;stroke-width:1" width="50" x="300" y="0"></rect><text class="array-text" x="25" y="20">10</text><text class="array-text" x="75" y="20">20</text><text class="array-text" x="125" y="20">30</text><text class="array-text" x="175" y="20">40</text><text class="array-text" x="225" y="20">40</text><text class="array-text" x="275" y="20">50</text><path class="move-arrow" d="M165-15q12-10 35 10"></path><text class="array-text" fill="#ff9800" font-size="12" x="187" y="-30">移动</text></g><g transform="translate(50, 360)"><rect class="array-cell" height="40" width="50" x="0" y="0"></rect><rect class="array-cell" height="40" width="50" x="50" y="0"></rect><rect class="array-cell-highlight" height="40" width="50" x="100" y="0"></rect><rect class="array-cell-highlight" height="40" width="50" x="150" y="0"></rect><rect class="array-cell" height="40" width="50" x="200" y="0"></rect><rect class="array-cell" height="40" width="50" x="250" y="0"></rect><rect height="40" style="fill:#f5f5f5;stroke:#ccc;stroke-width:1" width="50" x="300" y="0"></rect><text class="array-text" x="25" y="20">10</text><text class="array-text" x="75" y="20">20</text><text class="array-text" x="125" y="20">30</text><text class="array-text" x="175" y="20">30</text><text class="array-text" x="225" y="20">40</text><text class="array-text" x="275" y="20">50</text><path class="move-arrow" d="M115-15q12-10 35 10"></path><text class="array-text" fill="#ff9800" font-size="12" x="137" y="-30">移动</text></g><text class="step-text" fill="#333" x="50" y="440">步骤3：插入新元素并更新长度</text><g transform="translate(50, 480)"><rect class="array-cell" height="40" width="50" x="0" y="10"></rect><rect class="array-cell" height="40" width="50" x="50" y="10"></rect><rect class="array-cell-new" height="40" width="50" x="100" y="10"></rect><rect class="array-cell" height="40" width="50" x="150" y="10"></rect><rect class="array-cell" height="40" width="50" x="200" y="10"></rect><rect class="array-cell" height="40" width="50" x="250" y="10"></rect><rect height="40" style="fill:#f5f5f5;stroke:#ccc;stroke-width:1" width="50" x="300" y="10"></rect><text class="array-text" x="25" y="30">10</text><text class="array-text" x="75" y="30">20</text><text class="array-text" fill="#388e3c" font-weight="bold" x="125" y="30">99</text><text class="array-text" x="175" y="30">30</text><text class="array-text" x="225" y="30">40</text><text class="array-text" x="275" y="30">50</text><line class="arrow" x1="125" x2="125" y1="-5" y2="5"></line><text class="array-text" fill="#f44336" font-weight="bold" x="125" y="-25">新元素 99</text><text class="step-text" fill="#666" x="400" y="30">length = 6</text></g><rect fill="#fff3e0" height="200" stroke="#ff9800" width="320" x="470" y="200"></rect><text class="step-text" fill="#e65100" x="600" y="220">关键要点：</text><text class="array-text" fill="#333" font-size="13" text-anchor="start" x="620" y="245">1. 检查插入位置合法性：1 ≤ pos ≤ length+1</text><text class="array-text" fill="#333" font-size="13" text-anchor="start" x="620" y="265">2. 检查数组是否已满：length &lt; MAXSIZE</text><text class="array-text" fill="#333" font-size="13" text-anchor="start" x="620" y="285">3. 从后往前移动元素，避免覆盖</text><text class="array-text" fill="#333" font-size="13" text-anchor="start" x="620" y="305">4. 循环：for (i = length; i ≥ pos; i--)</text><text class="array-text" fill="#333" font-size="13" text-anchor="start" x="620" y="325">5. 移动操作：data[i] = data[i-1]</text><text class="array-text" fill="#333" font-size="13" text-anchor="start" x="620" y="345">6. 插入新元素：data[pos-1] = e</text><text class="array-text" fill="#333" font-size="13" text-anchor="start" x="620" y="365">7. 更新长度：length++</text><text class="array-text" fill="#e65100" font-size="13" font-weight="bold" text-anchor="start" x="620" y="385">时间复杂度：O(n)</text></svg>