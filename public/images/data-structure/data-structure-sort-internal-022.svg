aseline:central" text-anchor="middle" x="555" y="386">缩小步长</text><text dominant-baseline="central" style="fill:#993c1d;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="555" y="408">gap = gap / 2</text></g><path d="M555 368V268H470" fill="none" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"></path><text style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto" text-anchor="middle" x="356" y="468">是</text><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="446" y2="496"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="44" rx="8" stroke-width=".5" style="fill:#f1efe8;stroke:#5f5e5a;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="180" x="250" y="496"></rect><text dominant-baseline="central" style="fill:#444441;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="518">排序完成</text></g></svg>