<svg role="img" style="" viewBox="0 0 680 580" width="100%" xmlns="http://www.w3.org/2000/svg"><title style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">希尔排序流程图</title><desc style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">展示希尔排序算法的执行流程：确定初始步长、分组插入排序、缩小步长并循环，直至步长为1完成排序</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path d="M2 1 8 5 2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></marker></defs><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="44" rx="8" stroke-width=".5" style="fill:#f1efe8;stroke:#5f5e5a;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="180" x="250" y="40"></rect><text dominant-baseline="central" style="fill:#444441;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="62">开始</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="84" y2="134"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="56" rx="8" stroke-width=".5" style="fill:#e1f5ee;stroke:#0f6e56;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="220" x="230" y="134"></rect><text dominant-baseline="central" style="fill:#085041;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="152">确定初始步长</text><text dominant-baseline="central" style="fill:#0f6e56;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="174">gap = n / 2</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="190" y2="240"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="56" rx="8" stroke-width=".5" style="fill:#e1f5ee;stroke:#0f6e56;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="260" x="210" y="240"></rect><text dominant-baseline="central" style="fill:#085041;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="258">分组插入排序</text><text dominant-baseline="central" style="fill:#0f6e56;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="280">对相距 gap 的元素分组排序</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="296" y2="346"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><polygon points="340,346 440,396 340,446 240,396" stroke-width=".5" style="fill:#faeeda;stroke:#854f0b;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-s