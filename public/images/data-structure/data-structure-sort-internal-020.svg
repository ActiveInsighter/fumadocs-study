<svg role="img" style="" viewBox="0 0 680 796" width="100%" xmlns="http://www.w3.org/2000/svg"><title style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">堆排序流程图</title><desc style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">展示堆排序的主要步骤：构建初始大顶堆、交换堆顶与末尾元素、收缩未排序区间、对新堆顶下滑调整、判断未排序区间是否大于1，循环直到排序完成。</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path d="M2 1 8 5 2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></marker></defs><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="44" rx="8" stroke-width=".5" style="fill:#f1efe8;stroke:#5f5e5a;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="320" x="180" y="40"></rect><text dominant-baseline="central" style="fill:#444441;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="62">待排序数组</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="84" y2="144"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="56" rx="8" stroke-width=".5" style="fill:#e1f5ee;stroke:#0f6e56;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="320" x="180" y="144"></rect><text dominant-baseline="central" style="fill:#085041;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="162">构建初始大顶堆</text><text dominant-baseline="central" style="fill:#0f6e56;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="180">从最后一个非叶结点开始下滑</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="200" y2="260"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="56" rx="8" stroke-width=".5" style="fill:#faece7;stroke:#993c1d;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="320" x="180" y="260"></rect><text dominant-baseline="central" style="fill:#712b13;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="278">交换堆顶与末尾元素</text><text dominant-baseline="central" style="fill:#993c1d;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="296">堆顶最大值归位到末尾</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="316" y2="376"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="56" rx="8" stroke-width=".5" style="fill:#faece7;stroke:#993c1d;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="320" x="180" y="376"></rect><text dominant-baseline="central" style="fill:#712b13;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="394">未排序区间长度减一</text><text dominant-baseline="central" style="fill:#993c1d;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="412">该元素视为已排序</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="432" y2="492"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="56" rx="8" stroke-width=".5" style="fill:#e1f5ee;stroke:#0f6e56;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="320" x="180" y="492"></rect><text dominant-baseline="central" style="fill:#085041;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="510">对新堆顶执行下滑调整</text><text dominant-baseline="central" style="fill:#0f6e56;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="528">恢复大顶堆性质</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="548" y2="608"></line><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="44" rx="8" stroke-width=".5" style="fill:#f1efe8;stroke:#5f5e5a;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="320" x="180" y="608"></rect><text dominant-baseline="central" style="fill:#444441;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="630">未排序区间长度 &gt; 1 ?</text></g><line marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" x1="340" x2="340" y1="652" y2="712"></line><text dominant-baseline="central" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central" x="352" y="686">否</text><path d="M5e2 630h60V288H5e2" fill="none" marker-end="url(#arrow)" stroke="var(--t)" stroke-width="1.5" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"></path><text dominant-baseline="central" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central" x="566" y="460">是</text><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect height="44" rx="8" stroke-width=".5" style="fill:#f1efe8;stroke:#5f5e5a;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto" width="320" x="180" y="712"></rect><text dominant-baseline="central" style="fill:#444441;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central" text-anchor="middle" x="340" y="734">排序完成，序列有序</text></g></svg>