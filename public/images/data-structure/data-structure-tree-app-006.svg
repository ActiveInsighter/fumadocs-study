<svg height="583pt" viewBox="0 0 542.5 583" width="543pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><g class="graph" id="graph0" transform="scale(1 1) rotate(0) translate(4 579)"><title>HuffmanTreeConstruction</title><g class="cluster" id="clust1"><title>cluster_example</title><polygon fill="transparent" points="370.5,-8 370.5,-313 526.5,-313 526.5,-8 370.5,-8" stroke="#000" stroke-dasharray="5,2"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="448.5" y="-297.8">构建示例</text></g><g class="node" id="node1"><title>start</title><polygon fill="#90ee90" points="314.5,-575 260.5,-575 260.5,-539 314.5,-539 314.5,-575" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="287.5" y="-553.9">开始</text></g><g class="node" id="node2"><title>init</title><polygon fill="#add8e6" points="344,-502 231,-502 231,-455 344,-455 344,-502" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="287.5" y="-488.4">创建森林</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="287.5" y="-475.4">每个数据符号作为</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="287.5" y="-462.4">单节点树</text></g><g class="edge" id="edge1"><title>start-&gt;init</title><path d="M287.5-538.64c0 7.88.0 17.46.0 26.6" fill="none" stroke="#000"></path><polygon fill="#000" points="291,-512.02 287.5,-502.02 284,-512.02 291,-512.02" stroke="#000"></polygon></g><g class="node" id="node3"><title>check</title><polygon fill="#ffffe0" points="213.5,-418 124.5,-384 213.5,-350 302.5,-384 213.5,-418" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="213.5" y="-387.4">森林中是否</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="213.5" y="-374.4">只剩一棵树？</text></g><g class="edge" id="edge2"><title>init-&gt;check</title><path d="M269.21-454.63C260.51-443.77 249.95-430.56 240.37-418.59" fill="none" stroke="#000"></path><polygon fill="#000" points="242.91,-416.16 233.93,-410.53 237.44,-420.53 242.91,-416.16" stroke="#000"></polygon></g><g class="node" id="node9"><title>step1</title><polygon fill="#fff" points="500.5,-282 378.5,-282 378.5,-246 506.5,-246 506.5,-276 500.5,-282" stroke="#000"></polygon><polyline fill="none" points="500.5,-282 500.5,-276" stroke="#000"></polyline><polyline fill="none" points="506.5,-276 500.5,-276" stroke="#000"></polyline><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="442.5" y="-267.4">初始森林:</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="442.5" y="-254.4">A(5) B(3) C(2) D(1)</text></g><g class="edge" id="edge12"><title>init-&gt;step1</title><path d="M304.09-454.76c29.16 39.98 89.42 122.59 119.89 164.37" fill="none" stroke="gray" stroke-dasharray="1,5"></path><polygon fill="gray" points="426.95,-292.26 430.01,-282.12 421.29,-288.14 426.95,-292.26" stroke="gray"></polygon></g><g class="node" id="node4"><title>select</title><polygon fill="#e0ffff" points="336,-282 247,-282 247,-246 336,-246 336,-282" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="291.5" y="-267.4">选择两棵权值</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="291.5" y="-254.4">最小的树</text></g><g class="edge" id="edge3"><title>check-&gt;select</title><path d="M231-356.52c13.01 19.68 30.66 46.38 43.54 65.86" fill="none" stroke="#000"></path><polygon fill="#000" points="277.49,-292.54 280.09,-282.26 271.65,-288.68 277.49,-292.54" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="10" text-anchor="middle" x="257.5" y="-324">否</text></g><g class="node" id="node7"><title>result</title><polygon fill="#90ee90" points="204,-282 115,-282 115,-246 204,-246 204,-282" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="159.5" y="-267.4">构建完成</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="159.5" y="-254.4">得到哈夫曼树</text></g><g class="edge" id="edge7"><title>check-&gt;result</title><path d="M200.57-354.74C191.74-335.46 180.14-310.11 171.52-291.27" fill="none" stroke="#000"></path><polygon fill="#000" points="174.66,-289.72 167.32,-282.08 168.3,-292.63 174.66,-289.72" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="10" text-anchor="middle" x="195.5" y="-324">是</text></g><g class="node" id="node5"><title>merge</title><polygon fill="#f08080" points="362.5,-203.5 220.5,-203.5 220.5,-167.5 362.5,-167.5 362.5,-203.5" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="291.5" y="-188.9">合并为新树</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="291.5" y="-175.9">新权值 = 两树权值之和</text></g><g class="edge" id="edge4"><title>select-&gt;merge</title><path d="M291.5-245.64c0 9.44999999999999.0 21.37.0 32.02" fill="none" stroke="#000"></path><polygon fill="#000" points="295,-213.53 291.5,-203.53 288,-213.53 295,-213.53" stroke="#000"></polygon></g><g class="node" id="node10"><title>step2</title><polygon fill="#fff" points="496.5,-203.5 382.5,-203.5 382.5,-167.5 502.5,-167.5 502.5,-197.5 496.5,-203.5" stroke="#000"></polygon><polyline fill="none" points="496.5,-203.5 496.5,-197.5" stroke="#000"></polyline><polyline fill="none" points="502.5,-197.5 496.5,-197.5" stroke="#000"></polyline><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="442.5" y="-188.9">第1次合并:</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="442.5" y="-175.9">C(2)+D(1)=CD(3)</text></g><g class="edge" id="edge13"><title>select-&gt;step2</title><path d="M325.39-245.83c21.95 11.12 50.73 25.7 74.27 37.63" fill="none" stroke="gray" stroke-dasharray="1,5"></path><polygon fill="gray" points="401.39,-211.25 408.73,-203.61 398.22,-205.01 401.39,-211.25" stroke="gray"></polygon></g><g class="node" id="node6"><title>addback</title><polygon fill="#d3d3d3" points="101,-125 0,-125 0,-89 101,-89 101,-125" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="50.5" y="-103.9">将新树放回森林</text></g><g class="edge" id="edge5"><title>merge-&gt;addback</title><path d="M237.71-167.43c-37.59 11.94-87.85 27.89-126.82 40.26" fill="none" stroke="#000"></path><polygon fill="#000" points="111.83,-123.79 101.24,-124.11 109.71,-130.47 111.83,-123.79" stroke="#000"></polygon></g><g class="edge" id="edge6"><title>addback-&gt;check</title><path d="M49.82-125.1C49.44-145.43 50.13-180.22 57.5-209c12.63-49.32 14.66-65.53 48-104 16.57-19.12 39.61-35.02 60.16-46.81" fill="none" stroke="#000"></path><polygon fill="#000" points="164.15,-362.98 174.59,-364.77 167.55,-356.86 164.15,-362.98" stroke="#000"></polygon></g><g class="node" id="node8"><title>property</title><polygon fill="wheat" points="202,-209 67,-209 67,-162 202,-162 202,-209" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="134.5" y="-195.4">结果特性：</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="134.5" y="-182.4">• 权值高的符号深度浅</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="134.5" y="-169.4">• 权值低的符号深度深</text></g><g class="edge" id="edge8"><title>result-&gt;property</title><path d="M153.83-245.64C151.22-237.68 148.05-227.97 145.04-218.74" fill="none" stroke="#000"></path><polygon fill="#000" points="148.29,-217.44 141.86,-209.02 141.64,-219.61 148.29,-217.44" stroke="#000"></polygon></g><g class="edge" id="edge9"><title>step1-&gt;step2</title><path d="M442.5-245.64c0 9.44999999999999.0 21.37.0 32.02" fill="none" stroke="#000"></path><polygon fill="#000" points="446,-213.53 442.5,-203.53 439,-213.53 446,-213.53" stroke="#000"></polygon></g><g class="node" id="node11"><title>step3</title><polygon fill="#fff" points="510,-125 379,-125 379,-89 516,-89 516,-119 510,-125" stroke="#000"></polygon><polyline fill="none" points="510,-125 510,-119" stroke="#000"></polyline><polyline fill="none" points="516,-119 510,-119" stroke="#000"></polyline><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="447.5" y="-110.4">第2次合并:</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="447.5" y="-97.4">B(3)+CD(3)=BCD(6)</text></g><g class="edge" id="edge10"><title>step2-&gt;step3</title><path d="M443.63-167.14C444.25-157.69 445.03-145.77 445.73-135.12" fill="none" stroke="#000"></path><polygon fill="#000" points="449.23,-135.23 446.39,-125.03 442.24,-134.78 449.23,-135.23" stroke="#000"></polygon></g><g class="node" id="node12"><title>step4</title><polygon fill="#fff" points="512,-52 379,-52 379,-16 518,-16 518,-46 512,-52" stroke="#000"></polygon><polyline fill="none" points="512,-52 512,-46" stroke="#000"></polyline><polyline fill="none" points="518,-46 512,-46" stroke="#000"></polyline><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="448.5" y="-37.4">第3次合并:</text><text font-family="Microsoft Yahei" font-size="12" text-anchor="middle" x="448.5" y="-24.4">A(5)+BCD(6)=根(11)</text></g><g class="edge" id="edge11"><title>step3-&gt;step4</title><path d="M447.74-88.81C447.86-80.79 447.99-71.05 448.12-62.07" fill="none" stroke="#000"></path><polygon fill="#000" points="451.62,-62.08 448.26,-52.03 444.62,-61.98 451.62,-62.08" stroke="#000"></polygon></g></g></svg>