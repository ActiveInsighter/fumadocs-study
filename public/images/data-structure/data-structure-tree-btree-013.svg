<svg font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg"><style>.title{font-weight:700;font-size:13px;text-anchor:middle}.sub{font-size:11px;fill:#555;text-anchor:middle}.nd{fill:#fff;stroke:#333}.tgt{fill:#fde4e4;stroke:#c0392b;stroke-width:2}.succ{fill:#e3f2fd;stroke:#1565c0}.edge{stroke:#666;fill:none}.del{stroke:#c0392b;stroke-width:1.5;stroke-dasharray:4 3;fill:none}.add{stroke:#2e7d32;stroke-width:1.6;fill:none}text{dominant-baseline:central}</style><defs><marker id="del" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c0392b"></path></marker><marker id="add" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2e7d32"></path></marker></defs><text font-size="14" font-weight="700" text-anchor="middle" x="410" y="22">BST 删除节点的三种情况</text><g transform="translate(20,55)"><text class="title" x="180" y="0">情况 1：叶子节点</text><text class="sub" x="180" y="18">直接删除，无需后续处理</text><text fill="#888" font-size="11" text-anchor="middle" x="80" y="40">删除前</text><circle class="nd" cx="80" cy="65" r="16"></circle><text text-anchor="middle" x="80" y="65">8</text><circle class="nd" cx="50" cy="105" r="14"></circle><text text-anchor="middle" x="50" y="105">3</text><circle class="nd" cx="110" cy="105" r="14"></circle><text text-anchor="middle" x="110" y="105">12</text><circle class="tgt" cx="35" cy="145" r="14"></circle><text text-anchor="middle" x="35" y="145">1</text><circle class="nd" cx="65" cy="145" r="14"></circle><text text-anchor="middle" x="65" y="145">5</text><line class="edge" x1="72" x2="55" y1="78" y2="93"></line><line class="edge" x1="88" x2="105" y1="78" y2="93"></line><line class="edge" x1="44" x2="38" y1="118" y2="132"></line><line class="edge" x1="56" x2="62" y1="118" y2="132"></line><path class="edge" d="M165 105h30" marker-end="url(#del)" stroke="#c0392b"></path><text fill="#c0392b" font-size="11" text-anchor="middle" x="180" y="92">删 1</text><text fill="#888" font-size="11" text-anchor="middle" x="280" y="40">删除后</text><circle class="nd" cx="280" cy="65" r="16"></circle><text text-anchor="middle" x="280" y="65">8</text><circle class="nd" cx="250" cy="105" r="14"></circle><text text-anchor="middle" x="250" y="105">3</text><circle class="nd" cx="310" cy="105" r="14"></circle><text text-anchor="middle" x="310" y="105">12</text><circle class="nd" cx="265" cy="145" r="14"></circle><text text-anchor="middle" x="265" y="145">5</text><line class="edge" x1="272" x2="255" y1="78" y2="93"></line><line class="edge" x1="288" x2="305" y1="78" y2="93"></line><line class="edge" x1="256" x2="262" y1="118" y2="132"></line></g><line stroke="#ddd" x1="370" x2="370" y1="55" y2="220"></line><g transform="translate(400,55)"><text class="title" x="180" y="0">情况 2：只有一个子节点</text><text class="sub" x="180" y="18">用唯一子树替代被删节点</text><text fill="#888" font-size="11" text-anchor="middle" x="80" y="40">删除前</text><circle class="nd" cx="80" cy="65" r="16"></circle><text text-anchor="middle" x="80" y="65">8</text><circle class="tgt" cx="50" cy="105" r="14"></circle><text text-anchor="middle" x="50" y="105">3</text><circle class="nd" cx="110" cy="105" r="14"></circle><text text-anchor="middle" x="110" y="105">12</text><circle class="succ" cx="65" cy="145" r="14"></circle><text text-anchor="middle" x="65" y="145">5</text><line class="edge" x1="72" x2="55" y1="78" y2="93"></line><line class="edge" x1="88" x2="105" y1="78" y2="93"></line><line class="edge" x1="56" x2="62" y1="118" y2="132"></line><path class="edge" d="M165 105h30" marker-end="url(#del)" stroke="#c0392b"></path><text fill="#c0392b" font-size="11" text-anchor="middle" x="180" y="92">删 3</text><text fill="#888" font-size="11" text-anchor="middle" x="280" y="40">删除后</text><circle class="nd" cx="280" cy="65" r="16"></circle><text text-anchor="middle" x="280" y="65">8</text><circle class="succ" cx="250" cy="105" r="14"></circle><text text-anchor="middle" x="250" y="105">5</text><circle class="nd" cx="310" cy="105" r="14"></circle><text text-anchor="middle" x="310" y="105">12</text><line class="edge" x1="272" x2="255" y1="78" y2="93"></line><line class="edge" x1="288" x2="305" y1="78" y2="93"></line><text fill="#1565c0" font-size="11" text-anchor="middle" x="220" y="160">把唯一子节点 5 提到原位置</text></g><g transform="translate(20,235)"><text class="title" x="380" y="0">情况 3：两个子节点</text><text class="sub" x="380" y="18">用 中序后继（右子树最小） 或 中序前驱（左子树最大） 顶替，再递归删除该后继/前驱</text><text fill="#888" font-size="11" text-anchor="middle" x="120" y="40">删除前（删 8）</text><circle class="tgt" cx="120" cy="70" r="16"></circle><text text-anchor="middle" x="120" y="70">8</text><circle class="nd" cx="80" cy="115" r="14"></circle><text text-anchor="middle" x="80" y="115">3</text><circle class="nd" cx="160" cy="115" r="14"></circle><text text-anchor="middle" x="160" y="115">12</text><circle class="nd" cx="60" cy="155" r="12"></circle><text text-anchor="middle" x="60" y="155">1</text><circle class="nd" cx="100" cy="155" r="12"></circle><text text-anchor="middle" x="100" y="155">6</text><circle class="succ" cx="140" cy="155" r="12"></circle><text text-anchor="middle" x="140" y="155">10</text><circle class="nd" cx="180" cy="155" r="12"></circle><text text-anchor="middle" x="180" y="155">14</text><line class="edge" x1="110" x2="86" y1="84" y2="102"></line><line class="edge" x1="130" x2="154" y1="84" y2="102"></line><line class="edge" x1="73" x2="64" y1="127" y2="144"></line><line class="edge" x1="87" x2="96" y1="127" y2="144"></line><line class="edge" x1="153" x2="144" y1="127" y2="144"></line><line class="edge" x1="167" x2="176" y1="127" y2="144"></line><text fill="#1565c0" font-size="11" text-anchor="middle" x="140" y="180">中序后继 = 10</text><path class="edge" d="M260 115h50" marker-end="url(#add)" stroke="#2e7d32"></path><text fill="#2e7d32" font-size="11" text-anchor="middle" x="285" y="100">① 值替换</text><text fill="#c0392b" font-size="11" text-anchor="middle" x="285" y="135">② 删原 10</text><text fill="#888" font-size="11" text-anchor="middle" x="430" y="40">删除后</text><circle class="succ" cx="430" cy="70" r="16"></circle><text text-anchor="middle" x="430" y="70">10</text><circle class="nd" cx="390" cy="115" r="14"></circle><text text-anchor="middle" x="390" y="115">3</text><circle class="nd" cx="470" cy="115" r="14"></circle><text text-anchor="middle" x="470" y="115">12</text><circle class="nd" cx="370" cy="155" r="12"></circle><text text-anchor="middle" x="370" y="155">1</text><circle class="nd" cx="410" cy="155" r="12"></circle><text text-anchor="middle" x="410" y="155">6</text><circle class="nd" cx="490" cy="155" r="12"></circle><text text-anchor="middle" x="490" y="155">14</text><line class="edge" x1="420" x2="396" y1="84" y2="102"></line><line class="edge" x1="440" x2="464" y1="84" y2="102"></line><line class="edge" x1="383" x2="374" y1="127" y2="144"></line><line class="edge" x1="397" x2="406" y1="127" y2="144"></line><line class="edge" x1="477" x2="486" y1="127" y2="144"></line><text fill="#2e7d32" font-size="11" text-anchor="middle" x="430" y="180">10 上位，原叶子 10 被移除</text><g font-size="11" transform="translate(580,60)"><text font-weight="600" y="0">图例</text><circle class="tgt" cx="10" cy="20" r="9"></circle><text x="28" y="20">待删除节点</text><circle class="succ" cx="10" cy="45" r="9"></circle><text x="28" y="45">替代节点（后继/子树）</text><circle class="nd" cx="10" cy="70" r="9"></circle><text x="28" y="70">其它节点</text><text fill="#666" y="100">中序前驱也可代替后继</text><text fill="#666" y="120">两者效果对称</text></g></g></svg>