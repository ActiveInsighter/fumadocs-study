<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><style>.node-circle{fill:var(--sky-soft);stroke:var(--violet-deep);stroke-width:2}.unbalanced-node{fill:var(--rose-soft);stroke:var(--red-deep);stroke-width:2}.text{font-family:var(--svg-font-family);font-size: var(--svg-font-size-label);text-anchor:middle}.title-text{font-family:var(--svg-font-family);font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold);text-anchor:middle}.balance-factor{font-family:var(--svg-font-family);font-size: var(--svg-font-size-label);text-anchor:middle;fill:var(--violet-deep)}.edge{stroke:var(--neutral-deep);stroke-width:1.5;fill:none}.highlight-edge{stroke:var(--red-deep);stroke-width:2;fill:none}.concept-box{fill:var(--paper);stroke:var(--neutral-mid);stroke-width:1}.concept-text{font-family:var(--svg-font-family);font-size: var(--svg-font-size-caption)}</style></defs><text class="title-text" x="400" y="20">AVL树核心概念</text><g transform="translate(80, 50)"><text class="title-text" fill="var(--violet-deep)" x="100" y="20">平衡的AVL树</text><line class="edge" x1="100" x2="70" y1="50" y2="90"></line><line class="edge" x1="100" x2="130" y1="50" y2="90"></line><line class="edge" x1="70" x2="50" y1="90" y2="130"></line><line class="edge" x1="70" x2="90" y1="90" y2="130"></line><line class="edge" x1="130" x2="150" y1="90" y2="130"></line><circle class="node-circle" cx="100" cy="50" r="15"></circle><text class="text" x="100" y="55">5</text><text class="balance-factor" x="125" y="42">0</text><circle class="node-circle" cx="70" cy="90" r="15"></circle><text class="text" x="70" y="95">3</text><text class="balance-factor" x="95" y="82">0</text><circle class="node-circle" cx="130" cy="90" r="15"></circle><text class="text" x="130" y="95">7</text><text class="balance-factor" x="155" y="82">-1</text><circle class="node-circle" cx="50" cy="130" r="15"></circle><text class="text" x="50" y="135">2</text><text class="balance-factor" x="70" y="122">0</text><circle class="node-circle" cx="90" cy="130" r="15"></circle><text class="text" x="90" y="135">4</text><text class="balance-factor" x="110" y="122">0</text><circle class="node-circle" cx="150" cy="130" r="15"></circle><text class="text" x="150" y="135">8</text><text class="balance-factor" x="170" y="122">0</text></g><g transform="translate(400, 50)"><text class="title-text" fill="var(--red-deep)" x="100" y="20">不平衡的树</text><line class="highlight-edge" x1="100" x2="70" y1="50" y2="90"></line><line class="edge" x1="100" x2="130" y1="50" y2="90"></line><line class="highlight-edge" x1="70" x2="40" y1="90" y2="130"></line><line class="highlight-edge" x1="40" x2="25" y1="130" y2="170"></line><circle class="unbalanced-node" cx="100" cy="50" r="15"></circle><text class="text" x="100" y="55">5</text><text class="balance-factor" fill="var(--red-deep)" x="120" y="42">2</text><circle class="unbalanced-node" cx="70" cy="90" r="15"></circle><text class="text" x="70" y="95">3</text><text class="balance-factor" fill="var(--red-deep)" x="93" y="90">2</text><circle class="node-circle" cx="130" cy="90" r="15"></circle><text class="text" x="130" y="95">7</text><text class="balance-factor" x="150" y="82">0</text><circle class="node-circle" cx="40" cy="130" r="15"></circle><text class="text" x="40" y="135">2</text><text class="balance-factor" x="60" y="122">1</text><circle class="node-circle" cx="25" cy="170" r="15"></circle><text class="text" x="25" y="175">1</text><text class="balance-factor" x="45" y="162">0</text><rect fill="none" height="110" stroke="var(--red-deep)" stroke-dasharray="5,5" stroke-width="2" width="120" x="10" y="75"></rect><text class="concept-text" fill="var(--red-deep)" x="70" y="200">最小不平衡子树</text></g><g transform="translate(80, 280)"><rect class="concept-box" height="80" width="200" x="0" y="0"></rect><text class="concept-text" font-weight="var(--svg-font-weight-bold)" x="10" y="20">平衡因子 (Balance Factor)</text><text class="concept-text" x="10" y="35">BF = 左子树高度 - 右子树高度</text><text class="concept-text" x="10" y="50">• 平衡：|BF| ≤ 1</text><text class="concept-text" x="10" y="65">• 不平衡：|BF| &gt; 1</text><rect class="concept-box" height="80" width="250" x="220" y="0"></rect><text class="concept-text" font-weight="var(--svg-font-weight-bold)" x="230" y="20">最小不平衡子树</text><text class="concept-text" x="230" y="35">• 整棵树中最小的不平衡子树</text><text class="concept-text" x="230" y="50">• 旋转的起始点：从该子树根节点开始</text><text class="concept-text" x="230" y="65">• 旋转后可使整棵树重新平衡</text><rect class="concept-box" height="80" width="200" x="490" y="0"></rect><text class="concept-text" font-weight="var(--svg-font-weight-bold)" x="500" y="20">旋转目的</text><text class="concept-text" x="500" y="35">• 维持树的平衡性</text><text class="concept-text" x="500" y="50">• 保证 O(log n) 复杂度</text><text class="concept-text" x="500" y="65">• 在插入/删除后恢复平衡</text></g><g transform="translate(80, 380)"><text class="concept-text" font-weight="var(--svg-font-weight-bold)" x="0" y="15">图例：</text><circle class="node-circle" cx="80" cy="10" r="8"></circle><text class="concept-text" x="100" y="15">平衡节点</text><circle class="unbalanced-node" cx="200" cy="10" r="8"></circle><text class="concept-text" x="220" y="15">不平衡节点</text><text class="concept-text" fill="var(--violet-deep)" x="320" y="15">蓝色数字：平衡因子</text><line class="highlight-edge" x1="450" x2="470" y1="10" y2="10"></line><text class="concept-text" x="480" y="15">不平衡路径</text></g><g transform="translate(315, 120)"><path d="M0 0Q20-20 40 0" fill="none" marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="2"></path><text class="concept-text" fill="var(--red-deep)" x="20" y="-30">需要旋转</text></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--red-deep)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>