<svg font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#555"></path></marker><marker id="arrowGreen" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2e7d32"></path></marker><marker id="arrowRed" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c62828"></path></marker></defs><text fill="#222" font-size="20" font-weight="bold" text-anchor="middle" x="450" y="30">快速排序 · 单向递归（Quickselect）</text><text fill="#666" font-size="13" text-anchor="middle" x="450" y="52">寻找数组中第 k 小的元素 —— 每次只向包含目标的一侧递归</text><text fill="#1565c0" font-size="15" font-weight="bold" x="30" y="88">① 核心思想</text><rect fill="#f3f8ff" height="95" rx="6" stroke="#90caf9" width="840" x="30" y="102"></rect><text fill="#333" font-size="13" x="45" y="120">经过一次 partition 后，基准元素 pivot 落在其<tspan fill="#c62828" font-weight="bold">最终有序位置</tspan>（下标 = pivotIdx）：</text><text fill="#333" font-size="13" x="60" y="142">• pivot 左侧元素 &lt; pivot，右侧元素 &gt; pivot</text><text fill="#333" font-size="13" x="60" y="162">• 因此只需比较 pivotIdx 与目标 k，就能判断第 k 小的元素在哪一侧 ——<tspan fill="#2e7d32" font-weight="bold">另一侧无需再排</tspan></text><text fill="#333" font-size="13" x="60" y="180">• 相比标准快排两侧都递归，单向递归把平均时间复杂度从 O(n log n) 降到<tspan font-weight="bold">O(n)</tspan></text><text fill="#1565c0" font-size="15" font-weight="bold" x="30" y="215">② 一次 partition 后的三种情况</text><g transform="translate(60,235)"><rect fill="#e3f2fd" height="34" stroke="#1976d2" width="180" x="0" y="0"></rect><rect fill="#ffe082" height="34" stroke="#f57f17" stroke-width="2" width="40" x="180" y="0"></rect><rect fill="#fce4ec" height="34" stroke="#c2185b" width="180" x="220" y="0"></rect><text fill="#0d47a1" font-size="12" text-anchor="middle" x="90" y="22">左侧：都 &lt; pivot</text><text fill="#e65100" font-size="13" font-weight="bold" text-anchor="middle" x="200" y="22">pivot</text><text fill="#880e4f" font-size="12" text-anchor="middle" x="310" y="22">右侧：都 &gt; pivot</text><text fill="#666" font-size="11" text-anchor="middle" x="90" y="52">low … pivotIdx-1</text><text fill="#666" font-size="11" text-anchor="middle" x="200" y="52">pivotIdx</text><text fill="#666" font-size="11" text-anchor="middle" x="310" y="52">pivotIdx+1 … high</text></g><g transform="translate(30,315)"><rect fill="#e8f5e9" height="120" rx="6" stroke="#66bb6a" width="270" x="0" y="0"></rect><text fill="#1b5e20" font-size="13" font-weight="bold" text-anchor="middle" x="135" y="22">情况 A：pivotIdx == k</text><text fill="#333" font-size="12" x="15" y="46">基准正好落在第 k 个位置</text><text fill="#333" font-size="12" x="15" y="66">→ a[pivotIdx] 即为答案</text><text fill="#1b5e20" font-size="12" font-weight="bold" x="15" y="90">动作：直接返回，递归结束</text><circle cx="240" cy="80" fill="#66bb6a" r="18"></circle><text fill="#fff" font-size="18" font-weight="bold" text-anchor="middle" x="240" y="86">✓</text></g><g transform="translate(315,315)"><rect fill="#fff3e0" height="120" rx="6" stroke="#ffa726" width="270" x="0" y="0"></rect><text fill="#e65100" font-size="13" font-weight="bold" text-anchor="middle" x="135" y="22">情况 B：pivotIdx &lt; k</text><text fill="#333" font-size="12" x="15" y="46">目标在基准的<tspan font-weight="bold">右侧</tspan>区间</text><text fill="#333" font-size="12" x="15" y="66">→ 只对 [pivotIdx+1, high] 递归</text><text fill="#e65100" font-size="12" font-weight="bold" x="15" y="90">动作：quickSelect(a, pivotIdx+1, high, k)</text><path d="M15 105H255" fill="none" marker-end="url(#arrow)" opacity=".4" stroke="#e65100" stroke-width="2"></path></g><g transform="translate(600,315)"><rect fill="#fce4ec" height="120" rx="6" stroke="#ec407a" width="270" x="0" y="0"></rect><text fill="#880e4f" font-size="13" font-weight="bold" text-anchor="middle" x="135" y="22">情况 C：pivotIdx &gt; k</text><text fill="#333" font-size="12" x="15" y="46">目标在基准的<tspan font-weight="bold">左侧</tspan>区间</text><text fill="#333" font-size="12" x="15" y="66">→ 只对 [low, pivotIdx-1] 递归</text><text fill="#880e4f" font-size="12" font-weight="bold" x="15" y="90">动作：quickSelect(a, low, pivotIdx-1, k)</text><path d="M255 105H15" fill="none" marker-end="url(#arrow)" opacity=".4" stroke="#880e4f" stroke-width="2"></path></g><text fill="#1565c0" font-size="15" font-weight="bold" x="30" y="465">③ 示例：在 [3, 8, 1, 5, 9, 4, 7, 2] 中寻找第 k=3 小（下标 3，答案 4）</text><g transform="translate(40,478)"><text fill="#555" font-size="12" x="0" y="15">初始区间 [0,7]，取 pivot=3：</text><g transform="translate(0,22)"><g font-size="12" text-anchor="middle"><rect fill="#e3f2fd" height="24" stroke="#1976d2" width="28" x="0" y="0"></rect><text x="14" y="17">1</text><rect fill="#e3f2fd" height="24" stroke="#1976d2" width="28" x="28" y="0"></rect><text x="42" y="17">2</text><rect fill="#ffe082" height="24" stroke="#f57f17" stroke-width="2" width="28" x="56" y="0"></rect><text font-weight="bold" x="70" y="17">3</text><rect fill="#fce4ec" height="24" stroke="#c2185b" width="28" x="84" y="0"></rect><text x="98" y="17">5</text><rect fill="#fce4ec" height="24" stroke="#c2185b" width="28" x="112" y="0"></rect><text x="126" y="17">9</text><rect fill="#fce4ec" height="24" stroke="#c2185b" width="28" x="140" y="0"></rect><text x="154" y="17">4</text><rect fill="#fce4ec" height="24" stroke="#c2185b" width="28" x="168" y="0"></rect><text x="182" y="17">7</text><rect fill="#fce4ec" height="24" stroke="#c2185b" width="28" x="196" y="0"></rect><text x="210" y="17">8</text></g><g fill="#888" font-size="10" text-anchor="middle"><text x="14" y="38">0</text><text x="42" y="38">1</text><text x="70" y="38">2</text><text x="98" y="38">3</text><text x="126" y="38">4</text><text x="154" y="38">5</text><text x="182" y="38">6</text><text x="210" y="38">7</text></g></g><text fill="#e65100" font-size="12" x="240" y="35">pivotIdx=2 &lt; k=3 → 递归右侧 [3,7]</text></g><g transform="translate(40,540)"><text fill="#555" font-size="12" x="0" y="15">区间 [3,7]，取 pivot=5：</text><g transform="translate(0,22)"><g font-size="12" text-anchor="middle"><rect fill="#eee" height="24" stroke="#bdbdbd" width="28" x="0" y="0"></rect><text fill="#999" x="14" y="17">1</text><rect fill="#eee" height="24" stroke="#bdbdbd" width="28" x="28" y="0"></rect><text fill="#999" x="42" y="17">2</text><rect fill="#eee" height="24" stroke="#bdbdbd" width="28" x="56" y="0"></rect><text fill="#999" x="70" y="17">3</text><rect fill="#e3f2fd" height="24" stroke="#1976d2" width="28" x="84" y="0"></rect><text x="98" y="17">4</text><rect fill="#ffe082" height="24" stroke="#f57f17" stroke-width="2" width="28" x="112" y="0"></rect><text font-weight="bold" x="126" y="17">5</text><rect fill="#fce4ec" height="24" stroke="#c2185b" width="28" x="140" y="0"></rect><text x="154" y="17">9</text><rect fill="#fce4ec" height="24" stroke="#c2185b" width="28" x="168" y="0"></rect><text x="182" y="17">7</text><rect fill="#fce4ec" height="24" stroke="#c2185b" width="28" x="196" y="0"></rect><text x="210" y="17">8</text></g><g fill="#888" font-size="10" text-anchor="middle"><text x="14" y="38">0</text><text x="42" y="38">1</text><text x="70" y="38">2</text><text x="98" y="38">3</text><text x="126" y="38">4</text><text x="154" y="38">5</text><text x="182" y="38">6</text><text x="210" y="38">7</text></g></g><text fill="#880e4f" font-size="12" x="240" y="35">pivotIdx=4 &gt; k=3 → 递归左侧 [3,3]</text></g><g transform="translate(40,602)"><text fill="#555" font-size="12" x="0" y="15">区间 [3,3]，仅一个元素 4：</text><g opacity="1" transform="translate(0,22)"><g font-size="12" text-anchor="middle"><rect fill="#eee" height="24" stroke="#bdbdbd" width="28" x="0" y="0"></rect><text fill="#999" x="14" y="17">1</text><rect fill="#eee" height="24" stroke="#bdbdbd" width="28" x="28" y="0"></rect><text fill="#999" x="42" y="17">2</text><rect fill="#eee" height="24" stroke="#bdbdbd" width="28" x="56" y="0"></rect><text fill="#999" x="70" y="17">3</text><rect fill="#c8e6c9" height="24" stroke="#2e7d32" stroke-width="2" width="28" x="84" y="0"></rect><text fill="#1b5e20" font-weight="bold" x="98" y="17">4</text></g></g><text fill="#2e7d32" font-size="12" font-weight="bold" x="150" y="35">pivotIdx=3 == k=3 → 返回答案 4 ✓</text></g></svg>