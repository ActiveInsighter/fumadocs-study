<svg font-family="var(--svg-font-family)" viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--neutral-deep)"></path></marker><marker id="arrowGreen" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--lime-deep)"></path></marker><marker id="arrowRed" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--red-deep)"></path></marker></defs><text fill="var(--ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="450" y="30">快速排序 · 单向递归（Quickselect）</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="450" y="52">寻找数组中第 k 小的元素 —— 每次只向包含目标的一侧递归</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="30" y="88">① 核心思想</text><rect fill="var(--paper)" height="95" rx="6" stroke="var(--blue-mid)" width="840" x="30" y="102"></rect><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="45" y="120">经过一次 partition 后，基准元素 pivot 落在其<tspan fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">最终有序位置</tspan>（下标 = pivotIdx）：</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="60" y="142">• pivot 左侧元素 &lt; pivot，右侧元素 &gt; pivot</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="60" y="162">• 因此只需比较 pivotIdx 与目标 k，就能判断第 k 小的元素在哪一侧 ——<tspan fill="var(--lime-deep)" font-weight="var(--svg-font-weight-bold)">另一侧无需再排</tspan></text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="60" y="180">• 相比标准快排两侧都递归，单向递归把平均时间复杂度从 O(n log n) 降到<tspan font-weight="var(--svg-font-weight-bold)">O(n)</tspan></text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="30" y="215">② 一次 partition 后的三种情况</text><g transform="translate(60,235)"><rect fill="var(--sky-soft)" height="34" stroke="var(--violet-deep)" width="180" x="0" y="0"></rect><rect fill="var(--yellow-mid)" height="34" stroke="var(--orange-mid)" stroke-width="2" width="40" x="180" y="0"></rect><rect fill="var(--rose-soft)" height="34" stroke="var(--rose-deep)" width="180" x="220" y="0"></rect><text fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="90" y="22">左侧：都 &lt; pivot</text><text fill="var(--coral-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="200" y="22">pivot</text><text fill="var(--rose-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="310" y="22">右侧：都 &gt; pivot</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="90" y="52">low … pivotIdx-1</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="200" y="52">pivotIdx</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="52">pivotIdx+1 … high</text></g><g transform="translate(30,315)"><rect fill="var(--green-soft)" height="120" rx="6" stroke="var(--lime-mid)" width="270" x="0" y="0"></rect><text fill="var(--lime-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="135" y="22">情况 A：pivotIdx == k</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="15" y="46">基准正好落在第 k 个位置</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="15" y="66">→ a[pivotIdx] 即为答案</text><text fill="var(--lime-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="15" y="90">动作：直接返回，递归结束</text><circle cx="240" cy="80" fill="var(--lime-mid)" r="18"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="240" y="86">✓</text></g><g transform="translate(315,315)"><rect fill="var(--yellow-soft)" height="120" rx="6" stroke="var(--yellow-mid)" width="270" x="0" y="0"></rect><text fill="var(--coral-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="135" y="22">情况 B：pivotIdx &lt; k</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="15" y="46">目标在基准的<tspan font-weight="var(--svg-font-weight-bold)">右侧</tspan>区间</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="15" y="66">→ 只对 [pivotIdx+1, high] 递归</text><text fill="var(--coral-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="15" y="90">动作：quickSelect(a, pivotIdx+1, high, k)</text><path d="M15 105H255" fill="none" marker-end="url(#arrow)" opacity=".4" stroke="var(--coral-deep)" stroke-width="2"></path></g><g transform="translate(600,315)"><rect fill="var(--rose-soft)" height="120" rx="6" stroke="var(--rose-deep)" width="270" x="0" y="0"></rect><text fill="var(--rose-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="135" y="22">情况 C：pivotIdx &gt; k</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="15" y="46">目标在基准的<tspan font-weight="var(--svg-font-weight-bold)">左侧</tspan>区间</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="15" y="66">→ 只对 [low, pivotIdx-1] 递归</text><text fill="var(--rose-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="15" y="90">动作：quickSelect(a, low, pivotIdx-1, k)</text><path d="M255 105H15" fill="none" marker-end="url(#arrow)" opacity=".4" stroke="var(--rose-deep)" stroke-width="2"></path></g><text fill="var(--violet-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="30" y="465">③ 示例：在 [3, 8, 1, 5, 9, 4, 7, 2] 中寻找第 k=3 小（下标 3，答案 4）</text><g transform="translate(40,478)"><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" x="0" y="15">初始区间 [0,7]，取 pivot=3：</text><g transform="translate(0,22)"><g font-size="var(--svg-font-size-label)" text-anchor="middle"><rect fill="var(--sky-soft)" height="24" stroke="var(--violet-deep)" width="28" x="0" y="0"></rect><text x="14" y="17">1</text><rect fill="var(--sky-soft)" height="24" stroke="var(--violet-deep)" width="28" x="28" y="0"></rect><text x="42" y="17">2</text><rect fill="var(--yellow-mid)" height="24" stroke="var(--orange-mid)" stroke-width="2" width="28" x="56" y="0"></rect><text font-weight="var(--svg-font-weight-bold)" x="70" y="17">3</text><rect fill="var(--rose-soft)" height="24" stroke="var(--rose-deep)" width="28" x="84" y="0"></rect><text x="98" y="17">5</text><rect fill="var(--rose-soft)" height="24" stroke="var(--rose-deep)" width="28" x="112" y="0"></rect><text x="126" y="17">9</text><rect fill="var(--rose-soft)" height="24" stroke="var(--rose-deep)" width="28" x="140" y="0"></rect><text x="154" y="17">4</text><rect fill="var(--rose-soft)" height="24" stroke="var(--rose-deep)" width="28" x="168" y="0"></rect><text x="182" y="17">7</text><rect fill="var(--rose-soft)" height="24" stroke="var(--rose-deep)" width="28" x="196" y="0"></rect><text x="210" y="17">8</text></g><g fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle"><text x="14" y="38">0</text><text x="42" y="38">1</text><text x="70" y="38">2</text><text x="98" y="38">3</text><text x="126" y="38">4</text><text x="154" y="38">5</text><text x="182" y="38">6</text><text x="210" y="38">7</text></g></g><text fill="var(--coral-deep)" font-size="var(--svg-font-size-label)" x="240" y="35">pivotIdx=2 &lt; k=3 → 递归右侧 [3,7]</text></g><g transform="translate(40,540)"><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" x="0" y="15">区间 [3,7]，取 pivot=5：</text><g transform="translate(0,22)"><g font-size="var(--svg-font-size-label)" text-anchor="middle"><rect fill="var(--neutral-soft)" height="24" stroke="var(--neutral-mid)" width="28" x="0" y="0"></rect><text fill="var(--neutral-mid)" x="14" y="17">1</text><rect fill="var(--neutral-soft)" height="24" stroke="var(--neutral-mid)" width="28" x="28" y="0"></rect><text fill="var(--neutral-mid)" x="42" y="17">2</text><rect fill="var(--neutral-soft)" height="24" stroke="var(--neutral-mid)" width="28" x="56" y="0"></rect><text fill="var(--neutral-mid)" x="70" y="17">3</text><rect fill="var(--sky-soft)" height="24" stroke="var(--violet-deep)" width="28" x="84" y="0"></rect><text x="98" y="17">4</text><rect fill="var(--yellow-mid)" height="24" stroke="var(--orange-mid)" stroke-width="2" width="28" x="112" y="0"></rect><text font-weight="var(--svg-font-weight-bold)" x="126" y="17">5</text><rect fill="var(--rose-soft)" height="24" stroke="var(--rose-deep)" width="28" x="140" y="0"></rect><text x="154" y="17">9</text><rect fill="var(--rose-soft)" height="24" stroke="var(--rose-deep)" width="28" x="168" y="0"></rect><text x="182" y="17">7</text><rect fill="var(--rose-soft)" height="24" stroke="var(--rose-deep)" width="28" x="196" y="0"></rect><text x="210" y="17">8</text></g><g fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle"><text x="14" y="38">0</text><text x="42" y="38">1</text><text x="70" y="38">2</text><text x="98" y="38">3</text><text x="126" y="38">4</text><text x="154" y="38">5</text><text x="182" y="38">6</text><text x="210" y="38">7</text></g></g><text fill="var(--rose-deep)" font-size="var(--svg-font-size-label)" x="240" y="35">pivotIdx=4 &gt; k=3 → 递归左侧 [3,3]</text></g><g transform="translate(40,602)"><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" x="0" y="15">区间 [3,3]，仅一个元素 4：</text><g opacity="1" transform="translate(0,22)"><g font-size="var(--svg-font-size-label)" text-anchor="middle"><rect fill="var(--neutral-soft)" height="24" stroke="var(--neutral-mid)" width="28" x="0" y="0"></rect><text fill="var(--neutral-mid)" x="14" y="17">1</text><rect fill="var(--neutral-soft)" height="24" stroke="var(--neutral-mid)" width="28" x="28" y="0"></rect><text fill="var(--neutral-mid)" x="42" y="17">2</text><rect fill="var(--neutral-soft)" height="24" stroke="var(--neutral-mid)" width="28" x="56" y="0"></rect><text fill="var(--neutral-mid)" x="70" y="17">3</text><rect fill="var(--green-light)" height="24" stroke="var(--lime-deep)" stroke-width="2" width="28" x="84" y="0"></rect><text fill="var(--lime-deep)" font-weight="var(--svg-font-weight-bold)" x="98" y="17">4</text></g></g><text fill="var(--lime-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="150" y="35">pivotIdx=3 == k=3 → 返回答案 4 ✓</text></g></svg>