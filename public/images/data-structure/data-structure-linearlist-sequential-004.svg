<svg height="600" viewBox="0 0 800 600" width="800" xmlns="http://www.w3.org/2000/svg"><rect fill="#f8f9fa" height="600" width="800"></rect><text font-size="20" font-weight="bold" text-anchor="middle" x="400" y="30">顺序表删除操作 Delete(L, pos, e)</text><text fill="#34495e" font-size="16" font-weight="bold" x="50" y="80">删除前:</text><g transform="translate(50, 100)"><rect fill="#3498db" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="0" y="0"></rect><rect fill="#3498db" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="60" y="0"></rect><rect fill="#e74c3c" height="40" stroke="#2c3e50" stroke-width="3" width="60" x="120" y="0"></rect><rect fill="#3498db" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="180" y="0"></rect><rect fill="#3498db" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="240" y="0"></rect><rect fill="#ecf0f1" height="40" stroke="#bdc3c7" stroke-width="1" width="60" x="300" y="0"></rect><rect fill="#ecf0f1" height="40" stroke="#bdc3c7" stroke-width="1" width="60" x="360" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="30" y="25">10</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="90" y="25">20</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="150" y="25">30</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="210" y="25">40</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="270" y="25">50</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="30" y="60">1</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="90" y="60">2</text><text fill="#e74c3c" font-size="12" font-weight="bold" text-anchor="middle" x="150" y="60">3</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="210" y="60">4</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="270" y="60">5</text><text fill="#bdc3c7" font-size="12" text-anchor="middle" x="330" y="60">6</text><text fill="#bdc3c7" font-size="12" text-anchor="middle" x="390" y="60">7</text><path d="M150-20V-5" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="2"></path><text fill="#e74c3c" font-size="14" font-weight="bold" text-anchor="middle" x="150" y="-30">pos = 3</text></g><text fill="#34495e" font-size="14" x="500" y="125">length = 5</text><text fill="#e74c3c" font-size="14" x="500" y="145">删除元素: *e = 30</text><text fill="#34495e" font-size="16" font-weight="bold" x="50" y="200">操作步骤:</text><text fill="#2c3e50" font-size="14" x="70" y="230">1. 保存要删除的元素: *e = L-&gt;data[pos-1] = L-&gt;data[2] = 30</text><text fill="#2c3e50" font-size="14" x="70" y="260">2. 后续元素前移:</text><g transform="translate(50, 280)"><rect fill="#3498db" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="0" y="0"></rect><rect fill="#3498db" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="60" y="0"></rect><rect fill="#ecf0f1" height="40" stroke="#e74c3c" stroke-dasharray="5,5" stroke-width="2" width="60" x="120" y="0"></rect><rect fill="#f39c12" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="180" y="0"></rect><rect fill="#f39c12" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="240" y="0"></rect><rect fill="#ecf0f1" height="40" stroke="#bdc3c7" stroke-width="1" width="60" x="300" y="0"></rect><rect fill="#ecf0f1" height="40" stroke="#bdc3c7" stroke-width="1" width="60" x="360" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="30" y="25">10</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="90" y="25">20</text><text fill="#bdc3c7" font-size="12" text-anchor="middle" x="150" y="25">被删除</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="210" y="25">40</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="270" y="25">50</text><path d="M190 20H140" marker-end="url(#arrowhead2)" stroke="#e74c3c" stroke-width="3"></path><path d="M250 20H2e2" marker-end="url(#arrowhead2)" stroke="#e74c3c" stroke-width="3"></path><text fill="#e74c3c" font-size="12" text-anchor="middle" x="165" y="65">i=4: data[2]=data[3]</text><text fill="#e74c3c" font-size="12" text-anchor="middle" x="225" y="85">i=5: data[3]=data[4]</text></g><text fill="#34495e" font-size="16" font-weight="bold" x="50" y="400">删除后:</text><g transform="translate(50, 420)"><rect fill="#27ae60" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="0" y="0"></rect><rect fill="#27ae60" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="60" y="0"></rect><rect fill="#27ae60" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="120" y="0"></rect><rect fill="#27ae60" height="40" stroke="#2c3e50" stroke-width="2" width="60" x="180" y="0"></rect><rect fill="#ecf0f1" height="40" stroke="#bdc3c7" stroke-width="1" width="60" x="240" y="0"></rect><rect fill="#ecf0f1" height="40" stroke="#bdc3c7" stroke-width="1" width="60" x="300" y="0"></rect><rect fill="#ecf0f1" height="40" stroke="#bdc3c7" stroke-width="1" width="60" x="360" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="30" y="25">10</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="90" y="25">20</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="150" y="25">40</text><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="210" y="25">50</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="30" y="60">1</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="90" y="60">2</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="150" y="60">3</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="210" y="60">4</text><text fill="#bdc3c7" font-size="12" text-anchor="middle" x="270" y="60">5</text><text fill="#bdc3c7" font-size="12" text-anchor="middle" x="330" y="60">6</text><text fill="#bdc3c7" font-size="12" text-anchor="middle" x="390" y="60">7</text></g><text fill="#27ae60" font-size="14" font-weight="bold" x="500" y="445">length = 4</text><text fill="#27ae60" font-size="14" x="500" y="465">删除成功: return true</text><rect fill="#2c3e50" height="80" rx="5" width="700" x="50" y="500"></rect><text fill="#ecf0f1" font-size="14" font-weight="bold" x="60" y="520">代码关键点:</text><text fill="#ecf0f1" font-size="12" x="60" y="540">• 位置检查: if (pos &lt; 1 || pos &gt; L-&gt;length) return false;</text><text fill="#ecf0f1" font-size="12" x="60" y="555">• 保存元素: *e = L-&gt;data[pos - 1]; // 数组下标从0开始</text><text fill="#ecf0f1" font-size="12" x="60" y="570">• 前移操作: for (int i = pos; i &lt; L-&gt;length; i++) L-&gt;data[i-1] = L-&gt;data[i];</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead2" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>