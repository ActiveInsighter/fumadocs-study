<svg font-family="var(--svg-font-family)" viewBox="0 0 960 1020" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arr" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--neutral-deep)"></path></marker><marker id="arrUp" markerHeight="10" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--violet-deep)"></path></marker><style>.node{fill:var(--surface);stroke:var(--sky-ink);stroke-width:1.5}.root{fill:var(--yellow-mid);stroke:var(--orange-mid);stroke-width:2}.swap{fill:var(--rose-light);stroke:var(--red-deep);stroke-width:2}.moved{fill:var(--green-light);stroke:var(--lime-deep);stroke-width:2}.new{fill:var(--sky-light);stroke:var(--violet-deep);stroke-width:2;stroke-dasharray:4 3}.edge{stroke:var(--sky-deep);stroke-width:1.5;fill:none}.edgeN{stroke:var(--violet-deep);stroke-width:1.5;fill:none;stroke-dasharray:4 3}.lab{font-size: var(--svg-font-size-body);text-anchor:middle;fill:var(--ink)}.cap{font-size: var(--svg-font-size-label);fill:var(--sky-ink)}.step{font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold);fill:var(--violet-deep)}.note{font-size: var(--svg-font-size-label);fill:var(--sky-deep)}</style></defs><text class="step" x="30" y="30">步骤 1：初始大根堆，准备插入新元素 35</text><g transform="translate(240,55)"><line class="edge" x1="0" x2="-100" y1="0" y2="55"></line><line class="edge" x1="0" x2="100" y1="0" y2="55"></line><line class="edge" x1="-100" x2="-160" y1="55" y2="115"></line><line class="edge" x1="-100" x2="-40" y1="55" y2="115"></line><line class="edge" x1="100" x2="40" y1="55" y2="115"></line><line class="edge" x1="100" x2="160" y1="55" y2="115"></line><line class="edge" x1="-160" x2="-190" y1="115" y2="175"></line><circle class="root" cx="0" cy="0" r="20"></circle><text class="lab" x="0" y="5">40</text><circle class="node" cx="-100" cy="55" r="20"></circle><text class="lab" x="-100" y="60">30</text><circle class="node" cx="100" cy="55" r="20"></circle><text class="lab" x="100" y="60">24</text><circle class="node" cx="-160" cy="115" r="20"></circle><text class="lab" x="-160" y="120">15</text><circle class="node" cx="-40" cy="115" r="20"></circle><text class="lab" x="-40" y="120">20</text><circle class="node" cx="40" cy="115" r="20"></circle><text class="lab" x="40" y="120">22</text><circle class="node" cx="160" cy="115" r="20"></circle><text class="lab" x="160" y="120">13</text><circle class="node" cx="-190" cy="175" r="20"></circle><text class="lab" x="-190" y="180">11</text></g><text class="cap" x="600" y="70">• 待插入元素：35</text><text class="cap" x="600" y="92">• 数组形式：[40, 30, 24, 15, 20, 22, 13, 11]</text><text class="cap" x="600" y="114">• 当前根 40 是最大值，满足大根堆性质</text><text class="note" x="600" y="146">插入策略：先放到堆底（数组末尾），再向上「上浮」</text><line stroke="var(--neutral-light)" x1="30" x2="930" y1="265" y2="265"></line><text class="step" x="30" y="290">步骤 2：将 35 添加到堆底（数组末尾，作为 15 的右孩子）</text><g transform="translate(240,315)"><line class="edge" x1="0" x2="-100" y1="0" y2="55"></line><line class="edge" x1="0" x2="100" y1="0" y2="55"></line><line class="edge" x1="-100" x2="-160" y1="55" y2="115"></line><line class="edge" x1="-100" x2="-40" y1="55" y2="115"></line><line class="edge" x1="100" x2="40" y1="55" y2="115"></line><line class="edge" x1="100" x2="160" y1="55" y2="115"></line><line class="edge" x1="-160" x2="-190" y1="115" y2="175"></line><line class="edgeN" x1="-160" x2="-130" y1="115" y2="175"></line><circle class="root" cx="0" cy="0" r="20"></circle><text class="lab" x="0" y="5">40</text><circle class="node" cx="-100" cy="55" r="20"></circle><text class="lab" x="-100" y="60">30</text><circle class="node" cx="100" cy="55" r="20"></circle><text class="lab" x="100" y="60">24</text><circle class="node" cx="-160" cy="115" r="20"></circle><text class="lab" x="-160" y="120">15</text><circle class="node" cx="-40" cy="115" r="20"></circle><text class="lab" x="-40" y="120">20</text><circle class="node" cx="40" cy="115" r="20"></circle><text class="lab" x="40" y="120">22</text><circle class="node" cx="160" cy="115" r="20"></circle><text class="lab" x="160" y="120">13</text><circle class="node" cx="-190" cy="175" r="20"></circle><text class="lab" x="-190" y="180">11</text><circle class="new" cx="-130" cy="175" r="20"></circle><text class="lab" x="-130" y="180">35</text><path d="M-130 155l-30-20" fill="none" marker-end="url(#arrUp)" stroke="var(--violet-deep)" stroke-width="2"></path><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" x="-95" y="150">与父 15 比较</text></g><text class="cap" x="600" y="330">• 数组：[40, 30, 24, 15, 20, 22, 13, 11,<tspan fill="var(--violet-deep)" font-weight="var(--svg-font-weight-bold)">35</tspan>]</text><text class="cap" x="600" y="352">• 新结点下标 i = 8，父下标 = (i-1)/2 = 3（值 15）</text><text class="cap" x="600" y="380">• 35 &gt; 父结点 15 → 需要上浮</text><line stroke="var(--neutral-light)" x1="30" x2="930" y1="515" y2="510"></line><text class="step" x="30" y="535">步骤 3：35 与父结点 15 交换（上浮一层），继续与新的父 30 比较</text><g transform="translate(240,560)"><line class="edge" x1="0" x2="-100" y1="0" y2="55"></line><line class="edge" x1="0" x2="100" y1="0" y2="55"></line><line class="edge" x1="-100" x2="-160" y1="55" y2="115"></line><line class="edge" x1="-100" x2="-40" y1="55" y2="115"></line><line class="edge" x1="100" x2="40" y1="55" y2="115"></line><line class="edge" x1="100" x2="160" y1="55" y2="115"></line><line class="edge" x1="-160" x2="-190" y1="115" y2="175"></line><line class="edge" x1="-160" x2="-130" y1="115" y2="175"></line><circle class="root" cx="0" cy="0" r="20"></circle><text class="lab" x="0" y="5">40</text><circle class="swap" cx="-100" cy="55" r="20"></circle><text class="lab" x="-100" y="60">30</text><circle class="node" cx="100" cy="55" r="20"></circle><text class="lab" x="100" y="60">24</text><circle class="moved" cx="-160" cy="115" r="20"></circle><text class="lab" x="-160" y="120">35</text><circle class="node" cx="-40" cy="115" r="20"></circle><text class="lab" x="-40" y="120">20</text><circle class="node" cx="40" cy="115" r="20"></circle><text class="lab" x="40" y="120">22</text><circle class="node" cx="160" cy="115" r="20"></circle><text class="lab" x="160" y="120">13</text><circle class="node" cx="-190" cy="175" r="20"></circle><text class="lab" x="-190" y="180">11</text><circle class="moved" cx="-130" cy="175" r="20"></circle><text class="lab" x="-130" y="180">15</text><path d="M-160 95l60-20" fill="none" marker-end="url(#arrUp)" stroke="var(--violet-deep)" stroke-width="2"></path><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" x="-95" y="88">与父 30 比较</text></g><text class="cap" x="600" y="575">• 数组：[40, 30, 24,<tspan fill="var(--lime-deep)" font-weight="var(--svg-font-weight-bold)">35</tspan>, 20, 22, 13, 11, 15]</text><text class="cap" x="600" y="597">• 35 当前下标 i = 3，父下标 = (i-1)/2 = 1（值 30）</text><text class="cap" x="600" y="625">• 35 &gt; 父结点 30 → 继续上浮</text><line stroke="var(--neutral-light)" x1="30" x2="930" y1="760" y2="760"></line><text class="step" x="30" y="780">步骤 4：35 与父 30 交换，再与根 40 比较，35 &lt; 40，停止上浮</text><g transform="translate(240,805)"><line class="edge" x1="0" x2="-100" y1="0" y2="55"></line><line class="edge" x1="0" x2="100" y1="0" y2="55"></line><line class="edge" x1="-100" x2="-160" y1="55" y2="115"></line><line class="edge" x1="-100" x2="-40" y1="55" y2="115"></line><line class="edge" x1="100" x2="40" y1="55" y2="115"></line><line class="edge" x1="100" x2="160" y1="55" y2="115"></line><line class="edge" x1="-160" x2="-190" y1="115" y2="175"></line><line class="edge" x1="-160" x2="-130" y1="115" y2="175"></line><circle class="root" cx="0" cy="0" r="20"></circle><text class="lab" x="0" y="5">40</text><circle class="moved" cx="-100" cy="55" r="20"></circle><text class="lab" x="-100" y="60">35</text><circle class="node" cx="100" cy="55" r="20"></circle><text class="lab" x="100" y="60">24</text><circle class="moved" cx="-160" cy="115" r="20"></circle><text class="lab" x="-160" y="120">30</text><circle class="node" cx="-40" cy="115" r="20"></circle><text class="lab" x="-40" y="120">20</text><circle class="node" cx="40" cy="115" r="20"></circle><text class="lab" x="40" y="120">22</text><circle class="node" cx="160" cy="115" r="20"></circle><text class="lab" x="160" y="120">13</text><circle class="node" cx="-190" cy="175" r="20"></circle><text class="lab" x="-190" y="180">11</text><circle class="node" cx="-130" cy="175" r="20"></circle><text class="lab" x="-130" y="180">15</text><path d="M-1e2 35-30 10" fill="none" stroke="var(--red-deep)" stroke-dasharray="4 3" stroke-width="2"></path><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="-40" y="0">35 &lt; 40，停止</text></g><text class="cap" x="600" y="820">• 最终数组：[40, 35, 24, 30, 20, 22, 13, 11, 15]</text><text class="cap" x="600" y="842">• 大根堆性质重新满足，插入完成</text><text class="note" x="600" y="870">图例：</text><g transform="translate(600,880)"><circle class="root" cx="10" cy="10" r="10"></circle><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="30" y="14">堆顶</text><circle class="new" cx="80" cy="10" r="10"></circle><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="100" y="14">新插入结点</text><circle class="swap" cx="200" cy="10" r="10"></circle><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="220" y="14">参与本步交换</text><circle class="moved" cx="320" cy="10" r="10"></circle><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="340" y="14">交换后位置</text></g></svg>