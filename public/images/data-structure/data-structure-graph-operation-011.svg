<svg height="875pt" viewBox="0 0 504.01 875" width="504pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><g class="graph" id="graph0" transform="scale(1 1) rotate(0) translate(4 871)"><title>DijkstraAlgorithm</title><g class="node" id="node1"><title>start</title><polygon fill="#90ee90" points="364,-867 310,-867 310,-831 364,-831 364,-867" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="337" y="-845.3">开始</text></g><g class="node" id="node2"><title>init</title><polygon fill="#add8e6" points="447,-794 227,-794 227,-726 447,-726 447,-794" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="337" y="-778.8">初始化阶段</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="337" y="-763.8">• dist[source] = 0</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="337" y="-748.8">• dist[v] = ∞ (其他节点)</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="337" y="-733.8">• visited[v] = false (所有节点)</text></g><g class="edge" id="edge1"><title>start-&gt;init</title><path d="M337-830.81C337-823.1 337-813.63 337-804.17" fill="none" stroke="#000"></path><polygon fill="#000" points="340.5,-804 337,-794 333.5,-804 340.5,-804" stroke="#000"></polygon></g><g class="node" id="node3"><title>loop_check</title><polygon fill="#ff0" points="337,-689 177.97,-671 337,-653 496.03,-671 337,-689" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="337" y="-667.3">是否还有未访问的节点？</text></g><g class="edge" id="edge2"><title>init-&gt;loop_check</title><path d="M337-725.61C337-716.85 337-707.51 337-699.12" fill="none" stroke="#000"></path><polygon fill="#000" points="340.5,-699.12 337,-689.12 333.5,-699.12 340.5,-699.12" stroke="#000"></polygon></g><g class="node" id="node4"><title>find_min</title><polygon fill="#e0ffff" points="249.5,-602 102.5,-602 102.5,-564 249.5,-564 249.5,-602" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="176" y="-586.8">找到未访问节点中</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="176" y="-571.8">dist[]值最小的节点u</text></g><g class="edge" id="edge3"><title>loop_check-&gt;find_min</title><path d="M310.41-655.8C285.59-642.54 248.11-622.52 219.03-606.99" fill="none" stroke="#000"></path><polygon fill="#000" points="220.38,-603.74 209.91,-602.11 217.08,-609.91 220.38,-603.74" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="278.5" y="-623.8">是</text></g><g class="node" id="node11"><title>finish</title><polygon fill="#90ee90" points="406,-602 268,-602 268,-564 406,-564 406,-602" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="337" y="-586.8">算法结束</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="337" y="-571.8">dist[]包含最短路径</text></g><g class="edge" id="edge4"><title>loop_check-&gt;finish</title><path d="M337-652.6C337-641.06 337-625.65 337-612.36" fill="none" stroke="#000"></path><polygon fill="#000" points="340.5,-612.27 337,-602.27 333.5,-612.27 340.5,-612.27" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="344.5" y="-623.8">否</text></g><g class="node" id="node5"><title>mark_visited</title><polygon fill="#e0ffff" points="249,-527 109,-527 109,-489 249,-489 249,-527" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="179" y="-511.8">标记节点u为已访问</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="179" y="-496.8">visited[u] = true</text></g><g class="edge" id="edge5"><title>find_min-&gt;mark_visited</title><path d="M176.74-563.96C177.07-555.88 177.47-546.18 177.84-537.18" fill="none" stroke="#000"></path><polygon fill="#000" points="181.34,-537.23 178.26,-527.09 174.35,-536.94 181.34,-537.23" stroke="#000"></polygon></g><g class="node" id="node6"><title>check_neighbors</title><polygon fill="#e0ffff" points="256,-452 122,-452 122,-416 256,-416 256,-452" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="189" y="-430.3">遍历u的所有邻居v</text></g><g class="edge" id="edge6"><title>mark_visited-&gt;check_neighbors</title><path d="M181.52-488.83C182.64-480.81 183.97-471.2 185.2-462.34" fill="none" stroke="#000"></path><polygon fill="#000" points="188.67,-462.8 186.58,-452.42 181.74,-461.84 188.67,-462.8" stroke="#000"></polygon></g><g class="node" id="node7"><title>neighbor_condition</title><polygon fill="#ff0" points="203,-365 0,-327 203,-289 406,-327 203,-365" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="203" y="-330.8">v未访问 且</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="203" y="-315.8">dist[u] + w(u,v) &lt; dist[v] ?</text></g><g class="edge" id="edge7"><title>check_neighbors-&gt;neighbor_condition</title><path d="M191.31-415.66C192.81-404.4 194.85-389.14 196.8-374.51" fill="none" stroke="#000"></path><polygon fill="#000" points="200.28,-374.91 198.13,-364.54 193.34,-373.98 200.28,-374.91" stroke="#000"></polygon></g><g class="node" id="node8"><title>relax</title><polygon fill="orange" points="280.5,-238 89.5,-238 89.5,-200 280.5,-200 280.5,-238" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="185" y="-222.8">松弛操作</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="185" y="-207.8">dist[v] = dist[u] + w(u,v)</text></g><g class="edge" id="edge8"><title>neighbor_condition-&gt;relax</title><path d="M196.91-290.11c-2.31 13.6-4.91 28.9-7.09 41.72" fill="none" stroke="#000"></path><polygon fill="#000" points="193.23,-247.56 188.11,-238.29 186.33,-248.73 193.23,-247.56" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="201.5" y="-259.8">是</text></g><g class="node" id="node9"><title>next_neighbor</title><polygon fill="#e0ffff" points="350,-149 234,-149 234,-113 350,-113 350,-149" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="292" y="-127.3">检查下一个邻居</text></g><g class="edge" id="edge9"><title>neighbor_condition-&gt;next_neighbor</title><path d="M243.35-296.3c17.41 15.28 35.98 35.49 45.65 58.3C299.62-212.95 298.98-181.49 296.54-159.37" fill="none" stroke="#000"></path><polygon fill="#000" points="299.99,-158.8 295.24,-149.33 293.05,-159.7 299.99,-158.8" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="305.5" y="-215.3">否</text></g><g class="edge" id="edge10"><title>relax-&gt;next_neighbor</title><path d="M207.43-199.97c16.01 12.87 37.7 30.3 55.11 44.29" fill="none" stroke="#000"></path><polygon fill="#000" points="265.09,-158.12 270.69,-149.13 260.71,-152.66 265.09,-158.12" stroke="#000"></polygon></g><g class="node" id="node10"><title>all_neighbors_done</title><polygon fill="#ff0" points="378,-76 276,-38 378,0 480,-38 378,-76" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="378" y="-41.8">u的所有邻居</text><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="378" y="-26.8">都检查完了？</text></g><g class="edge" id="edge11"><title>next_neighbor-&gt;all_neighbors_done</title><path d="M308.18-112.88c10.42 11.03 24.36 25.77 37.03 39.18" fill="none" stroke="#000"></path><polygon fill="#000" points="347.77,-76.08 352.09,-66.41 342.68,-71.28 347.77,-76.08" stroke="#000"></polygon></g><g class="edge" id="edge13"><title>all_neighbors_done-&gt;loop_check</title><path d="M405.34-65.91C419.56-82.79 434-105.88 434-130V-584c0-31.2-28.45-53.84-54.54-68.03" fill="none" stroke="#000"></path><polygon fill="#000" points="377.67,-649.01 370.38,-656.69 380.88,-655.23 377.67,-649.01" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="441.5" y="-386.8">是</text></g><g class="edge" id="edge12"><title>all_neighbors_done-&gt;neighbor_condition</title><path d="M374.3-74.75C371.44-96.55 366.65-124.79 359-149c-13.18-41.71-18-52.44-42-89-14.17-21.58-35.46-40.07-55.82-54.46" fill="none" stroke="#000"></path><polygon fill="#000" points="259.12,-289.63 252.84,-298.16 263.07,-295.4 259.12,-289.63" stroke="#000"></polygon><text font-family="Microsoft Yahei" font-size="14" text-anchor="middle" x="360.5" y="-170.8">否</text></g></g></svg>