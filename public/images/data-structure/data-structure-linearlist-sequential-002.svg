<svg height="600" viewBox="0 0 800 600" width="800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">顺序表 SeqList 数据结构</text><rect fill="var(--sky-soft)" height="180" rx="8" stroke="var(--indigo-mid)" stroke-width="2" width="300" x="50" y="60"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="200" y="85">结构体定义</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-body)" x="70" y="110">typedef struct {</text><text fill="var(--red-deep)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-body)" x="90" y="130">ElementType data[MAXSIZE];</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-body)" x="90" y="150">int length;</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-body)" x="70" y="170">} SeqList;</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="200">MAXSIZE = 100</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="220">初始化: L-&gt;length = 0</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="450" y="90">内存布局</text><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="450" y="120">data[MAXSIZE] 数组</text><g><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="380" y="145">索引:</text><rect fill="var(--surface)" height="30" stroke="var(--red-deep)" stroke-width="2" width="40" x="420" y="150"></rect><rect fill="var(--surface)" height="30" stroke="var(--red-deep)" stroke-width="2" width="40" x="460" y="150"></rect><rect fill="var(--surface)" height="30" stroke="var(--red-deep)" stroke-width="2" width="40" x="500" y="150"></rect><rect fill="var(--surface)" height="30" stroke="var(--red-deep)" stroke-width="2" width="40" x="540" y="150"></rect><rect fill="var(--surface)" height="30" stroke="var(--red-deep)" stroke-width="2" width="40" x="580" y="150"></rect><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" x="625" y="170">...</text><rect fill="var(--surface)" height="30" stroke="var(--red-deep)" stroke-width="2" width="40" x="650" y="150"></rect><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="440" y="145">0</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="480" y="145">1</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="520" y="145">2</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="560" y="145">3</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="600" y="145">4</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="670" y="145">99</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="440" y="170">空</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="480" y="170">空</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="520" y="170">空</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="560" y="170">空</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="600" y="170">空</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="670" y="170">空</text></g><text fill="var(--green-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="450" y="220">length 长度字段</text><rect fill="var(--mint-soft)" height="30" stroke="var(--green-mid)" stroke-width="2" width="60" x="420" y="235"></rect><text fill="var(--green-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="450" y="255">0</text><text fill="var(--green-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="490" y="255">(初始值)</text><rect fill="var(--surface)" height="250" rx="8" stroke="var(--neutral-mid)" stroke-width="1" width="700" x="50" y="300"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="325">初始化过程说明</text><circle cx="80" cy="355" fill="var(--indigo-mid)" r="15"></circle><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="80" y="360">1</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" x="110" y="360">定义顺序表结构：包含固定大小数组 data[MAXSIZE] 和长度字段 length</text><circle cx="80" cy="385" fill="var(--orange-mid)" r="15"></circle><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="80" y="390">2</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" x="110" y="390">MAXSIZE = 100，表示数组最多可存储100个元素</text><circle cx="80" cy="415" fill="var(--green-mid)" r="15"></circle><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="80" y="420">3</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" x="110" y="420">InitList(L) 函数：将 length 设置为 0，表示当前表为空表</text><circle cx="80" cy="445" fill="var(--purple-deep)" r="15"></circle><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="80" y="450">4</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" x="110" y="450">初始化后：数组预分配了空间，但 length=0 表示没有有效元素</text><rect fill="var(--neutral-soft)" height="60" rx="5" stroke="var(--indigo-light)" stroke-width="1" width="660" x="70" y="480"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="80" y="500">特点：</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="80" y="520">• 固定大小：数组大小在编译时确定，不能动态改变</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="400" y="520">• 顺序存储：元素在内存中连续存放</text><path d="M3e2 210q50 0 120 35" fill="none" marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="2"></path><text fill="var(--green-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="320" y="200">初始化后 length = 0</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="var(--green-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>