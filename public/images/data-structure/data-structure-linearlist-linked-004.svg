<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><rect fill="#f8f9fa" height="400" width="800"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="400" y="30">单链表结构示意图</text><g><rect fill="#e3f2fd" height="80" rx="5" stroke="#2196f3" stroke-width="2" width="120" x="50" y="80"></rect><rect fill="#bbdefb" height="80" stroke="#2196f3" stroke-width="1" width="60" x="50" y="80"></rect><rect fill="#fff3e0" height="80" stroke="#ff9800" stroke-width="1" width="60" x="110" y="80"></rect><line stroke="#333" stroke-width="1" x1="110" x2="110" y1="80" y2="160"></line><text fill="#666" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="80" y="100">data</text><text fill="#1976d2" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="80" y="130"></text><text fill="#666" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="140" y="100">next</text><text fill="#f57c00" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="140" y="130">→</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="110" y="180">Node 1</text></g><path d="M170 120h78" marker-end="url(#arrowhead)" stroke="#f57c00" stroke-width="2"></path><g><rect fill="#e8f5e8" height="80" rx="5" stroke="#4caf50" stroke-width="2" width="120" x="250" y="80"></rect><rect fill="#c8e6c9" height="80" stroke="#4caf50" stroke-width="1" width="60" x="250" y="80"></rect><rect fill="#fff3e0" height="80" stroke="#ff9800" stroke-width="1" width="60" x="310" y="80"></rect><line stroke="#333" stroke-width="1" x1="310" x2="310" y1="80" y2="160"></line><text fill="#666" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="280" y="100">data</text><text fill="#388e3c" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="280" y="130">20</text><text fill="#666" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="340" y="100">next</text><text fill="#f57c00" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="340" y="130">→</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="310" y="180">Node 2</text></g><path d="M370 120h78" marker-end="url(#arrowhead)" stroke="#f57c00" stroke-width="2"></path><g><rect fill="#fce4ec" height="80" rx="5" stroke="#e91e63" stroke-width="2" width="120" x="450" y="80"></rect><rect fill="#f8bbd9" height="80" stroke="#e91e63" stroke-width="1" width="60" x="450" y="80"></rect><rect fill="#fff3e0" height="80" stroke="#ff9800" stroke-width="1" width="60" x="510" y="80"></rect><line stroke="#333" stroke-width="1" x1="510" x2="510" y1="80" y2="160"></line><text fill="#666" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="480" y="100">data</text><text fill="#c2185b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="480" y="130">30</text><text fill="#666" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="540" y="100">next</text><text fill="#666" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="540" y="125">NULL</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="510" y="180">Node 3</text></g><rect fill="#f5f5f5" height="120" rx="5" stroke="#666" stroke-width="1" width="300" x="50" y="220"></rect><text fill="#333" font-family="monospace" font-size="12" font-weight="bold" x="60" y="240">typedef struct Node {</text><text fill="#1976d2" font-family="monospace" font-size="12" x="80" y="260">int data;</text><text fill="#666" font-family="Arial, sans-serif" font-size="14" x="220" y="260">// 存储数据</text><text fill="#f57c00" font-family="monospace" font-size="12" x="80" y="280">struct Node *next;</text><text fill="#666" font-family="Arial, sans-serif" font-size="14" x="220" y="280">// 指向下一个节点</text><text fill="#333" font-family="monospace" font-size="12" font-weight="bold" x="60" y="300">} Node;</text><text fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="400" y="250">特点说明：</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" x="400" y="270">• 每个节点包含数据和指针两部分</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" x="400" y="290">• 通过指针连接各个节点</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" x="400" y="310">• 最后一个节点的指针指向NULL</text><text fill="#666" font-family="Arial, sans-serif" font-size="12" x="400" y="330">• 在内存中可以非连续存储</text><rect fill="#ffecb3" height="20" rx="3" stroke="#ffa000" stroke-width="1" width="50" x="80" y="20"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="105" y="33">head</text><path d="M108 40V78" marker-end="url(#arrowhead)" stroke="#ffa000" stroke-width="2"></path><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#f57c00" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>