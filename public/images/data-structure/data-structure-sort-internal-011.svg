 dominant-baseline="central" text-anchor="middle" x="140" y="15">1</text><rect class="cell" height="30" width="40" x="160" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="180" y="15">9</text><rect class="cell" height="30" width="40" x="200" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="220" y="15">4</text><rect class="cell" height="30" width="40" x="240" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="260" y="15">7</text><rect class="cell" height="30" stroke="#c2185b" stroke-width="2" width="40" x="280" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="300" y="15">2</text><text class="ptrL" dominant-baseline="central" text-anchor="middle" x="20" y="-12">l</text><text class="ptrR" dominant-baseline="central" text-anchor="middle" x="300" y="-12">r</text><text class="lbl" dominant-baseline="central" x="340" y="15">r 自右向左找 &lt; 5 的值：停在 a[7]=2</text></g><g transform="translate(60,200)"><text class="title" dominant-baseline="central" fill="#444" x="-50" y="15">Step 2</text><rect class="moved" height="30" width="40" x="0" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="20" y="15">2</text><rect class="cell" height="30" width="40" x="40" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="60" y="15">3</text><rect class="cell" height="30" width="40" x="80" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="100" y="15">8</text><rect class="cell" height="30" width="40" x="120" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="140" y="15">1</text><rect class="cell" height="30" width="40" x="160" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="180" y="15">9</text><rect class="cell" height="30" width="40" x="200" y="0"></rect><text dominant-baseline="central" text-anchor="middle" x="220" y="15">4</text><rect class="cell" height="30" width="40" x="240" y="0"></rect><text dominant-baselin