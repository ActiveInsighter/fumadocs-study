<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"><rect fill="none" height="600" width="800"></rect><text fill="#2c3e50" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="45">排序算法时间复杂度层次图</text><rect fill="#2ecc71" fill-opacity=".2" height="80" rx="10" stroke="#27ae60" stroke-width="2" width="700" x="50" y="80"></rect><text fill="#27ae60" font-size="18" font-weight="bold" x="70" y="105">O(n + k) - 线性时间</text><text fill="#27ae60" font-size="14" x="70" y="125">桶排序（理想情况）</text><text fill="#27ae60" font-size="14" x="70" y="145">基数排序：O(d·(n+k))</text><rect fill="#3498db" fill-opacity=".2" height="100" rx="10" stroke="#2980b9" stroke-width="2" width="700" x="50" y="180"></rect><text fill="#2980b9" font-size="18" font-weight="bold" x="70" y="205">O(n log n) - 对数线性时间</text><text fill="#2980b9" font-size="14" x="70" y="225">归并排序（稳定）</text><text fill="#2980b9" font-size="14" x="70" y="245">堆排序</text><text fill="#2980b9" font-size="14" x="70" y="265">快速排序（平均情况）</text><circle cx="200" cy="220" fill="#27ae60" r="8"></circle><text fill="#27ae60" font-size="12" x="215" y="224">稳定</text><rect fill="#e74c3c" fill-opacity=".2" height="140" rx="10" stroke="#c0392b" stroke-width="2" width="700" x="50" y="300"></rect><text fill="#c0392b" font-size="18" font-weight="bold" x="70" y="325">O(n²) - 二次时间</text><text fill="#c0392b" font-size="14" x="70" y="350">冒泡排序（稳定）</text><text fill="#c0392b" font-size="14" x="70" y="370">选择排序</text><text fill="#c0392b" font-size="14" x="70" y="390">插入排序（稳定）</text><text fill="#c0392b" font-size="14" x="70" y="410">希尔排序（最坏情况）</text><text fill="#c0392b" font-size="14" x="70" y="430">快速排序（最坏情况）</text><circle cx="185" cy="344" fill="#27ae60" r="8"></circle><text fill="#27ae60" font-size="12" x="200" y="349">稳定</text><circle cx="185" cy="384" fill="#27ae60" r="8"></circle><text fill="#27ae60" font-size="12" x="200" y="388">稳定</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#7f8c8d" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead)" stroke="#7f8c8d" stroke-width="3" x1="770" x2="770" y1="120" y2="400"></line><text fill="#7f8c8d" font-size="14" x="780" y="260">↓</text><rect fill="#f39c12" fill-opacity=".1" height="120" rx="5" stroke="#e67e22" stroke-width="1" width="700" x="50" y="460"></rect><text fill="#d35400" font-size="16" font-weight="bold" x="70" y="485">空间复杂度对比</text><text fill="#d35400" font-size="12" x="70" y="510">O(1) 常数空间：冒泡、选择、插入、希尔排序、堆排序</text><text fill="#d35400" font-size="12" x="70" y="530">O(log n) 对数空间：快速排序（递归栈）</text><text fill="#d35400" font-size="12" x="70" y="550">O(n) 线性空间：归并排序</text><text fill="#d35400" font-size="12" x="70" y="570">O(n + k) 线性空间：桶排序、基数排序</text><circle cx="420" cy="349" fill="#27ae60" r="8"></circle><text fill="#666" font-size="12" x="435" y="353">绿色圆点表示稳定排序</text></svg>