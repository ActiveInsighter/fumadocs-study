 fill="#27AE60" font-size="11" text-anchor="middle" x="510" y="136">2</text><text fill="#555" font-size="11" text-anchor="middle" x="570" y="136">0</text><text fill="#555" font-size="11" text-anchor="middle" x="620" y="136">16</text><text fill="#2C7BB6" font-size="11" x="680" y="136">i++</text><rect fill="#E8F8F0" height="20" rx="4" stroke="#27AE60" stroke-width="1.5" width="444" x="288" y="147"></rect><text fill="#333" font-size="11" text-anchor="middle" x="330" y="162">…</text><text fill="#2C7BB6" font-size="11" text-anchor="middle" x="390" y="162">9</text><text fill="#9B59B6" font-size="11" text-anchor="middle" x="450" y="162">10</text><text fill="#27AE60" font-size="11" text-anchor="middle" x="510" y="162">9</text><text fill="#555" font-size="11" text-anchor="middle" x="570" y="162">9</text><text fill="#27AE60" font-size="11" font-weight="bold" text-anchor="middle" x="620" y="162">2 ✓</text><text fill="#888" font-size="11" x="680" y="162">最小</text><text fill="#888" font-size="11" x="310" y="193">规则：每步移动三者中的 最小值 对应的指针（移大值只会让D增大）</text><rect fill="#FFF3DC" height="54" rx="8" stroke="#E67E22" stroke-width="1.5" width="248" x="20" y="180"></rect><text fill="#E67E22" font-size="12" font-weight="bold" x="30" y="200">关键直觉</text><text fill="#555" font-size="11" x="30" y="216">三值中最小者 = 距离贡献最大方</text><text fill="#555" font-size="11" x="30" y="230">移动它才有机会缩短距离</text><line stroke="#DDD" stroke-dasharray="5,4" stroke-width="1" x1="0" x2="760" y1="248" y2="248"></line><text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="380" y="268">后缀预处理 — 维护右侧最大值/最小值</text><text fill="#333" font-size="12" font-weight="bold" x="20" y="294">A:</text><rect fill="#DEF" height="28" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="40" x="44" y="280"></rect><text fill="#2C7BB6" font-size="14" font-weight="bold" text-anchor="middle" x="64" y="299">1</text><rect fill="#DEF" height="28" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="40" x="90" y="280"></rect><text fill="#2C7BB6" font-size="14" font-weight="bold" text-anchor="middle" x="110" y="299">4</text><rect fill="#FDECEA" height="28" rx="5" stroke="#E74C3C" stroke-width="1.5" width="40" x="136" y="280"></rect><text fill="#E74C3C" font-size="14" font-weight="bold" text-anchor="middle" x="156" y="299">-9</text><rect fill="#DEF" height="28" rx="5" stroke="#2C7BB6" stroke-width="1.5" width="40" x="182" y="280"></rect><text fill="#2C7BB6" font-size="14" font-weight="bold" text-anchor="middle" x="202" y="299">6</text><text fill="#555" font-size="11" x="260" y="294">← 从右到左扫描，维护 maxVal / minVal</text><text fill="#555" font-size="11" x="260" y="310">i=3: max=6, min=6 → res[3] = 6×6=36</text><text fill="#333" font-size="12" font-weight="bold" x="470" y="294">res:</text><rect fill="#EBF9E0" height="28" rx="5" stroke="#27AE60" stroke-width="1.5" width="40" x="494" y="280"></rect><text fill="#27AE60" font-size="13" font-weight="bold" text-anchor="middle" x="514" y="299">6</text><rect fill="#EBF9E0" height="28" rx="5" stroke="#27AE60" stroke-width="1.5" width="40" x="540" y="280"></rect><text fill="#27AE60" font-size="13" font-weight="bold" text-anchor="middle" x="560" y="299">24</text><rect fill="#EBF9E0" height="28" rx="5" stroke="#27AE60" stroke-width="1.5" width="40" x="586" y="280"></rect><text fill="#27AE60" font-size="13" font-weight="bold" text-anchor="middle" x="606" y="299">81</text><rect fill="#EBF9E0" height="28" rx="5" stroke="#27AE60" stroke-width="1.5" width="40" x="632" y="280"></rect><text fill="#27AE60" font-size="13" font-weight="bold" text-anchor="middle" x="652" y="299">36</text><text fill="#888" font-size="11" x="690" y="296">O(n)/O(1)</text></svg>