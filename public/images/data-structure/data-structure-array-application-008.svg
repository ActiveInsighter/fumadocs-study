<svg font-family="var(--svg-font-family)" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--purple-deep)"></path></marker></defs><rect fill="var(--violet-soft)" height="560" width="900"></rect><g><rect fill="var(--violet-deep)" height="110" rx="14" ry="14" stroke="var(--violet-mid)" stroke-width="1.5" width="840" x="30" y="25"></rect><text fill="var(--violet-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="60" y="65">卡特兰数 Catalan number</text><g fill="var(--violet-ink)" font-family="var(--svg-font-family)" transform="translate(430,90)"><text font-size="var(--svg-font-size-title)" font-style="italic" x="0" y="6">C</text><text font-size="var(--svg-font-size-title)" font-style="italic" x="21" y="16">n</text><text font-size="var(--svg-font-size-title)" x="42" y="6">=</text><text font-size="var(--svg-font-size-title)" text-anchor="middle" x="78" y="-8">1</text><line stroke="var(--violet-ink)" stroke-width="2" x1="60" x2="98" y1="0" y2="0"></line><text font-size="var(--svg-font-size-title)" font-style="italic" text-anchor="middle" x="78" y="24">n+1</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" x="118" y="12">(</text><text font-size="var(--svg-font-size-title)" font-style="italic" text-anchor="middle" x="160" y="-4">2n</text><text font-size="var(--svg-font-size-title)" font-style="italic" text-anchor="middle" x="160" y="26">n</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" x="180" y="12">)</text><text font-size="var(--svg-font-size-title)" x="220" y="6">=</text><text font-size="var(--svg-font-size-title)" font-style="italic" text-anchor="middle" x="290" y="-8">(2n)!</text><line stroke="var(--violet-ink)" stroke-width="2" x1="240" x2="340" y1="0" y2="0"></line><text font-size="var(--svg-font-size-title)" font-style="italic" text-anchor="middle" x="290" y="24">(n+1)! · n!</text></g></g><g transform="translate(30,160)"><text fill="var(--violet-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-semibold)" x="0" y="0">前几项</text><g fill="var(--violet-ink)" font-size="var(--svg-font-size-body)"><g transform="translate(0,12)"><g><rect fill="var(--surface)" height="34" rx="6" stroke="var(--violet-mid)" width="70" x="0" y="0"></rect><text font-style="italic" text-anchor="middle" x="35" y="21">n</text></g><g transform="translate(75,0)"><rect fill="var(--surface)" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">0</text></g><g transform="translate(150,0)"><rect fill="var(--surface)" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">1</text></g><g transform="translate(225,0)"><rect fill="var(--surface)" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">2</text></g><g transform="translate(300,0)"><rect fill="var(--surface)" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">3</text></g><g transform="translate(375,0)"><rect fill="var(--surface)" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">4</text></g><g transform="translate(450,0)"><rect fill="var(--surface)" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">5</text></g><g transform="translate(525,0)"><rect fill="var(--surface)" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">6</text></g><g transform="translate(600,0)"><rect fill="var(--surface)" height="34" rx="6" strok