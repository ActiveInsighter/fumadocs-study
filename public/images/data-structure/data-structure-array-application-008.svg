<svg font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fdfcff"></stop><stop offset="100%" stop-color="#f4f1fa"></stop></linearGradient><linearGradient id="card" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"></stop><stop offset="100%" stop-color="#f7f4fd"></stop></linearGradient><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#7c5cd6"></path></marker></defs><rect fill="url(#bg)" height="560" width="900"></rect><g><rect fill="url(#card)" height="110" rx="14" ry="14" stroke="#c9bde9" stroke-width="1.5" width="840" x="30" y="25"></rect><text fill="#3a2f66" font-size="20" font-weight="700" x="60" y="65">卡特兰数 Catalan number</text><g fill="#2b234d" font-family="'Cambria Math','Times New Roman',serif" transform="translate(430,90)"><text font-size="34" font-style="italic" x="0" y="6">C</text><text font-size="18" font-style="italic" x="21" y="16">n</text><text font-size="30" x="42" y="6">=</text><text font-size="24" text-anchor="middle" x="78" y="-8">1</text><line stroke="#2b234d" stroke-width="2" x1="60" x2="98" y1="0" y2="0"></line><text font-size="22" font-style="italic" text-anchor="middle" x="78" y="24">n+1</text><text font-family="'Cambria Math',serif" font-size="60" x="118" y="12">(</text><text font-size="22" font-style="italic" text-anchor="middle" x="160" y="-4">2n</text><text font-size="22" font-style="italic" text-anchor="middle" x="160" y="26">n</text><text font-family="'Cambria Math',serif" font-size="60" x="180" y="12">)</text><text font-size="28" x="220" y="6">=</text><text font-size="22" font-style="italic" text-anchor="middle" x="290" y="-8">(2n)!</text><line stroke="#2b234d" stroke-width="2" x1="240" x2="340" y1="0" y2="0"></line><text font-size="22" font-style="italic" text-anchor="middle" x="290" y="24">(n+1)! · n!</text></g></g><g transform="translate(30,160)"><text fill="#3a2f66" font-size="16" font-weight="600" x="0" y="0">前几项</text><g fill="#2b234d" font-size="14"><g transform="translate(0,12)"><g><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70" x="0" y="0"></rect><text font-style="italic" text-anchor="middle" x="35" y="21">n</text></g><g transform="translate(75,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">0</text></g><g transform="translate(150,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">1</text></g><g transform="translate(225,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">2</text></g><g transform="translate(300,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">3</text></g><g transform="translate(375,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">4</text></g><g transform="translate(450,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">5</text></g><g transform="translate(525,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">6</text></g><g transform="translate(600,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">7</text></g><g transform="translate(675,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">8</text></g><g transform="translate(750,0)"><rect fill="#fff" height="34" rx="6" stroke="#c9bde9" width="90"></rect><text text-anchor="middle" x="45" y="21">…</text></g></g><g transform="translate(0,50)"><g><rect fill="#efe8fb" height="34" rx="6" stroke="#c9bde9" width="70" x="0" y="0"></rect><text font-style="italic" text-anchor="middle" x="35" y="21">C_n</text></g><g transform="translate(75,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">1</text></g><g transform="translate(150,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">1</text></g><g transform="translate(225,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">2</text></g><g transform="translate(300,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">5</text></g><g transform="translate(375,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">14</text></g><g transform="translate(450,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">42</text></g><g transform="translate(525,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">132</text></g><g transform="translate(600,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">429</text></g><g transform="translate(675,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="70"></rect><text text-anchor="middle" x="35" y="21">1430</text></g><g transform="translate(750,0)"><rect fill="#f7f4fd" height="34" rx="6" stroke="#c9bde9" width="90"></rect><text text-anchor="middle" x="45" y="21">…</text></g></g></g></g><g transform="translate(30,270)"><text fill="#3a2f66" font-size="16" font-weight="600" x="0" y="0">等价问题（以 n = 3 为例，答案均为 C₃ = 5）</text><g transform="translate(0,15)"><rect fill="url(#card)" height="260" rx="12" stroke="#c9bde9" width="270"></rect><text fill="#5a3fb0" font-size="15" font-weight="700" x="16" y="30">1. 括号匹配</text><text fill="#5a4a7d" font-size="12" x="16" y="52">n 对括号的合法排列</text><g fill="#2b234d" font-family="'JetBrains Mono','Menlo','Courier New',monospace" font-size="20"><text x="30" y="90">( ( ( ) ) )</text><text x="30" y="120">( ( ) ( ) )</text><text x="30" y="150">( ( ) ) ( )</text><text x="30" y="180">( ) ( ( ) )</text><text x="30" y="210">( ) ( ) ( )</text></g><text fill="#7263a3" font-size="12" font-style="italic" x="16" y="245">( 视为入栈，) 视为出栈</text></g><g transform="translate(285,15)"><rect fill="url(#card)" height="260" rx="12" stroke="#c9bde9" width="270"></rect><text fill="#5a3fb0" font-size="15" font-weight="700" x="16" y="30">2. 入栈出栈序列</text><text fill="#5a4a7d" font-size="12" x="16" y="52">1,2,3 依次入栈，所有合法出栈</text><g fill="#2b234d" font-family="'JetBrains Mono','Menlo','Courier New',monospace" font-size="18"><text x="30" y="90">1 2 3</text><text x="30" y="120">1 3 2</text><text x="30" y="150">2 1 3</text><text x="30" y="180">2 3 1</text><text x="30" y="210">3 2 1</text></g><text fill="#7263a3" font-size="12" font-style="italic" x="16" y="245">仅 3 1 2 不可能</text></g><g transform="translate(570,15)"><rect fill="url(#card)" height="260" rx="12" stroke="#c9bde9" width="270"></rect><text fill="#5a3fb0" font-size="15" font-weight="700" x="16" y="30">3. 二叉树形态</text><text fill="#5a4a7d" font-size="12" x="16" y="52">n 个节点可构造的不同形态二叉树</text><g fill="#fff" stroke="#5a3fb0" stroke-width="1.6"><g transform="translate(35,80)"><line x1="0" x2="14" y1="0" y2="20"></line><line x1="14" x2="28" y1="20" y2="40"></line><circle cx="0" cy="0" r="6"></circle><circle cx="14" cy="20" r="6"></circle><circle cx="28" cy="40" r="6"></circle></g><g transform="translate(90,80)"><line x1="0" x2="14" y1="0" y2="20"></line><line x1="14" x2="0" y1="20" y2="40"></line><circle cx="0" cy="0" r="6"></circle><circle cx="14" cy="20" r="6"></circle><circle cx="0" cy="40" r="6"></circle></g><g transform="translate(145,80)"><line x1="14" x2="0" y1="0" y2="20"></line><line x1="14" x2="28" y1="0" y2="20"></line><circle cx="14" cy="0" r="6"></circle><circle cx="0" cy="20" r="6"></circle><circle cx="28" cy="20" r="6"></circle></g><g transform="translate(210,80)"><line x1="14" x2="0" y1="0" y2="20"></line><line x1="0" x2="14" y1="20" y2="40"></line><circle cx="14" cy="0" r="6"></circle><circle cx="0" cy="20" r="6"></circle><circle cx="14" cy="40" r="6"></circle></g><g transform="translate(35,180)"><line x1="28" x2="14" y1="0" y2="20"></line><line x1="14" x2="0" y1="20" y2="40"></line><circle cx="28" cy="0" r="6"></circle><circle cx="14" cy="20" r="6"></circle><circle cx="0" cy="40" r="6"></circle></g></g><text fill="#7263a3" font-size="12" font-style="italic" x="16" y="245">共 5 种形态</text></g></g></svg>