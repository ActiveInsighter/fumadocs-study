" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">429</text></g><g transform="translate(675,0)"><rect fill="var(--violet-soft)" height="34" rx="6" stroke="var(--violet-mid)" width="70"></rect><text text-anchor="middle" x="35" y="21">1430</text></g><g transform="translate(750,0)"><rect fill="var(--violet-soft)" height="34" rx="6" stroke="var(--violet-mid)" width="90"></rect><text text-anchor="middle" x="45" y="21">…</text></g></g></g></g><g transform="translate(30,270)"><text fill="var(--violet-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-semibold)" x="0" y="0">等价问题（以 n = 3 为例，答案均为 C₃ = 5）</text><g transform="translate(0,15)"><rect fill="var(--violet-deep)" height="260" rx="12" stroke="var(--violet-mid)" width="270"></rect><text fill="var(--purple-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="16" y="30">1. 括号匹配</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" x="16" y="52">n 对括号的合法排列</text><g fill="var(--violet-ink)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-title)"><text x="30" y="90">( ( ( ) ) )</text><text x="30" y="120">( ( ) ( ) )</text><text x="30" y="150">( ( ) ) ( )</text><text x="30" y="180">( ) ( ( ) )</text><text x="30" y="210">( ) ( ) ( )</text></g><text fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" font-style="italic" x="16" y="245">( 视为入栈，) 视为出栈</text></g><g transform="translate(285,15)"><rect fill="var(--violet-deep)" height="260" rx="12" stroke="var(--violet-mid)" width="270"></rect><text fill="var(--purple-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="16" y="30">2. 入栈出栈序列</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" x="16" y="52">1,2,3 依次入栈，所有合法出栈</text><g fill="var(--violet-ink)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-title)"><text x="30" y="90">1 2 3</text><text x="30" y="120">1 3 2</text><text x="30" y="150">2 1 3</text><text x="30" y="180">2 3 1</text><text x="30" y="210">3 2 1</text></g><text fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" font-style="italic" x="16" y="245">仅 3 1 2 不可能</text></g><g transform="translate(570,15)"><rect fill="var(--violet-deep)" height="260" rx="12" stroke="var(--violet-mid)" width="270"></rect><text fill="var(--purple-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="16" y="30">3. 二叉树形态</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" x="16" y="52">n 个节点可构造的不同形态二叉树</text><g fill="var(--surface)" stroke="var(--purple-deep)" stroke-width="1.6"><g transform="translate(35,80)"><line x1="0" x2="14" y1="0" y2="20"></line><line x1="14" x2="28" y1="20" y2="40"></line><circle cx="0" cy="0" r="6"></circle><circle cx="14" cy="20" r="6"></circle><circle cx="28" cy="40" r="6"></circle></g><g transform="translate(90,80)"><line x1="0" x2="14" y1="0" y2="20"></line><line x1="14" x2="0" y1="20" y2="40"></line><circle cx="0" cy="0" r="6"></circle><circle cx="14" cy="20" r="6"></circle><circle cx="0" cy="40" r="6"></circle></g><g transform="translate(145,80)"><line x1="14" x2="0" y1="0" y2="20"></line><line x1="14" x2="28" y1="0" y2="20"></line><circle cx="14" cy="0" r="6"></circle><circle cx="0" cy="20" r="6"></circle><circle cx="28" cy="20" r="6"></circle></g><g transform="translate(210,80)"><line x1="14" x2="0" y1="0" y2="20"></line><line x1="0" x2="14" y1="20" y2="40"></line><circle cx="14" cy="0" r="6"></circle><circle cx="0" cy="20" r="6"></circle><circle cx="14" cy="40" r="6"></circle></g><g transform="translate(35,180)"><line x1="28" x2="14" y1="0" y2="20"></line><line x1="14" x2="0" y1="20" y2="40"></line><circle cx="28" cy="0" r="6"></circle><circle cx="14" cy="20" r="6"></circle><circle cx="0" cy="40" r="6"></circle></g></g><text fill="var(--violet-deep)" font-size="var(--svg-font-