<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg"><defs><style>.title{font-family:Arial,sans-serif;font-size:24px;font-weight:700;fill:#2c3e50}.subtitle{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#34495e}.desc{font-family:Arial,sans-serif;font-size:12px;fill:#7f8c8d}.element{font-family:Arial,sans-serif;font-size:12px;fill:#fff;text-anchor:middle}.arrow{stroke:#e74c3c;stroke-width:2;fill:none;marker-end:url(#arrowhead)}.highlight{stroke:#e74c3c;stroke-width:2;fill:none}</style><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text class="title" text-anchor="middle" x="360" y="30">排序算法一趟操作特征图解</text><g id="bubble-sort" transform="translate(50, 60)"><text class="subtitle" x="0" y="15">冒泡排序</text><text class="desc" x="0" y="30">相邻比较，最大元素"冒"到末尾</text><rect fill="#3498db" height="25" rx="3" width="30" x="0" y="40"></rect><text class="element" x="15" y="56">5</text><rect fill="#3498db" height="25" rx="3" width="30" x="35" y="40"></rect><text class="element" x="50" y="56">2</text><rect fill="#3498db" height="25" rx="3" width="30" x="70" y="40"></rect><text class="element" x="85" y="56">8</text><rect fill="#3498db" height="25" rx="3" width="30" x="105" y="40"></rect><text class="element" x="120" y="56">1</text><rect fill="#3498db" height="25" rx="3" width="30" x="140" y="40"></rect><text class="element" x="155" y="56">9</text><path class="arrow" d="M180 52h30"></path><rect fill="#3498db" height="25" rx="3" width="30" x="220" y="40"></rect><text class="element" x="235" y="56">2</text><rect fill="#3498db" height="25" rx="3" width="30" x="255" y="40"></rect><text class="element" x="270" y="56">5</text><rect fill="#3498db" height="25" rx="3" width="30" x="290" y="40"></rect><text class="element" x="305" y="56">1</text><rect fill="#3498db" height="25" rx="3" width="30" x="325" y="40"></rect><text class="element" x="340" y="56">8<