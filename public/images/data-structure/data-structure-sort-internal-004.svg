5" rx="3" width="30" x="70" y="40"></rect><text class="element" x="85" y="56">1</text><rect fill="#95a5a6" height="25" rx="3" width="30" x="105" y="40"></rect><text class="element" x="120" y="56">8</text><rect fill="#95a5a6" height="25" rx="3" width="30" x="140" y="40"></rect><text class="element" x="155" y="56">9</text><path class="arrow" d="M180 52h30"></path><rect fill="#27ae60" height="25" rx="3" width="30" x="220" y="40"></rect><text class="element" x="235" y="56">1</text><rect fill="#27ae60" height="25" rx="3" width="30" x="255" y="40"></rect><text class="element" x="270" y="56">2</text><rect fill="#27ae60" height="25" rx="3" width="30" x="290" y="40"></rect><text class="element" x="305" y="56">5</text><rect fill="#95a5a6" height="25" rx="3" width="30" x="325" y="40"></rect><text class="element" x="340" y="56">8</text><rect fill="#95a5a6" height="25" rx="3" width="30" x="360" y="40"></rect><text class="element" x="375" y="56">9</text><text class="desc" x="400" y="48">已排序</text><text class="desc" x="400" y="62">未排序</text></g><g id="quick-sort" transform="translate(50, 300)"><text class="subtitle" x="0" y="15">快速排序</text><text class="desc" x="0" y="30">基准分区，左小右大</text><rect fill="#3498db" height="25" rx="3" width="30" x="0" y="40"></rect><text class="element" x="15" y="56">3</text><rect fill="#3498db" height="25" rx="3" width="30" x="35" y="40"></rect><text class="element" x="50" y="56">7</text><rect fill="#f39c12" height="25" rx="3" width="30" x="70" y="40"></rect><text class="element" x="85" y="56">5</text><rect fill="#3498db" height="25" rx="3" width="30" x="105" y="40"></rect><text class="element" x="120" y="56">1</text><rect fill="#3498db" height="25" rx="3" width="30" x="140" y="40"></rect><text class="element" x="155" y="56">9</text><path class="arrow" d="M180 52h30"></path><rect fill="#27ae60" height="25" rx="3" width="30" x="220" y="40"></rect><text class="element" x="235" y="56">3</text><rect fill="#27ae60" height="25" rx="3" width="30" x="255" y="40"></rect><text class="element" x="270" y="56">1</text><rect fill="#e74c3c" height="25" rx="3" width="30" x="290" y="40"></rect><text class="element" x="305" y="56">5</text><rect fill="#9b59b6" height="25" rx="3" width="30" x="325" y="40"></rect><text class="element" x="340" y="56">7</text><rect fill="#9b59b6" height="25" rx="3" width="30" x="360" y="40"></rect><text class="element" x="375" y="56">9</text><text class="desc" x="220" y="82">&lt; 基准</text><text class="desc" x="290" y="82">基准</text><text class="desc" x="335" y="82">&gt; 基准</text></g><g id="merge-sort" transform="translate(50, 400)"><text class="subtitle" x="0" y="15">归并排序</text><text class="desc" x="0" y="30">合并相邻有序子数组</text><rect fill="#27ae60" height="25" rx="3" width="30" x="0" y="40"></rect><text class="element" x="15" y="56">1</text><rect fill="#27ae60" height="25" rx="3" width="30" x="35" y="40"></rect><text class="element" x="50" y="56">5</text><rect fill="#3498db" height="25" rx="3" width="30" x="80" y="40"></rect><text class="element" x="95" y="56">2</text><rect fill="#3498db" height="25" rx="3" width="30" x="115" y="40"></rect><text class="element" x="130" y="56">8</text><rect fill="#3498db" height="25" rx="3" width="30" x="150" y="40"></rect><text class="element" x="165" y="56">9</text><path class="arrow" d="M190 52h30"></path><rect fill="#e67e22" height="25" rx="3" width="30" x="230" y="40"></rect><text class="element" x="245" y="56">1</text><rect fill="#e67e22" height="25" rx="3" width="30" x="265" y="40"></rect><text class="element" x="280" y="56">2</text><rect fill="#e67e22" height="25" rx="3" width="30" x="300" y="40"></rect><text class="element" x="315" y="56">5</text><rect fill="#e67e22" height="25" rx="3" width="30" x="335" y="40"></rect><text class="element" x="350" y="56">8</text><rect fill="#e67e22" height="25" rx="3" width="30" x="370" y="40"></rect><text class="element" x="385" y="56">9</text><text class="desc" x="10" y="82">子数组1</text><text class="desc" x="95" y="82">子数组2</text><text class="desc" x="300" y="82">合并有序</text></g><g id="heap-sort" transform="translate(50, 500)"><text class="subtitle" x="0" y="15">堆排序</text><text class="desc" x="0" y="30">堆顶元素移到末尾</text><rect fill="#e74c3c" height="25" rx="3" width="30" x="0" y="40"></rect><text class="element" x="15" y="56">9</text><rect fill="#3498db" height="25" rx="3" width="30" x="35" y="40"></rect><text class="element" x="50" y="56">5</text><rect fill="#3498db" height="25" rx="3" width="30" x="70" y="40"></rect><text class="element" x="85" y="56">8</text><rect fill="#3498db" height="25" rx="3" width="30" x="105" y="40"></rect><text class="element" x="120" y="56">2</text><rect fill="#3498db" height="25" rx="3" width="30" x="140" y="40"></rect><text class="element" x="155" y="56">1</text><path class="arrow" d="M180 52h30"></path><rect fill="#3498db" height="25" rx="3" width="30" x="220" y="40"></rect><text class="element" x="235" y="56">8</text><rect fill="#3498db" height="25" rx="3" width="30" x="255" y="40"></rect><text class="element" x="270" y="56">5</text><rect fill="#3498db" height="25" rx="3" width="30" x="290" y="40"></rect><text class="element" x="305" y="56">1</text><rect fill="#3498db" height="25" rx="3" width="30" x="325" y="40"></rect><text class="element" x="340" y="56">2</text><rect fill="#27ae60" height="25" rx="3" width="30" x="360" y="40"></rect><text class="element" x="375" y="56">9</text><text class="desc" x="5" y="82">堆顶(最大)</text><text class="desc" x="365" y="82">已排序</text></g><g id="radix-sort" transform="translate(50, 600)"><text class="subtitle" x="0" y="15">基数排序</text><text class="desc" x="0" y="30">按数位稳定排序</text><rect fill="#3498db" height="25" rx="3" width="35" x="0" y="40"></rect><text class="element" x="17" y="56">123</text><rect fill="#3498db" height="25" rx="3" width="35" x="40" y="40"></rect><text class="element" x="57" y="56">456</text><rect fill="#3498db" height="25" rx="3" width="35" x="80" y="40"></rect><text class="element" x="97" y="56">321</text><rect fill="#3498db" height="25" rx="3" width="35" x="120" y="40"></rect><text class="element" x="137" y="56">654</text><path class="arrow" d="M165 52h25"></path><text class="desc" x="165" y="35">按个位</text><rect fill="#e67e22" height="25" rx="3" width="35" x="200" y="40"></rect><text class="element" x="217" y="56">321</text><rect fill="#e67e22" height="25" rx="3" width="35" x="240" y="40"></rect><text class="element" x="257" y="56">123</text><rect fill="#e67e22" height="25" rx="3" width="35" x="280" y="40"></rect><text class="element" x="297" y="56">654</text><rect fill="#e67e22" height="25" rx="3" width="35" x="320" y="40"></rect><text class="element" x="337" y="56">456</text><text class="desc" x="220" y="82">按个位数字排序</text></g><g id="legend" transform="translate(520, 100)"><text class="subtitle" x="0" y="15">图例说明</text><rect fill="#3498db" height="15" rx="2" width="20" x="0" y="30"></rect><text class="desc" x="25" y="42">未排序元素</text><rect fill="#27ae60" height="15" rx="2" width="20" x="0" y="55"></rect><text class="desc" x="25" y="67">已排序/就位元素</text><rect fill="#e74c3c" height="15" rx="2" width="20" x="0" y="80"></rect><text class="desc" x="25" y="92">关键元素(基准/堆顶)</text><rect fill="#f39c12" height="15" rx="2" width="20" x="0" y="105"></rect><text class="desc" x="25" y="117">当前处理元素</text><rect fill="#9b59b6" height="15" rx="2" width="20" x="0" y="130"></rect><text class="desc" x="25" y="142">大于基准的元素</text><rect fill="#e67e22" height="15" rx="2" width="20" x="0" y="155"></rect><text class="desc" x="25" y="167">合并/处理后的元素</text></g><g id="summary" transform="translate(520, 300)"><text class="subtitle" x="0" y="15">一趟操作核心特征</text><text class="desc" x="0" y="40">• 冒泡：最值逐渐"浮"到边界</text><text class="desc" x="0" y="60">• 选择：直接定位最值到指定位置</text><text class="desc" x="0" y="80">• 插入：维护前缀有序性</text><text class="desc" x="0" y="100">• 快排：基准分区，确定相对位置</text><text class="desc" x="0" y="120">• 归并：小有序段合并成大有序段</text><text class="desc" x="0" y="140">• 堆排：利用堆性质找极值</text><text class="desc" x="0" y="160">• 基数：按数位逐步细化排序</text></g></svg>