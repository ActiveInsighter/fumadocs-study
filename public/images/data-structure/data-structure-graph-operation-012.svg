<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">Floyd-Warshall 算法核心思想</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">Floyd-Warshall 算法核心思想</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">Floyd-Warshall 算法核心思想</text><g transform="translate(50, 80)"><circle cx="100" cy="150" fill="var(--indigo-mid)" r="30" stroke="var(--blue-deep)" stroke-width="3"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="100" y="155">i</text><circle cx="500" cy="150" fill="var(--red-deep)" r="30" stroke="var(--red-deep)" stroke-width="3"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="500" y="155">j</text><circle cx="300" cy="80" fill="var(--yellow-mid)" r="30" stroke="var(--orange-mid)" stroke-width="3"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="300" y="85">k</text><line stroke="var(--neutral-mid)" stroke-dasharray="10,5" stroke-width="4" x1="130" x2="470" y1="150" y2="150"></line><text fill="var(--ink-soft)" font-size="var(--svg-font-size-title)" text-anchor="middle" x="300" y="140">原路径: dist[i][j]</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="4" x1="115" x2="285" y1="130" y2="95"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="180" y="105">dist[i][k]</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="4" x1="315" x2="485" y1="95" y2="130"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="420" y="105">dist[k][j]</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--green-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-gray" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--neutral-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text fill="var(--purple-deep)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="300" y="200">VS</text><rect fill="var(--neutral-soft)" height="80" rx="10" stroke="var(--indigo-light)" stroke-width="2" width="500" x="50" y="230"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="300" y="255">核心公式</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" text-anchor="middle" x="300" y="285">dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="600" y="60">算法步骤：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="600" y="85">1. 初始化距离矩阵</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="600" y="105">2. 对每个中转点 k：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="620" y="125">• 检查所有点对 (i,j)</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="620" y="145">• 比较直达vs中转路径</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="620" y="165">• 更新最短距离</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="600" y="185">3. 重复直到所有k遍历完</text><rect fill="var(--amber-soft)" height="100" rx="8" stroke="var(--yellow-light)" stroke-width="2" width="150" x="600" y="210"></rect><text fill="var(--amber-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="675" y="235">关键思想</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="675" y="255">每次选择一个</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="675" y="270">中转点k，</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="675" y="285">尝试优化所有</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="675" y="300">点对间距离</text></g><g transform="translate(50, 420)"><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="0" y="0">示例：假设当前距离</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="50" y="25">• dist[i][j] = 10 (直达距离)</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="50" y="45">• dist[i][k] = 3, dist[k][j] = 4</text><text fill="var(--green-mid)" font-size="var(--svg-font-size-body)" x="50" y="65">• 通过k中转: 3 + 4 = 7 &lt; 10</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="50" y="85">• 更新: dist[i][j] = 7</text></g><rect fill="var(--sky-soft)" height="60" rx="8" stroke="var(--indigo-mid)" stroke-width="2" width="250" x="500" y="450"></rect><text fill="var(--blue-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="625" y="470">时间复杂度</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="625" y="490">O(V³)</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="625" y="505">三层嵌套循环：k, i, j</text></svg>