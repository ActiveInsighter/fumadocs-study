<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg"><text fill="#2c3e50" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">Floyd-Warshall 算法核心思想</text><text fill="#2c3e50" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">Floyd-Warshall 算法核心思想</text><text fill="#2c3e50" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">Floyd-Warshall 算法核心思想</text><g transform="translate(50, 80)"><circle cx="100" cy="150" fill="#3498db" r="30" stroke="#2980b9" stroke-width="3"></circle><text fill="#fff" font-size="20" font-weight="bold" text-anchor="middle" x="100" y="155">i</text><circle cx="500" cy="150" fill="#e74c3c" r="30" stroke="#c0392b" stroke-width="3"></circle><text fill="#fff" font-size="20" font-weight="bold" text-anchor="middle" x="500" y="155">j</text><circle cx="300" cy="80" fill="#f39c12" r="30" stroke="#e67e22" stroke-width="3"></circle><text fill="#fff" font-size="20" font-weight="bold" text-anchor="middle" x="300" y="85">k</text><line stroke="#95a5a6" stroke-dasharray="10,5" stroke-width="4" x1="130" x2="470" y1="150" y2="150"></line><text fill="#7f8c8d" font-size="16" text-anchor="middle" x="300" y="140">原路径: dist[i][j]</text><line marker-end="url(#arrowhead)" stroke="#27ae60" stroke-width="4" x1="115" x2="285" y1="130" y2="95"></line><text fill="#27ae60" font-size="14" text-anchor="middle" x="180" y="105">dist[i][k]</text><line marker-end="url(#arrowhead)" stroke="#27ae60" stroke-width="4" x1="315" x2="485" y1="95" y2="130"></line><text fill="#27ae60" font-size="14" text-anchor="middle" x="420" y="105">dist[k][j]</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#27ae60" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-gray" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#95a5a6" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text fill="#8e44ad" font-size="18" font-weight="bold" text-anchor="middle" x="300" y="200">VS</text><rect fill="#ecf0f1" height="80" rx="10" stroke="#bdc3c7" stroke-width="2" width="500" x="50" y="230"></rect><text fill="#2c3e50" font-size="18" font-weight="bold" text-anchor="middle" x="300" y="255">核心公式</text><text fill="#34495e" font-size="16" text-anchor="middle" x="300" y="285">dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])</text><text fill="#2c3e50" font-size="16" font-weight="bold" x="600" y="60">算法步骤：</text><text fill="#34495e" font-size="14" x="600" y="85">1. 初始化距离矩阵</text><text fill="#34495e" font-size="14" x="600" y="105">2. 对每个中转点 k：</text><text fill="#34495e" font-size="14" x="620" y="125">• 检查所有点对 (i,j)</text><text fill="#34495e" font-size="14" x="620" y="145">• 比较直达vs中转路径</text><text fill="#34495e" font-size="14" x="620" y="165">• 更新最短距离</text><text fill="#34495e" font-size="14" x="600" y="185">3. 重复直到所有k遍历完</text><rect fill="#fff3cd" height="100" rx="8" stroke="#ffeaa7" stroke-width="2" width="150" x="600" y="210"></rect><text fill="#856404" font-size="14" font-weight="bold" text-anchor="middle" x="675" y="235">关键思想</text><text fill="#856404" font-size="12" text-anchor="middle" x="675" y="255">每次选择一个</text><text fill="#856404" font-size="12" text-anchor="middle" x="675" y="270">中转点k，</text><text fill="#856404" font-size="12" text-anchor="middle" x="675" y="285">尝试优化所有</text><text fill="#856404" font-size="12" text-anchor="middle" x="675" y="300">点对间距离</text></g><g transform="translate(50, 420)"><text fill="#2c3e50" font-size="16" font-weight="bold" x="0" y="0">示例：假设当前距离</text><text fill="#34495e" font-size="14" x="50" y="25">• dist[i][j] = 10 (直达距离)</text><text fill="#34495e" font-size="14" x="50" y="45">• dist[i][k] = 3, dist[k][j] = 4</text><text fill="#27ae60" font-size="14" x="50" y="65">• 通过k中转: 3 + 4 = 7 &lt; 10</text><text fill="#e74c3c" font-size="14" font-weight="bold" x="50" y="85">• 更新: dist[i][j] = 7</text></g><rect fill="#e8f4fd" height="60" rx="8" stroke="#3498db" stroke-width="2" width="250" x="500" y="450"></rect><text fill="#2980b9" font-size="14" font-weight="bold" text-anchor="middle" x="625" y="470">时间复杂度</text><text fill="#2980b9" font-size="16" font-weight="bold" text-anchor="middle" x="625" y="490">O(V³)</text><text fill="#2980b9" font-size="12" text-anchor="middle" x="625" y="505">三层嵌套循环：k, i, j</text></svg>