nd="url(#arrow)" stroke="var(--yellow-mid)" stroke-width="1.4" x1="143" x2="143" y1="329" y2="355"></line><rect fill="var(--surface)" height="62" rx="8" stroke="var(--yellow-mid)" stroke-width="1.6" width="176" x="55" y="355"></rect><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="143" y="377">每个位置依赖左右信息</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="143" y="397">前缀 / 后缀预处理</text><line marker-end="url(#arrow)" stroke="var(--yellow-mid)" stroke-dasharray="4,3" stroke-width="1.4" x1="143" x2="143" y1="417" y2="445"></line><rect fill="var(--paper-warm)" height="32" rx="8" stroke="var(--yellow-mid)" stroke-width="1.4" width="176" x="55" y="445"></rect><text fill="var(--orange-mid)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="143" y="466">排序兜底 O(n log n)</text><line marker-end="url(#arrow)" stroke="var(--lime-mid)" stroke-width="1.4" x1="398" x2="398" y1="169" y2="195"></line><rect fill="var(--surface)" height="54" rx="8" stroke="var(--lime-mid)" stroke-width="1.6" width="176" x="310" y="195"></rect><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="398" y="217">找中间 / 倒数 k</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="398" y="237">快慢双指针</text><line marker-end="url(#arrow)" stroke="var(--lime-mid)" stroke-width="1.4" x1="398" x2="398" y1="249" y2="275"></line><rect fill="var(--surface)" height="54" rx="8" stroke="var(--lime-mid)" stroke-width="1.6" width="176" x="310" y="275"></rect><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="398" y="297">需要逆序访问</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="3