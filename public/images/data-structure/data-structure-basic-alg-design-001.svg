>Dijkstra / Prim</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="908" y="411">Kruskal 也常用</text><line marker-end="url(#arrow)" stroke="var(--red-deep)" stroke-width="1.4" x1="908" x2="908" y1="417" y2="445"></line><rect fill="var(--paper-warm)" height="32" rx="8" stroke="var(--red-deep)" stroke-width="1.4" width="176" x="820" y="445"></rect><text fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="908" y="466">AOE 关键路径</text><rect fill="var(--surface)" height="62" rx="12" stroke="var(--neutral-light)" width="870" x="85" y="525"></rect><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="115" y="548">考场使用顺序：</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" x="220" y="548">先识别数据结构 → 再看题目关键词 → 选择模板 → 最后补复杂度</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-label)" x="115" y="572">关键词示例：有序 / 第 k / 共享后缀 / BST / 入度 / 最短路 / 工期 / 只允许 O(1) 空间</text></svg>