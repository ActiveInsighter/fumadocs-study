<svg font-family="'Helvetica Neue', Arial, sans-serif" viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg"><rect fill="#fafafa" height="420" rx="12" width="780"></rect><line stroke="#e0e0e0" stroke-width="1" x1="100" x2="100" y1="40" y2="360"></line><line stroke="#ccc" stroke-width="1.5" x1="100" x2="680" y1="360" y2="360"></line><text fill="#888" font-size="11" text-anchor="middle" x="100" y="377">O(n)</text><text fill="#888" font-size="11" text-anchor="middle" x="280" y="377">O(n log n)</text><text fill="#888" font-size="11" text-anchor="middle" x="460" y="377">O(n^1.5)</text><text fill="#888" font-size="11" text-anchor="middle" x="640" y="377">O(n²)</text><line stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="1" x1="280" x2="280" y1="40" y2="360"></line><line stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="1" x1="460" x2="460" y1="40" y2="360"></line><line stroke="#e8e8e8" stroke-dasharray="4,3" stroke-width="1" x1="640" x2="640" y1="40" y2="360"></line><text fill="#aaa" font-size="11" text-anchor="middle" x="390" y="400">元素移动次数量级（从少到多）</text><text fill="#444" font-size="13" text-anchor="end" x="96" y="73">选择排序</text><rect fill="#4db6ac" height="28" rx="5" width="180" x="100" y="54"></rect><text fill="#4db6ac" font-size="12" font-weight="bold" x="285" y="73">O(n)</text><text fill="#888" font-size="11" x="540" y="73">每轮仅交换一次，移动最少</text><text fill="#444" font-size="13" text-anchor="end" x="96" y="111">桶排序</text><rect fill="#4db6ac" height="28" rx="5" width="180" x="100" y="92"></rect><text fill="#4db6ac" font-size="12" font-weight="bold" x="285" y="111">O(n)</text><text fill="#888" font-size="11" x="540" y="111">复制入桶，不做原地交换</text><text fill="#444" font-size="13" text-anchor="end" x="96" y="149">归并排序</text><rect fill="#5b9cf6" height="28" rx="5" width="360" x="100" y="130"></rect><text fill="#5b9cf6" font-size="12" font-weight="bold" x="465" y="149">O(n log n)</text><text fill="#888" font-size="11" x="576" y="149">辅助数组复制</text><text fill="#444" font-size="13" text-anchor="end" x="96" y="187">堆排序</text><rect fill="#5b9cf6" height="28" rx="5" width="360" x="100" y="168"></rect><text fill="#5b9cf6" font-size="12" font-weight="bold" x="465" y="187">O(n log n)</text><text fill="#888" font-size="11" x="576" y="187">堆化时原地交换</text><text fill="#444" font-size="13" text-anchor="end" x="96" y="225">快速排序</text><rect fill="#7986cb" height="28" rx="5" width="360" x="100" y="206"></rect><rect fill="none" height="28" rx="5" stroke="#7986cb" stroke-dasharray="5,3" stroke-width="1.5" width="180" x="460" y="206"></rect><text fill="#7986cb" font-size="12" font-weight="bold" x="465" y="225">均 O(n log n)</text><text fill="#7986cb" font-size="10" x="645" y="218">最坏</text><text fill="#7986cb" font-size="10" x="645" y="230">O(n²)</text><text fill="#444" font-size="13" text-anchor="end" x="96" y="263">基数排序</text><rect fill="#a29bfe" height="28" rx="5" width="270" x="100" y="244"></rect><text fill="#a29bfe" font-size="12" font-weight="bold" x="375" y="263">O(n·d)</text><text fill="#888" font-size="11" x="455" y="263">按位多轮计数排序复制</text><text fill="#444" font-size="13" text-anchor="end" x="96" y="301">希尔排序</text><rect fill="#ff9f43" height="28" rx="5" width="420" x="100" y="282"></rect><text fill="#ff9f43" font-size="12" font-weight="bold" x="525" y="301">O(n^1.3 ~ 2)</text><text fill="#888" font-size="11" x="638" y="301">难以精确界定</text><text fill="#444" font-size="13" text-anchor="end" x="96" y="339">插入排序</text><rect fill="#ef5350" height="28" rx="5" width="540" x="100" y="320"></rect><text fill="#ef5350" font-size="12" font-weight="bold" x="645" y="339">O(n²)</text><rect fill="#fff3cd" height="22" rx="5" stroke="#f0c040" stroke-width="1" width="560" x="100" y="390"></rect><text fill="#7a5c00" font-size="11" text-anchor="middle" x="380" y="405">冒泡排序：最坏 O(n²)，每次交换移动两个元素，次数最多；选择排序 &amp; 桶排序移动次数最少</text><rect fill="#00897b" height="16" rx="4" width="32" x="230" y="57"></rect><text fill="#fff" font-size="9" font-weight="bold" text-anchor="middle" x="246" y="69">最少</text><rect fill="#c62828" height="16" rx="4" width="32" x="555" y="323"></rect><text fill="#fff" font-size="9" font-weight="bold" text-anchor="middle" x="571" y="335">较多</text></svg>