<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/></linearGradient><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fce7f3"/><stop offset="100%" stop-color="#fbcfe8"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".12"/></filter></defs><text x="450" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">系统引导流程 (Boot Process)</text><text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">加电 → 固件 → 主引导记录 → 分区引导扇区 → 操作系统</text><g filter="url(#shadow)"><rect x="40" y="100" width="180" height="130" rx="14" fill="url(#g1)" stroke="#f59e0b" stroke-width="1.5"/><circle cx="70" cy="130" r="14" fill="#f59e0b"/><text x="70" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="95" y="135" font-size="15" font-weight="700" fill="#78350f">ROM 固件</text><text x="60" y="160" font-size="12" fill="#7c2d12">BIOS / UEFI</text><text x="60" y="180" font-size="11.5" fill="#7c2d12">· 加电自检 (POST)</text><text x="60" y="198" font-size="11.5" fill="#7c2d12">· 初始化硬件</text><text x="60" y="216" font-size="11.5" fill="#7c2d12">· 读取 0 号扇区</text></g><g filter="url(#shadow)"><rect x="250" y="100" width="180" height="130" rx="14" fill="url(#g2)" stroke="#3b82f6" stroke-width="1.5"/><circle cx="280" cy="130" r="14" fill="#3b82f6"/><text x="280" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="305" y="135" font-size="15" font-weight="700" fill="#1e3a8a">MBR Bootloader</text><text x="270" y="160" font-size="12" fill="#1e40af">主引导记录</text><text x="270" y="180" font-size="11.5" fill="#1e40af">· 解析分区表</text><text x="270" y="198" font-size="11.5" fill="#1e40af">· 定位活动分区</text><text x="270" y="216" font-size="11.5" fill="#1e40af">· 加载引导扇区</text></g><g filter="url(#shadow)"><rect x="460" y="100" width="180" height="130" rx="14" fill="url(#g3)" stroke="#10b981" stroke-width="1.5"/><circle cx="490" cy="130" r="14" fill="#10b981"/><text x="490" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="515" y="135" font-size="15" font-weight="700" fill="#064e3b">分区引导扇区</text><text x="480" y="160" font-size="12" fill="#065f46">Boot Sector</text><text x="480" y="180" font-size="11.5" fill="#065f46">· OS 专属引导代码</text><text x="480" y="198" font-size="11.5" fill="#065f46">· GRUB / NT Loader</text><text x="480" y="216" font-size="11.5" fill="#065f46">· 加载内核组件</text></g><g filter="url(#shadow)"><rect x="670" y="100" width="190" height="130" rx="14" fill="url(#g4)" stroke="#ec4899" stroke-width="1.5"/><circle cx="700" cy="130" r="14" fill="#ec4899"/><text x="700" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="725" y="135" font-size="15" font-weight="700" fill="#831843">OS 初始化程序</text><text x="690" y="160" font-size="12" fill="#9f1239">操作系统启动</text><text x="690" y="180" font-size="11.5" fill="#9f1239">· 加载内核</text><text x="690" y="198" font-size="11.5" fill="#9f1239">· 加载驱动程序</text><text x="690" y="216" font-size="11.5" fill="#9f1239">· 移交控制权</text></g><line x1="222" y1="165" x2="248" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="432" y1="165" x2="458" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="642" y1="165" x2="668" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><g font-size="11" fill="#475569"><text x="235" y="262" text-anchor="middle">加载 MBR</text><text x="445" y="262" text-anchor="middle">移交控制权</text><text x="655" y="262" text-anchor="middle">启动内核</text></g><line x1="60" y1="295" x2="840" y2="295" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/><circle cx="60" cy="295" r="6" fill="#f59e0b"/><circle cx="320" cy="295" r="6" fill="#3b82f6"/><circle cx="560" cy="295" r="6" fill="#10b981"/><circle cx="840" cy="295" r="6" fill="#ec4899"/><text x="60" y="320" text-anchor="middle" font-size="11" fill="#64748b">加电</text><text x="320" y="320" text-anchor="middle" font-size="11" fill="#64748b">读盘</text><text x="560" y="320" text-anchor="middle" font-size="11" fill="#64748b">分区</text><text x="840" y="320" text-anchor="middle" font-size="11" fill="#64748b">系统就绪</text><text x="450" y="348" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">每一阶段执行完毕后，将控制权传递给下一阶段，直至操作系统完全运行</text></svg>