<svg font-family="'PingFang SC','Microsoft YaHei',sans-serif" viewBox="0 0 860 720" xmlns="http://www.w3.org/2000/svg"><rect fill="none" height="720" rx="12" width="860"></rect><rect fill="#3b5bdb" height="46" rx="23" width="500" x="180" y="18"></rect><text fill="#fff" font-size="20" font-weight="bold" text-anchor="middle" x="430" y="48">进程控制块 PCB</text><rect fill="#fff" height="300" rx="10" stroke="#3b5bdb" stroke-width="2.5" width="280" x="290" y="90"></rect><rect fill="#3b5bdb" height="38" rx="10" width="280" x="290" y="90"></rect><text fill="#fff" font-size="15" font-weight="bold" text-anchor="middle" x="430" y="116">PCB（进程控制块）</text><rect fill="#e7f5ff" height="52" rx="6" width="260" x="300" y="138"></rect><text fill="#1864ab" font-size="12" font-weight="bold" x="318" y="159">进程标识信息</text><text fill="#495057" font-size="11" x="318" y="179">PID（进程标识符）· UID（用户标识符）</text><rect fill="#fff0f6" height="52" rx="6" width="260" x="300" y="198"></rect><text fill="#a61e4d" font-size="12" font-weight="bold" x="318" y="219">进程控制信息</text><text fill="#495057" font-size="11" x="318" y="239">进程状态 · 进程优先级</text><rect fill="#ebfbee" height="52" rx="6" width="260" x="300" y="258"></rect><text fill="#1a6631" font-size="12" font-weight="bold" x="318" y="279">处理机状态信息</text><text fill="#495057" font-size="11" x="318" y="299">PC · 通用寄存器 · PSW（程序状态字）</text><rect fill="#fff9db" height="52" rx="6" width="260" x="300" y="318"></rect><text fill="#7d5a00" font-size="12" font-weight="bold" x="318" y="339">资源信息</text><text fill="#495057" font-size="11" x="318" y="359">打开的文件 · 内存指针 · 其他资源</text><text fill="#868e96" font-size="10.5" font-style="italic" text-anchor="middle" x="430" y="403">常驻内存，随进程生命周期存在</text><rect fill="#fff" height="110" rx="10" stroke="#4dabf7" stroke-width="2" width="220" x="30" y="450"></rect><rect fill="#4dabf7" height="32" rx="10" width="220" x="30" y="450"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="140" y="472">① 进程创建与终止</text><text fill="#212529" font-size="11" x="46" y="496">• 创建时，OS 为进程新建 PCB</text><text fill="#212529" font-size="11" x="46" y="514">• PCB 常驻内存，可随时存取</text><text fill="#212529" font-size="11" x="46" y="532">• 进程结束时，PCB 被删除</text><text fill="#1864ab" font-size="10.5" font-style="italic" x="46" y="550">PCB 是进程存在的唯一标志</text><rect fill="#fff" height="110" rx="10" stroke="#f783ac" stroke-width="2" width="220" x="610" y="450"></rect><rect fill="#f783ac" height="32" rx="10" width="220" x="610" y="450"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="720" y="472">② 进程调度</text><text fill="#212529" font-size="11" x="626" y="496">• OS 读取 PCB 中优先级/状态</text><text fill="#212529" font-size="11" x="626" y="514">• 决定哪个进程获得 CPU</text><text fill="#212529" font-size="11" x="626" y="532">• 调度结果写回 PCB 状态字段</text><text fill="#a61e4d" font-size="10.5" font-style="italic" x="626" y="550">PCB 是调度决策的依据</text><rect fill="#fff" height="112" rx="10" stroke="#51cf66" stroke-width="2" width="360" x="250" y="580"></rect><rect fill="#51cf66" height="32" rx="10" width="360" x="250" y="580"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="430" y="602">③ 进程切换（上下文切换）</text><text fill="#212529" font-size="11" x="268" y="626">• 切换时保存当前进程 CPU 现场 → PCB</text><text fill="#212529" font-size="11" x="268" y="644">• 从 PCB 恢复下一进程的 CPU 现场</text><text fill="#212529" font-size="11" x="268" y="662">• 关键字段：PC、寄存器组、PSW</text><text fill="#1a6631" font-size="10.5" font-style="italic" x="268" y="681">PCB 保存/恢复处理机状态信息，实现进程切换</text><line marker-end="url(#arrow-blue)" stroke="#4dabf7" stroke-dasharray="5,3" stroke-width="1.8" x1="290" x2="220" y1="310" y2="440"></line><line marker-end="url(#arrow-pink)" stroke="#f783ac" stroke-dasharray="5,3" stroke-width="1.8" x1="570" x2="660" y1="310" y2="440"></line><line marker-end="url(#arrow-green)" stroke="#51cf66" stroke-dasharray="5,3" stroke-width="1.8" x1="430" x2="430" y1="390" y2="578"></line><rect fill="#fff" height="130" rx="8" stroke="#dee2e6" stroke-width="1.5" width="220" x="30" y="90"></rect><text fill="#343a40" font-size="12" font-weight="bold" text-anchor="middle" x="140" y="112">四类信息说明</text><rect fill="#4dabf7" height="12" rx="2" width="12" x="46" y="122"></rect><text fill="#212529" font-size="11" x="64" y="133">标识信息：唯一标识进程</text><rect fill="#f783ac" height="12" rx="2" width="12" x="46" y="142"></rect><text fill="#212529" font-size="11" x="64" y="153">控制信息：调度与管理</text><rect fill="#51cf66" height="12" rx="2" width="12" x="46" y="162"></rect><text fill="#212529" font-size="11" x="64" y="173">处理机信息：保存 CPU 现场</text><rect fill="#fcc419" height="12" rx="2" width="12" x="46" y="182"></rect><text fill="#212529" font-size="11" x="64" y="193">资源信息：记录占用资源</text><defs><marker id="arrow-blue" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#4dabf7"></path></marker><marker id="arrow-pink" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#f783ac"></path></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#51cf66"></path></marker><marker id="arrow-gray" markerHeight="7" markerWidth="7" orient="auto" refX="5" refY="3"><path d="M0 0V6L7 3z" fill="#adb5bd"></path></marker></defs></svg>