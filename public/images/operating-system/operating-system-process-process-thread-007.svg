<svg font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" viewBox="0 0 760 690" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arr5" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"></path></marker></defs><style>.title{font-weight: var(--svg-font-weight-bold);font-size: var(--svg-font-size-body)}.kernel{fill:var(--red-mid);stroke:var(--red-deep)}.stack{fill:var(--yellow-mid);stroke:var(--orange-mid)}.mmap{fill:var(--purple-mid);stroke:var(--purple-deep)}.heap{fill:var(--green-mid);stroke:var(--lime-deep)}.bss{fill:var(--blue-mid);stroke:var(--violet-deep)}.data{fill:var(--cyan-mid);stroke:var(--teal-deep)}.text{fill:var(--neutral-mid);stroke:var(--coral-ink)}.small{font-size: var(--svg-font-size-caption);fill:var(--neutral-ink)}.mono{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-caption)}</style><text class="title" text-anchor="middle" x="380" y="26">进程虚拟地址空间布局（32 位 Linux 典型视图）</text><g transform="translate(220,50)"><rect class="kernel" height="50" width="220" x="0" y="0"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="22">内核空间 (Kernel)</text><text class="small" text-anchor="middle" x="110" y="40">所有进程共享，用户态不可访问</text><rect class="stack" height="80" width="220" x="0" y="60"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="84">栈 (Stack)</text><text class="small" text-anchor="middle" x="110" y="102">函数调用帧、局部变量</text><text class="small" text-anchor="middle" x="110" y="120">向下增长 ↓ ，ESP/SP 指向栈顶</text><rect fill="var(--neutral-soft)" height="40" width="220" x="0" y="150"></rect><text class="small" text-anchor="middle" x="110" y="174">未分配空间</text><rect class="mmap" height="70" width="220" x="0" y="200"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="222">内存映射区 (mmap)</text><text class="small" text-anchor="middle" x="110" y="240">动态库 .so / 文件映射</text><text class="small" text-anchor="middle" x="110" y="258">匿名映射、共享内存</text><rect fill="var(--neutral-soft)" height="40" width="220" x="0" y="280"></rect><text class="small" text-anchor="middle" x="110" y="304">未分配空间</text><rect class="heap" height="80" width="220" x="0" y="330"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="354">堆 (Heap)</text><text class="small" text-anchor="middle" x="110" y="372">malloc / new 动态分配</text><text class="small" text-anchor="middle" x="110" y="390">向上增长 ↑ ，brk 移动边界</text><rect class="bss" height="48" width="220" x="0" y="420"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="442">未初始化数据 (BSS)</text><text class="small" text-anchor="middle" x="110" y="460">未赋初值的全局/静态变量</text><rect class="data" height="48" width="220" x="0" y="478"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="500">已初始化数据 (Data)</text><text class="small" text-anchor="middle" x="110" y="518">带初值的全局/静态变量</text><rect class="text" height="54" width="220" x="0" y="536"></rect><text fill="var(--surface)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="558">代码段 (Text)</text><text class="small" fill="var(--surface)" text-anchor="middle" x="110" y="578">只读、可执行的机器指令</text></g><text class="mono" text-anchor="end" x="200" y="62">高地址</text><text class="mono" text-anchor="end" x="200" y="98">0xFFFFFFFF</text><text class="mono" text-anchor="end" x="200" y="118">0xC0000000</text><text class="mono" text-anchor="end" x="200" y="370">brk →</text><text class="mono" text-anchor="end" x="200" y="540">0x08048000</text><text class="mono" text-anchor="end" x="200" y="600">低地址 0</text><path d="M460 110v40" marker-end="url(#arr5)" stroke="var(--orange-mid)" stroke-width="2"></path><text class="small" fill="var(--orange-mid)" text-anchor="end" x="455" y="130">栈向下</text><path d="M460 405V320" marker-end="url(#arr5)" stroke="var(--lime-deep)" stroke-width="2"></path><text class="small" fill="var(--lime-deep)" x="470" y="370">堆向上</text><g transform="translate(490,80)"><rect fill="var(--surface)" height="240" rx="6" stroke="var(--neutral-mid)" width="250" x="0" y="0"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="125" y="22">线程视角</text><text class="small" x="10" y="46">同一进程内的多个线程：</text><text class="small" x="10" y="66">• 共享：Text、Data、BSS、Heap、mmap</text><text class="small" x="10" y="86">• 私有：每线程一份 Stack、寄存器</text><text font-weight="var(--svg-font-weight-bold)" x="10" y="116">用户态 vs 内核态边界</text><text class="small" x="10" y="136">用户态只能访问下半段；</text><text class="small" x="10" y="156">通过系统调用陷入内核态后</text><text class="small" x="10" y="176">才能访问内核空间。</text><text font-weight="var(--svg-font-weight-bold)" x="10" y="206">PCB / 内核栈</text><text class="small" x="10" y="226">每进程在内核空间还有 PCB 与内核栈。</text></g><text class="small" text-anchor="middle" x="380" y="668">栈与堆相向生长，中间是 mmap / 未分配区；32 位下 3:1 分界（0xC0000000）将用户/内核分开</text></svg>