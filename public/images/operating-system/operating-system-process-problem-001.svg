<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"/></marker></defs><style>.title{font-weight: var(--svg-font-weight-bold);font-size: var(--svg-font-size-body)}.step{fill:var(--green-soft);stroke:var(--lime-deep)}.qbox{fill:var(--yellow-soft);stroke:var(--yellow-mid)}.out{fill:var(--sky-soft);stroke:var(--violet-deep)}.arr{stroke:var(--neutral-ink);stroke-width:1.5;fill:none}.small{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}</style><text x="450" y="26" text-anchor="middle" class="title">同步问题解题模板（信号量法）</text><rect x="40" y="60" width="220" height="70" rx="8" class="step"/><text x="150" y="86" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">① 找进程与循环结构</text><text x="150" y="106" text-anchor="middle" class="small">把题中角色 → 进程</text><text x="150" y="122" text-anchor="middle" class="small">反复行为套 while(1)</text><rect x="340" y="60" width="220" height="70" rx="8" class="step"/><text x="450" y="86" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">② 找互斥关系</text><text x="450" y="106" text-anchor="middle" class="small">共享同一资源 + 同时仅一个</text><text x="450" y="122" text-anchor="middle" class="small">→ 互斥信号量（初值 1）</text><rect x="640" y="60" width="220" height="70" rx="8" class="step"/><text x="750" y="86" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">③ 找同步关系</text><text x="750" y="106" text-anchor="middle" class="small">动作 A 必须先于 B</text><text x="750" y="122" text-anchor="middle" class="small">→ 同步信号量（初值 0）</text><rect x="640" y="170" width="220" height="70" rx="8" class="step"/><text x="750" y="196" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">④ 找资源数量约束</text><text x="750" y="216" text-anchor="middle" class="small">缓冲区 / 座位 / 设备</text><text x="750" y="232" text-anchor="middle" class="small">→ 资源信号量（初值=容量）</text><rect x="340" y="170" width="220" height="70" rx="8" class="step"/><text x="450" y="196" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">⑤ 写 P/V 伪代码</text><text x="450" y="216" text-anchor="middle" class="small">先资源信号量，后互斥信号量</text><text x="450" y="232" text-anchor="middle" class="small">V 顺序通常对称即可</text><rect x="40" y="170" width="220" height="70" rx="8" class="step"/><text x="150" y="196" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">⑥ 自检</text><text x="150" y="216" text-anchor="middle" class="small">P/V 成对、方向一致</text><text x="150" y="232" text-anchor="middle" class="small">无死锁、覆盖全部角色</text><path class="arr" d="M260 95h80" marker-end="url(#arr2)"/><path class="arr" d="M560 95h80" marker-end="url(#arr2)"/><path class="arr" d="M750 130v40" marker-end="url(#arr2)"/><path class="arr" d="M640 205H560" marker-end="url(#arr2)"/><path class="arr" d="M340 205H260" marker-end="url(#arr2)"/><rect x="340" y="280" width="220" height="60" rx="8" class="qbox"/><text x="450" y="305" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">三类信号量怎么选？</text><text x="450" y="325" text-anchor="middle" class="small">按 “保护对象” 划分</text><rect x="40" y="380" width="240" height="180" rx="8" class="out"/><text x="160" y="402" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">互斥信号量</text><text x="160" y="422" text-anchor="middle" class="small">初值 1</text><text x="60" y="448">保护对象：临界资源</text><text x="60" y="470">命名：mutex, rw, fork[i]</text><text x="60" y="492" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)">P(mutex);</text><text x="60" y="508" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)">// 临界区</text><text x="60" y="524" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)">V(mutex);</text><text x="60" y="548" class="small" fill="var(--red-deep)">紧贴临界区，不要包多</text><rect x="320" y="380" width="240" height="180" rx="8" class="out"/><text x="440" y="402" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">同步信号量</text><text x="440" y="422" text-anchor="middle" class="small">初值 0</text><text x="340" y="448">保护对象：事件先后</text><text x="340" y="470">命名：s, done, ready</text><text x="340" y="492" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)">A: ... V(s);</text><text x="340" y="508" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)">B: P(s); ...</text><text x="340" y="524" class="small">前驱关系一条边 → 一个信号量</text><text x="340" y="548" class="small" fill="var(--red-deep)">谁等谁 P，谁完成谁 V</text><rect x="600" y="380" width="240" height="180" rx="8" class="out"/><text x="720" y="402" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">资源信号量</text><text x="720" y="422" text-anchor="middle" class="small">初值=资源总数 n</text><text x="620" y="448">保护对象：可数资源</text><text x="620" y="470">命名：empty, full, seat</text><text x="620" y="492" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)">P(empty); P(mutex);</text><text x="620" y="508" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)">// 放数据</text><text x="620" y="524" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)">V(mutex); V(full);</text><text x="620" y="548" class="small" fill="var(--red-deep)">先资源、后互斥，防死锁</text><path class="arr" d="M450 340 160 380" marker-end="url(#arr2)"/><path class="arr" d="M450 340l-10 40" marker-end="url(#arr2)"/><path class="arr" d="M450 340l270 40" marker-end="url(#arr2)"/><path class="arr" d="M150 240l3e2 40" marker-end="url(#arr2)"/><text x="450" y="600" text-anchor="middle" class="small">核心：自然语言 → 互斥关系/前驱关系/资源约束 → 三类信号量与 P/V 顺序</text></svg>