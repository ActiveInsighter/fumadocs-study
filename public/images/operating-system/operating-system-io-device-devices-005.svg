<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#546e7a"/></marker><linearGradient id="gCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42a5f5"/><stop offset="1" stop-color="#1e88e5"/></linearGradient><linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0b2"/><stop offset="1" stop-color="#ffcc80"/></linearGradient><linearGradient id="gBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8e6c9"/><stop offset="1" stop-color="#a5d6a7"/></linearGradient><style>.lbl{fill:#263238;font-size:13px}.lbl-sm{fill:#455a64;font-size:11px}.title{fill:#0d47a1;font-size:16px;font-weight:600}.core-title{fill:#fff;font-size:15px;font-weight:600}.card-title{fill:#263238;font-size:13px;font-weight:600}.h1{fill:#0d47a1;font-size:18px;font-weight:700}</style></defs><text x="410" y="28" text-anchor="middle" class="h1">设备独立性软件</text><text x="410" y="48" text-anchor="middle" class="lbl-sm">位于用户层与设备驱动之间，屏蔽硬件差异，向上提供统一接口</text><rect x="60" y="70" width="700" height="46" rx="8" fill="url(#gTop)" stroke="#fb8c00" stroke-width="1.2"/><text x="410" y="98" text-anchor="middle" class="card-title">用户层 I/O 软件（库函数 / 系统调用：read、write、printf…）</text><rect x="60" y="140" width="700" height="220" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/><rect x="60" y="140" width="700" height="34" rx="10" fill="url(#gCore)"/><text x="410" y="163" text-anchor="middle" class="core-title">设备独立性软件（核心功能）</text><g><rect x="80" y="188" width="210" height="72" rx="6" fill="#fff" stroke="#90caf9"/><text x="92" y="208" class="card-title">① 统一命名与接口</text><text x="92" y="228" class="lbl-sm">将不同设备抽象为文件 / 逻辑名</text><text x="92" y="245" class="lbl-sm">上层无需关心具体硬件类型</text></g><g><rect x="305" y="188" width="210" height="72" rx="6" fill="#fff" stroke="#90caf9"/><text x="317" y="208" class="card-title">② 缓冲管理</text><text x="317" y="228" class="lbl-sm">单缓冲 / 双缓冲 / 缓冲池</text><text x="317" y="245" class="lbl-sm">缓解 CPU 与设备速度差异</text></g><g><rect x="530" y="188" width="210" height="72" rx="6" fill="#fff" stroke="#90caf9"/><text x="542" y="208" class="card-title">③ 设备分配与回收</text><text x="542" y="228" class="lbl-sm">独占 / 共享 / 虚拟设备管理</text><text x="542" y="245" class="lbl-sm">避免多进程并发访问冲突</text></g><g><rect x="80" y="272" width="210" height="72" rx="6" fill="#fff" stroke="#90caf9"/><text x="92" y="292" class="card-title">④ 差错处理</text><text x="92" y="312" class="lbl-sm">校验、重试等通用错误处理</text><text x="92" y="329" class="lbl-sm">屏蔽底层硬件异常</text></g><g><rect x="305" y="272" width="210" height="72" rx="6" fill="#fff" stroke="#90caf9"/><text x="317" y="292" class="card-title">⑤ 逻辑–物理映射</text><text x="317" y="312" class="lbl-sm">逻辑设备名 → 物理设备</text><text x="317" y="329" class="lbl-sm">依赖逻辑设备表（LUT）</text></g><g><rect x="530" y="272" width="210" height="72" rx="6" fill="#fff" stroke="#90caf9"/><text x="542" y="292" class="card-title">⑥ 独立于设备的块大小</text><text x="542" y="312" class="lbl-sm">向上提供统一逻辑块视图</text><text x="542" y="329" class="lbl-sm">隐藏扇区/物理块大小差异</text></g><rect x="60" y="384" width="700" height="46" rx="8" fill="url(#gBot)" stroke="#43a047" stroke-width="1.2"/><text x="410" y="412" text-anchor="middle" class="card-title">设备驱动程序（针对具体硬件的指令翻译）</text><line x1="410" y1="118" x2="410" y2="138" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><line x1="410" y1="362" x2="410" y2="382" stroke="#546e7a" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="60" y="132" class="lbl-sm">↑ 向上：统一 API</text><text x="670" y="378" class="lbl-sm" text-anchor="end">↓ 向下：调用驱动</text><rect x="60" y="452" width="700" height="48" rx="8" fill="#fff8e1" stroke="#ffb300"/><text x="76" y="472" class="card-title">核心作用</text><text x="76" y="490" class="lbl-sm">屏蔽硬件差异 · 提高模块化与可移植性 · 让上层程序以“文件式”统一方式访问各类 I/O 设备</text></svg>