<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2f7"/></linearGradient><linearGradient id="gProc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><linearGradient id="gFd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="gOFT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity=".18"/></filter><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 9 4 0 8z" fill="#64748b"/></marker></defs><rect width="860" height="520" fill="url(#bg)" rx="16"/><text x="430" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">文件描述符表（File Descriptor Table）</text><text x="430" y="74" text-anchor="middle" font-size="14" fill="#64748b">进程私有 · 把整数 fd 映射到「系统打开文件表」表项</text><rect x="40" y="110" width="430" height="370" rx="16" fill="#fff" stroke="#e0e7ff" stroke-width="2" filter="url(#shadow)"/><rect x="40" y="110" width="430" height="40" rx="16" fill="url(#gProc)"/><rect x="40" y="136" width="430" height="14" fill="url(#gProc)"/><text x="255" y="137" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">进程（每个进程一张表）</text><text x="70" y="178" font-size="11" fill="#94a3b8">fd 0/1/2 默认指向 标准输入/输出/错误</text><g font-size="12" font-weight="700" fill="#1e3a8a"><text x="120" y="206" text-anchor="middle">fd</text><text x="320" y="206" text-anchor="middle">指向系统文件表项</text></g><line x1="70" y1="214" x2="440" y2="214" stroke="#cbd5e1"/><g font-size="13"><rect x="70" y="222" width="100" height="34" rx="7" fill="url(#gFd)"/><text x="120" y="244" text-anchor="middle" fill="#fff" font-weight="700">0</text><rect x="190" y="222" width="250" height="34" rx="7" fill="#eff6ff" stroke="#bfdbfe"/><text x="205" y="244" fill="#1e3a8a">stdin → 表项 5</text><rect x="70" y="264" width="100" height="34" rx="7" fill="url(#gFd)"/><text x="120" y="286" text-anchor="middle" fill="#fff" font-weight="700">1</text><rect x="190" y="264" width="250" height="34" rx="7" fill="#eff6ff" stroke="#bfdbfe"/><text x="205" y="286" fill="#1e3a8a">stdout → 表项 6</text><rect x="70" y="306" width="100" height="34" rx="7" fill="url(#gFd)"/><text x="120" y="328" text-anchor="middle" fill="#fff" font-weight="700">2</text><rect x="190" y="306" width="250" height="34" rx="7" fill="#eff6ff" stroke="#bfdbfe"/><text x="205" y="328" fill="#1e3a8a">stderr → 表项 7</text><rect x="70" y="348" width="100" height="34" rx="7" fill="#2563eb"/><text x="120" y="370" text-anchor="middle" fill="#fff" font-weight="700">3</text><rect x="190" y="348" width="250" height="34" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="205" y="370" fill="#1e3a8a" font-weight="700">open() 返回 → 表项 9</text><rect x="70" y="390" width="100" height="34" rx="7" fill="url(#gFd)"/><text x="120" y="412" text-anchor="middle" fill="#fff" font-weight="700">4</text><rect x="190" y="390" width="250" height="34" rx="7" fill="#eff6ff" stroke="#bfdbfe"/><text x="205" y="412" fill="#1e3a8a">→ 表项 10</text></g><text x="255" y="452" text-anchor="middle" font-size="11" fill="#6366f1">fd 是进程范围内的最小可用非负整数</text><rect x="600" y="150" width="220" height="290" rx="14" fill="#fff" stroke="#fef3c7" stroke-width="2" filter="url(#shadow)"/><rect x="600" y="150" width="220" height="38" rx="14" fill="url(#gOFT)"/><rect x="600" y="174" width="220" height="14" fill="url(#gOFT)"/><text x="710" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">系统打开文件表</text><text x="710" y="206" text-anchor="middle" font-size="11" fill="#94a3b8">（全局共享）</text><g font-size="12" fill="#78350f"><rect x="620" y="222" width="180" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/><text x="634" y="242">表项 5 · stdin</text><rect x="620" y="262" width="180" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/><text x="634" y="282">表项 6 · stdout</text><rect x="620" y="302" width="180" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/><text x="634" y="322">表项 7 · stderr</text><rect x="620" y="342" width="180" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="634" y="362" font-weight="700">表项 9 · file.txt</text><rect x="620" y="382" width="180" height="30" rx="6" fill="#fffbeb" stroke="#fcd34d"/><text x="634" y="402">表项 10 · …</text></g><g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#ah)"><path d="M440 239c80 0 1e2-2 176-2"/><path d="M440 281c80 0 1e2-4 176-4"/><path d="M440 323c80 0 1e2-6 176-6"/></g><g stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#ah)"><path d="M440 365c85 0 1e2-8 176-8"/></g><rect x="40" y="488" width="780" height="28" rx="9" fill="#0f172a"/><text x="430" y="507" text-anchor="middle" font-size="12.5" fill="#e2e8f0">fd 只是进程内的整数索引，真正的偏移量与 inode 信息保存在它指向的系统文件表项中</text></svg>