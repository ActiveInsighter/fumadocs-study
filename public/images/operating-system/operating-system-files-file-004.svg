<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="var(--svg-font-family)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--indigo-ink)" flood-opacity=".18"/></filter><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 9 4 0 8z" fill="var(--blue-deep)"/></marker></defs><rect width="860" height="520" fill="var(--sky-soft)" rx="16"/><text x="430" y="46" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--ink)">文件描述符表（File Descriptor Table）</text><text x="430" y="74" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--blue-deep)">进程私有 · 把整数 fd 映射到「系统打开文件表」表项</text><rect x="40" y="110" width="430" height="370" rx="16" fill="var(--surface)" stroke="var(--indigo-soft)" stroke-width="2" filter="url(#shadow)"/><rect x="40" y="110" width="430" height="40" rx="16" fill="var(--purple-deep)"/><rect x="40" y="136" width="430" height="14" fill="var(--purple-deep)"/><text x="255" y="137" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">进程（每个进程一张表）</text><text x="70" y="178" font-size="var(--svg-font-size-caption)" fill="var(--blue-mid)">fd 0/1/2 默认指向 标准输入/输出/错误</text><g font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--violet-deep)"><text x="120" y="206" text-anchor="middle">fd</text><text x="320" y="206" text-anchor="middle">指向系统文件表项</text></g><line x1="70" y1="214" x2="440" y2="214" stroke="var(--blue-light)"/><g font-size="var(--svg-font-size-label)"><rect x="70" y="222" width="100" height="34" rx="7" fill="var(--violet-deep)"/><text x="120" y="244" text-anchor="middle" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">0</text><rect x="190" y="222" width="250" height="34" rx="7" fill="var(--sky-soft)" stroke="var(--blue-light)"/><text x="205" y="244" fill="var(--violet-deep)">stdin → 表项 5</text><rect x="70" y="264" width="100" height="34" rx="7" fill="var(--violet-deep)"/><text x="120" y="286" text-anchor="middle" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">1</text><rect x="190" y="264" width="250" height="34" rx="7" fill="var(--sky-soft)" stroke="var(--blue-light)"/><text x="205" y="286" fill="var(--violet-deep)">stdout → 表项 6</text><rect x="70" y="306" width="100" height="34" rx="7" fill="var(--violet-deep)"/><text x="120" y="328" text-anchor="middle" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">2</text><rect x="190" y="306" width="250" height="34" rx="7" fill="var(--sky-soft)" stroke="var(--blue-light)"/><text x="205" y="328" fill="var(--violet-deep)">stderr → 表项 7</text><rect x="70" y="348" width="100" height="34" rx="7" fill="var(--violet-deep)"/><text x="120" y="370" text-anchor="middle" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">3</text><rect x="190" y="348" width="250" height="34" rx="7" fill="var(--blue-soft)" stroke="var(--indigo-mid)" stroke-width="2"/><text x="205" y="370" fill="var(--violet-deep)" font-weight="var(--svg-font-weight-bold)">open() 返回 → 表项 9</text><rect x="70" y="390" width="100" height="34" rx="7" fill="var(--violet-deep)"/><text x="120" y="412" text-anchor="middle" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">4</text><rect x="190" y="390" width="250" height="34" rx="7" fill="var(--sky-soft)" stroke="var(--blue-light)"/><text x="205" y="412" fill="var(--violet-deep)">→ 表项 10</text></g><text x="255" y="452" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">fd 是进程范围内的最小可用非负整数</text><rect x="600" y="150" width="220" height="290" rx="14" fill="var(--surface)" stroke="var(--amber-soft)" stroke-width="2" filter="url(#shadow)"/><rect x="600" y="150" width="220" height="38" rx="14" fill="var(--yellow-deep)"/><rect x="600" y="174" width="220" height="14" fill="var(--yellow-deep)"/><text x="710" y="175" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">系统打开文件表</text><text x="710" y="206" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--blue-mid)">（全局共享）</text><g font-size="var(--svg-font-size-label)" fill="var(--orange-deep)"><rect x="620" y="222" width="180" height="30" rx="6" fill="var(--paper-warm)" stroke="var(--yellow-mid)"/><text x="634" y="242">表项 5 · stdin</text><rect x="620" y="262" width="180" height="30" rx="6" fill="var(--paper-warm)" stroke="var(--yellow-mid)"/><text x="634" y="282">表项 6 · stdout</text><rect x="620" y="302" width="180" height="30" rx="6" fill="var(--paper-warm)" stroke="var(--yellow-mid)"/><text x="634" y="322">表项 7 · stderr</text><rect x="620" y="342" width="180" height="30" rx="6" fill="var(--amber-soft)" stroke="var(--yellow-mid)" stroke-width="2"/><text x="634" y="362" font-weight="var(--svg-font-weight-bold)">表项 9 · file.txt</text><rect x="620" y="382" width="180" height="30" rx="6" fill="var(--paper-warm)" stroke="var(--yellow-mid)"/><text x="634" y="402">表项 10 · …</text></g><g stroke="var(--blue-mid)" stroke-width="1.6" fill="none" marker-end="url(#ah)"><path d="M440 239c80 0 1e2-2 176-2"/><path d="M440 281c80 0 1e2-4 176-4"/><path d="M440 323c80 0 1e2-6 176-6"/></g><g stroke="var(--violet-deep)" stroke-width="2.2" fill="none" marker-end="url(#ah)"><path d="M440 365c85 0 1e2-8 176-8"/></g><rect x="40" y="488" width="780" height="28" rx="9" fill="var(--ink)"/><text x="430" y="507" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-soft)">fd 只是进程内的整数索引，真正的偏移量与 inode 信息保存在它指向的系统文件表项中</text></svg>