<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#4b5563"></path></marker><marker id="arrRed" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#b91c1c"></path></marker><style>.panel{fill:none;stroke:#1f2937;stroke-width:1.5}.userBg{fill:#eff6ff}.kernelBg{fill:#fef2f2}.divider{stroke:#6b7280;stroke-width:1.4;stroke-dasharray:6 4}.title{font:700 17px sans-serif;fill:#111827}.label{font:13px sans-serif;fill:#111827}.bold{font:700 13px sans-serif;fill:#111827}.space{font:12px sans-serif;fill:#6b7280}.note{font:12px sans-serif;fill:#374151}.process{fill:#fff;stroke:#2563eb;stroke-width:1.5}.thread{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.2}.lib{fill:#fef3c7;stroke:#b45309;stroke-width:1.2}.ktcb{fill:#fee2e2;stroke:#b91c1c;stroke-width:1.2}.scheduler{fill:#fff;stroke:#dc2626;stroke-width:1.5}.cpu{fill:#e5e7eb;stroke:#374151;stroke-width:1.2}.arrow{stroke:#4b5563;stroke-width:1.3;fill:none;marker-end:url(#arr)}.link{stroke:#b91c1c;stroke-width:1.3;fill:none;stroke-dasharray:5 3;marker-end:url(#arrRed)}</style></defs><g><rect class="panel" height="600" rx="8" width="440" x="20" y="10"></rect><text class="title" text-anchor="middle" x="240" y="35">用户级线程 (ULT)</text><rect class="userBg" height="320" rx="4" width="420" x="30" y="50"></rect><text class="space" x="40" y="68">用户空间</text><rect class="kernelBg" height="210" rx="4" width="420" x="30" y="390"></rect><text class="space" x="40" y="408">内核空间</text><line class="divider" x1="30" x2="450" y1="380" y2="380"></line><text class="note" text-anchor="end" x="445" y="376">用户 / 内核边界</text><rect class="process" height="270" rx="6" width="370" x="55" y="88"></rect><text class="bold" x="68" y="108">进程</text><rect class="lib" height="80" rx="4" width="140" x="75" y="130"></rect><text class="bold" text-anchor="middle" x="145" y="162">线程库</text><text class="note" text-anchor="middle" x="145" y="182">创建 / 调度 / 切换</text><text class="note" text-anchor="middle" x="145" y="200">(用户态完成)</text><rect class="thread" height="28" rx="4" width="150" x="255" y="128"></rect><text class="label" text-anchor="middle" x="330" y="147">线程 T1</text><rect class="thread" height="28" rx="4" width="150" x="255" y="164"></rect><text class="label" text-anchor="middle" x="330" y="183">线程 T2</text><rect class="thread" height="28" rx="4" width="150" x="255" y="200"></rect><text class="label" text-anchor="middle" x="330" y="219">线程 T3</text><path class="arrow" d="M215 148l40-6"></path><path class="arrow" d="M215 170l40 8"></path><path class="arrow" d="M215 192l40 22"></path><text class="note" x="70" y="248">• 线程实体位于用户空间</text><text class="note" x="70" y="268">• 切换不陷入内核，开销小、速度快</text><text class="note" x="70" y="288">• 一个线程阻塞会导致整个进程阻塞</text><text class="note" x="70" y="308">• 无法被内核调度到多核并行执行</text><text class="note" x="70" y="328">• 可跨 OS 移植（依赖线程库）</text><rect class="scheduler" height="90" rx="6" width="220" x="130" y="440"></rect><text class="bold" text-anchor="middle" x="240" y="467">PCB（进程）</text><text class="note" text-anchor="middle" x="240" y="490">内核只看到 1 个执行实体</text><text class="note" text-anchor="middle" x="240" y="510">对线程完全无感知</text><text class="note" text-anchor="middle" x="240" y="560">内核调度以进程为单位</text><text class="note" text-anchor="middle" x="240" y="578">同一时刻只有 1 个线程能运行</text><path class="link" d="M240 358v82"></path></g><g transform="translate(480,0)"><rect class="panel" height="600" rx="8" width="440" x="20" y="10"></rect><text class="title" text-anchor="middle" x="240" y="35">内核级线程 (KLT)</text><rect class="userBg" height="200" rx="4" width="420" x="30" y="50"></rect><text class="space" x="40" y="68">用户空间</text><rect class="kernelBg" height="330" rx="4" width="420" x="30" y="270"></rect><text class="space" x="40" y="288">内核空间</text><line class="divider" x1="30" x2="450" y1="260" y2="260"></line><text class="note" text-anchor="end" x="445" y="256">用户 / 内核边界</text><rect class="process" height="150" rx="6" width="370" x="55" y="88"></rect><text class="bold" x="68" y="108">进程</text><rect class="thread" height="30" rx="4" width="100" x="80" y="128"></rect><text class="label" text-anchor="middle" x="130" y="148">线程 T1</text><rect class="thread" height="30" rx="4" width="100" x="190" y="128"></rect><text class="label" text-anchor="middle" x="240" y="148">线程 T2</text><rect class="thread" height="30" rx="4" width="100" x="300" y="128"></rect><text class="label" text-anchor="middle" x="350" y="148">线程 T3</text><text class="note" x="70" y="185">• 用户程序通过系统调用</text><text class="note" x="70" y="203">请求内核创建/管理线程</text><text class="note" x="70" y="221">• 每个线程都有内核对应实体</text><rect class="scheduler" height="46" rx="4" width="370" x="55" y="308"></rect><text class="bold" text-anchor="middle" x="240" y="336">内核线程调度器</text><rect class="ktcb" height="56" rx="4" width="100" x="80" y="378"></rect><text class="bold" text-anchor="middle" x="130" y="402">KTCB 1</text><text class="note" text-anchor="middle" x="130" y="422">对应 T1</text><rect class="ktcb" height="56" rx="4" width="100" x="190" y="378"></rect><text class="bold" text-anchor="middle" x="240" y="402">KTCB 2</text><text class="note" text-anchor="middle" x="240" y="422">对应 T2</text><rect class="ktcb" height="56" rx="4" width="100" x="300" y="378"></rect><text class="bold" text-anchor="middle" x="350" y="402">KTCB 3</text><text class="note" text-anchor="middle" x="350" y="422">对应 T3</text><path class="link" d="M130 158V378"></path><path class="link" d="M240 158V308"></path><path class="link" d="M350 158V378"></path><path class="arrow" d="M130 354v24"></path><path class="arrow" d="M350 354v24"></path><rect class="cpu" height="34" rx="4" width="80" x="90" y="470"></rect><text class="label" text-anchor="middle" x="130" y="492">CPU 0</text><rect class="cpu" height="34" rx="4" width="80" x="200" y="470"></rect><text class="label" text-anchor="middle" x="240" y="492">CPU 1</text><rect class="cpu" height="34" rx="4" width="80" x="310" y="470"></rect><text class="label" text-anchor="middle" x="350" y="492">CPU 2</text><path class="arrow" d="M130 434v36"></path><path class="arrow" d="M240 434v36"></path><path class="arrow" d="M350 434v36"></path><text class="note" x="70" y="535">• 线程的创建/切换需陷入内核，开销较大</text><text class="note" x="70" y="555">• 一个线程阻塞不影响进程中其他线程</text><text class="note" x="70" y="575">• 内核可将线程调度到不同 CPU 并行执行</text></g></svg>