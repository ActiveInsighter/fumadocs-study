<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><dropshadow dx="2" dy="2" stdDeviation="3" flood-color="var(--ink)" flood-opacity=".2"/></filter></defs><rect width="800" height="600" fill="none"/><rect x="50" y="30" width="700" height="80" rx="10" fill="var(--sky-soft)" stroke="var(--violet-mid)" stroke-width="2" filter="url(#shadow)"/><text x="400" y="55" text-anchor="middle" fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">核心思想：选择在未来最长时间内不会被访问的页面进行置换</text><text x="400" y="80" text-anchor="middle" fill="var(--blue-ink)" font-size="var(--svg-font-size-body)">（需要预知未来的页面访问序列）</text><text x="400" y="100" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-label)">⚠️ 实际不可实现，仅用于理论研究和性能基准</text><text x="400" y="150" text-anchor="middle" fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">算法演示示例</text><text x="70" y="185" fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">页面访问序列：</text><g id="sequence"><rect x="200" y="170" width="30" height="25" fill="var(--red-soft)" stroke="var(--red-deep)" rx="3"/><text x="215" y="187" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">A</text><rect x="240" y="170" width="30" height="25" fill="var(--sky-soft)" stroke="var(--violet-mid)" rx="3"/><text x="255" y="187" text-anchor="middle" fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">B</text><rect x="280" y="170" width="30" height="25" fill="var(--purple-soft)" stroke="var(--purple-deep)" rx="3"/><text x="295" y="187" text-anchor="middle" fill="var(--purple-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">C</text><rect x="320" y="170" width="30" height="25" fill="var(--red-soft)" stroke="var(--red-deep)" rx="3"/><text x="335" y="187" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">A</text><rect x="360" y="170" width="30" height="25" fill="var(--green-soft)" stroke="var(--lime-mid)" rx="3"/><text x="375" y="187" text-anchor="middle" fill="var(--lime-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">D</text><rect x="400" y="170" width="30" height="25" fill="var(--sky-soft)" stroke="var(--violet-mid)" rx="3"/><text x="415" y="187" text-anchor="middle" fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">B</text><rect x="440" y="170" width="30" height="25" fill="var(--yellow-soft)" stroke="var(--yellow-mid)" rx="3"/><text x="455" y="187" text-anchor="middle" fill="var(--orange-mid)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">E</text><rect x="480" y="170" width="30" height="25" fill="var(--red-soft)" stroke="var(--red-deep)" rx="3"/><text x="495" y="187" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">A</text></g><polygon points="375,205 380,215 370,215" fill="var(--red-deep)"/><text x="375" y="230" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">当前时刻</text><text x="70" y="270" fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">当前内存状态 (容量: 3页)：</text><g id="memory"><rect x="280" y="280" width="60" height="40" fill="var(--sky-deep)" stroke="var(--blue-ink)" stroke-width="2" rx="5"/><text x="310" y="295" text-anchor="middle" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">页面 A</text><text x="310" y="310" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">下次访问: +3</text><rect x="350" y="280" width="60" height="40" fill="var(--sky-deep)" stroke="var(--blue-ink)" stroke-width="2" rx="5"/><text x="380" y="295" text-anchor="middle" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">页面 B</text><text x="380" y="310" text-anchor="middle" fill="var(--green-mid)" font-size="var(--svg-font-size-caption)">下次访问: +2</text><rect x="420" y="280" width="60" height="40" fill="var(--red-soft)" stroke="var(--red-deep)" stroke-width="3" rx="5"/><text x="450" y="295" text-anchor="middle" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">页面 C</text><text x="450" y="310" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">不再访问</text></g><text x="400" y="350" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">OPT 算法选择：置换页面 C （未来不再访问）</text><rect x="50" y="380" width="340" height="140" rx="10" fill="var(--green-soft)" stroke="var(--green-mid)" stroke-width="2"/><text x="220" y="400" text-anchor="middle" fill="var(--green-mid)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">✓ 算法优势</text><text x="70" y="425" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 理论上最优解</text><text x="70" y="445" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 缺页中断次数最少</text><text x="70" y="465" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 性能评估基准</text><text x="70" y="485" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 算法正确性证明标准</text><text x="70" y="505" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 其他算法效果对比</text><rect x="410" y="380" width="340" height="140" rx="10" fill="var(--red-soft)" stroke="var(--red-deep)" stroke-width="2"/><text x="580" y="400" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">✗ 实际限制</text><text x="430" y="425" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 无法预知未来访问</text><text x="430" y="445" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 实际系统不可实现</text><text x="430" y="465" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 仅用于理论研究</text><text x="430" y="485" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 需要完整访问序列</text><text x="430" y="505" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)">• 计算复杂度较高</text><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--red-deep)"/></marker></defs></svg>