<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="800" height="600" fill="none"/><text x="400" y="30" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">LRU 页面置换算法</text><line x1="100" y1="100" x2="700" y2="100" stroke="var(--blue-ink)" stroke-width="3"/><text x="50" y="105" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">时间</text><g font-size="var(--svg-font-size-label)" fill="var(--ink-soft)"><line x1="700" y1="95" x2="700" y2="105" stroke="var(--blue-ink)"/><text x="695" y="120" text-anchor="middle">现在</text><line x1="550" y1="95" x2="550" y2="105" stroke="var(--blue-ink)"/><text x="545" y="120" text-anchor="middle">1分钟前</text><line x1="400" y1="95" x2="400" y2="105" stroke="var(--blue-ink)"/><text x="395" y="120" text-anchor="middle">2分钟前</text><line x1="250" y1="95" x2="250" y2="105" stroke="var(--blue-ink)"/><text x="245" y="120" text-anchor="middle">3分钟前</text></g><rect x="150" y="200" width="500" height="120" fill="var(--neutral-soft)" stroke="var(--indigo-light)" stroke-width="2" rx="10"/><text x="400" y="190" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">内存中的页面</text><g><rect x="180" y="220" width="100" height="80" fill="var(--indigo-mid)" stroke="var(--blue-deep)" stroke-width="2" rx="5"/><text x="230" y="250" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">页面 A</text><text x="230" y="270" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--surface)">1分钟前使用</text><text x="230" y="285" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--surface)">较新</text></g><g><rect x="320" y="220" width="100" height="80" fill="var(--yellow-mid)" stroke="var(--orange-mid)" stroke-width="2" rx="5"/><text x="370" y="250" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">页面 B</text><text x="370" y="270" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--surface)">2分钟前使用</text><text x="370" y="285" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--surface)">中等</text></g><g><rect x="460" y="220" width="100" height="80" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2" rx="5"/><text x="510" y="250" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">页面 C</text><text x="510" y="270" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--surface)">3分钟前使用</text><text x="510" y="285" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--surface)">最旧</text></g><g stroke="var(--blue-ink)" stroke-width="2" fill="none"><path d="M550 130q-1e2 20-320 70" stroke="var(--indigo-mid)"/><polygon points="225,195 235,205 235,200 245,200 225,185" fill="var(--indigo-mid)"/><path d="M4e2 130q-20 30-30 70" stroke="var(--yellow-mid)"/><polygon points="365,195 375,205 375,200 385,200 365,185" fill="var(--yellow-mid)"/><path d="M250 130q1e2 20 260 70" stroke="var(--red-deep)"/><polygon points="505,195 515,205 515,200 525,200 505,185" fill="var(--red-deep)"/></g><rect x="150" y="370" width="500" height="100" fill="var(--surface)" stroke="var(--red-deep)" stroke-width="3" rx="10"/><text x="400" y="395" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">LRU 算法决策</text><text x="400" y="420" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">选择"最近最少使用"的页面进行替换</text><g><path d="M510 320q0 20 0 40" stroke="var(--red-deep)" stroke-width="4" fill="none"/><polygon points="505,355 515,365 515,360 525,360 505,345" fill="var(--red-deep)"/><text x="470" y="350" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">被替换</text></g><text x="400" y="445" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">页面C距离现在时间最远，优先被替换出内存</text><rect x="50" y="500" width="700" height="80" fill="var(--sky-soft)" stroke="var(--indigo-mid)" stroke-width="2" rx="10"/><text x="400" y="525" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">算法原理：时间局部性</text><text x="400" y="545" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">最近被使用的页面，在将来被再次使用的可能性更大</text><text x="400" y="565" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">因此保留最近使用的页面，替换最久未使用的页面</text></svg>