<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Menlo', monospace"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#455a64"/></marker><marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1565c0"/></marker><marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2e7d32"/></marker><linearGradient id="gUser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffe082"/></linearGradient><linearGradient id="gSpool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3f2fd"/><stop offset="1" stop-color="#90caf9"/></linearGradient><linearGradient id="gDev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8e6c9"/><stop offset="1" stop-color="#81c784"/></linearGradient><linearGradient id="gApp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e5f5"/><stop offset="1" stop-color="#ce93d8"/></linearGradient><style>.h1{fill:#0d47a1;font-size:18px;font-weight:700}.sub{fill:#455a64;font-size:12px}.lay{fill:#263238;font-size:13px;font-weight:700}.zh{fill:#37474f;font-size:12px}.zh-s{fill:#546e7a;font-size:11px}.tag{fill:#b71c1c;font-size:11px;font-weight:700}.lab{fill:#1565c0;font-size:11px;font-weight:600}.labG{fill:#2e7d32;font-size:11px;font-weight:600}.k{fill:#0d47a1;font-size:12px;font-weight:700}.app-t{fill:#4a148c;font-size:12px;font-weight:700}</style></defs><text x="450" y="26" text-anchor="middle" class="h1">SPOOLing 技术 — 概念与典型应用</text><text x="450" y="46" text-anchor="middle" class="sub">Simultaneous Peripheral Operations On-Line · 用磁盘做中间缓冲，把独占设备"改造"成共享设备</text><text x="30" y="80" class="lay">一、核心概念</text><line x1="30" y1="86" x2="870" y2="86" stroke="#cfd8dc" stroke-width="1"/><rect x="30" y="105" width="150" height="180" rx="8" fill="url(#gUser)" stroke="#f9a825"/><text x="105" y="125" text-anchor="middle" class="lay">多个用户 / 进程</text><g><circle cx="65" cy="155" r="14" fill="#fff" stroke="#f57f17"/><text x="65" y="159" text-anchor="middle" class="zh">P1</text><circle cx="105" cy="155" r="14" fill="#fff" stroke="#f57f17"/><text x="105" y="159" text-anchor="middle" class="zh">P2</text><circle cx="145" cy="155" r="14" fill="#fff" stroke="#f57f17"/><text x="145" y="159" text-anchor="middle" class="zh">P3</text></g><text x="105" y="200" text-anchor="middle" class="zh-s">提交 I/O 请求后</text><text x="105" y="216" text-anchor="middle" class="zh-s">立即返回，继续</text><text x="105" y="232" text-anchor="middle" class="zh-s">执行自己的任务</text><text x="105" y="262" text-anchor="middle" class="tag">感觉像独享设备</text><line x1="180" y1="160" x2="235" y2="160" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/><text x="207" y="152" text-anchor="middle" class="lab">写入</text><rect x="235" y="105" width="360" height="285" rx="10" fill="url(#gSpool)" stroke="#1565c0" stroke-width="1.6"/><text x="415" y="126" text-anchor="middle" class="lay">SPOOLing 子系统（假脱机）</text><text x="415" y="144" text-anchor="middle" class="tag">运行在主机 / CPU，用软件模拟"外围控制机"</text><rect x="255" y="160" width="150" height="90" rx="6" fill="#fff" stroke="#1565c0"/><text x="330" y="180" text-anchor="middle" class="k">输入井（磁盘）</text><text x="330" y="200" text-anchor="middle" class="zh-s">模拟脱机时的输入带</text><g font-family="Menlo,monospace" font-size="10" fill="#263238"><rect x="270" y="210" width="120" height="14" fill="#e8f5e9" stroke="#81c784"/><text x="278" y="221">job#1 data...</text><rect x="270" y="228" width="120" height="14" fill="#e8f5e9" stroke="#81c784"/><text x="278" y="239">job#2 data...</text></g><rect x="425" y="160" width="150" height="90" rx="6" fill="#fff" stroke="#1565c0"/><text x="500" y="180" text-anchor="middle" class="k">输出井（磁盘）</text><text x="500" y="200" text-anchor="middle" class="zh-s">模拟脱机时的输出带</text><g font-family="Menlo,monospace" font-size="10" fill="#263238"><rect x="440" y="210" width="120" height="14" fill="#fff3e0" stroke="#ffb74d"/><text x="448" y="221">print job A</text><rect x="440" y="228" width="120" height="14" fill="#fff3e0" stroke="#ffb74d"/><text x="448" y="239">print job B</text></g><rect x="255" y="265" width="150" height="55" rx="6" fill="#fff" stroke="#1565c0" stroke-dasharray="4 3"/><text x="330" y="284" text-anchor="middle" class="k">输入缓冲区</text><text x="330" y="302" text-anchor="middle" class="zh-s">内存缓冲，衔接磁盘</text><text x="330" y="315" text-anchor="middle" class="zh-s">与低速外设</text><rect x="425" y="265" width="150" height="55" rx="6" fill="#fff" stroke="#1565c0" stroke-dasharray="4 3"/><text x="500" y="284" text-anchor="middle" class="k">输出缓冲区</text><text x="500" y="302" text-anchor="middle" class="zh-s">内存缓冲，衔接磁盘</text><text x="500" y="315" text-anchor="middle" class="zh-s">与低速外设</text><rect x="255" y="335" width="150" height="45" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="330" y="353" text-anchor="middle" class="k">输入进程 SPi</text><text x="330" y="371" text-anchor="middle" class="zh-s">把外设数据 → 输入井</text><rect x="425" y="335" width="150" height="45" rx="6" fill="#e8eaf6" stroke="#3949ab"/><text x="500" y="353" text-anchor="middle" class="k">输出进程 SPo</text><text x="500" y="371" text-anchor="middle" class="zh-s">把输出井 → 外设</text><line x1="595" y1="245" x2="655" y2="245" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrGreen)"/><text x="625" y="237" text-anchor="middle" class="labG">按队列</text><text x="625" y="260" text-anchor="middle" class="labG">串行送出</text><rect x="655" y="105" width="215" height="285" rx="8" fill="url(#gDev)" stroke="#2e7d32"/><text x="762" y="126" text-anchor="middle" class="lay">低速独占外设</text><text x="762" y="144" text-anchor="middle" class="zh-s">物理上一次只能一个进程占用</text><g transform="translate(690,160)"><rect x="0" y="14" width="60" height="30" rx="3" fill="#fff" stroke="#2e7d32"/><rect x="8" y="0" width="44" height="18" fill="#fff" stroke="#2e7d32"/><rect x="8" y="30" width="44" height="18" fill="#f1f8e9" stroke="#2e7d32"/><circle cx="50" cy="24" r="2" fill="#c62828"/><text x="30" y="66" text-anchor="middle" class="zh">打印机</text></g><g transform="translate(780,160)"><rect x="0" y="6" width="70" height="40" rx="4" fill="#fff" stroke="#2e7d32"/><circle cx="18" cy="26" r="8" fill="#f1f8e9" stroke="#2e7d32"/><circle cx="52" cy="26" r="8" fill="#f1f8e9" stroke="#2e7d32"/><text x="35" y="66" text-anchor="middle" class="zh">磁带机</text></g><g transform="translate(690,240)"><rect x="0" y="0" width="60" height="36" rx="3" fill="#fff" stroke="#2e7d32"/><rect x="6" y="8" width="48" height="20" fill="#f1f8e9" stroke="#2e7d32"/><text x="30" y="50" text-anchor="middle" class="zh">读卡机</text></g><g transform="translate(780,240)"><rect x="0" y="0" width="70" height="36" rx="3" fill="#fff" stroke="#2e7d32"/><line x1="10" y1="18" x2="60" y2="18" stroke="#2e7d32"/><line x1="35" y1="6" x2="35" y2="30" stroke="#c62828"/><text x="35" y="50" text-anchor="middle" class="zh">绘图仪</text></g><text x="762" y="330" text-anchor="middle" class="tag">"独占"→ 逻辑上"共享"</text><text x="762" y="352" text-anchor="middle" class="zh-s">用户看到的是磁盘上的"虚拟外设"</text><text x="762" y="370" text-anchor="middle" class="zh-s">实际由 SPo/SPi 代为访问物理设备</text><rect x="30" y="300" width="150" height="90" rx="6" fill="#fffde7" stroke="#f9a825"/><text x="105" y="320" text-anchor="middle" class="k">三大特点</text><text x="40" y="340" class="zh-s">① 提高 I/O 速度</text><text x="40" y="358" class="zh-s">② 独占设备 → 共享</text><text x="40" y="376" class="zh-s">③ 实现虚拟设备</text><text x="30" y="425" class="lay">二、典型应用</text><line x1="30" y1="431" x2="870" y2="431" stroke="#cfd8dc" stroke-width="1"/><g><rect x="30" y="445" width="200" height="100" rx="8" fill="url(#gApp)" stroke="#8e24aa"/><text x="130" y="466" text-anchor="middle" class="app-t">① 打印服务</text><text x="40" y="486" class="zh-s">多用户提交 → 打印队列</text><text x="40" y="504" class="zh-s">lpd / CUPS 守护进程</text><text x="40" y="522" class="zh-s">按序送往打印机</text><text x="40" y="540" class="zh-s">用户提交即返回</text></g><g><rect x="240" y="445" width="200" height="100" rx="8" fill="url(#gApp)" stroke="#8e24aa"/><text x="340" y="466" text-anchor="middle" class="app-t">② 批处理作业</text><text x="250" y="486" class="zh-s">早期读卡机脱机方式</text><text x="250" y="504" class="zh-s">作业先入 输入井</text><text x="250" y="522" class="zh-s">CPU 按序调度执行</text><text x="250" y="540" class="zh-s">结果暂存 输出井</text></g><g><rect x="450" y="445" width="200" height="100" rx="8" fill="url(#gApp)" stroke="#8e24aa"/><text x="550" y="466" text-anchor="middle" class="app-t">③ 邮件 / 消息队列</text><text x="460" y="486" class="zh-s">SMTP 邮件先落盘</text><text x="460" y="504" class="zh-s">MTA 后台异步投递</text><text x="460" y="522" class="zh-s">发件方无需等待送达</text><text x="460" y="540" class="zh-s">典型的"离线并发"</text></g><g><rect x="660" y="445" width="210" height="100" rx="8" fill="url(#gApp)" stroke="#8e24aa"/><text x="765" y="466" text-anchor="middle" class="app-t">④ 网络下载 / 缓存</text><text x="670" y="486" class="zh-s">数据先落磁盘缓存</text><text x="670" y="504" class="zh-s">再由后台程序处理</text><text x="670" y="522" class="zh-s">解耦"到达"与"消费"</text><text x="670" y="540" class="zh-s">同为 SPOOLing 思想</text></g></svg>