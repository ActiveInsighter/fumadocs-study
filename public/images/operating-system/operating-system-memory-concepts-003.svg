<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect x="0" y="0" width="800" height="600" fill="none"/><g transform="translate(150, 80)"><rect x="0" y="-30" width="150" height="400" fill="none" stroke="var(--blue-ink)" stroke-width="3"/><rect x="0" y="-30" width="150" height="100" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="1"/><text x="75" y="25" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">系统区</text><text x="75" y="45" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--surface)">操作系统</text><rect x="0" y="70" width="150" height="300" fill="var(--indigo-mid)" stroke="var(--blue-deep)" stroke-width="1"/><text x="75" y="210" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">用户区</text><text x="75" y="230" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--surface)">单一用户程序</text><text x="75" y="250" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--surface)">独占整个用户空间</text></g><g transform="translate(120, 80)"><text x="0" y="-15" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--ink-soft)">高地址</text><text x="0" y="390" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--ink-soft)">低地址</text></g><g transform="translate(400, 100)"><rect x="0" y="-30" width="300" height="140" fill="var(--mint-soft)" stroke="var(--green-mid)" stroke-width="2" rx="10"/><text x="150" y="-5" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--green-mid)">优点</text><circle cx="20" cy="20" r="4" fill="var(--green-mid)"/><text x="35" y="25" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">实现简单</text><circle cx="20" cy="45" r="4" fill="var(--green-mid)"/><text x="35" y="50" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">无外部碎片</text><circle cx="20" cy="70" r="4" fill="var(--green-mid)"/><text x="35" y="75" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">无需内存保护</text><circle cx="20" cy="95" r="4" fill="var(--green-mid)"/><text x="35" y="100" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">内存中永远只有一道程序</text><rect x="0" y="140" width="300" height="140" fill="var(--yellow-light)" stroke="var(--yellow-mid)" stroke-width="2" rx="10"/><text x="150" y="165" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-mid)">缺点</text><circle cx="20" cy="190" r="4" fill="var(--orange-mid)"/><text x="35" y="195" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">只能用于单用户、单任务系统</text><circle cx="20" cy="215" r="4" fill="var(--orange-mid)"/><text x="35" y="220" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">存储器利用率极低</text><circle cx="20" cy="240" r="4" fill="var(--orange-mid)"/><text x="35" y="245" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">不支持多任务处理</text><circle cx="20" cy="265" r="4" fill="var(--orange-mid)"/><text x="35" y="270" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">无法并发执行多个程序</text></g><g transform="translate(400, 350)"><text x="100" y="50" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--ink-soft)">系统区 + 单一程序 + 未使用空间</text><rect x="0" y="70" width="15" height="15" fill="var(--red-deep)"/><text x="25" y="82" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">系统区</text><rect x="80" y="70" width="15" height="15" fill="var(--indigo-mid)"/><text x="105" y="82" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">用户程序</text><rect x="170" y="70" width="15" height="15" fill="var(--neutral-soft)" stroke="var(--indigo-light)"/><text x="195" y="82" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">未使用</text></g><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--ink-soft)"/></marker></defs><text x="400" y="520" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--ink-soft)">这是最简单的内存管理方式，适用于早期的单任务操作系统</text></svg>