<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"/></marker></defs><style>.title{font-weight: var(--svg-font-weight-bold);font-size: var(--svg-font-size-body)}.small{font-size: var(--svg-font-size-caption);fill:var(--neutral-ink)}.ok{fill:var(--lime-deep)}.no{fill:var(--red-deep)}</style><text x="440" y="26" text-anchor="middle" class="title svg-text svg-text-theme">CPU 特权级边界：Ring 0 (内核态) ↔ Ring 3 (用户态)</text><g transform="translate(230,250)"><circle cx="0" cy="0" r="200" fill="var(--rose-soft)" stroke="var(--red-deep)"/><circle cx="0" cy="0" r="150" fill="var(--rose-light)" stroke="var(--red-deep)"/><circle cx="0" cy="0" r="100" fill="var(--red-mid)" stroke="var(--red-deep)"/><circle cx="0" cy="0" r="50" fill="var(--red-deep)" stroke="var(--red-deep)"/><text x="0" y="-180" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">Ring 3</text><text x="0" y="-160" text-anchor="middle" class="small svg-text svg-text-on-light">用户态</text><text x="0" y="-130" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">Ring 2</text><text x="0" y="-80" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">Ring 1</text><text x="0" y="-30" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">Ring 0</text><text x="0" y="-12" text-anchor="middle" class="small svg-text svg-text-on-dark">内核态</text><text x="0" y="6" text-anchor="middle" class="small svg-text svg-text-on-dark">最高权限</text><text x="0" y="40" text-anchor="middle" class="small svg-text svg-text-on-dark">权限：内 高 → 外 低</text><text x="0" y="60" text-anchor="middle" class="small svg-text svg-text-on-light">Linux/Windows 仅使用</text><text x="0" y="78" text-anchor="middle" class="small svg-text svg-text-on-light">Ring 0 与 Ring 3</text></g><g transform="translate(480,60)"><rect x="0" y="0" width="380" height="200" fill="var(--sky-soft)" stroke="var(--violet-deep)" rx="6"/><text x="190" y="22" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">用户态 (Ring 3) — 受限</text><text x="10" y="46" class="ok svg-text svg-text-on-light">✓ 执行普通指令 (ALU, MOV, JMP)</text><text x="10" y="66" class="ok svg-text svg-text-on-light">✓ 访问自己的用户空间 (代码/数据/堆栈)</text><text x="10" y="86" class="ok svg-text svg-text-on-light">✓ 调用库函数 (printf, malloc)</text><text x="10" y="106" class="no svg-text svg-text-on-light">✗ 执行特权指令 (HLT, CLI, LGDT)</text><text x="10" y="126" class="no svg-text svg-text-on-light">✗ 直接访问 I/O 端口、设备寄存器</text><text x="10" y="146" class="no svg-text svg-text-on-light">✗ 修改页表、IDT、控制寄存器 (CR0..3)</text><text x="10" y="166" class="no svg-text svg-text-on-light">✗ 访问内核空间内存</text><text x="10" y="186" class="small svg-text svg-text-on-light">→ 需要服务时必须通过 “系统调用” 陷入内核</text></g><g transform="translate(480,265)"><rect x="0" y="0" width="380" height="200" fill="var(--yellow-soft)" stroke="var(--orange-mid)" rx="6"/><text x="190" y="22" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">内核态 (Ring 0) — 全权限</text><text x="10" y="46" class="ok svg-text svg-text-on-light">✓ 执行所有指令，含特权指令</text><text x="10" y="66" class="ok svg-text svg-text-on-light">✓ 直接读写任意物理/虚拟内存</text><text x="10" y="86" class="ok svg-text svg-text-on-light">✓ 操作硬件、中断、I/O、DMA</text><text x="10" y="106" class="ok svg-text svg-text-on-light">✓ 修改页表、调度进程、管理资源</text><text x="10" y="146" class="small svg-text svg-text-on-light">⚠ 错误后果严重 → 整机崩溃 / 安全风险</text><text x="10" y="166" class="small svg-text svg-text-on-light">→ 内核代码、设备驱动、中断处理在此</text><text x="10" y="186" class="small svg-text svg-text-on-light">→ 完成服务后通过 iret/sysret 返回用户态</text></g><g transform="translate(0,470)"><rect x="20" y="0" width="840" height="40" fill="var(--paper)" stroke="var(--neutral-mid)" rx="4"/><text x="40" y="24" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">穿越边界：</text><text x="140" y="24" class="small svg-text svg-text-on-light">系统调用 (int 0x80 / syscall / svc) · 硬件中断 · 异常 / 陷阱</text><text x="560" y="24" class="small svg-text svg-text-on-light">用户态 → 内核态：自动切换栈、保存上下文、跳转 ISR</text></g><path d="M260 70q120-10 220 30" stroke="var(--violet-deep)" stroke-width="1.5" fill="none" marker-end="url(#arr7)"/><text x="380" y="58" class="small svg-text svg-text-on-light">用户进程在 Ring 3 运行</text><path d="M480 380q-1e2 40-220 0" stroke="var(--orange-mid)" stroke-width="1.5" fill="none" marker-end="url(#arr7)"/><text x="320" y="438" class="small svg-text svg-text-on-light">系统调用陷入 Ring 0</text></svg>