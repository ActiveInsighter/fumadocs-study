<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" role="img" aria-label="抢占式与非抢占式调度对比：P1 在 0 时刻到达运行，P2 在 3 时刻到达且优先级更高，非抢占式下 P2 需等 P1 结束，抢占式下 P1 立即被剥夺 CPU"><style>.pnp-label{font:600 14px system-ui,-apple-system,segoe ui,sans-serif;fill:#1f2937}.pnp-sub{font:10px system-ui,-apple-system,segoe ui,sans-serif;fill:#6b7280}.pnp-note{font:11px system-ui,-apple-system,segoe ui,sans-serif;fill:#6b7280}.pnp-event{font:600 12px system-ui,-apple-system,segoe ui,sans-serif;fill:#b91c1c}.pnp-tick{font:10px system-ui,-apple-system,segoe ui,sans-serif;fill:#9ca3af}.pnp-blk{font:600 13px system-ui,-apple-system,segoe ui,sans-serif}.pnp-p1{fill:#dbeafe;stroke:#2563eb;stroke-width:1}.pnp-p1-t{fill:#1e3a8a}.pnp-p2{fill:#fee2e2;stroke:#dc2626;stroke-width:1}.pnp-p2-t{fill:#991b1b}.pnp-wait{fill:#f3f4f6;stroke:#d1d5db;stroke-width:1;stroke-dasharray:4 3}.pnp-axis{stroke:#9ca3af;stroke-width:1;fill:none}.pnp-evline{stroke:#dc2626;stroke-width:1.5;stroke-dasharray:5 4;fill:none}</style><defs><marker id="pnp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="pnp-event" x="252" y="18" text-anchor="middle">t = 3：P2 到达（优先级更高）</text><line class="pnp-evline" x1="252" y1="26" x2="252" y2="296"/><text class="pnp-label" x="8" y="66">非抢占式</text><text class="pnp-sub" x="8" y="82">Non-Preemptive</text><rect class="pnp-p1" x="120" y="50" width="352" height="44" rx="5"/><text class="pnp-blk pnp-p1-t" x="296" y="77" text-anchor="middle">P1 一直运行到结束</text><rect class="pnp-p2" x="472" y="50" width="176" height="44" rx="5"/><text class="pnp-blk pnp-p2-t" x="560" y="77" text-anchor="middle">P2</text><text class="pnp-note" x="260" y="44">不调度：新进程只能排队</text><rect class="pnp-wait" x="252" y="100" width="220" height="18" rx="4"/><text class="pnp-tick" x="362" y="113" text-anchor="middle">P2 在就绪队列等待 5</text><text class="pnp-label" x="8" y="186">抢占式</text><text class="pnp-sub" x="8" y="202">Preemptive</text><rect class="pnp-p1" x="120" y="170" width="132" height="44" rx="5"/><text class="pnp-blk pnp-p1-t" x="186" y="197" text-anchor="middle">P1</text><rect class="pnp-p2" x="252" y="170" width="176" height="44" rx="5"/><text class="pnp-blk pnp-p2-t" x="340" y="197" text-anchor="middle">P2</text><rect class="pnp-p1" x="428" y="170" width="220" height="44" rx="5"/><text class="pnp-blk pnp-p1-t" x="538" y="197" text-anchor="middle">P1（恢复执行）</text><line class="pnp-evline" x1="252" y1="140" x2="252" y2="164" marker-end="url(#pnp-arrow)"/><text class="pnp-note" x="260" y="156">立即调度：P1 被剥夺 CPU，运行态 → 就绪态</text><rect class="pnp-wait" x="252" y="220" width="176" height="18" rx="4"/><text class="pnp-tick" x="340" y="233" text-anchor="middle">P1 在就绪队列等待 4</text><line class="pnp-axis" x1="120" y1="296" x2="660" y2="296" marker-end="url(#pnp-arrow)"/><line class="pnp-axis" x1="120" y1="296" x2="120" y2="302"/><text class="pnp-tick" x="120" y="314" text-anchor="middle">0</text><line class="pnp-axis" x1="164" y1="296" x2="164" y2="302"/><text class="pnp-tick" x="164" y="314" text-anchor="middle">1</text><line class="pnp-axis" x1="208" y1="296" x2="208" y2="302"/><text class="pnp-tick" x="208" y="314" text-anchor="middle">2</text><line class="pnp-axis" x1="252" y1="296" x2="252" y2="302"/><text class="pnp-tick" x="252" y="314" text-anchor="middle">3</text><line class="pnp-axis" x1="296" y1="296" x2="296" y2="302"/><text class="pnp-tick" x="296" y="314" text-anchor="middle">4</text><line class="pnp-axis" x1="340" y1="296" x2="340" y2="302"/><text class="pnp-tick" x="340" y="314" text-anchor="middle">5</text><line class="pnp-axis" x1="384" y1="296" x2="384" y2="302"/><text class="pnp-tick" x="384" y="314" text-anchor="middle">6</text><line class="pnp-axis" x1="428" y1="296" x2="428" y2="302"/><text class="pnp-tick" x="428" y="314" text-anchor="middle">7</text><line class="pnp-axis" x1="472" y1="296" x2="472" y2="302"/><text class="pnp-tick" x="472" y="314" text-anchor="middle">8</text><line class="pnp-axis" x1="516" y1="296" x2="516" y2="302"/><text class="pnp-tick" x="516" y="314" text-anchor="middle">9</text><line class="pnp-axis" x1="560" y1="296" x2="560" y2="302"/><text class="pnp-tick" x="560" y="314" text-anchor="middle">10</text><line class="pnp-axis" x1="604" y1="296" x2="604" y2="302"/><text class="pnp-tick" x="604" y="314" text-anchor="middle">11</text><line class="pnp-axis" x1="648" y1="296" x2="648" y2="302"/><text class="pnp-tick" x="648" y="314" text-anchor="middle">12</text><text class="pnp-tick" x="668" y="300">t</text><rect class="pnp-p1" x="120" y="336" width="14" height="14" rx="3"/><text class="pnp-note" x="140" y="347">P1：AT = 0，BT = 8，低优先级</text><rect class="pnp-p2" x="310" y="336" width="14" height="14" rx="3"/><text class="pnp-note" x="330" y="347">P2：AT = 3，BT = 4，高优先级</text><rect class="pnp-wait" x="500" y="336" width="14" height="14" rx="3"/><text class="pnp-note" x="520" y="347">就绪等待</text></svg>