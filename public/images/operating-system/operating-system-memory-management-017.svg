<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"/></marker></defs><style>.title{font-weight: var(--svg-font-weight-bold);font-size: var(--svg-font-size-body)}.small{font-size: var(--svg-font-size-caption);fill:var(--neutral-ink)}.c00{fill:var(--green-light);stroke:var(--lime-deep)}.c01{fill:var(--yellow-light);stroke:var(--orange-mid)}.c10{fill:var(--amber-light);stroke:var(--orange-mid)}.c11{fill:var(--rose-light);stroke:var(--red-deep)}.mono{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-label)}</style><text x="470" y="26" text-anchor="middle" class="title">改进型 Clock：基于 (R, M) 的四类页面与两轮扫描</text><g transform="translate(40,60)"><text x="200" y="0" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">四类页面与淘汰优先级</text><line x1="40" y1="40" x2="40" y2="320" stroke="var(--neutral-ink)"/><line x1="40" y1="320" x2="380" y2="320" stroke="var(--neutral-ink)"/><text x="20" y="40" class="small">M=1</text><text x="-20" y="180" class="small">M (修改位)</text><text x="20" y="320" class="small">M=0</text><text x="40" y="340" text-anchor="middle" class="small">R=0</text><text x="210" y="340" text-anchor="middle">R (访问位)</text><text x="380" y="340" text-anchor="middle" class="small">R=1</text><rect x="50" y="180" width="160" height="130" class="c00" rx="6"/><text x="130" y="208" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">(0, 0)</text><text x="130" y="232" text-anchor="middle" class="small">最近未访问 + 未修改</text><text x="130" y="252" text-anchor="middle" class="small">直接淘汰，无需回写</text><text x="130" y="278" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" fill="var(--lime-deep)">优先级 ① 最高</text><rect x="220" y="180" width="160" height="130" class="c10" rx="6"/><text x="300" y="208" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">(1, 0)</text><text x="300" y="232" text-anchor="middle" class="small">最近访问过 + 未修改</text><text x="300" y="252" text-anchor="middle" class="small">活跃但无脏数据</text><text x="300" y="278" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-mid)">优先级 ③</text><rect x="50" y="50" width="160" height="130" class="c01" rx="6"/><text x="130" y="78" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">(0, 1)</text><text x="130" y="102" text-anchor="middle" class="small">最近未访问 + 已修改</text><text x="130" y="122" text-anchor="middle" class="small">淘汰前需写回磁盘</text><text x="130" y="148" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-mid)">优先级 ②</text><rect x="220" y="50" width="160" height="130" class="c11" rx="6"/><text x="300" y="78" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">(1, 1)</text><text x="300" y="102" text-anchor="middle" class="small">最近访问过 + 已修改</text><text x="300" y="122" text-anchor="middle" class="small">最不该淘汰</text><text x="300" y="148" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">优先级 ④ 最低</text></g><g transform="translate(490,60)"><text x="200" y="0" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">两轮（最多四轮）扫描流程</text><rect x="0" y="20" width="400" height="60" fill="var(--green-soft)" stroke="var(--lime-deep)" rx="6"/><text x="200" y="44" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">第 1 轮：找 (0, 0)</text><text x="200" y="64" text-anchor="middle" class="small">扫描时不修改任何位；找到立刻淘汰</text><rect x="0" y="100" width="400" height="60" fill="var(--yellow-soft)" stroke="var(--orange-mid)" rx="6"/><text x="200" y="124" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">第 2 轮：找 (0, 1)</text><text x="200" y="144" text-anchor="middle" class="small">仍未访问但脏 → 淘汰且写回；本轮把扫过的 R 清零</text><rect x="0" y="180" width="400" height="60" fill="var(--sky-soft)" stroke="var(--violet-deep)" rx="6"/><text x="200" y="204" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">第 3 轮：再找 (0, 0)</text><text x="200" y="224" text-anchor="middle" class="small">经过清零，原来的 (1, 0) 此刻变 (0, 0)</text><rect x="0" y="260" width="400" height="60" fill="var(--rose-soft)" stroke="var(--rose-deep)" rx="6"/><text x="200" y="284" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">第 4 轮：再找 (0, 1)</text><text x="200" y="304" text-anchor="middle" class="small">原 (1, 1) 此刻已变 (0, 1) → 写回后淘汰</text><path d="M2e2 80v20" stroke="var(--neutral-ink)" marker-end="url(#arr8)"/><path d="M2e2 160v20" stroke="var(--neutral-ink)" marker-end="url(#arr8)"/><path d="M2e2 240v20" stroke="var(--neutral-ink)" marker-end="url(#arr8)"/></g><g transform="translate(40,420)"><rect x="0" y="0" width="860" height="120" fill="var(--surface)" stroke="var(--neutral-mid)" rx="6"/><text x="14" y="22" font-weight="var(--svg-font-weight-bold)">核心思想</text><text x="14" y="44" class="small">• 在简单 Clock 的 R 之外引入 M，把 “是否脏” 纳入淘汰排序，减少不必要的磁盘写回。</text><text x="14" y="64" class="small">• 优先级 (0,0) &gt; (0,1) &gt; (1,0) &gt; (1,1) ：先选既不活跃又干净的，再退一步选脏但不活跃的。</text><text x="14" y="84" class="small">• 通过 “第二轮清零 R” 让活跃页 (1,*) 逐步降级，避免找不到可淘汰页时无限循环。</text><text x="14" y="104" class="small">• R 由硬件 / OS 在每次访问时置 1；M 由硬件 / OS 在写操作时置 1，写回磁盘后清 0。</text></g></svg>