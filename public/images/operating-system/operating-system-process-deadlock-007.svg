<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2f7"/></linearGradient><linearGradient id="detectGrad" x1="0" y1="0" x2="100%" y2="100%"><stop offset="0" stop-color="#6366f1"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="recoverGrad" x1="0" y1="0" x2="100%" y2="100%"><stop offset="0" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="titleGrad" x1="0" y1="0" x2="100%" y2="0"><stop offset="0" stop-color="#1e293b"/><stop offset="100%" stop-color="#475569"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="0" dy="2"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#475569"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ef4444"/></marker></defs><rect width="900" height="640" fill="url(#bgGrad)"/><rect x="0" y="0" width="900" height="58" fill="url(#titleGrad)"/><text x="450" y="37" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" letter-spacing="1">死锁的检测与解除 · Deadlock Detection &amp; Recovery</text><g transform="translate(30, 80)"><rect width="420" height="540" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/><rect width="420" height="44" rx="14" fill="url(#detectGrad)"/><rect y="30" width="420" height="14" fill="url(#detectGrad)"/><text x="20" y="29" fill="#fff" font-size="16" font-weight="700">① 死锁检测 (Detection)</text><text x="400" y="29" text-anchor="end" fill="#fff" font-size="13" opacity=".85">资源分配图 · DFS 找环</text><text x="20" y="72" fill="#475569" font-size="13">将进程与资源建模为有向图，环 = 死锁</text><g transform="translate(20, 90)"><rect width="380" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="10" y="18" fill="#64748b" font-size="11" font-weight="600">资源分配图示例</text><circle cx="80" cy="80" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="80" y="85" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="700">P1</text><circle cx="300" cy="80" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="300" y="85" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="700">P2</text><rect x="58" y="160" width="44" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><circle cx="80" cy="178" r="3" fill="#92400e"/><text x="80" y="153" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">R1</text><rect x="278" y="160" width="44" height="36" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><circle cx="300" cy="178" r="3" fill="#92400e"/><text x="300" y="153" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">R2</text><path d="M1e2 90q1e2-30 180 75" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/><text x="190" y="62" fill="#ef4444" font-size="11" font-weight="600">请求</text><path d="M3e2 158V105" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/><path d="M280 90q-80 30-178 75" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/><text x="190" y="135" fill="#ef4444" font-size="11" font-weight="600">请求</text><path d="M80 158V105" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/><g transform="translate(155, 200)"><rect width="70" height="22" rx="11" fill="#fee2e2" stroke="#ef4444"/><text x="35" y="15" text-anchor="middle" fill="#b91c1c" font-size="11" font-weight="700">存在环路</text></g><g transform="translate(230, 14)"><circle cx="6" cy="6" r="5" fill="#dbeafe" stroke="#3b82f6"/><text x="16" y="10" fill="#475569" font-size="10">进程</text><rect x="48" y="1" width="10" height="10" fill="#fef3c7" stroke="#f59e0b"/><text x="63" y="10" fill="#475569" font-size="10">资源</text><line x1="92" y1="6" x2="118" y2="6" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/><text x="125" y="10" fill="#475569" font-size="10">边</text></g></g><g transform="translate(20, 330)"><text fill="#1e293b" font-size="13" font-weight="700">检测步骤</text><g transform="translate(0, 14)"><circle cx="10" cy="10" r="9" fill="#eef2ff" stroke="#6366f1"/><text x="10" y="14" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">1</text><text x="28" y="14" fill="#334155" font-size="12">为请求/分配关系建立有向边</text></g><g transform="translate(0, 42)"><circle cx="10" cy="10" r="9" fill="#eef2ff" stroke="#6366f1"/><text x="10" y="14" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">2</text><text x="28" y="14" fill="#334155" font-size="12">对资源分配图执行 DFS / 简化</text></g><g transform="translate(0, 70)"><circle cx="10" cy="10" r="9" fill="#eef2ff" stroke="#6366f1"/><text x="10" y="14" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">3</text><text x="28" y="14" fill="#334155" font-size="12">若存在环 → 系统已死锁</text></g><g transform="translate(0, 98)"><circle cx="10" cy="10" r="9" fill="#eef2ff" stroke="#6366f1"/><text x="10" y="14" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">4</text><text x="28" y="14" fill="#334155" font-size="12">环中进程即为死锁进程</text></g></g><g transform="translate(20, 455)"><rect width="380" height="64" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="12" y="20" fill="#0f172a" font-size="11" font-weight="700">📌 小贴士</text><text x="12" y="38" fill="#475569" font-size="11">• 单实例资源：图中有环 ⇔ 死锁</text><text x="12" y="54" fill="#475569" font-size="11">• 多实例资源：有环只是必要条件，需进一步简化</text></g></g><g transform="translate(470, 80)"><rect width="400" height="540" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/><rect width="400" height="44" rx="14" fill="url(#recoverGrad)"/><rect y="30" width="400" height="14" fill="url(#recoverGrad)"/><text x="20" y="29" fill="#fff" font-size="16" font-weight="700">② 死锁解除 (Recovery)</text><text x="380" y="29" text-anchor="end" fill="#fff" font-size="13" opacity=".9">打破环路 · 恢复运行</text><text x="20" y="72" fill="#475569" font-size="13">检测到死锁后，需采取措施使系统脱离死锁状态</text><g transform="translate(20, 90)"><g><rect width="360" height="90" rx="10" fill="#f0fdf4" stroke="#86efac"/><rect width="6" height="90" rx="3" fill="#10b981"/><text x="20" y="26" fill="#065f46" font-size="14" font-weight="700">资源剥夺法</text><text x="20" y="48" fill="#334155" font-size="12">从某些死锁进程中强制抢占资源，</text><text x="20" y="66" fill="#334155" font-size="12">分配给其他死锁进程使其继续执行。</text><text x="20" y="82" fill="#64748b" font-size="11">⚠ 被剥夺进程可能进入饥饿状态</text></g><g transform="translate(0, 105)"><rect width="360" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/><rect width="6" height="90" rx="3" fill="#3b82f6"/><text x="20" y="26" fill="#1e40af" font-size="14" font-weight="700">撤销进程法</text><text x="20" y="48" fill="#334155" font-size="12">强制撤销部分（甚至全部）死锁进程，</text><text x="20" y="66" fill="#334155" font-size="12">释放其占有的全部资源。</text><text x="20" y="82" fill="#64748b" font-size="11">⚠ 实现简单，但代价较大</text></g><g transform="translate(0, 210)"><rect width="360" height="90" rx="10" fill="#fef3c7" stroke="#fcd34d"/><rect width="6" height="90" rx="3" fill="#f59e0b"/><text x="20" y="26" fill="#92400e" font-size="14" font-weight="700">进程回退法</text><text x="20" y="48" fill="#334155" font-size="12">让一个或多个死锁进程回退到</text><text x="20" y="66" fill="#334155" font-size="12">足以避开死锁的某个检查点。</text><text x="20" y="82" fill="#64748b" font-size="11">⚠ 需要保存历史信息，开销大</text></g></g><g transform="translate(20, 410)"><rect width="360" height="110" rx="10" fill="#faf5ff" stroke="#d8b4fe"/><text x="14" y="22" fill="#6b21a8" font-size="13" font-weight="700">🎯 选择「牺牲品」的准则</text><text x="14" y="44" fill="#334155" font-size="11.5">• 进程优先级</text><text x="14" y="62" fill="#334155" font-size="11.5">• 已运行时间 与 剩余完成时间</text><text x="14" y="80" fill="#334155" font-size="11.5">• 已占有资源数量 与 还需资源数量</text><text x="14" y="98" fill="#334155" font-size="11.5">• 进程类型（交互式 / 批处理）</text></g></g><g><path d="M450 355h20" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/></g></svg>