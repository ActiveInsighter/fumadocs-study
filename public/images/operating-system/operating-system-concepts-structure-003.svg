<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="800" height="500" fill="none"/><text x="400" y="30" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">宏内核 vs 微内核架构对比</text><g transform="translate(50, 70)"><text x="150" y="20" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">宏内核 (Monolithic Kernel)</text><rect x="0" y="40" width="300" height="60" fill="var(--neutral-soft)" stroke="var(--indigo-light)" stroke-width="2"/><text x="150" y="65" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">用户空间 (User Space)</text><text x="150" y="85" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">应用程序</text><line x1="0" y1="100" x2="300" y2="100" stroke="var(--orange-mid)" stroke-width="3" stroke-dasharray="5,5"/><text x="150" y="115" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" class="svg-text svg-text-on-light">系统调用接口</text><rect x="0" y="130" width="300" height="200" fill="var(--blue-mid)" stroke="var(--ink-soft)" stroke-width="2"/><text x="150" y="150" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">内核空间 (Kernel Space)</text><rect x="10" y="160" width="80" height="30" fill="var(--ink-soft)" stroke="var(--surface)" stroke-width="1"/><text x="50" y="178" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">进程管理</text><rect x="110" y="160" width="80" height="30" fill="var(--ink-soft)" stroke="var(--surface)" stroke-width="1"/><text x="150" y="178" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">内存管理</text><rect x="210" y="160" width="80" height="30" fill="var(--ink-soft)" stroke="var(--surface)" stroke-width="1"/><text x="250" y="178" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">文件系统</text><rect x="10" y="200" width="80" height="30" fill="var(--ink-soft)" stroke="var(--surface)" stroke-width="1"/><text x="50" y="218" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">设备驱动</text><rect x="110" y="200" width="80" height="30" fill="var(--ink-soft)" stroke="var(--surface)" stroke-width="1"/><text x="150" y="218" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">网络协议</text><rect x="210" y="200" width="80" height="30" fill="var(--ink-soft)" stroke="var(--surface)" stroke-width="1"/><text x="250" y="218" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">IPC</text><rect x="60" y="240" width="180" height="30" fill="var(--ink-soft)" stroke="var(--surface)" stroke-width="1"/><text x="150" y="258" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">其他系统服务</text><rect x="0" y="350" width="300" height="40" fill="var(--blue-ink)" stroke="var(--blue-ink)" stroke-width="2"/><text x="150" y="375" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">硬件层 (Hardware)</text></g><g transform="translate(450, 70)"><text x="150" y="20" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">微内核 (Microkernel)</text><rect x="0" y="40" width="300" height="120" fill="var(--neutral-soft)" stroke="var(--indigo-light)" stroke-width="2"/><text x="150" y="55" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">用户空间 (User Space)</text><rect x="10" y="65" width="280" height="25" fill="var(--neutral-mid)" stroke="var(--ink-soft)" stroke-width="1"/><text x="150" y="80" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">应用程序</text><rect x="10" y="100" width="65" height="25" fill="var(--sky-mid)" stroke="var(--surface)" stroke-width="1"/><text x="42" y="115" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">文件系统</text><rect x="85" y="100" width="65" height="25" fill="var(--sky-mid)" stroke="var(--surface)" stroke-width="1"/><text x="117" y="115" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">设备驱动</text><rect x="160" y="100" width="65" height="25" fill="var(--sky-mid)" stroke="var(--surface)" stroke-width="1"/><text x="192" y="115" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">网络服务</text><rect x="235" y="100" width="55" height="25" fill="var(--sky-mid)" stroke="var(--surface)" stroke-width="1"/><text x="262" y="115" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">其他服务</text><path d="M50 135q25 10 50 0" fill="none" stroke="var(--yellow-mid)" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M130 135q25 10 50 0" fill="none" stroke="var(--yellow-mid)" stroke-width="2" marker-end="url(#arrowhead)"/><text x="150" y="155" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">消息传递</text><line x1="0" y1="160" x2="300" y2="160" stroke="var(--orange-mid)" stroke-width="3" stroke-dasharray="5,5"/><text x="150" y="175" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" class="svg-text svg-text-on-light">系统调用接口</text><rect x="0" y="190" width="300" height="80" fill="var(--sky-mid)" stroke="var(--sky-mid)" stroke-width="2"/><text x="150" y="210" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">微内核 (Microkernel)</text><rect x="20" y="220" width="80" height="25" fill="var(--sky-mid)" stroke="var(--surface)" stroke-width="1"/><text x="60" y="235" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">进程管理</text><rect x="110" y="220" width="80" height="25" fill="var(--sky-mid)" stroke="var(--surface)" stroke-width="1"/><text x="150" y="235" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">内存管理</text><rect x="200" y="220" width="80" height="25" fill="var(--sky-mid)" stroke="var(--surface)" stroke-width="1"/><text x="240" y="235" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">IPC</text><rect x="0" y="290" width="300" height="40" fill="var(--blue-ink)" stroke="var(--blue-ink)" stroke-width="2"/><text x="150" y="315" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">硬件层 (Hardware)</text></g><g transform="translate(50, 420)"><rect x="0" y="0" width="700" height="60" fill="var(--surface)" stroke="var(--indigo-light)" stroke-width="1"/><rect x="0" y="0" width="100" height="20" fill="var(--blue-ink)"/><text x="50" y="14" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">对比项</text><rect x="100" y="0" width="200" height="20" fill="var(--blue-mid)"/><text x="200" y="14" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">宏内核</text><rect x="300" y="0" width="200" height="20" fill="var(--sky-mid)"/><text x="400" y="14" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">微内核</text><rect x="500" y="0" width="200" height="20" fill="var(--neutral-mid)"/><text x="600" y="14" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">示例系统</text><text x="50" y="34" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">性能</text><text x="200" y="34" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">高 (直接调用)</text><text x="400" y="34" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">中 (消息传递)</text><text x="600" y="34" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">Linux vs IOS</text><text x="50" y="53" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">稳定性</text><text x="200" y="53" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">中 (单点故障)</text><text x="400" y="53" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">高 (故障隔离)</text><text x="600" y="53" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">UNIX vs QNX</text><line x1="100" y1="0" x2="100" y2="60" stroke="var(--indigo-light)" stroke-width="1"/><line x1="300" y1="0" x2="300" y2="60" stroke="var(--indigo-light)" stroke-width="1"/><line x1="500" y1="0" x2="500" y2="60" stroke="var(--indigo-light)" stroke-width="1"/><line x1="0" y1="20" x2="700" y2="20" stroke="var(--indigo-light)" stroke-width="1"/><line x1="0" y1="40" x2="700" y2="40" stroke="var(--indigo-light)" stroke-width="1"/></g><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--yellow-mid)"/></marker></defs></svg>