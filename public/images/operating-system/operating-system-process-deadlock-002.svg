<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="800" height="600" fill="var(--paper)"/><rect x="0" y="0" width="800" height="50" fill="var(--violet-deep)"/><text x="400" y="32" text-anchor="middle" fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">死锁预防 (Deadlock Prevention)</text><g transform="translate(40, 80)"><rect x="0" y="0" width="340" height="120" fill="var(--blue-deep)" stroke="var(--blue-light)" stroke-width="2" rx="8"/><circle cx="25" cy="25" r="8" fill="var(--red-deep)"/><text x="40" y="32" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">1. 破坏互斥条件</text><text x="15" y="55" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--blue-deep)"><tspan x="15" dy="0">• 资源复制或虚拟化技术</tspan><tspan x="15" dy="18">• 减少资源的互斥使用</tspan><tspan x="15" dy="18">• 某些硬件资源难以避免互斥</tspan></text><g transform="translate(280, 15)"><rect x="0" y="0" width="20" height="15" fill="var(--violet-mid)" rx="2"/><rect x="25" y="0" width="20" height="15" fill="var(--violet-mid)" rx="2"/><line x1="20" y1="8" x2="25" y2="8" stroke="var(--green-mid)" stroke-width="2"/><text x="10" y="30" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">共享</text></g></g><g transform="translate(420, 80)"><rect x="0" y="0" width="340" height="120" fill="var(--blue-deep)" stroke="var(--blue-light)" stroke-width="2" rx="8"/><circle cx="25" cy="25" r="8" fill="var(--yellow-mid)"/><text x="40" y="32" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">2. 破坏占有并等待</text><text x="15" y="55" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--blue-deep)"><tspan x="15" dy="0">• 一次性申请所有所需资源</tspan><tspan x="15" dy="18">• 申请失败则释放已分配资源</tspan></text><g transform="translate(280, 15)"><rect x="5" y="5" width="12" height="12" fill="var(--yellow-mid)" rx="2"/><rect x="20" y="5" width="12" height="12" fill="var(--yellow-mid)" rx="2"/><rect x="35" y="5" width="12" height="12" fill="var(--yellow-mid)" rx="2"/><text x="26" y="30" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">一次性</text></g></g><g transform="translate(40, 230)"><rect x="0" y="0" width="340" height="120" fill="var(--blue-deep)" stroke="var(--blue-light)" stroke-width="2" rx="8"/><circle cx="25" cy="25" r="8" fill="var(--green-mid)"/><text x="40" y="32" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">3. 破坏非抢占</text><text x="15" y="55" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--blue-deep)"><tspan x="15" dy="0">• 允许进程抢占其他进程的资源</tspan><tspan x="15" dy="18">• 需要时可强制回收资源</tspan></text><g transform="translate(280, 15)"><rect x="0" y="0" width="15" height="15" fill="var(--blue-deep)" rx="2"/><rect x="20" y="0" width="15" height="15" fill="var(--green-mid)" rx="2"/><polygon points="15,8 25,3 25,13" fill="var(--red-deep)"/><text x="17" y="30" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">抢占</text></g></g><g transform="translate(420, 230)"><rect x="0" y="0" width="340" height="120" fill="var(--blue-deep)" stroke="var(--blue-light)" stroke-width="2" rx="8"/><circle cx="25" cy="25" r="8" fill="var(--purple-deep)"/><text x="40" y="32" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">4. 破坏循环等待</text><text x="15" y="55" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--blue-deep)"><tspan x="15" dy="0">• 对资源申请顺序进行限制</tspan><tspan x="15" dy="18">• 按固定顺序申请资源</tspan></text><g transform="translate(280, 15)"><circle cx="10" cy="8" r="6" fill="var(--purple-deep)"/><circle cx="25" cy="8" r="6" fill="var(--purple-deep)"/><circle cx="40" cy="8" r="6" fill="var(--purple-deep)"/><text x="10" y="12" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--surface)">1</text><text x="25" y="12" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--surface)">2</text><text x="40" y="12" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--surface)">3</text><text x="25" y="30" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">顺序</text></g></g><g transform="translate(40, 380)"><rect x="0" y="0" width="720" height="80" fill="var(--amber-soft)" stroke="var(--yellow-mid)" stroke-width="2" rx="8"/><circle cx="25" cy="25" r="10" fill="var(--yellow-mid)"/><text x="25" y="31" text-anchor="middle" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">!</text><text x="45" y="32" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-deep)">核心思想</text><text x="45" y="55" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" fill="var(--orange-deep)">通过破坏死锁产生的四个必要条件中的至少一个，从根本上避免死锁的发生</text></g><g transform="translate(40, 480)"><rect x="0" y="0" width="350" height="100" fill="var(--green-soft)" stroke="var(--lime-mid)" stroke-width="2" rx="8"/><text x="15" y="25" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--green-deep)">优点</text><text x="15" y="45" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--green-deep)"><tspan x="15" dy="0">• 彻底避免死锁</tspan><tspan x="15" dy="16">• 实现相对简单</tspan><tspan x="15" dy="16">• 易于理解和验证</tspan></text></g><g transform="translate(410, 480)"><rect x="0" y="0" width="350" height="100" fill="var(--red-soft)" stroke="var(--red-deep)" stroke-width="2" rx="8"/><text x="15" y="25" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">缺点</text><text x="15" y="45" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" fill="var(--red-deep)"><tspan x="15" dy="0">• 资源利用率低</tspan><tspan x="15" dy="16">• 限制并发度</tspan><tspan x="15" dy="16">• 可能导致饥饿</tspan></text></g></svg>