<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="var(--svg-font-family)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--sky-deep)"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red-deep)"/></marker><linearGradient id="gStep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--surface)"/><stop offset="1" stop-color="var(--sky-soft)"/></linearGradient><linearGradient id="gDev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--amber-light)"/><stop offset="1" stop-color="var(--yellow-mid)"/></linearGradient><linearGradient id="gCPU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--green-light)"/><stop offset="1" stop-color="var(--green-mid)"/></linearGradient><style>.h1{fill:var(--violet-deep);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold)}.sub{fill:var(--sky-deep);font-size: var(--svg-font-size-label)}.lane{fill:var(--sky-ink);font-size: var(--svg-font-size-label);font-weight: var(--svg-font-weight-semibold)}.step-t{fill:var(--violet-deep);font-size: var(--svg-font-size-label);font-weight: var(--svg-font-weight-semibold)}.step-d{fill:var(--sky-ink);font-size: var(--svg-font-size-caption)}.tag{fill:var(--red-deep);font-size: var(--svg-font-size-caption);font-weight: var(--svg-font-weight-semibold)}</style></defs><text x="430" y="28" text-anchor="middle" class="h1">中断处理程序大致流程</text><text x="430" y="48" text-anchor="middle" class="sub">硬件触发 → 保存现场 → 快速处理 → 恢复现场 → 回到原任务</text><rect x="30" y="70" width="800" height="70" rx="6" fill="var(--yellow-soft)" stroke="var(--orange-mid)" stroke-dasharray="4 3"/><text x="42" y="86" class="lane">设备 / 硬件</text><rect x="30" y="150" width="800" height="180" rx="6" fill="var(--green-soft)" stroke="var(--lime-mid)" stroke-dasharray="4 3"/><text x="42" y="166" class="lane">CPU / 中断处理程序（内核态，高优先级、代码精简）</text><rect x="30" y="340" width="800" height="60" rx="6" fill="var(--neutral-soft)" stroke="var(--sky-deep)" stroke-dasharray="4 3"/><text x="42" y="358" class="lane">用户/上层软件</text><rect x="60" y="90" width="170" height="40" rx="8" fill="url(#gDev)" stroke="var(--coral-deep)"/><text x="145" y="107" text-anchor="middle" class="step-t">① 设备事件发生</text><text x="145" y="123" text-anchor="middle" class="step-d">数据到达 / 完成 / 出错</text><path d="M145 132v48" stroke="var(--red-deep)" stroke-width="1.8" marker-end="url(#ar)"/><text x="152" y="148" class="tag">中断信号</text><g><rect x="60" y="185" width="170" height="60" rx="8" fill="url(#gStep)" stroke="var(--violet-mid)"/><text x="145" y="205" text-anchor="middle" class="step-t">② 响应中断</text><text x="145" y="222" text-anchor="middle" class="step-d">暂停当前任务</text><text x="145" y="237" text-anchor="middle" class="step-d">切换到内核态</text></g><g><rect x="248" y="185" width="170" height="60" rx="8" fill="url(#gStep)" stroke="var(--violet-mid)"/><text x="333" y="205" text-anchor="middle" class="step-t">③ 保存现场</text><text x="333" y="222" text-anchor="middle" class="step-d">PC、寄存器、状态字</text><text x="333" y="237" text-anchor="middle" class="step-d">压栈保存</text></g><g><rect x="436" y="185" width="180" height="60" rx="8" fill="url(#gStep)" stroke="var(--violet-mid)"/><text x="526" y="205" text-anchor="middle" class="step-t">④ 识别中断源 / 分发</text><text x="526" y="222" text-anchor="middle" class="step-d">查中断向量表</text><text x="526" y="237" text-anchor="middle" class="step-d">跳转到对应处理例程</text></g><g><rect x="634" y="185" width="170" height="60" rx="8" fill="url(#gCPU)" stroke="var(--lime-deep)"/><text x="719" y="205" text-anchor="middle" class="step-t">⑤ 执行中断服务</text><text x="719" y="222" text-anchor="middle" class="step-d">读写设备寄存器</text><text x="719" y="237" text-anchor="middle" class="step-d">搬运数据、置状态</text></g><g><rect x="436" y="260" width="180" height="60" rx="8" fill="url(#gStep)" stroke="var(--violet-mid)"/><text x="526" y="280" text-anchor="middle" class="step-t">⑥ 唤醒/通知上层</text><text x="526" y="297" text-anchor="middle" class="step-d">唤醒等待进程</text><text x="526" y="312" text-anchor="middle" class="step-d">通知驱动/协议栈</text></g><g><rect x="248" y="260" width="170" height="60" rx="8" fill="url(#gStep)" stroke="var(--violet-mid)"/><text x="333" y="280" text-anchor="middle" class="step-t">⑦ 恢复现场</text><text x="333" y="297" text-anchor="middle" class="step-d">从栈中弹出寄存器</text><text x="333" y="312" text-anchor="middle" class="step-d">还原 PC / 状态字</text></g><g><rect x="60" y="260" width="170" height="60" rx="8" fill="url(#gStep)" stroke="var(--violet-mid)"/><text x="145" y="280" text-anchor="middle" class="step-t">⑧ 中断返回</text><text x="145" y="297" text-anchor="middle" class="step-d">iret：回用户态</text><text x="145" y="312" text-anchor="middle" class="step-d">继续原任务</text></g><line x1="230" y1="215" x2="248" y2="215" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><line x1="418" y1="215" x2="436" y2="215" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><line x1="616" y1="215" x2="634" y2="215" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><path d="M719 245v45H616" fill="none" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><line x1="436" y1="290" x2="418" y2="290" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><line x1="248" y1="290" x2="230" y2="290" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><path d="M145 320v40" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><rect x="60" y="360" width="170" height="30" rx="6" fill="var(--surface)" stroke="var(--sky-deep)"/><text x="145" y="380" text-anchor="middle" class="step-d">原用户任务继续执行</text><rect x="260" y="352" width="560" height="40" rx="6" fill="var(--yellow-soft)" stroke="var(--yellow-mid)"/><text x="272" y="370" class="step-t">要点</text><text x="272" y="386" class="step-d">运行在内核态 · 极高优先级 · 代码尽量精简 · 关中断保护关键区 · 完成后开中断并返回</text></svg>