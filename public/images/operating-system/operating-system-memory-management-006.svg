50" y="22" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">A4</text><rect x="170" y="0" width="40" height="35" fill="var(--blue-light)" stroke="var(--violet-deep)" stroke-width="2"/><text x="190" y="22" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">B2</text><rect x="220" y="0" width="40" height="35" fill="var(--green-light)" stroke="var(--mint-deep)" stroke-width="2"/><text x="240" y="22" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">C1</text><text x="60" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">不受影响</text><text x="150" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">B1被A4置换</text><text x="215" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">B2</text><text x="240" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">C1</text></g><g transform="translate(460, 260)"><rect x="0" y="0" width="260" height="20" fill="none" stroke="var(--purple-deep)" stroke-width="2" stroke-dasharray="5,5"/><text x="130" y="35" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">全局选择范围 - 可以选择任何进程的页面</text></g><rect x="460" y="305" width="280" height="50" fill="var(--violet-soft)" stroke="var(--violet-light)" stroke-width="1" rx="5"/><text x="470" y="325" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">• 可在整个系统内存中选择置换</text><text x="470" y="340" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">• 一个进程的缺页可能影响其他进程</text></g><g transform="translate(50, 380)"><rect x="0" y="0" width="700" height="120" fill="var(--surface)" stroke="var(--blue-light)" stroke-width="2" rx="10"/><text x="350" y="25" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">策略对比</text><g transform="translate(20, 40)"><text x="0" y="0" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">局部置换:</text><text x="0" y="18" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">✓ 进程间相互独立，不会互相干扰</text><text x="0" y="32" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">✓ 每个进程的性能相对稳定</text><text x="0" y="46" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">✗ 可能导致内存利用率较低</text><text x="0" y="60" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">✗ 无法充分利用全局最优策略</text></g><g transform="translate(360, 40)"><text x="0" y="0" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">全局置换:</text><text x="0" y="18" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">✓ 系统整体内存利用率更高</text><text x="0" y="32" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">✓ 可以实现全局最优的置换策略</text><text x="0" y="46" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">✗ 进程间会相互影响</text><text x="0" y="60" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">✗ 可能导致某些进程性能不稳定</text></g></g><rect x="50" y="520" width="700" height="35" fill="var(--paper)" stroke="var(--blue-light)" stroke-width="1" rx="5"/><text x="60" y="540" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">总结: 局部置换保证进程独立性，全局置换提高系统整体效率</text></svg>