ze="var(--svg-font-size-caption)" fill="var(--mint-deep)">C1</text><text x="20" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">A1被A4置换</text><text x="180" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">不受影响</text><text x="240" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">不受影响</text></g><rect x="60" y="265" width="280" height="50" fill="var(--paper)" stroke="var(--red-light)" stroke-width="1" rx="5"/><text x="70" y="285" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">• 只在进程自身页面内选择置换</text><text x="70" y="300" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">• 不影响其他进程的内存页面</text></g><line x1="400" y1="50" x2="400" y2="550" stroke="var(--blue-soft)" stroke-width="2"/><g><rect x="450" y="50" width="300" height="30" fill="var(--purple-deep)" rx="5"/><text x="600" y="70" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--surface)">全局置换 (Global Replacement)</text><text x="460" y="105" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">初始状态 - 物理内存</text><g transform="translate(460, 110)"><rect x="0" y="0" width="40" height="35" fill="var(--red-light)" stroke="var(--red-deep)" stroke-width="2"/><text x="20" y="22" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">A1</text><rect x="40" y="0" width="40" height="35" fill="var(--red-light)" stroke="var(--red-deep)" stroke-width="2"/><text x="60" y="22" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">A2</text><rect x="80" y="0" width="40" height="35" fill="var(--red-light)" stroke="var(--red-deep)" stroke-width="2"/><text x="100" y="22" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">A3</text><rect x="130" y="0" width="40" height="35" fi