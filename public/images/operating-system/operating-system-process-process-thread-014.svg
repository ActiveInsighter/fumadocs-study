<svg font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arr6" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"></path></marker></defs><style>.title{font-weight: var(--svg-font-weight-bold);font-size: var(--svg-font-size-body)}.proc{fill:var(--sky-light);stroke:var(--violet-deep)}.kern{fill:var(--amber-light);stroke:var(--orange-mid)}.pipe{fill:var(--green-light);stroke:var(--lime-deep)}.shm{fill:var(--rose-light);stroke:var(--rose-deep)}.mq{fill:var(--violet-light);stroke:var(--purple-deep)}.sig{fill:var(--coral-light);stroke:var(--coral-deep)}.sock{fill:var(--teal-light);stroke:var(--mint-deep)}.small{font-size: var(--svg-font-size-caption);fill:var(--neutral-ink)}</style><text class="title" text-anchor="middle" x="490" y="24">五类进程间通信（IPC）对比</text><line stroke="var(--neutral-mid)" stroke-dasharray="4,3" x1="350" x2="350" y1="40" y2="175"></line><line stroke="var(--neutral-mid)" stroke-dasharray="4,3" x1="690" x2="690" y1="40" y2="175"></line><line stroke="var(--neutral-mid)" stroke-dasharray="4,3" x1="350" x2="350" y1="190" y2="325"></line><line stroke="var(--neutral-mid)" stroke-dasharray="4,3" x1="690" x2="690" y1="190" y2="325"></line><line stroke="var(--neutral-mid)" stroke-dasharray="4,3" x1="20" x2="960" y1="185" y2="185"></line><g transform="translate(20,50)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="160" y="14">① 管道 / FIFO</text><rect class="proc" height="40" rx="4" width="80" x="0" y="30"></rect><text text-anchor="middle" x="40" y="55">P1</text><rect class="proc" height="40" rx="4" width="80" x="240" y="30"></rect><text text-anchor="middle" x="280" y="55">P2</text><rect class="pipe" height="28" rx="4" width="120" x="100" y="36"></rect><text class="small" text-anchor="middle" x="160" y="55">字节流（内核缓冲）</text><path d="M80 50h20" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><path d="M220 50h20" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><text class="small" text-anchor="middle" x="160" y="92">单向、FIFO、亲缘关系（FIFO 不需要）</text><text class="small" text-anchor="middle" x="160" y="108">效率较低，适合简单流</text></g><g transform="translate(360,50)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="160" y="14">② 共享内存</text><rect class="proc" height="40" rx="4" width="80" x="0" y="30"></rect><text text-anchor="middle" x="40" y="55">P1</text><rect class="proc" height="40" rx="4" width="80" x="240" y="30"></rect><text text-anchor="middle" x="280" y="55">P2</text><rect class="shm" height="32" rx="4" width="120" x="100" y="34"></rect><text class="small" text-anchor="middle" x="160" y="55">同一物理内存段</text><path d="M80 50h20" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><path d="M240 50H220" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><text class="small" text-anchor="middle" x="160" y="92">效率最高、零拷贝</text><text class="small" text-anchor="middle" x="160" y="108">需配合信号量/锁防竞争</text></g><g transform="translate(700,50)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="140" y="14">③ 消息队列</text><rect class="proc" height="40" rx="4" width="70" x="0" y="30"></rect><text text-anchor="middle" x="35" y="55">P1</text><rect class="proc" height="40" rx="4" width="70" x="210" y="30"></rect><text text-anchor="middle" x="245" y="55">P2</text><rect class="mq" height="32" rx="4" width="110" x="85" y="34"></rect><text class="small" text-anchor="middle" x="140" y="46">[msg|msg|msg]</text><text class="small" text-anchor="middle" x="140" y="62">内核队列</text><path d="M70 50H85" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><path d="M195 50h15" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><text class="small" text-anchor="middle" x="140" y="92">按消息单元，有类型/优先级</text><text class="small" text-anchor="middle" x="140" y="108">结构化、独立性强</text></g><g transform="translate(20,200)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="160" y="14">④ 信号 (Signal)</text><rect class="proc" height="40" rx="4" width="80" x="0" y="30"></rect><text text-anchor="middle" x="40" y="55">P1</text><rect class="proc" height="40" rx="4" width="80" x="240" y="30"></rect><text text-anchor="middle" x="280" y="55">P2</text><rect class="sig" height="28" rx="4" width="120" x="100" y="36"></rect><text class="small" text-anchor="middle" x="160" y="55">SIGINT / SIGUSR1 ...</text><path d="M80 50h20" marker-end="url(#arr6)" stroke="var(--coral-deep)"></path><path d="M220 50h20" marker-end="url(#arr6)" stroke="var(--coral-deep)"></path><text class="small" text-anchor="middle" x="160" y="92">异步通知，无数据载荷</text><text class="small" text-anchor="middle" x="160" y="108">用于事件、异常、终止</text></g><g transform="translate(360,200)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="160" y="14">⑤ 套接字 (Socket)</text><rect class="proc" height="40" rx="4" width="80" x="0" y="30"></rect><text text-anchor="middle" x="40" y="55">P1</text><rect class="proc" height="40" rx="4" width="80" x="240" y="30"></rect><text text-anchor="middle" x="280" y="55">P2</text><rect class="sock" height="28" rx="4" width="120" x="100" y="36"></rect><text class="small" text-anchor="middle" x="160" y="55">网络协议栈</text><path d="M80 50h20" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><path d="M240 50H220" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><text class="small" text-anchor="middle" x="160" y="92">本机或跨机器双向通信</text><text class="small" text-anchor="middle" x="160" y="108">分布式系统常用</text></g><g transform="translate(700,200)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="140" y="14">⑥ 信号量 (Semaphore)</text><rect class="proc" height="40" rx="4" width="70" x="0" y="30"></rect><text text-anchor="middle" x="35" y="55">P1</text><rect class="proc" height="40" rx="4" width="70" x="210" y="30"></rect><text text-anchor="middle" x="245" y="55">P2</text><rect class="kern" height="28" rx="4" width="110" x="85" y="36"></rect><text class="small" text-anchor="middle" x="140" y="56">count = N (内核维护)</text><path d="M70 50H85" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><path d="M210 50H195" marker-end="url(#arr6)" stroke="var(--neutral-ink)"></path><text class="small" text-anchor="middle" x="140" y="92">不传数据，做同步/互斥</text><text class="small" text-anchor="middle" x="140" y="108">P/V 操作维护计数</text></g><g transform="translate(20,350)"><text font-weight="var(--svg-font-weight-bold)" x="0" y="0">关键属性对比</text><rect fill="var(--surface)" height="150" stroke="var(--neutral-mid)" width="940" x="0" y="10"></rect><line stroke="var(--neutral-mid)" x1="0" x2="940" y1="40" y2="40"></line><line stroke="var(--neutral-mid)" x1="100" x2="100" y1="10" y2="160"></line><line stroke="var(--neutral-mid)" x1="240" x2="240" y1="10" y2="160"></line><line stroke="var(--neutral-mid)" x1="380" x2="380" y1="10" y2="160"></line><line stroke="var(--neutral-mid)" x1="520" x2="520" y1="10" y2="160"></line><line stroke="var(--neutral-mid)" x1="660" x2="660" y1="10" y2="160"></line><line stroke="var(--neutral-mid)" x1="800" x2="800" y1="10" y2="160"></line><line stroke="var(--neutral-mid)" x1="0" x2="940" y1="70" y2="70"></line><line stroke="var(--neutral-mid)" x1="0" x2="940" y1="100" y2="100"></line><line stroke="var(--neutral-mid)" x1="0" x2="940" y1="130" y2="130"></line><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="50" y="30">属性</text><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="170" y="30">管道</text><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="310" y="30">共享内存</text><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="450" y="30">消息队列</text><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="590" y="30">信号</text><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="730" y="30">套接字</text><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="870" y="30">信号量</text><text text-anchor="middle" x="50" y="60">数据载荷</text><text text-anchor="middle" x="170" y="60">字节流</text><text text-anchor="middle" x="310" y="60">任意结构</text><text text-anchor="middle" x="450" y="60">消息</text><text text-anchor="middle" x="590" y="60">无</text><text text-anchor="middle" x="730" y="60">字节流/包</text><text text-anchor="middle" x="870" y="60">无</text><text text-anchor="middle" x="50" y="90">效率</text><text text-anchor="middle" x="170" y="90">较低</text><text fill="var(--lime-deep)" text-anchor="middle" x="310" y="90">最高</text><text text-anchor="middle" x="450" y="90">中</text><text text-anchor="middle" x="590" y="90">高(无数据)</text><text text-anchor="middle" x="730" y="90">中</text><text text-anchor="middle" x="870" y="90">高</text><text text-anchor="middle" x="50" y="120">方向</text><text text-anchor="middle" x="170" y="120">单向</text><text text-anchor="middle" x="310" y="120">双向</text><text text-anchor="middle" x="450" y="120">双向</text><text text-anchor="middle" x="590" y="120">单向</text><text text-anchor="middle" x="730" y="120">双向</text><text text-anchor="middle" x="870" y="120">-</text><text text-anchor="middle" x="50" y="150">同步需求</text><text text-anchor="middle" x="170" y="150">内核保证</text><text fill="var(--red-deep)" text-anchor="middle" x="310" y="150">需用户同步</text><text text-anchor="middle" x="450" y="150">内核保证</text><text text-anchor="middle" x="590" y="150">异步</text><text text-anchor="middle" x="730" y="150">内核保证</text><text text-anchor="middle" x="870" y="150">本身就是同步</text></g></svg>