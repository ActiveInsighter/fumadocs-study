<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" preserveAspectRatio="xMidYMid meet" style="font-family:var(--svg-font-family);color:var(--ink);max-width:100%;height:auto">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--neutral-deep)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="520" fill="var(--surface)"/>
  <text x="490" y="34" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--ink)">请求分页中的页框分配策略</text>
  <text x="490" y="58" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--ink-soft)">固定分配：页框数量保持不变；可变分配：页框数量可随运行情况调整</text>

  <g>
    <rect x="40" y="86" width="420" height="330" rx="14" fill="var(--paper)" stroke="var(--indigo-mid)"/>
    <rect x="40" y="86" width="420" height="52" rx="14" fill="var(--indigo-light)" stroke="var(--indigo-mid)"/>
    <text x="250" y="118" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-semibold)" fill="var(--indigo-ink)">固定分配（Fixed Allocation）</text>

    <text x="70" y="170" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-medium)" fill="var(--ink)">时刻 t₀：进程 A 分得 3 个页框</text>
    <g transform="translate(70 188)">
      <rect x="0" y="0" width="92" height="48" fill="var(--sky-soft)" stroke="var(--sky-deep)"/>
      <rect x="92" y="0" width="92" height="48" fill="var(--mint-soft)" stroke="var(--mint-deep)"/>
      <rect x="184" y="0" width="92" height="48" fill="var(--amber-soft)" stroke="var(--amber-deep)"/>
      <text x="46" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-ink)">页 A1</text>
      <text x="138" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--mint-ink)">页 A2</text>
      <text x="230" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--amber-ink)">页 A3</text>
    </g>

    <path d="M208 250 V282" stroke="var(--neutral-deep)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="228" y="272" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">发生缺页并置换</text>

    <text x="70" y="318" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-medium)" fill="var(--ink)">时刻 t₁：内容可变化，但仍是 3 个页框</text>
    <g transform="translate(70 336)">
      <rect x="0" y="0" width="92" height="48" fill="var(--sky-soft)" stroke="var(--sky-deep)"/>
      <rect x="92" y="0" width="92" height="48" fill="var(--rose-soft)" stroke="var(--rose-deep)"/>
      <rect x="184" y="0" width="92" height="48" fill="var(--green-soft)" stroke="var(--green-deep)"/>
      <text x="46" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-ink)">页 A2</text>
      <text x="138" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--rose-ink)">页 A4</text>
      <text x="230" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--green-ink)">页 A5</text>
    </g>
    <text x="378" y="366" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--indigo-deep)">页框数 = 3（不变）</text>
  </g>

  <g>
    <rect x="520" y="86" width="420" height="330" rx="14" fill="var(--paper)" stroke="var(--green-mid)"/>
    <rect x="520" y="86" width="420" height="52" rx="14" fill="var(--green-light)" stroke="var(--green-mid)"/>
    <text x="730" y="118" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-semibold)" fill="var(--green-ink)">可变分配（Variable Allocation）</text>

    <text x="550" y="170" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-medium)" fill="var(--ink)">时刻 t₀：进程 B 当前分得 2 个页框</text>
    <g transform="translate(550 188)">
      <rect x="0" y="0" width="92" height="48" fill="var(--sky-soft)" stroke="var(--sky-deep)"/>
      <rect x="92" y="0" width="92" height="48" fill="var(--amber-soft)" stroke="var(--amber-deep)"/>
      <text x="46" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-ink)">页 B1</text>
      <text x="138" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--amber-ink)">页 B2</text>
    </g>
    <text x="800" y="216" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">缺页率偏高</text>

    <path d="M690 250 V282" stroke="var(--neutral-deep)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="708" y="272" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">动态增加页框</text>

    <text x="550" y="318" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-medium)" fill="var(--ink)">时刻 t₁：进程 B 调整为 4 个页框</text>
    <g transform="translate(550 336)">
      <rect x="0" y="0" width="78" height="48" fill="var(--sky-soft)" stroke="var(--sky-deep)"/>
      <rect x="78" y="0" width="78" height="48" fill="var(--amber-soft)" stroke="var(--amber-deep)"/>
      <rect x="156" y="0" width="78" height="48" fill="var(--mint-soft)" stroke="var(--mint-deep)"/>
      <rect x="234" y="0" width="78" height="48" fill="var(--violet-soft)" stroke="var(--violet-deep)"/>
      <text x="39" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-ink)">页 B1</text>
      <text x="117" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--amber-ink)">页 B2</text>
      <text x="195" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--mint-ink)">页 B3</text>
      <text x="273" y="30" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--violet-ink)">页 B4</text>
    </g>
    <text x="890" y="366" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--green-deep)">2 → 4</text>
  </g>

  <rect x="40" y="442" width="900" height="52" rx="10" fill="var(--paper-alt)" stroke="var(--line)"/>
  <text x="490" y="464" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)" fill="var(--ink)">易混淆点</text>
  <text x="490" y="484" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">这里讨论的是“进程拥有多少个页框”，不是连续内存管理中的固定分区 / 动态分区。</text>
</svg>
