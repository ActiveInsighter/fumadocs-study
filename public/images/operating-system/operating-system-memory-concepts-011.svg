<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1e3 950" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><style>.title{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);fill:var(--blue-ink)}.subtitle{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);fill:var(--blue-ink)}.label{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);fill:var(--blue-ink)}.small-label{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);fill:var(--neutral-deep)}.free-block{fill:var(--green-soft);stroke:var(--lime-mid);stroke-width:2}.allocated-block{fill:var(--rose-soft);stroke:var(--red-deep);stroke-width:2}.arrow{fill:none;stroke:var(--neutral-deep);stroke-width:2;marker-end:url(#arrowhead)}.code{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-title);fill:var(--red-deep)}</style><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="var(--neutral-deep)"/></marker></defs><text x="500" y="35" class="title" text-anchor="middle">进程堆内存分配与释放过程</text><g id="stage1"><text x="50" y="85" class="subtitle">1. 初始状态（空闲堆空间）</text><rect x="50" y="110" width="600" height="90" class="free-block" rx="4"/><text x="350" y="160" class="label" text-anchor="middle">空闲块（600 KB）</text><text x="50" y="215" class="small-label">0x1000</text><text x="630" y="215" class="small-label" text-anchor="end">0x1258</text></g><g id="stage2"><text x="50" y="265" class="subtitle">2. malloc(200KB) - 首次适应分配</text><text x="700" y="295" class="code">p1 = malloc(200*1024)</text><rect x="50" y="290" width="200" height="90" class="allocated-block" rx="4"/><text x="150" y="335" class="label" text-anchor="middle">已分配</text><text x="150" y="360" class="small-label" text-anchor="middle">200 KB (p1)</text><rect x="250" y="290" width="400" height="90" class="free-block" rx="4"/><text x="450" y="340" class="label" text-anchor="middle">空闲块（400 KB）</text><text x="50" y="395" class="small-label">0x1000</text><text x="250" y="395" class="small-label">0x1064</text><text x="630" y="395" class="small-label" text-anchor="end">0x1258</text></g><g id="stage3"><text x="50" y="445" class="subtitle">3. malloc(150KB) - 继续分配</text><text x="700" y="475" class="code">p2 = malloc(150*1024)</text><rect x="50" y="470" width="200" height="90" class="allocated-block" rx="4"/><text x="150" y="515" class="small-label" text-anchor="middle">200 KB (p1)</text><rect x="250" y="470" width="150" height="90" class="allocated-block" rx="4"/><text x="325" y="515" class="small-label" text-anchor="middle">150 KB (p2)</text><rect x="400" y="470" width="250" height="90" class="free-block" rx="4"/><text x="525" y="520" class="label" text-anchor="middle">空闲块（250 KB）</text><text x="50" y="575" class="small-label">0x1000</text><text x="250" y="575" class="small-label">0x1064</text><text x="400" y="575" class="small-label">0x10C8</text><text x="630" y="575" class="small-label" text-anchor="end">0x1258</text></g><g id="stage4"><text x="50" y="625" class="subtitle">4. free(p1) - 释放第一块内存</text><text x="700" y="655" class="code">free(p1)</text><rect x="50" y="650" width="200" height="90" class="free-block" rx="4"/><text x="150" y="695" class="small-label" text-anchor="middle">空闲块（200 KB）</text><rect x="250" y="650" width="150" height="90" class="allocated-block" rx="4"/><text x="325" y="695" class="small-label" text-anchor="middle">150 KB (p2)</text><rect x="400" y="650" width="250" height="90" class="free-block" rx="4"/><text x="525" y="700" class="label" text-anchor="middle">空闲块（250 KB）</text><text x="50" y="755" class="small-label">0x1000</text><text x="250" y="755" class="small-label">0x1064</text><text x="400" y="755" class="small-label">0x10C8</text></g><g id="stage5"><text x="50" y="805" class="subtitle">5. free(p2) - 释放并合并相邻空闲块</text><text x="700" y="835" class="code">free(p2)</text><rect x="50" y="830" width="600" height="90" class="free-block" rx="4"/><text x="350" y="870" class="label" text-anchor="middle">空闲块（600 KB）- 已合并</text><text x="350" y="895" class="small-label" text-anchor="middle">减少内存碎片</text><text x="50" y="935" class="small-label">0x1000</text><text x="630" y="935" class="small-label" text-anchor="end">0x1258</text></g><g id="legend" transform="translate(700, 100)"><text x="0" y="0" class="label" font-weight="var(--svg-font-weight-bold)">图例：</text><rect x="0" y="15" width="45" height="30" class="free-block" rx="2"/><text x="55" y="35" class="small-label">空闲块</text><rect x="0" y="60" width="45" height="30" class="allocated-block" rx="2"/><text x="55" y="80" class="small-label">已分配块</text></g></svg>