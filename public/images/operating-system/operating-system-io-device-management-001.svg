<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdff"/><stop offset="100%" stop-color="#f3f5fb"/></linearGradient><linearGradient id="producerGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a65"/><stop offset="100%" stop-color="#ef5350"/></linearGradient><linearGradient id="consumerGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fc3f7"/><stop offset="100%" stop-color="#1e88e5"/></linearGradient><linearGradient id="bufferGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffde7"/><stop offset="100%" stop-color="#fff59d"/></linearGradient><linearGradient id="cellFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5d6a7"/><stop offset="100%" stop-color="#66bb6a"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#455a64"/></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="760" height="380" fill="url(#bgGrad)"/><text x="380" y="38" text-anchor="middle" font-size="20" font-weight="600" fill="#263238">缓冲区：解耦快慢两端，平滑数据流</text><g filter="url(#soft)"><rect x="40" y="140" width="140" height="100" rx="14" fill="url(#producerGrad)"/></g><text x="110" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">生产者</text><text x="110" y="202" text-anchor="middle" font-size="12" fill="#fff" opacity=".95">CPU / 进程</text><text x="110" y="220" text-anchor="middle" font-size="11" fill="#fff" opacity=".85">速度快 · 突发</text><g filter="url(#soft)"><rect x="240" y="110" width="280" height="160" rx="16" fill="url(#bufferGrad)" stroke="#fbc02d" stroke-width="1.5"/></g><text x="380" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#5d4037">缓冲区 (内存中)</text><g><rect x="262" y="158" width="40" height="48" rx="6" fill="url(#cellFill)"/><rect x="308" y="158" width="40" height="48" rx="6" fill="url(#cellFill)"/><rect x="354" y="158" width="40" height="48" rx="6" fill="url(#cellFill)"/><rect x="400" y="158" width="40" height="48" rx="6" fill="#e0e0e0" stroke="#bdbdbd" stroke-dasharray="3 3"/><rect x="446" y="158" width="40" height="48" rx="6" fill="#e0e0e0" stroke="#bdbdbd" stroke-dasharray="3 3"/></g><text x="282" y="188" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">D1</text><text x="328" y="188" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">D2</text><text x="374" y="188" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">D3</text><text x="420" y="188" text-anchor="middle" font-size="13" fill="#9e9e9e">空</text><text x="466" y="188" text-anchor="middle" font-size="13" fill="#9e9e9e">空</text><text x="380" y="234" text-anchor="middle" font-size="11" fill="#6d4c41">先进先出 · 临时存储</text><text x="380" y="252" text-anchor="middle" font-size="11" fill="#6d4c41">写入端 → 读取端</text><g filter="url(#soft)"><rect x="580" y="140" width="140" height="100" rx="14" fill="url(#consumerGrad)"/></g><text x="650" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">消费者</text><text x="650" y="202" text-anchor="middle" font-size="12" fill="#fff" opacity=".95">I/O 设备</text><text x="650" y="220" text-anchor="middle" font-size="11" fill="#fff" opacity=".85">速度慢 · 平稳</text><path d="M182 190h53" stroke="#455a64" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M525 190h53" stroke="#455a64" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="208" y="180" text-anchor="middle" font-size="11" fill="#37474f">写入</text><text x="551" y="180" text-anchor="middle" font-size="11" fill="#37474f">读取</text><g font-size="12" fill="#37474f"><circle cx="120" cy="310" r="6" fill="#66bb6a"/><text x="135" y="314">CPU 无需等待慢设备</text><circle cx="320" cy="310" r="6" fill="#66bb6a"/><text x="335" y="314">削峰填谷，匹配速度差</text><circle cx="540" cy="310" r="6" fill="#66bb6a"/><text x="555" y="314">减少 I/O 中断频率</text></g><text x="380" y="358" text-anchor="middle" font-size="11" fill="#90a4ae">一块预留在内存中的临时存放区，让 I/O 与计算并行推进</text></svg>