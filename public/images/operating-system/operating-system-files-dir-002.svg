<svg font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arr4" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"></path></marker></defs><style>.title{font-weight: var(--svg-font-weight-bold);font-size: var(--svg-font-size-body)}.dir{fill:var(--yellow-soft);stroke:var(--yellow-mid)}.inode{fill:var(--sky-soft);stroke:var(--violet-deep)}.data{fill:var(--green-light);stroke:var(--lime-deep)}.small{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}.mono{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-caption)}</style><text class="title" text-anchor="middle" x="490" y="24">路径解析过程：从 /home/alice/a.txt 找到文件内容</text><rect fill="var(--neutral-soft)" height="34" rx="4" stroke="var(--blue-mid)" width="940" x="20" y="44"></rect><text class="mono" x="40" y="66">解析路径： / → home → alice → a.txt</text><text class="small" x="540" y="66">每一步：读取“目录文件” → 在其中查找名字 → 取出 inode 号 → 读 inode</text><g transform="translate(20,100)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="0">① 根目录 /</text><text class="small" text-anchor="middle" x="110" y="18">inode 号 = 2 (约定)</text><rect class="dir" height="110" rx="4" width="220" x="0" y="30"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="50">目录文件 “/”</text><text class="mono" x="10" y="72">. → inode 2</text><text class="mono" x="10" y="90">.. → inode 2</text><text class="mono" x="10" y="108">home/ → inode 18</text><text class="mono" x="10" y="126">etc/ → inode 19</text><rect class="inode" height="70" rx="4" width="220" x="0" y="160"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="180">inode #2</text><text class="mono" x="10" y="200">type=dir, perm=...</text><text class="mono" x="10" y="218">block_ptr → 目录数据块</text></g><g transform="translate(260,100)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="0">② /home</text><text class="small" text-anchor="middle" x="110" y="18">查到 “home” → inode 18</text><rect class="dir" height="110" rx="4" width="220" x="0" y="30"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="50">目录文件 “/home”</text><text class="mono" x="10" y="72">. → inode 18</text><text class="mono" x="10" y="90">.. → inode 2</text><text class="mono" x="10" y="108">alice/ → inode 77</text><text class="mono" x="10" y="126">bob/ → inode 78</text><rect class="inode" height="70" rx="4" width="220" x="0" y="160"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="180">inode #18</text><text class="mono" x="10" y="200">type=dir</text><text class="mono" x="10" y="218">block_ptr → 目录数据块</text></g><g transform="translate(500,100)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="0">③ /home/alice</text><text class="small" text-anchor="middle" x="110" y="18">查到 “alice” → inode 77</text><rect class="dir" height="110" rx="4" width="220" x="0" y="30"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="50">目录文件 “/home/alice”</text><text class="mono" x="10" y="72">. → inode 77</text><text class="mono" x="10" y="90">.. → inode 18</text><text class="mono" x="10" y="108">a.txt → inode 123</text><text class="mono" x="10" y="126">docs/ → inode 200</text><rect class="inode" height="70" rx="4" width="220" x="0" y="160"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="180">inode #77</text><text class="mono" x="10" y="200">type=dir</text><text class="mono" x="10" y="218">block_ptr → 目录数据块</text></g><g transform="translate(740,100)"><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="0">④ /home/alice/a.txt</text><text class="small" text-anchor="middle" x="110" y="18">查到 “a.txt” → inode 123</text><rect class="inode" height="110" rx="4" width="220" x="0" y="30"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="50">inode #123</text><text class="mono" x="10" y="72">type=file</text><text class="mono" x="10" y="90">size=6, links=1</text><text class="mono" x="10" y="108">block_ptr[0] → data block</text><text class="mono" x="10" y="126">block_ptr[1..] → ...</text><rect class="data" height="70" rx="4" width="220" x="0" y="160"></rect><text font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="180">数据块</text><text class="mono" x="10" y="202">"hello\n"</text><text class="mono" x="10" y="220">←─ 实际文件内容</text></g><path d="M240 175h20" marker-end="url(#arr4)" stroke="var(--neutral-ink)" stroke-width="1.5"></path><path d="M480 175h20" marker-end="url(#arr4)" stroke="var(--neutral-ink)" stroke-width="1.5"></path><path d="M720 175h20" marker-end="url(#arr4)" stroke="var(--neutral-ink)" stroke-width="1.5"></path><path d="M130 290q0 30-20 0" fill="none" marker-end="url(#arr4)" stroke="var(--violet-deep)" stroke-width="1"></path><text font-weight="var(--svg-font-weight-bold)" x="20" y="380">关键点</text><text x="20" y="402">• 目录本质上是一个 “特殊文件”，其数据块内容是一条条目录项 ⟨名字, inode 号⟩。</text><text x="20" y="422">• 每一段路径分量都要做一次：读目录数据块 → 线性查找 → 拿到下一级 inode 号 → 读 inode。</text><text x="20" y="442">• 文件名只存在于目录项中；文件的真实属性（大小、权限、数据块指针）都在 inode 里。</text><text x="20" y="462">• 硬链接 = 多个目录项指向同一 inode；软链接 = inode 类型为 link，数据块里存目标路径。</text></svg>