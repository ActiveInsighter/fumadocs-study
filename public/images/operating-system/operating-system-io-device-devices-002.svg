<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="Microsoft Yahei, sans-serif" font-size="13"><defs><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#333"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c62828"/></marker><marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1565c0"/></marker><marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2e7d32"/></marker></defs><style>.sv-title{font-weight:700;font-size:15px}.sv-cpu{fill:#bbdefb;stroke:#1565c0}.sv-dev{fill:#ffe0b2;stroke:#ef6c00}.sv-mem{fill:#c8e6c9;stroke:#2e7d32}.sv-row{fill:#fafafa;stroke:#ddd}.sv-dmac{fill:#f8bbd0;stroke:#ad1457}.sv-idle{fill:#eee;stroke:#bbb}.sv-lab{font-size:12px}.sv-small{font-size:11px;fill:#555}</style><text x="480" y="24" text-anchor="middle" class="sv-title">I/O 控制方式对比（CPU 参与度 / 数据流）</text><text x="100" y="60" text-anchor="middle" font-weight="bold">方式</text><text x="380" y="60" text-anchor="middle" font-weight="bold">数据流</text><text x="770" y="60" text-anchor="middle" font-weight="bold">CPU 参与度（时间轴）</text><line x1="20" y1="70" x2="940" y2="70" stroke="#666"/><rect x="20" y="80" width="920" height="150" rx="6" class="sv-row"/><text x="100" y="115" text-anchor="middle" font-weight="bold">程序查询</text><text x="100" y="135" text-anchor="middle" class="sv-small">(Polling)</text><text x="100" y="153" text-anchor="middle" class="sv-small">同步、忙等</text><rect x="210" y="130" width="60" height="36" class="sv-cpu" rx="4"/><text x="240" y="153" text-anchor="middle">CPU</text><rect x="350" y="130" width="60" height="36" class="sv-dev" rx="4"/><text x="380" y="153" t