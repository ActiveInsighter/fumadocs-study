<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red-deep)"/></marker><marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet-deep)"/></marker><marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--lime-deep)"/></marker></defs><style>.sv-title{font-weight: var(--svg-font-weight-bold);font-size: var(--svg-font-size-body)}.sv-cpu{fill:var(--sky-light);stroke:var(--violet-deep)}.sv-dev{fill:var(--amber-light);stroke:var(--orange-mid)}.sv-mem{fill:var(--green-light);stroke:var(--lime-deep)}.sv-row{fill:var(--surface);stroke:var(--neutral-light)}.sv-dmac{fill:var(--rose-light);stroke:var(--rose-deep)}.sv-idle{fill:var(--neutral-soft);stroke:var(--neutral-mid)}.sv-lab{font-size: var(--svg-font-size-label)}.sv-small{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}</style><text x="480" y="24" text-anchor="middle" class="sv-title">I/O 控制方式对比（CPU 参与度 / 数据流）</text><text x="100" y="60" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">方式</text><text x="380" y="60" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">数据流</text><text x="770" y="60" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">CPU 参与度（时间轴）</text><line x1="20" y1="70" x2="940" y2="70" stroke="var(--neutral-deep)"/><rect x="20" y="80" width="920" height="150" rx="6" class="sv-row"/><text x="100" y="115" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">程序查询</text><text x="100" y="135" text-anchor="middle" class="sv-small">(Polling)</text><text x="100" y="153" text-anchor="middle" class="sv-small">同步、忙等</text><rect x="210" y="130" width="60" height="36" class="sv-cpu" rx="4"/><text x="240" y="153" text-anchor="middle">CPU</text><rect x="350" y="130" width="60" height="36" class="sv-dev" rx="4"/><text x="380" y="153" text-anchor="middle">设备</text><rect x="490" y="130" width="60" height="36" class="sv-mem" rx="4"/><text x="520" y="153" text-anchor="middle">内存</text><path d="M270 142h80" stroke="var(--neutral-ink)" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/><text x="310" y="135" text-anchor="middle" class="sv-small">轮询/读状态</text><path d="M350 158H270" stroke="var(--neutral-ink)" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/><text x="310" y="182" text-anchor="middle" class="sv-small">数据→CPU 寄存器</text><path d="M410 142h80" stroke="var(--violet-deep)" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/><path d="M270 2e2q110 15 220-35" stroke="var(--violet-deep)" stroke-width="1.5" fill="none" marker-end="url(#arrBlue)"/><text x="380" y="218" text-anchor="middle" class="sv-small" fill="var(--violet-deep)">CPU 再写入内存（每字节都经 CPU）</text><rect x="600" y="120" width="320" height="22" class="sv-cpu"/><line x1="600" y1="142" x2="920" y2="142" stroke="var(--neutral-ink)"/><line x1="600" y1="142" x2="600" y2="148" stroke="var(--neutral-ink)"/><line x1="920" y1="142" x2="920" y2="148" stroke="var(--neutral-ink)"/><text x="760" y="135" text-anchor="middle" class="sv-small">CPU 全程忙：检查 → 传送 → 检查 → …</text><text x="760" y="160" text-anchor="middle" class="sv-small">时间 →</text><text x="760" y="200" text-anchor="middle" class="sv-small">几乎 100% CPU 占用，效率最低</text><rect x="20" y="240" width="920" height="150" rx="6" class="sv-row"/><text x="100" y="275" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">程序中断</text><text x="100" y="295" text-anchor="middle" class="sv-small">(Interrupt)</text><text x="100" y="313" text-anchor="middle" class="sv-small">异步、需中断响应</text><rect x="210" y="290" width="60" height="36" class="sv-cpu" rx="4"/><text x="240" y="313" text-anchor="middle">CPU</text><rect x="350" y="290" width="60" height="36" class="sv-dev" rx="4"/><text x="380" y="313" text-anchor="middle">设备</text><rect x="490" y="290" width="60" height="36" class="sv-mem" rx="4"/><text x="520" y="313" text-anchor="middle">内存</text><path d="M270 302h80" stroke="var(--neutral-ink)" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/><text x="310" y="295" text-anchor="middle" class="sv-small">启动 I/O</text><path d="M350 318H270" stroke="var(--red-deep)" stroke-width="1.5" fill="none" marker-end="url(#arrRed)"/><text x="310" y="342" text-anchor="middle" class="sv-small" fill="var(--red-deep)">完成 → 中断 + 数据</text><path d="M270 360q110 18 220-20" stroke="var(--violet-deep)" stroke-width="1.5" fill="none" marker-end="url(#arrBlue)"/><text x="380" y="378" text-anchor="middle" class="sv-small" fill="var(--violet-deep)">中断服务程序搬运（仍经 CPU）</text><rect x="600" y="290" width="25" height="22" class="sv-cpu"/><rect x="625" y="290" width="190" height="22" class="sv-idle"/><rect x="815" y="290" width="55" height="22" class="sv-cpu"/><rect x="870" y="290" width="50" height="22" class="sv-idle"/><line x1="600" y1="312" x2="920" y2="312" stroke="var(--neutral-ink)"/><line x1="600" y1="312" x2="600" y2="318" stroke="var(--neutral-ink)"/><line x1="920" y1="312" x2="920" y2="318" stroke="var(--neutral-ink)"/><text x="760" y="328" text-anchor="middle" class="sv-small">时间 →</text><text x="612" y="345" text-anchor="middle" class="sv-small">启动</text><text x="720" y="345" text-anchor="middle" class="sv-small">设备工作（CPU 空闲）</text><text x="842" y="345" text-anchor="middle" class="sv-small">ISR 搬数据</text><text x="760" y="378" text-anchor="middle" class="sv-small">CPU 仅在中断时介入；按字节/帧产生中断</text><rect x="20" y="400" width="920" height="180" rx="6" class="sv-row"/><text x="100" y="435" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">DMA</text><text x="100" y="455" text-anchor="middle" class="sv-small">(直接存储器访问)</text><text x="100" y="473" text-anchor="middle" class="sv-small">大块数据、低 CPU</text><rect x="210" y="430" width="60" height="36" class="sv-cpu" rx="4"/><text x="240" y="453" text-anchor="middle">CPU</text><rect x="210" y="510" width="60" height="36" class="sv-dmac" rx="4"/><text x="240" y="533" text-anchor="middle">DMAC</text><rect x="380" y="430" width="60" height="36" class="sv-dev" rx="4"/><text x="410" y="453" text-anchor="middle">设备</text><rect x="380" y="510" width="60" height="36" class="sv-mem" rx="4"/><text x="410" y="533" text-anchor="middle">内存</text><path d="M240 466v44" stroke="var(--neutral-ink)" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/><text x="248" y="492" class="sv-small">启动命令</text><path d="M270 520l110-72" stroke="var(--rose-deep)" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr3)"/><text x="340" y="492" text-anchor="middle" class="sv-small" fill="var(--rose-deep)">控制</text><path d="M270 528H380" stroke="var(--rose-deep)" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr3)"/><text x="325" y="522" text-anchor="middle" class="sv-small" fill="var(--rose-deep)">控制</text><path d="M410 466v44" stroke="var(--lime-deep)" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)"/><text x="455" y="492" class="sv-small" fill="var(--lime-deep)">设备 ↔ 内存 直传</text><path d="M225 510V466" stroke="var(--red-deep)" stroke-width="1.2" fill="none" marker-end="url(#arrRed)"/><text x="150" y="492" class="sv-small" fill="var(--red-deep)">块结束中断</text><rect x="600" y="430" width="18" height="22" class="sv-cpu"/><rect x="618" y="430" width="284" height="22" class="sv-idle"/><rect x="902" y="430" width="18" height="22" class="sv-cpu"/><line x1="600" y1="452" x2="920" y2="452" stroke="var(--neutral-ink)"/><line x1="600" y1="452" x2="600" y2="458" stroke="var(--neutral-ink)"/><line x1="920" y1="452" x2="920" y2="458" stroke="var(--neutral-ink)"/><text x="760" y="468" text-anchor="middle" class="sv-small">时间 →</text><text x="609" y="490" text-anchor="middle" class="sv-small">启动</text><text x="760" y="490" text-anchor="middle" class="sv-small">DMAC 独立传输（CPU 空闲）</text><text x="900" y="490" text-anchor="middle" class="sv-small">结束中断</text><text x="760" y="525" text-anchor="middle" class="sv-small">CPU 仅头尾介入；中段由 DMAC 独立完成</text><text x="760" y="548" text-anchor="middle" class="sv-small">CPU 参与度最低；适合大批量、高速 I/O（磁盘、网卡）</text></svg>