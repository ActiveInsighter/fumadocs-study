end="url(#arr3)"/><text x="310" y="295" text-anchor="middle" class="sv-small">启动 I/O</text><path d="M350 318H270" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#arrRed)"/><text x="310" y="342" text-anchor="middle" class="sv-small" fill="#c62828">完成 → 中断 + 数据</text><path d="M270 360q110 18 220-20" stroke="#1565c0" stroke-width="1.5" fill="none" marker-end="url(#arrBlue)"/><text x="380" y="378" text-anchor="middle" class="sv-small" fill="#1565c0">中断服务程序搬运（仍经 CPU）</text><rect x="600" y="290" width="25" height="22" class="sv-cpu"/><rect x="625" y="290" width="190" height="22" class="sv-idle"/><rect x="815" y="290" width="55" height="22" class="sv-cpu"/><rect x="870" y="290" width="50" height="22" class="sv-idle"/><line x1="600" y1="312" x2="920" y2="312" stroke="#333"/><line x1="600" y1="312" x2="600" y2="318" stroke="#333"/><line x1="920" y1="312" x2="920" y2="318" stroke="#333"/><text x="760" y="328" text-anchor="middle" class="sv-small">时间 →</text><text x="612" y="345" text-anchor="middle" class="sv-small">启动</text><text x="720" y="345" text-anchor="middle" class="sv-small">设备工作（CPU 空闲）</text><text x="842" y="345" text-anchor="middle" class="sv-small">ISR 搬数据</text><text x="760" y="378" text-anchor="middle" class="sv-small">CPU 仅在中断时介入；按字节/帧产生中断</text><rect x="20" y="400" width="920" height="180" rx="6" class="sv-row"/><text x="100" y="435" text-anchor="middle" font-weight="bold">DMA</text><text x="100" y="455" text-anchor="middle" class="sv-small">(直接存储器访问)</text><text x="100" y="473" text-anchor="middle" class="sv-small">大块数据、低 CPU</text><rect x="210" y="430" width="60" height="36" class="sv-cpu" rx="4"/><text x="240" y="453" text-anchor="middle">CPU</text><rect x="210" y="510" width="60" height="36" class="sv-dmac" rx="4"/><text x="240" y="533" text-anchor="middle">DMAC</text><rect x="380" y="430" width="60" height="36" class="sv-dev" rx="4"/><text x="410" y="453" text-anchor="middle">设备</text><rect x="380" y="510" width="60" height="36" class="sv-mem" rx="4"/><text x="410" y="533" text-anchor="middle">内存</text><path d="M240 466v44" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/><text x="248" y="492" class="sv-small">启动命令</text><path d="M270 520l110-72" stroke="#ad1457" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr3)"/><text x="340" y="492" text-anchor="middle" class="sv-small" fill="#ad1457">控制</text><path d="M270 528H380" stroke="#ad1457" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr3)"/><text x="325" y="522" text-anchor="middle" class="sv-small" fill="#ad1457">控制</text><path d="M410 466v44" stroke="#2e7d32" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)"/><text x="455" y="492" class="sv-small" fill="#2e7d32">设备 ↔ 内存 直传</text><path d="M225 510V466" stroke="#c62828" stroke-width="1.2" fill="none" marker-end="url(#arrRed)"/><text x="150" y="492" class="sv-small" fill="#c62828">块结束中断</text><rect x="600" y="430" width="18" height="22" class="sv-cpu"/><rect x="618" y="430" width="284" height="22" class="sv-idle"/><rect x="902" y="430" width="18" height="22" class="sv-cpu"/><line x1="600" y1="452" x2="920" y2="452" stroke="#333"/><line x1="600" y1="452" x2="600" y2="458" stroke="#333"/><line x1="920" y1="452" x2="920" y2="458" stroke="#333"/><text x="760" y="468" text-anchor="middle" class="sv-small">时间 →</text><text x="609" y="490" text-anchor="middle" class="sv-small">启动</text><text x="760" y="490" text-anchor="middle" class="sv-small">DMAC 独立传输（CPU 空闲）</text><text x="900" y="490" text-anchor="middle" class="sv-small">结束中断</text><text x="760" y="525" text-anchor="middle" class="sv-small">CPU 仅头尾介入；中段由 DMAC 独立完成</text><text x="760" y="548" text-anchor="middle" class="sv-small">CPU 参与度最低；适合大批量、高速 I/O（磁盘、网卡）</text></svg>