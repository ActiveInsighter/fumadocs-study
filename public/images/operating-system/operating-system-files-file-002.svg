<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460"><rect width="800" height="460" fill="none"/><text x="400" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2c3e50">inode 表（inode table）</text><text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7f8c8d">存储文件系统中所有 inode 的唯一容器，按 inode 编号索引</text><text x="155" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">文件 / 目录</text><g font-family="Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold"><rect x="60" y="110" width="190" height="44" fill="#3498db" rx="6"/><text x="155" y="138" text-anchor="middle">/etc (inode 1)</text><rect x="60" y="180" width="190" height="44" fill="#e74c3c" rx="6"/><text x="155" y="208" text-anchor="middle">a.txt (inode 2)</text><rect x="60" y="250" width="190" height="44" fill="#27ae60" rx="6"/><text x="155" y="278" text-anchor="middle">link (inode 3)</text><rect x="60" y="320" width="190" height="44" fill="#9b59b6" rx="6"/><text x="155" y="348" text-anchor="middle">app (inode 4)</text></g><g stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"><line x1="250" y1="132" x2="380" y2="132"/><line x1="250" y1="202" x2="380" y2="202"/><line x1="250" y1="272" x2="380" y2="272"/><line x1="250" y1="342" x2="380" y2="342"/></g><text x="315" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">凭 inode 编号查找</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 3 0 6z" fill="#34495e"/></marker></defs><rect x="380" y="100" width="370" height="320" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="8"/><text x="565" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">inode 表</text><g font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50"><text x="430" y="125" text-anchor="middle">编号</text><text x="615" y="125" text-anchor="middle">inode（元数据 + 数据块指针）</text></g><line x1="390" y1="132" x2="740" y2="132" stroke="#bdc3c7" stroke-width="1"/><g font-family="Arial, sans-serif" font-size="12" fill="#2c3e50"><rect x="395" y="142" width="50" height="50" fill="#3498db" rx="4"/><text x="420" y="172" text-anchor="middle" fill="#fff" font-weight="bold">1</text><rect x="455" y="142" width="285" height="50" fill="#d6eaf8" rx="4"/><text x="465" y="165">目录 / drwxr-xr-x / root</text><text x="465" y="183" fill="#7f8c8d">块: [100,101,102]</text><rect x="395" y="212" width="50" height="50" fill="#e74c3c" rx="4"/><text x="420" y="242" text-anchor="middle" fill="#fff" font-weight="bold">2</text><rect x="455" y="212" width="285" height="50" fill="#fadbd8" rx="4"/><text x="465" y="235">文件 / -rw-r--r-- / user</text><text x="465" y="253" fill="#7f8c8d">块: [200,201]</text><rect x="395" y="282" width="50" height="50" fill="#27ae60" rx="4"/><text x="420" y="312" text-anchor="middle" fill="#fff" font-weight="bold">3</text><rect x="455" y="282" width="285" height="50" fill="#d5f5e3" rx="4"/><text x="465" y="305">符号链接 / lrwxrwxrwx / user</text><text x="465" y="323" fill="#7f8c8d">路径: "/etc/abc"</text><rect x="395" y="352" width="50" height="50" fill="#9b59b6" rx="4"/><text x="420" y="382" text-anchor="middle" fill="#fff" font-weight="bold">4</text><rect x="455" y="352" width="285" height="50" fill="#ebdef0" rx="4"/><text x="465" y="375">文件 / -rwxr-xr-x / user</text><text x="465" y="393" fill="#7f8c8d">块: [300,301,302,303]</text></g><text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#34495e">每个文件/目录都有唯一编号，文件系统凭编号在表中定位对应 inode；多个进程打开同一文件共享同一个 inode</text></svg>