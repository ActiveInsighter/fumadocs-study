<svg font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"></path></marker><style>.title{font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold);fill:var(--ink)}.label{font-size: var(--svg-font-size-label);fill:var(--neutral-ink)}.cell-free{fill:var(--green-soft);stroke:var(--lime-deep)}.cell-used{fill:var(--rose-light);stroke:var(--red-deep)}.cell-hit{fill:var(--yellow-light);stroke:var(--orange-mid)}.bit{font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold)}.bit-free{fill:var(--lime-deep)}.bit-used{fill:var(--red-deep)}.idx{font-size: var(--svg-font-size-caption);fill:var(--ink-soft)}.note{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}</style></defs><text class="title" text-anchor="middle" x="380" y="26">位图法：空闲磁盘块的分配与回收</text><g transform="translate(30,42)"><rect class="cell-free" height="18" width="18" x="0" y="0"></rect><text class="label" x="24" y="14">0 空闲</text><rect class="cell-used" height="18" width="18" x="90" y="0"></rect><text class="label" x="114" y="14">1 已占用</text><rect class="cell-hit" height="18" width="18" x="200" y="0"></rect><text class="label" x="224" y="14">本次操作</text></g><g transform="translate(30,90)"><text class="label" x="0" y="-6">初始位图状态：</text><g><rect class="cell-used" height="40" width="40" x="0" y="0"></rect><rect class="cell-used" height="40" width="40" x="40" y="0"></rect><rect class="cell-free" height="40" width="40" x="80" y="0"></rect><rect class="cell-used" height="40" width="40" x="120" y="0"></rect><rect class="cell-free" height="40" width="40" x="160" y="0"></rect><rect class="cell-free" height="40" width="40" x="200" y="0"></rect><rect class="cell-used" height="40" width="40" x="240" y="0"></rect><rect class="cell-free" height="40" width="40" x="280" y="0"></rect><rect class="cell-used" height="40" width="40" x="320" y="0"></rect><rect class="cell-free" height="40" width="40" x="360" y="0"></rect><text class="bit bit-used" text-anchor="middle" x="20" y="26">1</text><text class="bit bit-used" text-anchor="middle" x="60" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="100" y="26">0</text><text class="bit bit-used" text-anchor="middle" x="140" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="180" y="26">0</text><text class="bit bit-free" text-anchor="middle" x="220" y="26">0</text><text class="bit bit-used" text-anchor="middle" x="260" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="300" y="26">0</text><text class="bit bit-used" text-anchor="middle" x="340" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="380" y="26">0</text><text class="idx" text-anchor="middle" x="20" y="55">块0</text><text class="idx" text-anchor="middle" x="60" y="55">块1</text><text class="idx" text-anchor="middle" x="100" y="55">块2</text><text class="idx" text-anchor="middle" x="140" y="55">块3</text><text class="idx" text-anchor="middle" x="180" y="55">块4</text><text class="idx" text-anchor="middle" x="220" y="55">块5</text><text class="idx" text-anchor="middle" x="260" y="55">块6</text><text class="idx" text-anchor="middle" x="300" y="55">块7</text><text class="idx" text-anchor="middle" x="340" y="55">块8</text><text class="idx" text-anchor="middle" x="380" y="55">块9</text></g></g><g transform="translate(30,170)"><line marker-end="url(#arrow)" stroke="var(--neutral-ink)" stroke-width="1.5" x1="200" x2="200" y1="0" y2="30"></line><text class="note" x="210" y="22">① 分配：扫描位图，找到第一个为 0 的位（块2），将其置 1</text></g><g transform="translate(30,220)"><text class="label" x="0" y="-6">分配后：块2 被分配（0 → 1）</text><g><rect class="cell-used" height="40" width="40" x="0" y="0"></rect><rect class="cell-used" height="40" width="40" x="40" y="0"></rect><rect class="cell-hit" height="40" width="40" x="80" y="0"></rect><rect class="cell-used" height="40" width="40" x="120" y="0"></rect><rect class="cell-free" height="40" width="40" x="160" y="0"></rect><rect class="cell-free" height="40" width="40" x="200" y="0"></rect><rect class="cell-used" height="40" width="40" x="240" y="0"></rect><rect class="cell-free" height="40" width="40" x="280" y="0"></rect><rect class="cell-used" height="40" width="40" x="320" y="0"></rect><rect class="cell-free" height="40" width="40" x="360" y="0"></rect><text class="bit bit-used" text-anchor="middle" x="20" y="26">1</text><text class="bit bit-used" text-anchor="middle" x="60" y="26">1</text><text class="bit bit-used" text-anchor="middle" x="100" y="26">1</text><text class="bit bit-used" text-anchor="middle" x="140" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="180" y="26">0</text><text class="bit bit-free" text-anchor="middle" x="220" y="26">0</text><text class="bit bit-used" text-anchor="middle" x="260" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="300" y="26">0</text><text class="bit bit-used" text-anchor="middle" x="340" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="380" y="26">0</text><text class="idx" text-anchor="middle" x="20" y="55">块0</text><text class="idx" text-anchor="middle" x="60" y="55">块1</text><text class="idx" text-anchor="middle" x="100" y="55">块2</text><text class="idx" text-anchor="middle" x="140" y="55">块3</text><text class="idx" text-anchor="middle" x="180" y="55">块4</text><text class="idx" text-anchor="middle" x="220" y="55">块5</text><text class="idx" text-anchor="middle" x="260" y="55">块6</text><text class="idx" text-anchor="middle" x="300" y="55">块7</text><text class="idx" text-anchor="middle" x="340" y="55">块8</text><text class="idx" text-anchor="middle" x="380" y="55">块9</text></g></g><g transform="translate(30,300)"><line marker-end="url(#arrow)" stroke="var(--neutral-ink)" stroke-width="1.5" x1="340" x2="340" y1="0" y2="30"></line><text class="note" x="350" y="22">② 回收：文件释放块8，将对应位由 1 置 0</text></g><g transform="translate(30,350)"><text class="label" x="0" y="-6">回收后：块8 被释放（1 → 0）</text><g><rect class="cell-used" height="40" width="40" x="0" y="0"></rect><rect class="cell-used" height="40" width="40" x="40" y="0"></rect><rect class="cell-used" height="40" width="40" x="80" y="0"></rect><rect class="cell-used" height="40" width="40" x="120" y="0"></rect><rect class="cell-free" height="40" width="40" x="160" y="0"></rect><rect class="cell-free" height="40" width="40" x="200" y="0"></rect><rect class="cell-used" height="40" width="40" x="240" y="0"></rect><rect class="cell-free" height="40" width="40" x="280" y="0"></rect><rect class="cell-hit" height="40" width="40" x="320" y="0"></rect><rect class="cell-free" height="40" width="40" x="360" y="0"></rect><text class="bit bit-used" text-anchor="middle" x="20" y="26">1</text><text class="bit bit-used" text-anchor="middle" x="60" y="26">1</text><text class="bit bit-used" text-anchor="middle" x="100" y="26">1</text><text class="bit bit-used" text-anchor="middle" x="140" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="180" y="26">0</text><text class="bit bit-free" text-anchor="middle" x="220" y="26">0</text><text class="bit bit-used" text-anchor="middle" x="260" y="26">1</text><text class="bit bit-free" text-anchor="middle" x="300" y="26">0</text><text class="bit bit-free" text-anchor="middle" x="340" y="26">0</text><text class="bit bit-free" text-anchor="middle" x="380" y="26">0</text><text class="idx" text-anchor="middle" x="20" y="55">块0</text><text class="idx" text-anchor="middle" x="60" y="55">块1</text><text class="idx" text-anchor="middle" x="100" y="55">块2</text><text class="idx" text-anchor="middle" x="140" y="55">块3</text><text class="idx" text-anchor="middle" x="180" y="55">块4</text><text class="idx" text-anchor="middle" x="220" y="55">块5</text><text class="idx" text-anchor="middle" x="260" y="55">块6</text><text class="idx" text-anchor="middle" x="300" y="55">块7</text><text class="idx" text-anchor="middle" x="340" y="55">块8</text><text class="idx" text-anchor="middle" x="380" y="55">块9</text></g></g><g transform="translate(470,90)"><rect fill="var(--paper)" height="330" rx="6" ry="6" stroke="var(--neutral-mid)" width="260" x="0" y="0"></rect><text class="title" x="12" y="22">操作要点</text><text class="note" x="12" y="50">分配空闲块：</text><text class="note" x="12" y="70">• 从位图起始位置顺序扫描</text><text class="note" x="12" y="88">• 找到首个为 0 的位</text><text class="note" x="12" y="106">• 将该位改写为 1</text><text class="note" x="12" y="124">• 将对应数据块交给文件使用</text><text class="note" x="12" y="160">回收空闲块：</text><text class="note" x="12" y="180">• 由块号计算所在位的下标</text><text class="note" x="12" y="198">行号 = ⌊块号 / 每行位数⌋</text><text class="note" x="12" y="216">列号 = 块号 mod 每行位数</text><text class="note" x="12" y="234">• 将该位由 1 置 0</text><text class="note" x="12" y="252">• 数据块重新变为可分配状态</text><text class="note" x="12" y="288">优点：位图紧凑，一位即代表一块；</text><text class="note" x="12" y="306">扫描/位运算高效，便于连续分配。</text></g></svg>