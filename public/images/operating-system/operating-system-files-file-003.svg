<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2f7"/></linearGradient><linearGradient id="gProc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="gOFT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient><linearGradient id="gInode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity=".18"/></filter><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 9 4 0 8z" fill="#64748b"/></marker></defs><rect width="860" height="540" fill="url(#bg)" rx="16"/><text x="430" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">系统文件打开表（Open File Table）</text><text x="430" y="74" text-anchor="middle" font-size="14" fill="#64748b">内核全局唯一 · 记录每次 open 的「偏移量 / 模式 / 引用计数」· 指向 inode</text><g><rect x="40" y="120" width="200" height="360" rx="14" fill="#fff" stroke="#dbeafe" stroke-width="2" filter="url(#shadow)"/><rect x="40" y="120" width="200" height="40" rx="14" fill="url(#gProc)"/><rect x="40" y="146" width="200" height="14" fill="url(#gProc)"/><text x="140" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">进程文件描述符表</text><text x="140" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">（进程级）</text><text x="70" y="208" font-size="12" font-weight="700" fill="#1e40af">进程 A</text><rect x="62" y="218" width="156" height="34" rx="7" fill="#eff6ff" stroke="#bfdbfe"/><text x="76" y="240" font-size="12" fill="#1e3a8a">fd 3</text><rect x="62" y="258" width="156" height="34" rx="7" fill="#eff6ff" stroke="#bfdbfe"/><text x="76" y="280" font-size="12" fill="#1e3a8a">fd 4 (dup)</text><text x="70" y="338" font-size="12" font-weight="700" fill="#1e40af">进程 B</text><rect x="62" y="348" width="156" height="34" rx="7" fill="#eff6ff" stroke="#bfdbfe"/><text x="76" y="370" font-size="12" fill="#1e3a8a">fd 3</text></g><g><rect x="330" y="120" width="220" height="360" rx="14" fill="#fff" stroke="#fef3c7" stroke-width="2" filter="url(#shadow)"/><rect x="330" y="120" width="220" height="40" rx="14" fill="url(#gOFT)"/><rect x="330" y="146" width="220" height="14" fill="url(#gOFT)"/><text x="440" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">系统打开文件表</text><text x="440" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">（系统全局唯一）</text><rect x="348" y="195" width="184" height="76" rx="9" fill="#fffbeb" stroke="#fcd34d"/><text x="362" y="214" font-size="12" font-weight="700" fill="#92400e">表项 0</text><text x="362" y="234" font-size="11" fill="#78350f">offset = 120</text><text x="362" y="251" font-size="11" fill="#78350f">mode = O_RDONLY</text><text x="362" y="268" font-size="11" fill="#b45309">refcount = 2</text><rect x="348" y="290" width="184" height="76" rx="9" fill="#fffbeb" stroke="#fcd34d"/><text x="362" y="309" font-size="12" font-weight="700" fill="#92400e">表项 1</text><text x="362" y="329" font-size="11" fill="#78350f">offset = 0</text><text x="362" y="346" font-size="11" fill="#78350f">mode = O_RDONLY</text><text x="362" y="363" font-size="11" fill="#b45309">refcount = 1</text></g><g><rect x="640" y="120" width="180" height="360" rx="14" fill="#fff" stroke="#d1fae5" stroke-width="2" filter="url(#shadow)"/><rect x="640" y="120" width="180" height="40" rx="14" fill="url(#gInode)"/><rect x="640" y="146" width="180" height="14" fill="url(#gInode)"/><text x="730" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">inode 表</text><text x="730" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">（系统级）</text><rect x="658" y="220" width="144" height="120" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="730" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">inode</text><text x="730" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46"/><text x="730" y="278" text-anchor="middle" font-size="11" fill="#047857">fileA.txt</text><text x="730" y="300" text-anchor="middle" font-size="11" fill="#047857">元数据 + 数据块指针</text><text x="730" y="322" text-anchor="middle" font-size="11" fill="#047857">磁盘上唯一</text></g><g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ah)"><path d="M218 235c62 0 72-2 128-2"/><path d="M218 275c62 0 82-30 128-30"/><path d="M218 365c72 0 82-37 128-37"/></g><g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ah)"><path d="M532 233c68 0 68 37 124 42"/><path d="M532 328c68 0 78-38 124-38"/></g><text x="278" y="430" text-anchor="middle" font-size="11" fill="#3b82f6">同进程 dup</text><text x="278" y="446" text-anchor="middle" font-size="11" fill="#3b82f6">→ 共享同一表项</text><text x="592" y="430" text-anchor="middle" font-size="11" fill="#10b981">不同 open</text><text x="592" y="446" text-anchor="middle" font-size="11" fill="#10b981">→ 各自表项</text><text x="592" y="462" text-anchor="middle" font-size="11" fill="#10b981">但指向同一 inode</text><rect x="40" y="500" width="780" height="30" rx="9" fill="#0f172a"/><text x="430" y="520" text-anchor="middle" font-size="12.5" fill="#e2e8f0">dup 共享表项（偏移量同步）；独立 open 各有表项（偏移量独立），最终都指向同一个 inode</text></svg>