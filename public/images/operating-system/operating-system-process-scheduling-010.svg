<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 546" role="img" style=""><title style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">时间片轮转调度：就绪队列结构与调度流程</title><desc style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">顶部展示就绪队列的 FIFO 结构，包含多个等待进程；下方展示调度流程：取出队首进程运行一个时间片，判断是否执行完毕，完毕则退出，未完毕则重新进入队尾。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><line x1="300" y1="40" x2="300" y2="60" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="320" y="54" text-anchor="start" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">新进程到达</text><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="100" y="60" width="480" height="120" rx="16" stroke-width=".5" stroke-dasharray="4 3" style="fill:#f1efe8;stroke:#5f5e5a;color:#0b0b0b;stroke-width:.5px;stroke-dasharray:4px,3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/></g><text x="116" y="84" text-anchor="start" style="fill:#0b0b0b;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:start;dominant-baseline:auto">就绪队列（FIFO）</text><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="158" y="115" width="80" height="45" rx="6" stroke-width=".5" style="fill:#eeedfe;stroke:#534ab7;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="198" y="137" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">P1</text></g><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="253" y="115" width="80" height="45" rx="6" stroke-width=".5" style="fill:#eeedfe;stroke:#534ab7;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="293" y="137" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">P2</text></g><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="348" y="115" width="80" height="45" rx="6" stroke-width=".5" style="fill:#eeedfe;stroke:#534ab7;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="388" y="137" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">P3</text></g><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="443" y="115" width="80" height="45" rx="6" stroke-width=".5" style="fill:#eeedfe;stroke:#534ab7;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="483" y="137" text-anchor="middle" dominant-baseline="central" style="fill:#3c3489;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">P4</text></g><line x1="100" y1="137" x2="50" y2="137" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="75" y="118" text-anchor="middle" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">取出运行</text><line x1="340" y1="180" x2="340" y2="210" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="190" y="210" width="300" height="56" rx="8" stroke-width=".5" style="fill:#e6f1fb;stroke:#185fa5;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="340" y="228" text-anchor="middle" dominant-baseline="central" style="fill:#0c447c;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">取出队首进程运行</text><text x="340" y="248" text-anchor="middle" dominant-baseline="central" style="fill:#185fa5;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">占用一个时间片</text></g><line x1="340" y1="266" x2="340" y2="305" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><polygon points="340,305 450,360 340,415 230,360" stroke-width=".5" style="fill:#fcfcfb;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="340" y="360" text-anchor="middle" dominant-baseline="central" style="fill:#0b0b0b;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">时间片内完成?</text><line x1="450" y1="360" x2="480" y2="360" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="465" y="345" text-anchor="middle" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">否</text><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="480" y="330" width="150" height="60" rx="8" stroke-width=".5" style="fill:#faece7;stroke:#993c1d;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="555" y="348" text-anchor="middle" dominant-baseline="central" style="fill:#712b13;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">时间片到期</text><text x="555" y="372" text-anchor="middle" dominant-baseline="central" style="fill:#993c1d;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">重新进入队尾</text></g><path d="M555 330h75V155H580" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)" style="fill:none;stroke:#d85a30;color:#0b0b0b;stroke-width:1px;stroke-dasharray:4px,3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="545" y="240" text-anchor="start" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">返回队列</text><line x1="340" y1="415" x2="340" y2="450" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="320" y="432" text-anchor="end" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:end;dominant-baseline:auto">是</text><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="190" y="450" width="300" height="56" rx="8" stroke-width=".5" style="fill:#e1f5ee;stroke:#0f6e56;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="340" y="468" text-anchor="middle" dominant-baseline="central" style="fill:#085041;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">进程执行完毕</text><text x="340" y="486" text-anchor="middle" dominant-baseline="central" style="fill:#0f6e56;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans,-apple-system,system-ui,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">退出系统，调度下一进程</text></g></svg>