<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4a5568"></path></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c53030"></path></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f855a"></path></marker></defs><text x="20" y="30" font-weight="600" fill="#2d3748">入口队列 (Entry Queue)</text><text x="20" y="48" font-size="11" fill="#718096">试图进入管程但被阻塞的线程</text><g><circle cx="40" cy="90" r="16" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"></circle><text x="40" y="94" text-anchor="middle" font-size="11" fill="#742a2a">T3</text><circle cx="80" cy="90" r="16" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"></circle><text x="80" y="94" text-anchor="middle" font-size="11" fill="#742a2a">T4</text><circle cx="120" cy="90" r="16" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"></circle><text x="120" y="94" text-anchor="middle" font-size="11" fill="#742a2a">T5</text></g><line x1="140" y1="90" x2="205" y2="90" stroke="#c53030" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red)"></line><text x="150" y="82" font-size="11" fill="#c53030">尝试进入</text><rect x="210" y="55" width="530" height="375" rx="14" ry="14" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2.5"></rect><text x="230" y="80" font-weight="700" fill="#2b6cb0" font-size="15">管程 (Monitor)</text><text x="230" y="97" font-size="11" fill="#4a5568">同一时刻最多一个线程可执行管程内的代码</text><g transform="translate(670,68)"><rect x="0" y="8" width="26" height="20" rx="3" fill="#f6ad55" stroke="#c05621" stroke-width="1.5"></rect><path d="M5 8V4a8 8 0 0116 0V8" fill="none" stroke="#c05621" stroke-width="2"></path><text x="13" y="22" text-anchor="middle" font-size="10" font-weight="600" fill="#7b341e">互斥</text></g><rect x="230" y="115" width="220" height="80" rx="8" fill="#fefcbf" stroke="#b7791f" stroke-width="1.5"></rect><text x="340" y="135" text-anchor="middle" font-weight="600" fill="#744210">共享数据</text><text x="340" y="155" text-anchor="middle" font-size="11" fill="#744210">buffer[N], count, in, out ...</text><text x="340" y="175" text-anchor="middle" font-size="10" fill="#975a16">只能通过管程内的方法访问</text><rect x="230" y="215" width="105" height="60" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"></rect><text x="282" y="238" text-anchor="middle" font-weight="600" fill="#22543d">方法 produce()</text><text x="282" y="256" text-anchor="middle" font-size="10" fill="#22543d">写入共享数据</text><text x="282" y="270" text-anchor="middle" font-size="10" fill="#22543d">调用 wait/signal</text><rect x="345" y="215" width="105" height="60" rx="8" fill="#c6f6d5" stroke="#2f855a" stroke-width="1.5"></rect><text x="397" y="238" text-anchor="middle" font-weight="600" fill="#22543d">方法 consume()</text><text x="397" y="256" text-anchor="middle" font-size="10" fill="#22543d">读取共享数据</text><text x="397" y="270" text-anchor="middle" font-size="10" fill="#22543d">调用 wait/signal</text><line x1="282" y1="215" x2="310" y2="195" stroke="#4a5568" stroke-width="1.3" marker-end="url(#arrow)"></line><line x1="397" y1="215" x2="370" y2="195" stroke="#4a5568" stroke-width="1.3" marker-end="url(#arrow)"></line><circle cx="282" cy="310" r="16" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.5"></circle><text x="282" y="314" text-anchor="middle" font-size="11" fill="#2c5282">T1</text><text x="282" y="342" text-anchor="middle" font-size="10" fill="#2c5282">当前执行的线程</text><line x1="282" y1="294" x2="282" y2="278" stroke="#2b6cb0" stroke-width="1.3" marker-end="url(#arrow)"></line><rect x="475" y="115" width="245" height="200" rx="8" fill="#fff" stroke="#805ad5" stroke-width="1.5" stroke-dasharray="5,3"></rect><text x="597" y="135" text-anchor="middle" font-weight="600" fill="#553c9a">条件变量</text><rect x="490" y="150" width="215" height="65" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="1"></rect><text x="500" y="170" font-size="12" font-weight="600" fill="#553c9a">notFull</text><text x="500" y="186" font-size="10" fill="#553c9a">等待队列:</text><circle cx="573" cy="183" r="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.2"></circle><text x="573" y="187" text-anchor="middle" font-size="10" fill="#44337a">T6</text><circle cx="601" cy="183" r="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.2"></circle><text x="601" y="187" text-anchor="middle" font-size="10" fill="#44337a">T7</text><text x="500" y="207" font-size="10" fill="#6b46c1">缓冲区满时 producer 在此等待</text><rect x="490" y="225" width="215" height="65" rx="6" fill="#faf5ff" stroke="#805ad5" stroke-width="1"></rect><text x="500" y="245" font-size="12" font-weight="600" fill="#553c9a">notEmpty</text><text x="500" y="261" font-size="10" fill="#553c9a">等待队列:</text><circle cx="573" cy="258" r="12" fill="#e9d8fd" stroke="#805ad5" stroke-width="1.2"></circle><text x="573" y="262" text-anchor="middle" font-size="10" fill="#44337a">T8</text><text x="500" y="282" font-size="10" fill="#6b46c1">缓冲区空时 consumer 在此等待</text><path d="M450 245q15 0 35-27" fill="none" stroke="#c53030" stroke-width="1.5" marker-end="url(#arrow-red)"></path><text x="443" y="238" font-size="10" fill="#c53030">wait()</text><path d="M490 3e2q-45 5-85-20" fill="none" stroke="#2f855a" stroke-width="1.5" marker-end="url(#arrow-green)"></path><text x="435" y="315" font-size="10" fill="#2f855a">signal()</text><rect x="230" y="355" width="490" height="65" rx="6" fill="#edf2f7" stroke="#a0aec0" stroke-width="1"></rect><text x="245" y="375" font-size="11" fill="#2d3748"><tspan font-weight="600" fill="#c53030">互斥</tspan>: 进入方法需先获得管程锁, 未获得的线程进入<tspan font-weight="600">入口队列</tspan></text><text x="245" y="393" font-size="11" fill="#2d3748"><tspan font-weight="600" fill="#805ad5">同步</tspan>: 条件不满足时 wait() 释放锁并挂起; 其它线程 signal() 唤醒等待者</text><text x="245" y="411" font-size="11" fill="#2d3748"><tspan font-weight="600" fill="#2f855a">封装</tspan>: 共享数据只能被管程内的方法访问, 隐藏低层同步细节</text><text x="20" y="450" font-size="11" fill="#718096">图例:</text><circle cx="70" cy="446" r="9" fill="#bee3f8" stroke="#2b6cb0"></circle><text x="85" y="450" font-size="11" fill="#2c5282">运行中的线程</text><circle cx="180" cy="446" r="9" fill="#fed7d7" stroke="#c53030"></circle><text x="195" y="450" font-size="11" fill="#742a2a">入口阻塞</text><circle cx="275" cy="446" r="9" fill="#e9d8fd" stroke="#805ad5"></circle><text x="290" y="450" font-size="11" fill="#44337a">条件变量等待</text></svg>