<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--blue-deep)"></path></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--red-deep)"></path></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--green-deep)"></path></marker></defs><text x="20" y="30" font-weight="var(--svg-font-weight-semibold)" fill="var(--indigo-ink)">入口队列 (Entry Queue)</text><text x="20" y="48" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">试图进入管程但被阻塞的线程</text><g><circle cx="40" cy="90" r="16" fill="var(--red-light)" stroke="var(--red-deep)" stroke-width="1.5"></circle><text x="40" y="94" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">T3</text><circle cx="80" cy="90" r="16" fill="var(--red-light)" stroke="var(--red-deep)" stroke-width="1.5"></circle><text x="80" y="94" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">T4</text><circle cx="120" cy="90" r="16" fill="var(--red-light)" stroke="var(--red-deep)" stroke-width="1.5"></circle><text x="120" y="94" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">T5</text></g><line x1="140" y1="90" x2="205" y2="90" stroke="var(--red-deep)" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red)"></line><text x="150" y="82" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">尝试进入</text><rect x="210" y="55" width="530" height="375" rx="14" ry="14" fill="var(--paper)" stroke="var(--indigo-deep)" stroke-width="2.5"></rect><text x="230" y="80" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-deep)" font-size="var(--svg-font-size-body)">管程 (Monitor)</text><text x="230" y="97" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">同一时刻最多一个线程可执行管程内的代码</text><g transform="translate(670,68)"><rect x="0" y="8" width="26" height="20" rx="3" fill="var(--amber-mid)" stroke="var(--coral-deep)" stroke-width="1.5"></rect><path d="M5 8V4a8 8 0 0116 0V8" fill="none" stroke="var(--coral-deep)" stroke-width="2"></path><text x="13" y="22" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--red-deep)">互斥</text></g><rect x="230" y="115" width="220" height="80" rx="8" fill="var(--yellow-light)" stroke="var(--amber-mid)" stroke-width="1.5"></rect><text x="340" y="135" text-anchor="middle" font-weight="var(--svg-font-weight-semibold)" fill="var(--orange-deep)">共享数据</text><text x="340" y="155" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--orange-deep)">buffer[N], count, in, out ...</text><text x="340" y="175" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--orange-deep)">只能通过管程内的方法访问</text><rect x="230" y="215" width="105" height="60" rx="8" fill="var(--green-light)" stroke="var(--green-deep)" stroke-width="1.5"></rect><text x="282" y="238" text-anchor="middle" font-weight="var(--svg-font-weight-semibold)" fill="var(--green-deep)">方法 produce()</text><text x="282" y="256" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--green-deep)">写入共享数据</text><text x="282" y="270" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--green-deep)">调用 wait/signal</text><rect x="345" y="215" width="105" height="60" rx="8" fill="var(--green-light)" stroke="var(--green-deep)" stroke-width="1.5"></rect><text x="397" y="238" text-anchor="middle" font-weight="var(--svg-font-weight-semibold)" fill="var(--green-deep)">方法 consume()</text><text x="397" y="256" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--green-deep)">读取共享数据</text><text x="397" y="270" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--green-deep)">调用 wait/signal</text><line x1="282" y1="215" x2="310" y2="195" stroke="var(--blue-deep)" stroke-width="1.3" marker-end="url(#arrow)"></line><line x1="397" y1="215" x2="370" y2="195" stroke="var(--blue-deep)" stroke-width="1.3" marker-end="url(#arrow)"></line><circle cx="282" cy="310" r="16" fill="var(--sky-light)" stroke="var(--indigo-deep)" stroke-width="1.5"></circle><text x="282" y="314" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--indigo-deep)">T1</text><text x="282" y="342" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--indigo-deep)">当前执行的线程</text><line x1="282" y1="294" x2="282" y2="278" stroke="var(--indigo-deep)" stroke-width="1.3" marker-end="url(#arrow)"></line><rect x="475" y="115" width="245" height="200" rx="8" fill="var(--surface)" stroke="var(--purple-deep)" stroke-width="1.5" stroke-dasharray="5,3"></rect><text x="597" y="135" text-anchor="middle" font-weight="var(--svg-font-weight-semibold)" fill="var(--purple-deep)">条件变量</text><rect x="490" y="150" width="215" height="65" rx="6" fill="var(--violet-soft)" stroke="var(--purple-deep)" stroke-width="1"></rect><text x="500" y="170" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)" fill="var(--purple-deep)">notFull</text><text x="500" y="186" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">等待队列:</text><circle cx="573" cy="183" r="12" fill="var(--violet-light)" stroke="var(--purple-deep)" stroke-width="1.2"></circle><text x="573" y="187" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">T6</text><circle cx="601" cy="183" r="12" fill="var(--violet-light)" stroke="var(--purple-deep)" stroke-width="1.2"></circle><text x="601" y="187" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">T7</text><text x="500" y="207" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">缓冲区满时 producer 在此等待</text><rect x="490" y="225" width="215" height="65" rx="6" fill="var(--violet-soft)" stroke="var(--purple-deep)" stroke-width="1"></rect><text x="500" y="245" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)" fill="var(--purple-deep)">notEmpty</text><text x="500" y="261" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">等待队列:</text><circle cx="573" cy="258" r="12" fill="var(--violet-light)" stroke="var(--purple-deep)" stroke-width="1.2"></circle><text x="573" y="262" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">T8</text><text x="500" y="282" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">缓冲区空时 consumer 在此等待</text><path d="M450 245q15 0 35-27" fill="none" stroke="var(--red-deep)" stroke-width="1.5" marker-end="url(#arrow-red)"></path><text x="443" y="238" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">wait()</text><path d="M490 3e2q-45 5-85-20" fill="none" stroke="var(--green-deep)" stroke-width="1.5" marker-end="url(#arrow-green)"></path><text x="435" y="315" font-size="var(--svg-font-size-caption)" fill="var(--green-deep)">signal()</text><rect x="230" y="355" width="490" height="65" rx="6" fill="var(--sky-soft)" stroke="var(--blue-mid)" stroke-width="1"></rect><text x="245" y="375" font-size="var(--svg-font-size-caption)" fill="var(--indigo-ink)"><tspan font-weight="var(--svg-font-weight-semibold)" fill="var(--red-deep)">互斥</tspan>: 进入方法需先获得管程锁, 未获得的线程进入<tspan font-weight="var(--svg-font-weight-semibold)">入口队列</tspan></text><text x="245" y="393" font-size="var(--svg-font-size-caption)" fill="var(--indigo-ink)"><tspan font-weight="var(--svg-font-weight-semibold)" fill="var(--purple-deep)">同步</tspan>: 条件不满足时 wait() 释放锁并挂起; 其它线程 signal() 唤醒等待者</text><text x="245" y="411" font-size="var(--svg-font-size-caption)" fill="var(--indigo-ink)"><tspan font-weight="var(--svg-font-weight-semibold)" fill="var(--green-deep)">封装</tspan>: 共享数据只能被管程内的方法访问, 隐藏低层同步细节</text><text x="20" y="450" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">图例:</text><circle cx="70" cy="446" r="9" fill="var(--sky-light)" stroke="var(--indigo-deep)"></circle><text x="85" y="450" font-size="var(--svg-font-size-caption)" fill="var(--indigo-deep)">运行中的线程</text><circle cx="180" cy="446" r="9" fill="var(--red-light)" stroke="var(--red-deep)"></circle><text x="195" y="450" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">入口阻塞</text><circle cx="275" cy="446" r="9" fill="var(--violet-light)" stroke="var(--purple-deep)"></circle><text x="290" y="450" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">条件变量等待</text></svg>