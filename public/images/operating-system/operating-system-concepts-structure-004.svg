<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><text x="400" y="30" text-anchor="middle" style="font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">虚拟机架构图</text><rect x="50" y="480" width="700" height="100" fill="var(--blue-deep)" rx="8"/><text x="400" y="520" text-anchor="middle" style="font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">物理硬件 (Physical Hardware)</text><text x="400" y="545" text-anchor="middle" style="font-size: var(--svg-font-size-body)" class="svg-text svg-text-on-dark">CPU • 内存 (RAM) • 存储设备 • 网络设备</text><rect x="50" y="420" width="700" height="50" fill="var(--sky-deep)" rx="8"/><text x="400" y="440" text-anchor="middle" style="font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">Hypervisor (虚拟机监视器)</text><text x="400" y="455" text-anchor="middle" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-dark">资源管理 • 隔离 • 虚拟化</text><rect x="80" y="200" width="200" height="200" fill="var(--green-deep)" rx="8" stroke="var(--green-deep)" stroke-width="2"/><text x="180" y="225" text-anchor="middle" style="font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">虚拟机 1</text><rect x="100" y="240" width="160" height="40" fill="var(--red-deep)" rx="4"/><text x="180" y="265" text-anchor="middle" style="font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">Linux OS</text><rect x="110" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="132" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">App1</text><rect x="165" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="187" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">App2</text><rect x="220" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="242" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">Web</text><rect x="100" y="330" width="160" height="60" fill="var(--paper)" rx="4" stroke="var(--blue-light)"/><text x="180" y="350" text-anchor="middle" style="font-size: var(--svg-font-size-label);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">虚拟硬件</text><text x="180" y="365" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">vCPU: 2核</text><text x="180" y="378" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">vRAM: 4GB</text><rect x="300" y="200" width="200" height="200" fill="var(--green-deep)" rx="8" stroke="var(--green-deep)" stroke-width="2"/><text x="400" y="225" text-anchor="middle" style="font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">虚拟机 2</text><rect x="320" y="240" width="160" height="40" fill="var(--red-deep)" rx="4"/><text x="400" y="265" text-anchor="middle" style="font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">Windows OS</text><rect x="330" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="352" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">SQL</text><rect x="385" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="407" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">IIS</text><rect x="440" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="462" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">Office</text><rect x="320" y="330" width="160" height="60" fill="var(--paper)" rx="4" stroke="var(--blue-light)"/><text x="400" y="350" text-anchor="middle" style="font-size: var(--svg-font-size-label);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">虚拟硬件</text><text x="400" y="365" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">vCPU: 4核</text><text x="400" y="378" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">vRAM: 8GB</text><rect x="520" y="200" width="200" height="200" fill="var(--green-deep)" rx="8" stroke="var(--green-deep)" stroke-width="2"/><text x="620" y="225" text-anchor="middle" style="font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">虚拟机 3</text><rect x="540" y="240" width="160" height="40" fill="var(--red-deep)" rx="4"/><text x="620" y="265" text-anchor="middle" style="font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">Ubuntu OS</text><rect x="550" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="572" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">Docker</text><rect x="605" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="627" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">K8s</text><rect x="660" y="290" width="45" height="30" fill="var(--paper)" rx="3" stroke="var(--blue-light)"/><text x="682" y="309" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">DB</text><rect x="540" y="330" width="160" height="60" fill="var(--paper)" rx="4" stroke="var(--blue-light)"/><text x="620" y="350" text-anchor="middle" style="font-size: var(--svg-font-size-label);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">虚拟硬件</text><text x="620" y="365" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">vCPU: 6核</text><text x="620" y="378" text-anchor="middle" style="font-size: var(--svg-font-size-caption)" class="svg-text svg-text-on-light">vRAM: 16GB</text><line x1="180" y1="400" x2="180" y2="420" stroke="var(--indigo-deep)" stroke-width="2" stroke-dasharray="5,5"/><polygon points="175,415 180,420 185,415" fill="var(--indigo-deep)"/><line x1="400" y1="400" x2="400" y2="420" stroke="var(--indigo-deep)" stroke-width="2" stroke-dasharray="5,5"/><polygon points="395,415 400,420 405,415" fill="var(--indigo-deep)"/><line x1="620" y1="400" x2="620" y2="420" stroke="var(--indigo-deep)" stroke-width="2" stroke-dasharray="5,5"/><polygon points="615,415 620,420 625,415" fill="var(--indigo-deep)"/><line x1="400" y1="470" x2="400" y2="480" stroke="var(--blue-deep)" stroke-width="3"/><polygon points="395,475 400,480 405,475" fill="var(--blue-deep)"/><g transform="translate(50, 60)"><rect x="0" y="0" width="300" height="120" fill="var(--surface)" rx="8" stroke="var(--blue-soft)"/><text x="10" y="25" style="font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">主要功能：</text><text x="10" y="45" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 资源虚拟化与分配</text><text x="10" y="60" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 多操作系统并行运行</text><text x="10" y="75" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 虚拟机间隔离保护</text><text x="10" y="90" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 硬件资源动态调度</text><text x="10" y="105" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 快照与迁移支持</text></g><g transform="translate(450, 60)"><rect x="0" y="0" width="300" height="120" fill="var(--paper)" rx="8" stroke="var(--green-mid)"/><text x="10" y="25" style="font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">技术优势：</text><text x="10" y="45" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 提高硬件利用率</text><text x="10" y="60" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 降低运维成本</text><text x="10" y="75" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 简化环境部署</text><text x="10" y="90" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 增强系统安全性</text><text x="10" y="105" style="font-size: var(--svg-font-size-label)" class="svg-text svg-text-on-light">• 支持灾难恢复</text></g></svg>