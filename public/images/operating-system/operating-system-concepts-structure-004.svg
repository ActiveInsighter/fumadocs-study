(--svg-font-weight-bold);fill:var(--blue-deep)">虚拟硬件</text><text x="620" y="365" text-anchor="middle" style="font-size: var(--svg-font-size-caption);fill:var(--sky-deep)">vCPU: 6核</text><text x="620" y="378" text-anchor="middle" style="font-size: var(--svg-font-size-caption);fill:var(--sky-deep)">vRAM: 16GB</text><line x1="180" y1="400" x2="180" y2="420" stroke="var(--indigo-deep)" stroke-width="2" stroke-dasharray="5,5"/><polygon points="175,415 180,420 185,415" fill="var(--indigo-deep)"/><line x1="400" y1="400" x2="400" y2="420" stroke="var(--indigo-deep)" stroke-width="2" stroke-dasharray="5,5"/><polygon points="395,415 400,420 405,415" fill="var(--indigo-deep)"/><line x1="620" y1="400" x2="620" y2="420" stroke="var(--indigo-deep)" stroke-width="2" stroke-dasharray="5,5"/><polygon points="615,415 620,420 625,415" fill="var(--indigo-deep)"/><line x1="400" y1="470" x2="400" y2="480" stroke="var(--blue-deep)" stroke-width="3"/><polygon points="395,475 400,480 405,475" fill="var(--blue-deep)"/><g transform="translate(50, 60)"><rect x="0" y="0" width="300" height="120" fill="var(--surface)" rx="8" stroke="var(--blue-soft)"/><text x="10" y="25" style="font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold);fill:var(--indigo-ink)">主要功能：</text><text x="10" y="45" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 资源虚拟化与分配</text><text x="10" y="60" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 多操作系统并行运行</text><text x="10" y="75" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 虚拟机间隔离保护</text><text x="10" y="90" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 硬件资源动态调度</text><text x="10" y="105" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 快照与迁移支持</text></g><g transform="translate(450, 60)"><rect x="0" y="0" width="300" height="120" fill="var(--paper)" rx="8" stroke="var(--green-mid)"/><text x="10" y="25" style="font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold);fill:var(--indigo-ink)">技术优势：</text><text x="10" y="45" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 提高硬件利用率</text><text x="10" y="60" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 降低运维成本</text><text x="10" y="75" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 简化环境部署</text><text x="10" y="90" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 增强系统安全性</text><text x="10" y="105" style="font-size: var(--svg-font-size-label);fill:var(--blue-deep)">• 支持灾难恢复</text></g></svg>