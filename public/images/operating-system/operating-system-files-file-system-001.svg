<svg font-family="Helvetica, Arial, sans-serif" font-size="12" viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#555"></path></marker><style>.title{font-size:16px;font-weight:700;fill:#222}.stitle{font-size:13px;font-weight:700;fill:#1565c0}.lbl{font-size:11px;fill:#444}.core{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.6}.quad{fill:#fff;stroke:#90a4ae;stroke-width:1.2}.file{fill:#fff8e1;stroke:#f9a825}.folder{fill:#ffe0b2;stroke:#ef6c00}.blk-free{fill:#e8f5e9;stroke:#2e7d32}.blk-used{fill:#ffcdd2;stroke:#c62828}.app{fill:#ede7f6;stroke:#4527a0}.lock{fill:#fff3e0;stroke:#ef6c00}.conn{stroke:#666;stroke-width:1.2;fill:none}.dash{stroke:#999;stroke-width:1;stroke-dasharray:4 3;fill:none}</style></defs><text class="title" text-anchor="middle" x="410" y="26">文件系统的核心功能</text><g><circle class="core" cx="410" cy="245" r="60"></circle><text class="stitle" text-anchor="middle" x="410" y="240">File System</text><text class="lbl" text-anchor="middle" x="410" y="260">文件系统</text></g><line class="conn" marker-end="url(#ar)" x1="360" x2="230" y1="210" y2="130"></line><line class="conn" marker-end="url(#ar)" x1="460" x2="590" y1="210" y2="130"></line><line class="conn" marker-end="url(#ar)" x1="360" x2="230" y1="280" y2="360"></line><line class="conn" marker-end="url(#ar)" x1="460" x2="590" y1="280" y2="360"></line><g transform="translate(40,60)"><rect class="quad" height="150" rx="8" width="270" x="0" y="0"></rect><text class="stitle" x="14" y="22">① 数据组织</text><g transform="translate(20,34)"><rect class="folder" height="24" rx="3" width="42" x="0" y="0"></rect><text class="lbl" text-anchor="middle" x="21" y="16">/</text><path class="dash" d="M21 24V44H85"></path><path class="dash" d="M21 44V78H85"></path><path class="dash" d="M106 56V90h64"></path><rect class="folder" height="24" rx="3" width="42" x="85" y="32"></rect><text