<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="var(--svg-font-family-mono)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--sky-deep)"/></marker><linearGradient id="gApp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--yellow-soft)"/><stop offset="1" stop-color="var(--yellow-mid)"/></linearGradient><linearGradient id="gLib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky-soft)"/><stop offset="1" stop-color="var(--blue-mid)"/></linearGradient><linearGradient id="gSys" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--green-light)"/><stop offset="1" stop-color="var(--green-mid)"/></linearGradient><style>.h1{fill:var(--violet-deep);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);font-family: var(--svg-font-family)}.sub{fill:var(--sky-deep);font-size: var(--svg-font-size-label);font-family: var(--svg-font-family)}.lay{fill:var(--cyan-ink);font-size: var(--svg-font-size-label);font-weight: var(--svg-font-weight-bold);font-family: var(--svg-font-family)}.zh{fill:var(--sky-ink);font-size: var(--svg-font-size-caption);font-family: var(--svg-font-family)}.code{fill:var(--violet-deep);font-size: var(--svg-font-size-label);font-family: var(--svg-font-family-mono)}.code-d{fill:var(--sky-deep);font-size: var(--svg-font-size-caption);font-family: var(--svg-font-family-mono)}.tag{fill:var(--red-deep);font-size: var(--svg-font-size-caption);font-weight: var(--svg-font-weight-bold);font-family: var(--svg-font-family)}.arrow-l{fill:var(--violet-deep);font-size: var(--svg-font-size-caption);font-weight: var(--svg-font-weight-semibold);font-family: var(--svg-font-family-mono)}.arrow-r{fill:var(--lime-deep);font-size: var(--svg-font-size-caption);font-weight: var(--svg-font-weight-semibold);font-family: var(--svg-font-family-mono)}</style></defs><text x="430" y="26" text-anchor="middle" class="h1">用户层 I/O 软件</text><text x="430" y="46" text-anchor="middle" class="sub">把"简单的库调用"翻译成"复杂的系统调用"，向下陷入内核</text><rect x="40" y="70" width="780" height="70" rx="8" fill="url(#gApp)" stroke="var(--yellow-mid)"/><text x="52" y="90" class="lay">应用程序</text><text x="60" y="112" class="code">printf("hello %d", n);</text><text x="260" y="112" class="code">fgets(buf, 128, stdin);</text><text x="490" y="112" class="code">fwrite(&amp;s, sizeof s, 1, fp);</text><text x="60" y="130" class="code-d">// 想的是"输出一段话"，不关心设备</text><line x1="430" y1="140" x2="430" y2="168" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><text x="440" y="158" class="zh">调用库函数</text><rect x="40" y="170" width="780" height="150" rx="10" fill="url(#gLib)" stroke="var(--violet-deep)" stroke-width="1.4"/><text x="52" y="190" class="lay">用户层 I/O 软件（库 / 运行时）</text><text x="200" y="190" class="tag">运行在用户态</text><g><rect x="55" y="205" width="185" height="100" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="65" y="222" class="zh">① 格式化 / 解析</text><text x="65" y="242" class="code">printf</text><text x="65" y="258" class="code">scanf</text><text x="65" y="274" class="code">sprintf</text><text x="65" y="290" class="code">atoi / strtol</text></g><g><rect x="250" y="205" width="185" height="100" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="260" y="222" class="zh">② 用户级缓冲</text><text x="260" y="242" class="code">fopen / fclose</text><text x="260" y="258" class="code">fread / fwrite</text><text x="260" y="274" class="code">fflush</text><text x="260" y="290" class="code">setvbuf</text></g><g><rect x="445" y="205" width="185" height="100" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="455" y="222" class="zh">③ 交互 / 终端</text><text x="455" y="242" class="code">readline</text><text x="455" y="258" class="code">getchar / getch</text><text x="455" y="274" class="code">isatty</text><text x="455" y="290" class="code">ncurses</text></g><g><rect x="640" y="205" width="165" height="100" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="650" y="222" class="zh">④ 假脱机 SPOOLing</text><text x="650" y="242" class="code">lp / lpr</text><text x="650" y="258" class="code">at / batch</text><text x="650" y="274" class="code-d">// 独占设备</text><text x="650" y="290" class="code-d">// 变共享</text></g><line x1="430" y1="320" x2="430" y2="350" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><text x="440" y="340" class="zh">陷入内核（trap / syscall）</text><line x1="40" y1="352" x2="820" y2="352" stroke="var(--red-deep)" stroke-width="1.4" stroke-dasharray="5 4"/><text x="820" y="348" text-anchor="end" class="tag">─── 用户态 / 内核态分界 ───</text><rect x="40" y="360" width="780" height="66" rx="8" fill="url(#gSys)" stroke="var(--lime-deep)"/><text x="52" y="380" class="lay">系统调用接口（POSIX）</text><text x="60" y="402" class="code">open</text><text x="130" y="402" class="code">read</text><text x="200" y="402" class="code">write</text><text x="275" y="402" class="code">close</text><text x="350" y="402" class="code">lseek</text><text x="420" y="402" class="code">ioctl</text><text x="490" y="402" class="code">dup / dup2</text><text x="595" y="402" class="code">pipe</text><text x="655" y="402" class="code">mmap</text><text x="725" y="402" class="code">select / poll</text><text x="60" y="420" class="code-d">// 数量少、原语级、直接进入设备独立性软件</text></svg>