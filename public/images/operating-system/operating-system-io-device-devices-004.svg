<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="var(--svg-font-family-mono)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--sky-deep)"/></marker><style>.h1{fill:var(--violet-deep);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);font-family: var(--svg-font-family)}.sub{fill:var(--sky-deep);font-size: var(--svg-font-size-label);font-family: var(--svg-font-family)}.lay{fill:var(--cyan-ink);font-size: var(--svg-font-size-label);font-weight: var(--svg-font-weight-bold);font-family: var(--svg-font-family)}.zh{fill:var(--sky-ink);font-size: var(--svg-font-size-caption);font-family: var(--svg-font-family)}.code{fill:var(--violet-deep);font-size: var(--svg-font-size-label);font-family: var(--svg-font-family-mono)}.code-d{fill:var(--sky-deep);font-size: var(--svg-font-size-caption);font-family: var(--svg-font-family-mono)}.tag{fill:var(--red-deep);font-size: var(--svg-font-size-caption);font-weight: var(--svg-font-weight-bold);font-family: var(--svg-font-family)}.arrow-l{fill:var(--violet-deep);font-size: var(--svg-font-size-caption);font-weight: var(--svg-font-weight-semibold);font-family: var(--svg-font-family-mono)}.arrow-r{fill:var(--lime-deep);font-size: var(--svg-font-size-caption);font-weight: var(--svg-font-weight-semibold);font-family: var(--svg-font-family-mono)}</style></defs><text x="430" y="26" text-anchor="middle" class="h1 svg-text svg-text-theme">用户层 I/O 软件</text><text x="430" y="46" text-anchor="middle" class="sub svg-text svg-text-theme">把"简单的库调用"翻译成"复杂的系统调用"，向下陷入内核</text><rect x="40" y="70" width="780" height="70" rx="8" fill="var(--yellow-deep)" stroke="var(--yellow-mid)"/><text x="52" y="90" class="lay svg-text svg-text-on-dark">应用程序</text><text x="60" y="112" class="code svg-text svg-text-on-dark">printf("hello %d", n);</text><text x="260" y="112" class="code svg-text svg-text-on-dark">fgets(buf, 128, stdin);</text><text x="490" y="112" class="code svg-text svg-text-on-dark">fwrite(&amp;s, sizeof s, 1, fp);</text><text x="60" y="130" class="code-d svg-text svg-text-on-dark">// 想的是"输出一段话"，不关心设备</text><line x1="430" y1="140" x2="430" y2="168" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><text x="440" y="158" class="zh svg-text svg-text-theme">调用库函数</text><rect x="40" y="170" width="780" height="150" rx="10" fill="var(--sky-deep)" stroke="var(--violet-deep)" stroke-width="1.4"/><text x="52" y="190" class="lay svg-text svg-text-on-dark">用户层 I/O 软件（库 / 运行时）</text><text x="200" y="190" class="tag svg-text svg-text-on-dark">运行在用户态</text><g><rect x="55" y="205" width="185" height="100" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="65" y="222" class="zh svg-text svg-text-on-light">① 格式化 / 解析</text><text x="65" y="242" class="code svg-text svg-text-on-light">printf</text><text x="65" y="258" class="code svg-text svg-text-on-light">scanf</text><text x="65" y="274" class="code svg-text svg-text-on-light">sprintf</text><text x="65" y="290" class="code svg-text svg-text-on-light">atoi / strtol</text></g><g><rect x="250" y="205" width="185" height="100" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="260" y="222" class="zh svg-text svg-text-on-light">② 用户级缓冲</text><text x="260" y="242" class="code svg-text svg-text-on-light">fopen / fclose</text><text x="260" y="258" class="code svg-text svg-text-on-light">fread / fwrite</text><text x="260" y="274" class="code svg-text svg-text-on-light">fflush</text><text x="260" y="290" class="code svg-text svg-text-on-light">setvbuf</text></g><g><rect x="445" y="205" width="185" height="100" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="455" y="222" class="zh svg-text svg-text-on-light">③ 交互 / 终端</text><text x="455" y="242" class="code svg-text svg-text-on-light">readline</text><text x="455" y="258" class="code svg-text svg-text-on-light">getchar / getch</text><text x="455" y="274" class="code svg-text svg-text-on-light">isatty</text><text x="455" y="290" class="code svg-text svg-text-on-light">ncurses</text></g><g><rect x="640" y="205" width="165" height="100" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="650" y="222" class="zh svg-text svg-text-on-light">④ 假脱机 SPOOLing</text><text x="650" y="242" class="code svg-text svg-text-on-light">lp / lpr</text><text x="650" y="258" class="code svg-text svg-text-on-light">at / batch</text><text x="650" y="274" class="code-d svg-text svg-text-on-light">// 独占设备</text><text x="650" y="290" class="code-d svg-text svg-text-on-light">// 变共享</text></g><line x1="430" y1="320" x2="430" y2="350" stroke="var(--sky-deep)" stroke-width="1.6" marker-end="url(#a)"/><text x="440" y="340" class="zh svg-text svg-text-theme">陷入内核（trap / syscall）</text><line x1="40" y1="352" x2="820" y2="352" stroke="var(--red-deep)" stroke-width="1.4" stroke-dasharray="5 4"/><text x="820" y="348" text-anchor="end" class="tag svg-text svg-text-theme">─── 用户态 / 内核态分界 ───</text><rect x="40" y="360" width="780" height="66" rx="8" fill="var(--green-deep)" stroke="var(--lime-deep)"/><text x="52" y="380" class="lay svg-text svg-text-on-dark">系统调用接口（POSIX）</text><text x="60" y="402" class="code svg-text svg-text-on-dark">open</text><text x="130" y="402" class="code svg-text svg-text-on-dark">read</text><text x="200" y="402" class="code svg-text svg-text-on-dark">write</text><text x="275" y="402" class="code svg-text svg-text-on-dark">close</text><text x="350" y="402" class="code svg-text svg-text-on-dark">lseek</text><text x="420" y="402" class="code svg-text svg-text-on-dark">ioctl</text><text x="490" y="402" class="code svg-text svg-text-on-dark">dup / dup2</text><text x="595" y="402" class="code svg-text svg-text-on-dark">pipe</text><text x="655" y="402" class="code svg-text svg-text-on-dark">mmap</text><text x="725" y="402" class="code svg-text svg-text-on-dark">select / poll</text><text x="60" y="420" class="code-d svg-text svg-text-on-dark">// 数量少、原语级、直接进入设备独立性软件</text></svg>