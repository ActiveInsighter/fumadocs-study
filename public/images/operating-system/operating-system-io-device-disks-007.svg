<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="var(--svg-font-family)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><radialGradient id="platter" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="var(--paper)"/><stop offset="70%" stop-color="var(--blue-light)"/><stop offset="100%" stop-color="var(--blue-mid)"/></radialGradient><linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--purple-deep)"/><stop offset="100%" stop-color="var(--violet-mid)"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".18"/></filter></defs><text x="380" y="32" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--ink)">多个读写请求分布在不同磁道上</text><text x="380" y="54" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-deep)">磁头每次只能处理一个请求 — 服务顺序直接影响寻道开销</text><g transform="translate(230,240)" filter="url(#sh)"><circle r="130" fill="url(#platter)" stroke="var(--blue-deep)" stroke-width="1.5"/><g fill="none" stroke="var(--blue-mid)" stroke-width=".8" stroke-dasharray="2 3" opacity=".7"><circle r="115"/><circle r="100"/><circle r="85"/><circle r="70"/><circle r="55"/><circle r="40"/></g><circle r="14" fill="var(--blue-ink)"/><circle r="5" fill="var(--blue-mid)"/><g><circle cx="41.7" cy="-114.7" r="6" fill="var(--red-deep)" stroke="var(--surface)" stroke-width="1.5"/><text x="49" y="-122" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--red-deep)">18</text></g><g><circle cx="45.6" cy="97.9" r="6" fill="var(--yellow-mid)" stroke="var(--surface)" stroke-width="1.5"/><text x="54" y="112" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--orange-deep)">39</text></g><g><circle cx="-83.4" cy="38.9" r="6" fill="var(--green-mid)" stroke="var(--surface)" stroke-width="1.5"/><text x="-104" y="42" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--mint-deep)">55</text></g><g><circle cx="-70.5" cy="-25.7" r="6" fill="var(--sky-mid)" stroke="var(--surface)" stroke-width="1.5"/><text x="-90" y="-28" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--sky-deep)">90</text></g><g><circle cx="54.5" cy="19.8" r="6" fill="var(--violet-mid)" stroke="var(--surface)" stroke-width="1.5"/><text x="50" y="38" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--purple-deep)">150</text></g><g><circle cx="-16.4" cy="45.1" r="6" fill="var(--purple-deep)" stroke="var(--surface)" stroke-width="1.5"/><text x="-32" y="60" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--purple-deep)">160</text></g><g><circle cx="-14.8" cy="-31.7" r="6" fill="var(--rose-deep)" stroke="var(--surface)" stroke-width="1.5"/><text x="-32" y="-36" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--rose-deep)">184</text></g><g><rect x="60" y="-6" width="160" height="12" rx="3" fill="url(#head)" opacity=".92"/><circle cx="220" cy="0" r="10" fill="var(--indigo-ink)"/><polygon points="62,-3 62,3 50,0" fill="var(--purple-deep)"/><text x="150" y="-12" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" fill="var(--purple-deep)">读写磁头</text></g><text x="0" y="-138" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">外圈 (磁道号小)</text><text x="0" y="32" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">内圈 (磁道号大)</text><text x="-150" y="-150" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-mid)" opacity=".75">?</text><text x="155" y="155" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-mid)" opacity=".75">?</text></g><g transform="translate(430,100)"><text x="0" y="0" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--ink)">等待服务的请求队列</text><rect x="0" y="14" width="290" height="58" rx="10" fill="var(--surface)" stroke="var(--blue-light)"/><g font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)"><rect x="10" y="26" width="34" height="32" rx="6" fill="var(--red-soft)"/><text x="27" y="47" text-anchor="middle" fill="var(--red-deep)">18</text><rect x="50" y="26" width="34" height="32" rx="6" fill="var(--amber-soft)"/><text x="67" y="47" text-anchor="middle" fill="var(--orange-deep)">39</text><rect x="90" y="26" width="34" height="32" rx="6" fill="var(--green-light)"/><text x="107" y="47" text-anchor="middle" fill="var(--mint-deep)">55</text><rect x="130" y="26" width="34" height="32" rx="6" fill="var(--cyan-soft)"/><text x="147" y="47" text-anchor="middle" fill="var(--sky-deep)">90</text><rect x="170" y="26" width="40" height="32" rx="6" fill="var(--blue-soft)"/><text x="190" y="47" text-anchor="middle" fill="var(--purple-deep)">150</text><rect x="216" y="26" width="40" height="32" rx="6" fill="var(--violet-soft)"/><text x="236" y="47" text-anchor="middle" fill="var(--purple-deep)">160</text></g><text x="0" y="110" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--ink)">核心问题</text><foreignObject x="0" y="120" width="300" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: var(--svg-font-size-label);color:var(--blue-ink);line-height:1.6;font-family: var(--svg-font-family)">
        多条请求落在<b style="color:var(--purple-deep)">不同磁道</b>上，磁头一次只能在一条磁道上工作。<br />
        以怎样的顺序服务这些请求，将直接影响<b style="color:var(--red-deep)">寻道距离</b>与<b style="color:var(--red-deep)">平均响应时间</b>。
      </div>
    </foreignObject><g transform="translate(0,240)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)"><rect x="0" y="0" width="60" height="26" rx="13" fill="var(--paper-warm)" stroke="var(--orange-mid)"/><text x="30" y="17" text-anchor="middle" fill="var(--coral-deep)">FCFS</text><rect x="68" y="0" width="60" height="26" rx="13" fill="var(--paper)" stroke="var(--sky-mid)"/><text x="98" y="17" text-anchor="middle" fill="var(--sky-deep)">SSTF</text><rect x="136" y="0" width="60" height="26" rx="13" fill="var(--sky-soft)" stroke="var(--violet-mid)"/><text x="166" y="17" text-anchor="middle" fill="var(--purple-deep)">SCAN</text><rect x="204" y="0" width="80" height="26" rx="13" fill="var(--violet-soft)" stroke="var(--violet-mid)"/><text x="244" y="17" text-anchor="middle" fill="var(--purple-deep)">C-SCAN</text><text x="0" y="46" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">不同调度算法 → 不同的访问顺序与开销</text></g></g></svg>