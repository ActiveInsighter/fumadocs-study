<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><radialGradient id="platter" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f1f5f9"/><stop offset="70%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/></radialGradient><linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".18"/></filter></defs><text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">多个读写请求分布在不同磁道上</text><text x="380" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">磁头每次只能处理一个请求 — 服务顺序直接影响寻道开销</text><g transform="translate(230,240)" filter="url(#sh)"><circle r="130" fill="url(#platter)" stroke="#64748b" stroke-width="1.5"/><g fill="none" stroke="#94a3b8" stroke-width=".8" stroke-dasharray="2 3" opacity=".7"><circle r="115"/><circle r="100"/><circle r="85"/><circle r="70"/><circle r="55"/><circle r="40"/></g><circle r="14" fill="#334155"/><circle r="5" fill="#94a3b8"/><g><circle cx="41.7" cy="-114.7" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5"/><text x="49" y="-122" font-size="11" font-weight="600" fill="#b91c1c">18</text></g><g><circle cx="45.6" cy="97.9" r="6" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="54" y="112" font-size="11" font-weight="600" fill="#b45309">39</text></g><g><circle cx="-83.4" cy="38.9" r="6" fill="#10b981" stroke="#fff" stroke-width="1.5"/><text x="-104" y="42" font-size="11" font-weight="600" fill="#047857">55</text></g><g><circle cx="-70.5" cy="-25.7" r="6" fill="#06b6d4" stroke="#fff" stroke-width="1.5"/><text x="-90" y="-28" font-size="11" font-weight="600" fill="#0e7490">90</text></g><g><circle cx="54.5" cy="19.8" r="6" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/><text x="50" y="38" font-size="11" font-weight="600" fill="#1d4ed8">150</text></g><g><circle cx="-16.4" cy="45.1" r="6" fill="#8b5cf6" stroke="#fff" stroke-width="1.5"/><text x="-32" y="60" font-size="11" font-weight="600" fill="#6d28d9">160</text></g><g><circle cx="-14.8" cy="-31.7" r="6" fill="#ec4899" stroke="#fff" stroke-width="1.5"/><text x="-32" y="-36" font-size="11" font-weight="600" fill="#be185d">184</text></g><g><rect x="60" y="-6" width="160" height="12" rx="3" fill="url(#head)" opacity=".92"/><circle cx="220" cy="0" r="10" fill="#1e293b"/><polygon points="62,-3 62,3 50,0" fill="#7c3aed"/><text x="150" y="-12" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5b21b6">读写磁头</text></g><text x="0" y="-138" text-anchor="middle" font-size="10" fill="#64748b">外圈 (磁道号小)</text><text x="0" y="32" text-anchor="middle" font-size="10" fill="#64748b">内圈 (磁道号大)</text><text x="-150" y="-150" font-size="28" font-weight="700" fill="#f97316" opacity=".75">?</text><text x="155" y="155" font-size="28" font-weight="700" fill="#f97316" opacity=".75">?</text></g><g transform="translate(430,100)"><text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">等待服务的请求队列</text><rect x="0" y="14" width="290" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><g font-size="13" font-weight="600"><rect x="10" y="26" width="34" height="32" rx="6" fill="#fee2e2"/><text x="27" y="47" text-anchor="middle" fill="#b91c1c">18</text><rect x="50" y="26" width="34" height="32" rx="6" fill="#fef3c7"/><text x="67" y="47" text-anchor="middle" fill="#b45309">39</text><rect x="90" y="26" width="34" height="32" rx="6" fill="#d1fae5"/><text x="107" y="47" text-anchor="middle" fill="#047857">55</text><rect x="130" y="26" width="34" height="32" rx="6" fill="#cffafe"/><text x="147" y="47" text-anchor="middle" fill="#0e7490">90</text><rect x="170" y="26" width="40" height="32" rx="6" fill="#dbeafe"/><text x="190" y="47" text-anchor="middle" fill="#1d4ed8">150</text><rect x="216" y="26" width="40" height="32" rx="6" fill="#ede9fe"/><text x="236" y="47" text-anchor="middle" fill="#6d28d9">160</text></g><text x="0" y="110" font-size="14" font-weight="700" fill="#0f172a">核心问题</text><foreignObject x="0" y="120" width="300" height="100">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12.5px;color:#334155;line-height:1.6;font-family:inherit">
        多条请求落在<b style="color:#7c3aed">不同磁道</b>上，磁头一次只能在一条磁道上工作。<br />
        以怎样的顺序服务这些请求，将直接影响<b style="color:#ef4444">寻道距离</b>与<b style="color:#ef4444">平均响应时间</b>。
      </div>
    </foreignObject><g transform="translate(0,240)" font-size="11.5" font-weight="600"><rect x="0" y="0" width="60" height="26" rx="13" fill="#fff7ed" stroke="#fb923c"/><text x="30" y="17" text-anchor="middle" fill="#c2410c">FCFS</text><rect x="68" y="0" width="60" height="26" rx="13" fill="#ecfeff" stroke="#22d3ee"/><text x="98" y="17" text-anchor="middle" fill="#0e7490">SSTF</text><rect x="136" y="0" width="60" height="26" rx="13" fill="#eff6ff" stroke="#60a5fa"/><text x="166" y="17" text-anchor="middle" fill="#1d4ed8">SCAN</text><rect x="204" y="0" width="80" height="26" rx="13" fill="#fdf4ff" stroke="#c084fc"/><text x="244" y="17" text-anchor="middle" fill="#7e22ce">C-SCAN</text><text x="0" y="46" font-size="11" fill="#64748b">不同调度算法 → 不同的访问顺序与开销</text></g></g></svg>