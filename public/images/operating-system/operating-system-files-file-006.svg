<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="var(--svg-font-family)" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--surface)"/><stop offset="1" stop-color="var(--sky-soft)"/></linearGradient><linearGradient id="gOpen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--violet-mid)"/><stop offset="1" stop-color="var(--violet-deep)"/></linearGradient><linearGradient id="gRead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--mint-mid)"/><stop offset="1" stop-color="var(--mint-deep)"/></linearGradient><linearGradient id="gWrite" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--orange-mid)"/><stop offset="1" stop-color="var(--orange-mid)"/></linearGradient><linearGradient id="gSeek" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--violet-mid)"/><stop offset="1" stop-color="var(--purple-deep)"/></linearGradient><linearGradient id="gClose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--rose-mid)"/><stop offset="1" stop-color="var(--red-deep)"/></linearGradient><linearGradient id="gKernel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--surface)"/><stop offset="1" stop-color="var(--sky-soft)"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--blue-deep)"/></marker></defs><rect width="880" height="460" fill="url(#bg)"/><text x="440" y="36" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">文件系统调用 · 操作逻辑</text><text x="440" y="56" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--indigo-deep)">open → read / write / lseek → close</text><g filter="url(#shadow)"><rect x="40" y="90" width="170" height="320" rx="14" fill="var(--surface)" stroke="var(--indigo-soft)"/></g><text x="125" y="115" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">用户进程</text><text x="125" y="132" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--indigo-mid)">User Space</text><g font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)" fill="var(--surface)"><g><rect x="60" y="150" width="130" height="36" rx="18" fill="url(#gOpen)"/><text x="125" y="173" text-anchor="middle">open()</text></g><g><rect x="60" y="196" width="130" height="36" rx="18" fill="url(#gRead)"/><text x="125" y="219" text-anchor="middle">read()</text></g><g><rect x="60" y="242" width="130" height="36" rx="18" fill="url(#gWrite)"/><text x="125" y="265" text-anchor="middle">write()</text></g><g><rect x="60" y="288" width="130" height="36" rx="18" fill="url(#gSeek)"/><text x="125" y="311" text-anchor="middle">lseek()</text></g><g><rect x="60" y="334" width="130" height="36" rx="18" fill="url(#gClose)"/><text x="125" y="357" text-anchor="middle">close()</text></g></g><g filter="url(#shadow)"><rect x="260" y="90" width="430" height="320" rx="14" fill="url(#gKernel)" stroke="var(--indigo-soft)"/></g><text x="475" y="115" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">内核</text><text x="475" y="132" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--indigo-mid)">Kernel Space</text><g><line x1="195" y1="168" x2="270" y2="168" stroke="var(--blue-deep)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="150" width="405" height="36" rx="8" fill="var(--blue-soft)" stroke="var(--blue-light)"/><circle cx="293" cy="168" r="6" fill="url(#gOpen)"/><text x="308" y="172" font-size="var(--svg-font-size-label)" fill="var(--indigo-ink)">检查权限 → 加载 inode → 建表项 → 返回<tspan font-weight="var(--svg-font-weight-bold)">fd</tspan></text></g><g><line x1="195" y1="214" x2="270" y2="214" stroke="var(--blue-deep)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="196" width="405" height="36" rx="8" fill="var(--mint-soft)" stroke="var(--mint-light)"/><circle cx="293" cy="214" r="6" fill="url(#gRead)"/><text x="308" y="218" font-size="var(--svg-font-size-label)" fill="var(--indigo-ink)">页缓存命中? → 命中即拷回；未命中则读盘 +<tspan font-weight="var(--svg-font-weight-bold)">预读</tspan></text></g><g><line x1="195" y1="260" x2="270" y2="260" stroke="var(--blue-deep)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="242" width="405" height="36" rx="8" fill="var(--orange-soft)" stroke="var(--amber-light)"/><circle cx="293" cy="260" r="6" fill="url(#gWrite)"/><text x="308" y="264" font-size="var(--svg-font-size-label)" fill="var(--indigo-ink)">写入页缓存（置脏）→<tspan font-weight="var(--svg-font-weight-bold)">延迟写</tspan>，必要时 fsync 刷盘</text></g><g><line x1="195" y1="306" x2="270" y2="306" stroke="var(--blue-deep)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="288" width="405" height="36" rx="8" fill="var(--violet-soft)" stroke="var(--violet-light)"/><circle cx="293" cy="306" r="6" fill="url(#gSeek)"/><text x="308" y="310" font-size="var(--svg-font-size-label)" fill="var(--indigo-ink)">移动偏移量（不读写）→ 支持<tspan font-weight="var(--svg-font-weight-bold)">随机访问</tspan></text></g><g><line x1="195" y1="352" x2="270" y2="352" stroke="var(--blue-deep)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="334" width="405" height="36" rx="8" fill="var(--rose-soft)" stroke="var(--rose-light)"/><circle cx="293" cy="352" r="6" fill="url(#gClose)"/><text x="308" y="356" font-size="var(--svg-font-size-label)" fill="var(--indigo-ink)">引用计数 -1 → 归零则释放表项与 inode 缓存</text></g><g filter="url(#shadow)"><rect x="710" y="90" width="130" height="320" rx="14" fill="var(--surface)" stroke="var(--indigo-soft)"/></g><text x="775" y="115" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">磁盘</text><text x="775" y="132" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--indigo-mid)">Storage</text><g transform="translate(775,260)"><ellipse cx="0" cy="-40" rx="42" ry="10" fill="var(--indigo-light)"/><path d="M-42-40V40a42 10 0 0084 0V-40z" fill="var(--indigo-soft)" stroke="var(--indigo-light)"/><ellipse cx="0" cy="-40" rx="42" ry="10" fill="var(--paper)" stroke="var(--indigo-light)"/><ellipse cx="0" cy="0" rx="42" ry="10" fill="none" stroke="var(--indigo-light)" stroke-dasharray="2 3"/><ellipse cx="0" cy="40" rx="42" ry="10" fill="none" stroke="var(--indigo-light)" stroke-dasharray="2 3"/></g><g stroke="var(--indigo-mid)" stroke-dasharray="4 4" fill="none"><path d="M680 214c20 0 20 16 40 16" marker-end="url(#arr)"/><path d="M720 290c-20 0-20-30-40-30" marker-end="url(#arr)"/></g><text x="700" y="206" font-size="var(--svg-font-size-caption)" fill="var(--indigo-mid)">读盘</text><text x="700" y="302" font-size="var(--svg-font-size-caption)" fill="var(--indigo-mid)">刷盘</text><g font-size="var(--svg-font-size-caption)" fill="var(--indigo-deep)"><rect x="40" y="430" width="800" height=".5" fill="var(--indigo-soft)"/><text x="40" y="450">每次操作均经由内核维护的<tspan font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">文件描述符表 / 系统打开文件表 / inode 表</tspan>协同完成。</text></g></svg>