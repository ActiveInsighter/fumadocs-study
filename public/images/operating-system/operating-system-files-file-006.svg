<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafbff"/><stop offset="1" stop-color="#eef1f8"/></linearGradient><linearGradient id="gOpen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f9df7"/><stop offset="1" stop-color="#2b6dd3"/></linearGradient><linearGradient id="gRead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ec8a4"/><stop offset="1" stop-color="#2f9c7a"/></linearGradient><linearGradient id="gWrite" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3a35c"/><stop offset="1" stop-color="#d97a2c"/></linearGradient><linearGradient id="gSeek" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b58af0"/><stop offset="1" stop-color="#7e4dc7"/></linearGradient><linearGradient id="gClose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0788a"/><stop offset="1" stop-color="#c64259"/></linearGradient><linearGradient id="gKernel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f1f4fb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5b6478"/></marker></defs><rect width="880" height="460" fill="url(#bg)"/><text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2b3556">文件系统调用 · 操作逻辑</text><text x="440" y="56" text-anchor="middle" font-size="12" fill="#6a7390">open → read / write / lseek → close</text><g filter="url(#shadow)"><rect x="40" y="90" width="170" height="320" rx="14" fill="#fff" stroke="#dfe4f0"/></g><text x="125" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#2b3556">用户进程</text><text x="125" y="132" text-anchor="middle" font-size="11" fill="#8a92a8">User Space</text><g font-size="13" font-weight="600" fill="#fff"><g><rect x="60" y="150" width="130" height="36" rx="18" fill="url(#gOpen)"/><text x="125" y="173" text-anchor="middle">open()</text></g><g><rect x="60" y="196" width="130" height="36" rx="18" fill="url(#gRead)"/><text x="125" y="219" text-anchor="middle">read()</text></g><g><rect x="60" y="242" width="130" height="36" rx="18" fill="url(#gWrite)"/><text x="125" y="265" text-anchor="middle">write()</text></g><g><rect x="60" y="288" width="130" height="36" rx="18" fill="url(#gSeek)"/><text x="125" y="311" text-anchor="middle">lseek()</text></g><g><rect x="60" y="334" width="130" height="36" rx="18" fill="url(#gClose)"/><text x="125" y="357" text-anchor="middle">close()</text></g></g><g filter="url(#shadow)"><rect x="260" y="90" width="430" height="320" rx="14" fill="url(#gKernel)" stroke="#dfe4f0"/></g><text x="475" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#2b3556">内核</text><text x="475" y="132" text-anchor="middle" font-size="11" fill="#8a92a8">Kernel Space</text><g><line x1="195" y1="168" x2="270" y2="168" stroke="#5b6478" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="150" width="405" height="36" rx="8" fill="#eaf2fe" stroke="#bcd3f5"/><circle cx="293" cy="168" r="6" fill="url(#gOpen)"/><text x="308" y="172" font-size="12" fill="#2b3556">检查权限 → 加载 inode → 建表项 → 返回<tspan font-weight="700">fd</tspan></text></g><g><line x1="195" y1="214" x2="270" y2="214" stroke="#5b6478" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="196" width="405" height="36" rx="8" fill="#e8f6ef" stroke="#bfe1d0"/><circle cx="293" cy="214" r="6" fill="url(#gRead)"/><text x="308" y="218" font-size="12" fill="#2b3556">页缓存命中? → 命中即拷回；未命中则读盘 +<tspan font-weight="700">预读</tspan></text></g><g><line x1="195" y1="260" x2="270" y2="260" stroke="#5b6478" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="242" width="405" height="36" rx="8" fill="#fdf0e2" stroke="#f3cfa5"/><circle cx="293" cy="260" r="6" fill="url(#gWrite)"/><text x="308" y="264" font-size="12" fill="#2b3556">写入页缓存（置脏）→<tspan font-weight="700">延迟写</tspan>，必要时 fsync 刷盘</text></g><g><line x1="195" y1="306" x2="270" y2="306" stroke="#5b6478" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="288" width="405" height="36" rx="8" fill="#f1ebfb" stroke="#d6c4f0"/><circle cx="293" cy="306" r="6" fill="url(#gSeek)"/><text x="308" y="310" font-size="12" fill="#2b3556">移动偏移量（不读写）→ 支持<tspan font-weight="700">随机访问</tspan></text></g><g><line x1="195" y1="352" x2="270" y2="352" stroke="#5b6478" stroke-width="1.5" marker-end="url(#arr)"/><rect x="275" y="334" width="405" height="36" rx="8" fill="#fde7eb" stroke="#f3bcc5"/><circle cx="293" cy="352" r="6" fill="url(#gClose)"/><text x="308" y="356" font-size="12" fill="#2b3556">引用计数 -1 → 归零则释放表项与 inode 缓存</text></g><g filter="url(#shadow)"><rect x="710" y="90" width="130" height="320" rx="14" fill="#fff" stroke="#dfe4f0"/></g><text x="775" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#2b3556">磁盘</text><text x="775" y="132" text-anchor="middle" font-size="11" fill="#8a92a8">Storage</text><g transform="translate(775,260)"><ellipse cx="0" cy="-40" rx="42" ry="10" fill="#cfd6e6"/><path d="M-42-40V40a42 10 0 0084 0V-40z" fill="#e3e8f3" stroke="#cfd6e6"/><ellipse cx="0" cy="-40" rx="42" ry="10" fill="#f4f6fc" stroke="#cfd6e6"/><ellipse cx="0" cy="0" rx="42" ry="10" fill="none" stroke="#cfd6e6" stroke-dasharray="2 3"/><ellipse cx="0" cy="40" rx="42" ry="10" fill="none" stroke="#cfd6e6" stroke-dasharray="2 3"/></g><g stroke="#9ea7be" stroke-dasharray="4 4" fill="none"><path d="M680 214c20 0 20 16 40 16" marker-end="url(#arr)"/><path d="M720 290c-20 0-20-30-40-30" marker-end="url(#arr)"/></g><text x="700" y="206" font-size="10" fill="#8a92a8">读盘</text><text x="700" y="302" font-size="10" fill="#8a92a8">刷盘</text><g font-size="11" fill="#6a7390"><rect x="40" y="430" width="800" height=".5" fill="#dfe4f0"/><text x="40" y="450">每次操作均经由内核维护的<tspan font-weight="700" fill="#2b3556">文件描述符表 / 系统打开文件表 / inode 表</tspan>协同完成。</text></g></svg>