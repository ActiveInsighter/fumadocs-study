<svg viewBox="0 0 880 330" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><style>text{fill:var(--ink)}.h{font-weight: var(--svg-font-weight-bold)}.user{fill:var(--sky-soft);stroke:var(--violet-mid)}.kernel{fill:var(--yellow-soft);stroke:var(--orange-mid)}.ivt{fill:var(--violet-soft);stroke:var(--purple-deep)}.handler{fill:var(--green-soft);stroke:var(--lime-mid)}.arrow{stroke:var(--neutral-deep);stroke-width:1.5;fill:none;marker-end:url(#a)}.ret{stroke:var(--violet-mid);stroke-width:1.5;fill:none;marker-end:url(#b);stroke-dasharray:5 3}.mono{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-caption)}.lbl{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}.divider{stroke:var(--red-deep);stroke-width:1.2;stroke-dasharray:4 4}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-deep)"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet-mid)"/></marker></defs><text x="440" y="26" text-anchor="middle" font-size="var(--svg-font-size-title)" class="h">陷阱指令 INT n 的执行流程</text><line class="divider" x1="40" y1="180" x2="840" y2="180"/><text x="50" y="170" class="lbl" fill="var(--red-deep)">用户态 (Ring 3)</text><text x="50" y="200" class="lbl" fill="var(--red-deep)">内核态 (Ring 0)</text><g><rect class="user" x="40" y="60" width="180" height="90" rx="6"/><text x="130" y="80" text-anchor="middle" class="h">① 用户程序</text><text x="50" y="105" class="mono">mov eax, 1</text><text x="50" y="122" class="mono">mov ebx, 0</text><text x="50" y="139" class="mono" fill="var(--red-deep)">int 0x80 ; 触发陷阱</text></g><g><rect class="ivt" x="260" y="210" width="200" height="110" rx="6"/><text x="360" y="232" text-anchor="middle" class="h">② IVT / IDT 查表</text><text x="360" y="252" text-anchor="middle" class="lbl">用 n 作索引找处理程序地址</text><g class="mono"><text x="275" y="275">0x00 → handler0</text><text x="275" y="291">0x01 → handler1</text><text x="275" y="307" fill="var(--red-deep)">0x80 → sys_call_handler</text></g></g><g><rect class="handler" x="500" y="210" width="220" height="110" rx="6"/><text x="610" y="232" text-anchor="middle" class="h">③ 内核处理程序</text><text x="510" y="255" class="mono">push 寄存器现场</text><text x="510" y="272" class="mono">根据 eax 分派 syscall</text><text x="510" y="289" class="mono">执行特权操作 (I/O, exit…)</text><text x="510" y="306" class="mono">恢复现场 / iret</text></g><g><rect class="kernel" x="260" y="60" width="200" height="90" rx="6"/><text x="360" y="80" text-anchor="middle" class="h">CPU 硬件自动动作</text><text x="270" y="103" class="mono">push EFLAGS</text><text x="270" y="120" class="mono">push CS : EIP (返回地址)</text><text x="270" y="137" class="mono">切换到 Ring 0 + 内核栈</text></g><g><rect class="user" x="500" y="60" width="220" height="90" rx="6"/><text x="610" y="80" text-anchor="middle" class="h">④ iret 返回用户程序</text><text x="510" y="105" class="mono">pop EIP, CS, EFLAGS</text><text x="510" y="122" class="mono">切回 Ring 3</text><text x="510" y="139" class="mono">继续执行 int 后下一条指令</text></g><path class="arrow" d="M220 115h40"/><path class="arrow" d="M360 150v60"/><path class="arrow" d="M460 265h40"/><path class="arrow" d="M610 210V150"/><path class="ret" d="M5e2 105c-120 0-2e2-10-280-10"/><text x="360" y="50" text-anchor="middle" class="lbl" fill="var(--violet-mid)">iret 返回路径</text></svg>
