<svg viewBox="0 0 880 520" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--sky-ink)"/></marker><marker id="arrowRow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--coral-deep)"/></marker><marker id="arrowCol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet-deep)"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="880" height="520" fill="var(--blue-soft)"/><text x="440" y="34" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">DRAM 行列地址复用 (Address Multiplexing)</text><text x="440" y="56" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">同一组地址引脚分两次传送：先送行地址 (RAS)，再送列地址 (CAS)</text><g transform="translate(40,100)"><text x="0" y="0" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)" fill="var(--cyan-ink)">CPU 地址</text><g transform="translate(0,16)"><rect x="0" y="0" width="120" height="44" rx="6" fill="var(--surface)" stroke="var(--blue-mid)" stroke-width="1.2" filter="url(#softShadow)"/><text x="60" y="20" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-ink)">A0 ~ A11</text><text x="60" y="36" text-anchor="middle" font-siz