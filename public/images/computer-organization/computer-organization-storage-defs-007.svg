<svg viewBox="0 0 880 520" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafbff"/><stop offset="100%" stop-color="#eef2fb"/></linearGradient><linearGradient id="rowGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a65"/><stop offset="100%" stop-color="#ff5722"/></linearGradient><linearGradient id="colGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42a5f5"/><stop offset="100%" stop-color="#1565c0"/></linearGradient><linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="100%" stop-color="#e3e8f4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#37474f"/></marker><marker id="arrowRow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e64a19"/></marker><marker id="arrowCol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1565c0"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="880" height="520" fill="url(#bgGrad)"/><text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a237e">DRAM 行列地址复用 (Address Multiplexing)</text><text x="440" y="56" text-anchor="middle" font-size="12" fill="#546e7a">同一组地址引脚分两次传送：先送行地址 (RAS)，再送列地址 (CAS)</text><g transform="translate(40,100)"><text x="0" y="0" font-size="13" font-weight="600" fill="#263238">CPU 地址</text><g transform="translate(0,16)"><rect x="0" y="0" width="120" height="44" rx="6" fill="#fff" stroke="#90a4ae" stroke-width="1.2" filter="url(#softShadow)"/><text x="60" y="20" text-anchor="middle" font-size="12" fill="#37474f">A0 ~ A11</text><text x="60" y="36" text-anchor="middle" font-size="11" fill="#78909c">12 根地址线</text></g><g transform="translate(0,90)"><rect x="0" y="0" width="120" height="32" rx="16" fill="url(#rowGrad)"/><text x="60" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">① RAS：行地址</text></g><g transform="translate(0,134)"><rect x="0" y="0" width="120" height="32" rx="16" fill="url(#colGrad)"/><text x="60" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">② CAS：列地址</text></g><g transform="translate(0,200)"><text x="0" y="0" font-size="12" font-weight="600" fill="#263238">时序示意</text><text x="0" y="22" font-size="11" fill="#e64a19">RAS</text><path d="M28 22H50V36H92V22h58" stroke="#e64a19" stroke-width="1.6" fill="none"/><text x="0" y="52" font-size="11" fill="#1565c0">CAS</text><path d="M28 52H96V66h42V52h22" stroke="#1565c0" stroke-width="1.6" fill="none"/><text x="0" y="82" font-size="11" fill="#37474f">ADDR</text><rect x="50" y="74" width="42" height="14" fill="#ffccbc" stroke="#e64a19"/><text x="71" y="85" text-anchor="middle" font-size="10" fill="#bf360c">Row</text><rect x="96" y="74" width="42" height="14" fill="#bbdefb" stroke="#1565c0"/><text x="117" y="85" text-anchor="middle" font-size="10" fill="#0d47a1">Col</text></g></g><g transform="translate(220,90)"><rect x="0" y="0" width="430" height="370" rx="14" fill="url(#chipGrad)" stroke="#3949ab" stroke-width="1.8" filter="url(#softShadow)"/><text x="215" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#283593">DRAM 芯片</text><g transform="translate(20,50)"><rect x="0" y="0" width="120" height="46" rx="8" fill="#fff3e0" stroke="#e64a19" stroke-width="1.5"/><text x="60" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#bf360c">行地址锁存器</text><text x="60" y="36" text-anchor="middle" font-size="10" fill="#6d4c41">Row Address Latch</text></g><g transform="translate(20,108)"><rect x="0" y="0" width="120" height="46" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><text x="60" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">列地址锁存器</text><text x="60" y="36" text-anchor="middle" font-size="10" fill="#37474f">Column Address Latch</text></g><g transform="translate(20,180)"><path d="M0 0 60-20V60L0 40z" fill="url(#rowGrad)" opacity=".95"/><text x="30" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">行</text><text x="30" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">译码器</text></g><g transform="translate(170,310)"><path d="M0 0H240L220 30H20z" fill="url(#colGrad)" opacity=".95"/><text x="120" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">列译码器 / 灵敏放大器</text></g><g transform="translate(170,170)"><rect x="0" y="0" width="240" height="130" fill="#fafafa" stroke="#37474f" stroke-width="1"/><g stroke="#cfd8dc" stroke-width=".6"><line x1="40" y1="0" x2="40" y2="130"/><line x1="80" y1="0" x2="80" y2="130"/><line x1="120" y1="0" x2="120" y2="130"/><line x1="160" y1="0" x2="160" y2="130"/><line x1="200" y1="0" x2="200" y2="130"/><line x1="0" y1="26" x2="240" y2="26"/><line x1="0" y1="52" x2="240" y2="52"/><line x1="0" y1="78" x2="240" y2="78"/><line x1="0" y1="104" x2="240" y2="104"/></g><rect x="0" y="52" width="240" height="26" fill="#ffab91" opacity=".55"/><rect x="120" y="0" width="40" height="130" fill="#90caf9" opacity=".55"/><rect x="120" y="52" width="40" height="26" fill="#7e57c2" stroke="#311b92" stroke-width="1.5"/><text x="140" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">cell</text><text x="120" y="-6" text-anchor="middle" font-size="11" fill="#263238" font-weight="600">位线 (Bit Line) →</text><text x="-8" y="68" text-anchor="end" font-size="11" fill="#263238" font-weight="600">字线 ↓</text><text x="-8" y="80" text-anchor="end" font-size="10" fill="#bf360c" font-weight="700">选中行</text></g><path d="M140 73q18 0 18 127h12" stroke="#e64a19" stroke-width="1.6" fill="none" marker-end="url(#arrowRow)"/><path d="M140 131q150 0 150 179" stroke="#1565c0" stroke-width="1.6" fill="none" marker-end="url(#arrowCol)"/><path d="M80 218h88" stroke="#bf360c" stroke-width="1.6" fill="none" marker-end="url(#arrowRow)"/><text x="-15" y="65" text-anchor="end" font-size="11" fill="#37474f">A[11:0]</text></g><g fill="none" stroke="#37474f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M160 138h50v83"/><path d="M210 163h30" marker-end="url(#arrow)"/><path d="M210 221h30" marker-end="url(#arrow)"/></g><circle cx="210" cy="163" r="2.6" fill="#37474f"/><circle cx="210" cy="221" r="2.6" fill="#37474f"/><text x="185" y="128" text-anchor="middle" font-size="11" fill="#37474f">分时复用</text><g transform="translate(670,100)"><rect x="0" y="0" width="180" height="360" rx="10" fill="#fff" stroke="#cfd8dc" stroke-width="1" filter="url(#softShadow)"/><text x="90" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#263238">引脚对比</text><g transform="translate(14,40)"><text x="0" y="0" font-size="11" font-weight="700" fill="#c62828">不复用</text><text x="0" y="18" font-size="10.5" fill="#37474f">12 行 + 12 列</text><text x="0" y="34" font-size="10.5" fill="#37474f">= 24 根地址线</text><g transform="translate(0,42)"><g fill="#ef5350"><rect x="0" y="0" width="6" height="14" rx="1"/><rect x="9" y="0" width="6" height="14" rx="1"/><rect x="18" y="0" width="6" height="14" rx="1"/><rect x="27" y="0" width="6" height="14" rx="1"/><rect x="36" y="0" width="6" height="14" rx="1"/><rect x="45" y="0" width="6" height="14" rx="1"/><rect x="54" y="0" width="6" height="14" rx="1"/><rect x="63" y="0" width="6" height="14" rx="1"/><rect x="72" y="0" width="6" height="14" rx="1"/><rect x="81" y="0" width="6" height="14" rx="1"/><rect x="90" y="0" width="6" height="14" rx="1"/><rect x="99" y="0" width="6" height="14" rx="1"/><rect x="108" y="0" width="6" height="14" rx="1"/><rect x="117" y="0" width="6" height="14" rx="1"/><rect x="126" y="0" width="6" height="14" rx="1"/><rect x="135" y="0" width="6" height="14" rx="1"/></g><g transform="translate(0,18)" fill="#ef5350"><rect x="0" y="0" width="6" height="14" rx="1"/><rect x="9" y="0" width="6" height="14" rx="1"/><rect x="18" y="0" width="6" height="14" rx="1"/><rect x="27" y="0" width="6" height="14" rx="1"/><rect x="36" y="0" width="6" height="14" rx="1"/><rect x="45" y="0" width="6" height="14" rx="1"/><rect x="54" y="0" width="6" height="14" rx="1"/><rect x="63" y="0" width="6" height="14" rx="1"/></g></g></g><line x1="14" y1="180" x2="166" y2="180" stroke="#eceff1"/><g transform="translate(14,200)"><text x="0" y="0" font-size="11" font-weight="700" fill="#2e7d32">复用</text><text x="0" y="18" font-size="10.5" fill="#37474f">同一组地址线分时</text><text x="0" y="34" font-size="10.5" fill="#37474f">= 12 根地址线</text><g transform="translate(0,42)" fill="#66bb6a"><rect x="0" y="0" width="6" height="14" rx="1"/><rect x="9" y="0" width="6" height="14" rx="1"/><rect x="18" y="0" width="6" height="14" rx="1"/><rect x="27" y="0" width="6" height="14" rx="1"/><rect x="36" y="0" width="6" height="14" rx="1"/><rect x="45" y="0" width="6" height="14" rx="1"/><rect x="54" y="0" width="6" height="14" rx="1"/><rect x="63" y="0" width="6" height="14" rx="1"/><rect x="72" y="0" width="6" height="14" rx="1"/><rect x="81" y="0" width="6" height="14" rx="1"/><rect x="90" y="0" width="6" height="14" rx="1"/><rect x="99" y="0" width="6" height="14" rx="1"/></g><g transform="translate(0,78)"><rect x="0" y="0" width="152" height="46" rx="8" fill="#e8f5e9" stroke="#2e7d32"/><text x="76" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">引脚数量减半</text><text x="76" y="34" text-anchor="middle" font-size="10" fill="#33691e">降低封装成本与面积</text></g></g></g><text x="440" y="500" text-anchor="middle" font-size="11" fill="#607d8b">SRAM 通常不采用行列复用：容量小、追求速度，地址一次性给出直接译码。</text></svg>
