<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="900" height="600" fill="none"/><g id="registers"><rect x="30" y="150" width="120" height="200" fill="var(--sky-soft)" stroke="var(--violet-deep)" stroke-width="2"/><text x="90" y="135" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">寄存器组</text><rect x="40" y="180" width="100" height="35" fill="var(--surface)" stroke="var(--neutral-deep)" stroke-width="1"/><text x="90" y="202" font-size="var(--svg-font-size-label)" text-anchor="middle">R0</text><rect x="40" y="225" width="100" height="35" fill="var(--surface)" stroke="var(--neutral-deep)" stroke-width="1"/><text x="90" y="247" font-size="var(--svg-font-size-label)" text-anchor="middle">R1</text><rect x="40" y="270" width="100" height="35" fill="var(--surface)" stroke="var(--neutral-deep)" stroke-width="1"/><text x="90" y="292" font-size="var(--svg-font-size-label)" text-anchor="middle">R2</text><text x="90" y="325" font-size="var(--svg-font-size-label)" text-anchor="middle">...</text></g><rect x="250" y="80" width="100" height="40" fill="var(--yellow-soft)" stroke="var(--orange-mid)" stroke-width="2"/><text x="300" y="105" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">MAR</text><rect x="250" y="150" width="100" height="40" fill="var(--yellow-soft)" stroke="var(--orange-mid)" stroke-width="2"/><text x="300" y="175" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">MDR</text><rect x="450" y="80" width="120" height="150" fill="var(--purple-soft)" stroke="var(--purple-deep)" stroke-width="2"/><text x="510" y="105" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">存储器</text><rect x="465" y="120" width="90" height="25" fill="var(--surface)" stroke="var(--neutral-deep)" stroke-width="1"/><text x="510" y="138" font-size="var(--svg-font-size-caption)" text-anchor="middle">地址</text><rect x="465" y="155" width="90" height="25" fill="var(--surface)" stroke="var(--neutral-deep)" stroke-width="1"/><text x="510" y="173" font-size="var(--svg-font-size-caption)" text-anchor="middle">数据</text><g id="alu-section"><rect x="250" y="280" width="100" height="40" fill="var(--green-soft)" stroke="var(--lime-deep)" stroke-width="2"/><text x="300" y="305" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">T1</text><path d="M4e2 350H5e2l-20 70H420z" fill="var(--rose-soft)" stroke="var(--red-deep)" stroke-width="2"/><text x="450" y="388" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">ALU</text><rect x="550" y="370" width="100" height="40" fill="var(--green-soft)" stroke="var(--lime-deep)" stroke-width="2"/><text x="600" y="395" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">T2</text></g><g id="mux"><path d="M250 370l40-10v30l-40-10z" fill="var(--yellow-soft)" stroke="var(--yellow-mid)" stroke-width="2"/><text x="270" y="377" font-size="var(--svg-font-size-caption)" text-anchor="middle">MUX</text></g><g id="clock-cycles"><rect x="720" y="50" width="150" height="500" fill="none" stroke="var(--neutral-mid)" stroke-width="1" stroke-dasharray="5,5"/><text x="795" y="40" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">时钟周期</text><rect x="730" y="60" width="130" height="80" fill="var(--sky-soft)" stroke="var(--blue-deep)" stroke-width="1"/><text x="795" y="80" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">C7: MAR←R1</text><text x="795" y="100" font-size="var(--svg-font-size-caption)" text-anchor="middle">R1out, MARin</text><circle cx="745" cy="120" r="3" fill="var(--red-deep)"/><text x="760" y="124" font-size="var(--svg-font-size-caption)">R1→MAR传输</text><rect x="730" y="150" width="130" height="80" fill="var(--purple-soft)" stroke="var(--purple-deep)" stroke-width="1"/><text x="795" y="170" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">C8: MDR←M(MAR)</text><text x="795" y="190" font-size="var(--svg-font-size-caption)" text-anchor="middle">MemR, MDRin</text><circle cx="745" cy="210" r="3" fill="var(--purple-deep)"/><text x="760" y="214" font-size="var(--svg-font-size-caption)">存储器读取</text><rect x="730" y="240" width="130" height="80" fill="var(--green-soft)" stroke="var(--lime-deep)" stroke-width="1"/><text x="795" y="260" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">C9: T1←R0</text><text x="795" y="280" font-size="var(--svg-font-size-caption)" text-anchor="middle">R0out, T1in</text><circle cx="745" cy="300" r="3" fill="var(--lime-deep)"/><text x="760" y="304" font-size="var(--svg-font-size-caption)">R0→T1暂存</text><rect x="730" y="330" width="130" height="80" fill="var(--rose-soft)" stroke="var(--red-deep)" stroke-width="1"/><text x="795" y="350" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">C10: T2←MDR+T1</text><text x="795" y="370" font-size="var(--svg-font-size-caption)" text-anchor="middle">MDRout, MUXop,</text><text x="795" y="385" font-size="var(--svg-font-size-caption)" text-anchor="middle">Add, T2in</text><circle cx="745" cy="395" r="3" fill="var(--red-deep)"/><text x="760" y="399" font-size="var(--svg-font-size-caption)">ALU执行加法</text><rect x="730" y="420" width="130" height="80" fill="var(--sky-soft)" stroke="var(--blue-deep)" stroke-width="1"/><text x="795" y="440" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">C11: R0←T2</text><text x="795" y="460" font-size="var(--svg-font-size-caption)" text-anchor="middle">T2out, R0in</text><circle cx="745" cy="480" r="3" fill="var(--blue-deep)"/><text x="760" y="484" font-size="var(--svg-font-size-caption)">结果写回R0</text></g><defs><marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--blue-deep)"/></marker><marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--purple-deep)"/></marker><marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--lime-deep)"/></marker><marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--red-deep)"/></marker></defs><path d="M140 242 250 1e2" stroke="var(--blue-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)" stroke-dasharray="5,3"><animate attributeName="stroke-dashoffset" from="8" to="0" dur="2s" repeatCount="indefinite"/></path><text x="180" y="160" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">C7</text><path d="M350 1e2H450" stroke="var(--purple-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-purple)"/><path d="M450 170H350" stroke="var(--purple-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-purple)" stroke-dasharray="5,3"><animate attributeName="stroke-dashoffset" from="8" to="0" dur="2s" repeatCount="indefinite"/></path><text x="400" y="95" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">C8</text><path d="M140 197 250 3e2" stroke="var(--lime-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)" stroke-dasharray="5,3"><animate attributeName="stroke-dashoffset" from="8" to="0" dur="2s" repeatCount="indefinite"/></path><text x="180" y="240" font-size="var(--svg-font-size-caption)" fill="var(--lime-deep)">C9</text><path d="M3e2 190 270 360" stroke="var(--red-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)"/><path d="M290 375H4e2" stroke="var(--red-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)"/><path d="M350 3e2l70 55" stroke="var(--red-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)"/><path d="M480 390h70" stroke="var(--red-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-red)" stroke-dasharray="5,3"><animate attributeName="stroke-dashoffset" from="8" to="0" dur="2s" repeatCount="indefinite"/></path><text x="320" y="250" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">C10</text><path d="M550 380Q350 250 140 197" stroke="var(--blue-deep)" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)" stroke-dasharray="5,3"><animate attributeName="stroke-dashoffset" from="8" to="0" dur="2s" repeatCount="indefinite"/></path><text x="400" y="280" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">C11</text><g id="control-signals"><rect x="30" y="450" width="650" height="120" fill="none" stroke="var(--neutral-deep)" stroke-width="1" stroke-dasharray="3,3"/><text x="355" y="470" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle">控制信号说明</text><text x="50" y="495" font-size="var(--svg-font-size-caption)">• R1out, MARin: 寄存器R1输出，MAR输入使能</text><text x="50" y="515" font-size="var(--svg-font-size-caption)">• MemR, MDRin: 存储器读操作，MDR输入使能</text><text x="50" y="535" font-size="var(--svg-font-size-caption)">• R0out, T1in: 寄存器R0输出，T1暂存器输入使能</text><text x="360" y="495" font-size="var(--svg-font-size-caption)">• MDRout, MUXop: MDR输出，MUX选择操作数</text><text x="360" y="515" font-size="var(--svg-font-size-caption)">• Add, T2in: ALU执行加法，T2暂存器输入使能</text><text x="360" y="535" font-size="var(--svg-font-size-caption)">• T2out, R0in: T2暂存器输出，R0输入使能</text></g><text x="200" y="30" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-ink)">执行阶段</text><text x="400" y="30" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">访存阶段</text><text x="600" y="30" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-deep)">写回阶段</text></svg>
