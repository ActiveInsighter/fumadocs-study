<svg font-family="var(--svg-font-family)" viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="ah" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--blue-deep)"/></marker><marker id="ah_red" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--red-deep)"/></marker><marker id="ah_blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--indigo-deep)"/></marker><marker id="ah_green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--green-deep)"/></marker><filter height="116%" id="shd" width="116%" x="-8%" y="-8%"><feDropShadow dx="0" dy="1.5" flood-opacity=".15" stdDeviation="1.5"/></filter></defs><g filter="url(#shd)"><rect fill="var(--blue-deep)" height="90" rx="10" stroke="var(--indigo-deep)" stroke-width="1.5" width="200" x="290" y="30"/><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="390" y="60">CPU</text><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="390" y="82">运行主程序（与 DMA 并行）</text><g><rect fill="var(--surface)" height="20" rx="4" stroke="var(--indigo-deep)" width="80" x="305" y="92"/><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="345" y="107">① 预处理</text></g><g><rect fill="var(--surface)" height="20" rx="4" stroke="var(--indigo-deep)" width="80" x="395" y="92"/><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="435" y="107">④ 后处理</text></g></g><text fill="var(--sky-deep)" font-size="var(--svg-font-size-label)" x="200" y="65">仅参与</text><text fill="var(--sky-deep)" font-size="var(--svg-font-size-label)" x="200" y="82">首尾两端</text><path d="M245 72h40" marker-end="url(#ah)" stroke="var(--indigo-mid)" stroke-dasharray="4,3" stroke-width="1"/><g filter="url(#shd)"><rect fill="var(--yellow-deep)" height="80" rx="10" stroke="var(--amber-deep)" stroke-width="1.6" width="180" x="300" y="200"/><text fill="var(--amber-deep)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="390" y="230">DMA 控制器</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="390" y="252">接管总线 · 自动搬运</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="390" y="268">MAR · DR · DC · CR</text></g><path d="M345 120v80" marker-end="url(#ah_blue)" stroke="var(--indigo-deep)" stroke-width="2"/><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="255" y="150">② 初始化参数</text><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" x="255" y="167">地址/长度/方向</text><path d="M435 2e2V120" marker-end="url(#ah_green)" stroke="var(--green-deep)" stroke-width="2"/><text fill="var(--green-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="490" y="150">③ 完成中断</text><text fill="var(--green-deep)" font-size="var(--svg-font-size-caption)" x="490" y="167">通知 CPU 校验/收尾</text><g filter="url(#shd)"><rect fill="var(--cyan-deep)" height="70" rx="10" stroke="var(--cyan-deep)" stroke-width="1.5" width="160" x="60" y="215"/><text fill="var(--cyan-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="140" y="243">外设</text><text fill="var(--cyan-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="140" y="266">如：磁盘 / 网卡</text></g><g filter="url(#shd)"><rect fill="var(--mint-deep)" height="70" rx="10" stroke="var(--green-deep)" stroke-width="1.5" width="160" x="560" y="215"/><text fill="var(--green-deep)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="640" y="243">内存</text><text fill="var(--green-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="640" y="266">主存 (RAM)</text></g><rect fill="var(--red-deep)" height="20" opacity=".9" rx="6" width="80" x="220" y="240"/><rect fill="var(--red-deep)" height="20" opacity=".9" rx="6" width="80" x="480" y="240"/><line marker-end="url(#ah_red)" stroke="var(--red-deep)" stroke-width="2.2" x1="230" x2="292" y1="250" y2="250"/><line marker-end="url(#ah_red)" stroke="var(--red-deep)" stroke-width="2.2" x1="488" x2="552" y1="250" y2="250"/><text fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="390" y="306">数据通路（不经过 CPU 寄存器/执行单元）</text><g><rect fill="var(--surface)" height="150" rx="10" stroke="var(--blue-light)" stroke-dasharray="4,3" stroke-width="1" width="660" x="60" y="325"/><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="80" y="350">核心思想</text><g fill="var(--indigo-ink)" font-size="var(--svg-font-size-label)"><text x="80" y="374"><tspan fill="var(--indigo-deep)" font-weight="var(--svg-font-weight-bold)">① 预处理：</tspan><tspan>CPU 配置 DMA 参数（源地址、目标地址、长度、方向）</tspan></text><text x="80" y="396"><tspan fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">② 数据传输：</tspan><tspan>DMA 控制器接管总线，在外设与内存之间</tspan><tspan fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">直接搬运数据</tspan><tspan>，CPU 同时执行其他指令</tspan></text><text x="80" y="418"><tspan fill="var(--green-deep)" font-weight="var(--svg-font-weight-bold)">③ 后处理：</tspan><tspan>传输完成后 DMA 发中断，CPU 进行数据校验与收尾</tspan></text><text fill="var(--blue-deep)" font-style="italic" x="80" y="446">⇒ CPU 只在两端参与，数据传输与主程序<tspan fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">并行</tspan>进行，适用于块设备的高吞吐传输</text></g></g></svg>
