<svg font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="dCpu" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e8f1ff"/><stop offset="100%" stop-color="#c1d7ff"/></linearGradient><linearGradient id="dMem" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#eaf7ee"/><stop offset="100%" stop-color="#bde3c9"/></linearGradient><linearGradient id="dDev" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e8f6f9"/><stop offset="100%" stop-color="#a9d3de"/></linearGradient><linearGradient id="dDma" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff4d6"/><stop offset="100%" stop-color="#ffd97a"/></linearGradient><linearGradient id="dPipe" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f6a6a6"/><stop offset="50%" stop-color="#f37676"/><stop offset="100%" stop-color="#f6a6a6"/></linearGradient><marker id="ah" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#4a5568"/></marker><marker id="ah_red" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c53030"/></marker><marker id="ah_blue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2b6cb0"/></marker><marker id="ah_green" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2f855a"/></marker><filter height="116%" id="shd" width="116%" x="-8%" y="-8%"><feDropShadow dx="0" dy="1.5" flood-opacity=".15" stdDeviation="1.5"/></filter></defs><g filter="url(#shd)"><rect fill="url(#dCpu)" height="90" rx="10" stroke="#3b5a92" stroke-width="1.5" width="200" x="290" y="30"/><text fill="#1e3a66" font-size="18" font-weight="bold" text-anchor="middle" x="390" y="60">CPU</text><text fill="#3a5a88" font-size="12" text-anchor="middle" x="390" y="82">运行主程序（与 DMA 并行）</text><g><rect fill="#fff" height="20" rx="4" stroke="#3b5a92" width="80" x="305" y="92"/><text fill="#1e3a66" font-size="11" text-anchor="middle" x="345" y="107">① 预处理</text></g><g><rect fill="#fff" height="20" rx="4" stroke="#3b5a92" width="80" x="395" y="92"/><text fill="#1e3a66" font-size="11" text-anchor="middle" x="435" y="107">④ 后处理</text></g></g><text fill="#556170" font-size="12" x="200" y="65">仅参与</text><text fill="#556170" font-size="12" x="200" y="82">首尾两端</text><path d="M245 72h40" marker-end="url(#ah)" stroke="#8a94a5" stroke-dasharray="4,3" stroke-width="1"/><g filter="url(#shd)"><rect fill="url(#dDma)" height="80" rx="10" stroke="#a17419" stroke-width="1.6" width="180" x="300" y="200"/><text fill="#5a3f0d" font-size="16" font-weight="bold" text-anchor="middle" x="390" y="230">DMA 控制器</text><text fill="#7a5814" font-size="11" text-anchor="middle" x="390" y="252">接管总线 · 自动搬运</text><text fill="#7a5814" font-size="11" text-anchor="middle" x="390" y="268">MAR · DR · DC · CR</text></g><path d="M345 120v80" marker-end="url(#ah_blue)" stroke="#2b6cb0" stroke-width="2"/><text fill="#2b6cb0" font-size="12" font-weight="bold" x="255" y="150">② 初始化参数</text><text fill="#2b6cb0" font-size="11" x="255" y="167">地址/长度/方向</text><path d="M435 2e2V120" marker-end="url(#ah_green)" stroke="#2f855a" stroke-width="2"/><text fill="#2f855a" font-size="12" font-weight="bold" x="490" y="150">③ 完成中断</text><text fill="#2f855a" font-size="11" x="490" y="167">通知 CPU 校验/收尾</text><g filter="url(#shd)"><rect fill="url(#dDev)" height="70" rx="10" stroke="#2f6673" stroke-width="1.5" width="160" x="60" y="215"/><text fill="#1c4550" font-size="16" font-weight="bold" text-anchor="middle" x="140" y="243">外设</text><text fill="#2f6673" font-size="11" text-anchor="middle" x="140" y="266">如：磁盘 / 网卡</text></g><g filter="url(#shd)"><rect fill="url(#dMem)" height="70" rx="10" stroke="#2f7a48" stroke-width="1.5" width="160" x="560" y="215"/><text fill="#1e5133" font-size="16" font-weight="bold" text-anchor="middle" x="640" y="243">内存</text><text fill="#2f7a48" font-size="11" text-anchor="middle" x="640" y="266">主存 (RAM)</text></g><rect fill="url(#dPipe)" height="20" opacity=".9" rx="6" width="80" x="220" y="240"/><rect fill="url(#dPipe)" height="20" opacity=".9" rx="6" width="80" x="480" y="240"/><line marker-end="url(#ah_red)" stroke="#7c1d1d" stroke-width="2.2" x1="230" x2="292" y1="250" y2="250"/><line marker-end="url(#ah_red)" stroke="#7c1d1d" stroke-width="2.2" x1="488" x2="552" y1="250" y2="250"/><text fill="#c53030" font-size="13" font-weight="bold" text-anchor="middle" x="390" y="306">数据通路（不经过 CPU 寄存器/执行单元）</text><g><rect fill="#fafbfd" height="150" rx="10" stroke="#cbd2dc" stroke-dasharray="4,3" stroke-width="1" width="660" x="60" y="325"/><text fill="#2d3748" font-size="13" font-weight="bold" x="80" y="350">核心思想</text><g fill="#2d3748" font-size="12"><text x="80" y="374"><tspan fill="#2b6cb0" font-weight="bold">① 预处理：</tspan><tspan>CPU 配置 DMA 参数（源地址、目标地址、长度、方向）</tspan></text><text x="80" y="396"><tspan fill="#7c1d1d" font-weight="bold">② 数据传输：</tspan><tspan>DMA 控制器接管总线，在外设与内存之间</tspan><tspan fill="#c53030" font-weight="bold">直接搬运数据</tspan><tspan>，CPU 同时执行其他指令</tspan></text><text x="80" y="418"><tspan fill="#2f855a" font-weight="bold">③ 后处理：</tspan><tspan>传输完成后 DMA 发中断，CPU 进行数据校验与收尾</tspan></text><text fill="#4a5568" font-style="italic" x="80" y="446">⇒ CPU 只在两端参与，数据传输与主程序<tspan fill="#c53030" font-weight="bold">并行</tspan>进行，适用于块设备的高吞吐传输</text></g></g></svg>
