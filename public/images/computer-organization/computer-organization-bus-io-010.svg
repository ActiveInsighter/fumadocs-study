roke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central" x="60" y="418">· 中断频繁，开销大</text><text dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central" x="60" y="443">· CPU频繁切换执行上下文</text><text dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central" x="60" y="468">· CPU参与每次数据搬运，成为"搬运工"</text><text dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central" x="360" y="418">· 一次搬运数据量小，效率低</text><text dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central" x="360" y="443">· CPU占用时间多，并行性差</text></g></svg>
