<svg viewBox="0 0 800 300" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="cdromArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--sky-deep)"/></marker></defs><rect width="800" height="300" fill="var(--surface)"/><g transform="translate(150,160)"><circle r="90" fill="var(--sky-deep)" stroke="var(--blue-mid)" stroke-width="2"/><circle r="14" fill="var(--surface)" stroke="var(--blue-mid)" stroke-width="2"/><circle r="5" fill="var(--sky-deep)"/><g fill="none" stroke="var(--sky-deep)" stroke-width=".6" opacity=".6"><circle r="24"/><circle r="34"/><circle r="44"/><circle r="54"/><circle r="64"/><circle r="74"/></g><line x1="0" y1="0" x2="0" y2="-140" stroke="var(--red-deep)" stroke-width="2"/><circle cx="0" cy="-140" r="8" fill="var(--red-deep)"/><text x="20" y="-135" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">激光读取头</text></g><text x="150" y="265" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--cyan-ink)">光盘介质</text><text x="150" y="282" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">凹坑/平面编码数据</text><path d="M280 140h50" stroke="var(--sky-deep)" stroke-width="2" marker-end="url(#cdromArr)"/><text x="305" y="128" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">只读</text><g transform="translate(350,40)"><g transform="translate(0,0)"><rect x="0" y="0" width="210" height="56" rx="8" fill="var(--neutral-soft)" stroke="var(--cyan-mid)"/><text x="105" y="22" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--cyan-ink)">生产时一次写入</text><text x="105" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">用户不可修改</text></g><g transform="translate(220,0)"><rect x="0" y="0" width="210" height="56" rx="8" fill="var(--neutral-soft)" stroke="var(--cyan-mid)"/><text x="105" y="22" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--cyan-ink)">非易失性</text><text x="105" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">断电数据不丢失</text></g><g transform="translate(0,72)"><rect x="0" y="0" width="210" height="56" rx="8" fill="var(--neutral-soft)" stroke="var(--cyan-mid)"/><text x="105" y="22" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--cyan-ink)">容量约 700 MB</text><text x="105" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">激光读取数据</text></g><g transform="translate(220,72)"><rect x="0" y="0" width="210" height="56" rx="8" fill="var(--neutral-soft)" stroke="var(--cyan-mid)"/><text x="105" y="22" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--cyan-ink)">属于外存</text><text x="105" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">辅助存储器，非半导体 ROM</text></g><g transform="translate(0,144)"><rect x="0" y="0" width="430" height="56" rx="8" fill="var(--neutral-soft)" stroke="var(--cyan-mid)"/><text x="215" y="22" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--cyan-ink)">访问速度远低于半导体存储器</text><text x="215" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">机械旋转 + 光学读取，延迟较高</text></g></g></svg>
