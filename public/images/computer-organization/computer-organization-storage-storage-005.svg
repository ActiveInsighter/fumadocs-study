<svg viewBox="0 0 820 430" font-family="'Segoe UI', 'PingFang SC', sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="100%" y2="100%"><stop offset="0" style="stop-color:#f0f7ff"/><stop offset="100%" style="stop-color:#e8f0fe"/></linearGradient><linearGradient id="diskFace" cx="50%" cy="50%" r="50%" fx="40%" fy="35%" x1="20%" y1="10%" x2="80%" y2="90%"><stop offset="0" style="stop-color:#dbeafe"/><stop offset="100%" style="stop-color:#bfdbfe"/></linearGradient><linearGradient id="trackHL" x1="0" y1="0" x2="100%" y2="0"><stop offset="0" style="stop-color:#2563eb;stop-opacity:0"/><stop offset="50%" style="stop-color:#2563eb;stop-opacity:1"/><stop offset="100%" style="stop-color:#2563eb;stop-opacity:0"/></linearGradient><linearGradient id="dataFlow" x1="0" y1="0" x2="100%" y2="0"><stop offset="0" style="stop-color:#3b82f6"/><stop offset="100%" style="stop-color:#06b6d4"/></linearGradient><linearGradient id="rpmGrad" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#4338ca"/></linearGradient><linearGradient id="nGrad" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" style="stop-color:#0ea5e9"/><stop offset="100%" style="stop-color:#0284c7"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity=".2"/></filter><filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrowRight" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0ea5e9"/></marker><marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker></defs><rect width="820" height="430" fill="url(#bg)" rx="14"/><text x="410" y="36" text-anchor="middle" fill="#1e3a8a" font-size="19" font-weight="700" letter-spacing=".5">数据传输率</text><text x="410" y="54" text-anchor="middle" fill="#64748b" font-size="11">Data Transfer Rate</text><rect x="270" y="64" width="280" height="48" rx="10" fill="#fff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/><text x="410" y="90" text-anchor="middle" font-size="16" font-weight="700"><tspan fill="#1e3a8a">D</tspan><tspan dy="4" font-size="10" fill="#1e3a8a">r</tspan><tspan dy="-4" font-size="15" fill="#334155" font-weight="500">=</tspan><tspan fill="#6366f1" font-weight="700">r</tspan><tspan fill="#475569" font-size="15" font-weight="500">×</tspan><tspan fill="#0ea5e9" font-weight="700">N</tspan></text><text x="410" y="106" text-anchor="middle" fill="#94a3b8" font-size="9">转速(转/秒) × 磁道容量(字节)</text><ellipse cx="185" cy="268" rx="130" ry="128" fill="#e2e8f0" opacity=".5"/><circle cx="182" cy="263" r="128" fill="url(#diskFace)" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/><circle cx="182" cy="263" r="100" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="6 4" opacity=".6"/><circle cx="182" cy="263" r="74" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="6 4" opacity=".5"/><circle cx="182" cy="263" r="48" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="6 4" opacity=".4"/><circle cx="182" cy="263" r="100" fill="none" stroke="#2563eb" stroke-width="3" filter="url(#glow)" opacity=".9"/><path d="M182 263l81-80a1e2 1e2.0 0116 35z" fill="#fde68a" opacity=".5"/><path d="M182 263l81-80a1e2 1e2.0 0116 35z" fill="none" stroke="#d97706" stroke-width="1.5"/><defs><marker id="arrowRpm" markerWidth="12" markerHeight="10" refX="6" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#6366f1"/></marker></defs><path d="M63 194a138 138 0 01238 0" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowRpm)" opacity=".95"/><path d="M301 332A138 138 0 0163 332" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowRpm)" opacity=".55"/><rect x="152" y="140" width="60" height="24" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2"/><text x="182" y="157" text-anchor="middle" fill="#4338ca" font-size="13" font-weight="700">r 转/秒</text><circle cx="182" cy="263" r="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/><line x1="182" y1="263" x2="280" y2="175" stroke="#64748b" stroke-width="2.5"/><circle cx="280" cy="175" r="5" fill="#7c3aed" stroke="#fff" stroke-width="1.5"/><line x1="78" y1="195" x2="108" y2="210" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRight)"/><rect x="28" y="178" width="52" height="22" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/><text x="54" y="194" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="700">N 字节</text><text x="54" y="208" text-anchor="middle" fill="#64748b" font-size="8">磁道容量</text><text x="182" y="375" text-anchor="middle" fill="#0369a1" font-size="9">一圈 = N 字节数据</text><rect x="328" y="250" width="160" height="26" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/><rect x="334" y="254" width="22" height="18" rx="4" fill="url(#dataFlow)" opacity=".9"/><rect x="362" y="254" width="22" height="18" rx="4" fill="url(#dataFlow)" opacity=".75"/><rect x="390" y="254" width="22" height="18" rx="4" fill="url(#dataFlow)" opacity=".6"/><rect x="418" y="254" width="22" height="18" rx="4" fill="url(#dataFlow)" opacity=".4"/><rect x="446" y="254" width="22" height="18" rx="4" fill="url(#dataFlow)" opacity=".25"/><line x1="460" y1="263" x2="520" y2="263" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowRight)"/><text x="408" y="296" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="600">每秒传输 D_r 字节</text><rect x="545" y="148" width="230" height="78" rx="10" fill="#fff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#shadow)"/><rect x="545" y="148" width="8" height="78" rx="4" fill="url(#rpmGrad)"/><text x="572" y="172" fill="#4338ca" font-size="22" font-weight="800">r</text><text x="598" y="172" fill="#334155" font-size="12" font-weight="600">转速</text><text x="572" y="192" fill="#64748b" font-size="10">磁盘每秒旋转的圈数（转/秒）</text><text x="572" y="207" fill="#64748b" font-size="10">典型值：5400 rpm ≈ 90 转/秒</text><text x="572" y="222" fill="#64748b" font-size="10">7200 rpm ≈ 120 转/秒</text><rect x="545" y="244" width="230" height="78" rx="10" fill="#fff" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/><rect x="545" y="244" width="8" height="78" rx="4" fill="url(#nGrad)"/><text x="572" y="268" fill="#0369a1" font-size="22" font-weight="800">N</text><text x="598" y="268" fill="#334155" font-size="12" font-weight="600">磁道容量</text><text x="572" y="288" fill="#64748b" font-size="10">单条磁道可存储的字节数</text><text x="572" y="303" fill="#64748b" font-size="10">= 每磁道扇区数 × 扇区大小</text><text x="572" y="318" fill="#64748b" font-size="10">扇区大小通常为 512 B 或 4 KB</text><rect x="545" y="340" width="230" height="56" rx="10" fill="#1e40af" stroke="#1e3a8a" stroke-width="1" filter="url(#shadow)"/><text x="660" y="366" text-anchor="middle" fill="#fff" font-size="15" font-weight="700"><tspan>D</tspan><tspan dy="4" font-size="10" fill="#93c5fd">r</tspan><tspan dy="-4" font-size="15" fill="#fff" font-weight="500">= r × N</tspan></text><text x="660" y="386" text-anchor="middle" fill="#bfdbfe" font-size="10">数据传输率（字节/秒）</text><line x1="412" y1="95" x2="553" y2="180" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/><line x1="440" y1="95" x2="553" y2="276" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/></svg>
