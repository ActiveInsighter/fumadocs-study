ple-deep)" stroke="var(--surface)" stroke-width="1.5"/><line x1="78" y1="195" x2="108" y2="210" stroke="var(--blue-mid)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRight)"/><rect x="28" y="178" width="52" height="22" rx="6" fill="var(--sky-soft)" stroke="var(--sky-mid)" stroke-width="1"/><text x="54" y="194" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">N 字节</text><text x="54" y="208" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">磁道容量</text><text x="182" y="375" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">一圈 = N 字节数据</text><rect x="328" y="250" width="160" height="26" rx="13" fill="var(--sky-soft)" stroke="var(--sky-mid)" stroke-width="1.5"/><rect x="334" y="254" width="22" height="18" rx="4" fill="var(--violet-deep)" opacity=".9"/><rect x="362" y="254" width="22" height="18" rx="4" fill="var(--violet-deep)" opacity=".75"/><rect x="390" y="254" width="22" height="18" rx="4" fill="var(--violet-deep)" opacity=".6"/><rect x="418" y="254" width="22" height="18" rx="4" fill="var(--violet-deep)" opacity=".4"/><rect x="446" y="254" width="22" height="18" rx="4" fill="var(--violet-deep)" opacity=".25"/><line x1="460" y1="263" x2="520" y2="263" stroke="var(--blue-mid)" stroke-width="2" marker-end="url(#arrowRight)"/><text x="408" y="296" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">每秒传输 D_r 字节</text><rect x="545" y="148" width="230" height="78" rx="10" fill="var(--surface)" stroke="var(--violet-light)" stroke-width="1.5" filter="url(#shadow)"/><rect x="545" y="148" width="8" height="78" rx="4" fill="var(--purple-deep)"/><text x="572" y="172" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">r</text><tex