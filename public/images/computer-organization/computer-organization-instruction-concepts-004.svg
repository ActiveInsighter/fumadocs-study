<svg viewBox="0 0 900 460" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><style>text{fill:var(--ink)}.h{font-weight: var(--svg-font-weight-bold)}.col{stroke:var(--neutral-mid);fill:var(--surface)}.src{fill:var(--sky-soft);stroke:var(--violet-mid)}.cisc{fill:var(--yellow-soft);stroke:var(--orange-mid)}.risc{fill:var(--green-soft);stroke:var(--lime-mid)}.lbl{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}.mono{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-caption)}.cmt{fill:var(--ink-soft);font-style:italic}.s1{fill:var(--violet-deep)}.s2{fill:var(--orange-mid)}.s3{fill:var(--red-deep)}.arrow{stroke:var(--ink-soft);stroke-width:1.2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--ink-soft)"/></marker></defs><text x="450" y="26" text-anchor="middle" font-size="var(--svg-font-size-title)" class="h svg-text svg-text-theme">同一段 C 代码在 CISC (x86) 与 RISC (MIPS) 上的指令对照</text><g><rect class="src" x="340" y="50" width="220" height="80" rx="6"/><text x="450" y="70" text-anchor="middle" class="h svg-text svg-text-theme">C 源代码</text><text x="350" y="92" class="mono s1 svg-text svg-text-theme">for (i = 0; i &lt; 24; i++)</text><text x="350" y="108" class="mono s2 svg-text svg-text-theme">for (j = 0; j &lt; 24; j++)</text><text x="350" y="124" class="mono s3 svg-text svg-text-theme">a[i][j] = 10;</text></g><path class="arrow" d="M4e2 130 220 170"/><path class="arrow" d="M5e2 130l180 40"/><g><rect class="col cisc" x="40" y="170" width="380" height="270" rx="6"/><text x="230" y="192" text-anchor="middle" class="h svg-text svg-text-theme">CISC · Intel x86</text><text x="230" y="208" text-anchor="middle" class="lbl svg-text svg-text-theme">单条指令可访存 + 复杂寻址</text><g class="mono"><text x="55" y="235" class="s1 svg-text svg-text-theme">mov dword ptr [ebp-8], 0<tspan class="cmt">; i = 0</tspan></text><text x="55" y="253" class="s1 svg-text svg-text-theme">jmp loop_chk_i</text><text x="55" y="271" class="s1 svg-text svg-text-theme">mov eax, [ebp-8]<tspan class="cmt">; load i</tspan></text><text x="55" y="289" class="s1 svg-text svg-text-theme">cmp eax, 24</text><text x="55" y="307" class="s1 svg-text svg-text-theme">jge end_i</text><text x="55" y="325" class="s2 svg-text svg-text-theme">mov dword ptr [ebp-4], 0<tspan class="cmt">; j = 0</tspan></text><text x="55" y="343" class="s3 svg-text svg-text-theme">mov dword ptr [ecx+edx*4+0x422000], 10</text><text x="55" y="361" class="svg-text svg-text-theme"><tspan class="cmt">; 一条指令完成寻址+赋值</tspan></text><text x="55" y="385" class="s2 svg-text svg-text-theme">inc dword ptr [ebp-4]<tspan class="cmt">; j++</tspan></text><text x="55" y="403" class="s1 svg-text svg-text-theme">inc dword ptr [ebp-8]<tspan class="cmt">; i++</tspan></text></g><text x="55" y="430" class="lbl svg-text svg-text-theme">特点：复杂寻址模式、变长指令、单指令多步操作</text></g><g><rect class="col risc" x="500" y="170" width="380" height="270" rx="6"/><text x="690" y="192" text-anchor="middle" class="h svg-text svg-text-theme">RISC · MIPS</text><text x="690" y="208" text-anchor="middle" class="lbl svg-text svg-text-theme">load/store 架构，寻址需多条指令</text><g class="mono"><text x="515" y="235" class="s1 svg-text svg-text-theme">addi $v0, $zero, 0<tspan class="cmt">; i = 0</tspan></text><text x="515" y="253" class="s1 svg-text svg-text-theme">j loop_chk_i</text><text x="515" y="271" class="s1 svg-text svg-text-theme">lw $v1, 8($fp)<tspan class="cmt">; load i</tspan></text><text x="515" y="289" class="s1 svg-text svg-text-theme">bge $v1, 24, end_i</text><text x="515" y="307" class="s2 svg-text svg-text-theme">addi $a0, $zero, 0<tspan class="cmt">; j = 0</tspan></text><text x="515" y="325" class="s3 svg-text svg-text-theme">sll $v1, $v1, 6<tspan class="cmt">; i * 64</tspan></text><text x="515" y="343" class="s3 svg-text svg-text-theme">add $v1, $v1, $a0<tspan class="cmt">; + j</tspan></text><text x="515" y="361" class="s3 svg-text svg-text-theme">sll $v1, $v1, 2<tspan class="cmt">; * 4</tspan></text><text x="515" y="379" class="s3 svg-text svg-text-theme">lui $at, 0x0042<tspan class="cmt">; 高 16 位基址</tspan></text><text x="515" y="397" class="s3 svg-text svg-text-theme">ori $v0, $at, 0x2000<tspan class="cmt">; 拼出完整地址</tspan></text><text x="515" y="415" class="s3 svg-text svg-text-theme">add $v0, $v1, $v0</text><text x="515" y="433" class="s3 svg-text svg-text-theme">li $a1, 10 / sw $a1, 0($v0)</text></g></g></svg>
