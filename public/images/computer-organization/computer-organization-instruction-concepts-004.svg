<svg viewBox="0 0 900 460" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="12" xmlns="http://www.w3.org/2000/svg"><style>text{fill:#222}.h{font-weight:700}.col{stroke:#aaa;fill:#fafafa}.src{fill:#eef6ff;stroke:#4a90e2}.cisc{fill:#fff4e0;stroke:#e2954a}.risc{fill:#e8f7e8;stroke:#4ea84e}.lbl{font-size:11px;fill:#555}.mono{font-family:Menlo,Consolas,monospace;font-size:11px}.cmt{fill:#8a8a8a;font-style:italic}.s1{fill:#2563eb}.s2{fill:#d97706}.s3{fill:#b91c4a}.arrow{stroke:#888;stroke-width:1.2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#888"/></marker></defs><text x="450" y="26" text-anchor="middle" font-size="16" class="h">同一段 C 代码在 CISC (x86) 与 RISC (MIPS) 上的指令对照</text><g><rect class="src" x="340" y="50" width="220" height="80" rx="6"/><text x="450" y="70" text-anchor="middle" class="h">C 源代码</text><text x="350" y="92" class="mono s1">for (i = 0; i &lt; 24; i++)</text><text x="350" y="108" class="mono s2">for (j = 0; j &lt; 24; j++)</text><text x="350" y="124" class="mono s3">a[i][j] = 10;</text></g><path class="arrow" d="M4e2 130 220 170"/><path class="arrow" d="M5e2 130l180 40"/><g><rect class="col cisc" x="40" y="170" width="380" height="270" rx="6"/><text x="230" y="192" text-anchor="middle" class="h">CISC · Intel x86</text><text x="230" y="208" text-anchor="middle" class="lbl">单条指令可访存 + 复杂寻址</text><g class="mono"><text x="55" y="235" class="s1">mov dword ptr [ebp-8], 0<tspan class="cmt">; i = 0</tspan></text><text x="55" y="253" class="s1">jmp loop_chk_i</text><text x="55" y="271" class="s1">mov eax, [ebp-8]<tspan class="cmt">; load i</tspan></text><text x="55" y="289" class="s1">cmp eax, 24</text><text x="55" y="307" class="s1">jge end_i</text><text x="55" y="325" class="s2">mov dword ptr [ebp-4], 0<tspan class="cmt">; j = 0</tspan></text><text x="55" y="343" class="s3">mov dword ptr [ecx+edx*4+0x422000], 10</text><text x="55" y="361"><tspan class="cmt">; 一条指令完成寻址+赋值</tspan></text><text x="55" y="385" class="s2">inc dword ptr [ebp-4]<tspan class="cmt">; j++</tspan></text><text x="55" y="403" class="s1">inc dword ptr [ebp-8]<tspan class="cmt">; i++</tspan></text></g><text x="55" y="430" class="lbl">特点：复杂寻址模式、变长指令、单指令多步操作</text></g><g><rect class="col risc" x="500" y="170" width="380" height="270" rx="6"/><text x="690" y="192" text-anchor="middle" class="h">RISC · MIPS</text><text x="690" y="208" text-anchor="middle" class="lbl">load/store 架构，寻址需多条指令</text><g class="mono"><text x="515" y="235" class="s1">addi $v0, $zero, 0<tspan class="cmt">; i = 0</tspan></text><text x="515" y="253" class="s1">j loop_chk_i</text><text x="515" y="271" class="s1">lw $v1, 8($fp)<tspan class="cmt">; load i</tspan></text><text x="515" y="289" class="s1">bge $v1, 24, end_i</text><text x="515" y="307" class="s2">addi $a0, $zero, 0<tspan class="cmt">; j = 0</tspan></text><text x="515" y="325" class="s3">sll $v1, $v1, 6<tspan class="cmt">; i * 64</tspan></text><text x="515" y="343" class="s3">add $v1, $v1, $a0<tspan class="cmt">; + j</tspan></text><text x="515" y="361" class="s3">sll $v1, $v1, 2<tspan class="cmt">; * 4</tspan></text><text x="515" y="379" class="s3">lui $at, 0x0042<tspan class="cmt">; 高 16 位基址</tspan></text><text x="515" y="397" class="s3">ori $v0, $at, 0x2000<tspan class="cmt">; 拼出完整地址</tspan></text><text x="515" y="415" class="s3">add $v0, $v1, $v0</text><text x="515" y="433" class="s3">li $a1, 10 / sw $a1, 0($v0)</text></g></g></svg>
