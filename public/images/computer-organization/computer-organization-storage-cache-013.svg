<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><style>.header-text{font-family: var(--svg-font-family);font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold);fill:var(--neutral-ink)}.content-text{font-family: var(--svg-font-family);font-size: var(--svg-font-size-label);fill:var(--neutral-deep)}.small-text{font-family: var(--svg-font-family);font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}.title-text{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);fill:var(--ink)}.header-bg{fill:var(--violet-mid)}.row-bg-1{fill:var(--paper)}.row-bg-2{fill:var(--surface)}.metadata-bg{fill:var(--sky-soft)}.data-bg{fill:var(--paper-warm)}.border{stroke:var(--neutral-mid);stroke-width:1.5;fill:none}.dashed{stroke:var(--neutral-mid);stroke-width:1;stroke-dasharray:5,5;fill:none}</style></defs><text class="title-text" text-anchor="middle" x="450" y="30">Cache 存储结构</text><rect class="metadata-bg" height="30" stroke="var(--violet-mid)" stroke-width="1" width="350" x="50" y="50"/><text class="header-text" text-anchor="middle" x="225" y="70">元数据部分 (控制信息)</text><rect class="data-bg" height="30" stroke="var(--orange-mid)" stroke-width="1" width="450" x="400" y="50"/><text class="header-text" text-anchor="middle" x="625" y="70">数据部分 (缓存内容)</text><rect class="header-bg" height="40" width="100" x="50" y="90"/><rect class="header-bg" height="40" width="80" x="150" y="90"/><rect class="header-bg" height="40" width="80" x="230" y="90"/><rect class="header-bg" height="40" width="90" x="310" y="90"/><rect class="header-bg" height="40" width="450" x="400" y="90"/><text class="header-text" fill="var(--surface)" text-anchor="middle" x="100" y="115">Valid</text><text class="header-text" fill="var(--surface)" text-anchor="middle" x="100" y="115">Valid</text><text class="header-text" fill="var(--surface)" text-anchor="middle" x="190" y="105">Tag</text><text class="small-text" fill="var(--surface)" text-anchor="middle" x="190" y="120">(标记)</text><text class="header-text" fill="var(--surface)" text-anchor="middle" x="270" y="105">Dirty</text><text class="small-text" fill="var(--surface)" text-anchor="middle" x="270" y="120">(脏位)</text><text class="header-text" fill="var(--surface)" text-anchor="middle" x="355" y="105">Reference</text><text class="small-text" fill="var(--surface)" text-anchor="middle" x="355" y="120">(访问位)</text><text class="header-text" fill="var(--surface)" text-anchor="middle" x="625" y="105">Cache Block (Data)</text><text class="small-text" fill="var(--surface)" text-anchor="middle" x="625" y="120">(数据块)</text><rect class="row-bg-1" height="35" width="100" x="50" y="130"/><rect class="row-bg-1" height="35" width="80" x="150" y="130"/><rect class="row-bg-1" height="35" width="80" x="230" y="130"/><rect class="row-bg-1" height="35" width="90" x="310" y="130"/><rect class="row-bg-1" height="35" width="450" x="400" y="130"/><text class="content-text" text-anchor="middle" x="100" y="152">1</text><text class="content-text" text-anchor="middle" x="190" y="152">0x3A2F</text><text class="content-text" text-anchor="middle" x="270" y="152">0</text><text class="content-text" text-anchor="middle" x="355" y="152">0011</text><text class="content-text" text-anchor="middle" x="625" y="152">主存块副本 (Block 0)</text><rect class="row-bg-2" height="35" width="100" x="50" y="165"/><rect class="row-bg-2" height="35" width="80" x="150" y="165"/><rect class="row-bg-2" height="35" width="80" x="230" y="165"/><rect class="row-bg-2" height="35" width="90" x="310" y="165"/><rect class="row-bg-2" height="35" width="450" x="400" y="165"/><text class="content-text" text-anchor="middle" x="100" y="187">1</text><text class="content-text" text-anchor="middle" x="190" y="187">0x1B8C</text><text class="content-text" text-anchor="middle" x="270" y="187">1</text><text class="content-text" text-anchor="middle" x="355" y="187">0101</text><text class="content-text" text-anchor="middle" x="625" y="187">主存块副本 (Block 1)</text><rect class="row-bg-1" height="35" width="100" x="50" y="200"/><rect class="row-bg-1" height="35" width="80" x="150" y="200"/><rect class="row-bg-1" height="35" width="80" x="230" y="200"/><rect class="row-bg-1" height="35" width="90" x="310" y="200"/><rect class="row-bg-1" height="35" width="450" x="400" y="200"/><text class="content-text" text-anchor="middle" x="100" y="222">0</text><text class="content-text" text-anchor="middle" x="190" y="222">-</text><text class="content-text" text-anchor="middle" x="270" y="222">-</text><text class="content-text" text-anchor="middle" x="355" y="222">-</text><text class="content-text" fill="var(--neutral-mid)" text-anchor="middle" x="625" y="222">(无效数据)</text><text class="content-text" font-size="var(--svg-font-size-title)" text-anchor="middle" x="100" y="255">⋮</text><text class="content-text" font-size="var(--svg-font-size-title)" text-anchor="middle" x="190" y="255">⋮</text><text class="content-text" font-size="var(--svg-font-size-title)" text-anchor="middle" x="270" y="255">⋮</text><text class="content-text" font-size="var(--svg-font-size-title)" text-anchor="middle" x="355" y="255">⋮</text><text class="content-text" font-size="var(--svg-font-size-title)" text-anchor="middle" x="625" y="255">⋮</text><rect class="border" height="180" width="800" x="50" y="90"/><g transform="translate(50, 300)"><text class="header-text" fill="var(--violet-mid)" x="0" y="0">字段说明：</text><circle cx="10" cy="25" fill="var(--violet-mid)" r="3"/><text class="content-text" x="20" y="30"><tspan font-weight="var(--svg-font-weight-bold)">Valid (有效位)</tspan>: 1位，标识该cache行是否存储有效数据</text><circle cx="10" cy="50" fill="var(--violet-mid)" r="3"/><text class="content-text" x="20" y="55"><tspan font-weight="var(--svg-font-weight-bold)">Tag (标记)</tspan>: 与物理地址的tag字段匹配，判断是否命中</text><circle cx="10" cy="75" fill="var(--violet-mid)" r="3"/><text class="content-text" x="20" y="80"><tspan font-weight="var(--svg-font-weight-bold)">Dirty (脏位)</tspan>: 1位，标记数据是否被修改(回写法需要)</text><circle cx="10" cy="100" fill="var(--violet-mid)" r="3"/><text class="content-text" x="20" y="105"><tspan font-weight="var(--svg-font-weight-bold)">Reference (访问位)</tspan>: 记录访问信息，用于替换算法(如LRU)</text><circle cx="10" cy="125" fill="var(--orange-mid)" r="3"/><text class="content-text" x="20" y="130"><tspan font-weight="var(--svg-font-weight-bold)">Block (数据块)</tspan>: 缓存的主存块副本，实际存储的数据</text></g></svg>
