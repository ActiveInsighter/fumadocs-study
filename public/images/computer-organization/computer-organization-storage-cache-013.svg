<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg"><defs><style>.header-text{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#333}.content-text{font-family:Arial,sans-serif;font-size:12px;fill:#555}.small-text{font-family:Arial,sans-serif;font-size:10px;fill:#666}.title-text{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#222}.header-bg{fill:#4a90e2}.row-bg-1{fill:#f5f5f5}.row-bg-2{fill:#fff}.metadata-bg{fill:#e8f4f8}.data-bg{fill:#fff4e6}.border{stroke:#999;stroke-width:1.5;fill:none}.dashed{stroke:#999;stroke-width:1;stroke-dasharray:5,5;fill:none}</style></defs><text class="title-text" text-anchor="middle" x="450" y="30">Cache 存储结构</text><rect class="metadata-bg" height="30" stroke="#4A90E2" stroke-width="1" width="350" x="50" y="50"/><text class="header-text" text-anchor="middle" x="225" y="70">元数据部分 (控制信息)</text><rect class="data-bg" height="30" stroke="#E67E22" stroke-width="1" width="450" x="400" y="50"/><text class="header-text" text-anchor="middle" x="625" y="70">数据部分 (缓存内容)</text><rect class="header-bg" height="40" width="100" x="50" y="90"/><rect class="header-bg" height="40" width="80" x="150" y="90"/><rect class="header-bg" height="40" width="80" x="230" y="90"/><rect class="header-bg" height="40" width="90" x="310" y="90"/><rect class="header-bg" height="40" width="450" x="400" y="90"/><text class="header-text" fill="#fff" text-anchor="middle" x="100" y="115">Valid</text><text class="header-text" fill="#fff" text-anchor="middle" x="100" y="115">Valid</text><text class="header-text" fill="#fff" text-anchor="middle" x="190" y="105">Tag</text><text class="small-text" fill="#fff" text-anchor="middle" x="190" y="120">(标记)</text><text class="header-text" fill="#fff" text-anchor="middle" x="270" y="105">Dirty</text><text class="small-text" fill="#fff" text-anchor="middle" x="270" y="120">(脏位)</text><text class="header-text" fill="#fff" text-anchor="middle" x="355" y="105">Reference</text><text class="small-text" fill="#fff" text-anchor="middle" x="355" y="120">(访问位)</text><text class="header-text" fill="#fff" text-anchor="middle" x="625" y="105">Cache Block (Data)</text><text class="small-text" fill="#fff" text-anchor="middle" x="625" y="120">(数据块)</text><rect class="row-bg-1" height="35" width="100" x="50" y="130"/><rect class="row-bg-1" height="35" width="80" x="150" y="130"/><rect class="row-bg-1" height="35" width="80" x="230" y="130"/><rect class="row-bg-1" height="35" width="90" x="310" y="130"/><rect class="row-bg-1" height="35" width="450" x="400" y="130"/><text class="content-text" text-anchor="middle" x="100" y="152">1</text><text class="content-text" text-anchor="middle" x="190" y="152">0x3A2F</text><text class="content-text" text-anchor="middle" x="270" y="152">0</text><text class="content-text" text-anchor="middle" x="355" y="152">0011</text><text class="content-text" text-anchor="middle" x="625" y="152">主存块副本 (Block 0)</text><rect class="row-bg-2" height="35" width="100" x="50" y="165"/><rect class="row-bg-2" height="35" width="80" x="150" y="165"/><rect class="row-bg-2" height="35" width="80" x="230" y="165"/><rect class="row-bg-2" height="35" width="90" x="310" y="165"/><rect class="row-bg-2" height="35" width="450" x="400" y="165"/><text class="content-text" text-anchor="middle" x="100" y="187">1</text><text class="content-text" text-anchor="middle" x="190" y="187">0x1B8C</text><text class="content-text" text-anchor="middle" x="270" y="187">1</text><text class="content-text" text-anchor="middle" x="355" y="187">0101</text><text class="content-text" text-anchor="middle" x="625" y="187">主存块副本 (Block 1)</text><rect class="row-bg-1" height="35" width="100" x="50" y="200"/><rect class="row-bg-1" height="35" width="80" x="150" y="200"/><rect class="row-bg-1" height="35" width="80" x="230" y="200"/><rect class="row-bg-1" height="35" width="90" x="310" y="200"/><rect class="row-bg-1" height="35" width="450" x="400" y="200"/><text class="content-text" text-anchor="middle" x="100" y="222">0</text><text class="content-text" text-anchor="middle" x="190" y="222">-</text><text class="content-text" text-anchor="middle" x="270" y="222">-</text><text class="content-text" text-anchor="middle" x="355" y="222">-</text><text class="content-text" fill="#999" text-anchor="middle" x="625" y="222">(无效数据)</text><text class="content-text" font-size="20" text-anchor="middle" x="100" y="255">⋮</text><text class="content-text" font-size="20" text-anchor="middle" x="190" y="255">⋮</text><text class="content-text" font-size="20" text-anchor="middle" x="270" y="255">⋮</text><text class="content-text" font-size="20" text-anchor="middle" x="355" y="255">⋮</text><text class="content-text" font-size="20" text-anchor="middle" x="625" y="255">⋮</text><rect class="border" height="180" width="800" x="50" y="90"/><g transform="translate(50, 300)"><text class="header-text" fill="#4A90E2" x="0" y="0">字段说明：</text><circle cx="10" cy="25" fill="#4A90E2" r="3"/><text class="content-text" x="20" y="30"><tspan font-weight="bold">Valid (有效位)</tspan>: 1位，标识该cache行是否存储有效数据</text><circle cx="10" cy="50" fill="#4A90E2" r="3"/><text class="content-text" x="20" y="55"><tspan font-weight="bold">Tag (标记)</tspan>: 与物理地址的tag字段匹配，判断是否命中</text><circle cx="10" cy="75" fill="#4A90E2" r="3"/><text class="content-text" x="20" y="80"><tspan font-weight="bold">Dirty (脏位)</tspan>: 1位，标记数据是否被修改(回写法需要)</text><circle cx="10" cy="100" fill="#4A90E2" r="3"/><text class="content-text" x="20" y="105"><tspan font-weight="bold">Reference (访问位)</tspan>: 记录访问信息，用于替换算法(如LRU)</text><circle cx="10" cy="125" fill="#E67E22" r="3"/><text class="content-text" x="20" y="130"><tspan font-weight="bold">Block (数据块)</tspan>: 缓存的主存块副本，实际存储的数据</text></g></svg>
