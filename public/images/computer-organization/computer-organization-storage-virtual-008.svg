<svg viewBox="0 0 1e3 800" xmlns="http://www.w3.org/2000/svg"><defs><style>.title{font-family:Arial,sans-serif;font-size:24px;font-weight:700;fill:#2c3e50}.subtitle{font-family:Arial,sans-serif;font-size:16px;fill:#34495e}.label{font-family:Arial,sans-serif;font-size:14px;fill:#2c3e50}.small-label{font-family:Arial,sans-serif;font-size:12px;fill:#555}.bit-label{font-family:monospace;font-size:11px;fill:#666}.desc-text{font-family:Arial,sans-serif;font-size:13px;fill:#555}.field-box{stroke:#34495e;stroke-width:2}.ppn{fill:#3498db}.valid{fill:#2ecc71}.dirty{fill:#e74c3c}.accessed{fill:#f39c12}.protection{fill:#9b59b6}.cache{fill:#1abc9c}</style><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#555" points="0 0, 10 3, 0 6"/></marker></defs><text class="title" text-anchor="middle" x="500" y="35">页表项（PTE）结构</text><text class="subtitle" text-anchor="middle" x="500" y="60">Page Table Entry</text><g id="pte-structure"><rect class="field-box ppn" height="60" rx="4" width="300" x="100" y="100"/><text class="label" font-weight="bold" text-anchor="middle" x="250" y="135">物理页框号 (PPN)</text><text class="small-label" text-anchor="middle" x="250" y="152">Physical Page Number</text><rect class="field-box valid" height="60" rx="4" width="60" x="420" y="100"/><text class="label" font-weight="bold" text-anchor="middle" x="450" y="127">V</text><text class="small-label" text-anchor="middle" x="450" y="145">有效位</text><rect class="field-box dirty" height="60" rx="4" width="60" x="500" y="100"/><text class="label" font-weight="bold" text-anchor="middle" x="530" y="127">D</text><text class="small-label" text-anchor="middle" x="530" y="145">修改位</text><rect class="field-box accessed" height="60" rx="4" width="60" x="580" y="100"/><text class="label" font-weight="bold" text-anchor="middle" x="610" y="127">A</text><text class="small-label" text-anchor="middle" x="610" y="145">访问位</text><rect class="field-box protection" height="60" rx="4" width="100" x="660" y="100"/><text class="label" font-weight="bold" text-anchor="middle" x="710" y="127">Prot</text><text class="small-label" text-anchor="middle" x="710" y="145">保护位</text><rect class="field-box cache" height="60" rx="4" width="100" x="780" y="100"/><text class="label" font-weight="bold" text-anchor="middle" x="830" y="127">Cache</text><text class="small-label" text-anchor="middle" x="830" y="145">缓存位</text></g><g id="bit-markers"><text class="bit-label" text-anchor="middle" x="250" y="85">通常 20-52 位</text><text class="bit-label" text-anchor="middle" x="450" y="85">1 位</text><text class="bit-label" text-anchor="middle" x="530" y="85">1 位</text><text class="bit-label" text-anchor="middle" x="610" y="85">1 位</text><text class="bit-label" text-anchor="middle" x="710" y="85">2-3 位</text><text class="bit-label" text-anchor="middle" x="830" y="85">1-2 位</text></g><g id="descriptions"><line marker-end="url(#arrowhead)" stroke="#3498db" stroke-width="2" x1="250" x2="250" y1="160" y2="200"/><rect fill="#ecf0f1" height="75" rx="6" stroke="#3498db" stroke-width="2" width="260" x="120" y="205"/><text class="desc-text" font-weight="bold" text-anchor="middle" x="250" y="225">物理页框号</text><text class="desc-text" text-anchor="middle" x="250" y="245">指向实际物理内存中的</text><text class="desc-text" text-anchor="middle" x="250" y="262">页框地址</text><line marker-end="url(#arrowhead)" stroke="#2ecc71" stroke-width="2" x1="450" x2="450" y1="160" y2="300"/><rect fill="#ecf0f1" height="75" rx="6" stroke="#2ecc71" stroke-width="2" width="180" x="360" y="305"/><text class="desc-text" font-weight="bold" text-anchor="middle" x="450" y="325">有效位</text><text class="desc-text" text-anchor="middle" x="450" y="345">1 = 页面有效</text><text class="desc-text" text-anchor="middle" x="450" y="362">0 = 页面无效/未分配</text><line marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="2" x1="530" x2="530" y1="160" y2="395"/><rect fill="#ecf0f1" height="75" rx="6" stroke="#e74c3c" stroke-width="2" width="180" x="440" y="400"/><text class="desc-text" font-weight="bold" text-anchor="middle" x="530" y="420">修改位</text><text class="desc-text" text-anchor="middle" x="530" y="440">1 = 页面已被修改</text><text class="desc-text" text-anchor="middle" x="530" y="457">需要写回磁盘</text><line marker-end="url(#arrowhead)" stroke="#f39c12" stroke-width="2" x1="610" x2="610" y1="160" y2="490"/><rect fill="#ecf0f1" height="75" rx="6" stroke="#f39c12" stroke-width="2" width="180" x="520" y="495"/><text class="desc-text" font-weight="bold" text-anchor="middle" x="610" y="515">访问位</text><text class="desc-text" text-anchor="middle" x="610" y="535">1 = 页面已被访问</text><text class="desc-text" text-anchor="middle" x="610" y="552">用于页面置换算法</text><line marker-end="url(#arrowhead)" stroke="#9b59b6" stroke-width="2" x1="710" x2="710" y1="160" y2="585"/><rect fill="#ecf0f1" height="90" rx="6" stroke="#9b59b6" stroke-width="2" width="190" x="615" y="590"/><text class="desc-text" font-weight="bold" text-anchor="middle" x="710" y="610">保护位</text><text class="desc-text" text-anchor="middle" x="710" y="630">R = 可读</text><text class="desc-text" text-anchor="middle" x="710" y="647">W = 可写</text><text class="desc-text" text-anchor="middle" x="710" y="664">X = 可执行</text><line marker-end="url(#arrowhead)" stroke="#1abc9c" stroke-width="2" x1="830" x2="830" y1="160" y2="300"/><rect fill="#ecf0f1" height="75" rx="6" stroke="#1abc9c" stroke-width="2" width="190" x="735" y="305"/><text class="desc-text" font-weight="bold" text-anchor="middle" x="830" y="325">缓存位</text><text class="desc-text" text-anchor="middle" x="830" y="345">控制是否允许</text><text class="desc-text" text-anchor="middle" x="830" y="362">高速缓存该页面</text></g><rect fill="#fff9e6" height="80" rx="8" stroke="#f39c12" stroke-width="2" width="900" x="50" y="690"/><text class="desc-text" font-weight="bold" text-anchor="middle" x="500" y="715">📌 重要提示</text><text class="desc-text" text-anchor="middle" x="500" y="735">在单级页表中，虚拟页框号（VPN）不需要存储在页表项中</text><text class="desc-text" text-anchor="middle" x="500" y="752">它隐式地作为页表项的索引（下标）使用</text></svg>
