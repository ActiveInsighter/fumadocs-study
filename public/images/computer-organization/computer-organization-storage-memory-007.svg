<svg viewBox="0 0 780 320" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="busyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5b8b8"/><stop offset="100%" stop-color="#e88a8a"/></linearGradient><linearGradient id="idleGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bde5c8"/><stop offset="100%" stop-color="#8fd3a4"/></linearGradient><marker id="arrHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#333"/></marker><marker id="arrHeadRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c0392b"/></marker><marker id="arrHeadBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2c6fb8"/></marker></defs><g transform="translate(20,120)"><rect x="0" y="0" width="70" height="80" rx="6" fill="#f0f4fa" stroke="#4a6fa5" stroke-width="1.8"/><line x1="0" y1="20" x2="70" y2="20" stroke="#4a6fa5" stroke-width="1"/><line x1="0" y1="40" x2="70" y2="40" stroke="#4a6fa5" stroke-width="1"/><line x1="0" y1="60" x2="70" y2="60" stroke="#4a6fa5" stroke-width="1"/><text x="35" y="14" text-anchor="middle" font-size="11" fill="#4a6fa5" font-weight="600">Memory</text><text x="35" y="34" text-anchor="middle" font-size="10" fill="#6a7a8a">bank</text><text x="35" y="54" text-anchor="middle" font-size="10" fill="#6a7a8a">M0</text><text x="35" y="74" text-anchor="middle" font-size="10" fill="#6a7a8a">...</text></g><line x1="110" y1="180" x2="740" y2="180" stroke="#333" stroke-width="1.6" marker-end="url(#arrHead)"/><text x="745" y="184" font-size="12" fill="#333">t</text><g stroke="#333" stroke-width="1"><line x1="140" y1="176" x2="140" y2="184"/><line x1="540" y1="176" x2="540" y2="184"/></g><text x="140" y="205" text-anchor="middle" font-size="12" fill="#333">0 ns</text><text x="540" y="205" text-anchor="middle" font-size="12" fill="#333">40 ns</text><rect x="140" y="130" width="400" height="40" rx="4" fill="url(#busyGrad)" stroke="#c0392b" stroke-width="1.2"/><text x="340" y="155" text-anchor="middle" font-size="14" fill="#7a1e1e" font-weight="600">忙碌 (Busy)</text><text x="340" y="122" text-anchor="middle" font-size="11" fill="#7a1e1e">该存储体正在执行当前访问，无法响应新的请求</text><rect x="540" y="130" width="180" height="40" rx="4" fill="url(#idleGrad)" stroke="#2f8f4d" stroke-width="1.2"/><text x="630" y="155" text-anchor="middle" font-size="14" fill="#1f5a30" font-weight="600">可再次访问</text><text x="630" y="122" text-anchor="middle" font-size="11" fill="#1f5a30">完成后重新就绪</text><line x1="140" y1="80" x2="140" y2="128" stroke="#2c6fb8" stroke-width="1.8" marker-end="url(#arrHeadBlue)"/><text x="140" y="70" text-anchor="middle" font-size="12" fill="#2c6fb8" font-weight="600">第 1 次访问开始</text><line x1="540" y1="80" x2="540" y2="128" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrHeadRed)"/><text x="540" y="70" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">最早可发起第 2 次访问</text><g stroke="#333" stroke-width="1.4" fill="none"><line x1="140" y1="240" x2="140" y2="260"/><line x1="540" y1="240" x2="540" y2="260"/><line x1="140" y1="250" x2="540" y2="250" marker-start="url(#arrHead)" marker-end="url(#arrHead)"/></g><rect x="300" y="262" width="80" height="26" rx="4" fill="#fff8e1" stroke="#c9a233" stroke-width="1.2"/><text x="340" y="280" text-anchor="middle" font-size="13" fill="#7a5b00" font-weight="700">存储周期 T</text><text x="340" y="308" text-anchor="middle" font-size="11" fill="#555">从开始一次访问到能再次接受访问所需的最短时间</text><line x1="90" y1="160" x2="130" y2="160" stroke="#4a6fa5" stroke-width="1.2" stroke-dasharray="4 3"/></svg>
