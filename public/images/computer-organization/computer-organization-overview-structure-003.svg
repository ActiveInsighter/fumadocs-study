<svg viewBox="0 0 880 260" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="13" xmlns="http://www.w3.org/2000/svg"><style>.box{fill:none;stroke-width:1.5}.file{fill:#f0f7ff;stroke:#4a90e2}.tool{fill:#fff4e0;stroke:#e2954a}.exec{fill:#e8f7e8;stroke:#4ea84e}.arrow{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}.lbl{font-size:12px;fill:#333}.ttl{font-weight:700}text{fill:#222}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#555"/></marker></defs><g><rect class="box file" x="20" y="100" width="100" height="60" rx="6"/><text x="70" y="125" text-anchor="middle" class="ttl">hello.c</text><text x="70" y="145" text-anchor="middle" class="lbl">源代码</text><rect class="box file" x="180" y="100" width="100" height="60" rx="6"/><text x="230" y="125" text-anchor="middle" class="ttl">hello.i</text><text x="230" y="145" text-anchor="middle" class="lbl">预处理代码</text><rect class="box file" x="340" y="100" width="100" height="60" rx="6"/><text x="390" y="125" text-anchor="middle" class="ttl">hello.s</text><text x="390" y="145" text-anchor="middle" class="lbl">汇编代码</text><rect class="box file" x="500" y="100" width="100" height="60" rx="6"/><text x="550" y="125" text-anchor="middle" class="ttl">hello.o</text><text x="550" y="145" text-anchor="middle" class="lbl">目标文件</text><rect class="box exec" x="700" y="100" width="140" height="60" rx="6"/><text x="770" y="125" text-anchor="middle" class="ttl">hello (a.out)</text><text x="770" y="145" text-anchor="middle" class="lbl">可执行文件</text></g><g><rect class="box tool" x="130" y="40" width="60" height="36" rx="6"/><text x="160" y="62" text-anchor="middle">预处理器</text><rect class="box tool" x="290" y="40" width="60" height="36" rx="6"/><text x="320" y="62" text-anchor="middle">编译器</text><rect class="box tool" x="450" y="40" width="60" height="36" rx="6"/><text x="480" y="62" text-anchor="middle">汇编器</text><rect c