<svg viewBox="0 0 880 260" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><style>.box{fill:none;stroke-width:1.5}.file{fill:var(--sky-soft);stroke:var(--violet-mid)}.tool{fill:var(--yellow-soft);stroke:var(--orange-mid)}.exec{fill:var(--green-soft);stroke:var(--lime-mid)}.arrow{stroke:var(--neutral-deep);stroke-width:1.5;fill:none;marker-end:url(#a)}.lbl{font-size: var(--svg-font-size-label);fill:var(--neutral-ink)}.ttl{font-weight: var(--svg-font-weight-bold)}text{fill:var(--ink)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-deep)"/></marker></defs><g><rect class="box file" x="20" y="100" width="100" height="60" rx="6"/><text x="70" y="125" text-anchor="middle" class="ttl">hello.c</text><text x="70" y="145" text-anchor="middle" class="lbl">源代码</text><rect class="box file" x="180" y="100" width="100" height="60" rx="6"/><text x="230" y="125" text-anchor="middle" class="ttl">hello.i</text><text x="230" y="145" text-anchor="middle" class="lbl">预处理代码</text><rect class="box file" x="340" y="100" width="100" height="60" rx="6"/><text x="390" y="125" text-anchor="middle" class="ttl">hello.s</text><text x="390" y="145" text-anchor="middle" class="lbl">汇编代码</text><rect class="box file" x="500" y="100" width="100" height="60" rx="6"/><text x="550" y="125" text-anchor="middle" class="ttl">hello.o</text><text x="550" y="145" text-anchor="middle" class="lbl">目标文件</text><rect class="box exec" x="700" y="100" width="140" height="60" rx="6"/><text x="770" y="125" text-anchor="middle" class="ttl">hello (a.out)</text><text x="770" y="145" text-anchor="middle" class="lbl">可执行文件</text></g><g><rect class="box tool" x="130" y="40" width="60" height="36" rx="6"/><text x="160" y="62" text-anchor="middle">预处理器</text><rect class="box tool" x="290" y="40" width="60" height="36" rx="6"/><text x="320" y="62" text-anchor="middle">编译器</text><rect class="box tool" x="450" y="40" width="60" height="36" rx="6"/><text x="480" y="62" text-anchor="middle">汇编器</text><rect class="box tool" x="610" y="40" width="80" height="36" rx="6"/><text x="650" y="62" text-anchor="middle">链接器 + 库</text></g><g stroke="var(--neutral-mid)" stroke-dasharray="3 3" fill="none"><line x1="160" y1="76" x2="160" y2="110"/><line x1="320" y1="76" x2="320" y2="110"/><line x1="480" y1="76" x2="480" y2="110"/><line x1="650" y1="76" x2="650" y2="110"/></g><g><path class="arrow" d="M120 130h60"/><path class="arrow" d="M280 130h60"/><path class="arrow" d="M440 130h60"/><path class="arrow" d="M6e2 130H7e2"/></g><g font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)"><text x="150" y="200" text-anchor="middle">gcc -E</text><text x="310" y="200" text-anchor="middle">gcc -S</text><text x="470" y="200" text-anchor="middle">gcc -c</text><text x="650" y="200" text-anchor="middle">gcc / ld</text></g><g><rect class="box tool" x="700" y="200" width="140" height="36" rx="6"/><text x="770" y="223" text-anchor="middle">加载器 → CPU 执行</text><path class="arrow" d="M770 160v40"/></g></svg>
