<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><style>.title{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);fill:var(--blue-ink)}.subtitle{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);fill:var(--blue-ink)}.text{font-family: var(--svg-font-family);font-size: var(--svg-font-size-body);fill:var(--blue-ink)}.formula{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-label);fill:var(--purple-deep)}.binary{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold)}.positive{fill:var(--green-mid)}.negative{fill:var(--red-deep)}.highlight{fill:var(--yellow-mid)}.arrow{stroke:var(--indigo-mid);stroke-width:2;fill:none;marker-end:url(#arrowhead)}.box{stroke:var(--indigo-light);stroke-width:1;fill:none;rx:5}.method-box{stroke:var(--indigo-mid);stroke-width:2;fill:var(--neutral-soft);rx:8}</style><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--indigo-mid)"/></marker></defs><text x="400" y="30" class="title svg-text svg-text-theme" text-anchor="middle">十进制负数 → 补码二进制转换</text><rect x="50" y="50" width="120" height="40" class="box"/><text x="110" y="75" class="subtitle svg-text svg-text-theme" text-anchor="middle">十进制: -73</text><rect x="30" y="110" width="360" height="200" class="method-box"/><text x="210" y="135" class="subtitle svg-text svg-text-theme" text-anchor="middle">方法一：基于公式直接观察</text><text x="50" y="160" class="formula svg-text svg-text-theme">S = Σ(i=0 to n-2) 2^i × bi - 2^(n-1) × bn-1</text><text x="50" y="185" class="text svg-text svg-text-theme">-73 = -128 + 55</text><text x="50" y="205" class="text svg-text svg-text-theme">= -128 + 32 + 16 + 4 + 2 + 1</text><text x="50" y="225" class="text svg-text svg-text-theme">= -2^7 + 2^5 + 2^4 + 2^2 + 2^1 + 2^0</text><text x="50" y="250" class="text svg-text svg-text-theme">位置:</text><text x="120" y="250" class="formula svg-text svg-text-theme">7 6 5 4 3 2 1 0</text><text x="50" y="275" class="text svg-text svg-text-theme">补码:</text><text x="120" y="275" class="binary negative svg-text svg-text-theme">1</text><text x="142" y="275" class="binary positive svg-text svg-text-theme">0</text><text x="164" y="275" class="binary highlight svg-text svg-text-theme">1</text><text x="186" y="275" class="binary highlight svg-text svg-text-theme">1</text><text x="208" y="275" class="binary positive svg-text svg-text-theme">0</text><text x="230" y="275" class="binary highlight svg-text svg-text-theme">1</text><text x="252" y="275" class="binary highlight svg-text svg-text-theme">1</text><text x="274" y="275" class="binary highlight svg-text svg-text-theme">1</text><rect x="410" y="110" width="360" height="200" class="method-box"/><text x="590" y="135" class="subtitle svg-text svg-text-theme" text-anchor="middle">方法二：取反加一法</text><text x="430" y="165" class="text svg-text svg-text-theme">步骤1: |-73| = 73 的纯二进制</text><text x="450" y="185" class="formula svg-text svg-text-theme">73 = 64 + 8 + 1 = 2^6 + 2^3 + 2^0</text><text x="450" y="205" class="binary positive svg-text svg-text-theme">01001001</text><line x1="590" y1="215" x2="590" y2="235" class="arrow"/><text x="430" y="255" class="text svg-text svg-text-theme">步骤2: 取反 (0↔1)</text><text x="450" y="275" class="binary negative svg-text svg-text-theme">10110110</text><line x1="590" y1="285" x2="590" y2="305" class="arrow"/><text x="430" y="325" class="text svg-text svg-text-theme">步骤3: 加1</text><text x="450" y="345" class="formula svg-text svg-text-theme">10110110 + 1 =</text><text x="600" y="345" class="binary negative svg-text svg-text-theme" style="font-size: var(--svg-font-size-title)">10110111</text><rect x="200" y="370" width="400" height="80" style="stroke:var(--green-mid);stroke-width:3;fill:var(--mint-soft);rx:10"/><text x="400" y="395" class="subtitle svg-text svg-text-on-light" text-anchor="middle">两种方法得到相同结果</text><text x="250" y="420" class="text svg-text svg-text-theme">方法一结果:</text><text x="370" y="420" class="binary negative svg-text svg-text-theme" style="font-size: var(--svg-font-size-title)">10110111</text><text x="250" y="440" class="text svg-text svg-text-theme">方法二结果:</text><text x="370" y="440" class="binary negative svg-text svg-text-theme" style="font-size: var(--svg-font-size-title)">10110111</text><text x="50" y="490" class="subtitle svg-text svg-text-theme">验证: 10110111(补码) → 十进制</text><text x="50" y="515" class="formula svg-text svg-text-theme">= 1×2^0 + 1×2^1 + 1×2^2 + 0×2^3 + 1×2^4 + 1×2^5 + 0×2^6 - 1×2^7</text><text x="50" y="535" class="formula svg-text svg-text-theme">= 1 + 2 + 4 + 0 + 16 + 32 + 0 - 128</text><text x="50" y="555" class="formula svg-text svg-text-theme">= 55 - 128 = -73 ✓</text><text x="50" y="580" class="text svg-text svg-text-theme" style="font-size: var(--svg-font-size-label)">注: 最高位为符号位，1表示负数，0表示非负数</text></svg>
