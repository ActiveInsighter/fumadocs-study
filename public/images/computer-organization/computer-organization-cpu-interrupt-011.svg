<svg viewBox="0 0 900 460" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-deep)"/></marker><marker id="arrowBlock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--red-deep)"/></marker><marker id="arrowPass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--green-mid)"/></marker></defs><g><rect x="20" y="20" width="420" height="420" rx="14" fill="var(--paper)" stroke="var(--indigo-deep)" stroke-width="1.5"/><text x="230" y="52" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-deep)">可屏蔽中断 (Maskable)</text><text x="230" y="74" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">通过 INTR 引脚 · 可被屏蔽字关闭</text><rect x="45" y="100" width="120" height="36" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="105" y="123" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">键盘 / 鼠标</text><rect x="45" y="145" width="120" height="36" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="105" y="168" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">定时器</text><rect x="45" y="190" width="120" height="36" rx="6" fill="var(--surface)" stroke="var(--indigo-mid)"/><text x="105" y="213" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">串口 / USB</text><text x="105" y="248" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--sky-deep)">（常规外设事件）</text><rect x="205" y="120" width="90" height="90" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow-mid)"/><text x="250" y="150" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)" fill="var(--amber-deep)">屏蔽字</text><text x="250" y="170" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--amber-deep)">IMR / IF</text><text x="250" y="192" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--amber-deep)">可打开/关闭</text><line x1="165" y1="118" x2="205" y2="140" stroke="var(--neutral-deep)" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="165" y1="163" x2="205" y2="165" stroke="var(--neutral-deep)" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="165" y1="208" x2="205" y2="190" stroke="var(--neutral-deep)" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="335" y="140" width="80" height="50" rx="6" fill="var(--sky-soft)" stroke="var(--indigo-deep)"/><text x="375" y="163" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-deep)">INTR</text><text x="375" y="180" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--indigo-deep)">CPU 引脚</text><line x1="295" y1="150" x2="335" y2="150" stroke="var(--green-mid)" stroke-width="1.8" marker-end="url(#arrowPass)"/><text x="325" y="135" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--green-mid)">IF=1 允许</text><line x1="295" y1="180" x2="330" y2="180" stroke="var(--red-deep)" stroke-width="1.8" stroke-dasharray="5,3"/><line x1="322" y1="172" x2="336" y2="188" stroke="var(--red-deep)" stroke-width="2"/><line x1="336" y1="172" x2="322" y2="188" stroke="var(--red-deep)" stroke-width="2"/><text x="325" y="205" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">IF=0 屏蔽</text><g transform="translate(40,270)"><text x="0" y="0" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-deep)">特点</text><text x="0" y="24" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• 优先级较低，用于<tspan font-weight="var(--svg-font-weight-semibold)">非紧急</tspan>事件</text><text x="0" y="46" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• CPU 可通过<tspan font-weight="var(--svg-font-weight-semibold)">CLI / STI</tspan>关/开中断</text><text x="0" y="68" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• 屏蔽字（IMR）可<tspan font-weight="var(--svg-font-weight-semibold)">动态调整</tspan>优先级</text><text x="0" y="90" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• 一般由<tspan font-weight="var(--svg-font-weight-semibold)">中断控制器 8259A</tspan>管理</text><text x="0" y="112" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• 举例：串口、USB、时钟中断</text><text x="0" y="140" font-size="var(--svg-font-size-label)" fill="var(--amber-deep)">→ 可延迟响应，允许系统调度</text></g></g><g><rect x="460" y="20" width="420" height="420" rx="14" fill="var(--paper)" stroke="var(--red-deep)" stroke-width="1.5"/><text x="670" y="52" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">不可屏蔽中断 (NMI)</text><text x="670" y="74" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--rose-deep)">通过 NMI 引脚 · 无法被屏蔽字关闭</text><rect x="485" y="100" width="140" height="36" rx="6" fill="var(--surface)" stroke="var(--red-mid)"/><text x="555" y="123" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">电源失效</text><rect x="485" y="145" width="140" height="36" rx="6" fill="var(--surface)" stroke="var(--red-mid)"/><text x="555" y="168" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">内存校验错误</text><rect x="485" y="190" width="140" height="36" rx="6" fill="var(--surface)" stroke="var(--red-mid)"/><text x="555" y="213" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">硬件严重故障</text><text x="555" y="248" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--rose-deep)">（关键 / 紧急事件）</text><rect x="650" y="120" width="90" height="90" rx="8" fill="var(--neutral-soft)" stroke="var(--ink-soft)" stroke-dasharray="4,3"/><text x="695" y="155" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--ink-soft)">无屏蔽</text><text x="695" y="175" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--ink-soft)">开关</text><text x="695" y="197" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">直连</text><rect x="775" y="140" width="80" height="50" rx="6" fill="var(--red-soft)" stroke="var(--red-deep)"/><text x="815" y="163" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">NMI</text><text x="815" y="180" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">CPU 引脚</text><line x1="625" y1="118" x2="775" y2="150" stroke="var(--red-deep)" stroke-width="2" marker-end="url(#arrowBlock)"/><line x1="625" y1="163" x2="775" y2="165" stroke="var(--red-deep)" stroke-width="2" marker-end="url(#arrowBlock)"/><line x1="625" y1="208" x2="775" y2="180" stroke="var(--red-deep)" stroke-width="2" marker-end="url(#arrowBlock)"/><text x="700" y="240" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)" font-weight="var(--svg-font-weight-semibold)">CPU 必须立即响应</text><g transform="translate(480,270)"><text x="0" y="0" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">特点</text><text x="0" y="24" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">•<tspan font-weight="var(--svg-font-weight-semibold)">最高优先级</tspan>，用于紧急/致命事件</text><text x="0" y="46" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• 不受 IF 标志和屏蔽字控制</text><text x="0" y="68" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• 可<tspan font-weight="var(--svg-font-weight-semibold)">打断其他中断服务程序</tspan></text><text x="0" y="90" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• 强制打断当前任务，无法延迟</text><text x="0" y="112" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">• 举例：断电、奇偶校验错、看门狗超时</text><text x="0" y="140" font-size="var(--svg-font-size-label)" fill="var(--red-deep)">→ 保障系统可靠性与安全性</text></g></g></svg>
