<svg viewBox="0 0 900 480" font-family="Microsoft YaHei, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="480" fill="#f8f9fa" rx="12"/><rect x="20" y="15" width="860" height="50" fill="#2c3e50" rx="8"/><text x="450" y="47" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">突发（Burst）总线传输事务</text><rect x="20" y="80" width="860" height="175" fill="#ffeaa7" rx="8" stroke="#fdcb6e" stroke-width="2"/><text x="40" y="106" fill="#d35400" font-size="14" font-weight="bold">❌ 普通传输方式（非突发）</text><text x="600" y="106" fill="#d35400" font-size="12">每次传输都需要重新发送地址，浪费总线带宽</text><text x="40" y="135" fill="#555" font-size="12">时钟周期:</text><rect x="110" y="118" width="70" height="30" fill="#e17055" rx="3" stroke="#c0392b" stroke-width="1.5"/><text x="145" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ADDR1</text><rect x="180" y="118" width="70" height="30" fill="#74b9ff" rx="3" stroke="#0984e3" stroke-width="1.5"/><text x="215" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DATA1</text><rect x="270" y="118" width="70" height="30" fill="#e17055" rx="3" stroke="#c0392b" stroke-width="1.5"/><text x="305" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ADDR2</text><rect x="340" y="118" width="70" height="30" fill="#74b9ff" rx="3" stroke="#0984e3" stroke-width="1.5"/><text x="375" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DATA2</text><rect x="430" y="118" width="70" height="30" fill="#e17055" rx="3" stroke="#c0392b" stroke-width="1.5"/><text x="465" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ADDR3</text><rect x="500" y="118" width="70" height="30" fill="#74b9ff" rx="3" stroke="#0984e3" stroke-width="1.5"/><text x="535" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DATA3</text><rect x="590" y="118" width="70" height="30" fill="#e17055" rx="3" stroke="#c0392b" stroke-width="1.5"/><text x="625" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ADDR4</text><rect x="660" y="118" width="70" height="30" fill="#74b9ff" rx="3" stroke="#0984e3" stroke-width="1.5"/><text x="695" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DATA4</text><text x="145" y="162" text-anchor="middle" fill="#666" font-size="10">T1</text><text x="215" y="162" text-anchor="middle" fill="#666" font-size="10">T2</text><text x="305" y="162" text-anchor="middle" fill="#666" font-size="10">T3</text><text x="375" y="162" text-anchor="middle" fill="#666" font-size="10">T4</text><text x="465" y="162" text-anchor="middle" fill="#666" font-size="10">T5</text><text x="535" y="162" text-anchor="middle" fill="#666" font-size="10">T6</text><text x="625" y="162" text-anchor="middle" fill="#666" font-size="10">T7</text><text x="695" y="162" text-anchor="middle" fill="#666" font-size="10">T8</text><line x1="110" y1="172" x2="249" y2="172" stroke="#c0392b" stroke-width="1.5"/><line x1="110" y1="168" x2="110" y2="172" stroke="#c0392b" stroke-width="1.5"/><line x1="249" y1="168" x2="249" y2="172" stroke="#c0392b" stroke-width="1.5"/><text x="180" y="184" text-anchor="middle" fill="#c0392b" font-size="10">事务 ①</text><line x1="270" y1="172" x2="409" y2="172" stroke="#c0392b" stroke-width="1.5"/><line x1="270" y1="168" x2="270" y2="172" stroke="#c0392b" stroke-width="1.5"/><line x1="409" y1="168" x2="409" y2="172" stroke="#c0392b" stroke-width="1.5"/><text x="340" y="184" text-anchor="middle" fill="#c0392b" font-size="10">事务 ②</text><line x1="430" y1="172" x2="569" y2="172" stroke="#c0392b" stroke-width="1.5"/><line x1="430" y1="168" x2="430" y2="172" stroke="#c0392b" stroke-width="1.5"/><line x1="569" y1="168" x2="569" y2="172" stroke="#c0392b" stroke-width="1.5"/><text x="500" y="184" text-anchor="middle" fill="#c0392b" font-size="10">事务 ③</text><line x1="590" y1="172" x2="729" y2="172" stroke="#c0392b" stroke-width="1.5"/><line x1="590" y1="168" x2="590" y2="172" stroke="#c0392b" stroke-width="1.5"/><line x1="729" y1="168" x2="729" y2="172" stroke="#c0392b" stroke-width="1.5"/><text x="660" y="184" text-anchor="middle" fill="#c0392b" font-size="10">事务 ④</text><rect x="40" y="193" width="820" height="48" fill="#fab1a0" rx="5"/><text x="450" y="213" text-anchor="middle" fill="#922b21" font-size="13" font-weight="bold">总耗时：8 个时钟周期</text><text x="450" y="230" text-anchor="middle" fill="#922b21" font-size="11">每传输 1 个数据 = 1 个地址周期 + 1 个数据周期，总线利用率仅 50%</text><rect x="20" y="270" width="860" height="190" fill="#d5f5e3" rx="8" stroke="#27ae60" stroke-width="2"/><text x="40" y="296" fill="#1a5276" font-size="14" font-weight="bold">✅ 突发传输方式（Burst）</text><text x="600" y="296" fill="#1a5276" font-size="12">仅发送一次起始地址，后续地址自动递增</text><text x="40" y="330" fill="#555" font-size="12">时钟周期:</text><rect x="110" y="313" width="70" height="30" fill="#e17055" rx="3" stroke="#c0392b" stroke-width="2"/><text x="145" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ADDR1</text><rect x="190" y="313" width="70" height="30" fill="#00b894" rx="3" stroke="#00695c" stroke-width="2"/><text x="225" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DATA1</text><rect x="270" y="313" width="70" height="30" fill="#00b894" rx="3" stroke="#00695c" stroke-width="2"/><text x="305" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DATA2</text><rect x="350" y="313" width="70" height="30" fill="#00b894" rx="3" stroke="#00695c" stroke-width="2"/><text x="385" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DATA3</text><rect x="430" y="313" width="70" height="30" fill="#00b894" rx="3" stroke="#00695c" stroke-width="2"/><text x="465" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">DATA4</text><rect x="520" y="313" width="70" height="30" fill="#dfe6e9" rx="3" stroke="#b2bec3" stroke-width="1" stroke-dasharray="9,3"/><text x="555" y="333" text-anchor="middle" fill="#aaa" font-size="12">空闲</text><text x="145" y="357" text-anchor="middle" fill="#666" font-size="10">T1</text><text x="225" y="357" text-anchor="middle" fill="#666" font-size="10">T2</text><text x="305" y="357" text-anchor="middle" fill="#666" font-size="10">T3</text><text x="385" y="357" text-anchor="middle" fill="#666" font-size="10">T4</text><text x="465" y="357" text-anchor="middle" fill="#666" font-size="10">T5</text><line x1="190" y1="302" x2="263" y2="302" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrowYellow)"/><line x1="270" y1="302" x2="343" y2="302" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrowYellow)"/><line x1="350" y1="302" x2="423" y2="302" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrowYellow)"/><text x="307" y="298" text-anchor="middle" fill="#d68910" font-size="10">地址自动递增（无需占用总线）</text><line x1="110" y1="362" x2="499" y2="362" stroke="#27ae60" stroke-width="2"/><line x1="110" y1="357" x2="110" y2="362" stroke="#27ae60" stroke-width="2"/><line x1="499" y1="357" x2="499" y2="362" stroke="#27ae60" stroke-width="2"/><text x="305" y="376" text-anchor="middle" fill="#1e8449" font-size="12" font-weight="bold">一次完整的突发总线事务</text><rect x="40" y="385" width="820" height="60" fill="#a9dfbf" rx="5"/><text x="450" y="406" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="bold">总耗时：5 个时钟周期（1 次地址 + 4 次连续数据）</text><text x="450" y="423" text-anchor="middle" fill="#196f3d" font-size="11">总线利用率：4/5 = 80%，相比普通方式节省 3 个地址周期</text><text x="450" y="438" text-anchor="middle" fill="#196f3d" font-size="11">突发长度越大，总线利用率越高，传输效率越好</text><defs><marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#f39c12"/></marker></defs></svg>
