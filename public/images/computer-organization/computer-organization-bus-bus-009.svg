" y="162" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">T7</text><text x="695" y="162" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">T8</text><line x1="110" y1="172" x2="249" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><line x1="110" y1="168" x2="110" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><line x1="249" y1="168" x2="249" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><text x="180" y="184" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">事务 ①</text><line x1="270" y1="172" x2="409" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><line x1="270" y1="168" x2="270" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><line x1="409" y1="168" x2="409" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><text x="340" y="184" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">事务 ②</text><line x1="430" y1="172" x2="569" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><line x1="430" y1="168" x2="430" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><line x1="569" y1="168" x2="569" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><text x="500" y="184" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">事务 ③</text><line x1="590" y1="172" x2="729" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><line x1="590" y1="168" x2="590" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><line x1="729" y1="168" x2="729" y2="172" stroke="var(--red-deep)" stroke-width="1.5"/><text x="660" y="184" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">事务 ④</text><rect x="40" y="193" width="820" height="48" fill="var(--coral-mid)" rx="5"/><text x="450" y="213" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">总耗时：8 个时钟周期</text><text x="450" y="230" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">每传输 1 个数据 = 1 个地址周期 + 1 个数据周期，总线利用率仅 50%</text><rect x="20" y="270" width="860" height="190" fill="var(--green-light)" rx="8" stroke="var(--green-mid)" stroke-width="2"/><text x="40" y="296" fill="var(--blue-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">✅ 突发传输方式（Burst）</text><text x="600" y="296" fill="var(--blue-deep)" font-size="var(--svg-font-size-label)">仅发送一次起始地址，后续地址自动递增</text><text x="40" y="330" fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)">时钟周期:</text><rect x="110" y="313" width="70" height="30" fill="var(--coral-deep)" rx="3" stroke="var(--red-deep)" stroke-width="2"/><text x="145" y="333" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">ADDR1</text><rect x="190" y="313" width="70" height="30" fill="var(--mint-mid)" rx="3" stroke="var(--mint-deep)" stroke-width="2"/><text x="225" y="333" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">DATA1</text><rect x="270" y="313" width="70" height="30" fill="var(--mint-mid)" rx="3" stroke="var(--mint-deep)" stroke-width="2"/><text x="305" y="333" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">DATA2</text><rect x="350" y="313" width="70" height="30" fill="var(--mint-mid)" rx="3" stroke="var(--mint-deep)" stroke-width="2"/><text x="385" y="333" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">DATA3</text><rect x="430" y="313" width="70" height="30" fill="var(--mint-mid)" rx="3" stroke="var(--mint-deep)" stroke-width="2"/><text x="465" y="333" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">DATA4</text><rect x="520" y="313" width="70" height="30" fill="var(--sky-soft)" rx="3" stroke="var(--cyan-mid)" stroke-width="1" stroke-dasharray="9,3"/><text x="555" y="333" text-anchor="middle" fill="var(--neutral-mid)" font-size="var(--svg-font-size-label)">空闲</text><text x="145" y="357" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">T1</text><text x="225" y="357" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">T2</text><text x="305" y="357" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">T3</text><text x="385" y="357" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">T4</text><text x="465" y="357" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">T5</text><line x1="190" y1="302" x2="263" y2="302" stroke="var(--yellow-mid)" stroke-width="1.5" marker-end="url(#arrowYellow)"/><line x1="270" y1="302" x2="343" y2="302" stroke="var(--yellow-mid)" stroke-width="1.5" marker-end="url(#arrowYellow)"/><line x1="350" y1="302" x2="423" y2="302" stroke="var(--yellow-mid)" stroke-width="1.5" marker-end="url(#arrowYellow)"/><text x="307" y="298" text-anchor="middle" fill="var(--yellow-mid)" font-size="var(--svg-font-size-caption)">地址自动递增（无需占用总线）</text><line x1="110" y1="362" x2="499" y2="362" stroke="var(--green-mid)" stroke-width="2"/><line x1="110" y1="357" x2="110" y2="362" stroke="var(--green-mid)" stroke-width="2"/><line x1="499" y1="357" x2="499" y2="362" stroke="var(--green-mid)" stroke-width="2"/><text x="305" y="376" text-anchor="middle" fill="var(--green-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">一次完整的突发总线事务</text><rect x="40" y="385" width="820" height="60" fill="var(--green-mid)" rx="5"/><text x="450" y="406" text-anchor="middle" fill="var(--blue-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">总耗时：5 个时钟周期（1 次地址 + 4 次连续数据）</text><text x="450" y="423" text-anchor="middle" fill="var(--green-deep)" font-size="var(--svg-font-size-caption)">总线利用率：4/5 = 80%，相比普通方式节省 3 个地址周期</text><text x="450" y="438" text-anchor="middle" fill="var(--green-deep)" font-size="var(--svg-font-size-caption)">突发长度越大，总线利用率越高，传输效率越好</text><defs><marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="var(--yellow-mid)"/></marker></defs></svg>
