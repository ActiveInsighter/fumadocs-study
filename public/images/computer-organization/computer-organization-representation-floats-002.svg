<svg viewBox="0 0 1e3 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><text x="500" y="30" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">IEEE 754 浮点数存储格式</text><text x="500" y="60" text-anchor="middle" font-size="var(--svg-font-size-title)" fill="var(--blue-ink)">V = (-1)^s × M × 2^E</text><text x="50" y="120" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">单精度 (32位)</text><g transform="translate(50, 140)"><rect x="0" y="0" width="40" height="50" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2"/><text x="20" y="30" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">s</text><text x="20" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">31</text><rect x="40" y="0" width="320" height="50" fill="var(--indigo-mid)" stroke="var(--blue-deep)" stroke-width="2"/><text x="200" y="30" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">exp (8位)</text><text x="60" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">30</text><text x="340" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">23</text><rect x="360" y="0" width="460" height="50" fill="var(--green-mid)" stroke="var(--green-mid)" stroke-width="2"/><text x="590" y="30" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">frac (23位)</text><text x="380" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">22</text><text x="800" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">0</text></g><g transform="translate(50, 240)"><text x="0" y="0" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">单精度参数：</text><text x="0" y="25" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">• k = 8, Bias = 127</text><text x="0" y="45" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">• 1 ≤ exp ≤ 254</text><text x="0" y="65" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">• -126 ≤ E ≤ 127</text><text x="0" y="85" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">• n = 23, 1 ≤ M ≤ 2-2^(-23)</text></g><text x="50" y="380" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">双精度 (64位)</text><g transform="translate(50, 400)"><rect x="0" y="0" width="40" height="50" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2"/><text x="20" y="30" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">s</text><text x="20" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">63</text><rect x="40" y="0" width="220" height="50" fill="var(--purple-deep)" stroke="var(--purple-deep)" stroke-width="2"/><text x="150" y="30" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">exp (11位)</text><text x="60" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">62</text><text x="240" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">52</text><rect x="260" y="0" width="560" height="50" fill="var(--mint-mid)" stroke="var(--mint-deep)" stroke-width="2"/><text x="540" y="30" text-anchor="middle" font-size="var(--svg-font-size-body)" fill="var(--surface)" font-weight="var(--svg-font-weight-bold)">frac (52位)</text><text x="280" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">51</text><text x="800" y="70" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">0</text></g><g transform="translate(50, 500)"><text x="0" y="0" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">双精度参数：</text><text x="0" y="25" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">• k = 11, Bias = 1023</text><text x="0" y="45" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">• 1 ≤ exp ≤ 2046</text><text x="0" y="65" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">• -1022 ≤ E ≤ 1023</text><text x="0" y="85" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">• n = 52, 1 ≤ M ≤ 2-2^(-52)</text></g><g transform="translate(50, 620)"><text x="0" y="0" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">计算公式：</text><rect x="0" y="10" width="900" height="80" fill="var(--neutral-soft)" stroke="var(--indigo-light)" stroke-width="1" rx="5"/><text x="20" y="35" font-size="var(--svg-font-size-title)" fill="var(--blue-ink)">• 符号位：s = 0 (正数), s = 1 (负数)</text><text x="20" y="55" font-size="var(--svg-font-size-title)" fill="var(--blue-ink)">• 指数部分：E = exp - Bias</text><text x="20" y="75" font-size="var(--svg-font-size-title)" fill="var(--blue-ink)">• 尾数部分：M = 1 + frac (隐含的前导1)</text></g><g transform="translate(50, 760)"><text x="0" y="0" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-mid)">优势：相比传统浮点表示，IEEE 754格式可以用更少的位数表示更大的数值范围</text><text x="0" y="25" font-size="var(--svg-font-size-body)" fill="var(--blue-ink)">例如：5×2^100 在IEEE格式中只需要标准的32位或64位，而不需要103位</text></g><g transform="translate(950, 140)"><text x="0" y="0" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">图例</text><rect x="0" y="10" width="20" height="15" fill="var(--red-deep)"/><text x="25" y="22" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">符号位</text><rect x="0" y="30" width="20" height="15" fill="var(--indigo-mid)"/><text x="25" y="42" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">阶码 (单精度)</text><rect x="0" y="50" width="20" height="15" fill="var(--purple-deep)"/><text x="25" y="62" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">阶码 (双精度)</text><rect x="0" y="70" width="20" height="15" fill="var(--green-mid)"/><text x="25" y="82" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">尾数 (单精度)</text><rect x="0" y="90" width="20" height="15" fill="var(--mint-mid)"/><text x="25" y="102" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">尾数 (双精度)</text></g></svg>
