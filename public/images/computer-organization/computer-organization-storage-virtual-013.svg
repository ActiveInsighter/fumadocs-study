<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="processGrad1" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#4A90E2;stop-opacity:1"/><stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"/></linearGradient><linearGradient id="processGrad2" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#E94B3C;stop-opacity:1"/><stop offset="100%" style="stop-color:#C44133;stop-opacity:1"/></linearGradient><linearGradient id="mmuGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#50C878;stop-opacity:1"/><stop offset="100%" style="stop-color:#3DA55F;stop-opacity:1"/></linearGradient><filter id="shadow"><feDropShadow dx="2" dy="2" flood-opacity=".3" stdDeviation="3"/></filter></defs><text fill="#2C3E50" font-size="24" font-weight="bold" text-anchor="middle" x="600" y="35">MMU地址翻译与进程切换机制</text><text fill="#7F8C8D" font-size="12" text-anchor="middle" x="600" y="58">(页表基址寄存器 PTBR 的作用)</text><g id="processA"><rect fill="url(#processGrad1)" filter="url(#shadow)" height="280" rx="10" width="200" x="50" y="80"/><text fill="#fff" font-size="18" font-weight="bold" text-anchor="middle" x="150" y="110">进程 A</text><rect fill="#fff" fill-opacity=".9" height="120" rx="5" width="160" x="70" y="130"/><text fill="#2C3E50" font-size="14" font-weight="bold" text-anchor="middle" x="150" y="150">PCB (task_struct)</text><line stroke="#4A90E2" stroke-width="2" x1="80" x2="220" y1="160" y2="160"/><text fill="#34495E" font-size="12" x="80" y="180">• CPU寄存器状态</text><text fill="#34495E" font-size="12" x="80" y="200">• 进程ID</text><text fill="#34495E" font-size="12" x="80" y="220">• 优先级</text><text fill="#E74C3C" font-size="12" font-weight="bold" x="80" y="240">• PTBR = 0x1000</text><rect fill="#fff" fill-opacity=".9" height="70" rx="5" width="160" x="70" y="270"/><text fill="#2C3E50" font-size="12" font-weight="bold" text-anchor="middle" x="150" y="290">虚拟地址空间</text><text fill="#7F8C8D" font-size="11" text-anchor="middle" x="150" y="310">0x00400000 - Code</text><text fill="#7F8C8D" font-size="11" text-anchor="middle" x="150" y="327">0x00600000 - Data</text></g><g id="processB"><rect fill="url(#processGrad2)" filter="url(#shadow)" height="280" rx="10" width="200" x="950" y="80"/><text fill="#fff" font-size="18" font-weight="bold" text-anchor="middle" x="1050" y="110">进程 B</text><rect fill="#fff" fill-opacity=".9" height="120" rx="5" width="160" x="970" y="130"/><text fill="#2C3E50" font-size="14" font-weight="bold" text-anchor="middle" x="1050" y="150">PCB (task_struct)</text><line stroke="#E94B3C" stroke-width="2" x1="980" x2="1120" y1="160" y2="160"/><text fill="#34495E" font-size="12" x="980" y="180">• CPU寄存器状态</text><text fill="#34495E" font-size="12" x="980" y="200">• 进程ID</text><text fill="#34495E" font-size="12" x="980" y="220">• 优先级</text><text fill="#E74C3C" font-size="12" font-weight="bold" x="980" y="240">• PTBR = 0x2000</text><rect fill="#fff" fill-opacity=".9" height="70" rx="5" width="160" x="970" y="270"/><text fill="#2C3E50" font-size="12" font-weight="bold" text-anchor="middle" x="1050" y="290">虚拟地址空间</text><text fill="#7F8C8D" font-size="11" text-anchor="middle" x="1050" y="310">0x00400000 - Code</text><text fill="#7F8C8D" font-size="11" text-anchor="middle" x="1050" y="327">0x00600000 - Data</text></g><g id="ptbrRegister"><rect fill="#F39C12" filter="url(#shadow)" height="60" rx="8" stroke="#D68910" stroke-width="3" width="200" x="500" y="120"/><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="600" y="145">PTBR 寄存器</text><text fill="#fff" font-size="13" id="ptbrValue" text-anchor="middle" x="600" y="167">当前值: 0x1000</text></g><g id="contextSwitch"><path d="M230 240q120-40 270-90" fill="none" marker-end="url(#arrowBlue)" stroke="#4A90E2" stroke-dasharray="5,5" stroke-width="3"/><text fill="#4A90E2" font-size="11" font-weight="bold" x="340" y="190">① 保存状态</text><path d="M970 240q-120-40-270-90" fill="none" marker-end="url(#arrowRed)" stroke="#E94B3C" stroke-width="3"/><text fill="#E94B3C" font-size="11" font-weight="bold" x="815" y="190">② 加载PTBR</text><defs><marker id="arrowBlue" markerHeight="10" markerWidth="10" markerUnits="strokeWidth" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#4A90E2"/></marker><marker id="arrowRed" markerHeight="10" markerWidth="10" markerUnits="strokeWidth" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#E94B3C"/></marker><marker id="arrowGreen" markerHeight="10" markerWidth="10" markerUnits="strokeWidth" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#50C878"/></marker></defs></g><g id="mmu"><rect fill="url(#mmuGrad)" filter="url(#shadow)" height="120" rx="10" width="300" x="450" y="250"/><text fill="#fff" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="280">MMU (内存管理单元)</text><rect fill="#fff" fill-opacity=".15" height="60" rx="5" width="260" x="470" y="295"/><text fill="#fff" font-size="13" text-anchor="middle" x="600" y="315">虚拟地址 → 物理地址</text><text fill="#fff" font-size="12" text-anchor="middle" x="600" y="335">使用 PTBR 指向的页表</text></g><path d="M6e2 180v70" fill="none" marker-end="url(#arrowOrange)" stroke="#F39C12" stroke-width="4"/><text fill="#F39C12" font-size="12" font-weight="bold" x="620" y="220">提供页表基址</text><defs><marker id="arrowOrange" markerHeight="10" markerWidth="10" markerUnits="strokeWidth" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#F39C12"/></marker></defs><g id="physicalMemory"><rect fill="#ECF0F1" filter="url(#shadow)" height="300" rx="10" stroke="#BDC3C7" stroke-width="2" width="800" x="200" y="450"/><text fill="#2C3E50" font-size="18" font-weight="bold" text-anchor="middle" x="600" y="480">物理内存</text><rect fill="#D6EAF8" height="200" rx="5" stroke="#4A90E2" stroke-width="2" width="180" x="230" y="510"/><text fill="#2C3E50" font-size="14" font-weight="bold" text-anchor="middle" x="320" y="535">进程A的页表</text><text fill="#E74C3C" font-size="11" font-weight="bold" text-anchor="middle" x="320" y="555">@ 0x1000</text><line stroke="#4A90E2" stroke-width="1" x1="240" x2="400" y1="565" y2="565"/><text fill="#34495E" font-size="11" x="240" y="585">PML4 Table</text><text fill="#34495E" font-size="11" x="240" y="605">PDPT Table</text><text fill="#34495E" font-size="11" x="240" y="625">PD Table</text><text fill="#34495E" font-size="11" x="240" y="645">PT Table</text><text fill="#7F8C8D" font-size="10" x="240" y="670">0x00400000 → 0x3000</text><text fill="#7F8C8D" font-size="10" x="240" y="690">0x00600000 → 0x4000</text><rect fill="#FADBD8" height="200" rx="5" stroke="#E94B3C" stroke-width="2" width="180" x="790" y="510"/><text fill="#2C3E50" font-size="14" font-weight="bold" text-anchor="middle" x="880" y="535">进程B的页表</text><text fill="#E74C3C" font-size="11" font-weight="bold" text-anchor="middle" x="880" y="555">@ 0x2000</text><line stroke="#E94B3C" stroke-width="1" x1="800" x2="960" y1="565" y2="565"/><text fill="#34495E" font-size="11" x="800" y="585">PML4 Table</text><text fill="#34495E" font-size="11" x="800" y="605">PDPT Table</text><text fill="#34495E" font-size="11" x="800" y="625">PD Table</text><text fill="#34495E" font-size="11" x="800" y="645">PT Table</text><text fill="#7F8C8D" font-size="10" x="800" y="670">0x00400000 → 0x5000</text><text fill="#7F8C8D" font-size="10" x="800" y="690">0x00600000 → 0x6000</text><rect fill="#D5F4E6" height="160" rx="5" stroke="#50C878" stroke-width="2" width="220" x="470" y="530"/><text fill="#2C3E50" font-size="13" font-weight="bold" text-anchor="middle" x="580" y="555">实际物理页</text><text fill="#34495E" font-size="10" x="480" y="580">0x3000 - A的代码</text><text fill="#34495E" font-size="10" x="480" y="600">0x4000 - A的数据</text><text fill="#34495E" font-size="10" x="480" y="620">0x5000 - B的代码</text><text fill="#34495E" font-size="10" x="480" y="640">0x6000 - B的数据</text><text fill="#7F8C8D" font-size="10" x="480" y="665">...</text></g><path d="M520 370 320 510" fill="none" marker-end="url(#arrowGreen)" stroke="#50C878" stroke-dasharray="5,5" stroke-width="3"/><text fill="#50C878" font-size="11" font-weight="bold" x="380" y="430">查找A的页表</text><path d="M680 370 880 510" fill="none" marker-end="url(#arrowGreen)" stroke="#50C878" stroke-dasharray="5,5" stroke-width="3"/><text fill="#50C878" font-size="11" font-weight="bold" x="800" y="430">查找B的页表</text><g id="steps"><rect fill="#3498DB" fill-opacity=".1" height="50" rx="5" stroke="#3498DB" stroke-width="1" width="160" x="20" y="390"/><text fill="#2C3E50" font-size="11" font-weight="bold" text-anchor="middle" x="100" y="410">上下文切换步骤:</text><text fill="#34495E" font-size="10" x="30" y="428">1. 保存A的状态到PCB</text><rect fill="#E74C3C" fill-opacity=".1" height="50" rx="5" stroke="#E74C3C" stroke-width="1" width="160" x="1020" y="390"/><text fill="#34495E" font-size="10" x="1030" y="410">2. 加载B的PTBR到寄存器</text><text fill="#34495E" font-size="10" x="1030" y="428">3. 恢复B的CPU状态</text></g></svg>
