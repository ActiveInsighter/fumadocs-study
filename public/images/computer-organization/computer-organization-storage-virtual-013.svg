<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><linearGradient id="processGrad1" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:var(--violet-mid);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--indigo-deep);stop-opacity:1"/></linearGradient><linearGradient id="processGrad2" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:var(--red-deep);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--red-deep);stop-opacity:1"/></linearGradient><linearGradient id="mmuGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:var(--green-mid);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--green-mid);stop-opacity:1"/></linearGradient><filter id="shadow"><feDropShadow dx="2" dy="2" flood-opacity=".3" stdDeviation="3"/></filter></defs><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="600" y="35">MMU地址翻译与进程切换机制</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="600" y="58">(页表基址寄存器 PTBR 的作用)</text><g id="processA"><rect fill="url(#processGrad1)" filter="url(#shadow)" height="280" rx="10" width="200" x="50" y="80"/><text fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="110">进程 A</text><rect fill="var(--surface)" fill-opacity=".9" height="120" rx="5" width="160" x="70" y="130"/><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="150">PCB (task_struct)</text><line stroke="var(--violet-mid)" stroke-width="2" x1="80" x2="220" y1="160" y2="160"/><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="80" y="180">• CPU寄存器状态</text><text fill="