<svg viewBox="0 0 820 470" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-deep)"/></marker></defs><g stroke="var(--neutral-deep)" stroke-width="1" stroke-dasharray="4 3" fill="none"><line x1="130" y1="40" x2="130" y2="80"/><line x1="210" y1="40" x2="210" y2="150"/><line x1="290" y1="40" x2="290" y2="220"/><line x1="370" y1="40" x2="370" y2="290"/></g><g font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)" font-weight="var(--svg-font-weight-semibold)"><text x="130" y="32" text-anchor="middle">req 0 → M0</text><text x="210" y="32" text-anchor="middle">req 1 → M1</text><text x="290" y="32" text-anchor="middle">req 2 → M2</text><text x="370" y="32" text-anchor="middle">req 3 → M3</text></g><g stroke="var(--neutral-deep)" stroke-width="1.2" fill="none"><line x1="130" y1="72" x2="130" y2="80" marker-end="url(#ahs)"/><line x1="210" y1="142" x2="210" y2="150" marker-end="url(#ahs)"/><line x1="290" y1="212" x2="290" y2="220" marker-end="url(#ahs)"/><line x1="370" y1="282" x2="370" y2="290" marker-end="url(#ahs)"/></g><g font-size="var(--svg-font-size-body)" fill="var(--neutral-ink)" font-weight="var(--svg-font-weight-bold)"><text x="100" y="100" text-anchor="end">M0</text><text x="100" y="170" text-anchor="end">M1</text><text x="100" y="240" text-anchor="end">M2</text><text x="100" y="310" text-anchor="end">M3</text></g><rect x="130" y="80" width="320" height="35" rx="5" fill="var(--amber-deep)" stroke="var(--orange-deep)" stroke-width="1.2"/><text x="290" y="103" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--orange-ink)" font-weight="var(--svg-font-weight-semibold)">M0 忙 (访问地址 0)</text><rect x="450" y="80" width="320" height="35" rx="5" fill="var(--amber-deep)" stroke="var(--orange-deep)" stroke-width="1.2"/><text x="610" y="103" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--orange-ink)" font-weight="var(--svg-font-weight-semibold)">M0 忙 (访问地址 4)</text><rect x="210" y="150" width="320" height="35" rx="5" fill="var(--sky-deep)" stroke="var(--indigo-deep)" stroke-width="1.2"/><text x="370" y="173" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)" font-weight="var(--svg-font-weight-semibold)">M1 忙 (访问地址 1)</text><rect x="530" y="150" width="240" height="35" rx="5" fill="var(--sky-deep)" stroke="var(--indigo-deep)" stroke-width="1.2"/><text x="650" y="173" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)" font-weight="var(--svg-font-weight-semibold)">M1 忙 (地址 5) ...</text><rect x="290" y="220" width="320" height="35" rx="5" fill="var(--green-deep)" stroke="var(--lime-deep)" stroke-width="1.2"/><text x="450" y="243" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--lime-ink)" font-weight="var(--svg-font-weight-semibold)">M2 忙 (访问地址 2)</text><rect x="610" y="220" width="160" height="35" rx="5" fill="var(--green-deep)" stroke="var(--lime-deep)" stroke-width="1.2"/><text x="690" y="243" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--lime-ink)" font-weight="var(--svg-font-weight-semibold)">M2 (地址 6) ...</text><rect x="370" y="290" width="320" height="35" rx="5" fill="var(--magenta-deep)" stroke="var(--magenta-deep)" stroke-width="1.2"/><text x="530" y="313" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--magenta-ink)" font-weight="var(--svg-font-weight-semibold)">M3 忙 (访问地址 3)</text><rect x="690" y="290" width="80" height="35" rx="5" fill="var(--magenta-deep)" stroke="var(--magenta-deep)" stroke-width="1.2"/><text x="730" y="313" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--magenta-ink)" font-weight="var(--svg-font-weight-semibold)">M3 ...</text><line x1="110" y1="350" x2="790" y2="350" stroke="var(--neutral-ink)" stroke-width="1.6" marker-end="url(#ah)"/><text x="795" y="354" font-size="var(--svg-font-size-label)" fill="var(--neutral-ink)">t</text><g stroke="var(--neutral-ink)" stroke-width="1" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)"><line x1="130" y1="346" x2="130" y2="354"/><text x="130" y="368" text-anchor="middle">0</text><line x1="210" y1="346" x2="210" y2="354"/><text x="210" y="368" text-anchor="middle">T/4</text><line x1="290" y1="346" x2="290" y2="354"/><text x="290" y="368" text-anchor="middle">2T/4</text><line x1="370" y1="346" x2="370" y2="354"/><text x="370" y="368" text-anchor="middle">3T/4</text><line x1="450" y1="346" x2="450" y2="354"/><text x="450" y="368" text-anchor="middle">T</text><line x1="530" y1="346" x2="530" y2="354"/><text x="530" y="368" text-anchor="middle">5T/4</text><line x1="610" y1="346" x2="610" y2="354"/><text x="610" y="368" text-anchor="middle">6T/4</text><line x1="690" y1="346" x2="690" y2="354"/><text x="690" y="368" text-anchor="middle">7T/4</text><line x1="770" y1="346" x2="770" y2="354"/><text x="770" y="368" text-anchor="middle">2T</text></g><g stroke="var(--red-deep)" stroke-width="1.4" fill="none"><line x1="130" y1="385" x2="130" y2="400"/><line x1="210" y1="385" x2="210" y2="400"/><line x1="130" y1="393" x2="210" y2="393" marker-start="url(#ah)" marker-end="url(#ah)"/></g><rect x="140" y="402" width="60" height="24" rx="4" fill="var(--red-soft)" stroke="var(--red-deep)" stroke-width="1.2"/><text x="170" y="419" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">T / n</text><g stroke="var(--green-deep)" stroke-width="1.4" fill="none"><line x1="130" y1="435" x2="130" y2="450"/><line x1="450" y1="435" x2="450" y2="450"/><line x1="130" y1="443" x2="450" y2="443" marker-start="url(#ah)" marker-end="url(#ah)"/></g><rect x="260" y="452" width="60" height="16" rx="4" fill="var(--mint-soft)" stroke="var(--green-deep)" stroke-width="1.2"/><text x="290" y="464" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--green-deep)" font-weight="var(--svg-font-weight-bold)">存储周期 T</text><g transform="translate(500,395)" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)"><text x="0" y="0" font-weight="var(--svg-font-weight-bold)" fill="var(--ink)">n = 4 体低位交叉存储器</text><text x="0" y="18">• 单体仍需完整周期 T 才能再次接受访问</text><text x="0" y="36">• 相邻地址被分散到不同存储体，M0~M3 可交错并行</text><text x="0" y="54">• CPU 每 T/n 就能收到一次数据 → 带宽提升约 n 倍</text></g></svg>
