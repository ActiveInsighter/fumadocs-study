<svg viewBox="0 0 820 470" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="b0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6a5"/><stop offset="100%" stop-color="#f0a552"/></linearGradient><linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c7e7ff"/><stop offset="100%" stop-color="#6fb3e8"/></linearGradient><linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4f0c8"/><stop offset="100%" stop-color="#88c66a"/></linearGradient><linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c8e6"/><stop offset="100%" stop-color="#d47ab8"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#333"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#555"/></marker></defs><g stroke="#666" stroke-width="1" stroke-dasharray="4 3" fill="none"><line x1="130" y1="40" x2="130" y2="80"/><line x1="210" y1="40" x2="210" y2="150"/><line x1="290" y1="40" x2="290" y2="220"/><line x1="370" y1="40" x2="370" y2="290"/></g><g font-size="11" fill="#555" font-weight="600"><text x="130" y="32" text-anchor="middle">req 0 → M0</text><text x="210" y="32" text-anchor="middle">req 1 → M1</text><text x="290" y="32" text-anchor="middle">req 2 → M2</text><text x="370" y="32" text-anchor="middle">req 3 → M3</text></g><g stroke="#555" stroke-width="1.2" fill="none"><line x1="130" y1="72" x2="130" y2="80" marker-end="url(#ahs)"/><line x1="210" y1="142" x2="210" y2="150" marker-end="url(#ahs)"/><line x1="290" y1="212" x2="290" y2="220" marker-end="url(#ahs)"/><line x1="370" y1="282" x2="370" y2="290" marker-end="url(#ahs)"/></g><g font-size="14" fill="#333" font-weight="700"><text x="100" y="100" text-anchor="end">M0</text><text x="100" y="170" text-anchor="end">M1</text><text x="100" y="240" text-anchor="end">M2</text><text x="100" y="310" text-anchor="end">M3</text></g><rect x="130" y="80" width="320" height="35" rx="5" fill="url(#b0)" stroke="#b56b1f" stroke-width="1.2"/><text x="290" y="103" text-anchor="middle" font-size="12" fill="#5a3810" font-weight="600">M0 忙 (访问地址 0)</text><rect x="450" y="80" width="320" height="35" rx="5" fill="url(#b0)" stroke="#b56b1f" stroke-width="1.2"/><text x="610" y="103" text-anchor="middle" font-size="12" fill="#5a3810" font-weight="600">M0 忙 (访问地址 4)</text><rect x="210" y="150" width="320" height="35" rx="5" fill="url(#b1)" stroke="#2c6fb8" stroke-width="1.2"/><text x="370" y="173" text-anchor="middle" font-size="12" fill="#123a5c" font-weight="600">M1 忙 (访问地址 1)</text><rect x="530" y="150" width="240" height="35" rx="5" fill="url(#b1)" stroke="#2c6fb8" stroke-width="1.2"/><text x="650" y="173" text-anchor="middle" font-size="12" fill="#123a5c" font-weight="600">M1 忙 (地址 5) ...</text><rect x="290" y="220" width="320" height="35" rx="5" fill="url(#b2)" stroke="#4a8c33" stroke-width="1.2"/><text x="450" y="243" text-anchor="middle" font-size="12" fill="#22461a" font-weight="600">M2 忙 (访问地址 2)</text><rect x="610" y="220" width="160" height="35" rx="5" fill="url(#b2)" stroke="#4a8c33" stroke-width="1.2"/><text x="690" y="243" text-anchor="middle" font-size="12" fill="#22461a" font-weight="600">M2 (地址 6) ...</text><rect x="370" y="290" width="320" height="35" rx="5" fill="url(#b3)" stroke="#8f4a75" stroke-width="1.2"/><text x="530" y="313" text-anchor="middle" font-size="12" fill="#4a1f3b" font-weight="600">M3 忙 (访问地址 3)</text><rect x="690" y="290" width="80" height="35" rx="5" fill="url(#b3)" stroke="#8f4a75" stroke-width="1.2"/><text x="730" y="313" text-anchor="middle" font-size="11" fill="#4a1f3b" font-weight="600">M3 ...</text><line x1="110" y1="350" x2="790" y2="350" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/><text x="795" y="354" font-size="12" fill="#333">t</text><g stroke="#333" stroke-width="1" font-size="11" fill="#333"><line x1="130" y1="346" x2="130" y2="354"/><text x="130" y="368" text-anchor="middle">0</text><line x1="210" y1="346" x2="210" y2="354"/><text x="210" y="368" text-anchor="middle">T/4</text><line x1="290" y1="346" x2="290" y2="354"/><text x="290" y="368" text-anchor="middle">2T/4</text><line x1="370" y1="346" x2="370" y2="354"/><text x="370" y="368" text-anchor="middle">3T/4</text><line x1="450" y1="346" x2="450" y2="354"/><text x="450" y="368" text-anchor="middle">T</text><line x1="530" y1="346" x2="530" y2="354"/><text x="530" y="368" text-anchor="middle">5T/4</text><line x1="610" y1="346" x2="610" y2="354"/><text x="610" y="368" text-anchor="middle">6T/4</text><line x1="690" y1="346" x2="690" y2="354"/><text x="690" y="368" text-anchor="middle">7T/4</text><line x1="770" y1="346" x2="770" y2="354"/><text x="770" y="368" text-anchor="middle">2T</text></g><g stroke="#c0392b" stroke-width="1.4" fill="none"><line x1="130" y1="385" x2="130" y2="400"/><line x1="210" y1="385" x2="210" y2="400"/><line x1="130" y1="393" x2="210" y2="393" marker-start="url(#ah)" marker-end="url(#ah)"/></g><rect x="140" y="402" width="60" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="170" y="419" text-anchor="middle" font-size="12" fill="#7a1e1e" font-weight="700">T / n</text><g stroke="#2f8f4d" stroke-width="1.4" fill="none"><line x1="130" y1="435" x2="130" y2="450"/><line x1="450" y1="435" x2="450" y2="450"/><line x1="130" y1="443" x2="450" y2="443" marker-start="url(#ah)" marker-end="url(#ah)"/></g><rect x="260" y="452" width="60" height="16" rx="4" fill="#e8f5ee" stroke="#2f8f4d" stroke-width="1.2"/><text x="290" y="464" text-anchor="middle" font-size="11" fill="#1f5a30" font-weight="700">存储周期 T</text><g transform="translate(500,395)" font-size="11" fill="#333"><text x="0" y="0" font-weight="700" fill="#111">n = 4 体低位交叉存储器</text><text x="0" y="18">• 单体仍需完整周期 T 才能再次接受访问</text><text x="0" y="36">• 相邻地址被分散到不同存储体，M0~M3 可交错并行</text><text x="0" y="54">• CPU 每 T/n 就能收到一次数据 → 带宽提升约 n 倍</text></g></svg>
