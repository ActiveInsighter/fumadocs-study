e-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="610" y="95">物理内存 (RAM)</text><rect fill="var(--lime-deep)" height="360" rx="5" stroke="var(--lime-deep)" stroke-width="2" width="240" x="490" y="120"/><rect fill="var(--surface)" height="35" stroke="var(--lime-deep)" stroke-width="1" width="210" x="505" y="140"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="515" y="160">0x00000 - 进程1代码</text><rect fill="var(--surface)" height="35" stroke="var(--lime-deep)" stroke-width="1" width="210" x="505" y="185"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="515" y="205">0x10000 - 进程2数据</text><rect fill="var(--surface)" height="35" stroke="var(--lime-deep)" stroke-width="1" width="210" x="505" y="230"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="515" y="250">0x20000 - 进程1堆</text><rect fill="var(--surface)" height="35" stroke="var(--lime-deep)" stroke-width="1" width="210" x="505" y="275"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="515" y="295">0x30000 - 进程2代码</text><rect fill="var(--surface)" height="35" stroke="var(--lime-deep)" stroke-width="1" width="210" x="505" y="320"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="515" y="340">0x40000 - 进程1数据</text><rect fill="var(--surface)" height="35" stroke="var(--lime-deep)" stroke-width="1" width="210" x="505" y="365"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="515" y="385">0x50000 - 空闲</text><rect fill="var(--surface)" height="35" stroke="var(--lime-deep)" stroke-width="1" width="210" x="505" y="410"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" x="515" y="430">0x60000 - 进程2栈</text><text fill="var(--lime-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="610" y="500">物理地址 (Physical Address)</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="520">实际硬件内存位置</text></g><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--yellow-mid)" points="0 0, 10 3, 0 6"/></marker></defs><rect fill="var(--yellow-light)" height="35" rx="5" stroke="var(--orange-mid)" stroke-width="1" width="700" x="50" y="560"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="580">💡 每个进程拥有独立的虚拟地址空间,通过 MMU 映射到分散的物理内存位置</text></svg>
