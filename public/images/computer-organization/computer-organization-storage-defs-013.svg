<svg viewBox="0 0 800 320" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><marker id="promArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#455a64"/></marker></defs><rect width="800" height="320" fill="#fff"/><g transform="translate(40,50)"><rect x="0" y="0" width="220" height="150" rx="8" fill="#eceff1" stroke="#b0bec5"/><text x="110" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">出厂时（空白）</text><g stroke="#ef6c00" stroke-width="4"><line x1="30" y1="55" x2="60" y2="55"/><line x1="80" y1="55" x2="110" y2="55"/><line x1="130" y1="55" x2="160" y2="55"/><line x1="30" y1="85" x2="60" y2="85"/><line x1="80" y1="85" x2="110" y2="85"/><line x1="130" y1="85" x2="160" y2="85"/><line x1="30" y1="115" x2="60" y2="115"/><line x1="80" y1="115" x2="110" y2="115"/><line x1="130" y1="115" x2="160" y2="115"/></g><text x="110" y="145" text-anchor="middle" font-size="10" fill="#546e7a">所有熔丝完好 = 全 1</text></g><path d="M268 120h52" stroke="#455a64" stroke-width="2" marker-end="url(#promArr)"/><text x="294" y="100" text-anchor="middle" font-size="11" fill="#546e7a">高压脉冲</text><text x="294" y="140" text-anchor="middle" font-size="11" fill="#546e7a">烧断熔丝</text><g transform="translate(330,50)"><rect x="0" y="0" width="220" height="150" rx="8" fill="#eceff1" stroke="#b0bec5"/><text x="110" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">编程一次后</text><g stroke-width="4"><line x1="30" y1="55" x2="60" y2="55" stroke="#ef6c00"/><line x1="80" y1="55" x2="95" y2="55" stroke="#e53935"/><line x1="130" y1="55" x2="160" y2="55" stroke="#ef6c00"/><line x1="30" y1="85" x2="45" y2="85" stroke="#e53935"/><line x1="80" y1="85" x2="110" y2="85" stroke="#ef6c00"/><line x1="130" y1="85" x2="145" y2="85" stroke="#e53935"/><line x1="30" y1="115" x2="60" y2="115" stroke="#ef6c00"/><line x1="80" y1="115" x2="95" y2="115" stroke="#e53935"/><line x1="130" y1="115" x2="160" y2="115" stroke="#ef6c00"/></g><text x="110" y="145" text-anchor="middle" font-size="10" fill="#546e7a">断开的熔丝 = 数据固定</text></g><g transform="translate(40,230)"><g transform="translate(0,0)"><rect x="0" y="0" width="220" height="60" rx="8" fill="#eceff1" stroke="#b0bec5"/><text x="110" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">用户烧录</text><text x="110" y="44" text-anchor="middle" font-size="11" fill="#546e7a">出厂后再写入内容</text></g><g transform="translate(240,0)"><rect x="0" y="0" width="220" height="60" rx="8" fill="#eceff1" stroke="#b0bec5"/><text x="110" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">仅可写入一次</text><text x="110" y="44" text-anchor="middle" font-size="11" fill="#546e7a">OTP · One-Time Programmable</text></g><g transform="translate(480,0)"><rect x="0" y="0" width="220" height="60" rx="8" fill="#eceff1" stroke="#b0bec5"/><text x="110" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">写入后不可逆</text><text x="110" y="44" text-anchor="middle" font-size="11" fill="#546e7a">熔丝烧断无法恢复</text></g></g></svg>
