<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><style>.title{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);fill:var(--blue-ink)}.subtitle{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);fill:var(--blue-ink)}.label{font-family: var(--svg-font-family);font-size: var(--svg-font-size-body);fill:var(--blue-ink)}.small-label{font-family: var(--svg-font-family);font-size: var(--svg-font-size-label);fill:var(--neutral-deep)}.formula{font-family: var(--svg-font-family-mono);font-size: var(--svg-font-size-label);fill:var(--mint-mid)}.highlight{fill:var(--indigo-mid)}.highlight2{fill:var(--red-deep)}.box-stroke{stroke:var(--blue-ink);stroke-width:2;fill:none}</style><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--ink-soft)" points="0 0, 10 3, 0 6"/></marker></defs><text class="title" text-anchor="middle" x="400" y="30">虚拟地址与物理地址格式</text><g id="virtual-address"><text class="subtitle" x="50" y="80">虚拟地址 (Virtual Address)</text><rect class="box-stroke" height="60" width="700" x="50" y="100"/><rect class="highlight" height="60" opacity=".3" width="450" x="50" y="100"/><text class="label" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="275" y="135">VPN (Virtual Page Number)</text><text class="small-label" text-anchor="middle" x="275" y="150">虚拟页框号</text><rect class="highlight2" height="60" opacity=".3" width="250" x="500" y="100"/><text class="label" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="625" y="135">VPO</text><text class="small-label" text-anchor="middle" x="625" y="150">页内偏移</text><line stroke="var(--ink-soft)" stroke-width="1" x1="50" x2="500" y1="175" y2="175"/><line stroke="var(--ink-soft)" stroke-width="1" x1="50" x2="50" y1="175" y2="185"/><line stroke="var(--ink-soft)" stroke-width="1" x1="500" x2="500" y1="175" y2="185"/><text class="small-label" text-anchor="middle" x="275" y="200">VPN 位数</text><line stroke="var(--ink-soft)" stroke-width="1" x1="500" x2="750" y1="175" y2="175"/><line stroke="var(--ink-soft)" stroke-width="1" x1="750" x2="750" y1="175" y2="185"/><text class="small-label" text-anchor="middle" x="625" y="200">offset 位数</text><text class="formula" x="50" y="230">虚拟页面个数 = 2^VPN</text><text class="formula" x="400" y="230">页面大小 = 2^offset</text></g><g id="physical-address"><text class="subtitle" x="50" y="280">物理地址 (Physical Address)</text><rect class="box-stroke" height="60" width="700" x="50" y="300"/><rect class="highlight" height="60" opacity=".3" width="500" x="50" y="300"/><text class="label" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="300" y="335">PPN (Physical Page Number)</text><text class="small-label" text-anchor="middle" x="300" y="350">物理页框号</text><rect class="highlight2" height="60" opacity=".3" width="200" x="550" y="300"/><text class="label" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="650" y="335">PPO</text><text class="small-label" text-anchor="middle" x="650" y="350">页内偏移</text><line stroke="var(--ink-soft)" stroke-width="1" x1="50" x2="550" y1="375" y2="375"/><line stroke="var(--ink-soft)" stroke-width="1" x1="50" x2="50" y1="375" y2="385"/><line stroke="var(--ink-soft)" stroke-width="1" x1="550" x2="550" y1="375" y2="385"/><text class="small-label" text-anchor="middle" x="300" y="400">PPN 位数</text><line stroke="var(--ink-soft)" stroke-width="1" x1="550" x2="750" y1="375" y2="375"/><line stroke="var(--ink-soft)" stroke-width="1" x1="750" x2="750" y1="375" y2="385"/><text class="small-label" text-anchor="middle" x="650" y="400">offset 位数</text><text class="formula" x="50" y="430">物理页面个数 = 2^PPN</text><text class="formula" x="400" y="430">页面大小 = 2^offset</text></g><g id="key-relationship"><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-dasharray="5,5" stroke-width="2" x1="625" x2="650" y1="160" y2="300"/><rect fill="var(--neutral-soft)" height="100" rx="10" stroke="var(--blue-ink)" stroke-width="2" width="400" x="200" y="470"/><text class="subtitle" text-anchor="middle" x="400" y="500">⭐ 关键特性</text><text class="label" fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="525">VPO = PPO = offset</text><text class="small-label" text-anchor="middle" x="400" y="545">虚拟地址和物理地址的页内偏移量相同</text><text class="small-label" text-anchor="middle" x="400" y="560">这使得页表只需要映射页框号，简化了地址转换</text></g></svg>
