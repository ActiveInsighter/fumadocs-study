<svg viewBox="0 0 820 420" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><style>text{fill:var(--ink)}.h{font-weight: var(--svg-font-weight-bold)}.reg{fill:var(--sky-soft);stroke:var(--violet-mid)}.alu{fill:var(--yellow-soft);stroke:var(--orange-mid)}.op{fill:var(--green-soft);stroke:var(--lime-mid)}.exc{fill:var(--red-soft);stroke:var(--red-deep)}.arrow{stroke:var(--neutral-deep);stroke-width:1.5;fill:none;marker-end:url(#a)}.dashed{stroke-dasharray:4 3}.mono{font-family: var(--svg-font-family-mono)}.lbl{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-deep)"/></marker></defs><text x="410" y="26" text-anchor="middle" font-size="var(--svg-font-size-title)" class="h">x86 乘除法：EDX:EAX 隐式寄存器对的数据通路</text><g><text x="180" y="60" text-anchor="middle" class="h">MUL / IMUL reg</text><text x="180" y="78" text-anchor="middle" class="lbl">EAX × 操作数 → EDX:EAX</text><rect class="reg" x="40" y="100" width="120" height="36" rx="4"/><text x="100" y="123" text-anchor="middle" class="mono">EAX (被乘数)</text><rect class="reg" x="200" y="100" width="120" height="36" rx="4"/><text x="260" y="123" text-anchor="middle" class="mono">操作数 reg/mem</text><rect class="alu" x="100" y="180" width="160" height="50" rx="6"/><text x="180" y="210" text-anchor="middle" class="h">乘法器 (Multiplier)</text><path class="arrow" d="M1e2 136l50 44"/><path class="arrow" d="M260 136l-50 44"/><rect class="op" x="40" y="280" width="120" height="40" rx="4"/><text x="100" y="305" text-anchor="middle" class="mono">EDX (高 32)</text><rect class="op" x="200" y="280" width="120" height="40" rx="4"/><text x="260" y="305" text-anchor="middle" class="mono">EAX (低 32)</text><path class="arrow" d="M150 230l-50 50"/><path class="arrow" d="M210 230l50 50"/><text x="180" y="340" text-anchor="middle" class="lbl">64 位乘积自动拆入 EDX:EAX</text></g><line x1="400" y1="60" x2="400" y2="400" stroke="var(--line)" stroke-dasharray="4 4"/><g><text x="610" y="60" text-anchor="middle" class="h">DIV / IDIV reg</text><text x="610" y="78" text-anchor="middle" class="lbl">EDX:EAX ÷ 操作数 → 商 EAX, 余 EDX</text><rect class="reg" x="450" y="100" width="120" height="36" rx="4"/><text x="510" y="123" text-anchor="middle" class="mono">EDX (高 32)</text><rect class="reg" x="610" y="100" width="120" height="36" rx="4"/><text x="670" y="123" text-anchor="middle" class="mono">EAX (低 32)</text><rect class="reg" x="530" y="146" width="160" height="32" rx="4"/><text x="610" y="167" text-anchor="middle" class="mono">除数 reg/mem (32 位)</text><rect class="alu" x="500" y="200" width="220" height="50" rx="6"/><text x="610" y="230" text-anchor="middle" class="h">除法器 (Divider)</text><path class="arrow" d="M510 136l50 64"/><path class="arrow" d="M670 136l-10 64"/><path class="arrow" d="M610 178v22"/><rect class="op" x="450" y="300" width="120" height="40" rx="4"/><text x="510" y="325" text-anchor="middle" class="mono">EAX = 商</text><rect class="op" x="610" y="300" width="120" height="40" rx="4"/><text x="670" y="325" text-anchor="middle" class="mono">EDX = 余数</text><path class="arrow" d="M560 250l-50 50"/><path class="arrow" d="M660 250l10 50"/><rect class="exc" x="500" y="360" width="220" height="36" rx="4"/><text x="610" y="383" text-anchor="middle">异常: 除数=0 或 商溢出 → #DE</text><path class="arrow dashed" d="M590 250V360" stroke="var(--red-deep)"/></g></svg>
