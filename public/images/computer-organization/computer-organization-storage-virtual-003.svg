<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="15" id="pagePattern" patternUnits="userSpaceOnUse" width="30"><rect fill="none" height="15" stroke="#666" stroke-width=".5" width="30"/></pattern><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#333" points="0 0, 10 3.5, 0 7"/></marker></defs><rect fill="none" height="500" width="800"/><text fill="#333" font-size="18" font-weight="bold" text-anchor="middle" x="400" y="25">页式虚拟存储器</text><rect fill="#4CAF50" height="60" rx="5" width="80" x="50" y="180"/><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="90" y="205">CPU</text><text fill="#fff" font-size="10" text-anchor="middle" x="90" y="220">虚拟地址</text><rect fill="#FF9800" height="80" rx="5" width="90" x="200" y="170"/><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="245" y="190">地址转换</text><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="245" y="205">机构(MMU)</text><text fill="#fff" font-size="9" text-anchor="middle" x="245" y="225">页表查询</text><text fill="#fff" font-size="9" text-anchor="middle" x="245" y="238">TLB缓存</text><rect fill="#E3F2FD" height="120" rx="3" stroke="#2196F3" stroke-width="2" width="130" x="180" y="280"/><text fill="#1976D2" font-size="12" font-weight="bold" text-anchor="middle" x="245" y="300">页表 (Page Table)</text><g><rect fill="#4CAF50" height="15" width="25" x="190" y="310"/><text fill="#fff" font-size="8" text-anchor="middle" x="202" y="320">0</text><rect fill="#4CAF50" height="15" width="25" x="220" y="310"/><text fill="#fff" font-size="8" text-anchor="middle" x="232" y="320">3</text><text fill="#333" font-size="8" x="255" y="320">在内存</text><rect fill="#F44336" height="15" width="25" x="190" y="330"/><text fill="#fff" font-size="8" text-anchor="middle" x="202" y="340">1</text><rect fill="#F44336" height="15" width="25" x="220" y="330"/><text fill="#fff" font-size="8" text-anchor="middle" x="232" y="340">X</text><text fill="#333" font-size="8" x="255" y="340">在磁盘</text><rect fill="#4CAF50" height="15" width="25" x="190" y="350"/><text fill="#fff" font-size="8" text-anchor="middle" x="202" y="360">2</text><rect fill="#4CAF50" height="15" width="25" x="220" y="350"/><text fill="#fff" font-size="8" text-anchor="middle" x="232" y="360">1</text><text fill="#333" font-size="8" x="255" y="360">在内存</text><rect fill="#F44336" height="15" width="25" x="190" y="370"/><text fill="#fff" font-size="8" text-anchor="middle" x="202" y="380">3</text><rect fill="#F44336" height="15" width="25" x="220" y="370"/><text fill="#fff" font-size="8" text-anchor="middle" x="232" y="380">X</text><text fill="#333" font-size="8" x="255" y="380">在磁盘</text></g><rect fill="#E8F5E8" height="80" rx="3" stroke="#4CAF50" stroke-width="2" width="120" x="50" y="70"/><text fill="#2E7D32" font-size="12" font-weight="bold" text-anchor="middle" x="110" y="90">虚拟地址空间</text><g><rect fill="#81C784" height="15" width="100" x="60" y="100"/><text fill="#fff" font-size="10" text-anchor="middle" x="110" y="110">页面 0</text><rect fill="#FFCDD2" height="15" width="100" x="60" y="115"/><text fill="#D32F2F" font-size="10" text-anchor="middle" x="110" y="125">页面 1 (缺页)</text><rect fill="#81C784" height="15" width="100" x="60" y="130"/><text fill="#fff" font-size="10" text-anchor="middle" x="110" y="140">页面 2</text></g><rect fill="#FFF3E0" height="120" rx="3" stroke="#FF9800" stroke-width="2" width="120" x="370" y="70"/><text fill="#E65100" font-size="12" font-weight="bold" text-anchor="middle" x="430" y="90">物理内存</text><g><rect fill="#FFA726" height="15" width="100" x="380" y="100"/><text fill="#fff" font-size="10" text-anchor="middle" x="430" y="110">页框 0 (页面0)</text><rect fill="#FFA726" height="15" width="100" x="380" y="115"/><text fill="#fff" font-size="10" text-anchor="middle" x="430" y="125">页框 1 (页面2)</text><rect fill="#BDBDBD" height="15" width="100" x="380" y="130"/><text fill="#666" font-size="10" text-anchor="middle" x="430" y="140">页框 2 (空闲)</text><rect fill="#FFA726" height="15" width="100" x="380" y="145"/><text fill="#fff" font-size="10" text-anchor="middle" x="430" y="155">页框 3 (页面0)</text><rect fill="#BDBDBD" height="15" width="100" x="380" y="160"/><text fill="#666" font-size="10" text-anchor="middle" x="430" y="170">页框 4 (空闲)</text></g><rect fill="#F3E5F5" height="120" rx="3" stroke="#9C27B0" stroke-width="2" width="120" x="550" y="70"/><text fill="#7B1FA2" font-size="12" font-weight="bold" text-anchor="middle" x="610" y="90">磁盘存储</text><g><rect fill="#BA68C8" height="15" width="100" x="560" y="105"/><text fill="#fff" font-size="10" text-anchor="middle" x="610" y="115">页面 1 (交换区)</text><rect fill="#BA68C8" height="15" width="100" x="560" y="125"/><text fill="#fff" font-size="10" text-anchor="middle" x="610" y="135">页面 3 (交换区)</text><rect fill="#CE93D8" height="15" width="100" x="560" y="145"/><text fill="#fff" font-size="10" text-anchor="middle" x="610" y="155">程序映像文件</text><rect fill="#CE93D8" height="15" width="100" x="560" y="165"/><text fill="#fff" font-size="10" text-anchor="middle" x="610" y="175">其他页面...</text></g><line marker-end="url(#arrowhead)" stroke="#333" stroke-width="2" x1="130" x2="200" y1="210" y2="210"/><text fill="#333" font-size="9" text-anchor="middle" x="165" y="205">虚拟地址</text><line marker-end="url(#arrowhead)" stroke="#333" stroke-width="2" x1="245" x2="245" y1="250" y2="280"/><line marker-end="url(#arrowhead)" stroke="#4CAF50" stroke-width="2" x1="310" x2="370" y1="340" y2="130"/><text fill="#4CAF50" font-size="9" x="340" y="220">页面存在</text><line marker-end="url(#arrowhead)" stroke="#F44336" stroke-dasharray="5,5" stroke-width="2" x1="310" x2="550" y1="360" y2="140"/><text fill="#F44336" font-size="9" x="430" y="250">缺页中断</text><path d="M550 160q-50 40-1e2 20" fill="none" marker-end="url(#arrowhead)" stroke="#9C27B0" stroke-dasharray="3,3" stroke-width="2"/><text fill="#9C27B0" font-size="9" text-anchor="middle" x="500" y="190">页面调入</text><rect fill="#ECEFF1" height="60" rx="3" stroke="#607D8B" stroke-width="1" width="700" x="50" y="430"/><text fill="#263238" font-size="12" font-weight="bold" x="60" y="450">工作流程:</text><text fill="#37474F" font-size="11" x="60" y="465">① CPU发出虚拟地址 → ② MMU查询页表 → ③ 若页面在内存则直接访问</text><text fill="#37474F" font-size="11" x="60" y="480">④ 若缺页则触发中断 → ⑤ 操作系统从磁盘调入页面 → ⑥ 更新页表并继续执行</text><rect fill="#F1F8E9" height="90" rx="3" stroke="#8BC34A" stroke-width="1" width="90" x="700" y="250"/><text fill="#33691E" font-size="11" font-weight="bold" text-anchor="middle" x="745" y="270">核心优势</text><text fill="#33691E" font-size="9" x="710" y="285">• 内存扩展</text><text fill="#33691E" font-size="9" x="710" y="298">• 进程隔离</text><text fill="#33691E" font-size="9" x="710" y="311">• 按需加载</text><text fill="#33691E" font-size="9" x="710" y="324">• 内存共享</text></svg>
