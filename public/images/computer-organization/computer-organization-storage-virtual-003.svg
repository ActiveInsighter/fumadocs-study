"50" y="70"/><text fill="var(--lime-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="90">虚拟地址空间</text><g><rect fill="var(--green-mid)" height="15" width="100" x="60" y="100"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="110">页面 0</text><rect fill="var(--rose-light)" height="15" width="100" x="60" y="115"/><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="125">页面 1 (缺页)</text><rect fill="var(--green-mid)" height="15" width="100" x="60" y="130"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="140">页面 2</text></g><rect fill="var(--yellow-soft)" height="120" rx="3" stroke="var(--yellow-mid)" stroke-width="2" width="120" x="370" y="70"/><text fill="var(--coral-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="430" y="90">物理内存</text><g><rect fill="var(--yellow-mid)" height="15" width="100" x="380" y="100"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="110">页框 0 (页面0)</text><rect fill="var(--yellow-mid)" height="15" width="100" x="380" y="115"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="125">页框 1 (页面2)</text><rect fill="var(--neutral-mid)" height="15" width="100" x="380" y="130"/><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="140">页框 2 (空闲)</text><rect fill="var(--yellow-mid)" height="15" width="100" x="380" y="145"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="155">页框 3 (页面0)</text><rect fill="var(--neutral-mid)" height="15" width="100" x="380" y="160"/><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="170">页框 4 (空闲)</text></g><rect fill="var(--purple-soft)" height="120" rx="3" stroke="var(--purple-deep)" stroke-width="2" width="120" x="550" y="70"/><text fill="var(--purple-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="610" y="90">磁盘存储</text><g><rect fill="var(--purple-deep)" height="15" width="100" x="560" y="105"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="115">页面 1 (交换区)</text><rect fill="var(--purple-deep)" height="15" width="100" x="560" y="125"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="135">页面 3 (交换区)</text><rect fill="var(--purple-mid)" height="15" width="100" x="560" y="145"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="155">程序映像文件</text><rect fill="var(--purple-mid)" height="15" width="100" x="560" y="165"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="175">其他页面...</text></g><line marker-end="url(#arrowhead)" stroke="var(--neutral-ink)" stroke-width="2" x1="130" x2="200" y1="210" y2="210"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="165" y="205">虚拟地址</text><line marker-end="url(#arrowhead)" stroke="var(--neutral-ink)" stroke-width="2" x1="245" x2="245" y1="250" y2="280"/><line marker-end="url(#arrowhead)" stroke="var(--lime-mid)" stroke-width="2" x1="310" x2="370" y1="340" y2="130"/><text fill="var(--lime-mid)" font-size="var(--svg-font-size-caption)" x="340" y="220">页面存在</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-dasharray="5,5" stroke-width="2" x1="310" x2="550" y1="360" y2="140"/><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="430" y="250">缺页中断</text><path d="M550 160q-50 40-1e2 20" fill="none" marker-end="url(#arrowhead)" stroke="var(--purple-deep)" stroke-dasharray="3,3" stroke-width="2"/><text fill="var(--purple-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="500" y="190">页面调入</text><rect fill="var(--neutral-soft)" height="60" rx="3" stroke="var(--sky-deep)" stroke-width="1" width="700" x="50" y="430"/><text fill="var(--cyan-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="60" y="450">工作流程:</text><text fill="var(--sky-ink)" font-size="var(--svg-font-size-caption)" x="60" y="465">① CPU发出虚拟地址 → ② MMU查询页表 → ③ 若页面在内存则直接访问</text><text fill="var(--sky-ink)" font-size="var(--svg-font-size-caption)" x="60" y="480">④ 若缺页则触发中断 → ⑤ 操作系统从磁盘调入页面 → ⑥ 更新页表并继续执行</text><rect fill="var(--lime-soft)" height="90" rx="3" stroke="var(--lime-mid)" stroke-width="1" width="90" x="700" y="250"/><text fill="var(--lime-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="745" y="270">核心优势</text><text fill="var(--lime-deep)" font-size="var(--svg-font-size-caption)" x="710" y="285">• 内存扩展</text><text fill="var(--lime-deep)" font-size="var(--svg-font-size-caption)" x="710" y="298">• 进程隔离</text><text fill="var(--lime-deep)" font-size="var(--svg-font-size-caption)" x="710" y="311">• 按需加载</text><text fill="var(--lime-deep)" font-size="var(--svg-font-size-caption)" x="710" y="324">• 内存共享</text></svg>
