<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><pattern height="15" id="pagePattern" patternUnits="userSpaceOnUse" width="30"><rect fill="none" height="15" stroke="var(--neutral-deep)" stroke-width=".5" width="30"/></pattern><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--neutral-ink)" points="0 0, 10 3.5, 0 7"/></marker></defs><rect fill="none" height="500" width="800"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="25" class="svg-text svg-text-on-light">页式虚拟存储器</text><rect fill="var(--lime-mid)" height="60" rx="5" width="80" x="50" y="180"/><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="205" class="svg-text svg-text-on-dark">CPU</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="90" y="220" class="svg-text svg-text-on-dark">虚拟地址</text><rect fill="var(--yellow-mid)" height="80" rx="5" width="90" x="200" y="170"/><text font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="245" y="190" class="svg-text svg-text-on-dark">地址转换</text><text font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="245" y="205" class="svg-text svg-text-on-dark">机构(MMU)</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="245" y="225" class="svg-text svg-text-on-dark">页表查询</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="245" y="238" class="svg-text svg-text-on-dark">TLB缓存</text><rect fill="var(--sky-soft)" height="120" rx="3" stroke="var(--violet-mid)" stroke-width="2" width="130" x="180" y="280"/><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="245" y="300" class="svg-text svg-text-on-light">页表 (Page Table)</text><g><rect fill="var(--lime-mid)" height="15" width="25" x="190" y="310"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="202" y="320" class="svg-text svg-text-on-dark">0</text><rect fill="var(--lime-mid)" height="15" width="25" x="220" y="310"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="232" y="320" class="svg-text svg-text-on-dark">3</text><text font-size="var(--svg-font-size-caption)" x="255" y="320" class="svg-text svg-text-on-light">在内存</text><rect fill="var(--red-deep)" height="15" width="25" x="190" y="330"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="202" y="340" class="svg-text svg-text-on-dark">1</text><rect fill="var(--red-deep)" height="15" width="25" x="220" y="330"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="232" y="340" class="svg-text svg-text-on-dark">X</text><text font-size="var(--svg-font-size-caption)" x="255" y="340" class="svg-text svg-text-on-light">在磁盘</text><rect fill="var(--lime-mid)" height="15" width="25" x="190" y="350"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="202" y="360" class="svg-text svg-text-on-dark">2</text><rect fill="var(--lime-mid)" height="15" width="25" x="220" y="350"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="232" y="360" class="svg-text svg-text-on-dark">1</text><text font-size="var(--svg-font-size-caption)" x="255" y="360" class="svg-text svg-text-on-light">在内存</text><rect fill="var(--red-deep)" height="15" width="25" x="190" y="370"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="202" y="380" class="svg-text svg-text-on-dark">3</text><rect fill="var(--red-deep)" height="15" width="25" x="220" y="370"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="232" y="380" class="svg-text svg-text-on-dark">X</text><text font-size="var(--svg-font-size-caption)" x="255" y="380" class="svg-text svg-text-on-light">在磁盘</text></g><rect fill="var(--green-soft)" height="80" rx="3" stroke="var(--lime-mid)" stroke-width="2" width="120" x="50" y="70"/><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="90" class="svg-text svg-text-on-light">虚拟地址空间</text><g><rect fill="var(--green-mid)" height="15" width="100" x="60" y="100"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="110" class="svg-text svg-text-on-dark">页面 0</text><rect fill="var(--rose-light)" height="15" width="100" x="60" y="115"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="125" class="svg-text svg-text-on-light">页面 1 (缺页)</text><rect fill="var(--green-mid)" height="15" width="100" x="60" y="130"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="140" class="svg-text svg-text-on-dark">页面 2</text></g><rect fill="var(--yellow-soft)" height="120" rx="3" stroke="var(--yellow-mid)" stroke-width="2" width="120" x="370" y="70"/><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="430" y="90" class="svg-text svg-text-on-light">物理内存</text><g><rect fill="var(--yellow-mid)" height="15" width="100" x="380" y="100"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="110" class="svg-text svg-text-on-dark">页框 0 (页面0)</text><rect fill="var(--yellow-mid)" height="15" width="100" x="380" y="115"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="125" class="svg-text svg-text-on-dark">页框 1 (页面2)</text><rect fill="var(--neutral-mid)" height="15" width="100" x="380" y="130"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="140" class="svg-text svg-text-on-light">页框 2 (空闲)</text><rect fill="var(--yellow-mid)" height="15" width="100" x="380" y="145"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="155" class="svg-text svg-text-on-dark">页框 3 (页面0)</text><rect fill="var(--neutral-mid)" height="15" width="100" x="380" y="160"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="170" class="svg-text svg-text-on-light">页框 4 (空闲)</text></g><rect fill="var(--purple-soft)" height="120" rx="3" stroke="var(--purple-deep)" stroke-width="2" width="120" x="550" y="70"/><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="610" y="90" class="svg-text svg-text-on-light">磁盘存储</text><g><rect fill="var(--purple-deep)" height="15" width="100" x="560" y="105"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="115" class="svg-text svg-text-on-dark">页面 1 (交换区)</text><rect fill="var(--purple-deep)" height="15" width="100" x="560" y="125"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="135" class="svg-text svg-text-on-dark">页面 3 (交换区)</text><rect fill="var(--purple-mid)" height="15" width="100" x="560" y="145"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="155" class="svg-text svg-text-on-dark">程序映像文件</text><rect fill="var(--purple-mid)" height="15" width="100" x="560" y="165"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="610" y="175" class="svg-text svg-text-on-dark">其他页面...</text></g><line marker-end="url(#arrowhead)" stroke="var(--neutral-ink)" stroke-width="2" x1="130" x2="200" y1="210" y2="210"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="165" y="205" class="svg-text svg-text-on-light">虚拟地址</text><line marker-end="url(#arrowhead)" stroke="var(--neutral-ink)" stroke-width="2" x1="245" x2="245" y1="250" y2="280"/><line marker-end="url(#arrowhead)" stroke="var(--lime-mid)" stroke-width="2" x1="310" x2="370" y1="340" y2="130"/><text font-size="var(--svg-font-size-caption)" x="340" y="220" class="svg-text svg-text-on-light">页面存在</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-dasharray="5,5" stroke-width="2" x1="310" x2="550" y1="360" y2="140"/><text font-size="var(--svg-font-size-caption)" x="430" y="250" class="svg-text svg-text-on-light">缺页中断</text><path d="M550 160q-50 40-1e2 20" fill="none" marker-end="url(#arrowhead)" stroke="var(--purple-deep)" stroke-dasharray="3,3" stroke-width="2"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="500" y="190" class="svg-text svg-text-on-light">页面调入</text><rect fill="var(--neutral-soft)" height="60" rx="3" stroke="var(--sky-deep)" stroke-width="1" width="700" x="50" y="430"/><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="60" y="450" class="svg-text svg-text-on-light">工作流程:</text><text font-size="var(--svg-font-size-caption)" x="60" y="465" class="svg-text svg-text-on-light">① CPU发出虚拟地址 → ② MMU查询页表 → ③ 若页面在内存则直接访问</text><text font-size="var(--svg-font-size-caption)" x="60" y="480" class="svg-text svg-text-on-light">④ 若缺页则触发中断 → ⑤ 操作系统从磁盘调入页面 → ⑥ 更新页表并继续执行</text><rect fill="var(--lime-soft)" height="90" rx="3" stroke="var(--lime-mid)" stroke-width="1" width="90" x="700" y="250"/><text font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="745" y="270" class="svg-text svg-text-on-light">核心优势</text><text font-size="var(--svg-font-size-caption)" x="710" y="285" class="svg-text svg-text-on-light">• 内存扩展</text><text font-size="var(--svg-font-size-caption)" x="710" y="298" class="svg-text svg-text-on-light">• 进程隔离</text><text font-size="var(--svg-font-size-caption)" x="710" y="311" class="svg-text svg-text-on-light">• 按需加载</text><text font-size="var(--svg-font-size-caption)" x="710" y="324" class="svg-text svg-text-on-light">• 内存共享</text></svg>
