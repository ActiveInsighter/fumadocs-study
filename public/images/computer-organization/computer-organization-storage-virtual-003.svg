<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><pattern height="15" id="pagePattern" patternUnits="userSpaceOnUse" width="30"><rect fill="none" height="15" stroke="var(--neutral-deep)" stroke-width=".5" width="30"/></pattern><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--neutral-ink)" points="0 0, 10 3.5, 0 7"/></marker></defs><rect fill="none" height="500" width="800"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="25">页式虚拟存储器</text><rect fill="var(--lime-mid)" height="60" rx="5" width="80" x="50" y="180"/><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="205">CPU</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="90" y="220">虚拟地址</text><rect fill="var(--yellow-mid)" height="80" rx="5" width="90" x="200" y="170"/><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="245" y="190">地址转换</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="245" y="205">机构(MMU)</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="245" y="225">页表查询</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="245" y="238">TLB缓存</text><rect fill="var(--sky-soft)" height="120" rx="3" stroke="var(--violet-mid)" stroke-width="2" width="130" x="180" y="280"/><text fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="245" y="