<svg viewBox="0 0 780 380" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-ink)"/></marker></defs><rect x="30" y="170" width="90" height="70" rx="6" fill="var(--blue-soft)" stroke="var(--indigo-deep)" stroke-width="1.5"/><text x="75" y="200" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" fill="var(--violet-ink)">CPU</text><text x="75" y="220" text-anchor="middle" fill="var(--violet-ink)" font-size="var(--svg-font-size-caption)">发出一个地址</text><line x1="120" y1="190" x2="260" y2="190" stroke="var(--neutral-ink)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="190" y="182" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)">地址总线</text><line x1="260" y1="220" x2="120" y2="220" stroke="var(--red-deep)" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="240" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">数据总线宽度 = n×m 位</text><rect x="260" y="40" width="360" height="330" rx="8" fill="var(--surface)" stroke="var(--neutral-ink)" stroke-width="1.5"/><text x="440" y="60" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-ink)">单体多字存储器（每行 n 个字）</text><rect x="275" y="75" width="60" height="26" fill="var(--neutral-soft)" stroke="var(--neutral-mid)"/><text x="305" y="93" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">地址</text><rect x="335" y="75" width="270" height="26" fill="var(--neutral-soft)" stroke="var(--neutral-mid)"/><text x="470" y="93" text-anchor="middle" font-weight="var(--svg-font-weight-bold)">存储字（每字 m 位，共 n=4 字）</text><rect x="275" y="101" width="60" height="34" fill="var(--surface)" stroke="var(--neutral-mid)"/><text x="305" y="123" text-anchor="middle">0</text><rect x="335" y="101" width="67" height="34" fill="var(--amber-soft)" stroke="var(--neutral-mid)"/><text x="368" y="123" text-anchor="middle">Word0</text><rect x="402" y="101" width="68" height="34" fill="var(--amber-soft)" stroke="var(--neutral-mid)"/><text x="436" y="123" text-anchor="middle">Word1</text><rect x="470" y="101" width="67" height="34" fill="var(--amber-soft)" stroke="var(--neutral-mid)"/><text x="503" y="123" text-anchor="middle">Word2</text><rect x="537" y="101" width="68" height="34" fill="var(--amber-soft)" stroke="var(--neutral-mid)"/><text x="571" y="123" text-anchor="middle">Word3</text><rect x="275" y="135" width="60" height="34" fill="var(--surface)" stroke="var(--neutral-mid)"/><text x="305" y="157" text-anchor="middle">1</text><rect x="335" y="135" width="67" height="34" fill="var(--sky-soft)" stroke="var(--neutral-mid)"/><text x="368" y="157" text-anchor="middle">Word4</text><rect x="402" y="135" width="68" height="34" fill="var(--sky-soft)" stroke="var(--neutral-mid)"/><text x="436" y="157" text-anchor="middle">Word5</text><rect x="470" y="135" width="67" height="34" fill="var(--sky-soft)" stroke="var(--neutral-mid)"/><text x="503" y="157" text-anchor="middle">Word6</text><rect x="537" y="135" width="68" height="34" fill="var(--sky-soft)" stroke="var(--neutral-mid)"/><text x="571" y="157" text-anchor="middle">Word7</text><rect x="275" y="169" width="60" height="34" fill="var(--surface)" stroke="var(--neutral-mid)"/><text x="305" y="191" text-anchor="middle">2</text><rect x="335" y="169" width="67" height="34" fill="var(--green-soft)" stroke="var(--neutral-mid)"/><text x="368" y="191" text-anchor="middle">Word8</text><rect x="402" y="169" width="68" height="34" fill="var(--green-soft)" stroke="var(--neutral-mid)"/><text x="436" y="191" text-anchor="middle">Word9</text><rect x="470" y="169" width="67" height="34" fill="var(--green-soft)" stroke="var(--neutral-mid)"/><text x="503" y="191" text-anchor="middle">Word10</text><rect x="537" y="169" width="68" height="34" fill="var(--green-soft)" stroke="var(--neutral-mid)"/><text x="571" y="191" text-anchor="middle">Word11</text><rect x="275" y="203" width="60" height="34" fill="var(--surface)" stroke="var(--neutral-mid)"/><text x="305" y="225" text-anchor="middle">3</text><rect x="335" y="203" width="270" height="34" fill="var(--paper)" stroke="var(--neutral-mid)"/><text x="470" y="225" text-anchor="middle" fill="var(--neutral-deep)">…</text><rect x="333" y="99" width="274" height="38" fill="none" stroke="var(--red-deep)" stroke-width="2" stroke-dasharray="5,3"/><text x="630" y="115" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">一次访问</text><text x="630" y="130" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">返回 n 个字</text><line x1="335" y1="260" x2="605" y2="260" stroke="var(--neutral-deep)" stroke-dasharray="4,3"/><text x="275" y="285" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-ink)">特点</text><text x="275" y="305" fill="var(--neutral-ink)">• 每个地址存放 n 个连续存储字（图中 n=4）</text><text x="275" y="322" fill="var(--neutral-ink)">• 数据总线加宽为 n×m 位，一次取回 n 个字</text><text x="275" y="339" fill="var(--neutral-ink)">• 理论带宽提升到原来的 n 倍</text><text x="275" y="356" fill="var(--red-deep)">• 仅对顺序访问有效；随机/非连续访问无并行收益</text><rect x="30" y="60" width="200" height="80" rx="6" fill="var(--surface)" stroke="var(--neutral-mid)"/><text x="130" y="80" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-deep)">普通存储器</text><text x="130" y="102" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">一个地址 → 一个字（m 位）</text><text x="130" y="122" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">数据总线宽度 = m 位</text><rect x="30" y="280" width="200" height="90" rx="6" fill="var(--paper)" stroke="var(--red-deep)"/><text x="130" y="300" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">单体多字存储器</text><text x="130" y="322" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">一个地址 → n 个字</text><text x="130" y="340" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">数据总线宽度 = n×m 位</text><text x="130" y="358" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">带宽 ≈ ×n（仅顺序）</text></svg>
