<svg viewBox="0 0 720 390" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="13" xmlns="http://www.w3.org/2000/svg"><style>text{fill:#222}.h{font-weight:700}.cell{stroke:#888}.safe{fill:#e6f7e6}.round{fill:#fff7d6}.trunc{fill:#ffe4cf}.ovf{fill:#ffd7d7}.legend rect{stroke:#888}</style><text x="360" y="28" text-anchor="middle" font-size="16" class="h">整型 ⇄ 浮点数 类型转换风险矩阵</text><g class="h"><rect class="cell" x="40" y="60" width="140" height="40" fill="#eef"/><text x="110" y="85" text-anchor="middle">源类型 \ 目标类型</text><rect class="cell" x="180" y="60" width="170" height="40" fill="#eef"/><text x="265" y="85" text-anchor="middle">int (32 位)</text><rect class="cell" x="350" y="60" width="170" height="40" fill="#eef"/><text x="435" y="85" text-anchor="middle">float (32 位)</text><rect class="cell" x="520" y="60" width="170" height="40" fill="#eef"/><text x="605" y="85" text-anchor="middle">double (64 位)</text></g><g><rect class="cell" x="40" y="100" width="140" height="80" fill="#eef"/><text x="110" y="135" text-anchor="middle" class="h">int</text><text x="110" y="155" text-anchor="middle" font-size="11" fill="#666">补码，± 2^31</text><rect class="cell safe" x="180" y="100" width="170" height="80"/><text x="265" y="130" text-anchor="middle" class="h">—</text><text x="265" y="150" text-anchor="middle" font-size="11">同类型</text><rect class="cell round" x="350" y="100" width="170" height="80"/><text x="435" y="130" text-anchor="middle" class="h">精度可能丢失</text><text x="435" y="150" text-anchor="middle" font-size="11">|x| &gt; 2^24 时舍入</text><text x="435" y="168" text-anchor="middle" font-size="11" fill="#666">尾数仅 23 位</text><rect class="cell safe" x="520" y="100" width="170" height="80"/><text x="605" y="130" text-anchor="middle" class="h">精确</text><text x="605" y="150" text-anchor="middle" font-size="11">double 52 位尾数</text><text x="605" y="168" text-anchor="middle" font-size="11" fill="#666">覆盖整个 int 范围</text></g><g><rect class="cell" x="40" y="180" width="140" height="80" fill="#eef"/><text x="110" y="215" text-anchor="middle" class="h">float</text><text x="110" y="235" text-anchor="middle" font-size="11" fill="#666">IEEE 754, 32 位</text><rect class="cell trunc" x="180" y="180" width="170" height="80"/><text x="265" y="210" text-anchor="middle" class="h">截断小数 + 可能溢出</text><text x="265" y="230" text-anchor="middle" font-size="11">超出 int 范围未定义</text><rect class="cell safe" x="350" y="180" width="170" height="80"/><text x="435" y="215" text-anchor="middle" class="h">—</text><text x="435" y="235" text-anchor="middle" font-size="11">同类型</text><rect class="cell safe" x="520" y="180" width="170" height="80"/><text x="605" y="215" text-anchor="middle" class="h">精确</text><text x="605" y="235" text-anchor="middle" font-size="11">double 范围/精度更高</text></g><g><rect class="cell" x="40" y="260" width="140" height="80" fill="#eef"/><text x="110" y="295" text-anchor="middle" class="h">double</text><text x="110" y="315" text-anchor="middle" font-size="11" fill="#666">IEEE 754, 64 位</text><rect class="cell trunc" x="180" y="260" width="170" height="80"/><text x="265" y="290" text-anchor="middle" class="h">截断小数 + 可能溢出</text><text x="265" y="310" text-anchor="middle" font-size="11">|x| &gt; 2^31 未定义</text><rect class="cell ovf" x="350" y="260" width="170" height="80"/><text x="435" y="290" text-anchor="middle" class="h">精度丢失 / 溢出</text><text x="435" y="310" text-anchor="middle" font-size="11">超 float 范围 → ±∞</text><text x="435" y="328" text-anchor="middle" font-size="11" fill="#666">尾数从 52 位 → 23 位</text><rect class="cell safe" x="520" y="260" width="170" height="80"/><text x="605" y="295" text-anchor="middle" class="h">—</text><text x="605" y="315" text-anchor="middle" font-size="11">同类型</text></g><g class="legend" transform="translate(40,360)"><rect x="0" y="0" width="20" height="16" class="safe"/><text x="28" y="13">精确 / 无损</text><rect x="120" y="0" width="20" height="16" class="round"/><text x="148" y="13">舍入 (精度丢失)</text><rect x="280" y="0" width="20" height="16" class="trunc"/><text x="308" y="13">截断 (丢失小数)</text><rect x="440" y="0" width="20" height="16" class="ovf"/><text x="468" y="13">溢出 / 未定义</text></g></svg>
