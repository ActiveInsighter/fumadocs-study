<svg viewBox="0 0 860 560" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="13" xmlns="http://www.w3.org/2000/svg"><style>text{fill:#222}.h{font-weight:700}.mono{font-family:Menlo,Consolas,monospace;font-size:12px}.cmt{fill:#888;font-style:italic;font-family:Menlo,Consolas,monospace;font-size:11px}.op{fill:#b91c4a}.reg{fill:#059669}.imm{fill:#d97706}.mem{fill:#7c3aed}.arrow{stroke:#aaa;stroke-width:1.5;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#aaa"/></marker></defs><rect x="30" y="18" width="800" height="72" rx="6" fill="#fafafa" stroke="#ddd"/><rect x="148" y="30" width="66" height="20" rx="3" fill="#fff4e0" stroke="#e2954a"/><text x="181" y="44" text-anchor="middle" class="h" font-size="12" fill="#b45309">Intel</text><text x="185" y="68" text-anchor="middle" class="mono">mov<tspan class="op">eax</tspan>,<tspan class="reg">ebx</tspan></text><text x="185" y="84" text-anchor="middle" class="cmt">; 目的 ← 源</text><path d="M4e2 54h60" class="arrow"/><rect x="596" y="30" width="66" height="20" rx="3" fill="#e8f7e8" stroke="#4ea84e"/><text x="630" y="44" text-anchor="middle" class="h" font-size="12" fill="#166534">AT&amp;T</text><text x="630" y="65" text-anchor="middle" class="mono">movl<tspan class="reg">%ebx</tspan>,<tspan class="op">%eax</tspan></text><text x="630" y="81" text-anchor="middle" class="cmt">; 源 → 目的</text><rect x="30" y="106" width="800" height="32" rx="4" fill="#f0f0f0" stroke="#ccc"/><text x="170" y="127" text-anchor="middle" class="h" font-size="13">特性</text><line x1="310" y1="106" x2="310" y2="138" stroke="#ccc"/><line x1="590" y1="106" x2="590" y2="138" stroke="#ccc"/><text x="450" y="127" text-anchor="middle" class="h" font-size="13" fill="#b45309">Intel 格式</text><text x="710" y="127" text-anchor="middle" class="h" font-size="13" fill="#166534">AT&amp;T 格式</text><line x1="310" y1="138" x2="310" y2="406" stroke="#ccc"/><line x1="590" y1="106" x2="590" y2="406" stroke="#ddd" stroke-dasharray="4,3"/><rect x="30" y="138" width="800" height="44" fill="#fffdf7" stroke="#eee"/><text x="170" y="158" text-anchor="middle" class="h" font-size="12">操作数顺序</text><text x="450" y="156" text-anchor="middle" class="mono">目的, 源</text><text x="450" y="172" text-anchor="middle" class="cmt">mov eax, ebx</text><text x="710" y="156" text-anchor="middle" class="mono" fill="#166534">源, 目的</text><text x="710" y="172" text-anchor="middle" class="cmt">movl %ebx, %eax</text><rect x="30" y="182" width="800" height="44" fill="#f9f9f9" stroke="#eee"/><text x="170" y="202" text-anchor="middle" class="h" font-size="12">寄存器</text><text x="450" y="200" text-anchor="middle" class="mono">eax ebx ecx</text><text x="450" y="215" text-anchor="middle" class="cmt">直接写寄存器名</text><text x="710" y="200" text-anchor="middle" class="mono" fill="#166534">%eax %ebx %ecx</text><text x="710" y="215" text-anchor="middle" class="cmt">前缀<tspan fill="#b91c4a">%</tspan></text><rect x="30" y="226" width="800" height="44" fill="#fffdf7" stroke="#eee"/><text x="170" y="246" text-anchor="middle" class="h" font-size="12">立即数</text><text x="450" y="244" text-anchor="middle" class="mono">10 0x20</text><text x="450" y="259" text-anchor="middle" class="cmt">直接写数值</text><text x="710" y="244" text-anchor="middle" class="mono" fill="#166534">$10 $0x20</text><text x="710" y="259" text-anchor="middle" class="cmt">前缀<tspan fill="#b91c4a">$</tspan></text><rect x="30" y="270" width="800" height="44" fill="#f9f9f9" stroke="#eee"/><text x="170" y="290" text-anchor="middle" class="h" font-size="12">内存操作数</text><text x="450" y="288" text-anchor="middle" class="mono">[ebx + ecx*4 + 8]</text><text x="450" y="303" text-anchor="middle" class="cmt">方括号 [ ]</text><text x="710" y="288" text-anchor="middle" class="mono" fill="#166534">8(%ebx, %ecx, 4)</text><text x="710" y="303" text-anchor="middle" class="cmt">圆括号 ( )，偏移量前置</text><rect x="30" y="314" width="800" height="44" fill="#fffdf7" stroke="#eee"/><text x="170" y="334" text-anchor="middle" class="h" font-size="12">操作数长度</text><text x="450" y="332" text-anchor="middle" class="mono">由寄存器名决定</text><text x="450" y="347" text-anchor="middle" class="cmt">eax→32位, ax→16位</text><text x="710" y="332" text-anchor="middle" class="mono" fill="#166534">指令后缀 b/w/l/q</text><text x="710" y="347" text-anchor="middle" class="cmt">movb / movw / movl / movq</text><rect x="30" y="358" width="800" height="44" fill="#f9f9f9" stroke="#eee"/><text x="170" y="378" text-anchor="middle" class="h" font-size="12">注释符号</text><text x="450" y="378" text-anchor="middle" class="mono">; 分号</text><text x="710" y="378" text-anchor="middle" class="mono" fill="#166534"># 井号</text><rect x="30" y="106" width="800" height="296" rx="4" fill="none" stroke="#ccc" stroke-width="1.2"/><rect x="30" y="422" width="800" height="118" rx="6" fill="#f8f8ff" stroke="#c7d2fe"/><text x="430" y="442" text-anchor="middle" class="h" font-size="13" fill="#3730a3">内存寻址格式对照</text><rect x="48" y="450" width="55" height="18" rx="3" fill="#fff4e0" stroke="#e2954a"/><text x="75" y="463" text-anchor="middle" class="h" font-size="11" fill="#b45309">Intel</text><text x="116" y="463" class="mono">[<tspan class="reg">基址</tspan>+<tspan class="reg">变址</tspan>×<tspan class="imm">比例</tspan>+<tspan class="mem">偏移</tspan>]</text><text x="116" y="479" class="mono">[<tspan class="reg">ebx</tspan>+<tspan class="reg">ecx</tspan>×<tspan class="imm">4</tspan>+<tspan class="mem">8</tspan>]</text><text x="580" y="463" text-anchor="middle" class="mono">EA = (<tspan class="reg">EBX</tspan>) + (<tspan class="reg">ECX</tspan>) ×<tspan class="imm">4</tspan>+<tspan class="mem">8</tspan></text><text x="580" y="479" text-anchor="middle" class="cmt">两种格式计算结果相同，仅写法不同</text><line x1="48" y1="492" x2="812" y2="492" stroke="#c7d2fe" stroke-dasharray="4,3"/><rect x="48" y="498" width="55" height="18" rx="3" fill="#e8f7e8" stroke="#4ea84e"/><text x="75" y="511" text-anchor="middle" class="h" font-size="11" fill="#166534">AT&amp;T</text><text x="116" y="511" class="mono"><tspan class="mem">偏移</tspan>(<tspan class="reg">基址</tspan>,<tspan class="reg">变址</tspan>,<tspan class="imm">比例</tspan>)</text><text x="116" y="527" class="mono"><tspan class="mem">8</tspan>(<tspan class="reg">%ebx</tspan>,<tspan class="reg">%ecx</tspan>,<tspan class="imm">4</tspan>)</text></svg>
