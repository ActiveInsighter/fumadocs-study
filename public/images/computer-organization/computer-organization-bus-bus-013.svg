<svg viewBox="0 0 900 600" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="900" height="600" fill="var(--surface)" rx="12"/><text x="450" y="36" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">总线通信指标图解</text><rect x="30" y="55" width="840" height="120" rx="8" fill="var(--sky-soft)" stroke="var(--indigo-mid)" stroke-width="1.5"/><text x="46" y="76" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-deep)">① 时钟频率（Clock Frequency）</text><text x="46" y="96" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">时钟信号（100MHz → 周期 T = 10ns）</text><g stroke="var(--red-deep)" stroke-width="2" fill="none"><polyline points="60,150 60,110 100,110 100,150 140,150 140,110 180,110 180,150 220,150 220,110 260,110 260,150 300,150 300,110 340,110 340,150 380,150 380,110 420,110 420,150"/></g><line x1="60" y1="160" x2="140" y2="160" stroke="var(--indigo-mid)" stroke-width="1.5"/><line x1="60" y1="156" x2="60" y2="164" stroke="var(--indigo-mid)" stroke-width="1.5"/><line x1="140" y1="156" x2="140" y2="164" stroke="var(--indigo-mid)" stroke-width="1.5"/><text x="100" y="172" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">T = 10 ns</text><text x="460" y="120" font-size="var(--svg-font-size-label)" fill="var(--neutral-deep)">每个脉冲上升 / 下降 = 1 个时钟周期</text><text x="460" y="140" font-size="var(--svg-font-size-label)" fill="var(--neutral-deep)">时钟频率 = 1 / T　（单位：Hz）</text><rect x="30" y="190" width="840" height="150" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow-mid)" stroke-width="1.5"/><text x="46" y="212" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--yellow-mid)">② 总线传输周期（Bus Transfer Cycle）</text><text x="46" y="230" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">一次完整数据传输 = 多个时钟周期（示例：N = 4）</text><g stroke="var(--ink-soft)" stroke-width="1.5" fill="none"><polyline points="60,275 60,250 95,250 95,275 130,275 130,250 165,250 165,275 200,275 200,250 235,250 235,275 270,275 270,250 305,250 305,275 340,275"/></g><g stroke="var(--neutral-mid)" stroke-width="1" stroke-dasharray="3,3"><line x1="130" y1="245" x2="130" y2="306"/><line x1="200" y1="245" x2="200" y2="306"/><line x1="270" y1="245" x2="270" y2="306"/></g><g font-size="var(--svg-font-size-caption)" text-anchor="middle"><rect x="60" y="280" width="70" height="26" rx="4" fill="var(--sky-mid)" stroke="var(--blue-deep)" stroke-width="1"/><text x="95" y="297" fill="var(--blue-ink)">申请</text><rect x="130" y="280" width="70" height="26" rx="4" fill="var(--green-mid)" stroke="var(--green-deep)" stroke-width="1"/><text x="165" y="297" fill="var(--green-deep)">寻址</text><rect x="200" y="280" width="70" height="26" rx="4" fill="var(--yellow-light)" stroke="var(--yellow-mid)" stroke-width="1"/><text x="235" y="297" fill="var(--amber-deep)">传输数据</text><rect x="270" y="280" width="70" height="26" rx="4" fill="var(--orange-light)" stroke="var(--orange-mid)" stroke-width="1"/><text x="305" y="297" fill="var(--orange-deep)">结束</text></g><g font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--neutral-mid)"><text x="95" y="317">T</text><text x="165" y="317">T</text><text x="235" y="317">T</text><text x="305" y="317">T</text></g><line x1="60" y1="326" x2="340" y2="326" stroke="var(--yellow-mid)" stroke-width="1.5"/><line x1="60" y1="321" x2="60" y2="331" stroke="var(--yellow-mid)" stroke-width="1.5"/><line x1="340" y1="321" x2="340" y2="331" stroke="var(--yellow-mid)" stroke-width="1.5"/><text x="200" y="336" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--yellow-mid)">总线传输周期 = N × T（N = 4）</text><text x="460" y="238" font-size="var(--svg-font-size-label)" fill="var(--neutral-deep)">包含四个阶段：</text><text x="460" y="256" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">🔹 申请 — 设备请求总线使用权</text><text x="460" y="274" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">🔹 寻址 — 指定目标地址</text><text x="460" y="292" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">🔹 传输 — 实际数据传送</text><text x="460" y="310" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">🔹 结束 — 释放总线</text><rect x="30" y="355" width="840" height="230" rx="8" fill="var(--violet-soft)" stroke="var(--purple-deep)" stroke-width="1.5"/><text x="46" y="376" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">③ 总线工作频率（Bus Operating Frequency）</text><text x="46" y="395" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-deep)">SDR（单倍数据率）</text><g stroke="var(--indigo-mid)" stroke-width="2" fill="none"><polyline points="80,422 80,405 130,405 130,422 180,422 180,405 230,405 230,422 280,422"/></g><circle cx="80" cy="405" r="4" fill="var(--red-deep)"/><circle cx="130" cy="405" r="4" fill="var(--red-deep)"/><circle cx="180" cy="405" r="4" fill="var(--red-deep)"/><circle cx="230" cy="405" r="4" fill="var(--red-deep)"/><text x="295" y="417" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">每周期 1 次传输 → 工作频率 = 时钟频率</text><text x="46" y="443" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-deep)">DDR（双倍数据率）</text><g stroke="var(--green-mid)" stroke-width="2" fill="none"><polyline points="80,470 80,453 130,453 130,470 180,470 180,453 230,453 230,470 280,470"/></g><circle cx="80" cy="453" r="4" fill="var(--red-deep)"/><circle cx="130" cy="470" r="4" fill="var(--orange-mid)"/><circle cx="130" cy="453" r="4" fill="var(--red-deep)"/><circle cx="180" cy="470" r="4" fill="var(--orange-mid)"/><circle cx="180" cy="453" r="4" fill="var(--red-deep)"/><circle cx="230" cy="470" r="4" fill="var(--orange-mid)"/><circle cx="230" cy="453" r="4" fill="var(--red-deep)"/><text x="295" y="458" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">上升沿 + 下降沿各 1 次</text><text x="295" y="474" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">→ 工作频率 = 2 × 时钟频率</text><text x="46" y="493" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-deep)">QDR（四倍数据率）</text><g stroke="var(--purple-deep)" stroke-width="2" fill="none"><polyline points="80,520 80,503 130,503 130,520 180,520 180,503 230,503 230,520 280,520"/></g><circle cx="80" cy="503" r="4" fill="var(--red-deep)"/><circle cx="105" cy="520" r="4" fill="var(--orange-mid)"/><circle cx="130" cy="503" r="4" fill="var(--red-deep)"/><circle cx="155" cy="520" r="4" fill="var(--orange-mid)"/><circle cx="180" cy="503" r="4" fill="var(--red-deep)"/><circle cx="205" cy="520" r="4" fill="var(--orange-mid)"/><circle cx="230" cy="503" r="4" fill="var(--red-deep)"/><circle cx="255" cy="520" r="4" fill="var(--orange-mid)"/><text x="295" y="508" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">每周期传 4 次</text><text x="295" y="524" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">→ 工作频率 = 4 × 时钟频率</text><circle cx="600" cy="412" r="5" fill="var(--red-deep)"/><text x="612" y="416" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">上升沿采样</text><circle cx="700" cy="412" r="5" fill="var(--orange-mid)"/><text x="712" y="416" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">下降沿采样</text><rect x="46" y="538" width="808" height="34" rx="6" fill="var(--violet-mid)" stroke="var(--purple-deep)" stroke-width="1"/><text x="450" y="560" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--purple-ink)">通用公式：工作频率 = 时钟频率 / N　（N = 总线传输周期所含时钟周期数）</text></svg>
