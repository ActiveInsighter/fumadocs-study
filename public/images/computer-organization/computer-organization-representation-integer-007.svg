<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><text x="400" y="30" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--violet-deep)">原码（Sign-Magnitude）表示法</text><text x="50" y="70" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">8位原码结构：</text><g transform="translate(50, 90)"><text x="15" y="15" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">7</text><text x="55" y="15" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">6</text><text x="95" y="15" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">5</text><text x="135" y="15" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">4</text><text x="175" y="15" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">3</text><text x="215" y="15" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">2</text><text x="255" y="15" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">1</text><text x="295" y="15" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">0</text><rect x="0" y="20" width="30" height="40" fill="var(--amber-soft)" stroke="var(--yellow-mid)" stroke-width="2"/><text x="15" y="44" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-mid)">S</text><rect x="40" y="20" width="270" height="40" fill="var(--blue-soft)" stroke="var(--violet-mid)" stroke-width="2"/><text x="175" y="44" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--violet-deep)">数值位（Magnitude Bits）</text><text x="15" y="75" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--orange-mid)">符号位</text><text x="175" y="75" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--violet-deep)">绝对值的二进制表示</text></g><g transform="translate(400, 90)"><text x="0" y="20" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">符号位规则：</text><g transform="translate(0, 40)"><rect x="0" y="0" width="25" height="25" fill="var(--green-soft)" stroke="var(--lime-mid)" stroke-width="2"/><text x="12" y="17" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--lime-mid)">0</text><text x="35" y="17" font-size="var(--svg-font-size-body)" fill="var(--indigo-ink)">= 正数</text></g><g transform="translate(0, 75)"><rect x="0" y="0" width="25" height="25" fill="var(--red-soft)" stroke="var(--red-deep)" stroke-width="2"/><text x="12" y="17" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">1</text><text x="35" y="17" font-size="var(--svg-font-size-body)" fill="var(--indigo-ink)">= 负数</text></g></g><text x="50" y="210" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">示例：</text><g transform="translate(50, 240)"><text x="0" y="0" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--lime-mid)">正数：+25</text><text x="0" y="25" font-size="var(--svg-font-size-body)" fill="var(--sky-deep)">25的二进制：11001</text><g transform="translate(0, 45)"><rect x="0" y="0" width="30" height="30" fill="var(--green-soft)" stroke="var(--lime-mid)" stroke-width="2"/><text x="15" y="20" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--lime-mid)">0</text><rect x="35" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="50" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">0</text><rect x="65" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="80" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">0</text><rect x="95" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="110" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">1</text><rect x="125" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="140" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">1</text><rect x="155" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="170" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">0</text><rect x="185" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="200" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">0</text><rect x="215" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="230" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">1</text><text x="125" y="50" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">00011001 = +25</text></g></g><g transform="translate(50, 360)"><text x="0" y="0" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">负数：-25</text><text x="0" y="25" font-size="var(--svg-font-size-body)" fill="var(--sky-deep)">25的二进制：11001（绝对值相同）</text><g transform="translate(0, 45)"><rect x="0" y="0" width="30" height="30" fill="var(--red-soft)" stroke="var(--red-deep)" stroke-width="2"/><text x="15" y="20" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">1</text><rect x="35" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="50" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">0</text><rect x="65" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="80" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">0</text><rect x="95" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="110" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">1</text><rect x="125" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="140" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">1</text><rect x="155" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="170" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">0</text><rect x="185" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="200" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">0</text><rect x="215" y="0" width="30" height="30" fill="var(--paper)" stroke="var(--sky-deep)" stroke-width="1"/><text x="230" y="20" text-anchor="middle" font-size="var(--svg-font-size-body)">1</text><text x="125" y="50" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">10011001 = -25</text></g></g><g transform="translate(400, 240)"><text x="0" y="0" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">零的表示：</text><g transform="translate(0, 30)"><text x="0" y="0" font-size="var(--svg-font-size-body)" fill="var(--purple-deep)">+0：</text><rect x="40" y="-15" width="20" height="20" fill="var(--green-soft)" stroke="var(--lime-mid)" stroke-width="1"/><text x="50" y="-2" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--lime-mid)">0</text><text x="70" y="-2" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">0000000</text></g><g transform="translate(0, 60)"><text x="0" y="0" font-size="var(--svg-font-size-body)" fill="var(--purple-deep)">-0：</text><rect x="40" y="-15" width="20" height="20" fill="var(--red-soft)" stroke="var(--red-deep)" stroke-width="1"/><text x="50" y="-2" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--red-deep)">1</text><text x="70" y="-2" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">0000000</text></g><text x="0" y="90" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">（实际应用中通常只使用+0）</text></g><g transform="translate(400, 360)"><text x="0" y="0" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">原码特点：</text><text x="0" y="25" font-size="var(--svg-font-size-body)" fill="var(--sky-deep)">• 符号位独立于数值位</text><text x="0" y="45" font-size="var(--svg-font-size-body)" fill="var(--sky-deep)">• 正负数的数值位相同</text><text x="0" y="65" font-size="var(--svg-font-size-body)" fill="var(--sky-deep)">• 直观易懂</text><text x="0" y="85" font-size="var(--svg-font-size-body)" fill="var(--sky-deep)">• 运算复杂（需要判断符号）</text><text x="0" y="105" font-size="var(--svg-font-size-body)" fill="var(--sky-deep)">• 存在+0和-0两个零</text></g><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--sky-deep)"/></marker></defs><line x1="65" y1="140" x2="400" y2="140" stroke="var(--sky-deep)" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/></svg>
