<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="mainMemGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#e3f2fd;stop-opacity:1"/><stop offset="100%" style="stop-color:#90caf9;stop-opacity:1"/></linearGradient><linearGradient id="cacheGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#fff3e0;stop-opacity:1"/><stop offset="100%" style="stop-color:#ffb74d;stop-opacity:1"/></linearGradient><filter id="shadow"><feDropShadow dx="2" dy="2" flood-opacity=".3" stdDeviation="3"/></filter><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#333" points="0 0, 10 3, 0 6"/></marker></defs><text fill="#1a237e" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="35">Cache 映射方式：主存块 → Cache 块的对应规则</text><g id="mainMemory"><rect fill="url(#mainMemGrad)" filter="url(#shadow)" height="600" rx="8" stroke="#1976d2" stroke-width="2" width="200" x="50" y="80"/><text fill="#0d47a1" font-size="18" font-weight="bold" text-anchor="middle" x="150" y="110">主存储器</text><text fill="#555" font-size="13" text-anchor="middle" x="150" y="135">(容量大，速度慢)</text><g id="memBlocks"><rect fill="#bbdefb" height="35" stroke="#1976d2" stroke-width="1.5" width="160" x="70" y="160"/><text fill="#0d47a1" font-size="14" text-anchor="middle" x="150" y="182">块 0</text><rect fill="#bbdefb" height="35" stroke="#1976d2" stroke-width="1.5" width="160" x="70" y="200"/><text fill="#0d47a1" font-size="14" text-anchor="middle" x="150" y="222">块 1</text><rect fill="#bbdefb" height="35" stroke="#1976d2" stroke-width="1.5" width="160" x="70" y="240"/><text fill="#0d47a1" font-size="14" text-anchor="middle" x="150" y="262">块 2</text><rect fill="#bbdefb" height="35" stroke="#1976d2" stroke-width="1.5" width="160" x="70" y="280"/><text fill="#0d47a1" font-size="14" text-anchor="middle" x="150" y="302">块 3</text><text fill="#666" font-size="20" text-anchor="middle" x="150" y="340">⋮</text><rect fill="#bbdefb" height="35" stroke="#1976d2" stroke-width="1.5" width="160" x="70" y="360"/><text fill="#0d47a1" font-size="14" text-anchor="middle" x="150" y="382">块 M-2</text><rect fill="#bbdefb" height="35" stroke="#1976d2" stroke-width="1.5" width="160" x="70" y="400"/><text fill="#0d47a1" font-size="14" text-anchor="middle" x="150" y="422">块 M-1</text></g></g><g id="cache"><rect fill="url(#cacheGrad)" filter="url(#shadow)" height="600" rx="8" stroke="#f57c00" stroke-width="2" width="200" x="950" y="80"/><text fill="#e65100" font-size="18" font-weight="bold" text-anchor="middle" x="1050" y="110">Cache</text><text fill="#555" font-size="13" text-anchor="middle" x="1050" y="135">(容量小，速度快)</text><g id="cacheBlocks"><rect fill="#ffe0b2" height="35" stroke="#f57c00" stroke-width="1.5" width="160" x="970" y="160"/><text fill="#e65100" font-size="14" text-anchor="middle" x="1050" y="182">Cache 块 0</text><rect fill="#ffe0b2" height="35" stroke="#f57c00" stroke-width="1.5" width="160" x="970" y="200"/><text fill="#e65100" font-size="14" text-anchor="middle" x="1050" y="222">Cache 块 1</text><rect fill="#ffe0b2" height="35" stroke="#f57c00" stroke-width="1.5" width="160" x="970" y="240"/><text fill="#e65100" font-size="14" text-anchor="middle" x="1050" y="262">Cache 块 2</text><rect fill="#ffe0b2" height="35" stroke="#f57c00" stroke-width="1.5" width="160" x="970" y="280"/><text fill="#e65100" font-size="14" text-anchor="middle" x="1050" y="302">Cache 块 3</text><text fill="#666" font-size="20" text-anchor="middle" x="1050" y="340">⋮</text><rect fill="#ffe0b2" height="35" stroke="#f57c00" stroke-width="1.5" width="160" x="970" y="360"/><text fill="#e65100" font-size="14" text-anchor="middle" x="1050" y="382">Cache 块 N-2</text><rect fill="#ffe0b2" height="35" stroke="#f57c00" stroke-width="1.5" width="160" x="970" y="400"/><text fill="#e65100" font-size="14" text-anchor="middle" x="1050" y="422">Cache 块 N-1</text></g></g><g id="mappingExplanation"><rect fill="#f5f5f5" height="540" opacity=".9" rx="10" stroke="#666" stroke-dasharray="5,5" stroke-width="2" width="600" x="300" y="120"/><text fill="#d32f2f" font-size="20" font-weight="bold" text-anchor="middle" x="600" y="160">核心问题：主存块该放到 Cache 的哪里？</text><g id="threeElements"><rect fill="#e8f5e9" height="100" rx="6" stroke="#4caf50" stroke-width="2" width="540" x="330" y="200"/><text fill="#2e7d32" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="225">1. 可放置性 (Placement)</text><text fill="#333" font-size="14" text-anchor="middle" x="600" y="250">主存块 X 允许放入 Cache 的哪些位置？</text><text fill="#555" font-size="13" text-anchor="middle" x="600" y="275">固定一个？多个？任意位置？</text><rect fill="#fff3e0" height="100" rx="6" stroke="#ff9800" stroke-width="2" width="540" x="330" y="320"/><text fill="#e65100" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="345">2. 灵活性 vs 唯一性</text><text fill="#333" font-size="14" text-anchor="middle" x="600" y="370">放置越自由 → 命中率越高，硬件越复杂</text><text fill="#555" font-size="13" text-anchor="middle" x="600" y="395">放置越受限 → 硬件越简单，冲突失效越多</text><rect fill="#e3f2fd" height="100" rx="6" stroke="#2196f3" stroke-width="2" width="540" x="330" y="440"/><text fill="#0d47a1" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="465">3. 硬件代价与性能权衡</text><text fill="#333" font-size="14" text-anchor="middle" x="600" y="490">查找复杂度 ↔ 冲突概率 ↔ 命中率</text><text fill="#555" font-size="13" text-anchor="middle" x="600" y="515">需要在成本、速度、效率之间平衡</text></g><path d="M230 217q170 0 1e2 33" fill="none" marker-end="url(#arrowhead)" opacity=".6" stroke="#4caf50" stroke-width="2"/><path d="M230 297q170 40 1e2 73" fill="none" marker-end="url(#arrowhead)" opacity=".6" stroke="#ff9800" stroke-width="2"/><path d="M230 377q170 80 1e2 113" fill="none" marker-end="url(#arrowhead)" opacity=".6" stroke="#2196f3" stroke-width="2"/></g><g id="bottomNote"><rect fill="#fff9c4" height="60" rx="8" stroke="#f9a825" stroke-width="2" width="600" x="300" y="700"/><text fill="#f57f17" font-size="15" font-weight="bold" text-anchor="middle" x="600" y="725">三种经典映射方式</text><text fill="#333" font-size="13" text-anchor="middle" x="600" y="748">直接映射 | 全相联映射 | 组相联映射</text></g><path d="M250 3e2q250 0 7e2.0" fill="none" marker-end="url(#arrowhead)" opacity=".3" stroke="#9e9e9e" stroke-dasharray="10,5" stroke-width="3"/><text fill="#666" font-size="12" opacity=".7" text-anchor="middle" x="600" y="290">映射规则</text></svg>
