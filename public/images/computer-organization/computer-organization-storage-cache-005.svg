<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter id="shadow"><feDropShadow dx="2" dy="2" flood-opacity=".3" stdDeviation="3"/></filter><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--neutral-ink)" points="0 0, 10 3, 0 6"/></marker></defs><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="600" y="35" class="svg-text svg-text-on-light">Cache 映射方式：主存块 → Cache 块的对应规则</text><g id="mainMemory"><rect fill="var(--sky-deep)" filter="url(#shadow)" height="600" rx="8" stroke="var(--violet-deep)" stroke-width="2" width="200" x="50" y="80"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="110" class="svg-text svg-text-on-dark">主存储器</text><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="150" y="135" class="svg-text svg-text-on-dark">(容量大，速度慢)</text><g id="memBlocks"><rect fill="var(--sky-light)" height="35" stroke="var(--violet-deep)" stroke-width="1.5" width="160" x="70" y="160"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="150" y="182" class="svg-text svg-text-on-light">块 0</text><rect fill="var(--sky-light)" height="35" stroke="var(--violet-deep)" stroke-width="1.5" width="160" x="70" y="200"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="150" y="222" class="svg-text svg-text-on-light">块 1</text><rect fill="var(--sky-light)" height="35" stroke="var(--violet-deep)" stroke-width="1.5" width="160" x="70" y="240"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="150" y="262" class="svg-text svg-text-on-light">块 2</text><rect fill="var(--sky-light)" height="35" stroke="var(--violet-deep)" stroke-width="1.5" width="160" x="70" y="280"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="150" y="302" class="svg-text svg-text-on-light">块 3</text><text font-size="var(--svg-font-size-title)" text-anchor="middle" x="150" y="340" class="svg-text svg-text-on-dark">⋮</text><rect fill="var(--sky-light)" height="35" stroke="var(--violet-deep)" stroke-width="1.5" width="160" x="70" y="360"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="150" y="382" class="svg-text svg-text-on-light">块 M-2</text><rect fill="var(--sky-light)" height="35" stroke="var(--violet-deep)" stroke-width="1.5" width="160" x="70" y="400"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="150" y="422" class="svg-text svg-text-on-light">块 M-1</text></g></g><g id="cache"><rect fill="var(--yellow-deep)" filter="url(#shadow)" height="600" rx="8" stroke="var(--orange-mid)" stroke-width="2" width="200" x="950" y="80"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="1050" y="110" class="svg-text svg-text-on-dark">Cache</text><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="1050" y="135" class="svg-text svg-text-on-dark">(容量小，速度快)</text><g id="cacheBlocks"><rect fill="var(--amber-light)" height="35" stroke="var(--orange-mid)" stroke-width="1.5" width="160" x="970" y="160"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="1050" y="182" class="svg-text svg-text-on-light">Cache 块 0</text><rect fill="var(--amber-light)" height="35" stroke="var(--orange-mid)" stroke-width="1.5" width="160" x="970" y="200"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="1050" y="222" class="svg-text svg-text-on-light">Cache 块 1</text><rect fill="var(--amber-light)" height="35" stroke="var(--orange-mid)" stroke-width="1.5" width="160" x="970" y="240"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="1050" y="262" class="svg-text svg-text-on-light">Cache 块 2</text><rect fill="var(--amber-light)" height="35" stroke="var(--orange-mid)" stroke-width="1.5" width="160" x="970" y="280"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="1050" y="302" class="svg-text svg-text-on-light">Cache 块 3</text><text font-size="var(--svg-font-size-title)" text-anchor="middle" x="1050" y="340" class="svg-text svg-text-on-dark">⋮</text><rect fill="var(--amber-light)" height="35" stroke="var(--orange-mid)" stroke-width="1.5" width="160" x="970" y="360"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="1050" y="382" class="svg-text svg-text-on-light">Cache 块 N-2</text><rect fill="var(--amber-light)" height="35" stroke="var(--orange-mid)" stroke-width="1.5" width="160" x="970" y="400"/><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="1050" y="422" class="svg-text svg-text-on-light">Cache 块 N-1</text></g></g><g id="mappingExplanation"><rect fill="var(--paper)" height="540" opacity=".9" rx="10" stroke="var(--neutral-deep)" stroke-dasharray="5,5" stroke-width="2" width="600" x="300" y="120"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="600" y="160" class="svg-text svg-text-on-light">核心问题：主存块该放到 Cache 的哪里？</text><g id="threeElements"><rect fill="var(--green-soft)" height="100" rx="6" stroke="var(--lime-mid)" stroke-width="2" width="540" x="330" y="200"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="600" y="225" class="svg-text svg-text-on-light">1. 可放置性 (Placement)</text><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="600" y="250" class="svg-text svg-text-on-light">主存块 X 允许放入 Cache 的哪些位置？</text><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="600" y="275" class="svg-text svg-text-on-light">固定一个？多个？任意位置？</text><rect fill="var(--yellow-soft)" height="100" rx="6" stroke="var(--yellow-mid)" stroke-width="2" width="540" x="330" y="320"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="600" y="345" class="svg-text svg-text-on-light">2. 灵活性 vs 唯一性</text><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="600" y="370" class="svg-text svg-text-on-light">放置越自由 → 命中率越高，硬件越复杂</text><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="600" y="395" class="svg-text svg-text-on-light">放置越受限 → 硬件越简单，冲突失效越多</text><rect fill="var(--sky-soft)" height="100" rx="6" stroke="var(--violet-mid)" stroke-width="2" width="540" x="330" y="440"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="600" y="465" class="svg-text svg-text-on-light">3. 硬件代价与性能权衡</text><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="600" y="490" class="svg-text svg-text-on-light">查找复杂度 ↔ 冲突概率 ↔ 命中率</text><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="600" y="515" class="svg-text svg-text-on-light">需要在成本、速度、效率之间平衡</text></g><path d="M230 217q170 0 1e2 33" fill="none" marker-end="url(#arrowhead)" opacity=".6" stroke="var(--lime-mid)" stroke-width="2"/><path d="M230 297q170 40 1e2 73" fill="none" marker-end="url(#arrowhead)" opacity=".6" stroke="var(--yellow-mid)" stroke-width="2"/><path d="M230 377q170 80 1e2 113" fill="none" marker-end="url(#arrowhead)" opacity=".6" stroke="var(--violet-mid)" stroke-width="2"/></g><g id="bottomNote"><rect fill="var(--yellow-light)" height="60" rx="8" stroke="var(--yellow-mid)" stroke-width="2" width="600" x="300" y="700"/><text font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="600" y="725" class="svg-text svg-text-on-light">三种经典映射方式</text><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="600" y="748" class="svg-text svg-text-on-light">直接映射 | 全相联映射 | 组相联映射</text></g><path d="M250 3e2q250 0 7e2.0" fill="none" marker-end="url(#arrowhead)" opacity=".3" stroke="var(--neutral-mid)" stroke-dasharray="10,5" stroke-width="3"/><text font-size="var(--svg-font-size-label)" opacity=".7" text-anchor="middle" x="600" y="290" class="svg-text svg-text-on-light">映射规则</text></svg>
