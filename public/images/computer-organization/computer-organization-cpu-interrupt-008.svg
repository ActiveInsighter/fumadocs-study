<svg viewBox="0 0 760 480" width="760" height="480" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="760" height="480" fill="none" rx="8"/><defs><linearGradient id="priorityGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--red-deep)"/><stop offset="50%" stop-color="var(--yellow-mid)"/><stop offset="100%" stop-color="var(--indigo-mid)"/></linearGradient></defs><text x="50" y="36" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-deep)">优先级</text><text x="50" y="52" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">（高 → 低）</text><rect x="58" y="65" width="18" height="310" rx="4" fill="url(#priorityGrad)" opacity=".85"/><polygon points="67,58 61,70 73,70" fill="var(--red-deep)"/><polygon points="67,382 61,370 73,370" fill="var(--indigo-mid)"/><text x="84" y="82" font-size="var(--svg-font-size-label)" fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">高优先级</text><text x="84" y="226" font-size="var(--svg-font-size-label)" fill="var(--yellow-mid)" font-weight="var(--svg-font-weight-bold)">中优先级</text><text x="84" y="378" font-size="var(--svg-font-size-label)" fill="var(--indigo-mid)" font-weight="var(--svg-font-weight-bold)">低优先级</text><line x1="160" y1="30" x2="160" y2="450" stroke="var(--neutral-light)" stroke-width="1" stroke-dasharray="4,3"/><text x="310" y="36" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-deep)" text-anchor="middle">中断源</text><rect x="200" y="55" width="220" height="52" rx="8" fill="var(--red-soft)" stroke="var(--red-deep)" stroke-width="1.8"/><text x="260" y="76" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--red-deep)">中断 A</text><text x="260" y="95" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">NMI · 硬件故障</text><rect x="370" y="62" width="40" height="18" rx="9" fill="var(--red-deep)"/><text x="390" y="75" font-size="var(--svg-font-size-caption)" fill="var(--surface)" text-anchor="middle">P = 1</text><rect x="200" y="125" width="220" height="52" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow-mid)" stroke-width="1.8"/><text x="260" y="146" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--amber-mid)">中断 B</text><text x="260" y="165" font-size="var(--svg-font-size-caption)" fill="var(--yellow-mid)">时钟定时器</text><rect x="370" y="132" width="40" height="18" rx="9" fill="var(--yellow-mid)"/><text x="390" y="145" font-size="var(--svg-font-size-caption)" fill="var(--surface)" text-anchor="middle">P = 2</text><rect x="200" y="195" width="220" height="52" rx="8" fill="var(--sky-soft)" stroke="var(--blue-deep)" stroke-width="1.8"/><text x="260" y="216" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-deep)">中断 C</text><text x="260" y="235" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)">磁盘 I/O</text><rect x="370" y="202" width="40" height="18" rx="9" fill="var(--blue-deep)"/><text x="390" y="215" font-size="var(--svg-font-size-caption)" fill="var(--surface)" text-anchor="middle">P = 3</text><rect x="200" y="265" width="220" height="52" rx="8" fill="var(--mint-soft)" stroke="var(--green-mid)" stroke-width="1.8"/><text x="260" y="286" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--green-deep)">中断 D</text><text x="260" y="305" font-size="var(--svg-font-size-caption)" fill="var(--green-mid)">键盘 / 鼠标</text><rect x="370" y="272" width="40" height="18" rx="9" fill="var(--green-mid)"/><text x="390" y="285" font-size="var(--svg-font-size-caption)" fill="var(--surface)" text-anchor="middle">P = 4</text><line x1="455" y1="30" x2="455" y2="450" stroke="var(--neutral-light)" stroke-width="1" stroke-dasharray="4,3"/><text x="600" y="36" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--neutral-deep)" text-anchor="middle">中断嵌套示例</text><text x="480" y="56" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">时间轴 →</text><line x1="480" y1="430" x2="740" y2="430" stroke="var(--neutral-mid)" stroke-width="1.5"/><polygon points="740,430 732,426 732,434" fill="var(--neutral-mid)"/><text x="742" y="434" font-size="var(--svg-font-size-caption)" fill="var(--neutral-mid)">t</text><rect x="488" y="390" width="240" height="22" rx="4" fill="var(--sky-soft)" stroke="var(--cyan-mid)" stroke-width="1"/><text x="610" y="405" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)" text-anchor="middle">主程序</text><rect x="548" y="360" width="170" height="22" rx="4" fill="var(--mint-soft)" stroke="var(--green-mid)" stroke-width="1.5"/><text x="633" y="375" font-size="var(--svg-font-size-caption)" fill="var(--green-deep)" text-anchor="middle">D 的中断服务程序</text><rect x="578" y="330" width="110" height="22" rx="4" fill="var(--sky-soft)" stroke="var(--blue-deep)" stroke-width="1.5"/><text x="633" y="345" font-size="var(--svg-font-size-caption)" fill="var(--blue-deep)" text-anchor="middle">C 的中断服务程序</text><rect x="603" y="300" width="60" height="22" rx="4" fill="var(--yellow-soft)" stroke="var(--yellow-mid)" stroke-width="1.5"/><text x="633" y="315" font-size="var(--svg-font-size-caption)" fill="var(--amber-mid)" text-anchor="middle">B 的 ISR</text><line x1="548" y1="390" x2="548" y2="382" stroke="var(--green-mid)" stroke-width="1.5" marker-end="url(#arrowGreen)"/><line x1="578" y1="360" x2="578" y2="352" stroke="var(--blue-deep)" stroke-width="1.5" marker-end="url(#arrowBlue)"/><line x1="603" y1="330" x2="603" y2="322" stroke="var(--yellow-mid)" stroke-width="1.5" marker-end="url(#arrowOrange)"/><line x1="663" y1="300" x2="663" y2="330" stroke="var(--yellow-mid)" stroke-width="1.2" stroke-dasharray="3,2"/><polygon points="663,330 660,323 666,323" fill="var(--yellow-mid)"/><line x1="688" y1="330" x2="688" y2="360" stroke="var(--blue-deep)" stroke-width="1.2" stroke-dasharray="3,2"/><polygon points="688,360 685,353 691,353" fill="var(--blue-deep)"/><line x1="718" y1="360" x2="718" y2="390" stroke="var(--green-mid)" stroke-width="1.2" stroke-dasharray="3,2"/><polygon points="718,390 715,383 721,383" fill="var(--green-mid)"/><defs><marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 6 3 0 6z" fill="var(--green-mid)"/></marker><marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 6 3 0 6z" fill="var(--blue-deep)"/></marker><marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0 6 3 0 6z" fill="var(--yellow-mid)"/></marker></defs><text x="480" y="250" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)" font-weight="var(--svg-font-weight-bold)">说明：</text><line x1="480" y1="265" x2="510" y2="265" stroke="var(--neutral-deep)" stroke-width="1.5"/><polygon points="510,265 505,262 505,268" fill="var(--neutral-deep)"/><text x="515" y="269" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">高优先级中断打断低优先级 ISR</text><line x1="480" y1="282" x2="510" y2="282" stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="3,2"/><polygon points="510,282 505,279 505,285" fill="var(--ink-soft)"/><text x="515" y="286" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">ISR 执行完后返回被中断处</text><rect x="468" y="68" width="270" height="165" rx="8" fill="var(--surface)" stroke="var(--blue-soft)" stroke-width="1.2"/><text x="603" y="90" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)" text-anchor="middle">优先级规则</text><line x1="478" y1="97" x2="728" y2="97" stroke="var(--blue-soft)" stroke-width="1"/><text x="482" y="116" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)">① 同时请求：优先响应高优先级</text><text x="482" y="138" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)">② 执行 ISR 时（IF = 0 时）：高优先级可抢占</text><text x="482" y="160" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)">低优先级不可抢占</text><text x="482" y="182" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)">③ 屏蔽字：决定哪些中断可响应</text><text x="482" y="204" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)">④ NMI：不受屏蔽字控制，</text><text x="482" y="222" font-size="var(--svg-font-size-caption)" fill="var(--neutral-ink)">始终具有最高优先级</text><text x="380" y="465" font-size="var(--svg-font-size-caption)" fill="var(--neutral-mid)" text-anchor="middle">P 值越小 → 优先级越高；嵌套层数取决于系统设计</text></svg>
