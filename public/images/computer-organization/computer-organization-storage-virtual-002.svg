<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><linearGradient id="processGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:var(--violet-mid);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--indigo-deep);stop-opacity:1"/></linearGradient><linearGradient id="virtualGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:var(--lime-mid);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--lime-mid);stop-opacity:1"/></linearGradient><linearGradient id="physicalGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:var(--yellow-mid);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--yellow-mid);stop-opacity:1"/></linearGradient><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--neutral-ink)" points="0 0, 10 3, 0 6"/></marker></defs><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">虚拟内存工作原理</text><g id="process"><rect fill="url(#processGrad)" height="120" rx="10" stroke="var(--blue-deep)" stroke-width="2" width="150" x="50" y="80"/><text fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="125" y="110">进程</text><text fill="var(--surface)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="125" y="135">使用虚拟地址</text><text fill="var(--sky-soft)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="125" y="160">0x0000 - 0xFFFF</text><text fill="var(--sky-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="125" y="180">认为拥有连续独立</text><text fill="var(--sky-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="125" y="195">的内存空间</text></g><g id="virtual-memor