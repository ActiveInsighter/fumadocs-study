<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--neutral-ink)" points="0 0, 10 3, 0 6"/></marker></defs><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30" class="svg-text svg-text-on-light">虚拟内存工作原理</text><g id="process"><rect fill="var(--indigo-deep)" height="120" rx="10" stroke="var(--blue-deep)" stroke-width="2" width="150" x="50" y="80"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="125" y="110" class="svg-text svg-text-on-dark">进程</text><text font-size="var(--svg-font-size-body)" text-anchor="middle" x="125" y="135" class="svg-text svg-text-on-dark">使用虚拟地址</text><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="125" y="160" class="svg-text svg-text-on-light">0x0000 - 0xFFFF</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="125" y="180" class="svg-text svg-text-on-light">认为拥有连续独立</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="125" y="195" class="svg-text svg-text-on-light">的内存空间</text></g><g id="virtual-memory"><rect fill="var(--lime-deep)" height="400" rx="10" stroke="var(--lime-mid)" stroke-width="2" width="150" x="325" y="80"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="110" class="svg-text svg-text-on-dark">虚拟内存</text><rect fill="var(--lime-mid)" height="40" stroke="var(--lime-mid)" stroke-width="1" width="120" x="340" y="130"/><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="155" class="svg-text svg-text-theme">页面 0</text><rect fill="var(--lime-mid)" height="40" stroke="var(--lime-mid)" stroke-width="1" width="120" x="340" y="180"/><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="205" class="svg-text svg-text-theme">页面 1</text><rect fill="var(--lime-mid)" height="40" stroke="var(--lime-mid)" stroke-width="1" width="120" x="340" y="230"/><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="255" class="svg-text svg-text-theme">页面 2</text><rect fill="var(--lime-mid)" height="40" stroke="var(--lime-mid)" stroke-width="1" width="120" x="340" y="280"/><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="305" class="svg-text svg-text-theme">页面 3</text><rect fill="var(--lime-mid)" height="40" stroke="var(--lime-mid)" stroke-width="1" width="120" x="340" y="330"/><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="355" class="svg-text svg-text-theme">页面 4</text><text font-size="var(--svg-font-size-title)" text-anchor="middle" x="400" y="395" class="svg-text svg-text-on-dark">...</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="400" y="460" class="svg-text svg-text-on-dark">连续的虚拟地址空间</text></g><g id="os-mmu"><text font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="525" class="svg-text svg-text-on-dark">操作系统</text><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="543" class="svg-text svg-text-on-dark">地址转换 (MMU)</text></g><g id="physical-memory"><rect fill="var(--yellow-deep)" height="400" rx="10" stroke="var(--amber-mid)" stroke-width="2" width="150" x="600" y="80"/><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="675" y="110" class="svg-text svg-text-on-dark">物理内存</text><rect fill="var(--yellow-mid)" height="35" stroke="var(--yellow-mid)" stroke-width="1" width="120" x="615" y="140"/><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="675" y="162" class="svg-text svg-t