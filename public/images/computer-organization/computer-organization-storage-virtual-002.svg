<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="processGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#4A90E2;stop-opacity:1"/><stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"/></linearGradient><linearGradient id="virtualGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#7ED321;stop-opacity:1"/><stop offset="100%" style="stop-color:#5FA319;stop-opacity:1"/></linearGradient><linearGradient id="physicalGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#F5A623;stop-opacity:1"/><stop offset="100%" style="stop-color:#D68910;stop-opacity:1"/></linearGradient><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#333" points="0 0, 10 3, 0 6"/></marker></defs><text fill="#333" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">虚拟内存工作原理</text><g id="process"><rect fill="url(#processGrad)" height="120" rx="10" stroke="#2E5C8A" stroke-width="2" width="150" x="50" y="80"/><text fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" x="125" y="110">进程</text><text fill="#fff" font-size="14" text-anchor="middle" x="125" y="135">使用虚拟地址</text><text fill="#E8F4FF" font-size="12" text-anchor="middle" x="125" y="160">0x0000 - 0xFFFF</text><text fill="#E8F4FF" font-size="11" text-anchor="middle" x="125" y="180">认为拥有连续独立</text><text fill="#E8F4FF" font-size="11" text-anchor="middle" x="125" y="195">的内存空间</text></g><g id="virtual-memory"><rect fill="url(#virtualGrad)" height="400" rx="10" stroke="#4A8A13" stroke-width="2" width="150" x="325" y="80"/><text fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="110">虚拟内存</text><rect fill="#A8E063" height="40" stroke="#5FA319" stroke-width="1" width="120" x="340" y="130"/><text font-size="12" text-anchor="middle" x="400" y="155">页面 0</text><rect fill="#A8E063" height="40" stroke="#5FA319" stroke-width="1" width="120" x="340" y="180"/><text font-size="12" text-anchor="middle" x="400" y="205">页面 1</text><rect fill="#A8E063" height="40" stroke="#5FA319" stroke-width="1" width="120" x="340" y="230"/><text font-size="12" text-anchor="middle" x="400" y="255">页面 2</text><rect fill="#A8E063" height="40" stroke="#5FA319" stroke-width="1" width="120" x="340" y="280"/><text font-size="12" text-anchor="middle" x="400" y="305">页面 3</text><rect fill="#C8F084" height="40" stroke="#5FA319" stroke-width="1" width="120" x="340" y="330"/><text font-size="12" text-anchor="middle" x="400" y="355">页面 4</text><text fill="#fff" font-size="20" text-anchor="middle" x="400" y="395">...</text><text fill="#fff" font-size="11" text-anchor="middle" x="400" y="460">连续的虚拟地址空间</text></g><g id="os-mmu"><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="525">操作系统</text><text fill="#fff" font-size="12" text-anchor="middle" x="400" y="543">地址转换 (MMU)</text></g><g id="physical-memory"><rect fill="url(#physicalGrad)" height="400" rx="10" stroke="#B8780D" stroke-width="2" width="150" x="600" y="80"/><text fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" x="675" y="110">物理内存</text><rect fill="#FFD77A" height="35" stroke="#D68910" stroke-width="1" width="120" x="615" y="140"/><text font-size="11" text-anchor="middle" x="675" y="162">帧 5 → 页面1</text><rect fill="#E0E0E0" height="35" stroke="#999" stroke-width="1" width="120" x="615" y="190"/><text fill="#666" font-size="11" text-anchor="middle" x="675" y="212">空闲</text><rect fill="#FFD77A" height="35" stroke="#D68910" stroke-width="1" width="120" x="615" y="240"/><text font-size="11" text-anchor="middle" x="675" y="262">帧 2 → 页面0</text><rect fill="#FFD77A" height="35" stroke="#D68910" stroke-width="1" width="120" x="615" y="290"/><text font-size="11" text-anchor="middle" x="675" y="312">帧 8 → 页面3</text><rect fill="#E0E0E0" height="35" stroke="#999" stroke-width="1" width="120" x="615" y="340"/><text fill="#666" font-size="11" text-anchor="middle" x="675" y="362">空闲</text><rect fill="#FFD77A" height="35" stroke="#D68910" stroke-width="1" width="120" x="615" y="390"/><text font-size="11" text-anchor="middle" x="675" y="412">帧 11 → 页面2</text><text fill="#fff" font-size="11" text-anchor="middle" x="675" y="450">分散的物理地址</text></g><path d="M2e2 140H320" fill="none" marker-end="url(#arrowhead)" stroke="#333" stroke-width="2"/><text fill="#333" font-size="11" text-anchor="middle" x="260" y="130">访问虚拟地址</text><path d="M4e2 480v10" fill="none" marker-end="url(#arrowhead)" stroke="#333" stroke-width="2"/><path d="M5e2 530l95-250" fill="none" marker-end="url(#arrowhead)" stroke="#333" stroke-width="2"/><text fill="#333" font-size="11" text-anchor="middle" x="545" y="400">转换后的</text><text fill="#333" font-size="11" text-anchor="middle" x="545" y="415">物理地址</text><path d="M460 150 610 260" fill="none" opacity=".7" stroke="#E74C3C" stroke-dasharray="4,4" stroke-width="1.5"/><path d="M460 2e2l150-40" fill="none" opacity=".7" stroke="#E74C3C" stroke-dasharray="4,4" stroke-width="1.5"/><path d="M460 250 610 410" fill="none" opacity=".7" stroke="#E74C3C" stroke-dasharray="4,4" stroke-width="1.5"/><g id="legend"><rect fill="#F8F8F8" height="60" rx="5" stroke="#CCC" stroke-width="1" width="200" x="50" y="520"/><text fill="#333" font-size="12" font-weight="bold" x="60" y="540">关键概念：</text><text fill="#555" font-size="10" x="60" y="558">• 虚拟地址：连续、独立</text><text fill="#555" font-size="10" x="60" y="573">• 物理地址：可能分散</text></g></svg>
