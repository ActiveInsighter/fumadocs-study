<svg viewBox="0 0 880 600" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--coral-ink)"/></marker></defs><rect width="880" height="600" fill="var(--orange-soft)"/><text x="440" y="36" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">Flash 存储器 · Floating-Gate 浮栅晶体管</text><text x="440" y="58" text-anchor="middle" font-size="var(--svg-font-size-label)" class="svg-text svg-text-on-light">非易失性 · 电擦写 · 用于 SSD / U盘 / 手机存储</text><g transform="translate(50,90)"><rect x="0" y="0" width="380" height="320" rx="12" fill="var(--surface)" stroke="var(--amber-mid)" filter="url(#shadow)"/><text x="190" y="26" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">浮栅晶体管 (Floating Gate MOSFET)</text><g transform="translate(40,42)"><line x1="150" y1="20" x2="150" y2="44" stroke="var(--sky-ink)" stroke-width="2"/><circle cx="150" cy="18" r="3" fill="var(--sky-ink)"/><text x="158" y="22" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">CG</text><rect x="80" y="44" width="140" height="22" rx="3" fill="var(--yellow-deep)" stroke="var(--coral-deep)"/><text x="150" y="59" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">Control Gate · 控制栅</text><rect x="80" y="70" width="140" height="10" fill="var(--sky-light)" stroke="var(--sky-mid)"/><rect x="80" y="82" width="140" height="34" rx="3" fill="var(--yellow-deep)" stroke="var(--orange-mid)"/><text x="150" y="95" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">Floating Gate · 浮栅</text><g><circle cx="105" cy="108" r="4" fill="var(--yellow-deep)" stroke="var(--coral-deep)"/><text x="105" y="111" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">e⁻</text><circle cx="135" cy="108" r="4" fill="var(--yellow-deep)" stroke="var(--coral-deep)"/><text x="135" y="111" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">e⁻</text><circle cx="165" cy="108" r="4" fill="var(--yellow-deep)" stroke="var(--coral-deep)"/><text x="165" y="111" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">e⁻</text><circle cx="195" cy="108" r="4" fill="var(--yellow-deep)" stroke="var(--coral-deep)"/><text x="195" y="111" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">e⁻</text></g><rect x="80" y="120" width="140" height="12" fill="var(--sky-light)" stroke="var(--sky-mid)"/><text x="222" y="130" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">隧穿氧化层</text><rect x="10" y="132" width="60" height="22" fill="var(--cyan-light)" stroke="var(--blue-mid)"/><text x="40" y="148" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">Source</text><text x="40" y="184" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">源极 (S)</text><rect x="230" y="132" width="60" height="22" fill="var(--cyan-light)" stroke="var(--blue-mid)"/><text x="260" y="148" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">Drain</text><text x="260" y="184" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">漏极 (D)</text><rect x="0" y="154" width="300" height="20" fill="var(--neutral-soft)" stroke="var(--cyan-mid)"/><text x="150" y="168" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">P-Substrate (硅衬底)</text><path d="M150 147q0-15 0-27" stroke="var(--coral-deep)" stroke-width="1.5" stroke-dasharray="3 2" fill="none" marker-end="url(#arr)"/><text x="190" y="142" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">隧穿</text></g><g transform="translate(20,256)"><rect x="0" y="0" width="170" height="48" rx="6" fill="var(--yellow-soft)" stroke="var(--orange-mid)"/><circle cx="22" cy="24" r="8" fill="var(--orange-mid)"/><text x="22" y="28" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">e⁻</text><text x="42" y="20" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">有电荷</text><text x="42" y="36" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">表示 逻辑 0</text><rect x="190" y="0" width="170" height="48" rx="6" fill="var(--green-soft)" stroke="var(--lime-deep)"/><circle cx="212" cy="24" r="8" fill="var(--surface)" stroke="var(--neutral-mid)"/><text x="232" y="20" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">无电荷</text><text x="232" y="36" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">表示 逻辑 1</text></g></g><g transform="translate(460,90)"><rect x="0" y="0" width="370" height="135" rx="10" fill="var(--yellow-deep)" stroke="var(--amber-mid)" filter="url(#shadow)"/><text x="20" y="26" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">三种基本操作</text><g transform="translate(20,42)"><rect x="0" y="0" width="100" height="78" rx="8" fill="var(--sky-soft)" stroke="var(--violet-mid)"/><text x="50" y="20" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">读 Read</text><text x="50" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">检测阈值电压</text><text x="50" y="56" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">速度快</text><text x="50" y="70" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">⚡ 单元级</text></g><g transform="translate(135,42)"><rect x="0" y="0" width="100" height="78" rx="8" fill="var(--yellow-soft)" stroke="var(--orange-mid)"/><text x="50" y="20" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">写 Program</text><text x="50" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">注入电子到浮栅</text><text x="50" y="56" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">1 → 0</text><text x="50" y="70" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">页级写入</text></g><g transform="translate(250,42)"><rect x="0" y="0" width="100" height="78" rx="8" fill="var(--rose-soft)" stroke="var(--red-deep)"/><text x="50" y="20" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">擦 Erase</text><text x="50" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">抽走电子，全置 1</text><text x="50" y="56" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">0 → 1</text><text x="50" y="70" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">块级擦除</text></g></g><g transform="translate(460,240)"><rect x="0" y="0" width="370" height="170" rx="10" fill="var(--surface)" stroke="var(--amber-mid)" filter="url(#shadow)"/><text x="20" y="26" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">两大类型</text><g transform="translate(20,40)"><rect x="0" y="0" width="160" height="115" rx="8" fill="var(--violet-deep)" stroke="var(--purple-deep)"/><text x="80" y="24" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">NAND Flash</text><text x="80" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">串联结构 · 密度高</text><text x="80" y="68" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">顺序读快 · 容量大</text><text x="80" y="100" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">SSD · U盘 · SD卡</text><rect x="170" y="0" width="160" height="115" rx="8" fill="var(--cyan-deep)" stroke="var(--mint-mid)"/><text x="250" y="24" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">NOR Flash</text><text x="250" y="50" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">并联结构 · 可随机读</text><text x="250" y="68" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">支持就地执行 (XIP)</text><text x="250" y="100" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">BIOS · 嵌入式固件</text></g></g><g transform="translate(50,435)"><rect x="0" y="0" width="780" height="150" rx="10" fill="var(--surface)" stroke="var(--amber-mid)" filter="url(#shadow)"/><text x="16" y="26" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">速度 / 性能定位</text><g transform="translate(40,46)"><text x="-20" y="14" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">RAM</text><rect x="30" y="2" width="540" height="16" rx="4" fill="var(--indigo-mid)"/><text x="578" y="14" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">最快</text><text x="-20" y="40" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">Flash</text><rect x="30" y="28" width="280" height="16" rx="4" fill="var(--yellow-deep)"/><text x="318" y="40" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">中等（比 HDD 快得多）</text><text x="-20" y="66" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">HDD</text><rect x="30" y="54" width="100" height="16" rx="4" fill="var(--ink-soft)"/><text x="138" y="66" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">最慢</text></g><g transform="translate(40,138)"><text x="0" y="0" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light"><tspan font-weight="var(--svg-font-weight-bold)">优势：</tspan>非易失 · 无机械结构 · 抗震 · 低功耗 · 体积小 · 速度远超机械硬盘</text></g></g></svg>
