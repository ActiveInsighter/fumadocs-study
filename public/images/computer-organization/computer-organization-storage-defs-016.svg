<svg viewBox="0 0 880 600" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8f1"/><stop offset="100%" stop-color="#ffe7d1"/></linearGradient><linearGradient id="gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb74d"/><stop offset="100%" stop-color="#f57c00"/></linearGradient><linearGradient id="float" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="100%" stop-color="#fbc02d"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="100%" stop-color="#fff3e0"/></linearGradient><linearGradient id="nand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede7f6"/><stop offset="100%" stop-color="#d1c4e9"/></linearGradient><linearGradient id="nor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0f2f1"/><stop offset="100%" stop-color="#b2dfdb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5d4037"/></marker><radialGradient id="elec" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff59d"/><stop offset="100%" stop-color="#f9a825"/></radialGradient></defs><rect width="880" height="600" fill="url(#bg)"/><text x="440" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#bf360c">Flash 存储器 · Floating-Gate 浮栅晶体管</text><text x="440" y="58" text-anchor="middle" font-size="12" fill="#6d4c41">非易失性 · 电擦写 · 用于 SSD / U盘 / 手机存储</text><g transform="translate(50,90)"><rect x="0" y="0" width="380" height="320" rx="12" fill="#fff" stroke="#ffcc80" filter="url(#shadow)"/><text x="190" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#bf360c">浮栅晶体管 (Floating Gate MOSFET)</text><g transform="translate(40,42)"><line x1="150" y1="20" x2="150" y2="44" stroke="#37474f" stroke-width="2"/><circle cx="150" cy="18" r="3" fill="#37474f"/><text x="158" y="22" font-size="10" fill="#37474f">CG</text><rect x="80" y="44" width="140" height="22" rx="3" fill="url(#gate)" stroke="#e65100"/><text x="150" y="59" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Control Gate · 控制栅</text><rect x="80" y="70" width="140" height="10" fill="#b3e5fc" stroke="#4fc3f7"/><rect x="80" y="82" width="140" height="34" rx="3" fill="url(#float)" stroke="#f57f17"/><text x="150" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#5d4037">Floating Gate · 浮栅</text><g><circle cx="105" cy="108" r="4" fill="url(#elec)" stroke="#e65100"/><text x="105" y="111" text-anchor="middle" font-size="7" font-weight="700" fill="#5d4037">e⁻</text><circle cx="135" cy="108" r="4" fill="url(#elec)" stroke="#e65100"/><text x="135" y="111" text-anchor="middle" font-size="7" font-weight="700" fill="#5d4037">e⁻</text><circle cx="165" cy="108" r="4" fill="url(#elec)" stroke="#e65100"/><text x="165" y="111" text-anchor="middle" font-size="7" font-weight="700" fill="#5d4037">e⁻</text><circle cx="195" cy="108" r="4" fill="url(#elec)" stroke="#e65100"/><text x="195" y="111" text-anchor="middle" font-size="7" font-weight="700" fill="#5d4037">e⁻</text></g><rect x="80" y="120" width="140" height="12" fill="#b3e5fc" stroke="#4fc3f7"/><text x="222" y="130" font-size="9" fill="#01579b">隧穿氧化层</text><rect x="10" y="132" width="60" height="22" fill="#cfd8dc" stroke="#90a4ae"/><text x="40" y="148" text-anchor="middle" font-size="10" fill="#263238" font-weight="700">Source</text><text x="40" y="184" text-anchor="middle" font-size="10" fill="#37474f">源极 (S)</text><rect x="230" y="132" width="60" height="22" fill="#cfd8dc" stroke="#90a4ae"/><text x="260" y="148" text-anchor="middle" font-size="10" fill="#263238" font-weight="700">Drain</text><text x="260" y="184" text-anchor="middle" font-size="10" fill="#37474f">漏极 (D)</text><rect x="0" y="154" width="300" height="20" fill="#eceff1" stroke="#b0bec5"/><text x="150" y="168" text-anchor="middle" font-size="10" fill="#37474f" font-weight="600">P-Substrate (硅衬底)</text><path d="M150 147q0-15 0-27" stroke="#d84315" stroke-width="1.5" stroke-dasharray="3 2" fill="none" marker-end="url(#arr)"/><text x="190" y="142" font-size="9" fill="#d84315">隧穿</text></g><g transform="translate(20,256)"><rect x="0" y="0" width="170" height="48" rx="6" fill="#fff3e0" stroke="#ef6c00"/><circle cx="22" cy="24" r="8" fill="#f57c00"/><text x="22" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">e⁻</text><text x="42" y="20" font-size="11" font-weight="700" fill="#bf360c">有电荷</text><text x="42" y="36" font-size="10" fill="#6d4c41">表示 逻辑 0</text><rect x="190" y="0" width="170" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><circle cx="212" cy="24" r="8" fill="#fff" stroke="#9e9e9e"/><text x="232" y="20" font-size="11" font-weight="700" fill="#1b5e20">无电荷</text><text x="232" y="36" font-size="10" fill="#37474f">表示 逻辑 1</text></g></g><g transform="translate(460,90)"><rect x="0" y="0" width="370" height="135" rx="10" fill="url(#card)" stroke="#ffcc80" filter="url(#shadow)"/><text x="20" y="26" font-size="14" font-weight="700" fill="#bf360c">三种基本操作</text><g transform="translate(20,42)"><rect x="0" y="0" width="100" height="78" rx="8" fill="#e3f2fd" stroke="#1e88e5"/><text x="50" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">读 Read</text><text x="50" y="40" text-anchor="middle" font-size="10" fill="#37474f">检测阈值电压</text><text x="50" y="56" text-anchor="middle" font-size="10" fill="#37474f">速度快</text><text x="50" y="70" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="700">⚡ 单元级</text></g><g transform="translate(135,42)"><rect x="0" y="0" width="100" height="78" rx="8" fill="#fff3e0" stroke="#ef6c00"/><text x="50" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#bf360c">写 Program</text><text x="50" y="40" text-anchor="middle" font-size="10" fill="#37474f">注入电子到浮栅</text><text x="50" y="56" text-anchor="middle" font-size="10" fill="#37474f">1 → 0</text><text x="50" y="70" text-anchor="middle" font-size="10" fill="#37474f" font-weight="700">页级写入</text></g><g transform="translate(250,42)"><rect x="0" y="0" width="100" height="78" rx="8" fill="#ffebee" stroke="#c62828"/><text x="50" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#b71c1c">擦 Erase</text><text x="50" y="40" text-anchor="middle" font-size="10" fill="#37474f">抽走电子，全置 1</text><text x="50" y="56" text-anchor="middle" font-size="10" fill="#37474f">0 → 1</text><text x="50" y="70" text-anchor="middle" font-size="10" fill="#c62828" font-weight="700">块级擦除</text></g></g><g transform="translate(460,240)"><rect x="0" y="0" width="370" height="170" rx="10" fill="#fff" stroke="#ffcc80" filter="url(#shadow)"/><text x="20" y="26" font-size="14" font-weight="700" fill="#bf360c">两大类型</text><g transform="translate(20,40)"><rect x="0" y="0" width="160" height="115" rx="8" fill="url(#nand)" stroke="#7e57c2"/><text x="80" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#4527a0">NAND Flash</text><text x="80" y="50" text-anchor="middle" font-size="10" fill="#5e35b1">串联结构 · 密度高</text><text x="80" y="68" text-anchor="middle" font-size="10" fill="#5e35b1">顺序读快 · 容量大</text><text x="80" y="100" text-anchor="middle" font-size="10" fill="#4527a0" font-weight="700">SSD · U盘 · SD卡</text><rect x="170" y="0" width="160" height="115" rx="8" fill="url(#nor)" stroke="#26a69a"/><text x="250" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#00695c">NOR Flash</text><text x="250" y="50" text-anchor="middle" font-size="10" fill="#00796b">并联结构 · 可随机读</text><text x="250" y="68" text-anchor="middle" font-size="10" fill="#00796b">支持就地执行 (XIP)</text><text x="250" y="100" text-anchor="middle" font-size="10" fill="#00695c" font-weight="700">BIOS · 嵌入式固件</text></g></g><g transform="translate(50,435)"><rect x="0" y="0" width="780" height="150" rx="10" fill="#fff" stroke="#ffcc80" filter="url(#shadow)"/><text x="16" y="26" font-size="14" font-weight="700" fill="#bf360c">速度 / 性能定位</text><g transform="translate(40,46)"><text x="-20" y="14" font-size="11" fill="#37474f">RAM</text><rect x="30" y="2" width="540" height="16" rx="4" fill="#42a5f5"/><text x="578" y="14" font-size="10" fill="#1565c0" font-weight="700">最快</text><text x="-20" y="40" font-size="11" fill="#37474f">Flash</text><rect x="30" y="28" width="280" height="16" rx="4" fill="url(#gate)"/><text x="318" y="40" font-size="10" fill="#bf360c" font-weight="700">中等（比 HDD 快得多）</text><text x="-20" y="66" font-size="11" fill="#37474f">HDD</text><rect x="30" y="54" width="100" height="16" rx="4" fill="#a1887f"/><text x="138" y="66" font-size="10" fill="#5d4037" font-weight="700">最慢</text></g><g transform="translate(40,138)"><text x="0" y="0" font-size="11" fill="#6d4c41"><tspan font-weight="700" fill="#bf360c">优势：</tspan>非易失 · 无机械结构 · 抗震 · 低功耗 · 体积小 · 速度远超机械硬盘</text></g></g></svg>
