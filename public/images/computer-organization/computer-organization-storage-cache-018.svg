<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter height="200%" id="shadow" width="200%" x="-50%" y="-50%"><feDropShadow dx="2" dy="2" flood-opacity=".3" stdDeviation="3"/></filter></defs><text fill="var(--neutral-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="35">Cache 写策略组合</text><g filter="url(#shadow)"><rect fill="var(--sky-soft)" height="480" rx="15" stroke="var(--violet-mid)" stroke-width="3" width="320" x="50" y="70"/><rect fill="var(--indigo-deep)" height="50" rx="15" width="320" x="50" y="70"/><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="210" y="102">组合一：倾向主存</text><rect fill="var(--surface)" height="60" rx="8" stroke="var(--violet-mid)" stroke-width="2" width="280" x="70" y="145"/><text fill="var(--violet-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="210" y="165">直写法 (Write Through)</text><text fill="var(--neutral-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="210" y="188">命中时：同步写 Cache + 主存</text><circle cx="210" cy="235" fill="var(--violet-mid)" r="20"/><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="210" y="243">+</text><rect fill="var(--surface)" height="60" rx="8" stroke="var(--violet-mid)" stroke-width="2" width="280" x="70" y="265"/><text fill="var(--violet-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="210" y="285">非写分配法 (Not Write Allocate)</text><text fill="var(--neutral-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="210" y="308">未命中时：直接写主存</text><rect fill="var(--sky-soft)" height="180" rx="8" stroke="var(--violet-mid)" stroke-dasharray="5,5" stroke-width="1" width="280" x="70" y="350"/><text fill="var(--violet-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="210" y="375">特点与适用场景</text><text fill="var(--neutral-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="85" y="400">• 都倾向于操作主存</text><text fill="var(--neutral-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="85" y="425">• 保持数据一致性简单</text><text fill="var(--neutral-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="85" y="450">• 写操作延迟较高</text><text fill="var(--violet-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="85" y="480">✓ 写操作不频繁的场景</text><text fill="var(--violet-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="85" y="505">✓ 数据局部性较差的场景</text></g><g filter="url(#shadow)"><rect fill="var(--paper)" height="480" rx="15" stroke="var(--red-deep)" stroke-width="3" width="320" x="430" y="70"/><rect fill="var(--red-deep)" height="50" rx="15" width="320" x="430" y="70"/><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="590" y="102">组合二：倾向 Cache</text><rect fill="var(--surface)" height="60" rx="8" stroke="var(--red-deep)" stroke-width="2" width="280" x="450" y="145"/><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="590" y="165">回写法 (Write Back)</text><text fill="var(--neutral-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="590" y="188">命中时：仅写 Cache（延迟回写）</text><circle cx="590" cy="235" fill="var(--red-deep)" r="20"/><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="590" y="243">+</text><rect fill="var(--surface)" height="60" rx="8" stroke="var(--red-deep)" stroke-width="2" width="280" x="450" y="265"/><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="590" y="285">写分配法 (Write Allocate)</text><text fill="var(--neutral-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="590" y="308">未命中时：加载到 Cache 再写</text><rect fill="var(--rose-soft)" height="180" rx="8" stroke="var(--red-deep)" stroke-dasharray="5,5" stroke-width="1" width="280" x="450" y="350"/><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="590" y="375">特点与适用场景</text><text fill="var(--neutral-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="465" y="400">• 都倾向于操作 Cache</text><text fill="var(--neutral-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="465" y="425">• 减少主存访问次数</text><text fill="var(--neutral-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="465" y="450">• 写操作延迟较低</text><text fill="var(--rose-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="465" y="480">✓ 写操作频繁的场景</text><text fill="var(--rose-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="465" y="505">✓ 数据局部性较好的场景</text></g><rect fill="var(--yellow-soft)" height="30" rx="5" stroke="var(--yellow-mid)" stroke-width="2" width="600" x="100" y="560"/><text fill="var(--orange-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="580">💡 记忆要点：直写 + 非分配 → 主存优先 | 回写 + 写分配 → Cache 优先</text></svg>
