<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad1" x1="0" x2="100%" y1="0" y2="0"><stop offset="0" style="stop-color:#4A90E2;stop-opacity:1"/><stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"/></linearGradient><linearGradient id="grad2" x1="0" x2="100%" y1="0" y2="0"><stop offset="0" style="stop-color:#E85D75;stop-opacity:1"/><stop offset="100%" style="stop-color:#D63447;stop-opacity:1"/></linearGradient><filter height="200%" id="shadow" width="200%" x="-50%" y="-50%"><feDropShadow dx="2" dy="2" flood-opacity=".3" stdDeviation="3"/></filter></defs><text fill="#333" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="35">Cache 写策略组合</text><g filter="url(#shadow)"><rect fill="#F0F8FF" height="480" rx="15" stroke="#4A90E2" stroke-width="3" width="320" x="50" y="70"/><rect fill="url(#grad1)" height="50" rx="15" width="320" x="50" y="70"/><text fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="210" y="102">组合一：倾向主存</text><rect fill="#fff" height="60" rx="8" stroke="#4A90E2" stroke-width="2" width="280" x="70" y="145"/><text fill="#4A90E2" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="210" y="165">直写法 (Write Through)</text><text fill="#666" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" x="210" y="188">命中时：同步写 Cache + 主存</text><circle cx="210" cy="235" fill="#4A90E2" r="20"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="210" y="243">+</text><rect fill="#fff" height="60" rx="8" stroke="#4A90E2" stroke-width="2" width="280" x="70" y="265"/><text fill="#4A90E2" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="210" y="285">非写分配法 (Not Write Allocate)</text><text fill="#666" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" x="210" y="308">未命中时：直接写主存</text><rect fill="#E8F4FD" height="180" rx="8" stroke="#4A90E2" stroke-dasharray="5,5" stroke-width="1" width="280" x="70" y="350"/><text fill="#4A90E2" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="210" y="375">特点与适用场景</text><text fill="#444" font-family="Arial, sans-serif" font-size="13" x="85" y="400">• 都倾向于操作主存</text><text fill="#444" font-family="Arial, sans-serif" font-size="13" x="85" y="425">• 保持数据一致性简单</text><text fill="#444" font-family="Arial, sans-serif" font-size="13" x="85" y="450">• 写操作延迟较高</text><text fill="#06C" font-family="Arial, sans-serif" font-size="13" x="85" y="480">✓ 写操作不频繁的场景</text><text fill="#06C" font-family="Arial, sans-serif" font-size="13" x="85" y="505">✓ 数据局部性较差的场景</text></g><g filter="url(#shadow)"><rect fill="#FFF5F5" height="480" rx="15" stroke="#E85D75" stroke-width="3" width="320" x="430" y="70"/><rect fill="url(#grad2)" height="50" rx="15" width="320" x="430" y="70"/><text fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="590" y="102">组合二：倾向 Cache</text><rect fill="#fff" height="60" rx="8" stroke="#E85D75" stroke-width="2" width="280" x="450" y="145"/><text fill="#E85D75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="590" y="165">回写法 (Write Back)</text><text fill="#666" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" x="590" y="188">命中时：仅写 Cache（延迟回写）</text><circle cx="590" cy="235" fill="#E85D75" r="20"/><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="590" y="243">+</text><rect fill="#fff" height="60" rx="8" stroke="#E85D75" stroke-width="2" width="280" x="450" y="265"/><text fill="#E85D75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="590" y="285">写分配法 (Write Allocate)</text><text fill="#666" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" x="590" y="308">未命中时：加载到 Cache 再写</text><rect fill="#FFEBEE" height="180" rx="8" stroke="#E85D75" stroke-dasharray="5,5" stroke-width="1" width="280" x="450" y="350"/><text fill="#E85D75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="590" y="375">特点与适用场景</text><text fill="#444" font-family="Arial, sans-serif" font-size="13" x="465" y="400">• 都倾向于操作 Cache</text><text fill="#444" font-family="Arial, sans-serif" font-size="13" x="465" y="425">• 减少主存访问次数</text><text fill="#444" font-family="Arial, sans-serif" font-size="13" x="465" y="450">• 写操作延迟较低</text><text fill="#C06" font-family="Arial, sans-serif" font-size="13" x="465" y="480">✓ 写操作频繁的场景</text><text fill="#C06" font-family="Arial, sans-serif" font-size="13" x="465" y="505">✓ 数据局部性较好的场景</text></g><rect fill="#FFF9E6" height="30" rx="5" stroke="#FFA726" stroke-width="2" width="600" x="100" y="560"/><text fill="#F57C00" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="580">💡 记忆要点：直写 + 非分配 → 主存优先 | 回写 + 写分配 → Cache 优先</text></svg>
