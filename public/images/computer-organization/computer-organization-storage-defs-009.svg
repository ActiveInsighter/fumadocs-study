<svg viewBox="0 0 880 360" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><style>text{fill:var(--ink)}.h{font-weight: var(--svg-font-weight-bold)}.axis{stroke:var(--neutral-deep);stroke-width:1.2;fill:none;marker-end:url(#a)}.tick{stroke:var(--ink-soft);stroke-width:.8}.access{fill:var(--sky-light);stroke:var(--violet-mid)}.refresh{fill:var(--red-mid);stroke:var(--red-deep)}.wait{fill:var(--neutral-light);stroke:var(--neutral-mid)}.lbl{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--neutral-deep)"/></marker></defs><text x="440" y="22" text-anchor="middle" font-size="var(--svg-font-size-title)" class="h">DRAM 三种刷新方式 · 时间轴对比</text><g transform="translate(540,30)"><rect class="access" x="0" y="20" width="18" height="14"/><text x="22" y="32">CPU 访问</text><rect class="refresh" x="100" y="20" width="18" height="14"/><text x="122" y="32">刷新操作</text><rect class="wait" x="200" y="20" width="18" height="14"/><text x="222" y="32">CPU 等待 (无法访问)</text></g><g transform="translate(0,70)"><text x="20" y="14" class="h">① 集中刷新</text><text x="20" y="30" class="lbl">所有行集中在死区刷新，CPU 长时间等待</text><line class="axis" x1="120" y1="62" x2="850" y2="62"/><rect class="access" x="130" y="50" width="40" height="22"/><rect class="access" x="175" y="50" width="40" height="22"/><rect class="access" x="220" y="50" width="40" height="22"/><rect class="access" x="265" y="50" width="40" height="22"/><rect class="access" x="310" y="50" width="40" height="22"/><rect class="access" x="355" y="50" width="40" height="22"/><rect class="refresh" x="400" y="44" width="260" height="34"/><text x="530" y="66" text-anchor="middle" fill="var(--surface)" class="h">集中刷新 (CPU 死区)</text><rect class="access" x="665" y="50" width="40" height="22"/><rect class="access" x="710" y="50" width="40" height="22"/><rect class="access" x="755" y="50" width="40" height="22"/></g><g transform="translate(0,160)"><text x="20" y="14" class="h">② 分散刷新</text><text x="20" y="30" class="lbl">每个存取周期 = 访问 + 一次刷新，无死区但周期翻倍</text><line class="axis" x1="120" y1="62" x2="850" y2="62"/><g><rect class="access" x="130" y="50" width="30" height="22"/><rect class="refresh" x="160" y="50" width="30" height="22"/><rect class="access" x="200" y="50" width="30" height="22"/><rect class="refresh" x="230" y="50" width="30" height="22"/><rect class="access" x="270" y="50" width="30" height="22"/><rect class="refresh" x="300" y="50" width="30" height="22"/><rect class="access" x="340" y="50" width="30" height="22"/><rect class="refresh" x="370" y="50" width="30" height="22"/><rect class="access" x="410" y="50" width="30" height="22"/><rect class="refresh" x="440" y="50" width="30" height="22"/><rect class="access" x="480" y="50" width="30" height="22"/><rect class="refresh" x="510" y="50" width="30" height="22"/><rect class="access" x="550" y="50" width="30" height="22"/><rect class="refresh" x="580" y="50" width="30" height="22"/><rect class="access" x="620" y="50" width="30" height="22"/><rect class="refresh" x="650" y="50" width="30" height="22"/><rect class="access" x="690" y="50" width="30" height="22"/><rect class="refresh" x="720" y="50" width="30" height="22"/><rect class="access" x="760" y="50" width="30" height="22"/><rect class="refresh" x="790" y="50" width="30" height="22"/></g></g><g transform="translate(0,250)"><text x="20" y="14" class="h">③ 异步刷新</text><text x="20" y="30" class="lbl">每 (T_ref / N行) 时间触发一次单行刷新，CPU 等待窗口最小</text><line class="axis" x1="120" y1="62" x2="850" y2="62"/><rect class="access" x="130" y="50" width="50" height="22"/><rect class="access" x="185" y="50" width="50" height="22"/><rect class="refresh" x="240" y="50" width="14" height="22"/><rect class="access" x="258" y="50" width="60" height="22"/><rect class="access" x="322" y="50" width="60" height="22"/><rect class="refresh" x="388" y="50" width="14" height="22"/><rect class="access" x="406" y="50" width="60" height="22"/><rect class="access" x="470" y="50" width="60" height="22"/><rect class="refresh" x="536" y="50" width="14" height="22"/><rect class="access" x="554" y="50" width="60" height="22"/><rect class="access" x="618" y="50" width="60" height="22"/><rect class="refresh" x="684" y="50" width="14" height="22"/><rect class="access" x="702" y="50" width="60" height="22"/><rect class="access" x="766" y="50" width="60" height="22"/><line x1="247" y1="77" x2="247" y2="90" stroke="var(--red-deep)"/><text x="247" y="102" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">单行刷新</text></g><text x="855" y="340" text-anchor="end" class="lbl">时间 →</text></svg>
