<svg viewBox="0 0 900 520" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sramGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf2fd"/></linearGradient><linearGradient id="dramGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf5"/><stop offset="1" stop-color="#fdf0e4"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#666"/></marker></defs><rect x="20" y="20" width="420" height="480" rx="14" fill="url(#sramGrad)" stroke="#9dbde8" stroke-width="1.5"/><text x="230" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3f80">SRAM</text><text x="230" y="82" text-anchor="middle" font-size="13" fill="#28518a">Static Random-Access Memory</text><g transform="translate(60,105)"><rect x="0" y="0" width="340" height="120" rx="8" fill="#fff" stroke="#3b74d4" stroke-width="1.5"/><text x="170" y="18" text-anchor="middle" font-size="12" fill="#1e3f80" font-weight="600">存储单元：6 晶体管触发器 (6T)</text><polygon points="90,55 130,42 130,68" fill="#c9dcff" stroke="#3b74d4"/><polygon points="250,55 210,42 210,68" fill="#c9dcff" stroke="#3b74d4"/><line x1="130" y1="55" x2="210" y2="55" stroke="#333" stroke-width="1.2"/><line x1="170" y1="55" x2="170" y2="80" stroke="#333" stroke-width="1.2"/><line x1="90" y1="55" x2="70" y2="55" stroke="#333" stroke-width="1.2"/><line x1="250" y1="55" x2="270" y2="55" stroke="#333" stroke-width="1.2"/><rect x="55" y="45" width="16" height="20" fill="#fff" stroke="#3b74d4"/><rect x="269" y="45" width="16" height="20" fill="#fff" stroke="#3b74d4"/><line x1="63" y1="30" x2="63" y2="45" stroke="#e2831b" stroke-width="1.5"/><line x1="277" y1="30" x2="277" y2="45" stroke="#e2831b" stroke-width="1.5"/><line x1="40" y1="30" x2="300" y2="30" stroke="#e2831b" stroke-width="1.5"/><text x="310" y="34" font-size="10" fill="#e2831b">WL</text><line x1="30" y1="55" x2="55" y2="55" stroke="#666" stroke-width="1.2"/><line x1="285" y1="55" x2="315" y2="55" stroke="#666" stroke-width="1.2"/><line x1="30" y1="55" x2="30" y2="105" stroke="#666" stroke-width="1.2"/><line x1="315" y1="55" x2="315" y2="105" stroke="#666" stroke-width="1.2"/><text x="12" y="105" font-size="10" fill="#666">BL</text><text x="320" y="105" font-size="10" fill="#666">BL̅</text></g><g transform="translate(50,245)" font-size="14" fill="#1e3f80"><g transform="translate(0,0)"><circle cx="8" cy="8" r="6" fill="#3b74d4"/><text x="24" y="12">数据保持：触发器闩锁，通电即稳</text></g><g transform="translate(0,32)"><circle cx="8" cy="8" r="6" fill="#3b74d4"/><text x="24" y="12">刷新：无需刷新</text></g><g transform="translate(0,64)"><circle cx="8" cy="8" r="6" fill="#3b74d4"/><text x="24" y="12">速度：极快（约 1–5 ns）</text></g><g transform="translate(0,96)"><circle cx="8" cy="8" r="6" fill="#3b74d4"/><text x="24" y="12">集成度：低（每 bit ≥ 6 管）</text></g><g transform="translate(0,128)"><circle cx="8" cy="8" r="6" fill="#3b74d4"/><text x="24" y="12">功耗：静态低，切换高</text></g><g transform="translate(0,160)"><circle cx="8" cy="8" r="6" fill="#3b74d4"/><text x="24" y="12">成本：高</text></g><g transform="translate(0,192)"><circle cx="8" cy="8" r="6" fill="#3b74d4"/><text x="24" y="12">典型用途：CPU Cache、寄存器</text></g></g><rect x="460" y="20" width="420" height="480" rx="14" fill="url(#dramGrad)" stroke="#e8bf9d" stroke-width="1.5"/><text x="670" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="#80421e">DRAM</text><text x="670" y="82" text-anchor="middle" font-size="13" fill="#8a5228">Dynamic Random-Access Memory</text><g transform="translate(500,105)"><rect x="0" y="0" width="340" height="120" rx="8" fill="#fff" stroke="#d4753b" stroke-width="1.5"/><text x="170" y="18" text-anchor="middle" font-size="12" fill="#80421e" font-weight="600">存储单元：1 晶体管 + 1 电容 (1T1C)</text><line x1="30" y1="45" x2="310" y2="45" stroke="#e2831b" stroke-width="1.5"/><text x="315" y="49" font-size="10" fill="#e2831b">WL</text><line x1="160" y1="45" x2="160" y2="65" stroke="#333"/><rect x="152" y="65" width="16" height="20" fill="#fff" stroke="#d4753b"/><line x1="140" y1="75" x2="152" y2="75" stroke="#333"/><line x1="168" y1="75" x2="200" y2="75" stroke="#333"/><line x1="140" y1="30" x2="140" y2="105" stroke="#666" stroke-width="1.2"/><text x="118" y="105" font-size="10" fill="#666">BL</text><line x1="200" y1="70" x2="200" y2="80" stroke="#333"/><line x1="190" y1="80" x2="210" y2="80" stroke="#333" stroke-width="1.5"/><line x1="190" y1="86" x2="210" y2="86" stroke="#333" stroke-width="1.5"/><line x1="200" y1="86" x2="200" y2="98" stroke="#333"/><line x1="192" y1="98" x2="208" y2="98" stroke="#333" stroke-width="1.2"/><line x1="195" y1="102" x2="205" y2="102" stroke="#333" stroke-width="1.2"/><text x="216" y="90" font-size="10" fill="#80421e">C</text><path d="M225 85q35 0 50 20" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr)"/><text x="235" y="80" font-size="10" fill="#c0392b">漏电</text></g><g transform="translate(490,245)" font-size="14" fill="#80421e"><g transform="translate(0,0)"><circle cx="8" cy="8" r="6" fill="#d4753b"/><text x="24" y="12">数据保持：电容存电荷，会漏电</text></g><g transform="translate(0,32)"><circle cx="8" cy="8" r="6" fill="#d4753b"/><text x="24" y="12">刷新：需定期刷新（毫秒级）</text></g><g transform="translate(0,64)"><circle cx="8" cy="8" r="6" fill="#d4753b"/><text x="24" y="12">速度：较慢（约 50–100 ns）</text></g><g transform="translate(0,96)"><circle cx="8" cy="8" r="6" fill="#d4753b"/><text x="24" y="12">集成度：高（每 bit 1 管 1 容）</text></g><g transform="translate(0,128)"><circle cx="8" cy="8" r="6" fill="#d4753b"/><text x="24" y="12">功耗：刷新+读写有持续开销</text></g><g transform="translate(0,160)"><circle cx="8" cy="8" r="6" fill="#d4753b"/><text x="24" y="12">成本：低</text></g><g transform="translate(0,192)"><circle cx="8" cy="8" r="6" fill="#d4753b"/><text x="24" y="12">典型用途：主存、显存</text></g></g><circle cx="450" cy="260" r="26" fill="#fff" stroke="#666" stroke-width="1.5"/><text x="450" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#444">VS</text></svg>
