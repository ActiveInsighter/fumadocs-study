<svg viewBox="0 0 900 520" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="900" height="520" fill="none" rx="12"/><text x="450" y="36" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--indigo-ink)">总线宽度 &amp; 总线带宽 图解</text><rect x="30" y="55" width="840" height="210" rx="8" fill="var(--cyan-soft)" stroke="var(--mint-mid)" stroke-width="1.5"/><text x="46" y="78" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--mint-deep)">① 总线宽度（Bus Width）</text><text x="46" y="97" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">总线上能同时传输的数据位数 = 数据线的根数</text><text x="46" y="122" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--ink-soft)">8 位总线（8 根数据线）</text><g fill="var(--sky-mid)" stroke="var(--blue-deep)" stroke-width="1"><rect x="46" y="128" width="28" height="16" rx="3"/><rect x="80" y="128" width="28" height="16" rx="3"/><rect x="114" y="128" width="28" height="16" rx="3"/><rect x="148" y="128" width="28" height="16" rx="3"/><rect x="182" y="128" width="28" height="16" rx="3"/><rect x="216" y="128" width="28" height="16" rx="3"/><rect x="250" y="128" width="28" height="16" rx="3"/><rect x="284" y="128" width="28" height="16" rx="3"/></g><g font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--blue-deep)"><text x="60" y="140">1</text><text x="94" y="140">0</text><text x="128" y="140">1</text><text x="162" y="140">1</text><text x="196" y="140">0</text><text x="230" y="140">0</text><text x="264" y="140">1</text><text x="298" y="140">0</text></g><line x1="46" y1="152" x2="312" y2="152" stroke="var(--mint-mid)" stroke-width="1.5"/><line x1="46" y1="148" x2="46" y2="156" stroke="var(--mint-mid)" stroke-width="1.5"/><line x1="312" y1="148" x2="312" y2="156" stroke="var(--mint-mid)" stroke-width="1.5"/><text x="179" y="166" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">8 根 → 每次传 1 字节</text><text x="46" y="192" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--ink-soft)">32 位总线（32 根数据线）</text><g fill="var(--green-mid)" stroke="var(--green-deep)" stroke-width="1"><rect x="46" y="198" width="28" height="16" rx="3"/><rect x="80" y="198" width="28" height="16" rx="3"/><rect x="114" y="198" width="28" height="16" rx="3"/><rect x="148" y="198" width="28" height="16" rx="3"/><rect x="182" y="198" width="28" height="16" rx="3"/><rect x="216" y="198" width="28" height="16" rx="3"/><rect x="250" y="198" width="28" height="16" rx="3"/><rect x="284" y="198" width="28" height="16" rx="3"/><rect x="318" y="198" width="28" height="16" rx="3"/><rect x="352" y="198" width="28" height="16" rx="3"/><rect x="386" y="198" width="28" height="16" rx="3"/><rect x="420" y="198" width="28" height="16" rx="3"/><rect x="454" y="198" width="28" height="16" rx="3"/><rect x="488" y="198" width="28" height="16" rx="3"/><rect x="522" y="198" width="28" height="16" rx="3"/><rect x="556" y="198" width="28" height="16" rx="3"/></g><g fill="var(--green-mid)" stroke="var(--green-deep)" stroke-width="1"><rect x="46" y="218" width="28" height="16" rx="3"/><rect x="80" y="218" width="28" height="16" rx="3"/><rect x="114" y="218" width="28" height="16" rx="3"/><rect x="148" y="218" width="28" height="16" rx="3"/><rect x="182" y="218" width="28" height="16" rx="3"/><rect x="216" y="218" width="28" height="16" rx="3"/><rect x="250" y="218" width="28" height="16" rx="3"/><rect x="284" y="218" width="28" height="16" rx="3"/><rect x="318" y="218" width="28" height="16" rx="3"/><rect x="352" y="218" width="28" height="16" rx="3"/><rect x="386" y="218" width="28" height="16" rx="3"/><rect x="420" y="218" width="28" height="16" rx="3"/><rect x="454" y="218" width="28" height="16" rx="3"/><rect x="488" y="218" width="28" height="16" rx="3"/><rect x="522" y="218" width="28" height="16" rx="3"/><rect x="556" y="218" width="28" height="16" rx="3"/></g><line x1="46" y1="242" x2="584" y2="242" stroke="var(--mint-mid)" stroke-width="1.5"/><line x1="46" y1="238" x2="46" y2="246" stroke="var(--mint-mid)" stroke-width="1.5"/><line x1="584" y1="238" x2="584" y2="246" stroke="var(--mint-mid)" stroke-width="1.5"/><text x="315" y="256" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--mint-deep)">32 根 → 每次传 4 字节（位宽越宽，单次传输越多）</text><text x="620" y="140" font-size="var(--svg-font-size-label)" fill="var(--neutral-deep)">位宽决定"并行通道数"</text><text x="620" y="158" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">8 位 → 1 字节 / 次</text><text x="620" y="174" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">16 位 → 2 字节 / 次</text><text x="620" y="190" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">32 位 → 4 字节 / 次</text><text x="620" y="206" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">64 位 → 8 字节 / 次</text><rect x="30" y="280" width="840" height="220" rx="8" fill="var(--magenta-soft)" stroke="var(--purple-deep)" stroke-width="1.5"/><text x="46" y="302" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">② 总线带宽（Bus Bandwidth）</text><text x="46" y="321" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">单位时间内总线能传输的最大数据量（MB/s 或 GB/s）</text><rect x="46" y="332" width="808" height="40" rx="6" fill="var(--purple-light)" stroke="var(--purple-deep)" stroke-width="1"/><text x="450" y="348" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--purple-ink)" font-weight="var(--svg-font-weight-bold)">带宽 = （总线宽度 / 8）× 工作频率</text><text x="450" y="364" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--purple-deep)">单位：(bits / 8) × Hz = Bytes/s → 换算为 MB/s</text><rect x="46" y="384" width="240" height="100" rx="6" fill="var(--purple-soft)" stroke="var(--purple-deep)" stroke-width="1"/><text x="166" y="402" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">示例 A</text><text x="166" y="420" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">宽度 = 32 位</text><text x="166" y="436" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">工作频率 = 100 MHz</text><line x1="66" y1="444" x2="266" y2="444" stroke="var(--purple-deep)" stroke-width="1" stroke-dasharray="4,3"/><text x="166" y="460" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--purple-ink)" font-weight="var(--svg-font-weight-bold)">= (32/8) × 100M</text><text x="166" y="476" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--purple-deep)" font-weight="var(--svg-font-weight-bold)">= 400 MB/s</text><rect x="330" y="384" width="240" height="100" rx="6" fill="var(--purple-soft)" stroke="var(--purple-deep)" stroke-width="1"/><text x="450" y="402" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">示例 B（DDR）</text><text x="450" y="420" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">宽度 = 64 位</text><text x="450" y="436" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">工作频率 = 2 × 100 MHz</text><line x1="350" y1="444" x2="550" y2="444" stroke="var(--purple-deep)" stroke-width="1" stroke-dasharray="4,3"/><text x="450" y="460" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--purple-ink)" font-weight="var(--svg-font-weight-bold)">= (64/8) × 200M</text><text x="450" y="476" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--purple-deep)" font-weight="var(--svg-font-weight-bold)">= 1600 MB/s</text><rect x="614" y="384" width="240" height="100" rx="6" fill="var(--purple-soft)" stroke="var(--purple-deep)" stroke-width="1"/><text x="734" y="402" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">示例 C（宽度翻倍）</text><text x="734" y="420" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">宽度 = 64 位</text><text x="734" y="436" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">工作频率 = 100 MHz</text><line x1="634" y1="444" x2="834" y2="444" stroke="var(--purple-deep)" stroke-width="1" stroke-dasharray="4,3"/><text x="734" y="460" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--purple-ink)" font-weight="var(--svg-font-weight-bold)">= (64/8) × 100M</text><text x="734" y="476" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--purple-deep)" font-weight="var(--svg-font-weight-bold)">= 800 MB/s</text><text x="295" y="430" text-anchor="middle" font-size="var(--svg-font-size-title)" fill="var(--red-deep)">→</text><text x="295" y="445" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--red-deep)">频率×2</text><text x="579" y="430" text-anchor="middle" font-size="var(--svg-font-size-title)" fill="var(--green-mid)">→</text><text x="579" y="445" text-anchor="middle" font-size="var(--svg-font-size-caption)" fill="var(--green-mid)">位宽×2</text></svg>
