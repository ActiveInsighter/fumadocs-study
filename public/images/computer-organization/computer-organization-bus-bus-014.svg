<svg viewBox="0 0 900 520" font-family="'Segoe UI', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="520" fill="none" rx="12"/><text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">总线宽度 &amp; 总线带宽 图解</text><rect x="30" y="55" width="840" height="210" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.5"/><text x="46" y="78" font-size="13" font-weight="bold" fill="#148f77">① 总线宽度（Bus Width）</text><text x="46" y="97" font-size="11" fill="#555">总线上能同时传输的数据位数 = 数据线的根数</text><text x="46" y="122" font-size="12" font-weight="bold" fill="#888">8 位总线（8 根数据线）</text><g fill="#aed6f1" stroke="#2980b9" stroke-width="1"><rect x="46" y="128" width="28" height="16" rx="3"/><rect x="80" y="128" width="28" height="16" rx="3"/><rect x="114" y="128" width="28" height="16" rx="3"/><rect x="148" y="128" width="28" height="16" rx="3"/><rect x="182" y="128" width="28" height="16" rx="3"/><rect x="216" y="128" width="28" height="16" rx="3"/><rect x="250" y="128" width="28" height="16" rx="3"/><rect x="284" y="128" width="28" height="16" rx="3"/></g><g font-size="10" text-anchor="middle" fill="#1a5276"><text x="60" y="140">1</text><text x="94" y="140">0</text><text x="128" y="140">1</text><text x="162" y="140">1</text><text x="196" y="140">0</text><text x="230" y="140">0</text><text x="264" y="140">1</text><text x="298" y="140">0</text></g><line x1="46" y1="152" x2="312" y2="152" stroke="#1abc9c" stroke-width="1.5"/><line x1="46" y1="148" x2="46" y2="156" stroke="#1abc9c" stroke-width="1.5"/><line x1="312" y1="148" x2="312" y2="156" stroke="#1abc9c" stroke-width="1.5"/><text x="179" y="166" text-anchor="middle" font-size="11" fill="#148f77">8 根 → 每次传 1 字节</text><text x="46" y="192" font-size="12" font-weight="bold" fill="#888">32 位总线（32 根数据线）</text><g fill="#a9dfbf" stroke="#1e8449" stroke-width="1"><rect x="46" y="198" width="28" height="16" rx="3"/><rect x="80" y="198" width="28" height="16" rx="3"/><rect x="114" y="198" width="28" height="16" rx="3"/><rect x="148" y="198" width="28" height="16" rx="3"/><rect x="182" y="198" width="28" height="16" rx="3"/><rect x="216" y="198" width="28" height="16" rx="3"/><rect x="250" y="198" width="28" height="16" rx="3"/><rect x="284" y="198" width="28" height="16" rx="3"/><rect x="318" y="198" width="28" height="16" rx="3"/><rect x="352" y="198" width="28" height="16" rx="3"/><rect x="386" y="198" width="28" height="16" rx="3"/><rect x="420" y="198" width="28" height="16" rx="3"/><rect x="454" y="198" width="28" height="16" rx="3"/><rect x="488" y="198" width="28" height="16" rx="3"/><rect x="522" y="198" width="28" height="16" rx="3"/><rect x="556" y="198" width="28" height="16" rx="3"/></g><g fill="#a9dfbf" stroke="#1e8449" stroke-width="1"><rect x="46" y="218" width="28" height="16" rx="3"/><rect x="80" y="218" width="28" height="16" rx="3"/><rect x="114" y="218" width="28" height="16" rx="3"/><rect x="148" y="218" width="28" height="16" rx="3"/><rect x="182" y="218" width="28" height="16" rx="3"/><rect x="216" y="218" width="28" height="16" rx="3"/><rect x="250" y="218" width="28" height="16" rx="3"/><rect x="284" y="218" width="28" height="16" rx="3"/><rect x="318" y="218" width="28" height="16" rx="3"/><rect x="352" y="218" width="28" height="16" rx="3"/><rect x="386" y="218" width="28" height="16" rx="3"/><rect x="420" y="218" width="28" height="16" rx="3"/><rect x="454" y="218" width="28" height="16" rx="3"/><rect x="488" y="218" width="28" height="16" rx="3"/><rect x="522" y="218" width="28" height="16" rx="3"/><rect x="556" y="218" width="28" height="16" rx="3"/></g><line x1="46" y1="242" x2="584" y2="242" stroke="#1abc9c" stroke-width="1.5"/><line x1="46" y1="238" x2="46" y2="246" stroke="#1abc9c" stroke-width="1.5"/><line x1="584" y1="238" x2="584" y2="246" stroke="#1abc9c" stroke-width="1.5"/><text x="315" y="256" text-anchor="middle" font-size="11" fill="#148f77">32 根 → 每次传 4 字节（位宽越宽，单次传输越多）</text><text x="620" y="140" font-size="12" fill="#555">位宽决定"并行通道数"</text><text x="620" y="158" font-size="11" fill="#888">8 位 → 1 字节 / 次</text><text x="620" y="174" font-size="11" fill="#888">16 位 → 2 字节 / 次</text><text x="620" y="190" font-size="11" fill="#888">32 位 → 4 字节 / 次</text><text x="620" y="206" font-size="11" fill="#888">64 位 → 8 字节 / 次</text><rect x="30" y="280" width="840" height="220" rx="8" fill="#fdf2f8" stroke="#8e44ad" stroke-width="1.5"/><text x="46" y="302" font-size="13" font-weight="bold" fill="#7d3c98">② 总线带宽（Bus Bandwidth）</text><text x="46" y="321" font-size="11" fill="#555">单位时间内总线能传输的最大数据量（MB/s 或 GB/s）</text><rect x="46" y="332" width="808" height="40" rx="6" fill="#d7bde2" stroke="#7d3c98" stroke-width="1"/><text x="450" y="348" text-anchor="middle" font-size="13" fill="#4a235a" font-weight="bold">带宽 = （总线宽度 / 8）× 工作频率</text><text x="450" y="364" text-anchor="middle" font-size="11" fill="#6c3483">单位：(bits / 8) × Hz = Bytes/s → 换算为 MB/s</text><rect x="46" y="384" width="240" height="100" rx="6" fill="#ebdef0" stroke="#8e44ad" stroke-width="1"/><text x="166" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c3483">示例 A</text><text x="166" y="420" text-anchor="middle" font-size="11" fill="#555">宽度 = 32 位</text><text x="166" y="436" text-anchor="middle" font-size="11" fill="#555">工作频率 = 100 MHz</text><line x1="66" y1="444" x2="266" y2="444" stroke="#8e44ad" stroke-width="1" stroke-dasharray="4,3"/><text x="166" y="460" text-anchor="middle" font-size="12" fill="#4a235a" font-weight="bold">= (32/8) × 100M</text><text x="166" y="476" text-anchor="middle" font-size="12" fill="#7d3c98" font-weight="bold">= 400 MB/s</text><rect x="330" y="384" width="240" height="100" rx="6" fill="#ebdef0" stroke="#8e44ad" stroke-width="1"/><text x="450" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c3483">示例 B（DDR）</text><text x="450" y="420" text-anchor="middle" font-size="11" fill="#555">宽度 = 64 位</text><text x="450" y="436" text-anchor="middle" font-size="11" fill="#555">工作频率 = 2 × 100 MHz</text><line x1="350" y1="444" x2="550" y2="444" stroke="#8e44ad" stroke-width="1" stroke-dasharray="4,3"/><text x="450" y="460" text-anchor="middle" font-size="12" fill="#4a235a" font-weight="bold">= (64/8) × 200M</text><text x="450" y="476" text-anchor="middle" font-size="12" fill="#7d3c98" font-weight="bold">= 1600 MB/s</text><rect x="614" y="384" width="240" height="100" rx="6" fill="#ebdef0" stroke="#8e44ad" stroke-width="1"/><text x="734" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#6c3483">示例 C（宽度翻倍）</text><text x="734" y="420" text-anchor="middle" font-size="11" fill="#555">宽度 = 64 位</text><text x="734" y="436" text-anchor="middle" font-size="11" fill="#555">工作频率 = 100 MHz</text><line x1="634" y1="444" x2="834" y2="444" stroke="#8e44ad" stroke-width="1" stroke-dasharray="4,3"/><text x="734" y="460" text-anchor="middle" font-size="12" fill="#4a235a" font-weight="bold">= (64/8) × 100M</text><text x="734" y="476" text-anchor="middle" font-size="12" fill="#7d3c98" font-weight="bold">= 800 MB/s</text><text x="295" y="430" text-anchor="middle" font-size="18" fill="#c0392b">→</text><text x="295" y="445" text-anchor="middle" font-size="9" fill="#c0392b">频率×2</text><text x="579" y="430" text-anchor="middle" font-size="18" fill="#27ae60">→</text><text x="579" y="445" text-anchor="middle" font-size="9" fill="#27ae60">位宽×2</text></svg>
