="1" stroke-dasharray="5 3" opacity=".6"/><ellipse cx="230" cy="224" rx="92" ry="26" fill="none" stroke="var(--violet-mid)" stroke-width=".8" stroke-dasharray="5 3" opacity=".5"/><ellipse cx="230" cy="224" rx="58" ry="17" fill="none" stroke="var(--violet-mid)" stroke-width=".7" stroke-dasharray="5 3" opacity=".4"/><ellipse cx="230" cy="224" rx="127" ry="36" fill="none" stroke="var(--violet-deep)" stroke-width="2.5" filter="url(#glow)"/><path d="M230 224l84-24a127 36 0 0124 37z" fill="var(--yellow-mid)" opacity=".55"/><path d="M230 224l84-24a127 36 0 0124 37z" fill="none" stroke="var(--orange-mid)" stroke-width="1.8"/><ellipse cx="230" cy="224" rx="20" ry="6" fill="var(--indigo-soft)" stroke="var(--indigo-mid)" stroke-width="1.5"/><line x1="230" y1="175" x2="230" y2="355" stroke="var(--blue-mid)" stroke-width="2.5"/><line x1="382" y1="163" x2="302" y2="221" stroke="var(--blue-deep)" stroke-width="2.5"/><circle cx="302" cy="221" r="5" fill="var(--purple-deep)" stroke="var(--surface)" stroke-width="1.5" filter="url(#glow)"/><circle cx="382" cy="163" r="7" fill="var(--blue-light)" stroke="var(--blue-mid)" stroke-width="1.5"/><line x1="148" y1="152" x2="173" y2="200" stroke="var(--violet-deep)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowBlue)"/><text x="60" y="146" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">柱面 C</text><text x="56" y="160" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">同半径的磁道集合</text><line x1="290" y1="245" x2="175" y2="350" stroke="var(--orange-mid)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowOrange)"/><text x="78" y="362" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">扇区 S</text><text x="74" y="376" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">磁道的最小存储单元</text><text x="392" y="158" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">磁头 H</text><text x="75" y="228" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">H=3</text><text x="75" y="255" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">H=2</text><text x="75" y="282" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">H=1</text><text x="75" y="309" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">H=0</text><line x1="408" y1="224" x2="408" y2="308" stroke="var(--violet-deep)" stroke-width="1.5" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/><rect x="414" y="254" width="46" height="16" rx="3" fill="var(--sky-soft)"/><text x="437" y="265" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">柱面深度</text><rect x="508" y="72" width="328" height="360" rx="10" fill="var(--surface)" stroke="var(--blue-light)" stroke-width="1.5" filter="url(#shadow)"/><text x="672" y="100" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">CHS 地址结构</text><rect x="526" y="112" width="292" height="32" rx="5" fill="var(--paper)" stroke="var(--blue-soft)" stroke-width="1"/><rect x="526" y="112" width="132" height="32" rx="5" fill="var(--violet-deep)"/><text x="592" y="133" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">C (10 bits)</text><rect x="658" y="112" width="58" height="32" fill="var(--purple-deep)"/><text x="687" y="133" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">H (2 b)</text><rect x="716" y="112" width="102" height="32" rx="5" fill="var(--green-deep)"/><text x="767" y="133" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">S (5 bits)</text><text x="672" y="160" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">示例：1000 柱面 × 4 盘面 × 32 扇区/磁道，共 17 bits</text><line x1="526" y1="170" x2="818" y2="170" stroke="var(--blue-soft)" stroke-width="1"/><rect x="526" y="182" width="10" height="42" rx="3" fill="var(--violet-mid)"/><text x="546" y="199" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">C — 柱面号</text><text x="546" y="215" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">目标磁道在哪一组柱面</text><text x="814" y="202" text-anchor="end" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">⌈log₂(柱面数)⌉ bits</text><rect x="526" y="236" width="10" height="42" rx="3" fill="var(--purple-deep)"/><text x="546" y="253" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">H — 磁头号</text><text x="546" y="269" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">目标扇区在哪个盘面</text><text x="814" y="256" text-anchor="end" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">⌈log₂(盘面数)⌉ bits</text><rect x="526" y="290" width="10" height="42" rx="3" fill="var(--lime-mid)"/><text x="546" y="307" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">S — 扇区号</text><text x="546" y="323" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">目标扇区在磁道中的位置</text><text x="814" y="310" text-anchor="end" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">⌈log₂(扇区数)⌉ bits</text><line x1="526" y1="344" x2="818" y2="344" stroke="var(--blue-soft)" stroke-width="1"/><text x="546" y="363" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">示例定位：</text><rect x="543" y="371" width="38" height="20" rx="4" fill="var(--blue-soft)" stroke="var(--violet-mid)" stroke-width="1"/><text x="562" y="385" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">C=500</text><rect x="587" y="371" width="32" height="20" rx="4" fill="var(--violet-soft)" stroke="var(--purple-deep)" stroke-width="1"/><text x="603" y="385" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">H=2</text><rect x="625" y="371" width="32" height="20" rx="4" fill="var(--green-soft)" stroke="var(--lime-mid)" stroke-width="1"/><text x="641" y="385" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">S=15</text><text x="665" y="385" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">→ 精确定位到目标扇区</text><rect x="526" y="402" width="292" height="20" rx="4" fill="var(--surface)" stroke="var(--blue-soft)" stroke-width="1"/><text x="672" y="416" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">地址总位数 = C位 + H位 + S位</text></svg>
