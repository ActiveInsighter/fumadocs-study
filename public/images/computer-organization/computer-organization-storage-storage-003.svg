><ellipse cx="230" cy="251" rx="92" ry="26" fill="none" stroke="#818cf8" stroke-width=".7" stroke-dasharray="4 3" opacity=".5"/><ellipse cx="230" cy="251" rx="58" ry="17" fill="none" stroke="#818cf8" stroke-width=".7" stroke-dasharray="4 3" opacity=".5"/><ellipse cx="230" cy="251" rx="20" ry="6" fill="#e8eef8" stroke="#a5b4fc" stroke-width="1"/><path d="M65 251V224q0-9 165-9t165 9v27" fill="#c7d2fe" stroke="none"/><ellipse cx="230" cy="224" rx="165" ry="46" fill="url(#platterTop)" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/><ellipse cx="230" cy="224" rx="127" ry="36" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5 3" opacity=".6"/><ellipse cx="230" cy="224" rx="92" ry="26" fill="none" stroke="#3b82f6" stroke-width=".8" stroke-dasharray="5 3" opacity=".5"/><ellipse cx="230" cy="224" rx="58" ry="17" fill="none" stroke="#3b82f6" stroke-width=".7" stroke-dasharray="5 3" opacity=".4"/><ellipse cx="230" cy="224" rx="127" ry="36" fill="none" stroke="#2563eb" stroke-width="2.5" filter="url(#glow)"/><path d="M230 224l84-24a127 36 0 0124 37z" fill="#fde68a" opacity=".55"/><path d="M230 224l84-24a127 36 0 0124 37z" fill="none" stroke="#d97706" stroke-width="1.8"/><ellipse cx="230" cy="224" rx="20" ry="6" fill="#e0e7ff" stroke="#93c5fd" stroke-width="1.5"/><line x1="230" y1="175" x2="230" y2="355" stroke="#94a3b8" stroke-width="2.5"/><line x1="382" y1="163" x2="302" y2="221" stroke="#64748b" stroke-width="2.5"/><circle cx="302" cy="221" r="5" fill="#7c3aed" stroke="#fff" stroke-width="1.5" filter="url(#glow)"/><circle cx="382" cy="163" r="7" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><line x1="148" y1="152" x2="173" y2="200" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowBlue)"/><text x="60" y="146" fill="#1d4ed8" font-size="11" font-weight="700">柱面 C</text><text x="56" y="160" fill="#3b82f6" font-size="9">同半径的磁道集合</text><line x1="290" y1="245" x2="175" y2="350" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowOrange)"/><text x="78" y="362" fill="#b45309" font-size="11" font-weight="700">扇区 S</text><text x="74" y="376" fill="#d97706" font-size="9">磁道的最小存储单元</text><text x="392" y="158" fill="#7c3aed" font-size="10" font-weight="600">磁头 H</text><text x="75" y="228" fill="#64748b" font-size="9">H=3</text><text x="75" y="255" fill="#64748b" font-size="9">H=2</text><text x="75" y="282" fill="#64748b" font-size="9">H=1</text><text x="75" y="309" fill="#64748b" font-size="9">H=0</text><line x1="408" y1="224" x2="408" y2="308" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/><rect x="414" y="254" width="46" height="16" rx="3" fill="#eff6ff"/><text x="437" y="265" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="600">柱面深度</text><rect x="508" y="72" width="328" height="360" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><text x="672" y="100" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="700">CHS 地址结构</text><rect x="526" y="112" width="292" height="32" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><rect x="526" y="112" width="132" height="32" rx="5" fill="url(#cylGrad)"/><text x="592" y="133" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">C (10 bits)</text><rect x="658" y="112" width="58" height="32" fill="url(#headGrad)"/><text x="687" y="133" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">H (2 b)</text><rect x="716" y="112" width="102" height="32" rx="5" fill="url(#secGrad)"/><text x="767" y="133" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">S (5 bits)</text><text x="672" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">示例：1000 柱面 × 4 盘面 × 32 扇区/磁道，共 17 bits</text><line x1="526" y1="170" x2="818" y2="170" stroke="#e2e8f0" stroke-width="1"/><rect x="526" y="182" width="10" height="42" rx="3" fill="#3b82f6"/><text x="546" y="199" fill="#1d4ed8" font-size="13" font-weight="700">C — 柱面号</text><text x="546" y="215" fill="#64748b" font-size="10">目标磁道在哪一组柱面</text><text x="814" y="202" text-anchor="end" fill="#2563eb" font-size="11" font-weight="600">⌈log₂(柱面数)⌉ bits</text><rect x="526" y="236" width="10" height="42" rx="3" fill="#a855f7"/><text x="546" y="253" fill="#6d28d9" font-size="13" font-weight="700">H — 磁头号</text><text x="546" y="269" fill="#64748b" font-size="10">目标扇区在哪个盘面</text><text x="814" y="256" text-anchor="end" fill="#7c3aed" font-size="11" font-weight="600">⌈log₂(盘面数)⌉ bits</text><rect x="526" y="290" width="10" height="42" rx="3" fill="#16a34a"/><text x="546" y="307" fill="#15803d" font-size="13" font-weight="700">S — 扇区号</text><text x="546" y="323" fill="#64748b" font-size="10">目标扇区在磁道中的位置</text><text x="814" y="310" text-anchor="end" fill="#16a34a" font-size="11" font-weight="600">⌈log₂(扇区数)⌉ bits</text><line x1="526" y1="344" x2="818" y2="344" stroke="#e2e8f0" stroke-width="1"/><text x="546" y="363" fill="#94a3b8" font-size="11">示例定位：</text><rect x="543" y="371" width="38" height="20" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/><text x="562" y="385" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="700">C=500</text><rect x="587" y="371" width="32" height="20" rx="4" fill="#ede9fe" stroke="#a855f7" stroke-width="1"/><text x="603" y="385" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="700">H=2</text><rect x="625" y="371" width="32" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="641" y="385" text-anchor="middle" fill="#15803d" font-size="10" font-weight="700">S=15</text><text x="665" y="385" fill="#64748b" font-size="10">→ 精确定位到目标扇区</text><rect x="526" y="402" width="292" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="672" y="416" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">地址总位数 = C位 + H位 + S位</text></svg>
