<svg viewBox="0 0 860 450" font-family="'Segoe UI', 'PingFang SC', sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="100%" y2="100%"><stop offset="0" style="stop-color:#f0f4ff"/><stop offset="100%" style="stop-color:#e8eef8"/></linearGradient><linearGradient id="cylGrad" x1="0" y1="0" x2="100%" y2="0"><stop offset="0" style="stop-color:#3b82f6"/><stop offset="100%" style="stop-color:#2563eb"/></linearGradient><linearGradient id="headGrad" x1="0" y1="0" x2="100%" y2="0"><stop offset="0" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient><linearGradient id="secGrad" x1="0" y1="0" x2="100%" y2="0"><stop offset="0" style="stop-color:#16a34a"/><stop offset="100%" style="stop-color:#15803d"/></linearGradient><linearGradient id="platterTop" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" style="stop-color:#dbeafe"/><stop offset="100%" style="stop-color:#bfdbfe"/></linearGradient><linearGradient id="platterMid" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" style="stop-color:#e0e7ff"/><stop offset="100%" style="stop-color:#c7d2fe"/></linearGradient><linearGradient id="platterSide" x1="0" y1="0" x2="0" y2="100%"><stop offset="0" style="stop-color:#c7d2fe"/><stop offset="100%" style="stop-color:#a5b4fc"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity=".25"/></filter><filter id="glow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker><marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d97706"/></marker><marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon poin