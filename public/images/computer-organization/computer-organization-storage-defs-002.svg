<svg viewBox="0 0 880 560" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bgRam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f6ff"/><stop offset="100%" stop-color="#e3ecff"/></linearGradient><linearGradient id="chipPCB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b5e20"/><stop offset="100%" stop-color="#0d3d10"/></linearGradient><linearGradient id="ramChip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#263238"/><stop offset="100%" stop-color="#102027"/></linearGradient><linearGradient id="randomGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3f2fd"/><stop offset="100%" stop-color="#bbdefb"/></linearGradient><linearGradient id="volatileGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffebee"/><stop offset="100%" stop-color="#ffcdd2"/></linearGradient><linearGradient id="cardR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="100%" stop-color="#eef3ff"/></linearGradient><linearGradient id="sramGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf2fd"/></linearGradient><linearGradient id="dramGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf5"/><stop offset="1" stop-color="#fdf0e4"/></linearGradient><filter id="ramShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#37474f"/></marker><marker id="arrAccess" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1565c0"/></marker></defs><rect width="880" height="560" fill="url(#bgRam)"/><text x="440" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0d47a1">RAM · Random-Access Memory 随机存储器</text><text x="440" y="56" text-anchor="middle" font-size="12" fill="#455a64">半导体 · 随机访问 · 易失性 · 运行时存储</text><g transform="translate(40,86)"><rect x="0" y="0" width="430" height="200" rx="12" fill="#fff" stroke="#c5cae9" filter="url(#ramShadow)"/><text x="215" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">内存条 (DIMM) 示意</text><g transform="translate(20,46)"><rect x="0" y="20" width="390" height="80" rx="4" fill="url(#chipPCB)"/><rect x="170" y="92" width="50" height="14" fill="#0d3d10"/><g fill="#ffd54f"><rect x="6" y="100" width="6" height="14"/><rect x="16" y="100" width="6" height="14"/><rect x="26" y="100" width="6" height="14"/><rect x="36" y="100" width="6" height="14"/><rect x="46" y="100" width="6" height="14"/><rect x="56" y="100" width="6" height="14"/><rect x="66" y="100" width="6" height="14"/><rect x="76" y="100" width="6" height="14"/><rect x="86" y="100" width="6" height="14"/><rect x="96" y="100" width="6" height="14"/><rect x="106" y="100" width="6" height="14"/><rect x="116" y="100" width="6" height="14"/><rect x="126" y="100" width="6" height="14"/><rect x="136" y="100" width="6" height="14"/><rect x="146" y="100" width="6" height="14"/><rect x="156" y="100" width="6" height="14"/><rect x="225" y="100" width="6" height="14"/><rect x="235" y="100" width="6" height="14"/><rect x="245" y="100" width="6" height="14"/><rect x="255" y="100" width="6" height="14"/><rect x="265" y="100" width="6" height="14"/><rect x="275" y="100" width="6" height="14"/><rect x="285" y="100" width="6" height="14"/><rect x="295" y="100" width="6" height="14"/><rect x="305" y="100" width="6" height="14"/><rect x="315" y="100" width="6" height="14"/><rect x="325" y="100" width="6" height="14"/><rect x="335" y="100" width="6" height="14"/><rect x="345" y="100" width="6" height="14"/><rect x="355" y="100" width="6" height="14"/><rect x="365" y="100" width="6" height="14"/><rect x="375" y="100" width="6" height="14"/></g><g><rect x="14" y="32" width="50" height="38" rx="3" fill="url(#ramChip)"/><text x="39" y="55" text-anchor="middle" font-size="9" fill="#cfd8dc" font-weight="700">DRAM</text><rect x="74" y="32" width="50" height="38" rx="3" fill="url(#ramChip)"/><text x="99" y="55" text-anchor="middle" font-size="9" fill="#cfd8dc" font-weight="700">DRAM</text><rect x="134" y="32" width="50" height="38" rx="3" fill="url(#ramChip)"/><text x="159" y="55" text-anchor="middle" font-size="9" fill="#cfd8dc" font-weight="700">DRAM</text><rect x="206" y="32" width="50" height="38" rx="3" fill="url(#ramChip)"/><text x="231" y="55" text-anchor="middle" font-size="9" fill="#cfd8dc" font-weight="700">DRAM</text><rect x="266" y="32" width="50" height="38" rx="3" fill="url(#ramChip)"/><text x="291" y="55" text-anchor="middle" font-size="9" fill="#cfd8dc" font-weight="700">DRAM</text><rect x="326" y="32" width="50" height="38" rx="3" fill="url(#ramChip)"/><text x="351" y="55" text-anchor="middle" font-size="9" fill="#cfd8dc" font-weight="700">DRAM</text></g><rect x="194" y="38" width="14" height="26" rx="2" fill="#3949ab"/></g><g transform="translate(20,170)"><rect x="0" y="0" width="180" height="22" rx="11" fill="url(#randomGrad)" stroke="#64b5f6"/><text x="90" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">⚡ 随机访问 · 恒定时延</text><rect x="200" y="0" width="180" height="22" rx="11" fill="url(#volatileGrad)" stroke="#ef9a9a"/><text x="290" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">易失 · 掉电数据丢失</text></g></g><g transform="translate(490,86)"><rect x="0" y="0" width="350" height="200" rx="12" fill="url(#cardR)" stroke="#c5cae9" filter="url(#ramShadow)"/><text x="175" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">「随机访问」是什么？</text><g transform="translate(20,46)"><g font-size="10" fill="#37474f"><rect x="0" y="0" width="40" height="30" rx="4" fill="#fff" stroke="#90a4ae"/><text x="20" y="19" text-anchor="middle">0x00</text><rect x="44" y="0" width="40" height="30" rx="4" fill="#fff" stroke="#90a4ae"/><text x="64" y="19" text-anchor="middle">0x01</text><rect x="88" y="0" width="40" height="30" rx="4" fill="#fff" stroke="#90a4ae"/><text x="108" y="19" text-anchor="middle">0x02</text><rect x="132" y="0" width="40" height="30" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.6"/><text x="152" y="19" text-anchor="middle" font-weight="700" fill="#0d47a1">0x03</text><rect x="176" y="0" width="40" height="30" rx="4" fill="#fff" stroke="#90a4ae"/><text x="196" y="19" text-anchor="middle">0x04</text><rect x="220" y="0" width="40" height="30" rx="4" fill="#fff" stroke="#90a4ae"/><text x="240" y="19" text-anchor="middle">0x05</text><rect x="264" y="0" width="40" height="30" rx="4" fill="#fff" stroke="#90a4ae"/><text x="284" y="19" text-anchor="middle">0x06</text></g><path d="M152-22V-2" stroke="#1565c0" stroke-width="1.8" fill="none" marker-end="url(#arrAccess)"/><text x="152" y="45" text-anchor="middle" font-size="10" fill="#0d47a1" font-weight="700">直接寻址</text><g transform="translate(0,58)"><text x="0" y="0" font-size="11" fill="#37474f" font-weight="700">对比：磁带/磁盘 顺序访问</text><g font-size="9" fill="#fff" transform="translate(0,10)"><rect x="0" y="0" width="40" height="22" fill="#a1887f"/><rect x="44" y="0" width="40" height="22" fill="#a1887f"/><rect x="88" y="0" width="40" height="22" fill="#a1887f"/><rect x="132" y="0" width="40" height="22" fill="#a1887f"/><rect x="176" y="0" width="40" height="22" fill="#a1887f"/><rect x="220" y="0" width="40" height="22" fill="#a1887f"/><rect x="264" y="0" width="40" height="22" fill="#a1887f"/><text x="20" y="15" text-anchor="middle">①</text><text x="64" y="15" text-anchor="middle">②</text><text x="108" y="15" text-anchor="middle">③</text><text x="152" y="15" text-anchor="middle">④</text><text x="196" y="15" text-anchor="middle">⑤</text><text x="240" y="15" text-anchor="middle">⑥</text><text x="284" y="15" text-anchor="middle">⑦</text></g><path d="M0 44H3e2" stroke="#5d4037" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/><text x="150" y="58" text-anchor="middle" font-size="10" fill="#5d4037">必须按顺序逐个读取</text></g></g></g><g transform="translate(40,306)"><rect x="0" y="0" width="800" height="234" rx="12" fill="#fff" stroke="#c5cae9" filter="url(#ramShadow)"/><text x="400" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">RAM 的两大分类</text><g transform="translate(24,46)"><rect x="0" y="0" width="370" height="170" rx="10" fill="url(#sramGrad)" stroke="#90caf9" filter="url(#ramShadow)"/><text x="20" y="28" font-size="16" font-weight="800" fill="#0d47a1">SRAM</text><text x="20" y="46" font-size="11" fill="#1565c0">Static RAM · 静态随机存储器</text><g font-size="11" fill="#263238" transform="translate(20,68)"><text x="0" y="0">• 存储单元：<tspan font-weight="700">4-6 个晶体管 (触发器)</tspan></text><text x="0" y="20">• 速度：<tspan font-weight="700">快</tspan></text><text x="0" y="40">• 功耗：静态低</text><text x="0" y="60">• 成本高 · 集成度低 · 容量小</text><text x="0" y="80">• 无需刷新</text></g><g transform="translate(250,80)"><rect x="0" y="0" width="100" height="70" rx="6" fill="#fff" opacity=".95"/><text x="50" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#006064">用途</text><text x="50" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#00838f">CPU Cache</text><text x="50" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#00838f">寄存器</text></g></g><g transform="translate(406,46)"><rect x="0" y="0" width="370" height="170" rx="10" fill="url(#dramGrad)" stroke="#ffcc80" filter="url(#ramShadow)"/><text x="20" y="28" font-size="16" font-weight="800" fill="#e65100">DRAM</text><text x="20" y="46" font-size="11" fill="#ef6c00">Dynamic RAM · 动态随机存储器</text><g font-size="11" fill="#263238" transform="translate(20,68)"><text x="0" y="0">• 存储单元：<tspan font-weight="700">1 晶体管 + 1 电容 (1T1C)</tspan></text><text x="0" y="20">• 速度：较慢</text><text x="0" y="40">• 功耗：刷新带来动态功耗</text><text x="0" y="60">• 成本低 · 集成度高 · 容量大</text><text x="0" y="80">•<tspan font-weight="700">需周期性刷新</tspan>（电容漏电）</text></g><g transform="translate(250,80)"><rect x="0" y="0" width="100" height="70" rx="6" fill="#fff" opacity=".95"/><text x="50" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#4a148c">用途</text><text x="50" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#6a1b9a">主内存</text><text x="50" y="58" text-anchor="middle" font-size="11" font-weight="700" fill="#6a1b9a">显存</text></g></g></g></svg>
