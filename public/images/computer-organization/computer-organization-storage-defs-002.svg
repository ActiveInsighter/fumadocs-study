<svg viewBox="0 0 880 560" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter id="ramShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--sky-ink)"/></marker><marker id="arrAccess" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--violet-deep)"/></marker></defs><rect width="880" height="560" fill="var(--sky-soft)"/><text x="440" y="34" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">RAM · Random-Access Memory 随机存储器</text><text x="440" y="56" text-anchor="middle" font-size="var(--svg-font-size-label)" class="svg-text svg-text-on-light">半导体 · 随机访问 · 易失性 · 运行时存储</text><g transform="translate(40,86)"><rect x="0" y="0" width="430" height="200" rx="12" fill="var(--surface)" stroke="var(--violet-light)" filter="url(#ramShadow)"/><text x="215" y="24" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">内存条 (DIMM) 示意</text><g transform="translate(20,46)"><rect x="0" y="20" width="390" height="80" rx="4" fill="var(--lime-ink)"/><rect x="170" y="92" width="50" height="14" fill="var(--lime-ink)"/><g fill="var(--yellow-mid)"><rect x="6" y="100" width="6" height="14"/><rect x="16" y="100" width="6" height="14"/><rect x="26" y="100" width="6" height="14"/><rect x="36" y="