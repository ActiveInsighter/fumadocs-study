t-on-light">DRAM</text><rect x="206" y="32" width="50" height="38" rx="3" fill="var(--cyan-ink)"/><text x="231" y="55" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">DRAM</text><rect x="266" y="32" width="50" height="38" rx="3" fill="var(--cyan-ink)"/><text x="291" y="55" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">DRAM</text><rect x="326" y="32" width="50" height="38" rx="3" fill="var(--cyan-ink)"/><text x="351" y="55" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">DRAM</text></g><rect x="194" y="38" width="14" height="26" rx="2" fill="var(--violet-deep)"/></g><g transform="translate(20,170)"><rect x="0" y="0" width="180" height="22" rx="11" fill="var(--sky-deep)" stroke="var(--indigo-mid)"/><text x="90" y="16" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">⚡ 随机访问 · 恒定时延</text><rect x="200" y="0" width="180" height="22" rx="11" fill="var(--rose-deep)" stroke="var(--red-mid)"/><text x="290" y="16" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">易失 · 掉电数据丢失</text></g></g><g transform="translate(490,86)"><rect x="0" y="0" width="350" height="200" rx="12" fill="var(--blue-deep)" stroke="var(--violet-light)" filter="url(#ramShadow)"/><text x="175" y="24" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">「随机访问」是什么？</text><g transform="translate(20,46)"><g font-size="var(--svg-font-size-caption)" fill="var(--sky-ink)"><rect x="0" y="0" width="40" height="30" rx="4" fill="var(--surface)" stroke="var(--blue-mid)"/><text x="20" y="19" text-anchor="middle" class="svg-text svg-text-on-light">0x00</text><rect x="44" y="0" width="40" height="30" rx="4" fill="var(--surface)" stroke="var(--blue-mid)"/><text x="64" y="19" text-anchor="middle" class="svg-text svg-text-on-light">0x01</text><rect x="88" y="0" width="40" height="30" rx="4" fill="var(--surface)" stroke="var(--blue-mid)"/><text x="108" y="19" text-anchor="middle" class="svg-text svg-text-on-light">0x02</text><rect x="132" y="0" width="40" height="30" rx="4" fill="var(--sky-light)" stroke="var(--violet-deep)" stroke-width="1.6"/><text x="152" y="19" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">0x03</text><rect x="176" y="0" width="40" height="30" rx="4" fill="var(--surface)" stroke="var(--blue-mid)"/><text x="196" y="19" text-anchor="middle" class="svg-text svg-text-on-light">0x04</text><rect x="220" y="0" width="40" height="30" rx="4" fill="var(--surface)" stroke="var(--blue-mid)"/><text x="240" y="19" text-anchor="middle" class="svg-text svg-text-on-light">0x05</text><rect x="264" y="0" width="40" height="30" rx="4" fill="var(--surface)" stroke="var(--blue-mid)"/><text x="284" y="19" text-anchor="middle" class="svg-text svg-text-on-light">0x06</text></g><path d="M152-22V-2" stroke="var(--violet-deep)" stroke-width="1.8" fill="none" marker-end="url(#arrAccess)"/><text x="152" y="45" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">直接寻址</text><g transform="translate(0,58)"><text x="0" y="0" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">对比：磁带/磁盘 顺序访问</text><g font-size="var(--svg-font-size-caption)" fill="var(--surface)" transform="translate(0,10)"><rect x="0" y="0" width="40" height="22" fill="var(--ink-soft)"/><rect x="44" y="0" width="40" height="22" fill="var(--ink-soft)"/><rect x="88" y="0" width="40" height="22" fill="var(--ink-soft)"/><rect x="132" y="0" width="40" height="22" fill="var(--ink-soft)"/><rect x="176" y="0" width="40" height="22" fill="var(--ink-soft)"/><rect x="220" y="0" width="40" height="22" fill="var(--ink-soft)"/><rect x="264" y="0" width="40" height="22" fill="var(--ink-soft)"/><text x="20" y="15" text-anchor="middle" class="svg-text svg-text-on-dark">①</text><text x="64" y="15" text-anchor="middle" class="svg-text svg-text-on-dark">②</text><text x="108" y="15" text-anchor="middle" class="svg-text svg-text-on-dark">③</text><text x="152" y="15" text-anchor="middle" class="svg-text svg-text-on-dark">④</text><text x="196" y="15" text-anchor="middle" class="svg-text svg-text-on-dark">⑤</text><text x="240" y="15" text-anchor="middle" class="svg-text svg-text-on-dark">⑥</text><text x="284" y="15" text-anchor="middle" class="svg-text svg-text-on-dark">⑦</text></g><path d="M0 44H3e2" stroke="var(--coral-ink)" stroke-width="1.5" fill="none" marker-end="url(#arrR)"/><text x="150" y="58" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">必须按顺序逐个读取</text></g></g></g><g transform="translate(40,306)"><rect x="0" y="0" width="800" height="234" rx="12" fill="var(--surface)" stroke="var(--violet-light)" filter="url(#ramShadow)"/><text x="400" y="26" text-anchor="middle" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">RAM 的两大分类</text><g transform="translate(24,46)"><rect x="0" y="0" width="370" height="170" rx="10" fill="var(--blue-deep)" stroke="var(--blue-mid)" filter="url(#ramShadow)"/><text x="20" y="28" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">SRAM</text><text x="20" y="46" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">Static RAM · 静态随机存储器</text><g font-size="var(--svg-font-size-caption)" fill="var(--cyan-ink)" transform="translate(20,68)"><text x="0" y="0" class="svg-text svg-text-on-light">• 存储单元：<tspan font-weight="var(--svg-font-weight-bold)">4-6 个晶体管 (触发器)</tspan></text><text x="0" y="20" class="svg-text svg-text-on-light">• 速度：<tspan font-weight="var(--svg-font-weight-bold)">快</tspan></text><text x="0" y="40" class="svg-text svg-text-on-light">• 功耗：静态低</text><text x="0" y="60" class="svg-text svg-text-on-light">• 成本高 · 集成度低 · 容量小</text><text x="0" y="80" class="svg-text svg-text-on-light">• 无需刷新</text></g><g transform="translate(250,80)"><rect x="0" y="0" width="100" height="70" rx="6" fill="var(--surface)" opacity=".95"/><text x="50" y="20" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">用途</text><text x="50" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">CPU Cache</text><text x="50" y="58" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">寄存器</text></g></g><g transform="translate(406,46)"><rect x="0" y="0" width="370" height="170" rx="10" fill="var(--surface)" stroke="var(--amber-mid)" filter="url(#ramShadow)"/><text x="20" y="28" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">DRAM</text><text x="20" y="46" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">Dynamic RAM · 动态随机存储器</text><g font-size="var(--svg-font-size-caption)" fill="var(--cyan-ink)" transform="translate(20,68)"><text x="0" y="0" class="svg-text svg-text-on-light">• 存储单元：<tspan font-weight="var(--svg-font-weight-bold)">1 晶体管 + 1 电容 (1T1C)</tspan></text><text x="0" y="20" class="svg-text svg-text-on-light">• 速度：较慢</text><text x="0" y="40" class="svg-text svg-text-on-light">• 功耗：刷新带来动态功耗</text><text x="0" y="60" class="svg-text svg-text-on-light">• 成本低 · 集成度高 · 容量大</text><text x="0" y="80" class="svg-text svg-text-on-light">•<tspan font-weight="var(--svg-font-weight-bold)">需周期性刷新</tspan>（电容漏电）</text></g><g transform="translate(250,80)"><rect x="0" y="0" width="100" height="70" rx="6" fill="var(--surface)" opacity=".95"/><text x="50" y="20" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">用途</text><text x="50" y="40" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">主内存</text><text x="50" y="58" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">显存</text></g></g></g></svg>
