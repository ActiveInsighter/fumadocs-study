<svg viewBox="0 0 880 460" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gCore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="100%" stop-color="#2f52c9"/></linearGradient><linearGradient id="gPerf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5b"/><stop offset="100%" stop-color="#e5643a"/></linearGradient><linearGradient id="gCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fbf87"/><stop offset="100%" stop-color="#2a9e6c"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".12"/></filter></defs><g filter="url(#sh)"><rect x="340" y="30" width="200" height="70" rx="10" fill="url(#gCore)"/><text x="440" y="60" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">多模块存储器</text><text x="440" y="82" text-anchor="middle" fill="#e6ecff" font-size="12">多个结构相同的存储模块 → 主存系统</text></g><g transform="translate(650,30)" opacity=".95"><g fill="#c9d3ee" stroke="#5a6ea3" stroke-width="1"><rect x="0" y="0" width="30" height="18" rx="2"/><rect x="36" y="0" width="30" height="18" rx="2"/><rect x="72" y="0" width="30" height="18" rx="2"/><rect x="108" y="0" width="30" height="18" rx="2"/><rect x="0" y="24" width="30" height="18" rx="2"/><rect x="36" y="24" width="30" height="18" rx="2"/><rect x="72" y="24" width="30" height="18" rx="2"/><rect x="108" y="24" width="30" height="18" rx="2"/></g><text x="69" y="60" text-anchor="middle" fill="#5a6ea3" font-size="11">若干存储模块</text></g><text x="440" y="130" text-anchor="middle" fill="#4a5872" font-size="13">按设计目标分为两类</text><path d="M440 1e2v45L220 175m220-30 220 30" fill="none" stroke="#9aa6c3" stroke-width="1.6"/><g filter="url(#sh)"><rect x="80" y="175" width="280" height="52" rx="8" fill="url(#gPerf)"/><text x="220" y="200" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">提升访问性能（带宽 / 吞吐率）</text><text x="220" y="217" text-anchor="middle" fill="#fff2e8" font-size="11">扩大一次访问的数据量或并行处理请求</text></g><g filter="url(#sh)"><rect x="520" y="175" width="280" height="52" rx="8" fill="url(#gCap)"/><text x="660" y="200" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">扩大主存容量（字长 / 字数）</text><text x="660" y="217" text-anchor="middle" fill="#e6f8ee" font-size="11">连接多个芯片，突破单芯片规格限制</text></g><path d="M220 227v23l-90 15m90-15 90 15" fill="none" stroke="#e5643a" stroke-width="1.4" opacity=".7"/><g><rect x="30" y="265" width="200" height="46" rx="6" fill="#fff" stroke="#e5643a" stroke-width="1.4"/><text x="130" y="284" text-anchor="middle" fill="#2b2f3a" font-size="13" font-weight="600">单体多字存储器</text><text x="130" y="301" text-anchor="middle" fill="#5c6474" font-size="11">一个地址存放 n 个连续字</text></g><g><rect x="250" y="265" width="200" height="46" rx="6" fill="#fff" stroke="#e5643a" stroke-width="1.4"/><text x="350" y="284" text-anchor="middle" fill="#2b2f3a" font-size="13" font-weight="600">多体交叉存储器</text><text x="350" y="301" text-anchor="middle" fill="#5c6474" font-size="11">多个存储体并行 / 交替工作</text></g><path d="M350 311v19l-70 15m70-15 70 15" fill="none" stroke="#e5643a" stroke-width="1.2" opacity=".55"/><g><rect x="200" y="345" width="160" height="36" rx="6" fill="#fff5ef" stroke="#e5643a" stroke-width="1"/><text x="280" y="368" text-anchor="middle" fill="#5c3b23" font-size="12">高位交叉编址（串行）</text></g><g><rect x="370" y="345" width="160" height="36" rx="6" fill="#fff5ef" stroke="#e5643a" stroke-width="1"/><text x="450" y="368" text-anchor="middle" fill="#5c3b23" font-size="12">低位交叉编址（并行）</text></g><path d="M660 227v23L560 265m1e2-15v15m0-15 1e2 15" fill="none" stroke="#2a9e6c" stroke-width="1.4" opacity=".7"/><g><rect x="470" y="265" width="180" height="46" rx="6" fill="#fff" stroke="#2a9e6c" stroke-width="1.4"/><text x="560" y="284" text-anchor="middle" fill="#2b2f3a" font-size="13" font-weight="600">位扩展</text><text x="560" y="301" text-anchor="middle" fill="#5c6474" font-size="11">扩展字长（低位编址）</text></g><g><rect x="670" y="265" width="180" height="46" rx="6" fill="#fff" stroke="#2a9e6c" stroke-width="1.4"/><text x="760" y="284" text-anchor="middle" fill="#2b2f3a" font-size="13" font-weight="600">字扩展</text><text x="760" y="301" text-anchor="middle" fill="#5c6474" font-size="11">扩展字数（高位编址）</text></g><g><rect x="570" y="325" width="180" height="46" rx="6" fill="#fff" stroke="#2a9e6c" stroke-width="1.4"/><text x="660" y="344" text-anchor="middle" fill="#2b2f3a" font-size="13" font-weight="600">字位扩展</text><text x="660" y="361" text-anchor="middle" fill="#5c6474" font-size="11">同时扩展字长与字数</text></g><path d="M560 311v14l10 15m190-29v14l-10 15" fill="none" stroke="#2a9e6c" stroke-width="1.2" opacity=".55"/><g><rect x="60" y="405" width="760" height="40" rx="8" fill="#f4f6fb" stroke="#c7cee0" stroke-width="1"/><circle cx="90" cy="425" r="6" fill="url(#gPerf)"/><text x="105" y="430" fill="#3d4359" font-size="12">左侧：不增加容量，靠并行 / 宽数据通路提升访存效率</text><circle cx="470" cy="425" r="6" fill="url(#gCap)"/><text x="485" y="430" fill="#3d4359" font-size="12">右侧：不改变访存速度，靠拼接芯片扩大总容量或字长</text></g></svg>
