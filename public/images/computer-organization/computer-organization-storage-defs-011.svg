<svg viewBox="0 0 880 580" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="100%" stop-color="#e8eef7"/></linearGradient><linearGradient id="chip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eceff1"/><stop offset="100%" stop-color="#cfd8dc"/></linearGradient><linearGradient id="badgeNV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#43a047"/><stop offset="100%" stop-color="#1b5e20"/></linearGradient><linearGradient id="badgeRead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e88e5"/><stop offset="100%" stop-color="#0d47a1"/></linearGradient><linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="100%" stop-color="#eef2fb"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#455a64"/></marker></defs><rect width="880" height="580" fill="url(#bg)"/><text x="440" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a237e">ROM · Read-Only Memory 只读存储器</text><text x="440" y="58" text-anchor="middle" font-size="12" fill="#546e7a">非易失性 · 主要用于读取 · 存放固件与启动程序</text><g transform="translate(50,90)"><rect x="20" y="40" width="260" height="180" rx="10" fill="url(#chip)" stroke="#b0bec5" filter="url(#shadow)"/><text x="150" y="130" text-anchor="middle" font-size="28" font-weight="800" fill="#e65100" letter-spacing="6">ROM</text><text x="150" y="158" text-anchor="middle" font-size="11" fill="#37474f">BIOS / Firmware</text><g fill="#90a4ae"><rect x="6" y="60" width="16" height="6" rx="1"/><rect x="6" y="80" width="16" height="6" rx="1"/><rect x="6" y="100" width="16" height="6" rx="1"/><rect x="6" y="120" width="16" height="6" rx="1"/><rect x="6" y="140" width="16" height="6" rx="1"/><rect x="6" y="160" width="16" height="6" rx="1"/><rect x="6" y="180" width="16" height="6" rx="1"/><rect x="6" y="200" width="16" height="6" rx="1"/></g><g fill="#90a4ae"><rect x="278" y="60" width="16" height="6" rx="1"/><rect x="278" y="80" width="16" height="6" rx="1"/><rect x="278" y="100" width="16" height="6" rx="1"/><rect x="278" y="120" width="16" height="6" rx="1"/><rect x="278" y="140" width="16" height="6" rx="1"/><rect x="278" y="160" width="16" height="6" rx="1"/><rect x="278" y="180" width="16" height="6" rx="1"/><rect x="278" y="200" width="16" height="6" rx="1"/></g><circle cx="40" cy="56" r="4" fill="#263238" stroke="#455a64"/><g transform="translate(20,240)"><rect x="0" y="0" width="120" height="30" rx="15" fill="url(#badgeNV)"/><text x="60" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">非易失性</text></g><g transform="translate(150,240)"><rect x="0" y="0" width="130" height="30" rx="15" fill="url(#badgeRead)"/><text x="65" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">以读为主</text></g><g transform="translate(10,290)"><text x="0" y="0" font-size="12" font-weight="600" fill="#263238">断电后数据保留</text><g transform="translate(0,12)"><rect x="0" y="0" width="135" height="40" rx="6" fill="#fff" stroke="#cfd8dc"/><text x="14" y="26" font-size="14">⚡</text><text x="30" y="26" font-size="11" fill="#37474f">断电</text><path d="M62 20H80" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/><text x="86" y="26" font-size="11" fill="#2e7d32" font-weight="700">数据仍在</text></g><g transform="translate(140,12)"><rect x="0" y="0" width="140" height="40" rx="6" fill="#fff" stroke="#cfd8dc"/><text x="10" y="26" font-size="14">✎</text><text x="26" y="26" font-size="11" fill="#37474f">写入</text><path d="M58 20H78" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/><text x="84" y="26" font-size="11" fill="#c62828" font-weight="700">受限/不可</text></g></g></g><g transform="translate(370,82)"><rect x="0" y="0" width="470" height="180" rx="10" fill="url(#cardA)" stroke="#cfd8dc" filter="url(#shadow)"/><text x="20" y="26" font-size="14" font-weight="700" fill="#1a237e">ROM vs RAM</text><g transform="translate(20,40)"><rect x="120" y="0" width="150" height="26" rx="6" fill="#1e88e5"/><text x="195" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ROM</text><rect x="280" y="0" width="150" height="26" rx="6" fill="#9e9e9e"/><text x="355" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">RAM</text></g><g font-size="11.5" fill="#37474f" transform="translate(20,82)"><text x="0" y="0" font-weight="600">易失性</text><text x="195" y="0" text-anchor="middle" fill="#2e7d32" font-weight="700">否（持久）</text><text x="355" y="0" text-anchor="middle" fill="#c62828" font-weight="700">是（掉电丢失）</text><text x="0" y="22" font-weight="600">读写</text><text x="195" y="22" text-anchor="middle">主要只读</text><text x="355" y="22" text-anchor="middle">可随机读写</text><text x="0" y="44" font-weight="600">典型用途</text><text x="195" y="44" text-anchor="middle">固件 / BIOS</text><text x="355" y="44" text-anchor="middle">运行时数据</text><text x="0" y="66" font-weight="600">容量</text><text x="195" y="66" text-anchor="middle">较小</text><text x="355" y="66" text-anchor="middle">较大</text></g></g><g transform="translate(370,290)"><text x="0" y="0" font-size="14" font-weight="700" fill="#1a237e">ROM 家族 (Evolution)</text><line x1="20" y1="40" x2="450" y2="40" stroke="#b0bec5" stroke-width="2" stroke-dasharray="4 4"/><g transform="translate(20,16)"><circle cx="0" cy="24" r="10" fill="#90a4ae"/><text x="0" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">M</text><rect x="-40" y="44" width="92" height="60" rx="8" fill="#fff" stroke="#cfd8dc"/><text x="6" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#263238">MROM</text><text x="6" y="78" text-anchor="middle" font-size="10" fill="#546e7a">掩膜式</text><text x="6" y="92" text-anchor="middle" font-size="10" fill="#546e7a">出厂固化</text></g><g transform="translate(130,16)"><circle cx="0" cy="24" r="10" fill="#7e57c2"/><text x="0" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">P</text><rect x="-40" y="44" width="92" height="60" rx="8" fill="#fff" stroke="#cfd8dc"/><text x="6" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#263238">PROM</text><text x="6" y="78" text-anchor="middle" font-size="10" fill="#546e7a">一次可编程</text><text x="6" y="92" text-anchor="middle" font-size="10" fill="#546e7a">熔丝烧写</text></g><g transform="translate(240,16)"><circle cx="0" cy="24" r="10" fill="#ef6c00"/><text x="0" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">E</text><rect x="-40" y="44" width="92" height="60" rx="8" fill="#fff3e0" stroke="#ffb74d"/><text x="6" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#bf360c">EPROM</text><text x="6" y="78" text-anchor="middle" font-size="10" fill="#6d4c41">紫外线擦除</text><text x="6" y="92" text-anchor="middle" font-size="10" fill="#6d4c41">可重复编程</text></g><g transform="translate(350,16)"><circle cx="0" cy="24" r="10" fill="#00897b"/><text x="0" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">EE</text><rect x="-44" y="44" width="100" height="60" rx="8" fill="#e0f2f1" stroke="#4db6ac"/><text x="6" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#004d40">EEPROM</text><text x="6" y="78" text-anchor="middle" font-size="10" fill="#37474f">电擦写</text><text x="6" y="92" text-anchor="middle" font-size="10" fill="#37474f">字节级可改</text></g><g transform="translate(450,16)"><circle cx="0" cy="24" r="10" fill="#d81b60"/><text x="0" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">F</text><rect x="-46" y="44" width="92" height="60" rx="8" fill="#fce4ec" stroke="#f06292"/><text x="0" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#880e4f">Flash</text><text x="0" y="78" text-anchor="middle" font-size="10" fill="#4a148c">块擦写</text><text x="0" y="92" text-anchor="middle" font-size="10" fill="#4a148c">SSD / U盘</text></g></g><g transform="translate(50,470)"><rect x="0" y="0" width="780" height="76" rx="10" fill="#fff" stroke="#cfd8dc" filter="url(#shadow)"/><text x="16" y="22" font-size="13" font-weight="700" fill="#1a237e">典型场景 · 开机加电后</text><g transform="translate(20,38)"><rect x="0" y="0" width="120" height="30" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="60" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">CPU 加电</text><path d="M124 15h32" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/><rect x="160" y="0" width="150" height="30" rx="6" fill="#fff3e0" stroke="#ef6c00"/><text x="235" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#bf360c">从 ROM 读取 BIOS</text><path d="M314 15h32" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/><rect x="350" y="0" width="160" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32"/><text x="430" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">硬件自检 / 引导</text><path d="M514 15h32" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/><rect x="550" y="0" width="190" height="30" rx="6" fill="#f3e5f5" stroke="#8e24aa"/><text x="645" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#4a148c">加载操作系统至 RAM</text></g></g></svg>
