<svg viewBox="0 0 880 580" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--paper)"/><stop offset="100%" stop-color="var(--blue-soft)"/></linearGradient><linearGradient id="chip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--neutral-soft)"/><stop offset="100%" stop-color="var(--cyan-light)"/></linearGradient><linearGradient id="badgeNV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--lime-mid)"/><stop offset="100%" stop-color="var(--lime-deep)"/></linearGradient><linearGradient id="badgeRead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--violet-mid)"/><stop offset="100%" stop-color="var(--violet-deep)"/></linearGradient><linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--surface)"/><stop offset="100%" stop-color="var(--blue-soft)"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--sky-deep)"/></marker></defs><rect width="880" height="580" fill="url(#bg)"/><text x="440" y="36" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" fill="var(--purple-deep)">ROM · Read-Only Memory 只读存储器</text><text x="440" y="58" text-anchor="middle" font-size="var(--svg-font-size-label)" fill="var(--sky-deep)">非易失性 · 主要用于读取 · 存放固件与启动程序</text><g transform="translate(50,90)"><rect x="20" y=