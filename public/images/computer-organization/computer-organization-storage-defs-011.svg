<svg viewBox="0 0 880 580" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feOffset dx="0" dy="2" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--sky-deep)"/></marker></defs><rect width="880" height="580" fill="var(--blue-soft)"/><text x="440" y="36" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">ROM · Read-Only Memory 只读存储器</text><text x="440" y="58" text-anchor="middle" font-size="var(--svg-font-size-label)" class="svg-text svg-text-on-light">非易失性 · 主要用于读取 · 存放固件与启动程序</text><g transform="translate(50,90)"><rect x="20" y="40" width="260" height="180" rx="10" fill="var(--neutral-deep)" stroke="var(--cyan-mid)" filter="url(#shadow)"/><text x="150" y="130" text-anchor="middle" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" letter-spacing="6" class="svg-text svg-text-on-dark">ROM</text><text x="150" y="158" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-dark">BIOS / Firmware</text><g fill="var(--blue-mid)"><rect x="6" y="60" width="16" height="6" rx="1"/><rect x="6" y="80" width="16" height="6" rx="1"/><rect x="6" y="100" width="16" height="6" rx="1"/><rect x="6" y="120" width="16" height="6" rx="1"/><rect x="6" y="140" width="16" height="6" rx="1"/><rect x="6" y="160" width="16" height="6" rx="1"/><rect x="6" y="180" width="16" height="6" rx="1"/><rect x="6" y="200" width="16" height="6" rx="1"/></g><g fill="var(--blue-mid)"><rect x="278" y="60" width="16" height="6" rx="1"/><rect x="278" y="80" width="16" height="6" rx="1"/><rect x="278" y="100" width="16" height="6" rx="1"/><rect x="278" y="120" width="16" height="6" rx="1"/><rect x="278" y="140" width="16" height="6" rx="1"/><rect x="278" y="160" width="16" height="6" rx="1"/><rect x="278" y="180" width="16" height="6" rx="1"/><rect x="278" y="200" width="16" height="6" rx="1"/></g><circle cx="40" cy="56" r="4" fill="var(--cyan-ink)" stroke="var(--sky-deep)"/><g transform="translate(20,240)"><rect x="0" y="0" width="120" height="30" rx="15" fill="var(--lime-deep)"/><text x="60" y="20" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">非易失性</text></g><g transform="translate(150,240)"><rect x="0" y="0" width="130" height="30" rx="15" fill="var(--violet-deep)"/><text x="65" y="20" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">以读为主</text></g><g transform="translate(10,290)"><text x="0" y="0" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-light">断电后数据保留</text><g transform="translate(0,12)"><rect x="0" y="0" width="135" height="40" rx="6" fill="var(--surface)" stroke="var(--cyan-light)"/><text x="14" y="26" font-size="var(--svg-font-size-body)" class="svg-text svg-text-on-light">⚡</text><text x="30" y="26" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">断电</text><path d="M62 20H80" stroke="var(--sky-deep)" stroke-width="1.5" marker-end="url(#arr)"/><text x="86" y="26" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">数据仍在</text></g><g transform="translate(140,12)"><rect x="0" y="0" width="140" height="40" rx="6" fill="var(--surface)" stroke="var(--cyan-light)"/><text x="10" y="26" font-size="var(--svg-font-size-body)" class="svg-text svg-text-on-light">✎</text><text x="26" y="26" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">写入</text><path d="M58 20H78" stroke="var(--sky-deep)" stroke-width="1.5" marker-end="url(#arr)"/><text x="84" y="26" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">受限/不可</text></g></g></g><g transform="translate(370,82)"><rect x="0" y="0" width="470" height="180" rx="10" fill="var(--blue-deep)" stroke="var(--cyan-light)" filter="url(#shadow)"/><text x="20" y="26" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">ROM vs RAM</text><g transform="translate(20,40)"><rect x="120" y="0" width="150" height="26" rx="6" fill="var(--violet-mid)"/><text x="195" y="18" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">ROM</text><rect x="280" y="0" width="150" height="26" rx="6" fill="var(--neutral-mid)"/><text x="355" y="18" text-anchor="middle" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">RAM</text></g><g font-size="var(--svg-font-size-label)" fill="var(--sky-ink)" transform="translate(20,82)"><text x="0" y="0" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-dark">易失性</text><text x="195" y="0" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">否（持久）</text><text x="355" y="0" text-anchor="middle" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">是（掉电丢失）</text><text x="0" y="22" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-dark">读写</text><text x="195" y="22" text-anchor="middle" class="svg-text svg-text-on-dark">主要只读</text><text x="355" y="22" text-anchor="middle" class="svg-text svg-text-on-dark">可随机读写</text><text x="0" y="44" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-dark">典型用途</text><text x="195" y="44" text-anchor="middle" class="svg-text svg-text-on-dark">固件 / BIOS</text><text x="355" y="44" text-anchor="middle" class="svg-text svg-text-on-dark">运行时数据</text><text x="0" y="66" font-weight="var(--svg-font-weight-semibold)" class="svg-text svg-text-on-dark">容量</text><text x="195" y="66" text-anchor="middle" class="svg-text svg-text-on-dark">较小</text><text x="355" y="66" text-anchor="middle" class="svg-text svg-text-on-dark">较大</text></g></g><g transform="translate(370,290)"><text x="0" y="0" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">ROM 家族 (Evolution)</text><line x1="20" y1="40" x2="450" y2="40" stroke="var(--cyan-mid)" stroke-width="2" stroke-dasharray="4 4"/><g transform="translate(20,16)"><circle cx="0" cy="24" r="10" fill="var(--blue-mid)"/><text x="0" y="28" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">M</text><rect x="-40" y="44" width="92" height="60" rx="8" fill="var(--surface)" stroke="var(--cyan-light)"/><text x="6" y="62" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">MROM</text><text x="6" y="78" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">掩膜式</text><text x="6" y="92" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">出厂固化</text></g><g transform="translate(130,16)"><circle cx="0" cy="24" r="10" fill="var(--purple-deep)"/><text x="0" y="28" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">P</text><rect x="-40" y="44" width="92" height="60" rx="8" fill="var(--surface)" stroke="var(--cyan-light)"/><text x="6" y="62" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">PROM</text><text x="6" y="78" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">一次可编程</text><text x="6" y="92" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">熔丝烧写</text></g><g transform="translate(240,16)"><circle cx="0" cy="24" r="10" fill="var(--orange-mid)"/><text x="0" y="28" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">E</text><rect x="-40" y="44" width="92" height="60" rx="8" fill="var(--yellow-soft)" stroke="var(--yellow-mid)"/><text x="6" y="62" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">EPROM</text><text x="6" y="78" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">紫外线擦除</text><text x="6" y="92" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">可重复编程</text></g><g transform="translate(350,16)"><circle cx="0" cy="24" r="10" fill="var(--mint-deep)"/><text x="0" y="28" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">EE</text><rect x="-44" y="44" width="100" height="60" rx="8" fill="var(--cyan-soft)" stroke="var(--mint-mid)"/><text x="6" y="62" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">EEPROM</text><text x="6" y="78" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">电擦写</text><text x="6" y="92" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">字节级可改</text></g><g transform="translate(450,16)"><circle cx="0" cy="24" r="10" fill="var(--red-deep)"/><text x="0" y="28" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-dark">F</text><rect x="-46" y="44" width="92" height="60" rx="8" fill="var(--rose-soft)" stroke="var(--rose-mid)"/><text x="0" y="62" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">Flash</text><text x="0" y="78" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">块擦写</text><text x="0" y="92" text-anchor="middle" font-size="var(--svg-font-size-caption)" class="svg-text svg-text-on-light">SSD / U盘</text></g></g><g transform="translate(50,470)"><rect x="0" y="0" width="780" height="76" rx="10" fill="var(--surface)" stroke="var(--cyan-light)" filter="url(#shadow)"/><text x="16" y="22" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">典型场景 · 开机加电后</text><g transform="translate(20,38)"><rect x="0" y="0" width="120" height="30" rx="6" fill="var(--sky-soft)" stroke="var(--violet-mid)"/><text x="60" y="20" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">CPU 加电</text><path d="M124 15h32" stroke="var(--sky-deep)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="160" y="0" width="150" height="30" rx="6" fill="var(--yellow-soft)" stroke="var(--orange-mid)"/><text x="235" y="20" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">从 ROM 读取 BIOS</text><path d="M314 15h32" stroke="var(--sky-deep)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="350" y="0" width="160" height="30" rx="6" fill="var(--green-soft)" stroke="var(--lime-deep)"/><text x="430" y="20" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">硬件自检 / 引导</text><path d="M514 15h32" stroke="var(--sky-deep)" stroke-width="1.5" marker-end="url(#arr)"/><rect x="550" y="0" width="190" height="30" rx="6" fill="var(--purple-soft)" stroke="var(--purple-deep)"/><text x="645" y="20" text-anchor="middle" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" class="svg-text svg-text-on-light">加载操作系统至 RAM</text></g></g></svg>
