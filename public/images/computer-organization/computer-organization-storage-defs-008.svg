<svg viewBox="0 0 900 540" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#444"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c0392b"/></marker><marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1e8449"/></marker></defs><g transform="translate(30,30)"><rect x="0" y="0" width="400" height="220" fill="#fff8e7" stroke="#b9770e" stroke-width="1.2" rx="8"/><text x="200" y="24" text-anchor="middle" font-weight="bold" fill="#8a5a06">① 问题：电容漏电，数据会消失</text><g transform="translate(30,60)"><text x="30" y="0" text-anchor="middle" font-size="12" fill="#555">刚写入</text><line x1="10" y1="20" x2="50" y2="20" stroke="#333" stroke-width="2.5"/><line x1="10" y1="34" x2="50" y2="34" stroke="#333" stroke-width="2.5"/><line x1="30" y1="8" x2="30" y2="20" stroke="#333" stroke-width="1.5"/><line x1="30" y1="34" x2="30" y2="46" stroke="#333" stroke-width="1.5"/><text x="30" y="30" text-anchor="middle" font-size="11" fill="#c0392b">+ + +</text><text x="30" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">1 (满电荷)</text></g><g transform="translate(90,90)"><line x1="0" y1="0" x2="60" y2="0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrRed)"/><text x="30" y="-6" text-anchor="middle" font-size="11" fill="#c0392b">时间流逝</text><text x="30" y="16" text-anchor="middle" font-size="11" fill="#c0392b">电容漏电</text></g><g transform="translate(160,60)"><text x="30" y="0" text-anchor="middle" font-size="12" fill="#555">几十 ms 后</text><line x1="10" y1="20" x2="50" y2="20" stroke="#333" stroke-width="2.5"/><line x1="10" y1="34" x2="50" y2="34" stroke="#333" stroke-width="2.5"/><line x1="30" y1="8" x2="30" y2="20" stroke="#333" stroke-width="1.5"/><line x1="30" y1="34" x2="30" y2="46" stroke="#333" stroke-width="1.5"/><text x="30" y="30" text-anchor="middle" font-size="11" fill="#c0392b">+</text><text x="30" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">? (电荷不足)</text></g><g transform="translate(240,60)"><text x="70" y="0" text-anchor="middle" font-size="12" fill="#555">电荷 vs 时间</text><line x1="10" y1="90" x2="140" y2="90" stroke="#666"/><line x1="10" y1="10" x2="10" y2="90" stroke="#666"/><text x="10" y="105" text-anchor="middle" font-size="10" fill="#666">0</text><text x="150" y="94" font-size="10" fill="#666">t</text><text x="4" y="14" text-anchor="end" font-size="10" fill="#666">Q</text><path d="M10 15Q55 30 90 60t50 28" stroke="#c0392b" stroke-width="2" fill="none"/><line x1="10" y1="55" x2="140" y2="55" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/><text x="142" y="58" font-size="10" fill="#999">阈值</text><text x="70" y="130" text-anchor="middle" font-size="11" fill="#c0392b">跌破阈值 → 无法判定 0/1</text></g></g><g transform="translate(470,30)"><rect x="0" y="0" width="400" height="220" fill="#e8f8f0" stroke="#1e8449" stroke-width="1.2" rx="8"/><text x="200" y="24" text-anchor="middle" font-weight="bold" fill="#186a3b">② 解决：由内存控制器周期性刷新</text><g transform="translate(20,50)"><rect x="0" y="0" width="110" height="46" fill="#fff" stroke="#1e8449" stroke-width="1.5" rx="6"/><text x="55" y="20" text-anchor="middle" font-weight="bold" fill="#186a3b">内存控制器</text><text x="55" y="36" text-anchor="middle" font-size="11" fill="#555">Memory Controller</text></g><line x1="130" y1="73" x2="200" y2="73" stroke="#1e8449" stroke-width="1.5" marker-end="url(#arrGreen)"/><text x="165" y="66" text-anchor="middle" font-size="11" fill="#186a3b">发出刷新命令</text><g transform="translate(210,50)"><rect x="0" y="0" width="170" height="46" fill="#fff" stroke="#1e8449" stroke-width="1.5" rx="6"/><text x="85" y="20" text-anchor="middle" font-weight="bold" fill="#186a3b">DRAM 阵列</text><text x="85" y="36" text-anchor="middle" font-size="11" fill="#555">在规定时间内每行刷新一次</text></g><g transform="translate(30,120)"><text x="0" y="0" font-weight="bold" font-size="12" fill="#186a3b">刷新本质：读出一行 → 感应放大 → 写回同一行</text><g transform="translate(0,16)"><rect x="0" y="0" width="88" height="60" fill="#fff" stroke="#7f8c8d" rx="4"/><text x="44" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">1. 读取</text><text x="44" y="34" text-anchor="middle" font-size="10" fill="#666">激活字线</text><text x="44" y="48" text-anchor="middle" font-size="10" fill="#666">读出微弱信号</text></g><line x1="90" y1="46" x2="110" y2="46" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/><g transform="translate(112,16)"><rect x="0" y="0" width="98" height="60" fill="#fff" stroke="#7f8c8d" rx="4"/><text x="49" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">2. 感应放大</text><text x="49" y="34" text-anchor="middle" font-size="10" fill="#666">Sense Amplifier</text><text x="49" y="48" text-anchor="middle" font-size="10" fill="#666">恢复为 0/1</text></g><line x1="212" y1="46" x2="232" y2="46" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/><g transform="translate(234,16)"><rect x="0" y="0" width="98" height="60" fill="#fff" stroke="#7f8c8d" rx="4"/><text x="49" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">3. 写回</text><text x="49" y="34" text-anchor="middle" font-size="10" fill="#666">重新充电到</text><text x="49" y="48" text-anchor="middle" font-size="10" fill="#666">满电荷状态</text></g></g></g><g transform="translate(30,280)"><rect x="0" y="0" width="840" height="250" fill="#eef4fb" stroke="#2c6da3" stroke-width="1.2" rx="8"/><text x="420" y="24" text-anchor="middle" font-weight="bold" fill="#1e4a70">③ 刷新单位是"行"：同一字线上的所有 Cell 一次性刷新</text><g transform="translate(40,50)"><text x="-48" y="14" text-anchor="end" font-size="11" fill="#c0392b" font-weight="bold">字线</text><g id="matrix"><rect x="0" y="0" width="360" height="160" fill="#fff" stroke="#2c6da3" stroke-width="1.5"/><g stroke="#c8d4e0" stroke-width=".8"><line x1="45" y1="0" x2="45" y2="160"/><line x1="90" y1="0" x2="90" y2="160"/><line x1="135" y1="0" x2="135" y2="160"/><line x1="180" y1="0" x2="180" y2="160"/><line x1="225" y1="0" x2="225" y2="160"/><line x1="270" y1="0" x2="270" y2="160"/><line x1="315" y1="0" x2="315" y2="160"/></g><g stroke="#c8d4e0" stroke-width=".8"><line x1="0" y1="20" x2="360" y2="20"/><line x1="0" y1="40" x2="360" y2="40"/><line x1="0" y1="60" x2="360" y2="60"/><line x1="0" y1="80" x2="360" y2="80"/><line x1="0" y1="100" x2="360" y2="100"/><line x1="0" y1="120" x2="360" y2="120"/><line x1="0" y1="140" x2="360" y2="140"/></g><rect x="0" y="60" width="360" height="20" fill="#f39c12" opacity=".55"/><g fill="#b9770e"><circle cx="22" cy="70" r="4"/><circle cx="67" cy="70" r="4"/><circle cx="112" cy="70" r="4"/><circle cx="157" cy="70" r="4"/><circle cx="202" cy="70" r="4"/><circle cx="247" cy="70" r="4"/><circle cx="292" cy="70" r="4"/><circle cx="337" cy="70" r="4"/></g><g font-size="10" fill="#666" text-anchor="end"><text x="-4" y="14">Row 0</text><text x="-4" y="34">Row 1</text><text x="-4" y="54">Row 2</text><text x="-4" y="74" font-weight="bold" fill="#b9770e">Row 3 ★</text><text x="-4" y="94">Row 4</text><text x="-4" y="114">...</text><text x="-2" y="134">Row n-2</text><text x="-2" y="154">Row n-1</text></g><rect x="0" y="170" width="360" height="22" fill="#dfe8f2" stroke="#2c6da3" stroke-width="1"/><text x="180" y="185" text-anchor="middle" font-size="11" fill="#1e4a70" font-weight="bold">感应放大器阵列 (Sense Amplifier Row)</text><text x="180" y="-6" text-anchor="middle" font-size="11" fill="#1e4a70" font-weight="bold">位线 → 每列一条</text></g></g><g transform="translate(440,60)"><text x="0" y="0" font-weight="bold" fill="#1e4a70">为什么按行刷新？</text><text x="0" y="22" font-size="12" fill="#333">• 同一行的所有 Cell 共享一条<tspan fill="#c0392b" font-weight="bold">字线</tspan></text><text x="0" y="42" font-size="12" fill="#333">• 激活一次字线，整行 Cell 全部导通</text><text x="0" y="62" font-size="12" fill="#333">• 每列的感应放大器同时读出并写回</text><text x="0" y="82" font-size="12" fill="#333">• 一次刷新 = 恢复整行电荷</text><line x1="0" y1="100" x2="360" y2="100" stroke="#b0bec5"/><text x="0" y="122" font-weight="bold" fill="#186a3b">约束条件</text><text x="0" y="144" font-size="12" fill="#333">• 刷新周期通常为<tspan font-weight="bold">64 ms</tspan>左右</text><text x="0" y="164" font-size="12" fill="#333">• 期间必须保证<tspan font-weight="bold">每一行至少刷新 1 次</tspan></text><text x="0" y="184" font-size="12" fill="#c0392b">• 正被刷新的存储体无法响应读/写请求</text></g></g></svg>
