<svg viewBox="0 0 900 470" font-family="var(--svg-font-family)" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="900" height="470" fill="var(--surface)" rx="12"/><rect x="20" y="15" width="860" height="50" fill="var(--blue-ink)" rx="8"/><text x="450" y="47" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">总线事务（Bus Transaction）</text><rect x="60" y="90" width="180" height="80" fill="var(--indigo-mid)" rx="8" stroke="var(--indigo-deep)" stroke-width="2"/><text x="150" y="122" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">主设备 Master</text><text x="150" y="145" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-caption)">发起事务 · 发出地址/数据</text><text x="150" y="161" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-caption)">控制读写信号</text><rect x="660" y="90" width="180" height="80" fill="var(--mint-mid)" rx="8" stroke="var(--mint-deep)" stroke-width="2"/><text x="750" y="122" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">从设备 Slave</text><text x="750" y="145" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-caption)">识别地址 · 响应读写</text><text x="750" y="161" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-caption)">交换数据 · 发确认</text><rect x="270" y="100" width="360" height="22" fill="var(--coral-deep)" rx="4" stroke="var(--red-deep)" stroke-width="1.5"/><text x="450" y="116" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)">地址总线</text><rect x="270" y="129" width="360" height="22" fill="var(--yellow-mid)" rx="4" stroke="var(--yellow-mid)" stroke-width="1.5"/><text x="450" y="145" text-anchor="middle" fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)">数据总线</text><rect x="270" y="158" width="360" height="0" fill="none"/><line x1="240" y1="130" x2="270" y2="130" stroke="var(--ink-soft)" stroke-width="2"/><line x1="630" y1="130" x2="660" y2="130" stroke="var(--ink-soft)" stroke-width="2"/><rect x="20" y="195" width="860" height="255" fill="var(--surface)" rx="8" stroke="var(--sky-soft)" stroke-width="2"/><text x="40" y="222" fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">总线事务的五个阶段</text><rect x="40" y="245" width="150" height="110" fill="var(--indigo-soft)" rx="8" stroke="var(--indigo-deep)" stroke-width="1.5"/><circle cx="65" cy="270" r="13" fill="var(--indigo-deep)"/><text x="65" y="275" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">1</text><text x="115" y="285" text-anchor="middle" fill="var(--indigo-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">请求</text><text x="115" y="303" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">Request</text><text x="115" y="325" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">主设备发出</text><text x="115" y="339" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">总线传输请求</text><rect x="206" y="245" width="150" height="110" fill="var(--yellow-light)" rx="8" stroke="var(--yellow-mid)" stroke-width="1.5"/><circle cx="231" cy="270" r="13" fill="var(--yellow-mid)"/><text x="231" y="275" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">2</text><text x="281" y="285" text-anchor="middle" fill="var(--yellow-mid)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">仲裁</text><text x="281" y="303" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">Arbitration</text><text x="281" y="325" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">多设备竞争时</text><text x="281" y="339" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">按优先级裁决</text><rect x="372" y="245" width="150" height="110" fill="var(--coral-soft)" rx="8" stroke="var(--red-deep)" stroke-width="1.5"/><circle cx="397" cy="270" r="13" fill="var(--red-deep)"/><text x="397" y="275" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">3</text><text x="447" y="285" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">寻址</text><text x="447" y="303" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">Addressing</text><text x="447" y="325" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">放出目标地址</text><text x="447" y="339" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">指定从设备</text><rect x="538" y="245" width="150" height="110" fill="var(--green-light)" rx="8" stroke="var(--mint-deep)" stroke-width="1.5"/><circle cx="563" cy="270" r="13" fill="var(--mint-deep)"/><text x="563" y="275" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">4</text><text x="613" y="285" text-anchor="middle" fill="var(--green-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">传输</text><text x="613" y="303" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">Transfer</text><text x="613" y="325" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">读/写数据</text><text x="613" y="339" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">交换发生</text><rect x="704" y="245" width="150" height="110" fill="var(--violet-soft)" rx="8" stroke="var(--purple-deep)" stroke-width="1.5"/><circle cx="729" cy="270" r="13" fill="var(--purple-deep)"/><text x="729" y="275" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">5</text><text x="779" y="285" text-anchor="middle" fill="var(--purple-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">终止</text><text x="779" y="303" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">Termination</text><text x="779" y="325" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">确认完成</text><text x="779" y="339" text-anchor="middle" fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)">撤销总线控制</text><line x1="190" y1="300" x2="206" y2="300" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#arrow)"/><line x1="356" y1="300" x2="372" y2="300" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#arrow)"/><line x1="522" y1="300" x2="538" y2="300" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#arrow)"/><line x1="688" y1="300" x2="704" y2="300" stroke="var(--ink-soft)" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="372" width="814" height="60" fill="var(--paper)" rx="5"/><text x="447" y="394" text-anchor="middle" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">总线事务是总线操作的基本单位：主设备控制总线，从设备识别地址并完成数据交换</text><text x="447" y="413" text-anchor="middle" fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)">仲裁阶段仅在多个设备同时竞争总线时需要；简单系统可省略</text><text x="447" y="427" text-anchor="middle" fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)">一个总线事务可包含一次或多次（突发）数据传输</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="var(--ink-soft)"/></marker></defs></svg>
