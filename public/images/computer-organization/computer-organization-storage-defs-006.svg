<svg viewBox="0 0 900 520" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#444"/></marker><marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c0392b"/></marker></defs><g id="planes"><g transform="translate(120,300)"><rect x="0" y="0" width="128" height="128" fill="#eaf4fc" stroke="#2c6da3" stroke-width="1.5"/><g stroke="#7fa9c9" stroke-width=".8"><line x1="32" y1="0" x2="32" y2="128"/><line x1="64" y1="0" x2="64" y2="128"/><line x1="96" y1="0" x2="96" y2="128"/><line x1="0" y1="32" x2="128" y2="32"/><line x1="0" y1="64" x2="128" y2="64"/><line x1="0" y1="96" x2="128" y2="96"/></g><rect x="64" y="32" width="32" height="32" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><text x="80" y="52" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="100" y="146" font-size="12" fill="#2c6da3">位平面 0 (LSB)</text></g><g transform="translate(148,272)"><rect x="0" y="0" width="128" height="128" fill="#eaf4fc" stroke="#2c6da3" stroke-width="1.5"/><g stroke="#7fa9c9" stroke-width=".8"><line x1="32" y1="0" x2="32" y2="128"/><line x1="64" y1="0" x2="64" y2="128"/><line x1="96" y1="0" x2="96" y2="128"/><line x1="0" y1="32" x2="128" y2="32"/><line x1="0" y1="64" x2="128" y2="64"/><line x1="0" y1="96" x2="128" y2="96"/></g><rect x="64" y="32" width="32" height="32" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><text x="80" y="52" text-anchor="middle" fill="#fff" font-weight="bold">0</text></g><g transform="translate(176,244)"><rect x="0" y="0" width="128" height="128" fill="#eaf4fc" stroke="#2c6da3" stroke-width="1.5"/><g stroke="#7fa9c9" stroke-width=".8"><line x1="32" y1="0" x2="32" y2="128"/><line x1="64" y1="0" x2="64" y2="128"/><line x1="96" y1="0" x2="96" y2="128"/><line x1="0" y1="32" x2="128" y2="32"/><line x1="0" y1="64" x2="128" y2="64"/><line x1="0" y1="96" x2="128" y2="96"/></g><rect x="64" y="32" width="32" height="32" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><text x="80" y="52" text-anchor="middle" fill="#fff" font-weight="bold">1</text></g><g transform="translate(204,216)"><rect x="0" y="0" width="128" height="128" fill="#eaf4fc" stroke="#2c6da3" stroke-width="1.5"/><g stroke="#7fa9c9" stroke-width=".8"><line x1="32" y1="0" x2="32" y2="128"/><line x1="64" y1="0" x2="64" y2="128"/><line x1="96" y1="0" x2="96" y2="128"/><line x1="0" y1="32" x2="128" y2="32"/><line x1="0" y1="64" x2="128" y2="64"/><line x1="0" y1="96" x2="128" y2="96"/></g><rect x="64" y="32" width="32" height="32" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><text x="80" y="52" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="135" y="105" font-size="12" fill="#2c6da3">位平面 3 (MSB)</text></g></g><g><text x="335" y="196" font-size="13" fill="#c0392b" text-anchor="middle">行地址 (Row)</text><line x1="320" y1="204" x2="270" y2="246" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowRed)"/></g><g><text x="470" y="196" font-size="13" fill="#c0392b" text-anchor="middle">列地址 (Col)</text><line x1="450" y1="204" x2="298" y2="240" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrowRed)"/></g><g><rect x="30" y="410" width="180" height="80" fill="#fff8e7" stroke="#b9770e" stroke-width="1.2" rx="6"/><text x="120" y="432" text-anchor="middle" font-weight="bold" fill="#8a5a06">Cell (存储单元)</text><text x="120" y="454" text-anchor="middle" font-size="12" fill="#555">物理存储的最小单位</text><text x="120" y="472" text-anchor="middle" font-size="12" fill="#555">仅存储 1 bit</text><line x1="170" y1="410" x2="196" y2="366" stroke="#b9770e" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/></g><g><rect x="30" y="80" width="220" height="80" fill="#eaf4fc" stroke="#2c6da3" stroke-width="1.2" rx="6"/><text x="140" y="102" text-anchor="middle" font-weight="bold" fill="#1e4a70">Bit Plane (位平面)</text><text x="140" y="124" text-anchor="middle" font-size="12" fill="#555">独立的二维 Cell 阵列</text><text x="140" y="142" text-anchor="middle" font-size="12" fill="#555">负责该地址的其中 1 bit</text><line x1="220" y1="160" x2="240" y2="210" stroke="#2c6da3" stroke-width="1" stroke-dasharray="3,3"/></g><g transform="translate(560,260)"><text x="0" y="-14" font-weight="bold" fill="#1e4a70">Addressable Location (可寻址地址)</text><text x="0" y="6" font-size="12" fill="#555">同一 (行, 列) 在各位平面中的 Cell</text><text x="0" y="24" font-size="12" fill="#555">被同时选中并组合成一次访问的数据</text><g transform="translate(0,50)"><rect x="0" y="0" width="40" height="40" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><rect x="40" y="0" width="40" height="40" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><rect x="80" y="0" width="40" height="40" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><rect x="120" y="0" width="40" height="40" fill="#f39c12" stroke="#b9770e" stroke-width="1.5"/><text x="20" y="26" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="60" y="26" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="100" y="26" text-anchor="middle" fill="#fff" font-weight="bold">0</text><text x="140" y="26" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="20" y="58" text-anchor="middle" font-size="11" fill="#666">bit3</text><text x="60" y="58" text-anchor="middle" font-size="11" fill="#666">bit2</text><text x="100" y="58" text-anchor="middle" font-size="11" fill="#666">bit1</text><text x="140" y="58" text-anchor="middle" font-size="11" fill="#666">bit0</text><text x="80" y="80" text-anchor="middle" font-size="12" fill="#555">1 个地址 → 4 bit 数据</text></g></g><g stroke="#b9770e" stroke-width="1.5" fill="none"><path d="M3e2 264q120-24 280 44" marker-end="url(#arrow)"/><path d="M272 292q158-32 348 16" marker-end="url(#arrow)"/><path d="M244 320q206-40 416-12" marker-end="url(#arrow)"/><path d="M216 348q254-28 484-40" marker-end="url(#arrow)"/></g><g transform="translate(560,430)"><rect x="0" y="0" width="16" height="16" fill="#eaf4fc" stroke="#2c6da3"/><text x="22" y="13" font-size="12" fill="#333">位平面 (Bit Plane)</text><rect x="0" y="24" width="16" height="16" fill="#f39c12" stroke="#b9770e"/><text x="22" y="37" font-size="12" fill="#333">被同一 (行,列) 选中的 Cell</text></g></svg>
