<svg viewBox="0 0 1e3 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--neutral-ink)" points="0 0, 10 3, 0 6"/></marker><marker id="arrowhead-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--red-deep)" points="0 0, 10 3, 0 6"/></marker><marker id="arrowhead-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="var(--indigo-mid)" points="0 0, 10 3, 0 6"/></marker></defs><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="500" y="30">PTBR、MMU 与多进程页表关系</text><rect fill="var(--neutral-soft)" height="220" rx="8" stroke="var(--blue-ink)" stroke-width="2" width="250" x="50" y="80"/><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="175" y="105">CPU Core</text><rect fill="var(--red-deep)" height="60" rx="4" stroke="var(--red-deep)" stroke-width="2" width="190" x="80" y="130"/><text fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="175" y="155">PTBR</text><text fill="var(--surface)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="175" y="175">(Page Table Base Register)</text><rect fill="var(--surface)" height="30" rx="4" stroke="var(--red-deep)" stroke-width="2" width="190" x="80" y="210"/><text fill="var(--red-deep)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="175" y="230">0x3000 (进程 A 页表)</text><rect fill="var(--indigo-mid)" height="30" rx="4" stroke="var(--blue-deep)" stroke-width="2" width="190" x="80" y="260"/><text fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="175" y="280">MMU (地址翻译)</text><rect fill="var(--surface)" height="580" rx="8" stroke="var(--blue-ink)" stroke-width="2" width="550" x="400" y="80"/><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="675" y="105">物理内存 (Physical Memory)</text><g><rect fill="var(--rose-soft)" height="140" rx="4" stroke="var(--red-deep)" stroke-width="2" width="220" x="450" y="140"/><text fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="560" y="165">进程 A 页表</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="560" y="182">(物理地址: 0x3000)</text><rect fill="var(--surface)" height="20" stroke="var(--red-deep)" stroke-width="1" width="190" x="460" y="195"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="209">VPN 0x00 → PPN 0x1000</text><rect fill="var(--surface)" height="20" stroke="var(--red-deep)" stroke-width="1" width="190" x="460" y="220"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="234">VPN 0x01 → PPN 0x1001</text><rect fill="var(--surface)" height="20" stroke="var(--red-deep)" stroke-width="1" width="190" x="460" y="245"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="259">VPN 0x02 → PPN 0x1002</text></g><g><rect fill="var(--sky-soft)" height="140" rx="4" stroke="var(--indigo-mid)" stroke-width="2" width="220" x="450" y="310"/><text fill="var(--blue-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="560" y="335">进程 B 页表</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="560" y="352">(物理地址: 0x5000)</text><rect fill="var(--surface)" height="20" stroke="var(--indigo-mid)" stroke-width="1" width="190" x="460" y="365"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="379">VPN 0x00 → PPN 0x2000</text><rect fill="var(--surface)" height="20" stroke="var(--indigo-mid)" stroke-width="1" width="190" x="460" y="390"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="404">VPN 0x01 → PPN 0x2001</text><rect fill="var(--surface)" height="20" stroke="var(--indigo-mid)" stroke-width="1" width="190" x="460" y="415"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="429">VPN 0x02 → PPN 0x2002</text></g><g><rect fill="var(--purple-soft)" height="140" rx="4" stroke="var(--purple-deep)" stroke-width="2" width="220" x="450" y="480"/><text fill="var(--purple-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="560" y="505">进程 C 页表</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="560" y="522">(物理地址: 0x7000)</text><rect fill="var(--surface)" height="20" stroke="var(--purple-deep)" stroke-width="1" width="190" x="460" y="535"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="549">VPN 0x00 → PPN 0x3000</text><rect fill="var(--surface)" height="20" stroke="var(--purple-deep)" stroke-width="1" width="190" x="460" y="560"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="574">VPN 0x01 → PPN 0x3001</text><rect fill="var(--surface)" height="20" stroke="var(--purple-deep)" stroke-width="1" width="190" x="460" y="585"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="470" y="599">VPN 0x02 → PPN 0x3002</text></g><g><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="800" y="145">实际物理页面</text><rect fill="var(--lime-light)" height="30" rx="2" stroke="var(--lime-mid)" stroke-width="1" width="200" x="720" y="160"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="730" y="180">0x1000 ~ (进程 A 数据)</text><rect fill="var(--sky-light)" height="30" rx="2" stroke="var(--blue-deep)" stroke-width="1" width="200" x="720" y="200"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="730" y="220">0x2000 ~ (进程 B 数据)</text><rect fill="var(--purple-light)" height="30" rx="2" stroke="var(--purple-deep)" stroke-width="1" width="200" x="720" y="240"/><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="730" y="260">0x3000 ~ (进程 C 数据)</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="820" y="295">...</text></g><path d="M270 225q70 0 180-15" fill="none" marker-end="url(#arrowhead-red)" stroke="var(--red-deep)" stroke-width="3"/><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="330" y="215">当前活跃</text><path d="M270 275q70 0 180-35" fill="none" marker-end="url(#arrowhead)" stroke="var(--neutral-mid)" stroke-dasharray="5,5" stroke-width="2"/><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" x="330" y="295">查询页表</text><g><rect fill="var(--yellow-soft)" height="120" rx="8" stroke="var(--yellow-mid)" stroke-width="2" width="250" x="50" y="370"/><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="175" y="395">上下文切换时</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="60" y="420">1. 保存当前 PTBR 值</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="60" y="440">2. 加载新进程的页表地址</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="60" y="460">3. 更新 PTBR 寄存器</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="60" y="480">→ CPU 立即切换地址空间</text></g><g><rect fill="var(--green-soft)" height="140" rx="8" stroke="var(--green-mid)" stroke-width="2" width="250" x="50" y="520"/><text fill="var(--green-mid)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="175" y="545">关键特性</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="60" y="570">• 每个进程有独立页表</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="60" y="590">• PTBR 保存物理地址</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="60" y="610">• 同一时刻仅一个 PTBR 生效</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" x="60" y="630">• MMU 从 PTBR 开始翻译</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="60" y="650">• 地址空间隔离由此实现</text></g><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="730" y="335">VPN: Virtual Page Number</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="730" y="350">PPN: Physical Page Number</text></svg>
