<svg viewBox="0 0 1e3 700" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#333" points="0 0, 10 3, 0 6"/></marker><marker id="arrowhead-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#e74c3c" points="0 0, 10 3, 0 6"/></marker><marker id="arrowhead-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#3498db" points="0 0, 10 3, 0 6"/></marker></defs><text fill="#2c3e50" font-size="22" font-weight="bold" text-anchor="middle" x="500" y="30">PTBR、MMU 与多进程页表关系</text><rect fill="#ecf0f1" height="220" rx="8" stroke="#34495e" stroke-width="2" width="250" x="50" y="80"/><text fill="#2c3e50" font-size="16" font-weight="bold" text-anchor="middle" x="175" y="105">CPU Core</text><rect fill="#e74c3c" height="60" rx="4" stroke="#c0392b" stroke-width="2" width="190" x="80" y="130"/><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="175" y="155">PTBR</text><text fill="#fff" font-size="12" text-anchor="middle" x="175" y="175">(Page Table Base Register)</text><rect fill="#fff" height="30" rx="4" stroke="#c0392b" stroke-width="2" width="190" x="80" y="210"/><text fill="#c0392b" font-family="monospace" font-size="11" text-anchor="middle" x="175" y="230">0x3000 (进程 A 页表)</text><rect fill="#3498db" height="30" rx="4" stroke="#2980b9" stroke-width="2" width="190" x="80" y="260"/><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="175" y="280">MMU (地址翻译)</text><rect fill="#f8f9fa" height="580" rx="8" stroke="#34495e" stroke-width="2" width="550" x="400" y="80"/><text fill="#2c3e50" font-size="16" font-weight="bold" text-anchor="middle" x="675" y="105">物理内存 (Physical Memory)</text><g><rect fill="#ffebee" height="140" rx="4" stroke="#e74c3c" stroke-width="2" width="220" x="450" y="140"/><text fill="#c0392b" font-size="13" font-weight="bold" text-anchor="middle" x="560" y="165">进程 A 页表</text><text fill="#666" font-size="10" text-anchor="middle" x="560" y="182">(物理地址: 0x3000)</text><rect fill="#fff" height="20" stroke="#e74c3c" stroke-width="1" width="190" x="460" y="195"/><text fill="#333" font-size="10" x="470" y="209">VPN 0x00 → PPN 0x1000</text><rect fill="#fff" height="20" stroke="#e74c3c" stroke-width="1" width="190" x="460" y="220"/><text fill="#333" font-size="10" x="470" y="234">VPN 0x01 → PPN 0x1001</text><rect fill="#fff" height="20" stroke="#e74c3c" stroke-width="1" width="190" x="460" y="245"/><text fill="#333" font-size="10" x="470" y="259">VPN 0x02 → PPN 0x1002</text></g><g><rect fill="#e3f2fd" height="140" rx="4" stroke="#3498db" stroke-width="2" width="220" x="450" y="310"/><text fill="#2980b9" font-size="13" font-weight="bold" text-anchor="middle" x="560" y="335">进程 B 页表</text><text fill="#666" font-size="10" text-anchor="middle" x="560" y="352">(物理地址: 0x5000)</text><rect fill="#fff" height="20" stroke="#3498db" stroke-width="1" width="190" x="460" y="365"/><text fill="#333" font-size="10" x="470" y="379">VPN 0x00 → PPN 0x2000</text><rect fill="#fff" height="20" stroke="#3498db" stroke-width="1" width="190" x="460" y="390"/><text fill="#333" font-size="10" x="470" y="404">VPN 0x01 → PPN 0x2001</text><rect fill="#fff" height="20" stroke="#3498db" stroke-width="1" width="190" x="460" y="415"/><text fill="#333" font-size="10" x="470" y="429">VPN 0x02 → PPN 0x2002</text></g><g><rect fill="#f3e5f5" height="140" rx="4" stroke="#9b59b6" stroke-width="2" width="220" x="450" y="480"/><text fill="#8e44ad" font-size="13" font-weight="bold" text-anchor="middle" x="560" y="505">进程 C 页表</text><text fill="#666" font-size="10" text-anchor="middle" x="560" y="522">(物理地址: 0x7000)</text><rect fill="#fff" height="20" stroke="#9b59b6" stroke-width="1" width="190" x="460" y="535"/><text fill="#333" font-size="10" x="470" y="549">VPN 0x00 → PPN 0x3000</text><rect fill="#fff" height="20" stroke="#9b59b6" stroke-width="1" width="190" x="460" y="560"/><text fill="#333" font-size="10" x="470" y="574">VPN 0x01 → PPN 0x3001</text><rect fill="#fff" height="20" stroke="#9b59b6" stroke-width="1" width="190" x="460" y="585"/><text fill="#333" font-size="10" x="470" y="599">VPN 0x02 → PPN 0x3002</text></g><g><text fill="#2c3e50" font-size="12" font-weight="bold" x="800" y="145">实际物理页面</text><rect fill="#dcedc8" height="30" rx="2" stroke="#689f38" stroke-width="1" width="200" x="720" y="160"/><text fill="#333" font-size="10" x="730" y="180">0x1000 ~ (进程 A 数据)</text><rect fill="#b3e5fc" height="30" rx="2" stroke="#0288d1" stroke-width="1" width="200" x="720" y="200"/><text fill="#333" font-size="10" x="730" y="220">0x2000 ~ (进程 B 数据)</text><rect fill="#e1bee7" height="30" rx="2" stroke="#8e24aa" stroke-width="1" width="200" x="720" y="240"/><text fill="#333" font-size="10" x="730" y="260">0x3000 ~ (进程 C 数据)</text><text fill="#666" font-size="9" text-anchor="middle" x="820" y="295">...</text></g><path d="M270 225q70 0 180-15" fill="none" marker-end="url(#arrowhead-red)" stroke="#e74c3c" stroke-width="3"/><text fill="#e74c3c" font-size="11" font-weight="bold" x="330" y="215">当前活跃</text><path d="M270 275q70 0 180-35" fill="none" marker-end="url(#arrowhead)" stroke="#95a5a6" stroke-dasharray="5,5" stroke-width="2"/><text fill="#7f8c8d" font-size="10" x="330" y="295">查询页表</text><g><rect fill="#fff9e6" height="120" rx="8" stroke="#f39c12" stroke-width="2" width="250" x="50" y="370"/><text fill="#d68910" font-size="13" font-weight="bold" text-anchor="middle" x="175" y="395">上下文切换时</text><text fill="#333" font-size="11" x="60" y="420">1. 保存当前 PTBR 值</text><text fill="#333" font-size="11" x="60" y="440">2. 加载新进程的页表地址</text><text fill="#333" font-size="11" x="60" y="460">3. 更新 PTBR 寄存器</text><text fill="#e74c3c" font-size="11" font-weight="bold" x="60" y="480">→ CPU 立即切换地址空间</text></g><g><rect fill="#e8f5e9" height="140" rx="8" stroke="#27ae60" stroke-width="2" width="250" x="50" y="520"/><text fill="#229954" font-size="13" font-weight="bold" text-anchor="middle" x="175" y="545">关键特性</text><text fill="#333" font-size="11" x="60" y="570">• 每个进程有独立页表</text><text fill="#333" font-size="11" x="60" y="590">• PTBR 保存物理地址</text><text fill="#333" font-size="11" x="60" y="610">• 同一时刻仅一个 PTBR 生效</text><text fill="#333" font-size="11" x="60" y="630">• MMU 从 PTBR 开始翻译</text><text fill="#e74c3c" font-size="11" font-weight="bold" x="60" y="650">• 地址空间隔离由此实现</text></g><text fill="#666" font-size="10" x="730" y="335">VPN: Virtual Page Number</text><text fill="#666" font-size="10" x="730" y="350">PPN: Physical Page Number</text></svg>
