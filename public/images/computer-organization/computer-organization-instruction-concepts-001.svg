<svg width="100%" viewBox="0 0 680 500" role="img" style="" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><title style="fill:var(--ink);stroke:none;color:var(--ink);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-normal);text-anchor:start;dominant-baseline:auto">ISA、操作系统与应用程序的抽象层次关系</title><desc style="fill:var(--ink);stroke:none;color:var(--ink);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-normal);text-anchor:start;dominant-baseline:auto">从上到下依次为应用程序、操作系统、ISA、微架构、数字逻辑/电路五层，箭头表示层层依赖与接口关系，ISA 是操作系统与硬件之间的统一机器接口。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g style="fill:var(--ink);stroke:none;color:var(--ink);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-normal);text-anchor:start;dominant-baseline:auto"><rect x="60" y="40" width="560" height="60" rx="8" stroke-width=".5" style="fill:var(--paper-alt);stroke:var(--coral-deep);color:var(--ink);stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-normal);text-anchor:start;dominant-baseline:auto"/><text x="340" y="64" text-anchor="middle" dominant-baseline="central" style="fill:var(--red-deep);stroke:none;color:var(--ink);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family: var(--svg-font-family);font-size: var(--svg-font-size-body);fo