<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity=".3"/></filter></defs><text x="400" y="35" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" fill="var(--blue-ink)">指令长度设计的两大挑战及解决方案</text><line x1="400" y1="50" x2="400" y2="580" stroke="var(--indigo-light)" stroke-width="2" stroke-dasharray="5,5"/><g id="fixed-length"><rect x="30" y="70" width="340" height="50" rx="8" fill="var(--indigo-deep)" filter="url(#shadow)"/><text x="200" y="95" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" fill="var(--surface)">问题 1：地址字段数量不统一</text><text x="200" y="112" font-size="var(--svg-font-size-label)" text-anchor="middle" fill="var(--surface)">定长指令 · 不同指令需要的地址字段数不同</text><text x="50" y="155" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">三地址指令</text><g transform="translate(50, 165)"><rect x="0" y="0" width="60" height="35" fill="var(--indigo-mid)" stroke="var(--blue-deep)" stroke-width="2"/><text x="30" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">操作码</text><rect x="60" y="0" width="60" height="35" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2"/><text x="90" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">地址1</text><rect x="120" y="0" width="60" height="35" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2"/><text x="150" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">地址2</text><rect x="180" y="0" width="60" height="35" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2"/><text x="210" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">地址3</text></g><text x="310" y="187" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">← 刚好填满</text><text x="50" y="230" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" fill="var(--blue-ink)">二地址指令</text><g transform="translate(50, 240)"><rect x="0" y="0" width="60" height="35" fill="var(--indigo-mid)" stroke="var(--blue-deep)" stroke-width="2"/><text x="30" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">操作码</text><rect x="60" y="0" width="60" height="35" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2"/><text x="90" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">地址1</text><rect x="120" y="0" width="60" height="35" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2"/><text x="150" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">地址2</text><rect x="180" y="0" width="60" height="35" fill="var(--neutral-mid)" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="3,3"/><text x="210" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--neutral-deep)">无效字段</text></g><text x="310" y="262" font-size="var(--svg-font-size-caption)" fill="var(--orange-mid)">← 需要填充!</text><rect x="30" y="300" width="340" height="40" rx="6" fill="var(--green-mid)" opacity=".9"/><text x="200" y="325" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" fill="var(--surface)">✓ 解决方案：无效字段填充</text><g transform="translate(40, 355)"><circle cx="5" cy="0" r="3" fill="var(--green-mid)"/><text x="15" y="4" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">指令长度保持一致(如32位)</text><circle cx="5" cy="25" r="3" fill="var(--green-mid)"/><text x="15" y="29" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">地址字段不足时