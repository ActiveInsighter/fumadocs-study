x="565" y="187" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">16位</text><g transform="translate(450, 215)"><rect x="0" y="0" width="30" height="35" fill="var(--purple-deep)" stroke="var(--purple-deep)" stroke-width="2"/><text x="15" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">前缀</text><rect x="30" y="0" width="150" height="35" fill="var(--orange-mid)" stroke="var(--coral-deep)" stroke-width="2"/><text x="105" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">16位指令</text></g><text x="635" y="237" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">24位</text><g transform="translate(450, 265)"><rect x="0" y="0" width="30" height="35" fill="var(--purple-deep)" stroke="var(--purple-deep)" stroke-width="2"/><text x="15" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">前缀</text><rect x="30" y="0" width="250" height="35" fill="var(--red-deep)" stroke="var(--red-deep)" stroke-width="2"/><text x="155" y="22" font-size="var(--svg-font-size-caption)" text-anchor="middle" fill="var(--surface)">32位指令</text></g><text x="735" y="287" font-size="var(--svg-font-size-caption)" fill="var(--ink-soft)">40位</text><rect x="430" y="320" width="340" height="40" rx="6" fill="var(--purple-deep)" opacity=".9"/><text x="600" y="345" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" fill="var(--surface)">✓ 解决方案：指令前缀标识</text><g transform="translate(440, 375)"><circle cx="5" cy="0" r="3" fill="var(--purple-deep)"/><text x="15" y="4" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">在指令开头设置前缀字段</text><circle cx="5" cy="25" r="3" fill="var(--purple-deep)"/><text x="15" y="29" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">前缀标识该指令的长度/类型</text><circle cx="5" cy="50" r="3" fill="var(--purple-deep)"/><text x="15" y="54" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">CPU先读前缀,再提取完整指令</text><circle cx="5" cy="75" r="3" fill="var(--purple-deep)"/><text x="15" y="79" font-size="var(--svg-font-size-label)" fill="var(--blue-ink)">增加解码复杂度,换取编码灵活性</text></g><rect x="440" y="470" width="320" height="90" rx="6" fill="var(--neutral-soft)" stroke="var(--indigo-light)" stroke-width="1.5"/><text x="600" y="492" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" fill="var(--blue-ink)">💡 变长指令的优势</text><text x="455" y="515" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">• 编码紧凑：指令密度更高</text><text x="455" y="535" font-size="var(--svg-font-size-caption)" fill="var(--neutral-deep)">• 功能丰富：可支持复杂操作</text></g><rect x="50" y="575" width="700" height="2" fill="var(--indigo-mid)" opacity=".3"/></svg>
