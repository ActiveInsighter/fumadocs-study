<svg viewBox="0 0 450 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><g transform="translate(10, 10)"><text x="0" y="2" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-body)" fill="var(--neutral-ink)">32位整数: 0x12345678</text><g transform="translate(0, 25)"><text x="0" y="12" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" fill="var(--neutral-deep)">字节分解:</text><rect x="80" y="0" width="40" height="25" fill="var(--sky-soft)" stroke="var(--violet-deep)"/><text x="100" y="17" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)" text-anchor="middle">0x12</text><rect x="120" y="0" width="40" height="25" fill="var(--purple-soft)" stroke="var(--purple-deep)"/><text x="140" y="17" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)" text-anchor="middle">0x34</text><rect x="160" y="0" width="40" height="25" fill="var(--yellow-soft)" stroke="var(--orange-mid)"/><text x="180" y="17" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)" text-anchor="middle">0x56</text><rect x="200" y="0" width="40" height="25" fill="var(--lime-soft)" stroke="var(--lime-mid)"/><text x="220" y="17" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-caption)" text-anchor="middle">0x78</text><text x="100" y="-5" font-size="var(--svg-font-size-caption)" fill="var(--violet-deep)" text-anchor="middle">高位字节</text><text x="220" y="-5" font-size="var(--svg-font-size-caption)" fill="var(--lime-mid)" text-anchor="middle">低位字节</text></g><g transform="translate(0, 80)"><text x="0" y="0" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" fill="var(--neutral-deep)">内存存储:</text><g transform="translate(80, 0)"><text x="-10" y="17" font-family="var(--svg-font-family-mono)" font-size="var(--svg-fo