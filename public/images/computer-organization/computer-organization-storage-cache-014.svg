<svg viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg"><text fill="#2c3e50" font-size="24" font-weight="bold" text-anchor="middle" x="600" y="30">Cache 块替换算法的使用场景</text><g id="direct-mapping"><rect fill="#f0f4f8" height="680" rx="8" stroke="#3498db" stroke-width="2" width="350" x="50" y="60"/><text fill="#2c3e50" font-size="18" font-weight="bold" text-anchor="middle" x="225" y="90">直接映射 (Direct Mapping)</text><text fill="#34495e" font-size="14" font-weight="bold" x="100" y="130">主存块:</text><g id="main-mem-direct"><rect fill="#e74c3c" height="40" stroke="#c0392b" stroke-width="2" width="80" x="100" y="140"/><text fill="#fff" font-size="12" text-anchor="middle" x="140" y="165">块 0</text><rect fill="#e67e22" height="40" stroke="#d35400" stroke-width="2" width="80" x="100" y="190"/><text fill="#fff" font-size="12" text-anchor="middle" x="140" y="215">块 1</text><rect fill="#f39c12" height="40" stroke="#e67e22" stroke-width="2" width="80" x="100" y="240"/><text fill="#fff" font-size="12" text-anchor="middle" x="140" y="265">块 2</text><rect fill="#3498db" height="40" stroke="#2980b9" stroke-width="2" width="80" x="100" y="290"/><text fill="#fff" font-size="12" text-anchor="middle" x="140" y="315">块 3</text><text fill="#7f8c8d" font-size="12" text-anchor="middle" x="140" y="350">...</text></g><path d="M180 160l60 40" fill="none" marker-end="url(#arrowred)" stroke="#e74c3c" stroke-width="3"/><path d="M180 210l60 30" fill="none" marker-end="url(#arroworange)" stroke="#e67e22" stroke-width="3"/><path d="M180 260l60-60" fill="none" marker-end="url(#arrowyellow)" stroke="#f39c12" stroke-width="3"/><path d="M180 310l60-70" fill="none" marker-end="url(#arrowblue)" stroke="#3498db" stroke-width="3"/><text fill="#34495e" font-size="14" font-weight="bold" x="260" y="130">Cache:</text><g id="cache-direct"><rect fill="#ecf0f1" height="40" stroke="#95a5a6" stroke-width="2" width="80" x="260" y="185"/><text fill="#2c3e50" font-size="12" text-anchor="middle" x="300" y="210">Cache 0</text><rect fill="#ecf0f1" height="40" stroke="#95a5a6" stroke-width="2" width="80" x="260" y="235"/><text fill="#2c3e50" font-size="12" text-anchor="middle" x="300" y="260">Cache 1</text></g><rect fill="#fff9e6" height="320" rx="5" stroke="#f39c12" stroke-width="2" width="310" x="70" y="400"/><text fill="#d35400" font-size="20" font-weight="bold" text-anchor="middle" x="225" y="435">❌ 不需要替换算法</text><text fill="#34495e" font-size="15" x="80" y="475"><tspan dy="0" x="80">• 每个主存块只能映射到</tspan><tspan dy="22" x="80">唯一的一个Cache块</tspan><tspan dy="27" x="80">• 例如: 块0、块2 → Cache 0</tspan><tspan dy="22" x="80">块1、块3 → Cache 1</tspan><tspan dy="27" x="80">• 发生冲突时,直接覆盖</tspan><tspan dy="22" x="80">对应的Cache块即可</tspan><tspan dy="27" x="80">• 无需选择淘汰哪一个</tspan><tspan dy="22" x="80">(因为只有唯一选择)</tspan></text></g><g id="fully-associative"><rect fill="#f0f4f8" height="680" rx="8" stroke="#9b59b6" stroke-width="2" width="350" x="430" y="60"/><text fill="#2c3e50" font-size="18" font-weight="bold" text-anchor="middle" x="605" y="90">全相联映射 (Fully Associative)</text><text fill="#34495e" font-size="14" font-weight="bold" x="480" y="130">主存块:</text><g id="main-mem-full"><rect fill="#e74c3c" height="40" stroke="#c0392b" stroke-width="2" width="80" x="480" y="140"/><text fill="#fff" font-size="12" text-anchor="middle" x="520" y="165">块 0</text><rect fill="#e67e22" height="40" stroke="#d35400" stroke-width="2" width="80" x="480" y="190"/><text fill="#fff" font-size="12" text-anchor="middle" x="520" y="215">块 1</text><rect fill="#f39c12" height="40" stroke="#e67e22" stroke-width="2" width="80" x="480" y="240"/><text fill="#fff" font-size="12" text-anchor="middle" x="520" y="265">块 2</text><rect fill="#3498db" height="40" stroke="#2980b9" stroke-width="2" width="80" x="480" y="290"/><text fill="#fff" font-size="12" text-anchor="middle" x="520" y="315">块 3</text></g><path d="M560 160l60 10" fill="none" opacity=".6" stroke="#e74c3c" stroke-width="2"/><path d="M560 160l60 50" fill="none" opacity=".6" stroke="#e74c3c" stroke-width="2"/><path d="M560 160l60 90" fill="none" opacity=".6" stroke="#e74c3c" stroke-width="2"/><path d="M560 210l60-40" fill="none" opacity=".6" stroke="#e67e22" stroke-width="2"/><path d="M560 210h60" fill="none" opacity=".6" stroke="#e67e22" stroke-width="2"/><path d="M560 210l60 40" fill="none" opacity=".6" stroke="#e67e22" stroke-width="2"/><text fill="#34495e" font-size="14" font-weight="bold" x="640" y="130">Cache:</text><g id="cache-full"><rect fill="#ecf0f1" height="40" stroke="#95a5a6" stroke-width="2" width="80" x="640" y="155"/><text fill="#2c3e50" font-size="12" text-anchor="middle" x="680" y="180">Cache 0</text><rect fill="#ecf0f1" height="40" stroke="#95a5a6" stroke-width="2" width="80" x="640" y="195"/><text fill="#2c3e50" font-size="12" text-anchor="middle" x="680" y="220">Cache 1</text><rect fill="#ecf0f1" height="40" stroke="#95a5a6" stroke-width="2" width="80" x="640" y="235"/><text fill="#2c3e50" font-size="12" text-anchor="middle" x="680" y="260">Cache 2</text></g><text fill="#9b59b6" font-size="40" text-anchor="middle" x="605" y="320">?</text><rect fill="#f3e5f5" height="320" rx="5" stroke="#9b59b6" stroke-width="2" width="310" x="450" y="400"/><text fill="#8e44ad" font-size="20" font-weight="bold" text-anchor="middle" x="605" y="435">✅ 需要替换算法</text><text fill="#34495e" font-size="15" x="460" y="475"><tspan dy="0" x="460">• 任何主存块可以映射到</tspan><tspan dy="22" x="460">任意Cache块</tspan><tspan dy="27" x="460">• Cache满时,新块可以</tspan><tspan dy="22" x="460">替换任何一个现有块</tspan><tspan dy="27" x="460">• 必须使用替换算法决定</tspan><tspan dy="22" x="460">淘汰哪个块:</tspan><tspan dy="22" x="460">- LRU (最近最少使用)</tspan><tspan dy="22" x="460">- FIFO (先进先出)</tspan><tspan dy="22" x="460">- Random (随机)</tspan></text></g><g id="set-associative"><rect fill="#f0f4f8" height="680" rx="8" stroke="#16a085" stroke-width="2" width="350" x="810" y="60"/><text fill="#2c3e50" font-size="18" font-weight="bold" text-anchor="middle" x="985" y="90">组相联映射 (Set Associative)</text><text fill="#34495e" font-size="14" font-weight="bold" x="860" y="130">主存块:</text><g id="main-mem-set"><rect fill="#e74c3c" height="40" stroke="#c0392b" stroke-width="2" width="80" x="860" y="140"/><text fill="#fff" font-size="12" text-anchor="middle" x="900" y="165">块 0</text><rect fill="#e67e22" height="40" stroke="#d35400" stroke-width="2" width="80" x="860" y="190"/><text fill="#fff" font-size="12" text-anchor="middle" x="900" y="215">块 1</text><rect fill="#f39c12" height="40" stroke="#e67e22" stroke-width="2" width="80" x="860" y="240"/><text fill="#fff" font-size="12" text-anchor="middle" x="900" y="265">块 2</text><rect fill="#3498db" height="40" stroke="#2980b9" stroke-width="2" width="80" x="860" y="290"/><text fill="#fff" font-size="12" text-anchor="middle" x="900" y="315">块 3</text></g><path d="M940 160l60 10" fill="none" opacity=".7" stroke="#e74c3c" stroke-width="2"/><path d="M940 160l60 50" fill="none" opacity=".7" stroke="#e74c3c" stroke-width="2"/><path d="M940 260l60-90" fill="none" opacity=".7" stroke="#f39c12" stroke-width="2"/><path d="M940 260l60-50" fill="none" opacity=".7" stroke="#f39c12" stroke-width="2"/><path d="M940 210l60 60" fill="none" opacity=".7" stroke="#e67e22" stroke-width="2"/><path d="M940 210l60 1e2" fill="none" opacity=".7" stroke="#e67e22" stroke-width="2"/><path d="M940 310l60-40" fill="none" opacity=".7" stroke="#3498db" stroke-width="2"/><path d="M940 310h60" fill="none" opacity=".7" stroke="#3498db" stroke-width="2"/><text fill="#34495e" font-size="14" font-weight="bold" x="1020" y="130">Cache组:</text><rect fill="#e8f5e9" height="80" rx="4" stroke="#16a085" stroke-width="2" width="130" x="1e3" y="150"/><text fill="#16a085" font-size="11" font-weight="bold" text-anchor="middle" x="1065" y="168">组 0</text><rect fill="#ecf0f1" height="30" stroke="#95a5a6" stroke-width="1.5" width="50" x="1010" y="175"/><text fill="#2c3e50" font-size="10" text-anchor="middle" x="1035" y="195">路0</text><rect fill="#ecf0f1" height="30" stroke="#95a5a6" stroke-width="1.5" width="50" x="1070" y="175"/><text fill="#2c3e50" font-size="10" text-anchor="middle" x="1095" y="195">路1</text><text fill="#16a085" font-size="9" text-anchor="middle" x="1065" y="222">块0,2在此组</text><rect fill="#e8f5e9" height="80" rx="4" stroke="#16a085" stroke-width="2" width="130" x="1e3" y="250"/><text fill="#16a085" font-size="11" font-weight="bold" text-anchor="middle" x="1065" y="268">组 1</text><rect fill="#ecf0f1" height="30" stroke="#95a5a6" stroke-width="1.5" width="50" x="1010" y="275"/><text fill="#2c3e50" font-size="10" text-anchor="middle" x="1035" y="295">路0</text><rect fill="#ecf0f1" height="30" stroke="#95a5a6" stroke-width="1.5" width="50" x="1070" y="275"/><text fill="#2c3e50" font-size="10" text-anchor="middle" x="1095" y="295">路1</text><text fill="#16a085" font-size="9" text-anchor="middle" x="1065" y="322">块1,3在此组</text><text fill="#16a085" font-size="35" text-anchor="middle" x="985" y="365">?</text><rect fill="#e8f5e9" height="320" rx="5" stroke="#16a085" stroke-width="2" width="310" x="830" y="400"/><text fill="#16a085" font-size="20" font-weight="bold" text-anchor="middle" x="985" y="435">✅ 需要替换算法</text><text fill="#34495e" font-size="15" x="840" y="475"><tspan dy="0" x="840">• 主存块映射到特定组,</tspan><tspan dy="22" x="840">但可在组内任意路</tspan><tspan dy="27" x="840">• 例如(2路组相联):</tspan><tspan dy="22" x="840">块0,2 → 组0的路0或路1</tspan><tspan dy="22" x="840">块1,3 → 组1的路0或路1</tspan><tspan dy="27" x="840">• 组内满时,需要替换</tspan><tspan dy="22" x="840">算法决定淘汰哪一路</tspan><tspan dy="27" x="840">• 常用算法: LRU, FIFO等</tspan></text></g><defs><marker id="arrowred" markerHeight="10" markerWidth="10" markerUnits="strokeWidth" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#e74c3c"/></marker><marker id="arroworange" markerHeight="10" markerWidth="10" markerUnits="strokeWidth" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#e67e22"/></marker><marker id="arrowyellow" markerHeight="10" markerWidth="10" markerUnits="strokeWidth" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#f39c12"/></marker><marker id="arrowblue" markerHeight="10" markerWidth="10" markerUnits="strokeWidth" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#3498db"/></marker></defs></svg>
