roke="#90a4ae"/><rect x="120" y="70" width="42" height="24" fill="#cfd8dc" stroke="#90a4ae"/><rect x="170" y="70" width="42" height="24" fill="#cfd8dc" stroke="#90a4ae"/><rect x="20" y="100" width="42" height="24" fill="#cfd8dc" stroke="#90a4ae"/><rect x="70" y="100" width="42" height="24" fill="#cfd8dc" stroke="#90a4ae"/><rect x="120" y="100" width="42" height="24" fill="#cfd8dc" stroke="#90a4ae"/><rect x="170" y="100" width="42" height="24" fill="#cfd8dc" stroke="#90a4ae"/></g><text x="141" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#3e2723">改写</text><text x="130" y="150" text-anchor="middle" font-size="10" fill="#546e7a">其余字节保持不变</text></g><g transform="translate(40,230)"><g transform="translate(0,0)"><rect x="0" y="0" width="220" height="60" rx="8" fill="#eceff1" stroke="#b0bec5"/><text x="110" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">电信号擦写</text><text x="110" y="44" text-anchor="middle" font-size="11" fill="#546e7a">不需要紫外线设备</text></g><g transform="translate(240,0)"><rect x="0" y="0" width="220" height="60" rx="8" fill="#eceff1" stroke="#b0bec5"/><text x="110" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">电擦除，无需紫外线</text><text x="110" y="44" text-anchor="middle" font-size="11" fill="#546e7a">支持按字节擦写</text></g><g transform="translate(480,0)"><rect x="0" y="0" width="220" height="60" rx="8" fill="#eceff1" stroke="#b0bec5"/><text x="110" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#263238">局限</text><text x="110" y="44" text-anchor="middle" font-size="11" fill="#546e7a">写入较慢，擦写次数有限</text></g></g></svg>
