<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'PingFang SC', sans-serif" viewBox="0 0 820 420"><rect fill="#fafafa" height="420" rx="8" width="820"></rect><line stroke="#ccc" stroke-width="1.5" x1="40" x2="780" y1="60" y2="60"></line><text fill="#999" font-size="12" x="785" y="64">t</text><rect fill="#e8e8f0" height="44" rx="4" width="140" x="60" y="38"></rect><text fill="#555" font-size="12" text-anchor="middle" x="130" y="56">信道忙</text><text fill="#888" font-size="11" text-anchor="middle" x="130" y="72">(上一帧传输)</text><line stroke="#aaa" stroke-dasharray="4,3" stroke-width="1.2" x1="200" x2="200" y1="30" y2="100"></line><text fill="#aaa" font-size="10" text-anchor="middle" x="200" y="24">帧结束</text><rect fill="#c8e6c9" height="44" rx="4" width="60" x="200" y="38"></rect><text fill="#2e7d32" font-size="11" font-weight="bold" text-anchor="middle" x="230" y="56">SIFS</text><text fill="#388e3c" font-size="10" text-anchor="middle" x="230" y="70">最短</text><line stroke="#2e7d32" stroke-width="1.5" x1="200" x2="260" y1="96" y2="96"></line><line stroke="#2e7d32" stroke-width="1.5" x1="200" x2="200" y1="92" y2="100"></line><line stroke="#2e7d32" stroke-width="1.5" x1="260" x2="260" y1="92" y2="100"></line><line stroke="#2e7d32" stroke-width="1.2" x1="260" x2="260" y1="38" y2="30"></line><rect fill="#fff9c4" height="44" rx="4" width="100" x="200" y="115"></rect><text fill="#f57f17" font-size="11" font-weight="bold" text-anchor="middle" x="250" y="133">PIFS</text><text fill="#f9a825" font-size="10" text-anchor="middle" x="250" y="147">中等</text><line stroke="#f57f17" stroke-width="1.5" x1="200" x2="300" y1="170" y2="170"></line><line stroke="#f57f17" stroke-width="1.5" x1="200" x2="200" y1="166" y2="174"></line><line stroke="#f57f17" stroke-width="1.5" x1="300" x2="300" y1="166" y2="174"></line><rect fill="#fce4ec" height="44" rx="4" width="160" x="200" y="192"></rect><text fill="#c62828" font-size="11" font-weight="bold" text-anchor="middle" x="280" y="210">DIFS</text><text fill="#d32f2f" font-size="10" text-anchor="middle" x="280" y="224">最长</text><line stroke="#c62828" stroke-width="1.5" x1="200" x2="360" y1="248" y2="248"></line><line stroke="#c62828" stroke-width="1.5" x1="200" x2="200" y1="244" y2="252"></line><line stroke="#c62828" stroke-width="1.5" x1="360" x2="360" y1="244" y2="252"></line><line stroke="#aaa" stroke-dasharray="4,3" stroke-width="1.2" x1="200" x2="200" y1="30" y2="260"></line><rect fill="#a5d6a7" height="44" rx="4" width="90" x="260" y="38"></rect><text fill="#1b5e20" font-size="11" text-anchor="middle" x="305" y="56">ACK / CTS</text><text fill="#2e7d32" font-size="10" text-anchor="middle" x="305" y="70">立即响应帧</text><rect fill="#fff176" height="44" rx="4" width="90" x="300" y="115"></rect><text fill="#7c5c00" font-size="11" text-anchor="middle" x="345" y="133">PCF 控制帧</text><text fill="#9e6c00" font-size="10" text-anchor="middle" x="345" y="147">点协调功能</text><rect fill="#f8bbd0" height="44" rx="4" stroke="#e91e63" stroke-dasharray="4,2" stroke-width="1" width="80" x="360" y="192"></rect><text fill="#880e4f" font-size="11" text-anchor="middle" x="400" y="210">随机退避</text><text fill="#ad1457" font-size="10" text-anchor="middle" x="400" y="224">Backoff</text><rect fill="#ef9a9a" height="44" rx="4" width="90" x="440" y="192"></rect><text fill="#b71c1c" font-size="11" text-anchor="middle" x="485" y="210">DATA</text><text fill="#c62828" font-size="10" text-anchor="middle" x="485" y="224">普通数据帧</text><text fill="#555" font-size="12" font-weight="bold" x="40" y="305">长度对比</text><rect fill="#c8e6c9" height="18" rx="3" width="60" x="40" y="318"></rect><text fill="#2e7d32" font-size="10" font-weight="bold" text-anchor="middle" x="70" y="330">SIFS</text><rect fill="#fff9c4" height="18" rx="3" width="100" x="40" y="342"></rect><text fill="#f57f17" font-size="10" font-weight="bold" text-anchor="middle" x="90" y="354">PIFS</text><rect fill="#fce4ec" height="18" rx="3" width="160" x="40" y="366"></rect><text fill="#c62828" font-size="10" font-weight="bold" text-anchor="middle" x="120" y="378">DIFS</text><rect fill="#fff" height="230" rx="6" stroke="#ddd" stroke-width="1.2" width="240" x="560" y="100"></rect><text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="680" y="122">IFS 用途速查</text><line stroke="#eee" stroke-width="1" x1="570" x2="790" y1="130" y2="130"></line><rect fill="#c8e6c9" height="26" rx="3" width="50" x="570" y="138"></rect><text fill="#2e7d32" font-size="11" font-weight="bold" text-anchor="middle" x="595" y="155">SIFS</text><text fill="#333" font-size="10" text-anchor="end" x="790" y="148">ACK、CTS、</text><text fill="#333" font-size="10" text-anchor="end" x="790" y="161">分片帧响应</text><rect fill="#fff9c4" height="26" rx="3" width="50" x="570" y="178"></rect><text fill="#f57f17" font-size="11" font-weight="bold" text-anchor="middle" x="595" y="195">PIFS</text><text fill="#333" font-size="10" text-anchor="end" x="790" y="188">点协调功能</text><text fill="#333" font-size="10" text-anchor="end" x="790" y="201">(PCF) 帧</text><rect fill="#fce4ec" height="26" rx="3" width="50" x="570" y="218"></rect><text fill="#c62828" font-size="11" font-weight="bold" text-anchor="middle" x="595" y="235">DIFS</text><text fill="#333" font-size="10" text-anchor="end" x="790" y="228">普通数据帧</text><text fill="#333" font-size="10" text-anchor="end" x="790" y="241">争用信道前等待</text><rect fill="#f3f3f3" height="56" rx="4" width="220" x="570" y="262"></rect><text fill="#555" font-size="10" text-anchor="middle" x="680" y="279">IFS 越短 → 优先级越高</text><text fill="#555" font-size="10" text-anchor="middle" x="680" y="295">ACK/CTS 等 SIFS 后发出，</text><text fill="#555" font-size="10" text-anchor="middle" x="680" y="309">可抢在普通数据帧之前占用信道</text><text fill="#444" font-size="13" x="40" y="400">SIFS &lt; PIFS &lt; DIFS</text></svg>