<svg xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" viewBox="0 0 820 560"><style>.title{font-family:Arial,sans-serif;font-weight:700}.label{font-family:Arial,sans-serif}.step{fill:#34495e}.data{fill:#2c3e50}.gen{fill:#c0392b}.xor{fill:#16a085}.rem{fill:#8e44ad;font-weight:700}.quot{fill:#2980b9;font-weight:700}.bar{stroke:#7f8c8d;stroke-width:1}.note{fill:#7f8c8d;font-size:11px;font-family:Arial,sans-serif}</style><text class="title" fill="#2c3e50" font-size="20" text-anchor="middle" x="410" y="28">CRC 模 2 除法计算过程</text><text class="note" text-anchor="middle" x="410" y="48">数据 1010001101，生成多项式 110101，扩展数据 101000110100000</text><g transform="translate(40,68)"><rect fill="#c0392b" height="14" opacity=".85" width="14"></rect><text class="label" fill="#2c3e50" font-size="12" x="20" y="12">生成多项式（除数）</text><rect fill="#16a085" height="14" opacity=".85" width="14" x="170"></rect><text class="label" fill="#2c3e50" font-size="12" x="190" y="12">异或结果</text><rect fill="#8e44ad" height="14" opacity=".85" width="14" x="280"></rect><text class="label" fill="#2c3e50" font-size="12" x="300" y="12">最终余数 (CRC)</text><rect fill="#2980b9" height="14" opacity=".85" width="14" x="430"></rect><text class="label" fill="#2c3e50" font-size="12" x="450" y="12">商 (不参与编码)</text></g><g font-size="16"><text class="quot" x="250" y="115">商：1 1 0 1 0 1 0 1 1</text></g><g font-size="15" transform="translate(120,135)"><text class="gen" x="0" y="0">110101</text><text fill="#34495e" x="60" y="0">)</text><text class="data" x="80" y="0">1 0 1 0 0 0 1 1 0 1 0 0 0 0 0</text><line class="bar" x1="80" x2="430" y1="6" y2="6"></line><text class="gen" x="80" y="28">1 1 0 1 0 1</text><line class="bar" x1="80" x2="200" y1="34" y2="34"></line><text class="xor" x="95" y="56">1 1 1 0 1 1</text><text class="gen" x="95" y="78">1 1 0 1 0 1</text><line class="bar" x1="95" x2="215" y1="84" y2="84"></line><text class="xor" x="125" y="106">1 1 1 0 1 0</text><text class="gen" x="125" y="128">1 1 0 1 0 1</text><line class="bar" x1="125" x2="245" y1="134" y2="134"></line><text class="xor" x="155" y="156">1 1 1 1 1 0</text><text class="gen" x="155" y="178">1 1 0 1 0 1</text><line class="bar" x1="155" x2="275" y1="184" y2="184"></line><text class="xor" x="185" y="206">1 0 1 1 0 0</text><text class="gen" x="185" y="228">1 1 0 1 0 1</text><line class="bar" x1="185" x2="305" y1="234" y2="234"></line><text class="xor" x="200" y="256">1 1 0 0 1 0</text><text class="gen" x="200" y="278">1 1 0 1 0 1</text><line class="bar" x1="200" x2="320" y1="284" y2="284"></line><text class="rem" x="245" y="306">0 1 1 1 0</text></g><g fill="#34495e" font-family="Arial, sans-serif" font-size="12"><g transform="translate(560,135)"><text fill="#2c3e50" font-weight="bold" y="0">步骤说明</text><circle cx="6" cy="22" fill="#c0392b" r="4"></circle><text x="18" y="26">每次取当前高位与生成多项式按位异或</text><circle cx="6" cy="46" fill="#16a085" r="4"></circle><text x="18" y="50">异或后的结果向右移一位继续除</text><circle cx="6" cy="70" fill="#2980b9" r="4"></circle><text x="18" y="74">仅看首位是否为 1，决定该位商 0/1</text><circle cx="6" cy="94" fill="#8e44ad" r="4"></circle><text x="18" y="98">最终余数即为 CRC 校验码 01110</text><text fill="#2c3e50" font-weight="bold" x="0" y="130">关键规则</text><text x="0" y="150">1 ⊕ 1 = 0, 0 ⊕ 0 = 0</text><text x="0" y="168">1 ⊕ 0 = 1, 0 ⊕ 1 = 1</text><text fill="#7f8c8d" x="0" y="190">（模 2 减法 = 按位异或，无借位）</text></g></g><rect fill="#8e44ad" height="60" opacity=".08" rx="6" width="660" x="80" y="470"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" x="410" y="495">最终发送帧 = 原始数据 + CRC 校验码</text><text class="data" font-size="16" font-weight="bold" text-anchor="middle" x="410" y="518">1010001101<tspan fill="#8e44ad">01110</tspan></text></svg>