<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"><rect fill="none" height="400" width="700"></rect><text fill="#2c3e50" font-size="18" font-weight="bold" text-anchor="middle" x="350" y="25">HTTP Cookie 工作原理</text><g id="browser"><rect fill="#3498db" height="80" rx="8" stroke="#2980b9" stroke-width="2" width="120" x="50" y="60"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="110" y="85">浏览器</text><text fill="#fff" font-size="10" text-anchor="middle" x="110" y="100">客户端</text><rect fill="#e74c3c" height="20" opacity=".8" rx="4" width="100" x="60" y="110"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="110" y="123">Cookie 存储</text></g><g id="server"><rect fill="#27ae60" height="80" rx="8" stroke="#229954" stroke-width="2" width="120" x="530" y="60"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="590" y="85">服务器</text><text fill="#fff" font-size="10" text-anchor="middle" x="590" y="100">Web Server</text><rect fill="#f39c12" height="20" opacity=".8" rx="4" width="100" x="540" y="110"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="590" y="123">会话数据</text></g><g id="first-request"><text fill="#2c3e50" font-size="14" font-weight="bold" x="50" y="180">1. 首次请求（无状态）</text><defs><marker id="arrowhead1" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead1)" stroke="#e74c3c" stroke-width="2" x1="170" x2="450" y1="195" y2="195"></line><text fill="#e74c3c" font-size="10" text-anchor="middle" x="310" y="190">GET /login</text><defs><marker id="arrowhead2" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#27ae60" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead2)" stroke="#27ae60" stroke-width="2" x1="450" x2="170" y1="210" y2="210"></line><text fill="#27ae60" font-size="10" text-anchor="middle" x="310" y="225">Set-Cookie: sessionId=abc123</text></g><g id="subsequent-request"><text fill="#2c3e50" font-size="14" font-weight="bold" x="50" y="270">2. 后续请求（有状态）</text><defs><marker id="arrowhead3" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#8e44ad" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead3)" stroke="#8e44ad" stroke-width="2" x1="170" x2="450" y1="285" y2="285"></line><text fill="#8e44ad" font-size="10" text-anchor="middle" x="310" y="280">GET /dashboard</text><text fill="#8e44ad" font-size="10" text-anchor="middle" x="310" y="295">Cookie: sessionId=abc123</text><defs><marker id="arrowhead4" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#16a085" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead4)" stroke="#16a085" stroke-width="2" x1="450" x2="170" y1="305" y2="305"></line><text fill="#16a085" font-size="10" text-anchor="middle" x="310" y="320">200 OK (个性化内容)</text></g><g id="features"><rect fill="#ecf0f1" height="50" rx="8" stroke="#bdc3c7" stroke-width="1" width="600" x="50" y="340"></rect><text fill="#2c3e50" font-size="12" font-weight="bold" x="60" y="358">Cookie 关键特点：</text><text fill="#2c3e50" font-size="10" x="60" y="375">• 自动发送：浏览器自动在请求中包含匹配的 Cookie</text><text fill="#2c3e50" font-size="10" x="350" y="375">• 状态保持：服务器通过 Cookie 识别用户身份</text></g><g id="legend"><circle cx="180" cy="50" fill="#e74c3c" r="3"></circle><text fill="#e74c3c" font-size="10" x="190" y="55">首次请求</text><circle cx="280" cy="50" fill="#27ae60" r="3"></circle><text fill="#27ae60" font-size="10" x="290" y="55">设置Cookie</text><circle cx="380" cy="50" fill="#8e44ad" r="3"></circle><text fill="#8e44ad" font-size="10" x="390" y="55">携带Cookie</text><circle cx="480" cy="50" fill="#16a085" r="3"></circle><text fill="#16a085" font-size="10" x="490" y="55">识别用户</text></g></svg>