<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="none" height="400" width="700"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="350" y="25">HTTP Cookie 工作原理</text><g id="browser"><rect fill="var(--indigo-mid)" height="80" rx="8" stroke="var(--blue-deep)" stroke-width="2" width="120" x="50" y="60"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="85">浏览器</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="100">客户端</text><rect fill="var(--red-deep)" height="20" opacity=".8" rx="4" width="100" x="60" y="110"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="123">Cookie 存储</text></g><g id="server"><rect fill="var(--green-mid)" height="80" rx="8" stroke="var(--green-mid)" stroke-width="2" width="120" x="530" y="60"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="590" y="85">服务器</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="590" y="100">Web Server</text><rect fill="var(--yellow-mid)" height="20" opacity=".8" rx="4" width="100" x="540" y="110"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="590" y="123">会话数据</text></g><g id="first-request"><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="50" y="180">1. 首次请求（无状态）</text><defs><marker id="arrowhead1" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="var(--red-deep)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead1)" stroke="var(--red-deep)" stroke-width="2" x1="170" x2="450" y1="195" y2="195"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="190">GET /login</text><defs><marker id="arrowhead2" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="var(--green-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead2)" stroke="var(--green-mid)" stroke-width="2" x1="450" x2="170" y1="210" y2="210"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="225">Set-Cookie: sessionId=abc123</text></g><g id="subsequent-request"><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="50" y="270">2. 后续请求（有状态）</text><defs><marker id="arrowhead3" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="var(--purple-deep)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead3)" stroke="var(--purple-deep)" stroke-width="2" x1="170" x2="450" y1="285" y2="285"></line><text fill="var(--purple-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="280">GET /dashboard</text><text fill="var(--purple-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="295">Cookie: sessionId=abc123</text><defs><marker id="arrowhead4" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="var(--mint-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead4)" stroke="var(--mint-mid)" stroke-width="2" x1="450" x2="170" y1="305" y2="305"></line><text fill="var(--mint-mid)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="320">200 OK (个性化内容)</text></g><g id="features"><rect fill="var(--neutral-soft)" height="50" rx="8" stroke="var(--indigo-light)" stroke-width="1" width="600" x="50" y="340"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="60" y="358">Cookie 关键特点：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)" x="60" y="375">• 自动发送：浏览器自动在请求中包含匹配的 Cookie</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)" x="350" y="375">• 状态保持：服务器通过 Cookie 识别用户身份</text></g><g id="legend"><circle cx="180" cy="50" fill="var(--red-deep)" r="3"></circle><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="190" y="55">首次请求</text><circle cx="280" cy="50" fill="var(--green-mid)" r="3"></circle><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="290" y="55">设置Cookie</text><circle cx="380" cy="50" fill="var(--purple-deep)" r="3"></circle><text fill="var(--purple-deep)" font-size="var(--svg-font-size-caption)" x="390" y="55">携带Cookie</text><circle cx="480" cy="50" fill="var(--mint-mid)" r="3"></circle><text fill="var(--mint-mid)" font-size="var(--svg-font-size-caption)" x="490" y="55">识别用户</text></g></svg>