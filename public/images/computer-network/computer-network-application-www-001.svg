<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="var(--surface)" height="600" width="800"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30" class="svg-text svg-text-on-light">HTTP 组成部分</text><rect fill="var(--indigo-mid)" height="80" rx="8" stroke="var(--blue-deep)" stroke-width="2" width="120" x="50" y="80"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="110" class="svg-text svg-text-on-dark">客户端</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="110" y="130" class="svg-text svg-text-on-dark">(浏览器)</text><rect fill="var(--red-deep)" height="80" rx="8" stroke="var(--red-deep)" stroke-width="2" width="120" x="630" y="80"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="690" y="110" class="svg-text svg-text-on-dark">服务器</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="690" y="130" class="svg-text svg-text-on-dark">(Web服务器)</text><path d="M180 1e2H620" fill="none" marker-end="url(#arrowhead-green)" stroke="var(--green-mid)" stroke-width="3"></path><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="95" class="svg-text svg-text-on-light">HTTP 请求</text><path d="M620 140H180" fill="none" marker-end="url(#arrowhead-orange)" stroke="var(--orange-mid)" stroke-width="3"></path><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="155" class="svg-text svg-text-on-light">HTTP 响应</text><defs><marker id="arrowhead-green" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--green-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-orange" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--orange-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><rect fill="var(--purple-deep)" height="160" rx="8" stroke="var(--purple-deep)" stroke-width="2" width="180" x="50" y="200"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="140" y="220" class="svg-text svg-text-on-dark">HTTP 方法</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="240" class="svg-text svg-text-on-dark">• GET - 获取资源</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="255" class="svg-text svg-text-on-dark">• POST - 提交数据</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="270" class="svg-text svg-text-on-dark">• PUT - 更新资源</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="285" class="svg-text svg-text-on-dark">• DELETE - 删除资源</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="300" class="svg-text svg-text-on-dark">• HEAD - 获取头部</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="315" class="svg-text svg-text-on-dark">• OPTIONS - 通信选项</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="330" class="svg-text svg-text-on-dark">• PATCH - 部分修改</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="345" class="svg-text svg-text-on-dark">• CONNECT, TRACE...</text><rect fill="var(--yellow-mid)" height="160" rx="8" stroke="var(--orange-mid)" stroke-width="2" width="180" x="260" y="200"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="350" y="220" class="svg-text svg-text-on-dark">状态码</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="240" class="svg-text svg-text-on-dark">• 200 OK - 请求成功</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="255" class="svg-text svg-text-on-dark">• 404 Not Found - 未找到</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="270" class="svg-text svg-text-on-dark">• 500 Internal Server Error</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="285" class="svg-text svg-text-on-dark">• 1xx - 信息响应</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="300" class="svg-text svg-text-on-dark">• 2xx - 成功响应</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="315" class="svg-text svg-text-on-dark">• 3xx - 重定向</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="330" class="svg-text svg-text-on-dark">• 4xx - 客户端错误</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="345" class="svg-text svg-text-on-dark">• 5xx - 服务器错误</text><rect fill="var(--mint-mid)" height="160" rx="8" stroke="var(--mint-mid)" stroke-width="2" width="150" x="470" y="200"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="545" y="220" class="svg-text svg-text-on-dark">头部字段</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="240" class="svg-text svg-text-on-dark">• Content-Type</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="255" class="svg-text svg-text-on-dark">• User-Agent</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="270" class="svg-text svg-text-on-dark">• Authorization</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="285" class="svg-text svg-text-on-dark">• Accept</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="300" class="svg-text svg-text-on-dark">• Content-Length</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="315" class="svg-text svg-text-on-dark">• Cache-Control</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="330" class="svg-text svg-text-on-dark">• Cookie</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="345" class="svg-text svg-text-on-dark">• Set-Cookie</text><rect fill="var(--blue-ink)" height="160" rx="8" stroke="var(--blue-ink)" stroke-width="2" width="120" x="650" y="200"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="710" y="220" class="svg-text svg-text-on-dark">消息体</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="250" class="svg-text svg-text-on-dark">请求数据:</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="265" class="svg-text svg-text-on-light">• JSON 数据</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="280" class="svg-text svg-text-on-light">• 表单数据</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="295" class="svg-text svg-text-on-light">• 文件上传</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="320" class="svg-text svg-text-on-dark">响应内容:</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="335" class="svg-text svg-text-on-light">• HTML 页面</text><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="350" class="svg-text svg-text-on-light">• JSON 数据</text><rect fill="var(--neutral-soft)" height="180" rx="8" stroke="var(--indigo-light)" stroke-width="2" width="340" x="50" y="390"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="410" class="svg-text svg-text-on-light">HTTP 请求结构</text><rect fill="var(--surface)" height="140" stroke="var(--indigo-light)" width="320" x="60" y="420"></rect><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="440" class="svg-text svg-text-on-light">GET /api/users HTTP/1.1</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="455" class="svg-text svg-text-on-light">Host: example.com</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="470" class="svg-text svg-text-on-light">User-Agent: Mozilla/5.0...</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="485" class="svg-text svg-text-on-light">Accept: application/json</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="500" class="svg-text svg-text-on-light">Authorization: Bearer token</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="520" class="svg-text svg-text-on-light">[空行]</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="540" class="svg-text svg-text-on-light">[请求体 - 如果有的话]</text><rect fill="var(--neutral-soft)" height="180" rx="8" stroke="var(--indigo-light)" stroke-width="2" width="340" x="410" y="390"></rect><text font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="580" y="410" class="svg-text svg-text-on-light">HTTP 响应结构</text><rect fill="var(--surface)" height="140" stroke="var(--indigo-light)" width="320" x="420" y="420"></rect><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="440" class="svg-text svg-text-on-light">HTTP/1.1 200 OK</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="455" class="svg-text svg-text-on-light">Content-Type: application/json</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="470" class="svg-text svg-text-on-light">Content-Length: 1234</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="485" class="svg-text svg-text-on-light">Set-Cookie: session=abc123</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="500" class="svg-text svg-text-on-light">Cache-Control: no-cache</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="520" class="svg-text svg-text-on-light">[空行]</text><text font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="540" class="svg-text svg-text-on-light">{"users": [...]}</text></svg>