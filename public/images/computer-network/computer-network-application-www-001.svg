<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="var(--surface)" height="600" width="800"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">HTTP 组成部分</text><rect fill="var(--indigo-mid)" height="80" rx="8" stroke="var(--blue-deep)" stroke-width="2" width="120" x="50" y="80"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="110" y="110">客户端</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="110" y="130">(浏览器)</text><rect fill="var(--red-deep)" height="80" rx="8" stroke="var(--red-deep)" stroke-width="2" width="120" x="630" y="80"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="690" y="110">服务器</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="690" y="130">(Web服务器)</text><path d="M180 1e2H620" fill="none" marker-end="url(#arrowhead-green)" stroke="var(--green-mid)" stroke-width="3"></path><text fill="var(--green-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="95">HTTP 请求</text><path d="M620 140H180" fill="none" marker-end="url(#arrowhead-orange)" stroke="var(--orange-mid)" stroke-width="3"></path><text fill="var(--orange-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="155">HTTP 响应</text><defs><marker id="arrowhead-green" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--green-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-orange" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--orange-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><rect fill="var(--purple-deep)" height="160" rx="8" stroke="var(--purple-deep)" stroke-width="2" width="180" x="50" y="200"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="140" y="220">HTTP 方法</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="240">• GET - 获取资源</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="255">• POST - 提交数据</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="270">• PUT - 更新资源</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="285">• DELETE - 删除资源</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="300">• HEAD - 获取头部</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="315">• OPTIONS - 通信选项</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="330">• PATCH - 部分修改</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="60" y="345">• CONNECT, TRACE...</text><rect fill="var(--yellow-mid)" height="160" rx="8" stroke="var(--orange-mid)" stroke-width="2" width="180" x="260" y="200"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="350" y="220">状态码</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="240">• 200 OK - 请求成功</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="255">• 404 Not Found - 未找到</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="270">• 500 Internal Server Error</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="285">• 1xx - 信息响应</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="300">• 2xx - 成功响应</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="315">• 3xx - 重定向</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="330">• 4xx - 客户端错误</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="270" y="345">• 5xx - 服务器错误</text><rect fill="var(--mint-mid)" height="160" rx="8" stroke="var(--mint-mid)" stroke-width="2" width="150" x="470" y="200"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="545" y="220">头部字段</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="240">• Content-Type</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="255">• User-Agent</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="270">• Authorization</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="285">• Accept</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="300">• Content-Length</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="315">• Cache-Control</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="330">• Cookie</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="480" y="345">• Set-Cookie</text><rect fill="var(--blue-ink)" height="160" rx="8" stroke="var(--blue-ink)" stroke-width="2" width="120" x="650" y="200"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="710" y="220">消息体</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="250">请求数据:</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="265">• JSON 数据</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="280">• 表单数据</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="295">• 文件上传</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="320">响应内容:</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="335">• HTML 页面</text><text fill="var(--indigo-light)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="660" y="350">• JSON 数据</text><rect fill="var(--neutral-soft)" height="180" rx="8" stroke="var(--indigo-light)" stroke-width="2" width="340" x="50" y="390"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="220" y="410">HTTP 请求结构</text><rect fill="var(--surface)" height="140" stroke="var(--indigo-light)" width="320" x="60" y="420"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="440">GET /api/users HTTP/1.1</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="455">Host: example.com</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="470">User-Agent: Mozilla/5.0...</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="485">Accept: application/json</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="500">Authorization: Bearer token</text><text fill="var(--neutral-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="520">[空行]</text><text fill="var(--orange-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="70" y="540">[请求体 - 如果有的话]</text><rect fill="var(--neutral-soft)" height="180" rx="8" stroke="var(--indigo-light)" stroke-width="2" width="340" x="410" y="390"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="580" y="410">HTTP 响应结构</text><rect fill="var(--surface)" height="140" stroke="var(--indigo-light)" width="320" x="420" y="420"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="440">HTTP/1.1 200 OK</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="455">Content-Type: application/json</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="470">Content-Length: 1234</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="485">Set-Cookie: session=abc123</text><text fill="var(--green-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="500">Cache-Control: no-cache</text><text fill="var(--neutral-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="520">[空行]</text><text fill="var(--orange-mid)" font-family="var(--svg-font-family-mono)" font-size="var(--svg-font-size-label)" x="430" y="540">{"users": [...]}</text></svg>