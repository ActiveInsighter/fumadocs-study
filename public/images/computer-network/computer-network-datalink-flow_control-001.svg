<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1e3 700" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="none" height="700" width="1e3"></rect><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--blue-ink)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="500" y="40">ARQ 协议（Automatic Repeat reQuest）</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-title)" text-anchor="middle" x="500" y="70">ACK 编号表示接收方下一次期望收到的帧</text><rect fill="var(--sky-soft)" height="120" rx="10" stroke="var(--indigo-mid)" stroke-width="2" width="900" x="50" y="100"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="70" y="130">核心思想：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="90" y="155">• 发送方发送数据后，根据接收方返回的 ACK 判断数据是否正确到达</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="90" y="175">• ACK = n 表示编号小于 n 的帧已按要求收到，下一帧期望收到编号 n</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" x="90" y="195">• 超时或收到重复 ACK 时，发送方重传丢失或出错的数据</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="500" y="270">三种主要 ARQ 协议</text><g><rect fill="var(--amber-soft)" height="350" rx="8" stroke="var(--yellow-mid)" stroke-width="2" width="280" x="50" y="300"></rect><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="190" y="330">停等 ARQ</text><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="190" y="350">（Stop-and-Wait）</text><line stroke="var(--blue-ink)" stroke-width="2" x1="120" x2="120" y1="380" y2="600"></line><line stroke="var(--blue-ink)" stroke-width="2" x1="260" x2="260" y1="380" y2="600"></line><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="120" y="375">发送方</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="260" y="375">接收方</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="2" x1="120" x2="250" y1="400" y2="420"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="180" y="404">数据帧 0</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="2" x1="260" x2="130" y1="440" y2="460"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="190" y="444">ACK 1</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="2" x1="120" x2="250" y1="480" y2="500"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="180" y="484">数据帧 1</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="2" x1="260" x2="130" y1="520" y2="540"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="190" y="524">ACK 2</text><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-label)" x="70" y="620">特点：发送一帧，等待对应确认</text><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-label)" x="70" y="635">效率较低，实现简单</text></g><g><rect fill="var(--cyan-light)" height="350" rx="8" stroke="var(--sky-mid)" stroke-width="2" width="280" x="360" y="300"></rect><text fill="var(--cyan-deep)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="500" y="330">回退 N 帧 ARQ</text><text fill="var(--cyan-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="500" y="350">（Go-Back-N）</text><line stroke="var(--blue-ink)" stroke-width="2" x1="430" x2="430" y1="380" y2="600"></line><line stroke="var(--blue-ink)" stroke-width="2" x1="570" x2="570" y1="380" y2="600"></line><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="430" y="375">发送方</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="570" y="375">接收方</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="1.5" x1="430" x2="560" y1="400" y2="410"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="475" y="399">帧 0</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="1.5" x1="430" x2="560" y1="415" y2="425"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="475" y="414">帧 1</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="1.5" x1="430" x2="560" y1="430" y2="440"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="475" y="429">帧 2</text><line stroke="var(--red-deep)" stroke-dasharray="5,5" stroke-width="1.5" x1="430" x2="520" y1="445" y2="455"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="470" y="447">帧 3 丢失</text><line marker-end="url(#arrowhead)" stroke="var(--neutral-mid)" stroke-width="1.5" x1="430" x2="560" y1="465" y2="475"></line><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" x="465" y="465">帧 4、5 被丢弃</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="2" x1="570" x2="440" y1="495" y2="505"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="482" y="494">ACK 3</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="1.5" x1="570" x2="440" y1="510" y2="520"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="480" y="527">重复 ACK 3</text><line marker-end="url(#arrowhead)" stroke="var(--yellow-mid)" stroke-width="2" x1="430" x2="560" y1="545" y2="555"></line><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-caption)" x="455" y="543">重传帧 3、4、5……</text><text fill="var(--cyan-deep)" font-size="var(--svg-font-size-label)" x="380" y="620">特点：采用累计确认</text><text fill="var(--cyan-deep)" font-size="var(--svg-font-size-label)" x="380" y="635">丢帧后从缺失帧开始回退重传</text></g><g><rect fill="var(--green-light)" height="350" rx="8" stroke="var(--lime-mid)" stroke-width="2" width="280" x="670" y="300"></rect><text fill="var(--green-deep)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="810" y="330">选择性重传 ARQ</text><text fill="var(--green-deep)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="810" y="350">（Selective Repeat）</text><line stroke="var(--blue-ink)" stroke-width="2" x1="740" x2="740" y1="380" y2="600"></line><line stroke="var(--blue-ink)" stroke-width="2" x1="880" x2="880" y1="380" y2="600"></line><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="740" y="375">发送方</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="880" y="375">接收方</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="1.5" x1="740" x2="870" y1="400" y2="410"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="785" y="399">帧 0</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="1.5" x1="740" x2="870" y1="415" y2="425"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="785" y="414">帧 1</text><line stroke="var(--red-deep)" stroke-dasharray="5,5" stroke-width="1.5" x1="740" x2="830" y1="430" y2="440"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="775" y="432">帧 2 丢失</text><line marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="1.5" x1="740" x2="870" y1="450" y2="460"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" x="770" y="450">帧 3 到达并缓存</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="1.5" x1="880" x2="750" y1="480" y2="485"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="800" y="477">ACK 1</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="1.5" x1="880" x2="750" y1="495" y2="500"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="800" y="492">ACK 2</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="1.5" x1="880" x2="750" y1="515" y2="520"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="760" y="512">ACK 2 + SACK 3</text><line marker-end="url(#arrowhead)" stroke="var(--yellow-mid)" stroke-width="2" x1="740" x2="870" y1="545" y2="555"></line><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-caption)" x="780" y="543">只重传帧 2</text><line marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="2" x1="880" x2="750" y1="575" y2="580"></line><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" x="800" y="573">ACK 4</text><text fill="var(--green-deep)" font-size="var(--svg-font-size-label)" x="690" y="620">特点：缓存失序帧，只重传缺失帧</text><text fill="var(--green-deep)" font-size="var(--svg-font-size-label)" x="690" y="635">效率最高，实现最复杂</text></g><rect fill="var(--yellow-light)" height="22" rx="5" stroke="var(--yellow-mid)" stroke-width="1" width="590" x="360" y="665"></rect><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="655" y="681">回退 N 帧与选择性重传均属于连续 ARQ；图中 ACK 采用“下一期待帧编号”语义</text></svg>