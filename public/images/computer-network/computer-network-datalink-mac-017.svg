size="var(--svg-font-size-caption)" x="848" y="82">t</text><line stroke="var(--purple-deep)" stroke-width="1.5" x1="200" x2="490" y1="306" y2="306"></line><line stroke="var(--purple-deep)" stroke-width="1.5" x1="200" x2="200" y1="302" y2="310"></line><line stroke="var(--purple-deep)" stroke-width="1.5" x1="490" x2="490" y1="302" y2="310"></line><text fill="var(--purple-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="345" y="320">SIFS+CTS+SIFS+DATA+SIFS+ACK</text><line stroke="var(--coral-deep)" stroke-width="1.5" x1="275" x2="490" y1="396" y2="396"></line><line stroke="var(--coral-deep)" stroke-width="1.5" x1="275" x2="275" y1="392" y2="400"></line><line stroke="var(--coral-deep)" stroke-width="1.5" x1="490" x2="490" y1="392" y2="400"></line><text fill="var(--coral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="382" y="412">SIFS+DATA+SIFS+ACK</text><rect fill="var(--surface)" height="300" rx="6" stroke="var(--neutral-light)" stroke-width="1.2" width="275" x="550" y="82"></rect><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="687" y="104">机制说明</text><line stroke="var(--neutral-soft)" stroke-width="1" x1="560" x2="815" y1="112" y2="112"></line><rect fill="var(--violet-deep)" height="18" rx="2" width="36" x="560" y="120"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="578" y="133">RTS</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="130">发送方请求占用信道</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="143">携带 Duration 字段</text><rect fill="var(--lime-deep)" height="18" rx="2" width="36" x="560" y="158"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="578" y="171">CTS</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="168">接收方允许发送</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="181">周围站点均可听到</text><rect fill="var(--violet-soft)" height="18" rx="2" stroke="var(--purple-mid)" stroke-width="1" width="36" x="560" y="196"></rect><text fill="var(--purple-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="578" y="209">NAV-C</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="206">听到 RTS → 设 NAV</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="219">= SIFS+CTS+SIFS+DATA+SIFS+ACK</text><rect fill="var(--red-soft)" height="18" rx="2" stroke="var(--orange-mid)" stroke-width="1" width="36" x="560" y="234"></rect><text fill="var(--coral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="578" y="247">NAV-D</text><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="244">只听到 CTS → 设 NAV</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="257">= SIFS+DATA+SIFS+ACK</text><line stroke="var(--neutral-soft)" stroke-width="1" x1="560" x2="815" y1="270" y2="270"></line><rect fill="var(--paper)" height="92" rx="4" width="255" x="560" y="278"></rect><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="687" y="296">考点提示</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="572" y="312">• NAV 从控制帧结束后开始计算</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="572" y="327">• 不含 DIFS，不含控制帧本身</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="572" y="342">• 隐藏站错过 RTS，NAV 比普通</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="572" y="357">站少 SIFS + CTS</text><rect fill="var(--yellow-soft)" height="42" rx="4" stroke="var(--yellow-mid)" stroke-width="1" width="430" x="100" y="425"></rect><text fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" x="115" y="441">隐藏站 D：与发送方 A 相互"看不见"，无法收到 RTS；</text><text fill="var(--amber-deep)" font-size="var(--svg-font-size-caption)" x="115" y="456">但能收到接收方 B 发出的 CTS，因此仍能设置 NAV 保持静默。</text></svg>