<svg xmlns="http://www.w3.org/2000/svg" font-family="var(--svg-font-family)" viewBox="0 0 860 480" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="var(--surface)" height="480" rx="8" width="860"></rect><text fill="var(--violet-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="52" y="108">发送方 A</text><text fill="var(--lime-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="52" y="198">接收方 B</text><text fill="var(--purple-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="52" y="288">普通站 C</text><text fill="var(--coral-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="52" y="378">隐藏站 D</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="52" y="440">(只听到CTS)</text><line stroke="var(--cyan-mid)" stroke-width="1.5" x1="96" x2="845" y1="100" y2="100"></line><line stroke="var(--cyan-mid)" stroke-width="1.5" x1="96" x2="845" y1="190" y2="190"></line><line stroke="var(--cyan-mid)" stroke-width="1.5" x1="96" x2="845" y1="280" y2="280"></line><line stroke="var(--cyan-mid)" stroke-width="1.5" x1="96" x2="845" y1="370" y2="370"></line><rect fill="var(--sky-soft)" height="34" rx="3" stroke="var(--blue-mid)" stroke-width="1" width="40" x="100" y="83"></rect><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="120" y="105">DIFS</text><rect fill="var(--violet-deep)" height="34" rx="3" width="60" x="140" y="83"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="170" y="105">RTS</text><rect fill="var(--sky-soft)" height="34" rx="3" stroke="var(--blue-mid)" stroke-width="1" width="20" x="275" y="83"></rect><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="285" y="105">SIFS</text><rect fill="var(--violet-deep)" height="34" rx="3" width="120" x="295" y="83"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="355" y="105">DATA</text><rect fill="var(--green-soft)" height="34" rx="3" stroke="var(--green-mid)" stroke-width="1" width="20" x="200" y="173"></rect><text fill="var(--lime-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="210" y="195">SIFS</text><rect fill="var(--lime-deep)" height="34" rx="3" width="55" x="220" y="173"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="247" y="195">CTS</text><rect fill="var(--green-soft)" height="34" rx="3" stroke="var(--green-mid)" stroke-width="1" width="20" x="415" y="173"></rect><text fill="var(--lime-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="425" y="195">SIFS</text><rect fill="var(--lime-deep)" height="34" rx="3" width="55" x="435" y="173"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="462" y="195">ACK</text><rect fill="var(--violet-soft)" height="34" rx="3" stroke="var(--purple-mid)" stroke-dasharray="5,3" stroke-width="1.5" width="290" x="200" y="263"></rect><text fill="var(--purple-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="345" y="285">NAV (听到 RTS 后设置)</text><polygon fill="var(--purple-deep)" opacity=".7" points="200,260 193,248 207,248"></polygon><text fill="var(--purple-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="200" y="246">收到RTS</text><rect fill="var(--red-soft)" height="34" rx="3" stroke="var(--orange-mid)" stroke-