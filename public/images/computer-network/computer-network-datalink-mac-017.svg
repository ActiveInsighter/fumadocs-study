<svg xmlns="http://www.w3.org/2000/svg" font-family="var(--svg-font-family)" viewBox="0 0 860 480" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="var(--surface)" height="480" rx="8" width="860"></rect><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="52" y="108" class="svg-text svg-text-on-light">发送方 A</text><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="52" y="198" class="svg-text svg-text-on-light">接收方 B</text><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="52" y="288" class="svg-text svg-text-on-light">普通站 C</text><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="52" y="378" class="svg-text svg-text-on-light">隐藏站 D</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="52" y="440" class="svg-text svg-text-on-light">(只听到CTS)</text><line stroke="var(--cyan-mid)" stroke-width="1.5" x1="96" x2="845" y1="100" y2="100"></line><line stroke="var(--cyan-mid)" stroke-width="1.5" x1="96" x2="845" y1="190" y2="190"></line><line stroke="var(--cyan-mid)" stroke-width="1.5" x1="96" x2="845" y1="280" y2="280"></line><line stroke="var(--cyan-mid)" stroke-width="1.5" x1="96" x2="845" y1="370" y2="370"></line><rect fill="var(--sky-soft)" height="34" rx="3" stroke="var(--blue-mid)" stroke-width="1" width="40" x="100" y="83"></rect><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="120" y="105" class="svg-text svg-text-on-light">DIFS</text><rect fill="var(--violet-deep)" height="34" rx="3" width="60" x="140" y="83"></rect><text font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="170" y="105" class="svg-text svg-text-on-dark">RTS</text><rect fill="var