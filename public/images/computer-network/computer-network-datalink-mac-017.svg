<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'PingFang SC', sans-serif" viewBox="0 0 860 480"><rect fill="#fafafa" height="480" rx="8" width="860"></rect><text fill="#1565c0" font-size="13" font-weight="bold" text-anchor="middle" x="52" y="108">发送方 A</text><text fill="#2e7d32" font-size="13" font-weight="bold" text-anchor="middle" x="52" y="198">接收方 B</text><text fill="#6a1b9a" font-size="13" font-weight="bold" text-anchor="middle" x="52" y="288">普通站 C</text><text fill="#bf360c" font-size="13" font-weight="bold" text-anchor="middle" x="52" y="378">隐藏站 D</text><text fill="#888" font-size="11" text-anchor="middle" x="52" y="440">(只听到CTS)</text><line stroke="#b0bec5" stroke-width="1.5" x1="96" x2="845" y1="100" y2="100"></line><line stroke="#b0bec5" stroke-width="1.5" x1="96" x2="845" y1="190" y2="190"></line><line stroke="#b0bec5" stroke-width="1.5" x1="96" x2="845" y1="280" y2="280"></line><line stroke="#b0bec5" stroke-width="1.5" x1="96" x2="845" y1="370" y2="370"></line><rect fill="#e3f2fd" height="34" rx="3" stroke="#90caf9" stroke-width="1" width="40" x="100" y="83"></rect><text fill="#1565c0" font-size="10" text-anchor="middle" x="120" y="105">DIFS</text><rect fill="#1565c0" height="34" rx="3" width="60" x="140" y="83"></rect><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="170" y="105">RTS</text><rect fill="#e3f2fd" height="34" rx="3" stroke="#90caf9" stroke-width="1" width="20" x="275" y="83"></rect><text fill="#1565c0" font-size="9" text-anchor="middle" x="285" y="105">SIFS</text><rect fill="#0d47a1" height="34" rx="3" width="120" x="295" y="83"></rect><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="355" y="105">DATA</text><rect fill="#e8f5e9" height="34" rx="3" stroke="#a5d6a7" stroke-width="1" width="20" x="200" y="173"></rect><text fill="#2e7d32" font-size="9" text-anchor="middle" x="210" y="195">SIFS</text><rect fill="#2e7d32" height="34" rx="3" width="55" x="220" y="173"></rect><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="247" y="195">CTS</text><rect fill="#e8f5e9" height="34" rx="3" stroke="#a5d6a7" stroke-width="1" width="20" x="415" y="173"></rect><text fill="#2e7d32" font-size="9" text-anchor="middle" x="425" y="195">SIFS</text><rect fill="#2e7d32" height="34" rx="3" width="55" x="435" y="173"></rect><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="462" y="195">ACK</text><rect fill="#ede7f6" height="34" rx="3" stroke="#ce93d8" stroke-dasharray="5,3" stroke-width="1.5" width="290" x="200" y="263"></rect><text fill="#6a1b9a" font-size="10" font-weight="bold" text-anchor="middle" x="345" y="285">NAV (听到 RTS 后设置)</text><polygon fill="#6a1b9a" opacity=".7" points="200,260 193,248 207,248"></polygon><text fill="#6a1b9a" font-size="9" text-anchor="middle" x="200" y="246">收到RTS</text><rect fill="#fbe9e7" height="34" rx="3" stroke="#ff8a65" stroke-dasharray="5,3" stroke-width="1.5" width="215" x="275" y="353"></rect><text fill="#bf360c" font-size="10" font-weight="bold" text-anchor="middle" x="382" y="375">NAV (只听到 CTS 后设置)</text><polygon fill="#bf360c" opacity=".7" points="275,350 268,338 282,338"></polygon><text fill="#bf360c" font-size="9" text-anchor="middle" x="275" y="336">收到CTS</text><line stroke="#90caf9" stroke-dasharray="4,3" stroke-width="1" x1="200" x2="200" y1="75" y2="400"></line><line stroke="#a5d6a7" stroke-dasharray="4,3" stroke-width="1" x1="275" x2="275" y1="75" y2="400"></line><line stroke="#bbdefb" stroke-dasharray="4,3" stroke-width="1" x1="415" x2="415" y1="75" y2="400"></line><line stroke="#c8e6c9" stroke-dasharray="4,3" stroke-width="1" x1="490" x2="490" y1="75" y2="400"></line><text fill="#555" font-size="9" text-anchor="middle" x="120" y="72">DIFS</text><text fill="#1565c0" font-size="9" text-anchor="middle" x="170" y="72">RTS</text><text fill="#555" font-size="9" text-anchor="middle" x="210" y="72">SIFS</text><text fill="#2e7d32" font-size="9" text-anchor="middle" x="247" y="72">CTS</text><text fill="#555" font-size="9" text-anchor="middle" x="285" y="72">SIFS</text><text fill="#0d47a1" font-size="9" text-anchor="middle" x="355" y="72">DATA</text><text fill="#555" font-size="9" text-anchor="middle" x="425" y="72">SIFS</text><text fill="#2e7d32" font-size="9" text-anchor="middle" x="462" y="72">ACK</text><line stroke="#ddd" stroke-width="1" x1="96" x2="845" y1="78" y2="78"></line><text fill="#aaa" font-size="10" x="848" y="82">t</text><line stroke="#6a1b9a" stroke-width="1.5" x1="200" x2="490" y1="306" y2="306"></line><line stroke="#6a1b9a" stroke-width="1.5" x1="200" x2="200" y1="302" y2="310"></line><line stroke="#6a1b9a" stroke-width="1.5" x1="490" x2="490" y1="302" y2="310"></line><text fill="#6a1b9a" font-size="9" text-anchor="middle" x="345" y="320">SIFS+CTS+SIFS+DATA+SIFS+ACK</text><line stroke="#bf360c" stroke-width="1.5" x1="275" x2="490" y1="396" y2="396"></line><line stroke="#bf360c" stroke-width="1.5" x1="275" x2="275" y1="392" y2="400"></line><line stroke="#bf360c" stroke-width="1.5" x1="490" x2="490" y1="392" y2="400"></line><text fill="#bf360c" font-size="9" text-anchor="middle" x="382" y="412">SIFS+DATA+SIFS+ACK</text><rect fill="#fff" height="300" rx="6" stroke="#e0e0e0" stroke-width="1.2" width="275" x="550" y="82"></rect><text fill="#333" font-size="13" font-weight="bold" text-anchor="middle" x="687" y="104">机制说明</text><line stroke="#eee" stroke-width="1" x1="560" x2="815" y1="112" y2="112"></line><rect fill="#1565c0" height="18" rx="2" width="36" x="560" y="120"></rect><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="578" y="133">RTS</text><text fill="#333" font-size="10" text-anchor="end" x="815" y="130">发送方请求占用信道</text><text fill="#555" font-size="10" text-anchor="end" x="815" y="143">携带 Duration 字段</text><rect fill="#2e7d32" height="18" rx="2" width="36" x="560" y="158"></rect><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="578" y="171">CTS</text><text fill="#333" font-size="10" text-anchor="end" x="815" y="168">接收方允许发送</text><text fill="#555" font-size="10" text-anchor="end" x="815" y="181">周围站点均可听到</text><rect fill="#ede7f6" height="18" rx="2" stroke="#ce93d8" stroke-width="1" width="36" x="560" y="196"></rect><text fill="#6a1b9a" font-size="9" text-anchor="middle" x="578" y="209">NAV-C</text><text fill="#333" font-size="10" text-anchor="end" x="815" y="206">听到 RTS → 设 NAV</text><text fill="#555" font-size="10" text-anchor="end" x="815" y="219">= SIFS+CTS+SIFS+DATA+SIFS+ACK</text><rect fill="#fbe9e7" height="18" rx="2" stroke="#ff8a65" stroke-width="1" width="36" x="560" y="234"></rect><text fill="#bf360c" font-size="9" text-anchor="middle" x="578" y="247">NAV-D</text><text fill="#333" font-size="10" text-anchor="end" x="815" y="244">只听到 CTS → 设 NAV</text><text fill="#555" font-size="10" text-anchor="end" x="815" y="257">= SIFS+DATA+SIFS+ACK</text><line stroke="#eee" stroke-width="1" x1="560" x2="815" y1="270" y2="270"></line><rect fill="#f5f5f5" height="92" rx="4" width="255" x="560" y="278"></rect><text fill="#333" font-size="10" font-weight="bold" text-anchor="middle" x="687" y="296">考点提示</text><text fill="#555" font-size="10" x="572" y="312">• NAV 从控制帧结束后开始计算</text><text fill="#555" font-size="10" x="572" y="327">• 不含 DIFS，不含控制帧本身</text><text fill="#555" font-size="10" x="572" y="342">• 隐藏站错过 RTS，NAV 比普通</text><text fill="#555" font-size="10" x="572" y="357">站少 SIFS + CTS</text><rect fill="#fff8e1" height="42" rx="4" stroke="#ffe082" stroke-width="1" width="430" x="100" y="425"></rect><text fill="#7c5c00" font-size="10" x="115" y="441">隐藏站 D：与发送方 A 相互"看不见"，无法收到 RTS；</text><text fill="#7c5c00" font-size="10" x="115" y="456">但能收到接收方 B 发出的 CTS，因此仍能设置 NAV 保持静默。</text></svg>