or="middle" x="200" y="246" class="svg-text svg-text-on-light">收到RTS</text><rect fill="var(--red-soft)" height="34" rx="3" stroke="var(--orange-mid)" stroke-dasharray="5,3" stroke-width="1.5" width="215" x="275" y="353"></rect><text font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="382" y="375" class="svg-text svg-text-on-light">NAV (只听到 CTS 后设置)</text><polygon fill="var(--coral-deep)" opacity=".7" points="275,350 268,338 282,338"></polygon><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="275" y="336" class="svg-text svg-text-on-light">收到CTS</text><line stroke="var(--blue-mid)" stroke-dasharray="4,3" stroke-width="1" x1="200" x2="200" y1="75" y2="400"></line><line stroke="var(--green-mid)" stroke-dasharray="4,3" stroke-width="1" x1="275" x2="275" y1="75" y2="400"></line><line stroke="var(--sky-light)" stroke-dasharray="4,3" stroke-width="1" x1="415" x2="415" y1="75" y2="400"></line><line stroke="var(--green-light)" stroke-dasharray="4,3" stroke-width="1" x1="490" x2="490" y1="75" y2="400"></line><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="120" y="72" class="svg-text svg-text-on-light">DIFS</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="170" y="72" class="svg-text svg-text-on-light">RTS</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="210" y="72" class="svg-text svg-text-on-light">SIFS</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="247" y="72" class="svg-text svg-text-on-light">CTS</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="285" y="72" class="svg-text svg-text-on-light">SIFS</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="355" y="72" class="svg-text svg-text-on-light">DATA</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="425" y="72" class="svg-text svg-text-on-light">SIFS</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="462" y="72" class="svg-text svg-text-on-light">ACK</text><line stroke="var(--neutral-light)" stroke-width="1" x1="96" x2="845" y1="78" y2="78"></line><text font-size="var(--svg-font-size-caption)" x="848" y="82" class="svg-text svg-text-on-light">t</text><line stroke="var(--purple-deep)" stroke-width="1.5" x1="200" x2="490" y1="306" y2="306"></line><line stroke="var(--purple-deep)" stroke-width="1.5" x1="200" x2="200" y1="302" y2="310"></line><line stroke="var(--purple-deep)" stroke-width="1.5" x1="490" x2="490" y1="302" y2="310"></line><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="345" y="320" class="svg-text svg-text-on-light">SIFS+CTS+SIFS+DATA+SIFS+ACK</text><line stroke="var(--coral-deep)" stroke-width="1.5" x1="275" x2="490" y1="396" y2="396"></line><line stroke="var(--coral-deep)" stroke-width="1.5" x1="275" x2="275" y1="392" y2="400"></line><line stroke="var(--coral-deep)" stroke-width="1.5" x1="490" x2="490" y1="392" y2="400"></line><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="382" y="412" class="svg-text svg-text-on-light">SIFS+DATA+SIFS+ACK</text><rect fill="var(--surface)" height="300" rx="6" stroke="var(--neutral-light)" stroke-width="1.2" width="275" x="550" y="82"></rect><text font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="687" y="104" class="svg-text svg-text-on-light">机制说明</text><line stroke="var(--neutral-soft)" stroke-width="1" x1="560" x2="815" y1="112" y2="112"></line><rect fill="var(--violet-deep)" height="18" rx="2" width="36" x="560" y="120"></rect><text font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="578" y="133" class="svg-text svg-text-on-dark">RTS</text><text font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="130" class="svg-text svg-text-on-light">发送方请求占用信道</text><text font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="143" class="svg-text svg-text-on-light">携带 Duration 字段</text><rect fill="var(--lime-deep)" height="18" rx="2" width="36" x="560" y="158"></rect><text font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="578" y="171" class="svg-text svg-text-on-dark">CTS</text><text font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="168" class="svg-text svg-text-on-light">接收方允许发送</text><text font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="181" class="svg-text svg-text-on-light">周围站点均可听到</text><rect fill="var(--violet-soft)" height="18" rx="2" stroke="var(--purple-mid)" stroke-width="1" width="36" x="560" y="196"></rect><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="578" y="209" class="svg-text svg-text-on-light">NAV-C</text><text font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="206" class="svg-text svg-text-on-light">听到 RTS → 设 NAV</text><text font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="219" class="svg-text svg-text-on-light">= SIFS+CTS+SIFS+DATA+SIFS+ACK</text><rect fill="var(--red-soft)" height="18" rx="2" stroke="var(--orange-mid)" stroke-width="1" width="36" x="560" y="234"></rect><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="578" y="247" class="svg-text svg-text-on-light">NAV-D</text><text font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="244" class="svg-text svg-text-on-light">只听到 CTS → 设 NAV</text><text font-size="var(--svg-font-size-caption)" text-anchor="end" x="815" y="257" class="svg-text svg-text-on-light">= SIFS+DATA+SIFS+ACK</text><line stroke="var(--neutral-soft)" stroke-width="1" x1="560" x2="815" y1="270" y2="270"></line><rect fill="var(--paper)" height="92" rx="4" width="255" x="560" y="278"></rect><text font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="687" y="296" class="svg-text svg-text-on-light">考点提示</text><text font-size="var(--svg-font-size-caption)" x="572" y="312" class="svg-text svg-text-on-light">• NAV 从控制帧结束后开始计算</text><text font-size="var(--svg-font-size-caption)" x="572" y="327" class="svg-text svg-text-on-light">• 不含 DIFS，不含控制帧本身</text><text font-size="var(--svg-font-size-caption)" x="572" y="342" class="svg-text svg-text-on-light">• 隐藏站错过 RTS，NAV 比普通</text><text font-size="var(--svg-font-size-caption)" x="572" y="357" class="svg-text svg-text-on-light">站少 SIFS + CTS</text><rect fill="var(--yellow-soft)" height="42" rx="4" stroke="var(--yellow-mid)" stroke-width="1" width="430" x="100" y="425"></rect><text font-size="var(--svg-font-size-caption)" x="115" y="441" class="svg-text svg-text-on-light">隐藏站 D：与发送方 A 相互"看不见"，无法收到 RTS；</text><text font-size="var(--svg-font-size-caption)" x="115" y="456" class="svg-text svg-text-on-light">但能收到接收方 B 发出的 CTS，因此仍能设置 NAV 保持静默。</text></svg>