<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect fill="none" height="500" width="800"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="400" y="25">IP数据报分片与重组</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="50" y="55">原始数据报 (4000字节)</text><rect fill="#3498db" height="40" rx="4" stroke="#2980b9" stroke-width="2" width="300" x="50" y="65"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="200" y="88">ID=12345, 总长度=4000</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="11" x="430" y="88">以太网MTU=1500字节</text><path d="M360 85h60" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="2"></path><path d="M2e2 115v35" marker-end="url(#arrowhead)" stroke="#7f8c8d" stroke-width="2"></path><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" x="220" y="130">分片</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="50" y="165">分片后的数据包</text><rect fill="#27ae60" height="35" rx="3" stroke="#219a52" stroke-width="2" width="120" x="50" y="175"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="110" y="192">分片1</text><text fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="110" y="204">ID=12345, 偏移=0</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="110" y="225">1480字节数据</text><rect fill="#f39c12" height="35" rx="3" stroke="#e67e22" stroke-width="2" width="120" x="185" y="175"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="245" y="192">分片2</text><text fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="245" y="204">ID=12345, 偏移=185</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="245" y="225">1480字节数据</text><rect fill="#9b59b6" height="35" rx="3" stroke="#8e44ad" stroke-width="2" width="120" x="320" y="175"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="380" y="192">分片3</text><text fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="380" y="204">ID=12345, 偏移=370</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="380" y="225">1020字节数据</text><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" x="500" y="195">网络传输</text><path d="M450 195h30" stroke="#7f8c8d" stroke-width="2"></path><path d="M460 185q10-10 20 0" fill="none" stroke="#7f8c8d" stroke-width="1"></path><path d="M460 205q10 10 20 0" fill="none" stroke="#7f8c8d" stroke-width="1"></path><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="50" y="285">接收端重组过程</text><rect fill="#27ae60" height="30" rx="3" stroke="#219a52" stroke-width="2" width="100" x="50" y="295"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="100" y="315">分片1 (偏移=0)</text><rect fill="#f39c12" height="30" rx="3" stroke="#e67e22" stroke-width="2" width="100" x="160" y="295"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="210" y="315">分片2 (偏移=185)</text><rect fill="#9b59b6" height="30" rx="3" stroke="#8e44ad" stroke-width="2" width="100" x="270" y="295"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="320" y="315">分片3 (偏移=370)</text><path d="M2e2 335v25" marker-end="url(#arrowhead)" stroke="#7f8c8d" stroke-width="2"></path><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" x="220" y="350">重组</text><rect fill="#3498db" height="40" rx="4" stroke="#2980b9" stroke-width="2" width="300" x="50" y="370"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="200" y="393">原始数据报已恢复 (4000字节)</text><rect fill="#ecf0f1" height="180" rx="5" stroke="#bdc3c7" stroke-width="1" width="320" x="450" y="260"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="610" y="280">关键字段说明</text><rect fill="#e74c3c" height="15" width="15" x="465" y="295"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="490" y="306">Identification (标识符)</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" x="465" y="320">• 16位字段，标识同一数据报</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" x="465" y="335">• 同一数据报的所有分片具有相同ID</text><rect fill="#3498db" height="15" width="15" x="465" y="350"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="11" font-weight="bold" x="490" y="361">Fragment Offset (分片偏移)</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" x="465" y="375">• 13位字段，单位为8字节</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" x="465" y="390">• 指示分片在原数据报中的位置</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" x="465" y="405">• 用于接收端正确重组数据</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#7f8c8d" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="400" y="475">通过标识符区分不同数据报的分片，通过偏移量确定分片的重组顺序</text></svg>