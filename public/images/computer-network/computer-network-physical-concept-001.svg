<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="var(--surface)" height="600" width="800"></rect><rect fill="var(--indigo-deep)" height="60" width="800" x="0" y="0"></rect><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="35" class="svg-text svg-text-on-dark">物理层接口特性</text><g transform="translate(20, 80)"><rect fill="var(--red-deep)" height="240" rx="8" stroke="var(--red-deep)" stroke-width="2" width="360" x="0" y="0"></rect><rect fill="var(--red-deep)" height="30" rx="4" width="340" x="10" y="10"></rect><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="180" y="30" class="svg-text svg-text-on-dark">机械特性</text><rect fill="var(--neutral-ink)" height="30" rx="3" width="50" x="30" y="60"></rect><rect fill="var(--neutral-deep)" height="26" rx="2" width="46" x="32" y="62"></rect><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="55" y="105" class="svg-text svg-text-on-light">RJ45</text><rect fill="var(--neutral-ink)" height="20" rx="10" width="40" x="110" y="60"></rect><rect fill="var(--neutral-deep)" height="16" rx="8" width="36" x="112" y="62"></rect><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="130" y="95" class="svg-text svg-text-on-light">USB</text><g transform="translate(200, 60)"><circle cx="0" cy="15" fill="var(--orange-deep)" r="12" stroke="var(--orange-ink)" stroke-width="2"></circle><circle cx="0" cy="15" fill="var(--yellow-mid)" r="6"></circle><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="0" y="40" class="svg-text svg-text-on-light">光纤</text></g><text font-size="var(--svg-font-size-body)" x="20" y="150" class="svg-text svg-text-on-light">• 接口形状和规范</text><text font-size="var(--svg-font-size-body)" x="20" y="170" class="svg-text svg-text-on-light">• 引脚数量和排列</text><text font-size="var(--svg-font-size-body)" x="20" y="190" class="svg-text svg-text-on-light">• 电缆类型选择</text><text font-size="var(--svg-font-size-body)" x="20" y="210" class="svg-text svg-text-on-light">外部物理形态定义</text></g><g transform="translate(420, 80)"><rect fill="var(--mint-deep)" height="240" rx="8" stroke="var(--mint-mid)" stroke-width="2" width="360" x="0" y="0"></rect><rect fill="var(--mint-mid)" height="30" rx="4" width="340" x="10" y="10"></rect><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="180" y="30" class="svg-text svg-text-on-dark">功能特性</text><g transform="translate(50, 60)"><rect fill="var(--neutral-ink)" height="60" rx="4" stroke="var(--neutral-deep)" stroke-width="1" width="120" x="0" y="0"></rect><circle cx="15" cy="15" fill="var(--red-deep)" r="5"></circle><text font-size="var(--svg-font-size-caption)" x="25" y="20" class="svg-text svg-text-on-dark">Tx</text><circle cx="15" cy="30" fill="var(--lime-mid)" r="5"></circle><text font-size="var(--svg-font-size-caption)" x="25" y="35" class="svg-text svg-text-on-dark">Rx</text><circle cx="15" cy="45" fill="var(--purple-deep)" r="5"></circle><text font-size="var(--svg-font-size-caption)" x="25" y="50" class="svg-text svg-text-on-dark">GND</text><circle cx="105" cy="15" fill="var(--yellow-mid)" r="5"></circle><text font-size="var(--svg-font-size-caption)" x="75" y="20" class="svg-text svg-text-on-dark">RTS</text><circle cx="105" cy="30" fill="var(--purple-deep)" r="5"></circle><text font-size="var(--svg-font-size-caption)" x="75" y="35" class="svg-text svg-text-on-dark">CTS</text><circle cx="105" cy="45" fill="var(--teal-mid)" r="5"></circle><text font-size="var(--svg-font-size-caption)" x="75" y="50" class="svg-text svg-text-on-dark">VCC</text></g><g transform="translate(200, 70)"><path d="M0 10H70" marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="3"></path><text font-size="var(--svg-font-size-label)" x="75" y="15" class="svg-text svg-text-on-light">发送</text><path d="M70 30H0" marker-end="url(#arrowhead2)" stroke="var(--lime-mid)" stroke-width="3"></path><text font-size="var(--svg-font-size-label)" x="75" y="35" class="svg-text svg-text-on-light">接收</text></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--red-deep)" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead2" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--lime-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text font-size="var(--svg-font-size-body)" x="20" y="150" class="svg-text svg-text-on-light">• 数据发送引脚 (Tx)</text><text font-size="var(--svg-font-size-body)" x="20" y="170" class="svg-text svg-text-on-light">• 数据接收引脚 (Rx)</text><text font-size="var(--svg-font-size-body)" x="20" y="190" class="svg-text svg-text-on-light">• 控制信号引脚</text><text font-size="var(--svg-font-size-body)" x="20" y="210" class="svg-text svg-text-on-light">各引脚功能定义</text></g><g transform="translate(20, 340)"><rect fill="var(--sky-deep)" height="240" rx="8" stroke="var(--sky-mid)" stroke-width="2" width="360" x="0" y="0"></rect><rect fill="var(--sky-mid)" height="30" rx="4" width="340" x="10" y="10"></rect><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="180" y="30" class="svg-text svg-text-on-dark">过程特性</text><g transform="translate(30, 45)"><line stroke="var(--neutral-ink)" stroke-width="1" x1="0" x2="300" y1="75" y2="75"></line><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="150" y="90" class="svg-text svg-text-on-light">时间</text><rect fill="var(--sky-mid)" height="25" opacity=".7" width="15" x="20" y="35"></rect><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="27" y="30" class="svg-text svg-text-on-light">START</text><rect fill="var(--mint-mid)" height="15" width="10" x="60" y="45"></rect><rect fill="var(--mint-mid)" height="25" width="10" x="80" y="35"></rect><rect fill="var(--mint-mid)" height="15" width="10" x="100" y="45"></rect><rect fill="var(--mint-mid)" height="25" width="10" x="120" y="35"></rect><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="90" y="30" class="svg-text svg-text-on-light">数据位</text><rect fill="var(--red-deep)" height="25" opacity=".7" width="15" x="160" y="35"></rect><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="167" y="30" class="svg-text svg-text-on-light">STOP</text><g transform="translate(200, 30)"><path d="M0 0V10H10V20H20V30H30V40" fill="none" stroke="var(--yellow-mid)" stroke-width="2"></path><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="15" y="-5" class="svg-text svg-text-on-light">时钟同步</text></g></g><text font-size="var(--svg-font-size-body)" x="20" y="150" class="svg-text svg-text-on-light">• 传输起始与终止</text><text font-size="var(--svg-font-size-body)" x="20" y="170" class="svg-text svg-text-on-light">• 信号同步机制</text><text font-size="var(--svg-font-size-body)" x="20" y="190" class="svg-text svg-text-on-light">• 比特间隔定义</text><text font-size="var(--svg-font-size-body)" x="20" y="210" class="svg-text svg-text-on-light">数据传输过程控制</text></g><g transform="translate(420, 340)"><rect fill="var(--yellow-deep)" height="240" rx="8" stroke="var(--yellow-mid)" stroke-width="2" width="360" x="0" y="0"></rect><rect fill="var(--yellow-mid)" height="30" rx="4" width="340" x="10" y="10"></rect><text font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="180" y="30" class="svg-text svg-text-on-dark">电气特性</text><g transform="translate(50, 50)"><line stroke="var(--neutral-deep)" stroke-width="1" x1="0" x2="200" y1="50" y2="50"></line><line stroke="var(--neutral-deep)" stroke-width="1" x1="20" x2="20" y1="0" y2="80"></line><line stroke="var(--yellow-mid)" stroke-width="3" x1="20" x2="60" y1="20" y2="20"></line><line stroke="var(--yellow-mid)" stroke-width="3" x1="60" x2="60" y1="20" y2="50"></line><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="40" y="15" class="svg-text svg-text-on-light">+5V</text><line stroke="var(--yellow-mid)" stroke-width="3" x1="60" x2="100" y1="50" y2="50"></line><line stroke="var(--yellow-mid)" stroke-width="3" x1="100" x2="100" y1="50" y2="20"></line><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="80" y="65" class="svg-text svg-text-on-light">0V</text><line stroke="var(--yellow-mid)" stroke-width="3" x1="100" x2="140" y1="20" y2="20"></line><line stroke="var(--yellow-mid)" stroke-width="3" x1="140" x2="140" y1="20" y2="50"></line><line stroke="var(--yellow-mid)" stroke-width="3" x1="140" x2="180" y1="50" y2="50"></line><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="100" y="95" class="svg-text svg-text-on-light">电压波形</text></g><g transform="translate(280, 60)"><rect fill="none" height="30" rx="4" stroke="var(--neutral-deep)" stroke-width="1" width="50" x="0" y="0"></rect><text font-size="var(--svg-font-size-label)" text-anchor="middle" x="25" y="20" class="svg-text svg-text-on-light">100M</text><text font-size="var(--svg-font-size-caption)" text-anchor="middle" x="25" y="45" class="svg-text svg-text-on-light">bps</text></g><text font-size="var(--svg-font-size-body)" x="20" y="150" class="svg-text svg-text-on-light">• 电压幅值范围</text><text font-size="var(--svg-font-size-body)" x="20" y="170" class="svg-text svg-text-on-light">• 电流大小限制</text><text font-size="var(--svg-font-size-body)" x="20" y="190" class="svg-text svg-text-on-light">• 传输速率和距离</text><text font-size="var(--svg-font-size-body)" x="20" y="210" class="svg-text svg-text-on-light">信号电气属性规范</text></g></svg>