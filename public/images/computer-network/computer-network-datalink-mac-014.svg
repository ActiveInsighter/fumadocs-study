<svg xmlns="http://www.w3.org/2000/svg" font-family="var(--svg-font-family)" viewBox="0 0 820 560" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="var(--surface)" height="560" rx="8" width="820"></rect><rect fill="var(--surface)" height="256" rx="8" stroke="var(--violet-soft)" stroke-width="1.5" width="380" x="16" y="16"></rect><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="206" y="40">隐藏节点问题</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="206" y="56">（CSMA/CD 在无线网络中失效的根因）</text><circle cx="206" cy="155" fill="var(--violet-mid)" r="22" stroke="var(--indigo-deep)" stroke-width="2"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="206" y="151">AP</text><text fill="var(--violet-light)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="206" y="165"></text>`<circle cx="90" cy="155" fill="var(--green-mid)" r="18" stroke="var(--green-deep)" stroke-width="2"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="151">A</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="90" y="163">STA</text><circle cx="322" cy="155" fill="var(--orange-mid)" r="18" stroke="var(--coral-deep)" stroke-width="2"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="322" y="151">C</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="322" y="163">STA</text><circle cx="90" cy="155" fill="none" opacity=".6" r="128" stroke="var(--green-mid)" stroke-dasharray="6,4" stroke-width="1.5"></circle><circle cx="322" cy="155" fill="none" opacity=".6" r="128" stroke="var(--orange-mid)" stroke-dasharray="6,4" stroke-width="1.5"></circle><line marker-end="url(#arrowG)" stroke="var(--green-mid)" stroke-width="2" x1="110" x2="182" y1="152" y2="152"></line><line marker-end="url(#arrowO)" stroke="var(--orange-mid)" stroke-width="2" x1="302" x2="230" y1="152" y2="152"></line><line stroke="var(--line)" stroke-dasharray="4,3" stroke-width="1" x1="108" x2="200" y1="162" y2="210"></line><line stroke="var(--line)" stroke-dasharray="4,3" stroke-width="1" x1="304" x2="212" y1="162" y2="210"></line><text fill="var(--green-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="90" y="188">在范围内</text><text fill="var(--coral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="322" y="188">在范围内</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="206" y="228">A 与 C 互相"看不见"</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="206" y="244">各自以为信道空闲 → 同时发送 → 碰撞</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="206" y="260">且碰撞发生在 AP 侧，A 和 C 自己无法感知</text><rect fill="var(--surface)" height="256" rx="8" stroke="var(--violet-soft)" stroke-width="1.5" width="392" x="412" y="16"></rect><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="608" y="40">CSMA/CA 的解决思路</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="608" y="56">冲突避免（Collision Avoidance）</text><circle cx="444" cy="88" fill="var(--violet-mid)" r="12"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="444" y="93">1</text><text fill="var(--ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="464" y="87">载波监听（Carrier Sense）</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="464" y="101">发送前先"听"信道是否忙碌</text><circle cx="444" cy="132" fill="var(--violet-mid)" r="12"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="444" y="137">2</text><text fill="var(--ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="464" y="131">等待 DIFS + 随机退避</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="464" y="145">信道空闲后等一段再随机延迟，错开发送时机</text><circle cx="444" cy="176" fill="var(--violet-mid)" r="12"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="444" y="181">3</text><text fill="var(--ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="464" y="175">发送数据帧</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="464" y="189">退避结束后发送（无法边发边检测碰撞）</text><circle cx="444" cy="220" fill="var(--green-mid)" r="12"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="444" y="225">4</text><text fill="var(--ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="464" y="219">等待 ACK 确认</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="464" y="233">ACK 到达 → 成功；超时未到 → 重发并扩大退避窗口</text><line stroke="var(--violet-mid)" stroke-width="1.5" x1="444" x2="444" y1="100" y2="120"></line><line stroke="var(--violet-mid)" stroke-width="1.5" x1="444" x2="444" y1="144" y2="164"></line><line stroke="var(--violet-mid)" stroke-width="1.5" x1="444" x2="444" y1="188" y2="208"></line><rect fill="var(--surface)" height="200" rx="8" stroke="var(--violet-soft)" stroke-width="1.5" width="788" x="16" y="284"></rect><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="410" y="308">CSMA/CD vs CSMA/CA</text><rect fill="var(--sky-soft)" height="28" rx="4" width="240" x="32" y="318"></rect><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="152" y="337">对比维度</text><rect fill="var(--sky-light)" height="28" rx="4" width="240" x="284" y="318"></rect><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="404" y="337">CSMA/CD（有线以太网）</text><rect fill="var(--yellow-light)" height="28" rx="4" width="248" x="540" y="318"></rect><text fill="var(--orange-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="664" y="337">CSMA/CA（无线 802.11）</text><line stroke="var(--blue-soft)" stroke-width="1" x1="32" x2="788" y1="346" y2="346"></line><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="152" y="362">冲突处理策略</text><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="404" y="362">边发边检测，冲突后立即停止</text><text fill="var(--orange-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="664" y="362">发送前退避，尽量避免冲突</text><line stroke="var(--blue-soft)" stroke-width="1" x1="32" x2="788" y1="370" y2="370"></line><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="152" y="386">确认机制</text><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="404" y="386">无需 ACK（冲突直接感知）</text><text fill="var(--orange-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="664" y="386">必须等待 ACK 确认成功</text><line stroke="var(--blue-soft)" stroke-width="1" x1="32" x2="788" y1="394" y2="394"></line><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="152" y="410">帧长最小限制</text><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="404" y="410">有（确保碰撞可被检测到）</text><text fill="var(--orange-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="664" y="410">无此限制</text><line stroke="var(--blue-soft)" stroke-width="1" x1="32" x2="788" y1="418" y2="418"></line><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="152" y="434">信道预约</text><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="404" y="434">无</text><text fill="var(--orange-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="664" y="434">可选 RTS/CTS 预约信道</text><line stroke="var(--blue-soft)" stroke-width="1" x1="32" x2="788" y1="442" y2="442"></line><text fill="var(--neutral-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="152" y="458">适用场景</text><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="404" y="458">有线局域网（以太网）</text><text fill="var(--orange-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="664" y="458">无线局域网（Wi-Fi / 802.11）</text><line stroke="var(--blue-soft)" stroke-width="1" x1="276" x2="276" y1="318" y2="466"></line><line stroke="var(--blue-soft)" stroke-width="1" x1="532" x2="532" y1="318" y2="466"></line><rect fill="none" height="148" rx="4" stroke="var(--blue-light)" stroke-width="1" width="756" x="32" y="318"></rect><rect fill="var(--paper)" height="48" rx="6" stroke="var(--red-mid)" stroke-width="1.2" width="788" x="16" y="496"></rect><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="28" y="515">考点提示：</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="28" y="533">"冲突避免"不代表完全消除冲突，只是尽量降低概率；CSMA/CA 无法"检测"冲突，只能通过 ACK 超时"感知"失败。</text><defs><marker id="arrowG" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="var(--green-mid)"></path></marker><marker id="arrowO" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="var(--orange-mid)"></path></marker></defs></svg>