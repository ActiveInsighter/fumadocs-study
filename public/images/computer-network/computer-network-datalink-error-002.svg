<svg xmlns="http://www.w3.org/2000/svg" font-family="var(--svg-font-family-mono)" viewBox="0 0 640 320" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><style>.bit{text-anchor:middle;font-size: var(--svg-font-size-title);fill:var(--indigo-ink);font-weight: var(--svg-font-weight-medium)}.divisor-bit{fill:var(--indigo-deep);font-weight: var(--svg-font-weight-bold)}.quotient-bit{fill:var(--green-mid);font-weight: var(--svg-font-weight-bold)}.remainder-bit{fill:var(--red-deep);font-weight: var(--svg-font-weight-bold)}.faded{fill:var(--blue-light)}.op{font-size: var(--svg-font-size-label);fill:var(--sky-deep)}.op-end{font-size: var(--svg-font-size-label);fill:var(--sky-deep);text-anchor:end}.xor-mark{font-size: var(--svg-font-size-title);fill:var(--indigo-deep);text-anchor:end}.line{stroke:var(--blue-deep);stroke-width:1.4}.box{fill:none;stroke:var(--red-deep);stroke-width:1.4;stroke-dasharray:5,3}.legend-text{font-size: var(--svg-font-size-label);fill:var(--blue-deep)}</style></defs><text class="op-end" x="335" y="42">商</text><text class="bit quotient-bit" x="355" y="45">1</text><text class="bit quotient-bit" x="387" y="45">1</text><text class="bit quotient-bit" x="419" y="45">0</text><text class="bit quotient-bit" x="451" y="45">0</text><line class="line" x1="245" x2="480" y1="55" y2="55"></line><text class="op-end" x="150" y="83">除数 →</text><text class="bit divisor-bit" x="164" y="83">1</text><text class="bit divisor-bit" x="184" y="83">1</text><text class="bit divisor-bit" x="204" y="83">0</text><text class="bit divisor-bit" x="224" y="83">1</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-title)" text-anchor="middle" x="240" y="83">)</text><text class="bit" x="260" y="83">1</text><text class="bit" x="292" y="83">0</text><text class="bit" x="324" y="83">1</text><text class="bit" x="356" y="83">1</text><text class="bit" x="388" y="83">0</text><text class="bit" x="420" y="83">0</text><text class="bit" x="452" y="83">0</text><text class="op" x="475" y="83">← 被除数（数据 + 补 0）</text><text class="xor-mark" x="240" y="118">⊕</text><text class="bit divisor-bit" x="260" y="118">1</text><text class="bit divisor-bit" x="292" y="118">1</text><text class="bit divisor-bit" x="324" y="118">0</text><text class="bit divisor-bit" x="356" y="118">1</text><line class="line" x1="245" x2="375" y1="128" y2="128"></line><text class="bit" x="260" y="155">0</text><text class="bit" x="292" y="155">1</text><text class="bit" x="324" y="155">1</text><text class="bit" x="356" y="155">0</text><text class="bit faded" x="388" y="155">0</text><text class="bit faded" x="420" y="155">0</text><text class="bit faded" x="452" y="155">0</text><text class="xor-mark" x="272" y="190">⊕</text><text class="bit divisor-bit" x="292" y="190">1</text><text class="bit divisor-bit" x="324" y="190">1</text><text class="bit divisor-bit" x="356" y="190">0</text><text class="bit divisor-bit" x="388" y="190">1</text><line class="line" x1="277" x2="407" y1="200" y2="200"></line><text class="bit faded" x="260" y="227">0</text><text class="bit" x="292" y="227">0</text><text class="bit" x="324" y="227">0</text><text class="bit" x="356" y="227">0</text><text class="bit remainder-bit" x="388" y="227">1</text><text class="bit remainder-bit" x="420" y="227">0</text><text class="bit remainder-bit" x="452" y="227">0</text><rect class="box" height="26" rx="4" width="90" x="376" y="209"></rect><text class="op" fill="var(--red-deep)" x="475" y="227">← 余数（CRC 校验码）</text><text class="op" x="30" y="155">最高位为 1</text><text class="op" fill="var(--indigo-deep)" x="30" y="170">→ 与除数异或</text><g transform="translate(60, 285)"><rect fill="var(--green-mid)" height="12" rx="2" width="12" x="0" y="-11"></rect><text class="legend-text" x="18" y="0">商</text><rect fill="var(--indigo-deep)" height="12" rx="2" width="12" x="70" y="-11"></rect><text class="legend-text" x="88" y="0">除数（每次异或运算的操作数）</text><rect fill