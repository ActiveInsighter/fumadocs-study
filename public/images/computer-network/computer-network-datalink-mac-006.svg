<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><style>.title{font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);fill:var(--neutral-ink)}.subtitle{font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold);fill:var(--neutral-deep)}.cdma-text{font-size: var(--svg-font-size-label);fill:var(--neutral-ink)}.small-text{font-size: var(--svg-font-size-caption);fill:var(--neutral-deep)}.station-a{fill:var(--red-deep);stroke:var(--red-deep)}.station-b{fill:var(--mint-mid);stroke:var(--mint-mid)}.signal{stroke-width:2;fill:none}.box{fill:none;stroke:var(--neutral-mid);stroke-width:1}.arrow{stroke:var(--neutral-ink);stroke-width:2;marker-end:url(#arrowhead)}.chip{fill:var(--surface);stroke:var(--neutral-ink);stroke-width:1}</style><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--neutral-ink)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text class="title" text-anchor="middle" x="400" y="25">CDMA码分多址工作原理</text><rect class="box" height="120" width="300" x="50" y="50"></rect><text class="subtitle station-a" text-anchor="middle" x="200" y="72">站点A (发送比特1)</text><text class="cdma-text" text-anchor="middle" x="200" y="92">码片序列: (+1, +1, -1, -1)</text><g transform="translate(132.5, 106)"><rect class="chip" height="20" width="30" x="0" y="0"></rect><text class="small-text" text-anchor="middle" x="15" y="14">+1</text><rect class="chip" height="20" width="30" x="35" y="0"></rect><text class="small-text" text-anchor="middle" x="50" y="14">+1</text><rect class="chip" height="20" width="30" x="70" y="0"></rect><text class="small-text" text-anchor="middle" x="85" y="14">-1</text><rect class="chip" height="20" width="30" x="105" y="0"></rect><text class="small-text" text-anchor="middle" x="120" y="14">-1</text></g><text class="small-text" text-anchor="middle" x="200" y="152">比特时间被分为4个码片</text><rect class="box" height="120" width="300" x="450" y="50"></rect><text class="subtitle station-b" text-anchor="middle" x="600" y="72">站点B (发送比特0)</text><text class="cdma-text" text-anchor="middle" x="600" y="92">码片序列: (+1, -1, +1, -1)</text><text class="cdma-text" text-anchor="middle" x="600" y="110">发送反码: (-1, +1, -1, +1)</text><g transform="translate(532.5, 124)"><rect class="chip" height="20" width="30" x="0" y="0"></rect><text class="small-text" text-anchor="middle" x="15" y="14">-1</text><rect class="chip" height="20" width="30" x="35" y="0"></rect><text class="small-text" text-anchor="middle" x="50" y="14">+1</text><rect class="chip" height="20" width="30" x="70" y="0"></rect><text class="small-text" text-anchor="middle" x="85" y="14">-1</text><rect class="chip" height="20" width="30" x="105" y="0"></rect><text class="small-text" text-anchor="middle" x="120" y="14">+1</text></g><line class="arrow" x1="200" x2="300" y1="180" y2="220"></line><line class="arrow" x1="600" x2="500" y1="180" y2="220"></line><rect class="box" height="80" width="200" x="300" y="200"></rect><text class="subtitle" text-anchor="middle" x="400" y="220">信道中线性叠加</text><text class="cdma-text" text-anchor="middle" x="400" y="240">A信号 + B信号</text><text class="cdma-text" text-anchor="middle" x="400" y="255">(+1,+1,-1,-1) + (-1,+1,-1,+1)</text><text class="cdma-text" text-anchor="middle" x="400" y="270">= (0,+2,-2,0)</text><line class="arrow" x1="400" x2="400" y1="290" y2="320"></line><rect class="box" height="180" width="700" x="50" y="340"></rect><text class="subtitle" text-anchor="middle" x="400" y="360">接收端分离信号</text><rect class="box" height="60" width="300" x="70" y="380"></rect><text class="text station-a" text-anchor="middle" x="220" y="400">恢复站点A的信号</text><text class="small-text" text-anchor="middle" x="220" y="415">接收信号 · A码片序列 = (0,+2,-2,0) · (+1,+1,-1,-1)</text><text class="small-text" text-anchor="middle" x="220" y="430">= 1/4 × (0+2+2+0) = +1 → 比特1</text><rect class="box" height="60" width="300" x="430" y="380"></rect><text class="text station-b" text-anchor="middle" x="580" y="400">恢复站点B的信号</text><text class="small-text" text-anchor="middle" x="580" y="415">接收信号 · B码片序列 = (0,+2,-2,0) · (+1,-1,+1,-1)</text><text class="small-text" text-anchor="middle" x="580" y="430">= 1/4 × (0-2-2+0) = -1 → 比特0</text><rect class="box" height="50" width="500" x="150" y="460"></rect><text class="subtitle" text-anchor="middle" x="400" y="480">正交性保证</text><text class="small-text" text-anchor="middle" x="400" y="495">A · B = 1/4 × ((+1)×(+1) + (+1)×(-1) + (-1)×(+1) + (-1)×(-1)) = 1/4 × (1-1-1+1) = 0</text><text class="small-text" x="50" y="550">注：码片序列必须相互正交，这样才能在接收端成功分离各路信号</text><text class="small-text" x="50" y="570">发送比特1时发送原码片序列，发送比特0时发送反码片序列</text></svg>