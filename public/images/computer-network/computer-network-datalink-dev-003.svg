<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><defs><style>.title{font-family: var(--svg-font-family);font-size: var(--svg-font-size-title);font-weight: var(--svg-font-weight-bold);fill:var(--ink)}.subtitle{font-family: var(--svg-font-family);font-size: var(--svg-font-size-body);font-weight: var(--svg-font-weight-bold);fill:var(--ink)}.text{font-family: var(--svg-font-family);font-size: var(--svg-font-size-label);fill:var(--ink)}.small-text{font-family: var(--svg-font-family);font-size: var(--svg-font-size-caption);fill:var(--ink)}.small-text-white{font-family: var(--svg-font-family);font-size: var(--svg-font-size-caption);fill:var(--surface)}.text-white{font-family: var(--svg-font-family);font-size: var(--svg-font-size-label);fill:var(--surface)}.text-red{font-family: var(--svg-font-family);font-size: var(--svg-font-size-caption);fill:var(--red-deep)}.frame{fill:var(--indigo-mid);stroke:var(--blue-deep);stroke-width:2}.switch{fill:var(--red-deep);stroke:var(--red-deep);stroke-width:2}.arrow{fill:var(--green-mid);stroke:var(--green-mid);stroke-width:2}.check{fill:var(--yellow-mid);stroke:var(--orange-mid);stroke-width:2}.time-line{stroke:var(--neutral-mid);stroke-width:1;stroke-dasharray:5,5}</style></defs><text class="title" text-anchor="middle" x="400" y="25">交换机交换方式对比</text><text class="subtitle" x="50" y="60">数据帧结构：</text><rect class="frame" height="20" rx="3" width="60" x="50" y="70"></rect><text class="small-text-white" text-anchor="middle" x="80" y="83">目的MAC</text><rect fill="var(--neutral-mid)" height="20" rx="3" stroke="var(--ink-soft)" stroke-width="1" width="40" x="110" y="70"></rect><text class="small-text-white" text-anchor="middle" x="130" y="83">其他</text><rect fill="var(--neutral-mid)" height="20" rx="3" stroke="var(--ink-soft)" stroke-width="1" width="80" x="150" y="70"></rect><text class="small-text-white" text-anchor="middle" x="190" y="83">数据载荷</text><rect fill="var(--neutral-mid)" height="20" rx="3" stroke="var(--ink-soft)" stroke-width="1" width="40" x="230" y="70"></rect><text class="small-text-white" text-anchor="middle" x="250" y="83">CRC</text><g transform="translate(0, 120)"><text class="subtitle" x="50" y="0">1. 直通交换</text><line class="time-line" x1="50" x2="700" y1="40" y2="40"></line><text class="small-text" x="50" y="35">时间</text><rect class="frame" height="15" rx="2" width="200" x="100" y="20"></rect><text class="small-text-white" text-anchor="middle" x="200" y="30">数据帧到达</text><rect fill="var(--yellow-mid)" height="15" rx="2" stroke="var(--orange-mid)" stroke-width="1" width="60" x="100" y="50"></rect><text class="small-text-white" text-anchor="middle" x="130" y="60">读取MAC</text><polygon class="arrow" points="170,45 190,55 170,65"></polygon><rect fill="var(--green-mid)" height="15" rx="2" stroke="var(--green-mid)" stroke-width="1" width="300" x="200" y="50"></rect><text class="small-text-white" text-anchor="middle" x="350" y="60">立即开始转发（无需等待完整帧）</text><text class="text" x="50" y="85">特点：延迟最低，但可能转发错误帧</text></g><g transform="translate(0, 240)"><text class="subtitle" x="50" y="0">2. 存储转发</text><line class="time-line" x1="50" x2="700" y1="40" y2="40"></line><rect class="frame" height="15" rx="2" width="200" x="100" y="20"></rect><text class="small-text-white" text-anchor="middle" x="200" y="30">完整数据帧接收</text><rect fill="var(--purple-deep)" height="15" rx="2" stroke="var(--purple-deep)" stroke-width="1" width="200" x="100" y="50"></rect><text class="small-text-white" text-anchor="middle" x="200" y="60">存储到缓冲区</text><rect class="check" height="15" rx="2" width="80" x="320" y="50"></rect><text class="small-text-white" text-anchor="middle" x="360" y="60">CRC校验</text><polygon class="arrow" points="410,45 430,55 410,65"></polygon><rect fill="var(--green-mid)" height="15" rx="2" stroke="var(--green-mid)" stroke-width="1" width="150" x="440" y="50"></rect><text class="small-text-white" text-anchor="middle" x="515" y="60">确认无误后转发</text><text class="text" x="50" y="85">特点：可靠性最高，能检测并丢弃错误帧，但延迟较大</text></g><g transform="translate(0, 360)"><text class="subtitle" x="50" y="0">3. 碎片隔离</text><line class="time-line" x1="50" x2="700" y1="40" y2="40"></line><rect class="frame" height="15" rx="2" width="200" x="100" y="20"></rect><text class="small-text-white" text-anchor="middle" x="200" y="30">数据帧到达</text><rect fill="var(--yellow-mid)" height="15" rx="2" stroke="var(--orange-mid)" stroke-width="1" width="120" x="100" y="50"></rect><text class="small-text-white" text-anchor="middle" x="160" y="60">检查前64字节</text><polygon fill="var(--orange-mid)" points="240,45 260,55 240,65 220,55" stroke="var(--coral-deep)" stroke-width="1"></polygon><text class="small-text-white" text-anchor="middle" x="240" y="58">≥64?</text><polygon class="arrow" points="270,45 290,55 270,65"></polygon><rect fill="var(--green-mid)" height="15" rx="2" stroke="var(--green-mid)" stroke-width="1" width="100" x="300" y="50"></rect><text class="small-text-white" text-anchor="middle" x="350" y="60">正常转发</text><line stroke="var(--red-deep)" stroke-width="2" x1="240" x2="240" y1="65" y2="85"></line><polygon fill="var(--red-deep)" points="235,80 240,90 245,80"></polygon><text class="text-red" text-anchor="middle" x="240" y="105">丢弃碎片</text><text class="text" x="50" y="125">特点：介于两者之间，能过滤碎片帧，延迟适中</text></g><g transform="translate(50, 520)"><text class="subtitle" x="0" y="0">性能对比：</text><rect fill="var(--blue-ink)" height="25" rx="3" width="150" x="0" y="10"></rect><text class="text-white" text-anchor="middle" x="75" y="27">交换方式</text><rect fill="var(--blue-ink)" height="25" rx="3" width="120" x="150" y="10"></rect><text class="text-white" text-anchor="middle" x="210" y="27">转发延迟</text><rect fill="var(--blue-ink)" height="25" rx="3" width="120" x="270" y="10"></rect><text class="text-white" text-anchor="middle" x="330" y="27">错误检测</text><rect fill="var(--blue-ink)" height="25" rx="3" width="150" x="390" y="10"></rect><text class="text-white" text-anchor="middle" x="465" y="27">适用场景</text><rect fill="var(--neutral-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="150" x="0" y="35"></rect><text class="text" text-anchor="middle" x="75" y="52">直通交换</text><rect fill="var(--mint-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="120" x="150" y="35"></rect><text class="text" text-anchor="middle" x="210" y="52">最低</text><rect fill="var(--red-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="120" x="270" y="35"></rect><text class="text" text-anchor="middle" x="330" y="52">无</text><rect fill="var(--neutral-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="150" x="390" y="35"></rect><text class="text" text-anchor="middle" x="465" y="52">高速网络</text><rect fill="var(--neutral-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="150" x="0" y="60"></rect><text class="text" text-anchor="middle" x="75" y="77">存储转发</text><rect fill="var(--red-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="120" x="150" y="60"></rect><text class="text" text-anchor="middle" x="210" y="77">最高</text><rect fill="var(--mint-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="120" x="270" y="60"></rect><text class="text" text-anchor="middle" x="330" y="77">完整CRC</text><rect fill="var(--neutral-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="150" x="390" y="60"></rect><text class="text" text-anchor="middle" x="465" y="77">可靠性要求高</text><rect fill="var(--neutral-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="150" x="0" y="85"></rect><text class="text" text-anchor="middle" x="75" y="102">碎片隔离</text><rect fill="var(--yellow-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="120" x="150" y="85"></rect><text class="text" text-anchor="middle" x="210" y="102">适中</text><rect fill="var(--yellow-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="120" x="270" y="85"></rect><text class="text" text-anchor="middle" x="330" y="102">碎片检测</text><rect fill="var(--neutral-soft)" height="25" rx="3" stroke="var(--indigo-light)" stroke-width="1" width="150" x="390" y="85"></rect><text class="text" text-anchor="middle" x="465" y="102">平衡性能</text></g></svg>