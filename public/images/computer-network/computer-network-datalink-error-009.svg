<svg xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 820 480"><rect fill="#f8f9fb" height="480" rx="12" width="820"></rect><rect fill="#eef3ff" height="400" rx="10" stroke="#7b9de0" stroke-width="1.5" width="220" x="30" y="40"></rect><text fill="#3a5bbf" font-size="14" font-weight="bold" text-anchor="middle" x="140" y="70">原始信息</text><text fill="#5a7acc" font-size="12" text-anchor="middle" x="140" y="88">k = 2 位，共 2ᵏ = 4 种</text><line stroke="#aac0f0" stroke-width="1" x1="50" x2="230" y1="96" y2="96"></line><rect fill="#dce8ff" height="46" rx="8" stroke="#7b9de0" stroke-width="1.2" width="150" x="65" y="108"></rect><text fill="#2a4aad" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" x="140" y="130">00</text><text fill="#5a7acc" font-size="11" text-anchor="middle" x="140" y="147">原始信息 0</text><rect fill="#dce8ff" height="46" rx="8" stroke="#7b9de0" stroke-width="1.2" width="150" x="65" y="166"></rect><text fill="#2a4aad" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" x="140" y="188">01</text><text fill="#5a7acc" font-size="11" text-anchor="middle" x="140" y="205">原始信息 1</text><rect fill="#dce8ff" height="46" rx="8" stroke="#7b9de0" stroke-width="1.2" width="150" x="65" y="224"></rect><text fill="#2a4aad" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" x="140" y="246">10</text><text fill="#5a7acc" font-size="11" text-anchor="middle" x="140" y="263">原始信息 2</text><rect fill="#dce8ff" height="46" rx="8" stroke="#7b9de0" stroke-width="1.2" width="150" x="65" y="282"></rect><text fill="#2a4aad" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" x="140" y="304">11</text><text fill="#5a7acc" font-size="11" text-anchor="middle" x="140" y="321">原始信息 3</text><rect fill="none" height="72" rx="8" stroke="#7b9de0" stroke-dasharray="4,3" stroke-width="1" width="160" x="60" y="346"></rect><text fill="#3a5bbf" font-size="11" text-anchor="middle" x="140" y="364">编码映射</text><text fill="#2a4aad" font-size="13" text-anchor="middle" x="140" y="381">{0,1}ᵏ → C ⊆ {0,1}ⁿ</text><text fill="#5a7acc" font-size="11" text-anchor="middle" x="140" y="399">冗余位 = n − k 位</text><defs><marker id="arrowhead" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="3.5"><polygon fill="#4f86c6" points="0 0, 8 3.5, 0 7"></polygon></marker><marker id="arrowhead-gray" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="3.5"><polygon fill="#aaa" points="0 0, 8 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead)" stroke="#4f86c6" stroke-dasharray="5,3" stroke-width="1.6" x1="216" x2="348" y1="131" y2="140"></line><line marker-end="url(#arrowhead)" stroke="#4f86c6" stroke-dasharray="5,3" stroke-width="1.6" x1="216" x2="348" y1="189" y2="218"></line><line marker-end="url(#arrowhead)" stroke="#4f86c6" stroke-dasharray="5,3" stroke-width="1.6" x1="216" x2="348" y1="247" y2="296"></line><line marker-end="url(#arrowhead)" stroke="#4f86c6" stroke-dasharray="5,3" stroke-width="1.6" x1="216" x2="348" y1="305" y2="374"></line><rect fill="#f0f4f8" height="400" rx="10" stroke="#9ab0c8" stroke-width="1.5" width="450" x="340" y="40"></rect><text fill="#2d5f7a" font-size="14" font-weight="bold" text-anchor="middle" x="565" y="70">n 位比特空间（n = 3）</text><text fill="#5a8099" font-size="12" text-anchor="middle" x="565" y="88">全部 2ⁿ = 8 种比特串</text><line stroke="#b0c8dc" stroke-width="1" x1="360" x2="770" y1="96" y2="96"></line><text fill="#1a7a3a" font-size="12" font-weight="bold" text-anchor="middle" x="468" y="116">编码集 C（合法码字）</text><text fill="#2da050" font-size="11" text-anchor="middle" x="468" y="131">共 2ᵏ = 4 个</text><rect fill="#d4f0e0" height="46" rx="8" stroke="#3cb36a" stroke-width="1.5" width="220" x="358" y="138"></rect><text fill="#0e6b2f" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" x="468" y="159">000</text><text fill="#2da050" font-size="11" text-anchor="middle" x="468" y="176">← 00 的编码</text><rect fill="#d4f0e0" height="46" rx="8" stroke="#3cb36a" stroke-width="1.5" width="220" x="358" y="196"></rect><text fill="#0e6b2f" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" x="468" y="217">011</text><text fill="#2da050" font-size="11" text-anchor="middle" x="468" y="234">← 01 的编码</text><rect fill="#d4f0e0" height="46" rx="8" stroke="#3cb36a" stroke-width="1.5" width="220" x="358" y="254"></rect><text fill="#0e6b2f" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" x="468" y="275">101</text><text fill="#2da050" font-size="11" text-anchor="middle" x="468" y="292">← 10 的编码</text><rect fill="#d4f0e0" height="46" rx="8" stroke="#3cb36a" stroke-width="1.5" width="220" x="358" y="312"></rect><text fill="#0e6b2f" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="middle" x="468" y="333">110</text><text fill="#2da050" font-size="11" text-anchor="middle" x="468" y="350">← 11 的编码</text><text fill="#9b3232" font-size="12" font-weight="bold" text-anchor="middle" x="672" y="116">非法比特串</text><text fill="#c04a4a" font-size="11" text-anchor="middle" x="672" y="131">共 2ⁿ − 2ᵏ = 4 个</text><rect fill="#fce8e8" height="46" rx="8" stroke="#d96060" stroke-dasharray="4,2" stroke-width="1.5" width="168" x="590" y="138"></rect><text fill="#aa3030" font-family="'Courier New', monospace" font-size="18" text-anchor="middle" x="674" y="159">001</text><text fill="#d96060" font-size="11" text-anchor="middle" x="674" y="176">不在 C 中</text><rect fill="#fce8e8" height="46" rx="8" stroke="#d96060" stroke-dasharray="4,2" stroke-width="1.5" width="168" x="590" y="196"></rect><text fill="#aa3030" font-family="'Courier New', monospace" font-size="18" text-anchor="middle" x="674" y="217">010</text><text fill="#d96060" font-size="11" text-anchor="middle" x="674" y="234">不在 C 中</text><rect fill="#fce8e8" height="46" rx="8" stroke="#d96060" stroke-dasharray="4,2" stroke-width="1.5" width="168" x="590" y="254"></rect><text fill="#aa3030" font-family="'Courier New', monospace" font-size="18" text-anchor="middle" x="674" y="275">100</text><text fill="#d96060" font-size="11" text-anchor="middle" x="674" y="292">不在 C 中</text><rect fill="#fce8e8" height="46" rx="8" stroke="#d96060" stroke-dasharray="4,2" stroke-width="1.5" width="168" x="590" y="312"></rect><text fill="#aa3030" font-family="'Courier New', monospace" font-size="18" text-anchor="middle" x="674" y="333">111</text><text fill="#d96060" font-size="11" text-anchor="middle" x="674" y="350">不在 C 中</text><rect fill="#fff8e6" height="54" rx="8" stroke="#e0b840" stroke-width="1.5" width="400" x="358" y="372"></rect><text fill="#9a6e00" font-size="12" font-weight="bold" text-anchor="middle" x="583" y="393">检错原理</text><text fill="#7a5500" font-size="11" text-anchor="middle" x="583" y="413">接收端若收到不属于 C 的比特串，即可判定传输发生了错误</text><line stroke="#b0c8dc" stroke-dasharray="3,3" stroke-width="1" x1="583" x2="583" y1="100" y2="366"></line></svg>