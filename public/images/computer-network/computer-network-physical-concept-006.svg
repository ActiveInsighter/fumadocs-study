<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="none" height="600" width="800"></rect><text class="title" fill="var(--indigo-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="40">香农定理</text><rect fill="var(--violet-mid)" height="80" opacity=".1" rx="8" stroke="var(--violet-mid)" stroke-width="2" width="700" x="50" y="70"></rect><text fill="var(--violet-deep)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="100">C = B × log₂(1 + S/N)</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-title)" text-anchor="middle" x="400" y="130">信道容量 = 带宽 × log₂(1 + 信噪比)</text><g transform="translate(60, 180)"><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="0" y="0">参数说明：</text><circle cx="20" cy="35" fill="var(--red-deep)" r="8"></circle><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="40" y="40">C - 信道容量 (bps)</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-body)" x="40" y="58">理论最大传输速率</text><circle cx="20" cy="85" fill="var(--green-mid)" r="8"></circle><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="40" y="90">B - 带宽 (Hz)</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-body)" x="40" y="108">可用频率范围</text><circle cx="20" cy="135" fill="var(--yellow-mid)" r="8"></circle><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="40" y="140">S/N - 信噪比</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-body)" x="40" y="158">信号功率 / 噪声功率</text></g><g transform="translate(400, 200)"><rect fill="var(--violet-mid)" height="60" opacity=".8" rx="8" width="80" x="0" y="0"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="40" y="25">发送端</text><text fill="var(--surface)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="40" y="40">信号 S</text><rect fill="var(--blue-soft)" height="40" rx="20" stroke="var(--blue-deep)" stroke-width="2" width="140" x="120" y="10"></rect><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="190" y="25">有噪信道</text><text fill="var(--blue-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="190" y="38">带宽: B</text><path d="M130 55q10-10 20 0t20 0 20 0 20 0 20 0 20 0" fill="none" stroke="var(--red-deep)" stroke-width="2"></path><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="190" y="75">噪声 N</text><rect fill="var(--green-mid)" height="60" opacity=".8" rx="8" width="80" x="300" y="0"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="340" y="25">接收端</text><text fill="var(--surface)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="340" y="40">S + N</text><path d="M85 30h30" marker-end="url(#arrowhead)" stroke="var(--blue-deep)" stroke-width="3"></path><path d="M265 30h30" marker-end="url(#arrowhead)" stroke="var(--blue-deep)" stroke-width="3"></path></g><g transform="translate(60, 370)"><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="0" y="0">核心思想：</text><rect fill="var(--sky-soft)" height="80" rx="8" stroke="var(--blue-mid)" stroke-width="2" width="680" x="0" y="15"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" x="20" y="40">当传输速率 ≤ 信道容量 C 时，通过适当的编码技术</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" x="20" y="65">可以实现几乎无差错的数据传输，即使存在噪声干扰！</text></g><g transform="translate(60, 500)"><text fill="var(--indigo-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" x="0" y="0">影响因素：</text><g transform="translate(0, 30)"><text fill="var(--green-mid)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="0" y="0">带宽 B ↗</text><path d="M70-5h40" marker-end="url(#arrowhead-green)" stroke="var(--green-mid)" stroke-width="3"></path><text fill="var(--green-mid)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="120" y="0">信道容量 C ↗</text></g><g transform="translate(0, 60)"><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="0" y="0">信噪比 S/N ↗</text><path d="M1e2-5h40" marker-end="url(#arrowhead-yellow)" stroke="var(--yellow-mid)" stroke-width="3"></path><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="150" y="0">信道容量 C ↗</text></g><g transform="translate(350, 30)"><rect fill="var(--amber-soft)" height="50" rx="8" stroke="var(--yellow-mid)" stroke-width="1" width="320" x="0" y="-10"></rect><text fill="var(--orange-deep)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="10" y="10">实际应用：WiFi、4G/5G、光纤通信等</text><text fill="var(--orange-deep)" font-size="var(--svg-font-size-label)" x="10" y="28">都基于此定理优化传输性能</text></g></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="var(--blue-deep)" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-green" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="var(--green-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-yellow" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="var(--yellow-mid)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>