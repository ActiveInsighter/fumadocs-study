<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect fill="none" height="600" width="800"></rect><text class="title" fill="#1e293b" font-size="28" font-weight="bold" text-anchor="middle" x="400" y="40">香农定理</text><rect fill="#3b82f6" height="80" opacity=".1" rx="8" stroke="#3b82f6" stroke-width="2" width="700" x="50" y="70"></rect><text fill="#1e40af" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="100">C = B × log₂(1 + S/N)</text><text fill="#64748b" font-size="16" text-anchor="middle" x="400" y="130">信道容量 = 带宽 × log₂(1 + 信噪比)</text><g transform="translate(60, 180)"><text fill="#1e293b" font-size="18" font-weight="bold" x="0" y="0">参数说明：</text><circle cx="20" cy="35" fill="#ef4444" r="8"></circle><text fill="#1e293b" font-size="16" font-weight="bold" x="40" y="40">C - 信道容量 (bps)</text><text fill="#64748b" font-size="14" x="40" y="58">理论最大传输速率</text><circle cx="20" cy="85" fill="#10b981" r="8"></circle><text fill="#1e293b" font-size="16" font-weight="bold" x="40" y="90">B - 带宽 (Hz)</text><text fill="#64748b" font-size="14" x="40" y="108">可用频率范围</text><circle cx="20" cy="135" fill="#f59e0b" r="8"></circle><text fill="#1e293b" font-size="16" font-weight="bold" x="40" y="140">S/N - 信噪比</text><text fill="#64748b" font-size="14" x="40" y="158">信号功率 / 噪声功率</text></g><g transform="translate(400, 200)"><rect fill="#3b82f6" height="60" opacity=".8" rx="8" width="80" x="0" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="40" y="25">发送端</text><text fill="#fff" font-size="12" text-anchor="middle" x="40" y="40">信号 S</text><rect fill="#e2e8f0" height="40" rx="20" stroke="#64748b" stroke-width="2" width="140" x="120" y="10"></rect><text fill="#1e293b" font-size="12" font-weight="bold" text-anchor="middle" x="190" y="25">有噪信道</text><text fill="#64748b" font-size="11" text-anchor="middle" x="190" y="38">带宽: B</text><path d="M130 55q10-10 20 0t20 0 20 0 20 0 20 0 20 0" fill="none" stroke="#ef4444" stroke-width="2"></path><text fill="#ef4444" font-size="11" text-anchor="middle" x="190" y="75">噪声 N</text><rect fill="#10b981" height="60" opacity=".8" rx="8" width="80" x="300" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="340" y="25">接收端</text><text fill="#fff" font-size="12" text-anchor="middle" x="340" y="40">S + N</text><path d="M85 30h30" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="3"></path><path d="M265 30h30" marker-end="url(#arrowhead)" stroke="#64748b" stroke-width="3"></path></g><g transform="translate(60, 370)"><text fill="#1e293b" font-size="18" font-weight="bold" x="0" y="0">核心思想：</text><rect fill="#f0f9ff" height="80" rx="8" stroke="#0ea5e9" stroke-width="2" width="680" x="0" y="15"></rect><text fill="#0c4a6e" font-size="16" x="20" y="40">当传输速率 ≤ 信道容量 C 时，通过适当的编码技术</text><text fill="#0c4a6e" font-size="16" x="20" y="65">可以实现几乎无差错的数据传输，即使存在噪声干扰！</text></g><g transform="translate(60, 500)"><text fill="#1e293b" font-size="18" font-weight="bold" x="0" y="0">影响因素：</text><g transform="translate(0, 30)"><text fill="#10b981" font-size="14" font-weight="bold" x="0" y="0">带宽 B ↗</text><path d="M70-5h40" marker-end="url(#arrowhead-green)" stroke="#10b981" stroke-width="3"></path><text fill="#10b981" font-size="14" font-weight="bold" x="120" y="0">信道容量 C ↗</text></g><g transform="translate(0, 60)"><text fill="#f59e0b" font-size="14" font-weight="bold" x="0" y="0">信噪比 S/N ↗</text><path d="M1e2-5h40" marker-end="url(#arrowhead-yellow)" stroke="#f59e0b" stroke-width="3"></path><text fill="#f59e0b" font-size="14" font-weight="bold" x="150" y="0">信道容量 C ↗</text></g><g transform="translate(350, 30)"><rect fill="#fef3c7" height="50" rx="8" stroke="#f59e0b" stroke-width="1" width="320" x="0" y="-10"></rect><text fill="#92400e" font-size="14" font-weight="bold" x="10" y="10">实际应用：WiFi、4G/5G、光纤通信等</text><text fill="#92400e" font-size="12" x="10" y="28">都基于此定理优化传输性能</text></g></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#64748b" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-green" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#10b981" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-yellow" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#f59e0b" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>