<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect width="600" height="320" fill="none" stroke="var(--sky-soft)" stroke-width="2" rx="8"/><text x="300" y="25" text-anchor="middle" fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)">FTP 控制连接 (TCP 端口 21)</text><rect x="50" y="80" width="120" height="80" fill="var(--indigo-mid)" rx="8" stroke="var(--blue-deep)" stroke-width="2"/><text x="110" y="105" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">FTP 客户端</text><text x="110" y="125" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)">发送命令</text><text x="110" y="145" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)">接收响应</text><rect x="430" y="80" width="120" height="80" fill="var(--green-mid)" rx="8" stroke="var(--green-mid)" stroke-width="2"/><text x="490" y="105" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)">FTP 服务器</text><text x="490" y="125" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)">处理命令</text><text x="490" y="145" text-anchor="middle" fill="var(--surface)" font-size="var(--svg-font-size-label)">返回状态码</text><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--red-deep)"/></marker></defs><line x1="170" y1="110" x2="430" y2="110" stroke="var(--red-deep)" stroke-width="3" marker-end="url(#arrowhead)"/><line x1="430" y1="130" x2="170" y2="130" stroke="var(--red-deep)" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="240" y="95" width="120" height="50" fill="var(--surface)" stroke="var(--red-deep)" stroke-width="2" rx="5"/><text x="300" y="115" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">控制连接</text><text x="300" y="130" text-anchor="middle" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)">持久连接</text><rect x="30" y="190" width="540" height="110" fill="var(--surface)" stroke="var(--indigo-light)" stroke-width="1" rx="5"/><text x="50" y="210" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)">常见 FTP 命令与响应：</text><text x="70" y="230" fill="var(--indigo-mid)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)">命令：</text><text x="120" y="230" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">USER username</text><text x="250" y="230" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">PASS password</text><text x="370" y="230" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">LIST</text><text x="420" y="230" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">CWD /path</text><text x="70" y="250" fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)">响应：</text><text x="120" y="250" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">220 Ready</text><text x="250" y="250" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">230 Login OK</text><text x="370" y="250" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">150 Opening</text><text x="470" y="250" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">250 OK</text><text x="70" y="275" fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)">特点：</text><text x="120" y="275" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">• 始终保持打开状态</text><text x="280" y="275" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">• 传输命令和状态码</text><text x="450" y="275" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">• 使用 TCP 端口 21</text><text x="120" y="290" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">• QUIT 命令关闭连接</text><text x="280" y="290" fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)">• 控制整个 FTP 会话</text></svg>