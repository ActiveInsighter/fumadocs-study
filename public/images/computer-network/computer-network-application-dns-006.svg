<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><text fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="410" y="34">DNS 缓存 (DNS Cache)</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="410" y="56">多级缓存 + TTL 生存周期，减少重复解析开销</text><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="var(--blue-ink)"></path></marker><marker id="arrow-hit" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="var(--green-mid)"></path></marker></defs><g><rect fill="var(--indigo-mid)" height="70" rx="8" stroke="var(--blue-deep)" stroke-width="2" width="120" x="30" y="120"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="150">主机</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="90" y="170">浏览器 / OS</text></g><g><rect fill="var(--neutral-soft)" height="60" rx="6" stroke="var(--indigo-light)" stroke-width="2" width="140" x="190" y="90"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="260" y="112">① 浏览器缓存</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="260" y="132">Chrome/Firefox 内部</text></g><g><rect fill="var(--neutral-soft)" height="60" rx="6" stroke="var(--indigo-light)" stroke-width="2" width="140" x="190" y="160"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="260" y="182">② 操作系统缓存</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="260" y="202">hosts / stub resolver</text></g><g><rect fill="var(--neutral-soft)" height="70" rx="6" stroke="var(--indigo-light)" stroke-width="2" width="160" x="370" y="125"></rect><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="450" y="150">③ 本地 DNS 服务器缓存</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="450" y="170">ISP / 校园网 递归解析器</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="450" y="185">命中率最高</text></g><g><rect fill="var(--neutral-mid)" height="70" rx="6" stroke="var(--ink-soft)" stroke-width="2" width="180" x="590" y="125"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="680" y="150">权威 DNS 服务器</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="680" y="170">根 → TLD → 权威</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="680" y="185">未命中时才访问</text></g><line marker-end="url(#arrow)" stroke="var(--blue-ink)" stroke-width="2" x1="150" x2="188" y1="145" y2="120"></line><line marker-end="url(#arrow)" stroke="var(--blue-ink)" stroke-width="2" x1="150" x2="188" y1="165" y2="190"></line><line marker-end="url(#arrow)" stroke="var(--blue-ink)" stroke-width="2" x1="330" x2="368" y1="160" y2="160"></line><line marker-end="url(#arrow)" stroke="var(--blue-ink)" stroke-dasharray="6,4" stroke-width="2" x1="530" x2="588" y1="160" y2="160"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="559" y="152">未命中</text><path d="M450 195q-150 65-295 0" fill="none" marker-end="url(#arrow-hit)" stroke="var(--green-mid)" stroke-dasharray="4,3" stroke-width="2"></path><text fill="var(--green-mid)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="300" y="255">命中缓存则直接返回 IP</text><line stroke="var(--indigo-light)" stroke-dasharray="4,4" stroke-width="1" x1="40" x2="780" y1="290" y2="290"></line><text fill="var(--blue-ink)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="410" y="315">TTL (Time To Live) — 缓存的有效期</text><line stroke="var(--blue-ink)" stroke-width="3" x1="80" x2="740" y1="380" y2="380"></line><polygon fill="var(--blue-ink)" points="740,380 730,375 730,385"></polygon><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="755" y="384">时间</text><circle cx="120" cy="380" fill="var(--red-deep)" r="6"></circle><line stroke="var(--red-deep)" stroke-dasharray="3,2" stroke-width="1.5" x1="120" x2="120" y1="380" y2="345"></line><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="120" y="338">首次查询</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="120" y="405">解析并写入缓存</text><rect fill="var(--lime-mid)" fill-opacity=".35" height="26" rx="4" stroke="var(--green-mid)" stroke-width="1.5" width="440" x="120" y="420"></rect><text fill="var(--green-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="340" y="438">TTL 有效期内：直接读缓存</text><circle cx="260" cy="380" fill="var(--green-mid)" r="5"></circle><line stroke="var(--green-mid)" stroke-dasharray="2,2" stroke-width="1" x1="260" x2="260" y1="380" y2="418"></line><circle cx="400" cy="380" fill="var(--green-mid)" r="5"></circle><line stroke="var(--green-mid)" stroke-dasharray="2,2" stroke-width="1" x1="400" x2="400" y1="380" y2="418"></line><circle cx="560" cy="380" fill="var(--orange-mid)" r="6"></circle><line stroke="var(--orange-mid)" stroke-dasharray="3,2" stroke-width="1.5" x1="560" x2="560" y1="380" y2="345"></line><text fill="var(--orange-mid)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="560" y="338">TTL 到期</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="560" y="405">丢弃缓存记录</text><rect fill="var(--red-deep)" fill-opacity=".25" height="26" rx="4" stroke="var(--red-deep)" stroke-width="1.5" width="160" x="560" y="420"></rect><text fill="var(--red-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="640" y="438">下次需重新解析</text><g><rect fill="var(--yellow-soft)" height="70" rx="6" stroke="var(--yellow-mid)" stroke-width="1.5" width="660" x="80" y="480"></rect><text fill="var(--amber-deep)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" x="95" y="502">示例：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="95" y="521">DNS 记录<tspan fill="var(--red-deep)" font-family="var(--svg-font-family-mono)">www.example.com → 93.184.216.34</tspan>的 TTL =<tspan fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">3600s</tspan></text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="95" y="536">→ 未来 1 小时内所有相同查询都直接命中缓存，无需再走 根 / TLD / 权威 服务器。</text></g></svg>