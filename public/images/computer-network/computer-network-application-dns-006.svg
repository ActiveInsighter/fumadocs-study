<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560"><text fill="#2c3e50" font-size="20" font-weight="bold" text-anchor="middle" x="410" y="34">DNS 缓存 (DNS Cache)</text><text fill="#7f8c8d" font-size="13" text-anchor="middle" x="410" y="56">多级缓存 + TTL 生存周期，减少重复解析开销</text><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#34495e"></path></marker><marker id="arrow-hit" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#27ae60"></path></marker></defs><g><rect fill="#3498db" height="70" rx="8" stroke="#2980b9" stroke-width="2" width="120" x="30" y="120"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="90" y="150">主机</text><text fill="#fff" font-size="11" text-anchor="middle" x="90" y="170">浏览器 / OS</text></g><g><rect fill="#ecf0f1" height="60" rx="6" stroke="#bdc3c7" stroke-width="2" width="140" x="190" y="90"></rect><text fill="#2c3e50" font-size="13" font-weight="bold" text-anchor="middle" x="260" y="112">① 浏览器缓存</text><text fill="#7f8c8d" font-size="11" text-anchor="middle" x="260" y="132">Chrome/Firefox 内部</text></g><g><rect fill="#ecf0f1" height="60" rx="6" stroke="#bdc3c7" stroke-width="2" width="140" x="190" y="160"></rect><text fill="#2c3e50" font-size="13" font-weight="bold" text-anchor="middle" x="260" y="182">② 操作系统缓存</text><text fill="#7f8c8d" font-size="11" text-anchor="middle" x="260" y="202">hosts / stub resolver</text></g><g><rect fill="#ecf0f1" height="70" rx="6" stroke="#bdc3c7" stroke-width="2" width="160" x="370" y="125"></rect><text fill="#2c3e50" font-size="13" font-weight="bold" text-anchor="middle" x="450" y="150">③ 本地 DNS 服务器缓存</text><text fill="#7f8c8d" font-size="11" text-anchor="middle" x="450" y="170">ISP / 校园网 递归解析器</text><text fill="#7f8c8d" font-size="11" text-anchor="middle" x="450" y="185">命中率最高</text></g><g><rect fill="#95a5a6" height="70" rx="6" stroke="#7f8c8d" stroke-width="2" width="180" x="590" y="125"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="680" y="150">权威 DNS 服务器</text><text fill="#fff" font-size="11" text-anchor="middle" x="680" y="170">根 → TLD → 权威</text><text fill="#fff" font-size="11" text-anchor="middle" x="680" y="185">未命中时才访问</text></g><line marker-end="url(#arrow)" stroke="#34495e" stroke-width="2" x1="150" x2="188" y1="145" y2="120"></line><line marker-end="url(#arrow)" stroke="#34495e" stroke-width="2" x1="150" x2="188" y1="165" y2="190"></line><line marker-end="url(#arrow)" stroke="#34495e" stroke-width="2" x1="330" x2="368" y1="160" y2="160"></line><line marker-end="url(#arrow)" stroke="#34495e" stroke-dasharray="6,4" stroke-width="2" x1="530" x2="588" y1="160" y2="160"></line><text fill="#c0392b" font-size="10" text-anchor="middle" x="559" y="152">未命中</text><path d="M450 195q-150 65-295 0" fill="none" marker-end="url(#arrow-hit)" stroke="#27ae60" stroke-dasharray="4,3" stroke-width="2"></path><text fill="#27ae60" font-size="11" font-weight="bold" text-anchor="middle" x="300" y="255">命中缓存则直接返回 IP</text><line stroke="#bdc3c7" stroke-dasharray="4,4" stroke-width="1" x1="40" x2="780" y1="290" y2="290"></line><text fill="#2c3e50" font-size="15" font-weight="bold" text-anchor="middle" x="410" y="315">TTL (Time To Live) — 缓存的有效期</text><line stroke="#34495e" stroke-width="3" x1="80" x2="740" y1="380" y2="380"></line><polygon fill="#34495e" points="740,380 730,375 730,385"></polygon><text fill="#34495e" font-size="12" x="755" y="384">时间</text><circle cx="120" cy="380" fill="#e74c3c" r="6"></circle><line stroke="#e74c3c" stroke-dasharray="3,2" stroke-width="1.5" x1="120" x2="120" y1="380" y2="345"></line><text fill="#e74c3c" font-size="11" font-weight="bold" text-anchor="middle" x="120" y="338">首次查询</text><text fill="#34495e" font-size="11" text-anchor="middle" x="120" y="405">解析并写入缓存</text><rect fill="#2ecc71" fill-opacity=".35" height="26" rx="4" stroke="#27ae60" stroke-width="1.5" width="440" x="120" y="420"></rect><text fill="#1e8449" font-size="12" font-weight="bold" text-anchor="middle" x="340" y="438">TTL 有效期内：直接读缓存</text><circle cx="260" cy="380" fill="#27ae60" r="5"></circle><line stroke="#27ae60" stroke-dasharray="2,2" stroke-width="1" x1="260" x2="260" y1="380" y2="418"></line><circle cx="400" cy="380" fill="#27ae60" r="5"></circle><line stroke="#27ae60" stroke-dasharray="2,2" stroke-width="1" x1="400" x2="400" y1="380" y2="418"></line><circle cx="560" cy="380" fill="#e67e22" r="6"></circle><line stroke="#e67e22" stroke-dasharray="3,2" stroke-width="1.5" x1="560" x2="560" y1="380" y2="345"></line><text fill="#e67e22" font-size="11" font-weight="bold" text-anchor="middle" x="560" y="338">TTL 到期</text><text fill="#34495e" font-size="11" text-anchor="middle" x="560" y="405">丢弃缓存记录</text><rect fill="#e74c3c" fill-opacity=".25" height="26" rx="4" stroke="#c0392b" stroke-width="1.5" width="160" x="560" y="420"></rect><text fill="#a93226" font-size="12" font-weight="bold" text-anchor="middle" x="640" y="438">下次需重新解析</text><g><rect fill="#fef9e7" height="70" rx="6" stroke="#f1c40f" stroke-width="1.5" width="660" x="80" y="480"></rect><text fill="#7d6608" font-size="12" font-weight="bold" x="95" y="502">示例：</text><text fill="#34495e" font-size="12" x="95" y="521">DNS 记录<tspan fill="#c0392b" font-family="monospace">www.example.com → 93.184.216.34</tspan>的 TTL =<tspan fill="#c0392b" font-weight="bold">3600s</tspan></text><text fill="#34495e" font-size="12" x="95" y="536">→ 未来 1 小时内所有相同查询都直接命中缓存，无需再走 根 / TLD / 权威 服务器。</text></g></svg>