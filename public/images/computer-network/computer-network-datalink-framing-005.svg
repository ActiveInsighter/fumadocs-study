<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370"><rect fill="none" height="370" width="800"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="400" y="25">违规编码法 - 曼彻斯特编码帧定界</text><line stroke="#bdc3c7" stroke-dasharray="2,2" stroke-width="1" x1="80" x2="720" y1="80" y2="80"></line><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" x="50" y="85">时钟</text><g stroke="#bdc3c7" stroke-width="1"><line x1="100" x2="100" y1="75" y2="85"></line><line x1="140" x2="140" y1="75" y2="85"></line><line x1="180" x2="180" y1="75" y2="85"></line><line x1="220" x2="220" y1="75" y2="85"></line><line x1="260" x2="260" y1="75" y2="85"></line><line x1="300" x2="300" y1="75" y2="85"></line><line x1="340" x2="340" y1="75" y2="85"></line><line x1="380" x2="380" y1="75" y2="85"></line><line x1="420" x2="420" y1="75" y2="85"></line><line x1="460" x2="460" y1="75" y2="85"></line><line x1="500" x2="500" y1="75" y2="85"></line><line x1="540" x2="540" y1="75" y2="85"></line><line x1="580" x2="580" y1="75" y2="85"></line><line x1="620" x2="620" y1="75" y2="85"></line><line x1="660" x2="660" y1="75" y2="85"></line><line x1="700" x2="700" y1="75" y2="85"></line></g><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" x="50" y="115">数据位</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="120" y="115">1</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="200" y="115">0</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="280" y="115">1</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="360" y="115">0</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" x="380" y="165">正常编码</text><line stroke="#ecf0f1" stroke-width="1" x1="80" x2="720" y1="140" y2="140"></line><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" x="75" y="138">高</text><line stroke="#ecf0f1" stroke-width="1" x1="80" x2="720" y1="180" y2="180"></line><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" x="75" y="185">低</text><g fill="none" stroke="#3498db" stroke-width="2.5"><path d="M1e2 140h20v40h20"></path><path d="M140 180h20V140h20"></path><path d="M180 140h20v40h20"></path><path d="M220 180h20V140h20"></path></g><g fill="#3498db" font-family="Arial, sans-serif" font-size="10"><text text-anchor="middle" x="120" y="200">1: 高→低</text><text text-anchor="middle" x="200" y="200">0: 低→高</text><text text-anchor="middle" x="280" y="200">1: 高→低</text><text text-anchor="middle" x="360" y="200">0: 低→高</text></g><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" x="380" y="260">违规编码</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="11" x="380" y="275">(帧定界)</text><line stroke="#ecf0f1" stroke-width="1" x1="80" x2="720" y1="240" y2="240"></line><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" x="75" y="238">高</text><line stroke="#ecf0f1" stroke-width="1" x1="80" x2="720" y1="280" y2="280"></line><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" x="75" y="285">低</text><g fill="none" stroke="#e74c3c" stroke-width="2.5"><path d="M1e2 240h20 20"></path><path d="M140 240l20 40V240h20"></path><path d="M180 240h20v40h20"></path><path d="M220 280h20V240h20"></path><path d="M260 240h20v40h20"></path><path d="M3e2 280h20 20"></path></g><g fill="#e74c3c" font-family="Arial, sans-serif" font-size="10"><text font-weight="bold" text-anchor="middle" x="120" y="300">高-高</text><text text-anchor="middle" x="120" y="312">(帧开始)</text><text font-weight="bold" text-anchor="middle" x="320" y="300">低-低</text><text text-anchor="middle" x="320" y="312">(帧结束)</text></g><g fill="#27ae60" font-family="Arial, sans-serif" font-size="10"><text text-anchor="middle" x="220" y="300">正常数据: 0 1 0 1</text></g><rect fill="#fff" height="120" rx="5" stroke="#bdc3c7" stroke-width="1" width="250" x="450" y="160"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="465" y="175">违规编码法原理</text><g fill="#2c3e50" font-family="Arial, sans-serif" font-size="11"><text x="465" y="195">• 正常编码:</text><text x="475" y="210">- 数据"1": 高→低电平</text><text x="475" y="225">- 数据"0": 低→高电平</text><text x="465" y="245">• 违规编码(帧定界):</text><text x="475" y="260">- 高→高: 帧开始标记</text><text x="475" y="275">- 低→低: 帧结束标记</text></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><path d="M120 220q0 10 0 15" fill="none" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="1.5"></path><path d="M320 220q0 10 0 15" fill="none" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="1.5"></path><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="400" y="355">利用未使用的电平组合进行帧定界，避免了额外开销</text></svg>