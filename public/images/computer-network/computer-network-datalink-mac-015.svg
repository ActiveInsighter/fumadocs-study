<svg xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" viewBox="0 0 860 520"><rect fill="#f8f9fa" height="510" rx="8" width="860"></rect><rect fill="none" height="250" rx="10" stroke="#a0aec0" stroke-dasharray="10,5" stroke-width="1.5" width="804" x="28" y="18"></rect><text fill="#718096" font-size="11" font-weight="bold" x="44" y="44">ESS（Extended Service Set）</text><rect fill="#4a90d9" height="26" opacity=".85" rx="5" width="748" x="56" y="228"></rect><text fill="#fff" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle" x="430" y="246">DS — Distribution System（分布式系统 / 骨干有线网络）</text><ellipse cx="150" cy="135" fill="#ebf8ff" rx="100" ry="80" stroke="#90cdf4" stroke-dasharray="7,4" stroke-width="2"></ellipse><text fill="#2b6cb0" font-size="11" font-weight="bold" text-anchor="middle" x="150" y="78">BSS 1</text><text fill="#4a90d9" font-size="10" text-anchor="middle" x="150" y="91">Basic Service Set</text><rect fill="#2b6cb0" height="28" rx="4" width="54" x="123" y="104"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="150" y="123">AP₁</text><circle cx="84" cy="155" fill="#48bb78" r="15" stroke="#276749" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="84" y="151">STA</text><text fill="#fff" font-size="9" text-anchor="middle" x="84" y="163">A</text><circle cx="216" cy="155" fill="#48bb78" r="15" stroke="#276749" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="216" y="151">STA</text><text fill="#fff" font-size="9" text-anchor="middle" x="216" y="163">B</text><circle cx="150" cy="192" fill="#48bb78" r="15" stroke="#276749" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="150" y="188">STA</text><text fill="#fff" font-size="9" text-anchor="middle" x="150" y="200">C</text><line opacity=".7" stroke="#48bb78" stroke-dasharray="5,3" stroke-width="1.5" x1="150" x2="99" y1="132" y2="150"></line><line opacity=".7" stroke="#48bb78" stroke-dasharray="5,3" stroke-width="1.5" x1="150" x2="201" y1="132" y2="150"></line><line opacity=".7" stroke="#48bb78" stroke-dasharray="5,3" stroke-width="1.5" x1="150" x2="150" y1="132" y2="177"></line><line stroke="#2b6cb0" stroke-width="2.5" x1="150" x2="150" y1="132" y2="228"></line><polygon fill="#2b6cb0" points="146,225 154,225 150,231"></polygon><ellipse cx="430" cy="135" fill="ivory" rx="100" ry="80" stroke="#f6e05e" stroke-dasharray="7,4" stroke-width="2"></ellipse><text fill="#975a16" font-size="11" font-weight="bold" text-anchor="middle" x="430" y="78">BSS 2</text><text fill="#d69e2e" font-size="10" text-anchor="middle" x="430" y="91">Basic Service Set</text><rect fill="#b7791f" height="28" rx="4" width="54" x="403" y="104"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="430" y="123">AP₂</text><circle cx="364" cy="162" fill="#ed8936" r="15" stroke="#c05621" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="364" y="158">STA</text><text fill="#fff" font-size="9" text-anchor="middle" x="364" y="170">D</text><circle cx="496" cy="162" fill="#ed8936" r="15" stroke="#c05621" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="496" y="158">STA</text><text fill="#fff" font-size="9" text-anchor="middle" x="496" y="170">E</text><line opacity=".7" stroke="#ed8936" stroke-dasharray="5,3" stroke-width="1.5" x1="430" x2="379" y1="132" y2="157"></line><line opacity=".7" stroke="#ed8936" stroke-dasharray="5,3" stroke-width="1.5" x1="430" x2="481" y1="132" y2="157"></line><line stroke="#b7791f" stroke-width="2.5" x1="430" x2="430" y1="132" y2="228"></line><polygon fill="#b7791f" points="426,225 434,225 430,231"></polygon><ellipse cx="710" cy="135" fill="#fff5f5" rx="100" ry="80" stroke="#feb2b2" stroke-dasharray="7,4" stroke-width="2"></ellipse><text fill="#c53030" font-size="11" font-weight="bold" text-anchor="middle" x="710" y="78">BSS 3</text><text fill="#e53e3e" font-size="10" text-anchor="middle" x="710" y="91">Basic Service Set</text><rect fill="#c53030" height="28" rx="4" width="54" x="683" y="104"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="710" y="123">AP₃</text><circle cx="644" cy="155" fill="#fc8181" r="15" stroke="#c53030" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="644" y="151">STA</text><text fill="#fff" font-size="9" text-anchor="middle" x="644" y="163">F</text><circle cx="776" cy="155" fill="#fc8181" r="15" stroke="#c53030" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="776" y="151">STA</text><text fill="#fff" font-size="9" text-anchor="middle" x="776" y="163">G</text><circle cx="710" cy="192" fill="#fc8181" r="15" stroke="#c53030" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="710" y="188">STA</text><text fill="#fff" font-size="9" text-anchor="middle" x="710" y="200">H</text><line opacity=".7" stroke="#fc8181" stroke-dasharray="5,3" stroke-width="1.5" x1="710" x2="659" y1="132" y2="150"></line><line opacity=".7" stroke="#fc8181" stroke-dasharray="5,3" stroke-width="1.5" x1="710" x2="761" y1="132" y2="150"></line><line opacity=".7" stroke="#fc8181" stroke-dasharray="5,3" stroke-width="1.5" x1="710" x2="710" y1="132" y2="177"></line><line stroke="#c53030" stroke-width="2.5" x1="710" x2="710" y1="132" y2="228"></line><polygon fill="#c53030" points="706,225 714,225 710,231"></polygon><rect fill="#fff" height="210" rx="8" stroke="#e2e8f0" stroke-width="1.5" width="804" x="28" y="278"></rect><ellipse cx="70" cy="306" fill="#ebf8ff" rx="22" ry="14" stroke="#90cdf4" stroke-dasharray="5,3" stroke-width="1.5"></ellipse><text fill="#2b6cb0" font-size="11" font-weight="bold" x="102" y="302">BSS（基本服务集）</text><text fill="#555" font-size="10" x="102" y="316">一个 AP 覆盖范围内的所有 STA 组成一个 BSS；同一 BSS 内的通信通过 AP 中转</text><rect fill="none" height="16" rx="3" stroke="#a0aec0" stroke-dasharray="5,3" stroke-width="1.5" width="44" x="48" y="334"></rect><text fill="#718096" font-size="9" font-weight="bold" text-anchor="middle" x="70" y="346">ESS</text><text fill="#718096" font-size="11" font-weight="bold" x="102" y="342">ESS（扩展服务集）</text><text fill="#555" font-size="10" x="102" y="356">由多个 BSS + DS 组合而成的更大范围无线网络，对外表现为一个整体</text><rect fill="#2b6cb0" height="20" rx="3" width="44" x="48" y="368"></rect><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="70" y="382">AP</text><text fill="#2b6cb0" font-size="11" font-weight="bold" x="102" y="376">AP（接入点）</text><text fill="#555" font-size="10" x="102" y="390">无线局域网的"基站"，负责将 STA 的无线帧桥接到 DS（有线网络）</text><circle cx="70" cy="414" fill="#48bb78" r="13" stroke="#276749" stroke-width="1.5"></circle><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="70" y="418">STA</text><text fill="#276749" font-size="11" font-weight="bold" x="102" y="410">STA（站点）</text><text fill="#555" font-size="10" x="102" y="424">无线终端设备（手机、笔记本等），通过关联到 AP 来加入 BSS</text><rect fill="#4a90d9" height="18" opacity=".85" rx="3" width="44" x="48" y="438"></rect><text fill="#fff" font-size="10" font-weight="bold" text-anchor="middle" x="70" y="451">DS</text><text fill="#1a56a0" font-size="11" font-weight="bold" x="102" y="446">DS（分布式系统）</text><text fill="#555" font-size="10" x="102" y="460">连接各 AP 的有线骨干网，负责在不同 BSS 之间转发帧，使跨 BSS 通信成为可能</text><text fill="#555" font-size="10" x="102" y="474">例：STA-A（BSS 1）→ AP₁ → DS → AP₂ → STA-D（BSS 2）</text><defs><marker id="arrowP" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#805ad5"></path></marker></defs></svg>