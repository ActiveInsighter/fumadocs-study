<svg xmlns="http://www.w3.org/2000/svg" font-family="var(--svg-font-family)" viewBox="0 0 860 520" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="var(--surface)" height="510" rx="8" width="860"></rect><rect fill="none" height="250" rx="10" stroke="var(--blue-mid)" stroke-dasharray="10,5" stroke-width="1.5" width="804" x="28" y="18"></rect><text fill="var(--sky-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="44" y="44">ESS（Extended Service Set）</text><rect fill="var(--violet-mid)" height="26" opacity=".85" rx="5" width="748" x="56" y="228"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" letter-spacing="1" text-anchor="middle" x="430" y="246">DS — Distribution System（分布式系统 / 骨干有线网络）</text><ellipse cx="150" cy="135" fill="var(--sky-soft)" rx="100" ry="80" stroke="var(--sky-mid)" stroke-dasharray="7,4" stroke-width="2"></ellipse><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="78">BSS 1</text><text fill="var(--violet-mid)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="150" y="91">Basic Service Set</text><rect fill="var(--indigo-deep)" height="28" rx="4" width="54" x="123" y="104"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="123">AP₁</text><circle cx="84" cy="155" fill="var(--green-mid)" r="15" stroke="var(--green-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="84" y="151">STA</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="84" y="163">A</text><circle cx="216" cy="155" fill="var(--green-mid)" r="15" stroke="var(--green-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="216" y="151">STA</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="216" y="163">B</text><circle cx="150" cy="192" fill="var(--green-mid)" r="15" stroke="var(--green-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="150" y="188">STA</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="150" y="200">C</text><line opacity=".7" stroke="var(--green-mid)" stroke-dasharray="5,3" stroke-width="1.5" x1="150" x2="99" y1="132" y2="150"></line><line opacity=".7" stroke="var(--green-mid)" stroke-dasharray="5,3" stroke-width="1.5" x1="150" x2="201" y1="132" y2="150"></line><line opacity=".7" stroke="var(--green-mid)" stroke-dasharray="5,3" stroke-width="1.5" x1="150" x2="150" y1="132" y2="177"></line><line stroke="var(--indigo-deep)" stroke-width="2.5" x1="150" x2="150" y1="132" y2="228"></line><polygon fill="var(--indigo-deep)" points="146,225 154,225 150,231"></polygon><ellipse cx="430" cy="135" fill="var(--surface)" rx="100" ry="80" stroke="var(--yellow-mid)" stroke-dasharray="7,4" stroke-width="2"></ellipse><text fill="var(--orange-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="430" y="78">BSS 2</text><text fill="var(--yellow-mid)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="430" y="91">Basic Service Set</text><rect fill="var(--amber-mid)" height="28" rx="4" width="54" x="403" y="104"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="430" y="123">AP₂</text><circle cx="364" cy="162" fill="var(--orange-mid)" r="15" stroke="var(--coral-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="364" y="158">STA</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="364" y="170">D</text><circle cx="496" cy="162" fill="var(--orange-mid)" r="15" stroke="var(--coral-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="496" y="158">STA</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="496" y="170">E</text><line opacity=".7" stroke="var(--orange-mid)" stroke-dasharray="5,3" stroke-width="1.5" x1="430" x2="379" y1="132" y2="157"></line><line opacity=".7" stroke="var(--orange-mid)" stroke-dasharray="5,3" stroke-width="1.5" x1="430" x2="481" y1="132" y2="157"></line><line stroke="var(--amber-mid)" stroke-width="2.5" x1="430" x2="430" y1="132" y2="228"></line><polygon fill="var(--amber-mid)" points="426,225 434,225 430,231"></polygon><ellipse cx="710" cy="135" fill="var(--paper)" rx="100" ry="80" stroke="var(--red-mid)" stroke-dasharray="7,4" stroke-width="2"></ellipse><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="710" y="78">BSS 3</text><text fill="var(--red-deep)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="710" y="91">Basic Service Set</text><rect fill="var(--red-deep)" height="28" rx="4" width="54" x="683" y="104"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="710" y="123">AP₃</text><circle cx="644" cy="155" fill="var(--red-mid)" r="15" stroke="var(--red-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="644" y="151">STA</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="644" y="163">F</text><circle cx="776" cy="155" fill="var(--red-mid)" r="15" stroke="var(--red-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="776" y="151">STA</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="776" y="163">G</text><circle cx="710" cy="192" fill="var(--red-mid)" r="15" stroke="var(--red-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="710" y="188">STA</text><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="710" y="200">H</text><line opacity=".7" stroke="var(--red-mid)" stroke-dasharray="5,3" stroke-width="1.5" x1="710" x2="659" y1="132" y2="150"></line><line opacity=".7" stroke="var(--red-mid)" stroke-dasharray="5,3" stroke-width="1.5" x1="710" x2="761" y1="132" y2="150"></line><line opacity=".7" stroke="var(--red-mid)" stroke-dasharray="5,3" stroke-width="1.5" x1="710" x2="710" y1="132" y2="177"></line><line stroke="var(--red-deep)" stroke-width="2.5" x1="710" x2="710" y1="132" y2="228"></line><polygon fill="var(--red-deep)" points="706,225 714,225 710,231"></polygon><rect fill="var(--surface)" height="210" rx="8" stroke="var(--blue-soft)" stroke-width="1.5" width="804" x="28" y="278"></rect><ellipse cx="70" cy="306" fill="var(--sky-soft)" rx="22" ry="14" stroke="var(--sky-mid)" stroke-dasharray="5,3" stroke-width="1.5"></ellipse><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="102" y="302">BSS（基本服务集）</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="102" y="316">一个 AP 覆盖范围内的所有 STA 组成一个 BSS；同一 BSS 内的通信通过 AP 中转</text><rect fill="none" height="16" rx="3" stroke="var(--blue-mid)" stroke-dasharray="5,3" stroke-width="1.5" width="44" x="48" y="334"></rect><text fill="var(--sky-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="70" y="346">ESS</text><text fill="var(--sky-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="102" y="342">ESS（扩展服务集）</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="102" y="356">由多个 BSS + DS 组合而成的更大范围无线网络，对外表现为一个整体</text><rect fill="var(--indigo-deep)" height="20" rx="3" width="44" x="48" y="368"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="70" y="382">AP</text><text fill="var(--indigo-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="102" y="376">AP（接入点）</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="102" y="390">无线局域网的"基站"，负责将 STA 的无线帧桥接到 DS（有线网络）</text><circle cx="70" cy="414" fill="var(--green-mid)" r="13" stroke="var(--green-deep)" stroke-width="1.5"></circle><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="70" y="418">STA</text><text fill="var(--green-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="102" y="410">STA（站点）</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="102" y="424">无线终端设备（手机、笔记本等），通过关联到 AP 来加入 BSS</text><rect fill="var(--violet-mid)" height="18" opacity=".85" rx="3" width="44" x="48" y="438"></rect><text fill="var(--surface)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="70" y="451">DS</text><text fill="var(--violet-deep)" font-size="var(--svg-font-size-caption)" font-weight="var(--svg-font-weight-bold)" x="102" y="446">DS（分布式系统）</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="102" y="460">连接各 AP 的有线骨干网，负责在不同 BSS 之间转发帧，使跨 BSS 通信成为可能</text><text fill="var(--neutral-deep)" font-size="var(--svg-font-size-caption)" x="102" y="474">例：STA-A（BSS 1）→ AP₁ → DS → AP₂ → STA-D（BSS 2）</text><defs><marker id="arrowP" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="var(--purple-deep)"></path></marker></defs></svg>