<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"><rect fill="none" height="600" width="900"></rect><text fill="#2c3e50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" x="450" y="30">CSMA/CD 载波监听多路访问/碰撞检测</text><rect fill="#3498db" height="40" rx="20" stroke="#2980b9" stroke-width="3" width="700" x="100" y="220"></rect><text fill="#000" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" x="450" y="205">共享通信介质</text><g id="deviceA"><rect fill="#e74c3c" height="60" rx="5" stroke="#c0392b" stroke-width="2" width="80" x="50" y="140"></rect><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="90" y="160">设备 A</text><text fill="#fff" font-family="Arial" font-size="10" text-anchor="middle" x="90" y="175">正在发送</text><path d="M130 170l50 30" marker-end="url(#arrowhead-red)" stroke="#e74c3c" stroke-width="4"></path><text fill="#e74c3c" font-family="Arial" font-size="9" x="140" y="165">发送数据</text><path d="M90 2e2q0 10 10 20" fill="none" marker-end="url(#arrowhead-red)" stroke="#e74c3c" stroke-dasharray="5,5" stroke-width="2"></path><text fill="#e74c3c" font-family="Arial" font-size="9" x="45" y="215">持续监听</text></g><g id="deviceB"><rect fill="#f39c12" height="60" rx="5" stroke="#e67e22" stroke-width="2" width="80" x="770" y="140"></rect><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="810" y="160">设备 B</text><text fill="#fff" font-family="Arial" font-size="10" text-anchor="middle" x="810" y="175">正在发送</text><path d="M770 170l-50 30" marker-end="url(#arrowhead-orange)" stroke="#f39c12" stroke-width="4"></path><text fill="#f39c12" font-family="Arial" font-size="9" x="725" y="165">发送数据</text><path d="M810 2e2q0 10-10 20" fill="none" marker-end="url(#arrowhead-orange)" stroke="#f39c12" stroke-dasharray="5,5" stroke-width="2"></path><text fill="#f39c12" font-family="Arial" font-size="9" x="820" y="215">持续监听</text></g><g id="collision"><ellipse cx="450" cy="240" fill="#ff6b6b" opacity=".8" rx="80" ry="25" stroke="#e55555" stroke-width="3"></ellipse><text fill="#fff" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" x="520" y="236">碰撞!</text><text fill="#fff" font-family="Arial" font-size="11" text-anchor="middle" x="380" y="235">数据损坏</text><g opacity=".7"><path d="M450 240l10-15 5 10 10-5-5 12 10 6-12 2 7 10-10-5-5 10-10-7-10 7-5-10-10 5 7-10-12-2 10-6-5-12 10 5 5-10z" fill="#ff4757" stroke="#ff3838" stroke-width="1"></path></g></g><g id="timeline"><line stroke="#7f8c8d" stroke-width="2" x1="100" x2="800" y1="320" y2="320"></line><text fill="#2c3e50" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" x="450" y="310">时间线</text><g id="timepoints"><line stroke="#34495e" stroke-width="2" x1="200" x2="200" y1="315" y2="325"></line><text fill="#34495e" font-family="Arial" font-size="11" text-anchor="middle" x="200" y="340">t1: 开始发送</text><line stroke="#e74c3c" stroke-width="3" x1="450" x2="450" y1="315" y2="325"></line><text fill="#e74c3c" font-family="Arial" font-size="11" text-anchor="middle" x="450" y="340">t2: 碰撞发生</text><line stroke="#f39c12" stroke-width="2" x1="500" x2="500" y1="315" y2="325"></line><text fill="#f39c12" font-family="Arial" font-size="11" text-anchor="middle" x="500" y="360">t3: 检测到碰撞</text><line stroke="#27ae60" stroke-width="2" x1="550" x2="550" y1="315" y2="325"></line><text fill="#27ae60" font-family="Arial" font-size="11" text-anchor="middle" x="550" y="340">t4: 停止发送</text></g></g><g id="comparison"><rect fill="#ecf0f1" height="120" rx="5" stroke="#bdc3c7" stroke-width="2" width="380" x="50" y="380"></rect><text fill="#2c3e50" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" x="240" y="405">CSMA (原始版本)</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="60" y="425">✓ 发送前载波监听</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="60" y="440">✗ 发送时不监听</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="60" y="455">✗ 碰撞后才知道失败</text><text fill="#e74c3c" font-family="Arial" font-size="12" x="60" y="470">→ 浪费带宽和时间</text><text fill="#e74c3c" font-family="Arial" font-size="12" x="60" y="485">→ 效率较低</text><rect fill="#d5f4e6" height="120" rx="5" stroke="#27ae60" stroke-width="2" width="380" x="470" y="380"></rect><text fill="#2c3e50" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" x="660" y="405">CSMA/CD (改进版本)</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="480" y="425">✓ 发送前载波监听</text><text fill="#27ae60" font-family="Arial" font-size="12" x="480" y="440">✓ 发送时持续监听</text><text fill="#27ae60" font-family="Arial" font-size="12" x="480" y="455">✓ 实时检测碰撞</text><text fill="#27ae60" font-family="Arial" font-size="12" x="480" y="470">→ 立即停止发送</text><text fill="#27ae60" font-family="Arial" font-size="12" x="480" y="485">→ 提高网络效率</text></g><g id="cdProcess"><text fill="#34495e" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" x="450" y="65">碰撞检测(CD)工作流程</text><g id="steps"><circle cx="150" cy="100" fill="#3498db" r="20" stroke="#2980b9" stroke-width="2"></circle><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="150" y="105">1</text><text fill="#2c3e50" font-family="Arial" font-size="10" text-anchor="middle" x="150" y="135">载波监听</text><path d="M170 1e2h40" marker-end="url(#arrowhead)" stroke="#7f8c8d" stroke-width="2"></path><circle cx="230" cy="100" fill="#27ae60" r="20" stroke="#229954" stroke-width="2"></circle><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="230" y="105">2</text><text fill="#2c3e50" font-family="Arial" font-size="10" text-anchor="middle" x="230" y="135">开始发送</text><path d="M250 1e2h40" marker-end="url(#arrowhead)" stroke="#7f8c8d" stroke-width="2"></path><circle cx="310" cy="100" fill="#f39c12" r="20" stroke="#e67e22" stroke-width="2"></circle><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="310" y="105">3</text><text fill="#2c3e50" font-family="Arial" font-size="10" text-anchor="middle" x="310" y="135">持续监听</text><path d="M330 1e2h40" marker-end="url(#arrowhead)" stroke="#7f8c8d" stroke-width="2"></path><circle cx="390" cy="100" fill="#e74c3c" r="20" stroke="#c0392b" stroke-width="2"></circle><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="390" y="105">4</text><text fill="#2c3e50" font-family="Arial" font-size="10" text-anchor="middle" x="390" y="135">检测碰撞</text><path d="M410 1e2h40" marker-end="url(#arrowhead)" stroke="#7f8c8d" stroke-width="2"></path><circle cx="470" cy="100" fill="#9b59b6" r="20" stroke="#8e44ad" stroke-width="2"></circle><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="470" y="105">5</text><text fill="#2c3e50" font-family="Arial" font-size="10" text-anchor="middle" x="470" y="135">立即停止</text></g></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#7f8c8d" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-red" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-orange" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#f39c12" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><g id="carrier-explanation"><rect fill="#fff3cd" height="50" rx="285" stroke="#ffeaa7" stroke-width="2" width="280" x="330" y="520"></rect><text fill="#2c3e50" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="470" y="540">载波监听器件 (Carrier)</text><text fill="#2c3e50" font-family="Arial" font-size="11" x="370" y="555">发送期间持续工作，实时检测信号异常</text></g></svg>