<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" viewBox="0 0 800 520"><rect fill="#f8f9fa" height="520" rx="12" width="800"></rect><rect fill="#e8f4fd" height="460" rx="10" stroke="#4a90d9" stroke-width="2" width="240" x="30" y="30"></rect><text fill="#2c5f8a" font-size="15" font-weight="bold" text-anchor="middle" x="150" y="58">发送方 Sender</text><rect fill="#fff" height="110" rx="8" stroke="#e67e22" stroke-width="2" width="190" x="55" y="75"></rect><text fill="#e67e22" font-size="13" font-weight="bold" text-anchor="middle" x="150" y="97">拥塞窗口 cwnd</text><text fill="#555" font-size="11" text-anchor="middle" x="150" y="116">发送方内部维护</text><text fill="#555" font-size="11" text-anchor="middle" x="150" y="134">由拥塞控制算法驱动</text><text fill="#555" font-size="11" text-anchor="middle" x="150" y="153">慢启动 / 拥塞避免 / 快恢复</text><text fill="#888" font-size="11" text-anchor="middle" x="150" y="172">↑ ACK到达 · 丢包信号</text><rect fill="#fff" height="100" rx="8" stroke="#27ae60" stroke-width="2.5" width="190" x="55" y="210"></rect><text fill="#27ae60" font-size="13" font-weight="bold" text-anchor="middle" x="150" y="232">发送窗口 swnd</text><text fill="#27ae60" font-size="13" text-anchor="middle" x="150" y="254">= min(cwnd, rwnd)</text><text fill="#555" font-size="11" text-anchor="middle" x="150" y="275">实际可发未确认数据量</text><text fill="#888" font-size="11" text-anchor="middle" x="150" y="294">cwnd 或 rwnd 变化即更新</text><text fill="#2c5f8a" font-size="12" font-weight="bold" text-anchor="middle" x="150" y="335">发送缓冲区</text><rect fill="#dde" height="22" rx="4" width="180" x="60" y="345"></rect><rect fill="#b0c4de" height="22" rx="4" width="50" x="60" y="345"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="85" y="361">已确认</text><rect fill="#27ae60" height="22" rx="0" width="70" x="110" y="345"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="145" y="361">已发未确认</text><rect fill="#f0a500" height="22" rx="0" width="40" x="180" y="345"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="200" y="361">可发</text><rect fill="#ccc" height="22" rx="0 4 4 0" width="20" x="220" y="345"></rect><text fill="#888" font-size="8" text-anchor="middle" x="230" y="361">阻</text><line stroke="#27ae60" stroke-dasharray="3,2" stroke-width="1.5" x1="110" x2="220" y1="370" y2="370"></line><text fill="#27ae60" font-size="10" text-anchor="middle" x="165" y="382">← swnd →</text><rect fill="#fff8f0" height="75" rx="8" stroke="#e67e22" stroke-dasharray="5,3" stroke-width="1.5" width="190" x="55" y="400"></rect><text fill="#e67e22" font-size="11" font-weight="bold" text-anchor="middle" x="150" y="420">cwnd 调整触发</text><text fill="#555" font-size="10" text-anchor="middle" x="150" y="438">✓ 新ACK → cwnd 增大</text><text fill="#555" font-size="10" text-anchor="middle" x="150" y="454">✗ 3重复ACK → cwnd 减半</text><text fill="#555" font-size="10" text-anchor="middle" x="150" y="470">✗ 超时 → cwnd 重置为1</text><rect fill="#edf7ed" height="460" rx="10" stroke="#27ae60" stroke-width="2" width="240" x="530" y="30"></rect><text fill="#1a6b2f" font-size="15" font-weight="bold" text-anchor="middle" x="650" y="58">接收方 Receiver</text><rect fill="#fff" height="130" rx="8" stroke="#4a90d9" stroke-width="2" width="190" x="555" y="75"></rect><text fill="#4a90d9" font-size="13" font-weight="bold" text-anchor="middle" x="650" y="97">接收窗口 rwnd</text><text fill="#555" font-size="11" text-anchor="middle" x="650" y="116">接收方公告给发送方</text><text fill="#555" font-size="11" text-anchor="middle" x="650" y="135">= 接收缓冲区剩余空间</text><line stroke="#ddd" stroke-width="1" x1="570" x2="730" y1="145" y2="145"></line><text fill="#888" font-size="11" text-anchor="middle" x="650" y="162">影响因素：</text><text fill="#888" font-size="10" text-anchor="middle" x="650" y="179">缓冲区余量 · 应用消费速率</text><text fill="#888" font-size="10" text-anchor="middle" x="650" y="195">SO_RCVBUF 系统上限</text><text fill="#1a6b2f" font-size="12" font-weight="bold" text-anchor="middle" x="650" y="230">接收缓冲区</text><rect fill="#dde" height="22" rx="4" width="180" x="560" y="240"></rect><rect fill="#4a90d9" height="22" rx="4 0 0 4" width="110" x="560" y="240"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="615" y="256">已占用（待应用读取）</text><rect fill="#a8d5a2" height="22" rx="0 4 4 0" width="70" x="670" y="240"></rect><text fill="#fff" font-size="9" text-anchor="middle" x="705" y="256">空闲</text><line stroke="#4a90d9" stroke-dasharray="3,2" stroke-width="1.5" x1="670" x2="740" y1="265" y2="265"></line><text fill="#4a90d9" font-size="10" text-anchor="middle" x="705" y="277">← rwnd →</text><rect fill="#f0fff0" height="70" rx="8" stroke="#27ae60" stroke-width="1.5" width="190" x="555" y="295"></rect><text fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle" x="650" y="318">应用层消费</text><text fill="#555" font-size="11" text-anchor="middle" x="650" y="338">读取数据 → 缓冲区释放</text><text fill="#555" font-size="11" text-anchor="middle" x="650" y="354">→ rwnd 增大 → 通知发送方</text><rect fill="#fff8f0" height="100" rx="8" stroke="#4a90d9" stroke-dasharray="5,3" stroke-width="1.5" width="190" x="555" y="375"></rect><text fill="#4a90d9" font-size="11" font-weight="bold" text-anchor="middle" x="650" y="397">流量控制循环</text><text fill="#555" font-size="10" text-anchor="middle" x="650" y="415">缓冲区满 → rwnd → 0</text><text fill="#555" font-size="10" text-anchor="middle" x="650" y="431">→ 发送方暂停</text><text fill="#555" font-size="10" text-anchor="middle" x="650" y="447">应用读取 → rwnd 恢复</text><text fill="#555" font-size="10" text-anchor="middle" x="650" y="463">→ 发送方继续</text><rect fill="#fafafa" height="460" rx="10" stroke="#aaa" stroke-dasharray="6,3" stroke-width="1.5" width="190" x="305" y="30"></rect><text fill="#666" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="58">网络</text><circle cx="400" cy="100" fill="#27ae60" opacity=".7" r="8"></circle><circle cx="400" cy="130" fill="#27ae60" opacity=".5" r="8"></circle><circle cx="400" cy="160" fill="#27ae60" opacity=".3" r="8"></circle><text fill="#666" font-size="10" text-anchor="middle" x="400" y="185">数据包</text><rect fill="#fff0f0" height="60" rx="6" stroke="#e74c3c" stroke-width="1.5" width="160" x="320" y="210"></rect><text fill="#e74c3c" font-size="11" font-weight="bold" text-anchor="middle" x="400" y="232">拥塞信号</text><text fill="#555" font-size="10" text-anchor="middle" x="400" y="250">丢包 / 重复ACK</text><text fill="#555" font-size="10" text-anchor="middle" x="400" y="265">→ 反馈给发送方</text><circle cx="400" cy="330" fill="#f0a500" opacity=".7" r="8"></circle><circle cx="400" cy="355" fill="#f0a500" opacity=".5" r="8"></circle><circle cx="400" cy="380" fill="#f0a500" opacity=".3" r="8"></circle><text fill="#666" font-size="10" text-anchor="middle" x="400" y="405">ACK + rwnd</text><line marker-end="url(#arrow-orange)" stroke="#e67e22" stroke-width="2" x1="150" x2="150" y1="185" y2="208"></line><line marker-end="url(#arrow-green)" stroke="#27ae60" stroke-width="2" x1="270" x2="305" y1="260" y2="260"></line><text fill="#27ae60" font-size="9" text-anchor="middle" x="287" y="253">数据</text><line marker-end="url(#arrow-gold)" stroke="#f0a500" stroke-width="2" x1="530" x2="495" y1="370" y2="370"></line><line marker-end="url(#arrow-gold)" stroke="#f0a500" stroke-width="2" x1="305" x2="270" y1="370" y2="370"></line><text fill="#f0a500" font-size="9" text-anchor="middle" x="400" y="418">ACK 携带 rwnd</text><text fill="#4a90d9" font-size="10" text-anchor="middle" x="150" y="200">rwnd ↓</text><line marker-end="url(#arrow-red)" stroke="#e74c3c" stroke-dasharray="4,3" stroke-width="1.5" x1="320" x2="270" y1="240" y2="210"></line><line marker-end="url(#arrow-green2)" stroke="#27ae60" stroke-width="1.5" x1="650" x2="650" y1="262" y2="293"></line><defs><marker id="arrow-orange" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#e67e22"></path></marker><marker id="arrow-green" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#27ae60"></path></marker><marker id="arrow-green2" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#27ae60"></path></marker><marker id="arrow-gold" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#f0a500"></path></marker><marker id="arrow-red" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#e74c3c"></path></marker></defs><rect fill="none" height="0" width="740" x="30" y="500"></rect><rect fill="#27ae60" height="35" opacity=".15" rx="8" width="220" x="290" y="455"></rect><rect fill="none" height="35" rx="8" stroke="#27ae60" stroke-width="2" width="220" x="290" y="455"></rect><text fill="#27ae60" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="477">swnd = min(cwnd, rwnd)</text></svg>