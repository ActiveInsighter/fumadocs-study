<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="none" height="500" width="800"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">CSMA 载波监听多路访问</text><rect fill="var(--indigo-mid)" height="40" rx="20" stroke="var(--blue-deep)" stroke-width="2" width="600" x="100" y="200"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="225">共享通信介质 (总线/信道)</text><g id="deviceA"><rect fill="var(--red-deep)" height="60" rx="5" stroke="var(--red-deep)" stroke-width="2" width="80" x="50" y="120"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="90" y="140">设备 A</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="90" y="155">准备发送</text><path d="M90 180q0 10 10 20" fill="none" marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="3"></path><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="70" y="175">载波监听</text></g><g id="deviceB"><rect fill="var(--yellow-mid)" height="60" rx="5" stroke="var(--orange-mid)" stroke-width="2" width="80" x="200" y="280"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="240" y="300">设备 B</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="240" y="315">等待发送</text><path d="M240 280q0-25-20-40" fill="none" marker-end="url(#arrowhead)" stroke="var(--yellow-mid)" stroke-width="3"></path><text fill="var(--yellow-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="250" y="265">载波监听</text></g><g id="deviceC"><rect fill="var(--green-mid)" height="60" rx="5" stroke="var(--green-mid)" stroke-width="2" width="80" x="520" y="280"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="560" y="300">设备 C</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="560" y="315">等待发送</text><path d="M560 280q0-25 20-40" fill="none" marker-end="url(#arrowhead)" stroke="var(--green-mid)" stroke-width="3"></path><text fill="var(--green-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="540" y="265">载波监听</text></g><g id="deviceD"><rect fill="var(--purple-deep)" height="60" rx="5" stroke="var(--purple-deep)" stroke-width="2" width="80" x="670" y="120"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="710" y="140">设备 D</text><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="710" y="155">空闲状态</text><path d="M710 180q0 10-10 20" fill="none" marker-end="url(#arrowhead)" stroke="var(--purple-deep)" stroke-width="3"></path><text fill="var(--purple-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="720" y="175">载波监听</text></g><g id="dataFlow"><rect fill="var(--sky-soft)" height="30" rx="15" stroke="var(--indigo-mid)" stroke-width="2" width="100" x="150" y="205"></rect><text fill="var(--blue-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="200" y="225">数据传输中</text><circle cx="170" cy="220" fill="var(--indigo-mid)" r="3"><animate attributeName="cx" dur="2s" repeatCount="indefinite" values="170;230;170"></animate></circle><circle cx="190" cy="220" fill="var(--indigo-mid)" r="3"><animate attributeName="cx" begin=".3s" dur="2s" repeatCount="indefinite" values="190;250;190"></animate></circle><circle cx="210" cy="220" fill="var(--indigo-mid)" r="3"><animate attributeName="cx" begin=".6s" dur="2s" repeatCount="indefinite" values="210;270;210"></animate></circle></g><g id="explanation"><rect fill="var(--neutral-soft)" height="80" rx="5" stroke="var(--indigo-light)" stroke-width="2" width="320" x="50" y="380"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="210" y="400">载波监听 (Carrier Sense)</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="60" y="420">• 发送前检测信道是否空闲</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="60" y="435">• 如果有数据传输，等待</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="60" y="450">• 避免冲突，提高传输效率</text><rect fill="var(--neutral-soft)" height="80" rx="5" stroke="var(--indigo-light)" stroke-width="2" width="320" x="430" y="380"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="590" y="400">多路访问 (Multiple Access)</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="440" y="420">• 多个设备共享同一介质</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="440" y="435">• 任何设备都可尝试发送</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="440" y="450">• 提供公平的访问机会</text></g><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="75">工作原理: 监听 → 判断 → 发送/等待</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--blue-ink)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><g id="status"><circle cx="130" cy="100" fill="var(--red-deep)" r="8"></circle><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="150" y="105">准备发送</text><circle cx="350" cy="100" fill="var(--yellow-mid)" r="8"></circle><text fill="var(--yellow-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="370" y="105">等待中</text><circle cx="550" cy="100" fill="var(--indigo-mid)" r="8"></circle><text fill="var(--indigo-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="570" y="105">传输中</text><circle cx="720" cy="100" fill="var(--neutral-mid)" r="8"></circle><text fill="var(--neutral-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="740" y="105">空闲</text></g></svg>