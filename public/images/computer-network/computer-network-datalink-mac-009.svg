<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect fill="none" height="500" width="800"></rect><text fill="#2c3e50" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">CSMA 载波监听多路访问</text><rect fill="#3498db" height="40" rx="20" stroke="#2980b9" stroke-width="2" width="600" x="100" y="200"></rect><text fill="#fff" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="225">共享通信介质 (总线/信道)</text><g id="deviceA"><rect fill="#e74c3c" height="60" rx="5" stroke="#c0392b" stroke-width="2" width="80" x="50" y="120"></rect><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="90" y="140">设备 A</text><text fill="#fff" font-family="Arial" font-size="10" text-anchor="middle" x="90" y="155">准备发送</text><path d="M90 180q0 10 10 20" fill="none" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="3"></path><text fill="#e74c3c" font-family="Arial" font-size="10" x="70" y="175">载波监听</text></g><g id="deviceB"><rect fill="#f39c12" height="60" rx="5" stroke="#e67e22" stroke-width="2" width="80" x="200" y="280"></rect><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="240" y="300">设备 B</text><text fill="#fff" font-family="Arial" font-size="10" text-anchor="middle" x="240" y="315">等待发送</text><path d="M240 280q0-25-20-40" fill="none" marker-end="url(#arrowhead)" stroke="#f39c12" stroke-width="3"></path><text fill="#f39c12" font-family="Arial" font-size="10" x="250" y="265">载波监听</text></g><g id="deviceC"><rect fill="#27ae60" height="60" rx="5" stroke="#229954" stroke-width="2" width="80" x="520" y="280"></rect><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="560" y="300">设备 C</text><text fill="#fff" font-family="Arial" font-size="10" text-anchor="middle" x="560" y="315">等待发送</text><path d="M560 280q0-25 20-40" fill="none" marker-end="url(#arrowhead)" stroke="#27ae60" stroke-width="3"></path><text fill="#27ae60" font-family="Arial" font-size="10" x="540" y="265">载波监听</text></g><g id="deviceD"><rect fill="#9b59b6" height="60" rx="5" stroke="#8e44ad" stroke-width="2" width="80" x="670" y="120"></rect><text fill="#fff" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" x="710" y="140">设备 D</text><text fill="#fff" font-family="Arial" font-size="10" text-anchor="middle" x="710" y="155">空闲状态</text><path d="M710 180q0 10-10 20" fill="none" marker-end="url(#arrowhead)" stroke="#9b59b6" stroke-width="3"></path><text fill="#9b59b6" font-family="Arial" font-size="10" x="720" y="175">载波监听</text></g><g id="dataFlow"><rect fill="#e8f4fd" height="30" rx="15" stroke="#3498db" stroke-width="2" width="100" x="150" y="205"></rect><text fill="#2980b9" font-family="Arial" font-size="12" text-anchor="middle" x="200" y="225">数据传输中</text><circle cx="170" cy="220" fill="#3498db" r="3"><animate attributeName="cx" dur="2s" repeatCount="indefinite" values="170;230;170"></animate></circle><circle cx="190" cy="220" fill="#3498db" r="3"><animate attributeName="cx" begin=".3s" dur="2s" repeatCount="indefinite" values="190;250;190"></animate></circle><circle cx="210" cy="220" fill="#3498db" r="3"><animate attributeName="cx" begin=".6s" dur="2s" repeatCount="indefinite" values="210;270;210"></animate></circle></g><g id="explanation"><rect fill="#ecf0f1" height="80" rx="5" stroke="#bdc3c7" stroke-width="2" width="320" x="50" y="380"></rect><text fill="#2c3e50" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" x="210" y="400">载波监听 (Carrier Sense)</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="60" y="420">• 发送前检测信道是否空闲</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="60" y="435">• 如果有数据传输，等待</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="60" y="450">• 避免冲突，提高传输效率</text><rect fill="#ecf0f1" height="80" rx="5" stroke="#bdc3c7" stroke-width="2" width="320" x="430" y="380"></rect><text fill="#2c3e50" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" x="590" y="400">多路访问 (Multiple Access)</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="440" y="420">• 多个设备共享同一介质</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="440" y="435">• 任何设备都可尝试发送</text><text fill="#2c3e50" font-family="Arial" font-size="12" x="440" y="450">• 提供公平的访问机会</text></g><text fill="#34495e" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="75">工作原理: 监听 → 判断 → 发送/等待</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#2c3e50" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><g id="status"><circle cx="130" cy="100" fill="#e74c3c" r="8"></circle><text fill="#e74c3c" font-family="Arial" font-size="11" x="150" y="105">准备发送</text><circle cx="350" cy="100" fill="#f39c12" r="8"></circle><text fill="#f39c12" font-family="Arial" font-size="11" x="370" y="105">等待中</text><circle cx="550" cy="100" fill="#3498db" r="8"></circle><text fill="#3498db" font-family="Arial" font-size="11" x="570" y="105">传输中</text><circle cx="720" cy="100" fill="#95a5a6" r="8"></circle><text fill="#95a5a6" font-family="Arial" font-size="11" x="740" y="105">空闲</text></g></svg>