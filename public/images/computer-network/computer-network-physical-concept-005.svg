<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="none" height="600" width="800"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="30">奈奎斯特定理</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="400" y="55">无噪声理想信道的极限传输速率</text><rect fill="var(--indigo-mid)" height="60" opacity=".1" rx="10" width="300" x="250" y="80"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="105">C = 2W × log₂V</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="125">信道容量 = 2×带宽 × 每码元比特数</text><g><rect fill="var(--red-deep)" height="80" opacity=".1" rx="8" width="160" x="50" y="170"></rect><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="130" y="190">C</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="130" y="210">信道容量</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="130" y="225">最大传输速率</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="130" y="240">(bps)</text><rect fill="var(--yellow-mid)" height="80" opacity=".1" rx="8" width="160" x="230" y="170"></rect><text fill="var(--yellow-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="310" y="190">W</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="310" y="210">信道带宽</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="225">频率范围</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="310" y="240">(Hz)</text><rect fill="var(--purple-deep)" height="80" opacity=".1" rx="8" width="160" x="410" y="170"></rect><text fill="var(--purple-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="490" y="190">V</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="490" y="210">离散电平数</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="490" y="225">每码元状态数</text><rect fill="var(--green-mid)" height="80" opacity=".1" rx="8" width="160" x="590" y="170"></rect><text fill="var(--green-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="670" y="190">2W</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="670" y="210">波特率</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="670" y="225">每秒码元数</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="670" y="240">(Baud)</text></g><g><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="285">信号电平示例</text><g><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="150" y="315">二进制 (V=2)</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="150" y="400">log₂2 = 1 bit/码元</text><g fill="none" stroke="var(--red-deep)" stroke-width="2"><path d="M80 350h20V340h40v10h40V340h40"></path><circle cx="100" cy="340" fill="var(--red-deep)" r="2"></circle><circle cx="140" cy="340" fill="var(--red-deep)" r="2"></circle><circle cx="180" cy="340" fill="var(--red-deep)" r="2"></circle><circle cx="100" cy="350" fill="var(--red-deep)" r="2"></circle><circle cx="140" cy="350" fill="var(--red-deep)" r="2"></circle><circle cx="180" cy="350" fill="var(--red-deep)" r="2"></circle></g><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="90" y="375">0</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="130" y="375">1</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="170" y="375">0</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="210" y="375">1</text></g><g><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="400" y="315">四进制 (V=4)</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="400">log₂4 = 2 bits/码元</text><g fill="none" stroke="var(--yellow-mid)" stroke-width="2"><path d="M330 360h20V340h40v10h40V330h40"></path><circle cx="350" cy="340" fill="var(--yellow-mid)" r="2"></circle><circle cx="390" cy="350" fill="var(--yellow-mid)" r="2"></circle><circle cx="430" cy="330" fill="var(--yellow-mid)" r="2"></circle><circle cx="350" cy="360" fill="var(--yellow-mid)" r="2"></circle></g><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="340" y="375">00</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="380" y="375">01</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="420" y="375">10</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="460" y="375">11</text></g><g><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="650" y="315">八进制 (V=8)</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="650" y="400">log₂8 = 3 bits/码元</text><g fill="none" stroke="var(--purple-deep)" stroke-width="2"><path d="M580 365h20V325h40v20h40V335h40"></path><circle cx="600" cy="325" fill="var(--purple-deep)" r="2"></circle><circle cx="640" cy="345" fill="var(--purple-deep)" r="2"></circle><circle cx="680" cy="335" fill="var(--purple-deep)" r="2"></circle><circle cx="600" cy="365" fill="var(--purple-deep)" r="2"></circle></g><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="590" y="380">000</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="630" y="380">111</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="670" y="380">101</text><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="710" y="380">110</text></g></g><rect fill="var(--neutral-soft)" height="120" rx="10" width="700" x="50" y="420"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="400" y="445">定理要点</text><g fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)"><circle cx="80" cy="465" fill="var(--indigo-mid)" r="3"></circle><text x="95" y="470">理想条件：无噪声干扰、带宽有限的低通信道</text><circle cx="80" cy="485" fill="var(--indigo-mid)" r="3"></circle><text x="95" y="490">避免码间串扰：相邻码元不互相干扰的最大传输速率</text><circle cx="80" cy="505" fill="var(--indigo-mid)" r="3"></circle><text x="95" y="510">带宽限制：即使无噪声，带宽仍限制传输能力</text><circle cx="80" cy="525" fill="var(--indigo-mid)" r="3"></circle><text x="95" y="530">优化策略：增加带宽(W)或提高调制电平数(V)可提升传输速率</text></g><text fill="var(--neutral-mid)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="400" y="570">奈奎斯特定理为无噪声信道提供了理论极限，实际应用中还需考虑香农定理(有噪声情况)</text></svg>