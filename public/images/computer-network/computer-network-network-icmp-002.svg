<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif"><style>.title{font-weight:700;fill:#2c3e50}.root{fill:#2c3e50}.err{fill:#e74c3c}.qry{fill:#27ae60}.sub{fill:#ecf0f1;stroke:#34495e;stroke-width:1.2}.label{font-size:13px;fill:#2c3e50}.label-w{font-size:14px;fill:#fff;font-weight:700}.desc{font-size:11px;fill:#7f8c8d}.edge{stroke:#95a5a6;stroke-width:1.5;fill:none}</style><text x="450" y="30" text-anchor="middle" font-size="20" class="title">ICMP 消息类型分类</text><rect x="380" y="55" width="140" height="44" rx="8" class="root"/><text x="450" y="83" text-anchor="middle" class="label-w">ICMP 消息</text><path d="M450 99q-230 31-230 51" class="edge"/><path d="M450 99q230 31 230 51" class="edge"/><rect x="120" y="150" width="200" height="42" rx="8" class="err"/><text x="220" y="177" text-anchor="middle" class="label-w">差错报文 (Error)</text><rect x="580" y="150" width="200" height="42" rx="8" class="qry"/><text x="680" y="177" text-anchor="middle" class="label-w">查询报文 (Query)</text><g><path d="M220 192v23H60v20" class="edge"/><path d="M220 192v23H165v20" class="edge"/><path d="M220 192v23h55v20" class="edge"/><path d="M220 192v23H385v20" class="edge"/><path d="M220 215V320H60v20" class="edge"/><rect x="20" y="235" width="100" height="60" rx="6" class="sub"/><text x="70" y="255" text-anchor="middle" class="label" font-weight="bold">终点不可达</text><text x="70" y="273" text-anchor="middle" class="desc">Type 3</text><text x="70" y="287" text-anchor="middle" class="desc">网络/主机/端口</text><rect x="125" y="235" width="100" height="60" rx="6" class="sub"/><text x="175" y="255" text-anchor="middle" class="label" font-weight="bold">源点抑制</text><text x="175" y="273" text-anchor="middle" class="desc">Type 4</text><text x="175" y="287" text-anchor="middle" class="desc">网络拥塞</text><rect x="230" y="235" width="100" height="60" rx="6" class="sub"/><text x="280" y="255" text-anchor="middle" class="label" font-weight="bold">路由重定向</text><text x="280" y="273" text-anchor="middle" class="desc">Type 5</text><text x="280" y="287" text-anchor="middle" class="desc">告知更优路径</text><rect x="335" y="235" width="100" height="60" rx="6" class="sub"/><text x="385" y="255" text-anchor="middle" class="label" font-weight="bold">超时</text><text x="385" y="273" text-anchor="middle" class="desc">Type 11</text><text x="385" y="287" text-anchor="middle" class="desc">TTL=0 / 分片超时</text><rect x="20" y="340" width="100" height="60" rx="6" class="sub"/><text x="70" y="360" text-anchor="middle" class="label" font-weight="bold">参数错误</text><text x="70" y="378" text-anchor="middle" class="desc">Type 12</text><text x="70" y="392" text-anchor="middle" class="desc">IP 头字段错</text></g><g><path d="M680 192v23H530v20" class="edge"/><path d="M680 192v23h0v20" class="edge"/><path d="M680 192v23H830v20" class="edge"/><rect x="480" y="235" width="100" height="60" rx="6" class="sub"/><text x="530" y="253" text-anchor="middle" class="label" font-weight="bold">Echo</text><text x="530" y="270" text-anchor="middle" class="desc">Req=8 / Rep=0</text><text x="530" y="285" text-anchor="middle" class="desc">ping 工具</text><rect x="630" y="235" width="100" height="60" rx="6" class="sub"/><text x="680" y="253" text-anchor="middle" class="label" font-weight="bold">Timestamp</text><text x="680" y="270" text-anchor="middle" class="desc">Type 13/14</text><text x="680" y="285" text-anchor="middle" class="desc">时间同步</text><rect x="780" y="235" width="100" height="60" rx="6" class="sub"/><text x="830" y="253" text-anchor="middle" class="label" font-weight="bold">Address Mask</text><text x="830" y="270" text-anchor="middle" class="desc">Type 17/18</text><text x="830" y="285" text-anchor="middle" class="desc">子网掩码查询</text></g><rect x="60" y="430" width="780" height="100" fill="#ecf0f1" rx="8"/><text x="80" y="455" font-size="14" font-weight="bold" fill="#2c3e50">两类报文的对比</text><text x="80" y="478" class="label">• 差错报文：被动触发，由路由器/主机在<tspan font-weight="bold" fill="#e74c3c">出错</tspan>时回送给源主机</text><text x="80" y="498" class="label">• 查询报文：主动发起，用于<tspan font-weight="bold" fill="#27ae60">诊断</tspan>网络可达性、时延、配置信息</text><text x="80" y="518" class="label">• 应用层工具：<tspan font-weight="bold">ping</tspan>= Echo Request/Reply ；<tspan font-weight="bold">traceroute</tspan>= TTL 递增触发 Time Exceeded</text></svg>