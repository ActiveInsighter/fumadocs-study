<svg xmlns="http://www.w3.org/2000/svg" font-family="var(--svg-font-family-mono)" viewBox="0 0 820 560" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><style>.title{font-family: var(--svg-font-family);font-weight: var(--svg-font-weight-bold)}.label{font-family: var(--svg-font-family)}.step{fill:var(--blue-ink)}.data{fill:var(--blue-ink)}.gen{fill:var(--red-deep)}.xor{fill:var(--mint-mid)}.rem{fill:var(--green-mid);font-weight: var(--svg-font-weight-bold)}.quot{fill:var(--blue-deep);font-weight: var(--svg-font-weight-bold)}.bar{stroke:var(--ink-soft);stroke-width:1}.note{fill:var(--ink-soft);font-size: var(--svg-font-size-caption);font-family: var(--svg-font-family)}</style><text class="title" fill="var(--blue-ink)" font-size="var(--svg-font-size-title)" text-anchor="middle" x="410" y="28">CRC 模 2 除法校验过程（接收方）</text><text class="note" text-anchor="middle" x="410" y="48">接收数据 101000110101110，使用同一生成多项式 110101 进行模 2 除法</text><g transform="translate(40,68)"><rect fill="var(--red-deep)" height="14" opacity=".85" width="14"></rect><text class="label" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="20" y="12">生成多项式（除数）</text><rect fill="var(--mint-mid)" height="14" opacity=".85" width="14" x="170"></rect><text class="label" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="190" y="12">异或结果</text><rect fill="var(--green-mid)" height="14" opacity=".85" width="14" x="280"></rect><text class="label" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="300" y="12">最终余数（应为 0）</text><rect fill="var(--blue-deep)" height="14" opacity=".85" width="14" x="430"></rect><text class="label" fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="450" y="12">商 (不参与判断)</text></g><g font-size="var(--svg-font-size-title)"><text class="quot" x="250" y="115">商：1 1 0 1 0 1 0 1 1</text></g><g font-size="var(--svg-font-size-body)" transform="translate(120,135)"><text class="gen" x="0" y="0">110101</text><text fill="var(--blue-ink)" x="60" y="0">)</text><text class="data" x="80" y="0">1 0 1 0 0 0 1 1 0 1 0 1 1 1 0</text><line class="bar" x1="80" x2="430" y1="6" y2="6"></line><text class="gen" x="80" y="28">1 1 0 1 0 1</text><line class="bar" x1="80" x2="200" y1="34" y2="34"></line><text class="xor" x="95" y="56">1 1 1 0 1 1</text><text class="gen" x="95" y="78">1 1 0 1 0 1</text><line class="bar" x1="95" x2="215" y1="84" y2="84"></line><text class="xor" x="125" y="106">1 1 1 0 1 0</text><text class="gen" x="125" y="128">1 1 0 1 0 1</text><line class="bar" x1="125" x2="245" y1="134" y2="134"></line><text class="xor" x="155" y="156">1 1 1 1 1 0</text><text class="gen" x="155" y="178">1 1 0 1 0 1</text><line class="bar" x1="155" x2="275" y1="184" y2="184"></line><text class="xor" x="185" y="206">1 0 1 1 1 1</text><text class="gen" x="185" y="228">1 1 0 1 0 1</text><line class="bar" x1="185" x2="305" y1="234" y2="234"></line><text class="xor" x="200" y="256">1 1 0 1 0 1</text><text class="gen" x="200" y="278">1 1 0 1 0 1</text><line class="bar" x1="200" x2="320" y1="284" y2="284"></line><text class="rem" x="245" y="306">0 0 0 0 0</text></g><g fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)"><g transform="translate(560,135)"><text fill="var(--blue-ink)" font-weight="var(--svg-font-weight-bold)" y="0">步骤说明</text><circle cx="6" cy="22" fill="var(--red-deep)" r="4"></circle><text x="18" y="26">用同一生成多项式按位异或</text><circle cx="6" cy="46" fill="var(--mint-mid)" r="4"></circle><text x="18" y="50">异或结果右移一位继续除</text><circle cx="6" cy="70" fill="var(--blue-deep)" r="4"></circle><text x="18" y="74">商不用于判断，只看最终余数</text><circle cx="6" cy="94" fill="var(--green-mid)" r="4"></circle><text x="18" y="98">余数 = 0 表示校验通过</text><text fill="var(--blue-ink)" font-weight="var(--svg-font-weight-bold)" x="0" y="130">判断规则</text><text x="0" y="150">余数 = 0：数据帧未被破坏 ✓</text><text x="0" y="168">余数 ≠ 0：传输中发生错误 ✗</text><text fill="var(--ink-soft)" x="0" y="190">（接收方与发送方使用相同多项式）</text></g></g><rect fill="var(--green-mid)" height="60" opacity=".1" rx="6" width="660" x="80" y="470"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" text-anchor="middle" x="410" y="495">最终余数为<tspan fill="var(--green-mid)" font-weight="var(--svg-font-weight-bold)">0</tspan>，校验通过</text><text class="data" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="410" y="518">101000110101110 ÷ 110101 → 余数 =<tspan fill="var(--green-mid)">0</tspan></text></svg>