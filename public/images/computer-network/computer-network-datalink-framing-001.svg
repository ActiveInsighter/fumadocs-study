<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350"><rect fill="none" height="350" width="600"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="300" y="30">数据链路层组帧</text><rect fill="#3498db" height="40" stroke="#2980b9" stroke-width="2" width="120" x="50" y="70"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="110" y="95">网络层报文</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="110" y="125">(Packet)</text><path d="M180 90h40" fill="none" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="2"></path><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="200" y="85">组帧</text><g transform="translate(240, 70)"><rect fill="#e67e22" height="40" stroke="#d35400" stroke-width="2" width="60" x="0" y="0"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="30" y="25">帧头</text><rect fill="#3498db" height="40" stroke="#2980b9" stroke-width="2" width="120" x="60" y="0"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="120" y="25">数据</text><rect fill="#e67e22" height="40" stroke="#d35400" stroke-width="2" width="60" x="180" y="0"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="210" y="25">帧尾</text></g><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="390" y="125">帧 (Frame)</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="50" y="180">帧定界示例：</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" x="50" y="210">发送端：</text><g transform="translate(120, 195)"><rect fill="#e67e22" height="25" width="20" x="0" y="0"></rect><rect fill="#3498db" height="25" width="60" x="20" y="0"></rect><rect fill="#e67e22" height="25" width="20" x="80" y="0"></rect><rect fill="#e67e22" height="25" width="20" x="110" y="0"></rect><rect fill="#27ae60" height="25" width="60" x="130" y="0"></rect><rect fill="#e67e22" height="25" width="20" x="190" y="0"></rect><rect fill="#e67e22" height="25" width="20" x="220" y="0"></rect><rect fill="#9b59b6" height="25" width="60" x="240" y="0"></rect><rect fill="#e67e22" height="25" width="20" x="300" y="0"></rect></g><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="270" y="240">帧1 帧2 帧3</text><path d="M3e2 250v30" fill="none" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="2"></path><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="10" x="320" y="270">传输</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" x="50" y="310">接收端：</text><g transform="translate(120, 295)"><rect fill="#ecf0f1" height="25" stroke="#bdc3c7" stroke-width="1" width="320" x="0" y="0"></rect><line stroke="#e74c3c" stroke-width="2" x1="20" x2="20" y1="0" y2="25"></line><line stroke="#e74c3c" stroke-width="2" x1="100" x2="100" y1="0" y2="25"></line><line stroke="#e74c3c" stroke-width="2" x1="130" x2="130" y1="0" y2="25"></line><line stroke="#e74c3c" stroke-width="2" x1="210" x2="210" y1="0" y2="25"></line><line stroke="#e74c3c" stroke-width="2" x1="240" x2="240" y1="0" y2="25"></line><line stroke="#e74c3c" stroke-width="2" x1="320" x2="320" y1="0" y2="25"></line><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="60" y="17">帧1</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="170" y="17">帧2</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="280" y="17">帧3</text></g><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="280" y="340">通过帧头/帧尾进行帧定界</text><g transform="translate(450, 180)"><rect fill="#fff" height="120" rx="5" stroke="#bdc3c7" stroke-width="1