<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><rect fill="none" height="350" width="600"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-title)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="300" y="30">数据链路层组帧</text><rect fill="var(--indigo-mid)" height="40" stroke="var(--blue-deep)" stroke-width="2" width="120" x="50" y="70"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="110" y="95">网络层报文</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="110" y="125">(Packet)</text><path d="M180 90h40" fill="none" marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="2"></path><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="200" y="85">组帧</text><g transform="translate(240, 70)"><rect fill="var(--orange-mid)" height="40" stroke="var(--coral-deep)" stroke-width="2" width="60" x="0" y="0"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="30" y="25">帧头</text><rect fill="var(--indigo-mid)" height="40" stroke="var(--blue-deep)" stroke-width="2" width="120" x="60" y="0"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="120" y="25">数据</text><rect fill="var(--orange-mid)" height="40" stroke="var(--coral-deep)" stroke-width="2" width="60" x="180" y="0"></rect><text fill="var(--surface)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="210" y="25">帧尾</text></g><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="390" y="125">帧 (Frame)</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-body)" font-weight="var(--svg-font-weight-bold)" x="50" y="180">帧定界示例：</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="50" y="210">发送端：</text><g transform="translate(120, 195)"><rect fill="var(--orange-mid)" height="25" width="20" x="0" y="0"></rect><rect fill="var(--indigo-mid)" height="25" width="60" x="20" y="0"></rect><rect fill="var(--orange-mid)" height="25" width="20" x="80" y="0"></rect><rect fill="var(--orange-mid)" height="25" width="20" x="110" y="0"></rect><rect fill="var(--green-mid)" height="25" width="60" x="130" y="0"></rect><rect fill="var(--orange-mid)" height="25" width="20" x="190" y="0"></rect><rect fill="var(--orange-mid)" height="25" width="20" x="220" y="0"></rect><rect fill="var(--purple-deep)" height="25" width="60" x="240" y="0"></rect><rect fill="var(--orange-mid)" height="25" width="20" x="300" y="0"></rect></g><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="270" y="240">帧1 帧2 帧3</text><path d="M3e2 250v30" fill="none" marker-end="url(#arrowhead)" stroke="var(--red-deep)" stroke-width="2"></path><text fill="var(--red-deep)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="320" y="270">传输</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" x="50" y="310">接收端：</text><g transform="translate(120, 295)"><rect fill="var(--neutral-soft)" height="25" stroke="var(--indigo-light)" stroke-width="1" width="320" x="0" y="0"></rect><line stroke="var(--red-deep)" stroke-width="2" x1="20" x2="20" y1="0" y2="25"></line><line stroke="var(--red-deep)" stroke-width="2" x1="100" x2="100" y1="0" y2="25"></line><line stroke="var(--red-deep)" stroke-width="2" x1="130" x2="130" y1="0" y2="25"></line><line stroke="var(--red-deep)" stroke-width="2" x1="210" x2="210" y1="0" y2="25"></line><line stroke="var(--red-deep)" stroke-width="2" x1="240" x2="240" y1="0" y2="25"></line><line stroke="var(--red-deep)" stroke-width="2" x1="320" x2="320" y1="0" y2="25"></line><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="60" y="17">帧1</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="170" y="17">帧2</text><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="280" y="17">帧3</text></g><text fill="var(--ink-soft)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" text-anchor="middle" x="280" y="340">通过帧头/帧尾进行帧定界</text><g transform="translate(450, 180)"><rect fill="var(--surface)" height="120" rx="5" stroke="var(--indigo-light)" stroke-width="1" width="140" x="0" y="0"></rect><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-label)" font-weight="var(--svg-font-weight-bold)" text-anchor="middle" x="70" y="20">关键概念</text><circle cx="15" cy="40" fill="var(--orange-mid)" r="3"></circle><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="25" y="45">帧头/帧尾：标识边界</text><circle cx="15" cy="60" fill="var(--indigo-mid)" r="3"></circle><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="25" y="65">数据：网络层报文</text><circle cx="15" cy="80" fill="var(--red-deep)" r="3"></circle><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="25" y="85">帧定界：区分帧边界</text><circle cx="15" cy="100" fill="var(--green-mid)" r="3"></circle><text fill="var(--blue-ink)" font-family="var(--svg-font-family)" font-size="var(--svg-font-size-caption)" x="25" y="105">组帧：添加控制信息</text></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="var(--red-deep)" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>