<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 780" width="100%"><title>分组转发流程图</title><desc>路由器分组转发流程：接收解析、最长前缀匹配、默认路由处理、TTL 处理、必要的分片/NAT，以及转发或丢弃。</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path d="M2 1 8 5 2 9" fill="none" stroke="context-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></marker><style>.box{stroke-width:.8;rx:8}.start{fill:#f1efe8;stroke:#5f5e5a}.route{fill:#eeedfe;stroke:#534ab7}.ok{fill:#e1f5ee;stroke:#0f6e56}.drop{fill:#fcebeb;stroke:#a32d2d}.diamond{fill:#fff;stroke:#8a8882;stroke-width:.8}.line{fill:none;stroke:#898781;stroke-width:1.5;marker-end:url(#arrow)}.text{font-family:-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;fill:#444441}.title{font-size:14px;font-weight:600}.sub{font-size:12px;font-weight:400;fill:#5f5e5a}.label{font-size:12px;fill:#52514e}.note{font-size:11px;fill:#6c6a65}</style></defs><rect class="box start" height="56" rx="8" width="260" x="250" y="30"></rect><text class="text title" dominant-baseline="central" text-anchor="middle" x="380" y="52">① 接收和解析数据包</text><text class="text sub" dominant-baseline="central" text-anchor="middle" x="380" y="70">提取目的 IP、TTL 等字段</text><line class="line" x1="380" x2="380" y1="86" y2="118"></line><rect class="box route" height="56" rx="8" width="300" x="230" y="118"></rect><text class="text title" dominant-baseline="central" text-anchor="middle" x="380" y="140">② 查询路由表</text><text class="text sub" dominant-baseline="central" text-anchor="middle" x="380" y="158">对目的 IP 执行最长前缀匹配（LPM）</text><line class="line" x1="380" x2="380" y1="174" y2="206"></line><polygon class="diamond" points="380,206 485,245 380,284 275,245"></polygon><text class="text label" dominant-baseline="central" text-anchor="middle" x="380" y="239">是否匹配到</text><text class="text label" dominant-baseline="central" text-anchor="middle" x="380" y="255">具体路由？</text><line class="line" x1="275" x2="185" y1="245" y2="245"></line><text class="text label" text-anchor="middle" x="230" y="235">否</text><polygon class="diamond" points="105,206 200,245 105,284 10,245"></polygon><text class="text label" dominant-baseline="central" text-anchor="middle" x="105" y="239">是否存在</text><text class="text label" dominant-baseline="central" text-anchor="middle" x="105" y="255">默认路由？</text><text class="text note" text-anchor="middle" x="105" y="276">0.0.0.0/0</text><line class="line" x1="105" x2="105" y1="284" y2="333"></line><text class="text label" x="122" y="310">否</text><rect class="box drop" height="52" rx="8" width="124" x="43" y="333"></rect><text class="text title" dominant-baseline="central" fill="#791f1f" text-anchor="middle" x="105" y="354">丢弃</text><text class="text sub" dominant-baseline="central" fill="#a32d2d" text-anchor="middle" x="105" y="373">ICMP 不可达</text><path class="line" d="M2e2 245c45 0 45 70 125 70"></path><text class="text label" x="235" y="260">是，走默认路由</text><line class="line" x1="380" x2="380" y1="284" y2="333"></line><text class="text label" x="398" y="310">是</text><rect class="box route" height="56" rx="8" width="290" x="235" y="333"></rect><text class="text title" dominant-baseline="central" text-anchor="middle" x="380" y="355">选定出接口 / 下一跳</text><text class="text sub" dominant-baseline="central" text-anchor="middle" x="380" y="373">具体路由优先于默认路由</text><line class="line" x1="380" x2="380" y1="389" y2="421"></line><rect class="box ok" height="56" rx="8" width="280" x="240" y="421"></rect><text class="text title" dominant-baseline="central" text-anchor="middle" x="380" y="443">③ TTL 减 1</text><text class="text sub" dominant-baseline="central" text-anchor="middle" x="380" y="461">防止环路无限转发</text><line class="line" x1="380" x2="380" y1="477" y2="509"></line><polygon class="diamond" points="380,509 485,548 380,587 275,548"></polygon><text class="text label" dominant-baseline="central" text-anchor="middle" x="380" y="552">TTL = 0 ？</text><line class="line" x1="275" x2="167" y1="548" y2="548"></line><text class="text label" text-anchor="middle" x="220" y="538">是</text><rect class="box drop" height="52" rx="8" width="124" x="43" y="522"></rect><text class="text title" dominant-baseline="central" fill="#791f1f" text-anchor="middle" x="105" y="543">丢弃</text><text class="text sub" dominant-baseline="central" fill="#a32d2d" text-anchor="middle" x="105" y="562">ICMP 超时</text><line class="line" x1="380" x2="380" y1="587" y2="619"></line><text class="text label" x="398" y="606">否</text><rect class="box ok" height="56" rx="8" width="320" x="220" y="619"></rect><text class="text title" dominant-baseline="central" text-anchor="middle" x="380" y="641">④ 其他字段处理</text><text class="text sub" dominant-baseline="central" text-anchor="middle" x="380" y="659">必要时分片 / NAT / 更新校验和</text><text class="text note" text-anchor="middle" x="380" y="690">注：IPv4 路由器通常只分片，不负责最终重组</text><line class="line" x1="380" x2="380" y1="675" y2="717"></line><rect class="box route" height="56" rx="8" width="290" x="235" y="717"></rect><text class="text title" dominant-baseline="central" text-anchor="middle" x="380" y="739">⑤ 转发数据包</text><text class="text sub" dominant-baseline="central" text-anchor="middle" x="380" y="757">发往下一跳或目标设备</text></svg>