<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Arial, sans-serif"><style>.title{font-weight:700;fill:#2c3e50}.ua{fill:#3498db}.server{fill:#16a085}.label-w{fill:#fff;font-size:14px;font-weight:700}.push{stroke:#c0392b;stroke-width:2.5;fill:none}.pull-req{stroke:#2980b9;stroke-width:2;stroke-dasharray:6 4;fill:none}.pull-resp{stroke:#2980b9;stroke-width:2.5;fill:none}.anno{font-size:12px;fill:#2c3e50}.badge-push{fill:#c0392b}.badge-pull{fill:#2980b9}.desc{font-size:11px;fill:#7f8c8d}</style><text x="440" y="28" text-anchor="middle" font-size="20" class="title">SMTP 推送 / POP3 拉取 — 邮件传递时序</text><g><rect x="40" y="60" width="140" height="46" rx="6" class="ua"/><text x="110" y="89" text-anchor="middle" class="label-w">发送方 UA</text><rect x="240" y="60" width="160" height="46" rx="6" class="server"/><text x="320" y="89" text-anchor="middle" class="label-w">发送方邮件服务器</text><rect x="460" y="60" width="160" height="46" rx="6" class="server"/><text x="540" y="89" text-anchor="middle" class="label-w">接收方邮件服务器</text><rect x="680" y="60" width="140" height="46" rx="6" class="ua"/><text x="750" y="89" text-anchor="middle" class="label-w">接收方 UA</text><line x1="110" y1="106" x2="110" y2="430" stroke="#bdc3c7" stroke-dasharray="3 3"/><line x1="320" y1="106" x2="320" y2="430" stroke="#bdc3c7" stroke-dasharray="3 3"/><line x1="540" y1="106" x2="540" y2="430" stroke="#bdc3c7" stroke-dasharray="3 3"/><line x1="750" y1="106" x2="750" y2="430" stroke="#bdc3c7" stroke-dasharray="3 3"/></g><g><line x1="110" y1="150" x2="320" y2="150" class="push" marker-end="url(#redArrow)"/><text x="215" y="142" text-anchor="middle" class="anno" font-weight="bold" fill="#c0392b">① SMTP 推送 (端口 25/587)</text><text x="215" y="166" text-anchor="middle" class="desc">UA 主动把邮件提交给本方服务器</text></g><g><line x1="320" y1="220" x2="540" y2="220" class="push" marker-end="url(#redArrow)"/><text x="430" y="212" text-anchor="middle" class="anno" font-weight="bold" fill="#c0392b">② SMTP 推送 (端口 25)</text><text x="430" y="236" text-anchor="middle" class="desc">服务器间继续主动推送，直到目标服务器</text></g><rect x="490" y="252" width="100" height="22" rx="4" fill="#fef5e7" stroke="#e67e22"/><text x="540" y="268" text-anchor="middle" class="anno" fill="#a04000">入站邮箱缓存</text><g><line x1="750" y1="320" x2="540" y2="320" class="pull-req" marker-end="url(#blueArrow)"/><text x="645" y="312" text-anchor="middle" class="anno" font-weight="bold" fill="#2980b9">③ POP3 请求 (端口 110/995)</text><text x="645" y="336" text-anchor="middle" class="desc">UA 主动询问 "有没有新邮件？"</text></g><g><line x1="540" y1="390" x2="750" y2="390" class="pull-resp" marker-end="url(#blueArrow)"/><text x="645" y="382" text-anchor="middle" class="anno" font-weight="bold" fill="#2980b9">④ POP3 下载邮件</text><text x="645" y="406" text-anchor="middle" class="desc">服务器把邮件返回给 UA（默认下载后删除）</text></g><g transform="translate(40,440)"><line x1="0" y1="0" x2="40" y2="0" class="push" marker-end="url(#redArrow)"/><text x="48" y="4" class="anno">SMTP 推送 (Push)：主动发送方</text><line x1="280" y1="0" x2="320" y2="0" class="pull-req" marker-end="url(#blueArrow)"/><text x="328" y="4" class="anno">POP3 拉取 (Pull)：主动接收方</text><text x="0" y="24" class="anno" fill="#7f8c8d">UA = 用户代理；IMAP 行为类似 POP3 但保留服务器副本</text></g><defs><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c0392b"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2980b9"/></marker></defs></svg>