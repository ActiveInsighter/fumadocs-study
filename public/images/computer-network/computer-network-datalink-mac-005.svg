<svg xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif" viewBox="0 0 700 580"><defs><style>.h{font-size:15px;font-weight:700;fill:#212529}.lbl{font-size:13px;fill:#343a40}.sub{font-size:12px;fill:#868e96}.val{font-size:12px;font-weight:700}.big{font-size:24px;font-weight:700}.axis{font-size:11px;fill:#868e96}.pos{fill:#2f9e44}.neg{fill:#e03131}.wave{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.grid{stroke:#dee2e6;stroke-width:1;stroke-dasharray:3 3}.base{stroke:#ced4da;stroke-width:1;stroke-dasharray:4 3}</style><marker id="ar" markerHeight="7" markerWidth="9" orient="auto" refX="8" refY="3.5"><polygon fill="#495057" points="0 0, 9 3.5, 0 7"></polygon></marker></defs><rect fill="#e6f4ea" height="14" rx="2" stroke="#2f9e44" width="14" x="530" y="20"></rect><text class="val pos" x="550" y="31">+1</text><rect fill="#fdeaea" height="14" rx="2" stroke="#e03131" width="14" x="590" y="20"></rect><text class="val neg" x="610" y="31">−1</text><text class="h" x="40" y="58">① 比特时间与码片 (chip)</text><path d="M120 82V76H560v6" fill="none" stroke="#adb5bd" stroke-width="1.2"></path><text class="sub" text-anchor="middle" x="340" y="70">1 个比特时间</text><rect fill="#f1f3f5" height="46" stroke="#adb5bd" width="440" x="120" y="90"></rect><line stroke="#adb5bd" x1="230" x2="230" y1="90" y2="136"></line><line stroke="#adb5bd" x1="340" x2="340" y1="90" y2="136"></line><line stroke="#adb5bd" x1="450" x2="450" y1="90" y2="136"></line><text class="lbl" text-anchor="middle" x="175" y="118">码片 1</text><text class="lbl" text-anchor="middle" x="285" y="118">码片 2</text><text class="lbl" text-anchor="middle" x="395" y="118">码片 3</text><text class="lbl" text-anchor="middle" x="505" y="118">码片 4</text><text class="sub" x="120" y="162">1 个比特时间被划分为 m 个短时间槽，每个称为一个码片；码片是 CDMA 的最小时间单位（本例 m = 4）。</text><text class="h" x="40" y="212">② 码片序列 S（每个站点唯一）</text><text class="lbl" font-weight="bold" x="100" y="252">S =</text><g><rect fill="#e6f4ea" height="42" rx="3" stroke="#2f9e44" width="64" x="130" y="230"></rect><text class="val pos" text-anchor="middle" x="162" y="257">+1</text><rect fill="#fdeaea" height="42" rx="3" stroke="#e03131" width="64" x="202" y="230"></rect><text class="val neg" text-anchor="middle" x="234" y="257">−1</text><rect fill="#fdeaea" height="42" rx="3" stroke="#e03131" width="64" x="274" y="230"></rect><text class="val neg" text-anchor="middle" x="306" y="257">−1</text><rect fill="#e6f4ea" height="42" rx="3" stroke="#2f9e44" width="64" x="346" y="230"></rect><text class="val pos" text-anchor="middle" x="378" y="257">+1</text></g><text class="sub" x="430" y="248">每个站点分配一个唯一的码片序列，</text><text class="sub" x="430" y="264">不同站点的序列相互正交。</text><text class="h" x="40" y="322">③ 如何用码片序列表示比特 0 和 1</text><rect fill="#e6f4ea" height="46" rx="4" stroke="#2f9e44" stroke-width="1.5" width="46" x="55" y="345"></rect><text class="big pos" text-anchor="middle" x="78" y="378">1</text><text class="sub" text-anchor="middle" x="78" y="408">比特 1</text><line marker-end="url(#ar)" stroke="#495057" stroke-width="1.5" x1="108" x2="140" y1="368" y2="368"></line><text class="lbl" x="150" y="360">发送原码片序列</text><text class="lbl pos" font-weight="bold" x="150" y="380">S = (+1, −1, −1, +1)</text><line class="base" x1="370" x2="650" y1="368" y2="368"></line><line class="grid" x1="440" x2="440" y1="350" y2="410"></line><line class="grid" x1="510" x2="510" y1="350" y2="410"></line><line class="grid" x1="580" x2="580" y1="350" y2="410"></line><text class="axis" text-anchor="end" x="360" y="354">+1</text><text class="axis" text-anchor="end" x="360" y="410">−1</text><path class="wave" d="M370 350h70v36H580V350h70" stroke="#2f9e44"></path><text class="val pos" text-anchor="middle" x="405" y="345">+1</text><text class="val neg" text-anchor="middle" x="475" y="400">−1</text><text class="val neg" text-anchor="middle" x="545" y="400">−1</text><text class="val pos" text-anchor="middle" x="615" y="345">+1</text><rect fill="#fdeaea" height="46" rx="4" stroke="#e03131" stroke-width="1.5" width="46" x="55" y="455"></rect><text class="big neg" text-anchor="middle" x="78" y="488">0</text><text class="sub" text-anchor="middle" x="78" y="518">比特 0</text><line marker-end="url(#ar)" stroke="#495057" stroke-width="1.5" x1="108" x2="140" y1="478" y2="478"></line><text class="lbl" x="150" y="470">发送反码（各码片取反）</text><text class="lbl neg" font-weight="bold" x="150" y="490">S̄ = (−1, +1, +1, −1)</text><line class="base" x1="370" x2="650" y1="478" y2="478"></line><line class="grid" x1="440" x2="440" y1="460" y2="520"></line><line class="grid" x1="510" x2="510" y1="460" y2="520"></line><line class="grid" x1="580" x2="580" y1="460" y2="520"></line><text class="axis" text-anchor="end" x="360" y="464">+1</text><text class="axis" text-anchor="end" x="360" y="520">−1</text><path class="wave" d="M370 496h70V460H580v36h70" stroke="#e03131"></path><text class="val neg" text-anchor="middle" x="405" y="510">−1</text><text class="val pos" text-anchor="middle" x="475" y="455">+1</text><text class="val pos" text-anchor="middle" x="545" y="455">+1</text><text class="val neg" text-anchor="middle" x="615" y="510">−1</text><text class="sub" x="150" y="552">口诀：发 1 就发原序列，发 0 就发反码；比特 0/1 被“扩展”成一串 ±1 码片再送入信道。</text></svg>