<svg xmlns="http://www.w3.org/2000/svg" font-family="var(--svg-font-family)" viewBox="0 0 880 520" preserveAspectRatio="xMidYMid meet" style="font-family: var(--svg-font-family); color: var(--ink); max-width: 100%; height: auto;"><style>.title{font-weight: var(--svg-font-weight-bold);fill:var(--blue-ink)}.node{fill:var(--neutral-soft);stroke:var(--blue-ink);stroke-width:1.5}.nodeX{fill:var(--red-deep);stroke:var(--red-deep);stroke-width:1.5}.link{stroke:var(--blue-ink);stroke-width:2}.dead{stroke:var(--red-deep);stroke-width:3;stroke-dasharray:6 5}.lbl{font-size: var(--svg-font-size-body);fill:var(--blue-ink)}.stage{font-weight: var(--svg-font-weight-bold);fill:var(--blue-ink);font-size: var(--svg-font-size-label)}.arrow{fill:var(--blue-deep)}.hop{font-size: var(--svg-font-size-label);fill:var(--blue-ink)}.bad{font-size: var(--svg-font-size-label);fill:var(--red-deep);font-weight: var(--svg-font-weight-bold)}</style><text class="title" font-size="var(--svg-font-size-title)" text-anchor="middle" x="440" y="28">RIP 坏消息传得慢 — 计数到无穷 (count to infinity)</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-label)" text-anchor="middle" x="440" y="50">拓扑：A — B — C — X，初始所有节点都能到达 X</text><g transform="translate(0,70)"><text class="stage" x="20" y="20">阶段 1：链路正常</text><g transform="translate(40,40)"><circle class="node" cx="40" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="40" y="45">A</text><circle class="node" cx="140" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="140" y="45">B</text><circle class="node" cx="240" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="240" y="45">C</text><circle class="node" cx="340" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="340" y="45">X</text><line class="link" x1="62" x2="118" y1="40" y2="40"></line><line class="link" x1="162" x2="218" y1="40" y2="40"></line><line class="link" x1="262" x2="318" y1="40" y2="40"></line><text class="hop" text-anchor="middle" x="40" y="90">到 X：3 跳</text><text class="hop" text-anchor="middle" x="140" y="90">到 X：2 跳</text><text class="hop" text-anchor="middle" x="240" y="90">到 X：1 跳</text></g><text class="stage" x="470" y="20">阶段 2：C—X 断开，C 设为 16</text><g transform="translate(490,40)"><circle class="node" cx="40" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="40" y="45">A</text><circle class="node" cx="140" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="140" y="45">B</text><circle class="nodeX" cx="240" cy="40" r="22"></circle><text class="lbl" fill="var(--surface)" text-anchor="middle" x="240" y="45">C</text><circle class="node" cx="340" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="340" y="45">X</text><line class="link" x1="62" x2="118" y1="40" y2="40"></line><line class="link" x1="162" x2="218" y1="40" y2="40"></line><line class="dead" x1="262" x2="318" y1="40" y2="40"></line><text class="bad" text-anchor="middle" x="290" y="28">✗ 断开</text><text class="hop" text-anchor="middle" x="40" y="90">仍认为 3 跳</text><text class="hop" text-anchor="middle" x="140" y="90">仍认为 2 跳</text><text class="bad" text-anchor="middle" x="240" y="90">到 X：16 (不可达)</text></g></g><g transform="translate(0,260)"><text class="stage" x="20" y="20">阶段 3：B 听 A 说"我能 3 跳到 X"，B 更新为 4</text><g transform="translate(40,40)"><circle class="node" cx="40" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="40" y="45">A</text><circle class="node" cx="140" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="140" y="45">B</text><circle class="nodeX" cx="240" cy="40" r="22"></circle><text class="lbl" fill="var(--surface)" text-anchor="middle" x="240" y="45">C</text><circle class="node" cx="340" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="340" y="45">X</text><line class="link" x1="62" x2="118" y1="40" y2="40"></line><line class="link" x1="162" x2="218" y1="40" y2="40"></line><line class="dead" x1="262" x2="318" y1="40" y2="40"></line><path d="M62 30q38-25 76 0" fill="none" marker-end="url(#a1)" stroke="var(--blue-deep)" stroke-width="1.5"></path><text class="hop" fill="var(--blue-deep)" text-anchor="middle" x="100" y="5">"我 3 跳到 X"</text><text class="hop" text-anchor="middle" x="40" y="90">到 X：3 跳 (经 B)</text><text class="bad" text-anchor="middle" x="140" y="90">B 更新：4 跳 (经 A)</text></g><text class="stage" x="470" y="20">阶段 4：A、B 互相加 1 直到 16</text><g transform="translate(490,40)"><circle class="node" cx="40" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="40" y="45">A</text><circle class="node" cx="140" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="140" y="45">B</text><circle class="nodeX" cx="240" cy="40" r="22"></circle><text class="lbl" fill="var(--surface)" text-anchor="middle" x="240" y="45">C</text><circle class="node" cx="340" cy="40" r="22"></circle><text class="lbl" text-anchor="middle" x="340" y="45">X</text><line class="link" x1="62" x2="118" y1="40" y2="40"></line><line class="link" x1="162" x2="218" y1="40" y2="40"></line><line class="dead" x1="262" x2="318" y1="40" y2="40"></line><path d="M62 30q38-25 76 0" fill="none" marker-end="url(#a1)" stroke="var(--blue-deep)" stroke-width="1.5"></path><path d="M138 50q-38 25-76 0" fill="none" marker-end="url(#a1)" stroke="var(--blue-deep)" stroke-width="1.5"></path><text class="hop" fill="var(--blue-deep)" text-anchor="middle" x="100" y="0">"我 5 跳到 X"</text><text class="hop" fill="var(--blue-deep)" text-anchor="middle" x="100" y="92">"我 6 跳到 X"</text></g></g><g transform="translate(60,440)"><text class="stage" x="0" y="0">A、B 跳数演化：</text><text fill="var(--blue-ink)" font-size="var(--svg-font-size-label)" x="0" y="22">3 → 4 → 5 → 6 → 7 → ... → 15 →<tspan fill="var(--red-deep)" font-weight="var(--svg-font-weight-bold)">16 (不可达)</tspan>， 才停止</text><text fill="var(--ink-soft)" font-size="var(--svg-font-size-label)" x="0" y="44">RIP 周期 30s 广播一次，每周期才递增一次 → 收敛极慢，这就是 "坏消息传得慢"</text></g><defs><marker id="a1" markerHeight="6" markerWidth="6" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="var(--blue-deep)"></path></marker></defs></svg>