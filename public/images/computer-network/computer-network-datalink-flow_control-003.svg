<svg xmlns="http://www.w3.org/2000/svg" height="473pt" viewBox="0 0 1166 473.05" width="1166pt" xmlns:xlink="http://www.w3.org/1999/xlink"><g class="graph" id="graph0" transform="scale(1 1) rotate(0) translate(4 469.05)"><title>GBN_Protocol</title><g class="cluster" id="clust1"><title>cluster_sender</title><polygon fill="#add8e6" points="153,-84 153,-200 607,-200 607,-84 153,-84" stroke="#add8e6"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="380" y="-184.8">发送方 (Sender)</text></g><g class="cluster" id="clust2"><title>cluster_send_window</title><polygon fill="#e0ffff" points="161,-92 161,-169 599,-169 599,-92 161,-92" stroke="#e0ffff"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="380" y="-153.8">发送窗口 (W ≤ 2^n - 1)</text></g><g class="cluster" id="clust3"><title>cluster_receiver</title><polygon fill="#ffb6c1" points="8,-92 8,-169 145,-169 145,-92 8,-92" stroke="#ffb6c1"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="76.5" y="-153.8">接收方 (Receiver)</text></g><g class="cluster" id="clust4"><title>cluster_seq_space</title><polygon fill="#ffffe0" points="276,-229 276,-330.05 570,-330.05 570,-229 276,-229" stroke="#ffffe0"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="423" y="-314.85">序号空间 (n位二进制)</text></g><g class="node" id="node1"><title>frame0</title><polygon fill="#90ee90" points="503,-138 433,-138 433,-100 503,-100 503,-138" stroke="#000"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="468" y="-122.8">帧0</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="468" y="-107.8">(已发送)</text></g><g class="node" id="node8"><title>channel</title><polygon fill="#d3d3d3" points="379,-36 310.96,-18 379,0 447.04,-18 379,-36" stroke="#000"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="379" y="-14.3">传输信道</text></g><g class="edge" id="edge1"><title>frame0-&gt;channel</title><path d="M467.87-99.88C466.88-85.95 463.47-66.96 453-54 444.82-43.88 433.04-36.52 421.26-31.25" fill="none" stroke="blue"></path><polygon fill="blue" points="422.47,-27.96 411.89,-27.45 419.84,-34.45 422.47,-27.96" stroke="blue"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="481" y="-62.5">发送帧0</text></g><g class="node" id="node2"><title>frame1</title><polygon fill="#90ee90" points="415,-138 345,-138 345,-100 415,-100 415,-138" stroke="#000"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="380" y="-122.8">帧1</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="380" y="-107.8">(已发送)</text></g><g class="edge" id="edge2"><title>frame1-&gt;channel</title><path d="M363.76-99.64C358.64-92.72 353.64-84.46 351-76 348.09-66.67 347.76-63.23 351-54 352.68-49.2 355.33-44.58 358.34-40.35" fill="none" stroke="blue"></path><polygon fill="blue" points="361.28,-42.27 364.83,-32.29 355.83,-37.88 361.28,-42.27" stroke="blue"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="369" y="-62.5">发送帧1</text></g><g class="node" id="node3"><title>frame2</title><polygon fill="#90ee90" points="591,-138 521,-138 521,-100 591,-100 591,-138" stroke="#000"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="556" y="-122.8">帧2</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="556" y="-107.8">(已发送)</text></g><g class="edge" id="edge3"><title>frame2-&gt;channel</title><path d="M545.4-99.95C536.01-85.48 521.01-65.73 503-54c-21.15 13.77-47.73 22.2-70.86 27.32" fill="none" stroke="blue"></path><polygon fill="blue" points="432.63,-23.21 422.13,-24.61 431.21,-30.06 432.63,-23.21" stroke="blue"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="544" y="-62.5">发送帧2</text></g><g class="node" id="node4"><title>frame3</title><polygon fill="#ffffe0" points="327,-138 257,-138 257,-100 327,-100 327,-138" stroke="#000"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="292" y="-122.8">帧3</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="292" y="-107.8">(可发送)</text></g><g class="node" id="node5"><title>frame4</title><polygon fill="#ffffe0" points="239,-138 169,-138 169,-100 239,-100 239,-138" stroke="#000"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="204" y="-122.8">帧4</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="204" y="-107.8">(可发送)</text></g><g class="node" id="node6"><title>timer</title><ellipse cx="652" cy="-416.05" fill="orange" rx="82.05" ry="26.74" stroke="#000"></ellipse><text font-family="Times,serif" font-size="14" text-anchor="middle" x="652" y="-419.85">单一超时计时器</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="652" y="-404.85">(针对帧0)</text></g><g class="node" id="node12"><title>timeout_action</title><polygon fill="salmon" points="718.5,-294.53 579.5,-294.53 579.5,-241.53 724.5,-241.53 724.5,-288.53 718.5,-294.53" stroke="#000"></polygon><polyline fill="none" points="718.5,-294.53 718.5,-288.53" stroke="#000"></polyline><polyline fill="none" points="724.5,-288.53 718.5,-288.53" stroke="#000"></polyline><text font-family="Times,serif" font-size="14" text-anchor="middle" x="652" y="-279.33">超时触发:</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="652" y="-264.33">从最早未确认帧开始</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="652" y="-249.33">重传窗口内所有帧</text></g><g class="edge" id="edge7"><title>timer-&gt;timeout_action</title><path d="M652-388.95c0 23.36.0 57.84.0 83.83" fill="none" stroke="red"></path><polygon fill="red" points="655.5,-304.91 652,-294.91 648.5,-304.91 655.5,-304.91" stroke="red"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="672" y="-341.05">超时触发</text></g><g class="node" id="node7"><title>send_action</title><polygon fill="#b0c4de" points="946,-442.55 752,-442.55 752,-389.55 952,-389.55 952,-436.55 946,-442.55" stroke="#000"></polygon><polyline fill="none" points="946,-442.55 946,-436.55" stroke="#000"></polyline><polyline fill="none" points="952,-436.55 946,-436.55" stroke="#000"></polyline><text font-family="Times,serif" font-size="14" text-anchor="middle" x="852" y="-427.35">发送动作:</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="852" y="-412.35">• 依次发送窗口内帧</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="852" y="-397.35">• 为最早未确认帧启动计时器</text></g><g class="edge" id="edge6"><title>channel-&gt;frame0</title><path d="M383.25-35.09C387.29-47.63 394.48-64.76 406-76 412.26-82.12 416.48-79.51 424-84 428.87-86.91 433.82-90.27 438.56-93.73" fill="none" stroke="purple" stroke-dasharray="5,2"></path><polygon fill="purple" points="436.72,-96.72 446.8,-99.97 440.95,-91.14 436.72,-96.72" stroke="purple"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="427.5" y="-62.5">ACK确认</text></g><g class="node" id="node9"><title>recv_window</title><polygon fill="#f08080" points="137,-138 33,-138 33,-100 137,-100 137,-138" stroke="#000"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="85" y="-122.8">接收窗口 = 1</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="85" y="-107.8">期望序号: 0</text></g><g class="edge" id="edge4"><title>channel-&gt;recv_window</title><path d="M331.41-23.45C293.31-28.09 238.99-37.12 194-54c-26.79-10.05-54.56-26.46-75.37-40.15" fill="none" stroke="green"></path><polygon fill="green" points="116.52,-91.35 110.16,-99.82 120.42,-97.17 116.52,-91.35" stroke="green"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="209" y="-62.5">接收帧</text></g><g class="edge" id="edge5"><title>recv_window-&gt;channel</title><path d="M117.46-99.94C129.54-93.96 143.58-87.86 157-84 185.82-75.71 194.84-83 224-76c43.14 10.36 90.77 29.02 121.69 42.17" fill="none" stroke="purple"></path><polygon fill="purple" points="347.31,-36.95 355.11,-29.78 344.54,-30.52 347.31,-36.95" stroke="purple"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="316.5" y="-68">发送ACK</text><text font-family="Times,serif" font-size="10" text-anchor="middle" x="316.5" y="-57">(累计确认)</text></g><g class="node" id="node13"><title>sliding_action</title><polygon fill="#98fb98" points="217.5,-294.53 92.5,-294.53 92.5,-241.53 223.5,-241.53 223.5,-288.53 217.5,-294.53" stroke="#000"></polygon><polyline fill="none" points="217.5,-294.53 217.5,-288.53" stroke="#000"></polyline><polyline fill="none" points="223.5,-288.53 217.5,-288.53" stroke="#000"></polyline><text font-family="Times,serif" font-size="14" text-anchor="middle" x="158" y="-279.33">收到累计ACK:</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="158" y="-264.33">窗口向前滑动</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="158" y="-249.33">释放已确认帧位置</text></g><g class="edge" id="edge9"><title>recv_window-&gt;sliding_action</title><path d="M94.11-138.35c11.64-23.45 32.03-64.52 46.65-93.95" fill="none" stroke="green"></path><polygon fill="green" points="137.7,-234.02 145.28,-241.42 143.97,-230.9 137.7,-234.02" stroke="green"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="152" y="-211">正确接收</text></g><g class="node" id="node10"><title>recv_action</title><polygon fill="#ffe4e1" points="993.5,-294.53 742.5,-294.53 742.5,-241.53 999.5,-241.53 999.5,-288.53 993.5,-294.53" stroke="#000"></polygon><polyline fill="none" points="993.5,-294.53 993.5,-288.53" stroke="#000"></polyline><polyline fill="none" points="999.5,-288.53 993.5,-288.53" stroke="#000"></polyline><text font-family="Times,serif" font-size="14" text-anchor="middle" x="871" y="-279.33">接收动作:</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="871" y="-264.33">• 序号 = 期望序号 → 接受+ACK</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="871" y="-249.33">• 序号 ≠ 期望序号 → 丢弃+重发ACK</text></g><g class="node" id="node11"><title>seq_space</title><polygon fill="#ff0" points="561.61,-268.03 492.3,-299.08 353.7,-299.08 284.39,-268.03 353.7,-236.97 492.3,-236.97 561.61,-268.03" stroke="#000"></polygon><text font-family="Times,serif" font-size="14" text-anchor="middle" x="423" y="-271.83">序号范围: 0 到 2^n - 1</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="423" y="-256.83">最大窗口: W ≤ 2^n - 1</text></g><g class="edge" id="edge11"><title>seq_space-&gt;frame0</title><path d="M432.22-236.92c8 26.14 19.49 63.69 27.27 89.12" fill="none" stroke="#000" stroke-dasharray="1,5"></path><polygon fill="#000" points="462.9,-148.62 462.48,-138.03 456.21,-146.57 462.9,-148.62" stroke="#000"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="460" y="-211">序号约束</text></g><g class="edge" id="edge8"><title>timeout_action-&gt;frame0</title><path d="M599.61-241.34C591.06-237.19 582.29-232.96 574-229 546.55-215.89 534.2-220.8 512-2e2c-15.38 14.4-26.65 35.42-33.93 52.29" fill="none" stroke="red" stroke-dasharray="5,2"></path><polygon fill="red" points="481.26,-146.27 474.24,-138.33 474.78,-148.91 481.26,-146.27" stroke="red"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="584.5" y="-211">重传所有未确认帧</text></g><g class="edge" id="edge10"><title>sliding_action-&gt;frame0</title><path d="M223.56-243.5c15.74 5.19 32.59 10.36 48.44 14.5C280.32-226.83 417.04-205.05 424-2e2c17.37 12.62 28.67 34.27 35.47 51.87" fill="none" stroke="green" stroke-dasharray="5,2"></path><polygon fill="green" points="462.9,-148.93 462.96,-138.33 456.31,-146.58 462.9,-148.93" stroke="green"></polygon><text font-family="Times,serif" font-size="10" text-anchor="middle" x="409" y="-211">窗口滑动</text></g><g class="node" id="node14"><title>features</title><polygon fill="#fff" points="1152,-465.05 970,-465.05 970,-367.05 1158,-367.05 1158,-459.05 1152,-465.05" stroke="#000" stroke-dasharray="5,2"></polygon><polyline fill="none" points="1152,-465.05 1152,-459.05" stroke="#000" stroke-dasharray="5,2"></polyline><polyline fill="none" points="1158,-459.05 1152,-459.05" stroke="#000" stroke-dasharray="5,2"></polyline><text font-family="Times,serif" font-size="14" text-anchor="middle" x="1064" y="-449.85">GBN关键特性:</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="1064" y="-434.85">1. 发送窗口: W ≤ 2^n - 1</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="1064" y="-419.85">2. 接收窗口: 固定为1</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="1064" y="-404.85">3. 累计确认机制</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="1064" y="-389.85">4. 超时重传所有未确认帧</text><text font-family="Times,serif" font-size="14" text-anchor="middle" x="1064" y="-374.85">5. 序号不连续则丢弃</text></g></g></svg>